<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>黑洞吞噬：進化</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    
    html, body {
        width: 100%; height: 100%;
        background-color: #000; color: #fff; font-family: 'Orbitron', 'PingFang HK', sans-serif;
        overflow: hidden; position: fixed; /* 防止手機網址欄縮放導致黑屏 */
        touch-action: none;
    }

    .back-btn {
        position: absolute; top: 15px; left: 15px; z-index: 9999;
        padding: 8px 16px; background: rgba(10, 10, 20, 0.85);
        color: #c084fc; border: 2px solid #c084fc; border-radius: 8px;
        text-decoration: none; font-weight: bold; font-size: 14px;
        box-shadow: 0 0 10px rgba(192, 132, 252, 0.5); transition: all 0.2s;
        backdrop-filter: blur(5px);
    }
    .back-btn:hover { background: #c084fc; color: #000; }

    #hud {
        position: absolute; top: 0; left: 0; width: 100%; padding: 15px 20px;
        display: flex; justify-content: space-between; align-items: flex-start;
        z-index: 10; pointer-events: none;
    }
    .hud-box {
        background: rgba(0, 0, 0, 0.6); border: 1px solid #333;
        padding: 8px 12px; border-radius: 8px; backdrop-filter: blur(5px);
        display: flex; flex-direction: column; gap: 3px;
    }
    .hud-box span { font-size: 10px; color: #888; }
    .hud-box .val { font-size: 18px; font-weight: 900; color: #c084fc; text-shadow: 0 0 10px #c084fc; }
    #combo-text { color: #ff4757; font-size: 12px; display: none; font-weight: bold; animation: pulseRed 0.3s infinite alternate; }
    @keyframes pulseRed { 0% { opacity: 0.8; } 100% { opacity: 1; text-shadow: 0 0 10px #ff4757; } }

    #game-container {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        overflow: hidden; background: radial-gradient(circle at center, #0a0a20, #000);
    }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }

    /* 技能按鈕 */
    #skill-btn {
        position: absolute; bottom: 30px; right: 30px; z-index: 10;
        width: 80px; height: 80px; border-radius: 50%;
        background: rgba(192, 132, 252, 0.2); border: 2px solid #c084fc;
        color: #c084fc; font-weight: 900; font-size: 14px;
        display: flex; align-items: center; justify-content: center; flex-direction: column;
        box-shadow: 0 0 20px rgba(192, 132, 252, 0.4); cursor: pointer;
        transition: all 0.1s; touch-action: manipulation;
    }
    #skill-btn:active { transform: scale(0.9); }
    #skill-btn.cooldown { background: rgba(50, 50, 50, 0.8); border-color: #555; color: #555; box-shadow: none; }

    #start-screen, #end-screen {
        position: absolute; inset: 0; background: rgba(0, 0, 0, 0.85); z-index: 50;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; padding: 20px; backdrop-filter: blur(5px);
    }
    #end-screen { display: none; }
    h1 { font-size: 40px; color: #c084fc; text-shadow: 0 0 20px #c084fc; margin-bottom: 10px; }
    p { font-size: 14px; color: #ccc; margin-bottom: 30px; line-height: 1.6; }
    button {
        padding: 15px 40px; background: #c084fc; color: #000; border: none;
        border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer;
        box-shadow: 0 0 20px #c084fc; transition: all 0.2s; font-family: 'Orbitron', sans-serif;
    }
    button:hover { transform: scale(1.05); }

    @media (max-width: 600px) {
        h1 { font-size: 28px; }
        p { font-size: 12px; }
        #skill-btn { width: 70px; height: 70px; bottom: 20px; right: 20px; font-size: 12px; }
    }
</style>
</head>
<body>

    <a href="../" class="back-btn">⬅ 返回大廳</a>

    <div id="hud">
        <div class="hud-box">
            <span>🌌 質量 (分數)</span>
            <span class="val" id="score-val">0</span>
            <span id="combo-text">🔥 COMBO x2</span>
        </div>
        <div class="hud-box" style="text-align:right;">
            <span>⏳ 剩餘時間</span>
            <span class="val" id="time-val" style="color:#ffd32a; text-shadow:0 0 10px #ffd32a;">60s</span>
        </div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="skill-btn" onclick="useSkill()">
            <span>引力</span>
            <span id="skill-cd" style="font-size:10px;">準備</span>
        </div>
    </div>

    <div id="start-screen">
        <h1>黑洞吞噬</h1>
        <p>拖動滑鼠或手指移動。<br>吞噬比你細嘅物件變大，避開大黑洞！<br>撳「引力」或 <b>Space</b> 可吸入周圍物件。</p>
        <button onclick="startGame()">開始吞噬</button>
    </div>

    <div id="end-screen">
        <h1 id="end-title">宇宙毀滅</h1>
        <p id="end-stats"></p>
        <button onclick="location.reload()">再玩一次</button>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('score-val');
    const timeVal = document.getElementById('time-val');
    const comboText = document.getElementById('combo-text');
    const startScreen = document.getElementById('start-screen');
    const endScreen = document.getElementById('end-screen');
    const endTitle = document.getElementById('end-title');
    const endStats = document.getElementById('end-stats');
    const skillBtn = document.getElementById('skill-btn');
    const skillCd = document.getElementById('skill-cd');

    let W, H;
    // 修正手機畫面尺寸計算
    function resize() {
        W = canvas.parentElement.clientWidth;
        H = canvas.parentElement.clientHeight;
        canvas.width = W;
        canvas.height = H;
    }
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', resize);
    resize();

    // 音效
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        let now = audioCtx.currentTime;
        if (type === 'eat') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
            gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(); osc.stop(now + 0.1);
        } else if (type === 'die') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, now); osc.frequency.exponentialRampToValueAtTime(20, now + 0.5);
            gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.start(); osc.stop(now + 0.5);
        } else if (type === 'skill') {
            osc.type = 'square'; osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(800, now + 0.3);
            gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(); osc.stop(now + 0.3);
        }
    }

    // 遊戲狀態
    let player, objects, stars, particles;
    let mouseX = 0, mouseY = 0;
    let score, timeLeft, gameActive, gameLoopId;
    let shakeTime = 0;
    let playerAngle = 0;
    let comboCount = 0;
    let isFrenzy = false;
    let skillCooldown = 0;

    const OBJECT_TYPES = [
        { name: '微塵', minR: 2, maxR: 4, color: '#a4b0be', score: 1 },
        { name: '隕石', minR: 5, maxR: 10, color: '#8a8478', score: 5 },
        { name: '衛星', minR: 10, maxR: 15, color: '#00d2d3', score: 20 },
        { name: '星球', minR: 20, maxR: 30, color: '#2ed573', score: 100 },
        { name: '巨型恆星', minR: 40, maxR: 60, color: '#ff4757', score: 500 }
    ];

    function startGame() {
        resize(); // 確保啟動時尺寸正確
        startScreen.style.display = 'none';
        gameActive = true;
        score = 0;
        timeLeft = 60;
        shakeTime = 0;
        comboCount = 0;
        isFrenzy = false;
        skillCooldown = 0;
        
        player = { x: W/2, y: H/2, r: 10 };
        mouseX = W/2; mouseY = H/2;
        
        objects = [];
        particles = [];

        stars = [];
        for (let i = 0; i < 100; i++) {
            stars.push({ x: Math.random() * W, y: Math.random() * H, size: Math.random() * 2, alpha: Math.random() });
        }

        for (let i = 0; i < 40; i++) spawnObject();

        scoreVal.innerText = score;
        timeVal.innerText = timeLeft + 's';
        timeVal.style.color = '#ffd32a';
        updateSkillUI();

        if (gameLoopId) cancelAnimationFrame(gameLoopId);
        if (window.timerId) clearInterval(window.timerId);
        if (window.skillTimerId) clearInterval(window.skillTimerId);
        if (window.bossTimerId) clearInterval(window.bossTimerId);
        
        window.timerId = setInterval(() => {
            if (!gameActive) return;
            timeLeft--;
            timeVal.innerText = timeLeft + 's';
            if (timeLeft <= 10) timeVal.style.color = '#ff4757';
            if (timeLeft <= 0) endGame(true);
        }, 1000);

        window.bossTimerId = setInterval(() => {
            if (gameActive) spawnBoss();
        }, 15000);

        window.skillTimerId = setInterval(() => {
            if (skillCooldown > 0) {
                skillCooldown--;
                updateSkillUI();
            }
        }, 1000);

        function loop() {
            if (!gameActive) return;
            update();
            draw();
            gameLoopId = requestAnimationFrame(loop);
        }
        loop();
    }

    function spawnObject() {
        let type;
        let rand = Math.random();
        
        if (player.r < 20) {
            if (rand < 0.7) type = OBJECT_TYPES[0];
            else if (rand < 0.95) type = OBJECT_TYPES[1];
            else type = OBJECT_TYPES[2];
        } else if (player.r < 50) {
            if (rand < 0.3) type = OBJECT_TYPES[1];
            else if (rand < 0.7) type = OBJECT_TYPES[2];
            else if (rand < 0.95) type = OBJECT_TYPES[3];
            else type = OBJECT_TYPES[4];
        } else {
            if (rand < 0.2) type = OBJECT_TYPES[2];
            else if (rand < 0.6) type = OBJECT_TYPES[3];
            else type = OBJECT_TYPES[4];
        }

        let r = Math.random() * (type.maxR - type.minR) + type.minR;
        
        let x, y;
        if (Math.random() < 0.5) {
            x = Math.random() < 0.5 ? -r : W + r;
            y = Math.random() * H;
        } else {
            x = Math.random() * W;
            y = Math.random() < 0.5 ? -r : H + r;
        }

        let angle = Math.atan2(H/2 - y, W/2 - x);
        let speed = Math.random() * 1.5 + 0.5;

        objects.push({
            x: x, y: y, r: r,
            vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
            color: type.color, score: type.score,
            type: type.name, isBoss: false
        });
    }

    function spawnBoss() {
        let r = player.r * 1.5 + 20; 
        let x = Math.random() < 0.5 ? -r : W + r;
        let y = Math.random() < 0.5 ? -r : H + r;
        
        objects.push({
            x: x, y: y, r: r,
            vx: 0, vy: 0,
            color: '#ff0000', score: 1000,
            type: 'Boss黑洞', isBoss: true
        });
        
        playSound('skill');
    }

    function useSkill() {
        if (!gameActive || skillCooldown > 0) return;
        playSound('skill');
        shakeTime = 15;
        skillCooldown = 8;
        
        objects.forEach(obj => {
            let dx = player.x - obj.x;
            let dy = player.y - obj.y;
            let dist = Math.hypot(dx, dy);
            if (dist < 400) {
                obj.x += dx * 0.3;
                obj.y += dy * 0.3;
            }
        });

        for(let i=0; i<30; i++) {
            let a = (Math.PI * 2 / 30) * i;
            particles.push({
                x: player.x, y: player.y,
                vx: Math.cos(a) * 15, vy: Math.sin(a) * 15,
                life: 1, color: '#c084fc', size: 4
            });
        }
        
        updateSkillUI();
    }

    function updateSkillUI() {
        if (skillCooldown > 0) {
            skillBtn.classList.add('cooldown');
            skillCd.innerText = `${skillCooldown}s`;
        } else {
            skillBtn.classList.remove('cooldown');
            skillCd.innerText = '準備';
        }
    }

    function update() {
        if (shakeTime > 0) shakeTime--;
        playerAngle += 0.05;

        let currentSpeed = isFrenzy ? 0.2 : 0.1;
        player.x += (mouseX - player.x) * currentSpeed;
        player.y += (mouseY - player.y) * currentSpeed;

        // 限制黑洞唔好飛出畫面
        player.x = Math.max(player.r, Math.min(W - player.r, player.x));
        player.y = Math.max(player.r, Math.min(H - player.r, player.y));

        for (let i = objects.length - 1; i >= 0; i--) {
            let obj = objects[i];
            
            if (obj.isBoss) {
                let angle = Math.atan2(player.y - obj.y, player.x - obj.x);
                let speed = 1.5;
                obj.x += Math.cos(angle) * speed;
                obj.y += Math.sin(angle) * speed;
            } else {
                obj.x += obj.vx; obj.y += obj.vy;
            }

            if (!obj.isBoss && (obj.x < -300 || obj.x > W + 300 || obj.y < -300 || obj.y > H + 300)) {
                objects.splice(i, 1);
                spawnObject();
                continue;
            }

            let dist = Math.hypot(player.x - obj.x, player.y - obj.y);
            if (dist < player.r + obj.r) {
                if (player.r > obj.r * 1.1) {
                    player.r += (obj.r * 0.1);
                    let addScore = obj.score;
                    if (isFrenzy) addScore *= 2;
                    score += addScore;
                    scoreVal.innerText = score;
                    playSound('eat');
                    createParticles(obj.x, obj.y, obj.color);
                    objects.splice(i, 1);
                    if (!obj.isBoss) spawnObject();
                    shakeTime = 5;

                    comboCount++;
                    if (comboCount >= 10 && !isFrenzy) {
                        isFrenzy = true;
                        comboText.style.display = 'block';
                        setTimeout(() => { isFrenzy = false; comboText.style.display = 'none'; comboCount = 0; }, 5000);
                    }
                } else if (obj.r > player.r * 1.1) {
                    if (obj.isBoss) {
                        endGame(false, "你被宇宙大 Boss 吞噬了！");
                    } else {
                        endGame(false, "你被更大的黑洞反噬了。");
                    }
                    return;
                }
            }
        }

        if (comboCount > 0 && Math.random() < 0.005 && !isFrenzy) {
            comboCount = 0;
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy;
            p.life -= 0.02;
            if (p.life <= 0) particles.splice(i, 1);
        }
    }

    function createParticles(x, y, color) {
        for (let i = 0; i < 8; i++) {
            let angle = Math.random() * Math.PI * 2;
            let speed = Math.random() * 5 + 1;
            particles.push({
                x: x, y: y,
                vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                life: 1, color: color, size: Math.random() * 3 + 1
            });
        }
    }

    function draw() {
        // 用純黑色完全覆蓋背景，防止卡頓導致殘影全黑
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);

        ctx.save();
        if (shakeTime > 0) ctx.translate((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10);

        stars.forEach(s => {
            ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
            ctx.fillRect(s.x, s.y, s.size, s.size);
        });

        objects.forEach(obj => {
            ctx.beginPath();
            ctx.arc(obj.x, obj.y, obj.r, 0, Math.PI * 2);
            ctx.fillStyle = obj.color;
            ctx.shadowBlur = obj.isBoss ? 30 : 10;
            ctx.shadowColor = obj.color;
            ctx.fill();
            ctx.shadowBlur = 0;
            
            if (obj.isBoss) {
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 20px "Orbitron"';
                ctx.textAlign = 'center';
                ctx.fillText('BOSS', obj.x, obj.y - obj.r - 10);
            }
        });

        particles.forEach(p => {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
        });
        ctx.globalAlpha = 1;

        ctx.save();
        ctx.translate(player.x, player.y);
        
        let glowColor = isFrenzy ? '#ff4757' : '#c084fc';
        let grad = ctx.createRadialGradient(0, 0, player.r * 0.5, 0, 0, player.r * 1.8);
        grad.addColorStop(0, 'rgba(0, 0, 0, 1)');
        grad.addColorStop(0.4, glowColor);
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.beginPath(); ctx.arc(0, 0, player.r * 1.8, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();

        ctx.rotate(playerAngle);
        ctx.beginPath();
        ctx.ellipse(0, 0, player.r * 1.5, player.r * 0.5, 0, 0, Math.PI * 2);
        ctx.strokeStyle = glowColor;
        ctx.lineWidth = 2;
        ctx.shadowBlur = 15; ctx.shadowColor = glowColor;
        ctx.stroke();

        ctx.beginPath(); ctx.arc(0, 0, player.r, 0, Math.PI * 2);
        ctx.fillStyle = '#000';
        ctx.shadowBlur = 20;
        ctx.shadowColor = glowColor;
        ctx.fill();
        ctx.restore();

        ctx.restore();
    }

    function endGame(survived, reason) {
        gameActive = false;
        clearInterval(window.timerId);
        clearInterval(window.bossTimerId);
        clearInterval(window.skillTimerId);
        
        // 👇 記錄最高分到大廳排行榜 👇
        let highScore = parseInt(localStorage.getItem('blackHole_highscore') || '0');
        if (score > highScore) {
            localStorage.setItem('blackHole_highscore', score);
        }

        if (survived) {
            endTitle.innerText = "⏳ 時間到！";
            endTitle.style.color = "#ffd32a";
            endStats.innerText = `最終質量：${score}\n你成功喺宇宙中生存下來！`;
        } else {
            endTitle.innerText = "💀 宇宙毀滅";
            endTitle.style.color = "#ff4757";
            endStats.innerText = `最終質量：${score}\n${reason}`;
            playSound('die');
        }
        endScreen.style.display = 'flex';
    }

    // 控制事件 (支援手機同電腦)
    canvas.addEventListener('mousemove', e => {
        const rect = canvas.getBoundingClientRect();
        mouseX = e.clientX - rect.left;
        mouseY = e.clientY - rect.top;
    });

    canvas.addEventListener('touchstart', e => {
        const rect = canvas.getBoundingClientRect();
        mouseX = e.touches[0].clientX - rect.left;
        mouseY = e.touches[0].clientY - rect.top;
    }, {passive: true});

    canvas.addEventListener('touchmove', e => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        mouseX = e.touches[0].clientX - rect.left;
        mouseY = e.touches[0].clientY - rect.top;
    }, {passive: false});

    window.addEventListener('keydown', e => {
        if (e.code === 'Space') useSkill();
    });

</script>

<!-- 🟢 Firebase 在線統計 (已加入永久裝置 ID) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
    try {
        const firebaseConfig = { databaseURL: "https://maze-leaderboard-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        // 👇 綁定永久裝置 ID，防止刷新重複計算 👇
        let userId = localStorage.getItem('global_device_id');
        if (!userId) {
            userId = 'user_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('global_device_id', userId);
        }
        
        let pathParts = window.location.pathname.split('/').filter(p => p && p !== 'index.html');
        let gameId = pathParts[pathParts.length - 1] || 'unknown'; 
        const userStatusRef = db.ref('online_status/' + gameId + '/' + userId);
        
        db.ref('.info/connected').on('value', (snap) => {
            if (snap.val() === true) {
                userStatusRef.onDisconnect().remove();
                userStatusRef.set(true);
            }
        });
    } catch(e) { console.error("Firebase Error:", e); }
</script>
</body>
</html>
