<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🍳 茶餐廳大亨</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+HK:wght@700;900&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body {
            background-color: #0d0d0d; color: #fff; font-family: 'Noto Sans HK', sans-serif;
            height: 100dvh; height: 100vh; display: flex; flex-direction: column;
            overflow: hidden; touch-action: none;
            background: #111;
        }

        /* 霓虹燈牌背景特效 */
        .neon-bg {
            position: absolute; top: 10%; left: 50%; transform: translateX(-50%);
            font-family: 'Noto Sans HK', sans-serif; font-size: 40px; font-weight: 900;
            color: #fff; text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055, 0 0 40px #ff0055, 0 0 80px #ff0055;
            z-index: 0; pointer-events: none; opacity: 0.15; letter-spacing: 5px; white-space: nowrap;
            animation: neonFlicker 3s infinite alternate;
        }
        @keyframes neonFlicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 0.15; text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055, 0 0 40px #ff0055, 0 0 80px #ff0055; }
            20%, 24%, 55% { opacity: 0.05; text-shadow: none; }
        }

        /* 頂部 HUD */
        #hud {
            height: 60px; background: rgba(15, 15, 15, 0.9);
            border-bottom: 2px solid #ff0055; display: flex; align-items: center;
            justify-content: space-between; padding: 0 15px; z-index: 10;
            box-shadow: 0 4px 20px rgba(255, 0, 85, 0.3); flex-shrink: 0;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .back-btn {
            padding: 6px 12px; background: rgba(255, 0, 85, 0.1); color: #ff0055;
            border: 1px solid #ff0055; border-radius: 8px; text-decoration: none;
            font-family: 'Orbitron', sans-serif; font-weight: bold; font-size: 12px;
            transition: 0.2s; box-shadow: 0 0 10px rgba(255,0,85,0.2);
        }
        .back-btn:active { transform: scale(0.95); background: #ff0055; color: #000; }
        
        .stats { display: flex; gap: 15px; font-family: 'Orbitron', sans-serif; text-align: center; align-items: center; }
        .stat-box { display: flex; flex-direction: column; }
        .stat-label { font-size: 9px; color: #aaa; letter-spacing: 1px; }
        .stat-val { font-size: 18px; font-weight: 900; color: #ffd32a; text-shadow: 0 0 10px #ffd32a; }
        .stat-val.hp { color: #ff4757; text-shadow: 0 0 10px #ff4757; }
        .shop-btn {
            background: rgba(0, 210, 211, 0.1); border: 1px solid #00d2d3; color: #00d2d3;
            padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold;
            box-shadow: 0 0 10px rgba(0,210,211,0.2);
        }
        .shop-btn:active { background: #00d2d3; color: #000; }

        /* 客人區 */
        #customer-area {
            flex: 1; position: relative; display: flex; justify-content: center;
            align-items: flex-end; padding-bottom: 20px; overflow: hidden;
            background: 
                linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
                repeating-linear-gradient(45deg, #1a1a1a 25%, transparent 25%, transparent 75%, #1a1a1a 75%, #1a1a1a), 
                repeating-linear-gradient(45deg, #1a1a1a 25%, #111 25%, #111 75%, #1a1a1a 75%, #1a1a1a);
            background-position: 0 0, 0 0, 10px 10px;
            background-size: 20px 20px;
        }

        /* 單個客人容器 */
        .customer-container {
            position: relative; display: flex; flex-direction: column; align-items: center;
            transition: transform 0.3s; width: 110px;
        }
        .customer-container.angry { animation: shake 0.3s infinite; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

        /* 對話氣泡 (訂單) */
        .speech-bubble {
            background: #fff; color: #000; border-radius: 15px; padding: 8px 12px;
            font-weight: 900; font-size: 14px; position: relative; margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); border: 2px solid #ddd;
            text-align: center; min-width: 80px;
        }
        .speech-bubble::after {
            content: ''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%);
            border-width: 10px 10px 0; border-style: solid; border-color: #fff transparent transparent transparent;
        }
        .order-item { font-size: 16px; margin: 2px 0; display: block; }

        /* 客人外觀 */
        .customer-body {
            width: 80px; height: 100px; background: #3498db; border-radius: 40px 40px 10px 10px;
            position: relative; box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            border: 3px solid rgba(255,255,255,0.2);
        }
        .customer-face {
            width: 60px; height: 60px; background: #ffccaa; border-radius: 50%;
            position: absolute; top: -30px; left: 10px; border: 2px solid rgba(0,0,0,0.1);
        }
        .face-happy::before { content: '^ ^'; font-size: 20px; position: absolute; top: 15px; left: 10px; font-weight: bold; letter-spacing: 5px;}
        .face-neutral::before { content: 'o o'; font-size: 20px; position: absolute; top: 15px; left: 10px; font-weight: bold; letter-spacing: 5px;}
        .face-angry::before { content: '> <'; font-size: 20px; position: absolute; top: 15px; left: 10px; font-weight: bold; letter-spacing: 5px; color: #ff0055;}

        /* 耐心條 */
        .patience-bar-container {
            width: 80px; height: 8px; background: #333; border-radius: 4px; margin-top: 15px;
            overflow: hidden; border: 1px solid #000;
        }
        .patience-bar {
            height: 100%; width: 100%; background: #2ed573; transition: width 0.1s linear, background 0.3s;
        }

        /* 底部操作區 */
        #controls {
            height: 180px; background: rgba(20, 20, 20, 0.95);
            border-top: 4px solid #ff0055; display: flex; flex-direction: column;
            padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
            z-index: 20; flex-shrink: 0;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.8); border-radius: 20px 20px 0 0;
        }
        
        .tray-area {
            height: 40px; display: flex; justify-content: center; align-items: center;
            background: #000; border-radius: 10px; margin-bottom: 10px; border: 1px dashed #555;
            color: #aaa; font-size: 14px; font-weight: bold;
        }
        .tray-item { font-size: 20px; margin: 0 5px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }

        .menu-grid { display: flex; gap: 10px; flex: 1; }
        .menu-category { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .category-title { font-size: 10px; color: #888; text-align: center; font-weight: bold; }
        
        .menu-btn {
            flex: 1; background: linear-gradient(180deg, #333, #111); border: 1px solid #555;
            border-radius: 12px; color: #fff; font-size: 18px; font-weight: bold;
            display: flex; align-items: center; justify-content: center; gap: 5px;
            box-shadow: 0 4px 0 #000; transition: 0.1s; cursor: pointer;
        }
        .menu-btn:active { transform: translateY(4px); box-shadow: none; background: linear-gradient(180deg, #555, #333); }
        .menu-btn:disabled { opacity: 0.3; pointer-events: none; }

        .action-row { display: flex; gap: 10px; margin-top: 10px; height: 45px; }
        .btn-serve {
            flex: 2; background: linear-gradient(180deg, #2ed573, #27ae60); color: #fff;
            border: none; border-radius: 10px; font-size: 18px; font-weight: 900;
            box-shadow: 0 5px 0 #145a32; cursor: pointer; transition: 0.1s;
        }
        .btn-serve:active { transform: translateY(5px); box-shadow: none; }
        .btn-clear {
            flex: 1; background: linear-gradient(180deg, #ff4757, #c0392b); color: #fff;
            border: none; border-radius: 10px; font-size: 16px; font-weight: 900;
            box-shadow: 0 5px 0 #7b241c; cursor: pointer; transition: 0.1s;
        }
        .btn-clear:active { transform: translateY(5px); box-shadow: none; }

        /* 彈出視窗 */
        .modal {
            position: absolute; inset: 0; background: rgba(0, 0, 0, 0.85);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 30; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 20px; text-align: center;
        }
        .modal.active { display: flex; }
        .modal h2 { color: #ff0055; font-size: 28px; font-family: 'Orbitron', sans-serif; text-shadow: 0 0 20px #ff0055; margin-bottom: 15px; }
        .modal p { font-size: 14px; color: #ccc; line-height: 1.6; margin-bottom: 20px; }
        .modal button {
            padding: 14px 40px; background: linear-gradient(135deg, #ff0055, #ffd32a);
            color: #000; border: none; border-radius: 12px; font-family: 'Orbitron', sans-serif;
            font-size: 18px; font-weight: 900; cursor: pointer; box-shadow: 0 5px 0 #b3003b;
            margin-top: 10px;
        }
        .modal button:active { transform: translateY(5px); box-shadow: none; }

        /* 商店 */
        .shop-item {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.05); border: 1px solid #444;
            padding: 12px 15px; border-radius: 12px; margin-bottom: 12px; width: 100%; max-width: 350px;
        }
        .shop-info b { display: block; font-size: 14px; color: #fff; text-align: left; }
        .shop-info small { font-size: 11px; color: #aaa; display: block; text-align: left;}
        .buy-btn {
            padding: 8px 15px; background: linear-gradient(180deg, #2ed573, #27ae60); color: #000; 
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin: 0; font-size: 13px;
            box-shadow: 0 3px 0 #145a32; white-space: nowrap;
        }
        .buy-btn:disabled { background: #333; color: #666; box-shadow: none; cursor: not-allowed; }

        /* 特效字 */
        #status-text {
            position: absolute; top: 20%; left: 50%; transform: translate(-50%, -50%);
            font-size: 24px; font-weight: 900; color: #fff; text-shadow: 0 0 20px #ff0055;
            pointer-events: none; opacity: 0; transition: 0.3s; z-index: 25; text-align: center; width: 90%;
        }
        #status-text.show { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        
        /* 金幣特效 */
        .coin-anim {
            position: absolute; font-size: 20px; font-weight: 900; color: #ffd32a;
            text-shadow: 0 0 10px #ffd32a; pointer-events: none; z-index: 25;
            animation: floatUp 1s forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.5); }
        }
    </style>
</head>
<body>

    <div class="neon-bg">茶 餐 廳 大 亨</div>

    <div id="hud">
        <a href="../" class="back-btn">⬅ 大廳</a>
        <div class="stats">
            <div class="stat-box">
                <span class="stat-label">營業額</span>
                <span class="stat-val" id="money-val">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">聲譽 (HP)</span>
                <span class="stat-val hp" id="hp-val">100</span>
            </div>
            <button class="shop-btn" onclick="openShop()">🏪 升級</button>
        </div>
    </div>

    <div id="customer-area">
        <!-- 客人動態生成於此 -->
        <div id="status-text"></div>
    </div>

    <div id="controls">
        <div class="tray-area" id="tray">
            <!-- 托盤 -->
            點擊下方餐點加入托盤
        </div>
        
        <div class="menu-grid">
            <div class="menu-category">
                <div class="category-title">🍹 飲品</div>
                <button class="menu-btn" onclick="addToTray('凍檸茶', '🍹')">🍹 凍檸茶</button>
                <button class="menu-btn" onclick="addToTray('熱奶茶', '☕')">☕ 熱奶茶</button>
            </div>
            <div class="menu-category">
                <div class="category-title">🍞 食物</div>
                <button class="menu-btn" onclick="addToTray('西多士', '🍞')">🍞 西多士</button>
                <button class="menu-btn" onclick="addToTray('干炒牛河', '🍜')">🍜 乾炒牛河</button>
            </div>
        </div>

        <div class="action-row">
            <button class="btn-clear" onclick="clearTray()">🗑️ 清空</button>
            <button class="btn-serve" onclick="serveCustomer()">🍽️ 出餐</button>
        </div>
    </div>

    <!-- 開始畫面 -->
    <div id="intro-modal" class="modal active">
        <h2>🍳 茶餐廳大亨</h2>
        <p>體驗澳牛極速節奏！<br>喺客人發脾氣前，準確無誤咁出餐！<br>營業額越高，升級越快！</p>
        <button onclick="startGame()">開舖</button>
    </div>

    <!-- 商店畫面 -->
    <div id="shop-modal" class="modal">
        <h2>🏪 茶餐廳升級</h2>
        <div class="shop-item">
            <div class="shop-info"><b>❄️ 強力冷氣</b><small>客人耐心消耗減少 (Lv.<span id="lvl-ac">0</span>)</small></div>
            <button class="buy-btn" id="buy-ac" onclick="buyUpgrade('ac')">$300</button>
        </div>
        <div class="shop-item">
            <div class="shop-info"><b>👨‍🍳 資深伙記</b><small>出餐正確額外獎金增加 (Lv.<span id="lvl-staff">0</span>)</small></div>
            <button class="buy-btn" id="buy-staff" onclick="buyUpgrade('staff')">$500</button>
        </div>
        <button onclick="closeShop()" style="background:#444; color:#fff; box-shadow: 0 4px 0 #111; margin-top:10px;">關閉</button>
    </div>

    <!-- 遊戲結束 -->
    <div id="gameover" class="modal">
        <h2>執笠啦！</h2>
        <p>單日最高營業額：<span id="final-score" style="color:#ffd32a; font-weight:bold; font-size:24px;">0</span></p>
        <p style="font-size:12px; margin-top:5px;">歷史最高：<span id="best-score" style="color:#00d2d3;">0</span></p>
        <button onclick="retryCurrentLevel()">🔄 重試本日</button>
        <button onclick="backToLobby()" style="background:#444; color:#fff; box-shadow:0 4px 0 #111; margin-top:10px;">🏠 返回大廳</button>
    </div>

    <script>
        const moneyVal = document.getElementById('money-val');
        const hpVal = document.getElementById('hp-val');
        const customerArea = document.getElementById('customer-area');
        const statusText = document.getElementById('status-text');
        const trayEl = document.getElementById('tray');
        const gameoverScreen = document.getElementById('gameover');
        const introModal = document.getElementById('intro-modal');
        const shopModal = document.getElementById('shop-modal');

        // 遊戲參數與狀態
        let totalMoney = parseInt(localStorage.getItem('chaChaanTeng_money') || '0');
        let upgrades = JSON.parse(localStorage.getItem('chaChaanTeng_upgrades') || '{"ac":0,"staff":0}');
        let bestScore = parseInt(localStorage.getItem('chaChaanTeng_best') || '0');
        
        let state = 'menu'; 
        let currentDayMoney = 0;
        let hp = 100;
        let gameTimer = null;
        let spawnTimer = null;
        let customers = [];
        let tray = [];
        let customerIdCounter = 0;

        // 隨機名字
        const NAMES = ['陳生', '李太', '張小姐', '王叔', '呀明', '阿珍', '劉經理', '黃師傅'];
        const SHIRTS = ['#e74c3c', '#3498db', '#9b59b6', '#1abc9c', '#f1c40f', '#e67e22'];
        
        // 音效 (用 Web Audio API 生成)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                if (type === 'click') { osc.type = 'triangle'; osc.frequency.setValueAtTime(600, audioCtx.currentTime); gain.gain.setValueAtTime(0.05, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1); osc.start(); osc.stop(audioCtx.currentTime + 0.1); }
                else if (type === 'success') { osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime); osc.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.1); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3); osc.start(); osc.stop(audioCtx.currentTime + 0.3); }
                else if (type === 'fail') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, audioCtx.currentTime); osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.3); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3); osc.start(); osc.stop(audioCtx.currentTime + 0.3); }
            } catch (e) { console.error(e); }
        }

        function startGame() {
            introModal.classList.remove('active');
            state = 'playing';
            currentDayMoney = 0;
            hp = 100;
            customers = [];
            tray = [];
            customerArea.innerHTML = '<div id="status-text"></div>';
            updateHUD();
            updateTrayUI();
            
            // 主循環
            if (gameTimer) clearInterval(gameTimer);
            gameTimer = setInterval(() => {
                if (state !== 'playing') return;
                
                // 更新客人狀態
                for (let i = customers.length - 1; i >= 0; i--) {
                    let c = customers[i];
                    let decreaseRate = 0.5 + (upgrades.ac * -0.05); // 升級減慢
                    if (decreaseRate < 0.2) decreaseRate = 0.2;
                    
                    c.patience -= decreaseRate;
                    
                    if (c.patience <= 0) {
                        c.patience = 0;
                        c.element.classList.add('angry');
                        // 客人發脾氣走人
                        customers.splice(i, 1);
                        c.element.remove();
                        hp -= 15;
                        playSound('fail');
                        showStatus('😡 客人等到發脾氣！扣減聲譽！', '#ff4757');
                        updateHUD();
                        
                        if (hp <= 0) gameOver();
                    } else {
                        let bar = c.element.querySelector('.patience-bar');
                        if (bar) {
                            bar.style.width = c.patience + '%';
                            if (c.patience < 30) {
                                bar.style.background = '#ff4757';
                                c.element.classList.add('angry');
                                c.element.querySelector('.customer-face').className = 'customer-face face-angry';
                            } else if (c.patience < 60) {
                                bar.style.background = '#f39c12';
                                c.element.querySelector('.customer-face').className = 'customer-face face-neutral';
                            }
                        }
                    }
                }
            }, 50);

            // 生成客人定時器
            if (spawnTimer) clearTimeout(spawnTimer);
            spawnCustomer();
        }

        function spawnCustomer() {
            if (state !== 'playing') return;
            
            let maxCustomers = Math.min(3, 1 + Math.floor(currentDayMoney / 500));
            if (customers.length < maxCustomers) {
                let id = customerIdCounter++;
                let name = NAMES[Math.floor(Math.random() * NAMES.length)];
                let shirt = SHIRTS[Math.floor(Math.random() * SHIRTS.length)];
                
                // 隨機訂單：1杯飲品 + 1份食物 (或純飲品)
                let orders = [];
                let drinks = ['凍檸茶', '熱奶茶'];
                let foods = ['西多士', '干炒牛河'];
                
                let numItems = Math.random() < 0.3 ? 1 : 2;
                if (numItems === 1) {
                    if (Math.random() < 0.5) orders.push(drinks[Math.floor(Math.random() * drinks.length)]);
                    else orders.push(foods[Math.floor(Math.random() * foods.length)]);
                } else {
                    orders.push(drinks[Math.floor(Math.random() * drinks.length)]);
                    orders.push(foods[Math.floor(Math.random() * foods.length)]);
                }

                let el = document.createElement('div');
                el.className = 'customer-container';
                el.id = 'customer-' + id;
                
                let orderHtml = orders.map(o => `<span class="order-item">${o}</span>`).join('');
                
                el.innerHTML = `
                    <div class="speech-bubble">${orderHtml}</div>
                    <div class="customer-body" style="background:${shirt}">
                        <div class="customer-face face-happy"></div>
                    </div>
                    <div class="patience-bar-container">
                        <div class="patience-bar" style="width: 100%"></div>
                    </div>
                `;
                
                customerArea.appendChild(el);
                
                customers.push({
                    id: id,
                    name: name,
                    orders: orders,
                    patience: 100,
                    element: el
                });
            }

            // 動態調整生成速度
            let nextSpawn = Math.max(2000, 5000 - currentDayMoney);
            spawnTimer = setTimeout(spawnCustomer, nextSpawn);
        }

        function addToTray(item, emoji) {
            if (state !== 'playing') return;
            playSound('click');
            tray.push({ name: item, emoji: emoji });
            updateTrayUI();
        }

        function clearTray() {
            if (state !== 'playing') return;
            playSound('click');
            tray = [];
            updateTrayUI();
        }

        function updateTrayUI() {
            if (tray.length === 0) {
                trayEl.innerHTML = '點擊下方餐點加入托盤';
            } else {
                trayEl.innerHTML = tray.map(t => `<span class="tray-item">${t.emoji}</span>`).join('');
            }
        }

        function serveCustomer() {
            if (state !== 'playing') return;
            if (tray.length === 0) {
                showStatus('托盤係空嘅！', '#ff4757');
                return;
            }

            // 檢查邊個客人可以匹配 (簡化邏輯：只要托盤有客人想要嘅所有野，就出餐俾佢)
            let matchedCustomerIndex = -1;
            
            for (let i = 0; i < customers.length; i++) {
                let c = customers[i];
                let trayCopy = [...tray.map(t => t.name)];
                let matchCount = 0;
                
                for (let orderItem of c.orders) {
                    let idx = trayCopy.indexOf(orderItem);
                    if (idx !== -1) {
                        matchCount++;
                        trayCopy.splice(idx, 1); // 消耗
                    }
                }
                
                if (matchCount === c.orders.length) {
                    matchedCustomerIndex = i;
                    break;
                }
            }

            if (matchedCustomerIndex !== -1) {
                // 完美匹配
                let c = customers[matchedCustomerIndex];
                customers.splice(matchedCustomerIndex, 1);
                c.element.remove();
                
                // 計算獎金
                let baseMoney = 50;
                let bonus = upgrades.staff * 20;
                let earned = baseMoney + bonus + Math.floor(c.patience);
                currentDayMoney += earned;
                totalMoney += earned;
                localStorage.setItem('chaChaanTeng_money', totalMoney);
                
                playSound('success');
                showStatus(`✅ 出餐成功！賺取 $${earned}`, '#2ed573');
                createCoinEffect(c.element.offsetLeft, c.element.offsetTop, earned);
                
                tray = []; // 清空托盤
                updateTrayUI();
                updateHUD();
            } else {
                // 匹配失敗
                playSound('fail');
                showStatus('❌ 錯單！客人唔係叫呢啲！', '#ff4757');
                hp -= 5;
                updateHUD();
                if (hp <= 0) gameOver();
            }
        }

        function createCoinEffect(x, y, amount) {
            let coin = document.createElement('div');
            coin.className = 'coin-anim';
            coin.innerText = '+$' + amount;
            coin.style.left = (x + 20) + 'px';
            coin.style.top = (y + 50) + 'px';
            document.body.appendChild(coin);
            setTimeout(() => coin.remove(), 1000);
        }

        function updateHUD() {
            moneyVal.innerText = currentDayMoney;
            hpVal.innerText = hp;
            hpVal.style.color = hp < 30 ? '#ff4757' : '#ffd32a';
        }

        function showStatus(text, color) {
            statusText.innerText = text;
            statusText.style.color = color;
            statusText.style.textShadow = `0 0 20px ${color}`;
            statusText.classList.add('show');
            setTimeout(() => statusText.classList.remove('show'), 1500);
        }

        function gameOver() {
            state = 'gameover';
            if (gameTimer) clearInterval(gameTimer);
            if (spawnTimer) clearTimeout(spawnTimer);
            
            if (currentDayMoney > bestScore) {
                bestScore = currentDayMoney;
                localStorage.setItem('chaChaanTeng_best', bestScore);
            }
            
            document.getElementById('final-score').innerText = '$' + currentDayMoney;
            document.getElementById('best-score').innerText = '$' + bestScore;
            gameoverScreen.classList.add('active');
        }

        function retryCurrentLevel() {
            try {
                gameoverScreen.classList.remove('active');
                startGame();
            } catch (e) {
                console.error(e);
            }
        }

        function backToLobby() {
            try {
                location.href = '../index.html';
            } catch (e) {
                console.error(e);
            }
        }

        function openShop() {
            if (state === 'playing') return;
            shopModal.classList.add('active');
            updateShopUI();
        }

        function closeShop() {
            shopModal.classList.remove('active');
        }

        function updateShopUI() {
            document.getElementById('lvl-ac').innerText = upgrades.ac;
            document.getElementById('lvl-staff').innerText = upgrades.staff;
            document.getElementById('buy-ac').innerText = `$${300 * (upgrades.ac + 1)}`;
            document.getElementById('buy-staff').innerText = `$${500 * (upgrades.staff + 1)}`;
            document.getElementById('buy-ac').disabled = totalMoney < 300 * (upgrades.ac + 1);
            document.getElementById('buy-staff').disabled = totalMoney < 500 * (upgrades.staff + 1);
        }

        function buyUpgrade(type) {
            let cost = type === 'ac' ? 300 * (upgrades.ac + 1) : 500 * (upgrades.staff + 1);
            if (totalMoney >= cost) {
                totalMoney -= cost;
                upgrades[type]++;
                localStorage.setItem('chaChaanTeng_money', totalMoney);
                localStorage.setItem('chaChaanTeng_upgrades', JSON.stringify(upgrades));
                playSound('success');
                updateShopUI();
            }
        }
    </script>

    <!-- 🟢 Firebase 在線統計 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        try {
            const firebaseConfig = { databaseURL: "https://maze-leaderboard-default-rtdb.asia-southeast1.firebasedatabase.app/" };
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            const db = firebase.database();
            const userId = 'user_' + Math.random().toString(36).substr(2, 9);
            let pathParts = window.location.pathname.split('/').filter(p => p && p !== 'index.html');
            let gameId = pathParts[pathParts.length - 1] || 'unknown'; 
            const userStatusRef = db.ref('online_status/' + gameId + '/' + userId);
            db.ref('.info/connected').on('value', (snap) => {
                if (snap.val() === true) {
                    userStatusRef.onDisconnect().remove();
                    userStatusRef.set(true);
                }
            });
        } catch(e) {}
    </script>
