<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>賽博股神：極速交易</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
    
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    
    body {
        background-color: #050510; color: #fff; font-family: 'Orbitron', 'PingFang HK', sans-serif;
        height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
        touch-action: manipulation; 
    }

    /* --- 返回大廳按鈕 --- */
    .back-btn {
        position: fixed; top: 15px; left: 15px; z-index: 9999;
        padding: 8px 16px; background: rgba(10, 10, 20, 0.85);
        color: #00d2d3; border: 2px solid #00d2d3; border-radius: 8px;
        text-decoration: none; font-weight: bold; font-size: 14px;
        box-shadow: 0 0 10px rgba(0, 210, 211, 0.5); transition: all 0.2s;
        backdrop-filter: blur(5px); touch-action: manipulation;
    }
    .back-btn:hover { background: #00d2d3; color: #000; box-shadow: 0 0 20px #00d2d3; }

    /* 頂部狀態欄 */
    #hud {
        position: absolute; top: 0; left: 0; width: 100%; padding: 15px 20px;
        display: flex; justify-content: space-between; align-items: flex-start;
        z-index: 10; pointer-events: none;
    }
    .hud-box {
        background: rgba(0, 0, 0, 0.7); border: 1px solid #333;
        padding: 10px 15px; border-radius: 8px; backdrop-filter: blur(5px);
        display: flex; flex-direction: column; gap: 5px;
    }
    .hud-box span { font-size: 12px; color: #888; }
    .hud-box .val { font-size: 20px; font-weight: 900; }
    #cash-val { color: #2ed573; text-shadow: 0 0 10px rgba(46, 213, 115, 0.5); }
    #stock-val { color: #00d2d3; text-shadow: 0 0 10px rgba(0, 210, 211, 0.5); }
    #time-val { color: #ff4757; text-shadow: 0 0 10px rgba(255, 71, 87, 0.5); text-align: right; }
    
    /* 遊戲場景 */
    #game-container {
        flex: 1; position: relative; display: flex; flex-direction: column;
        overflow: hidden; background: radial-gradient(circle at 50% 50%, #0a1a2e, #050510);
    }
    
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }

    /* 隨機新聞彈出 */
    #news-popup {
        position: absolute; top: 20%; left: 50%; transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.9); border: 2px solid #ff4757;
        padding: 15px 25px; border-radius: 10px; text-align: center;
        color: #fff; font-weight: bold; font-size: 16px; z-index: 20;
        box-shadow: 0 0 30px rgba(255, 71, 87, 0.5);
        opacity: 0; transition: opacity 0.3s; pointer-events: none;
        white-space: nowrap;
    }
    #news-popup.show { opacity: 1; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes popIn { from { transform: translateX(-50%) scale(0.8); } to { transform: translateX(-50%) scale(1); } }

    /* 底部控制區 */
    #controls {
        position: absolute; bottom: 0; left: 0; width: 100%; padding: 20px;
        display: flex; gap: 15px; z-index: 10; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
    }
    .trade-btn {
        flex: 1; padding: 20px; font-size: 24px; font-weight: 900; border: none;
        border-radius: 12px; cursor: pointer; transition: all 0.1s; font-family: 'Orbitron', sans-serif;
        touch-action: manipulation; box-shadow: 0 5px 15px rgba(0,0,0,0.5); letter-spacing: 2px;
    }
    .trade-btn:active { transform: scale(0.95); }
    #btn-buy { background: linear-gradient(to bottom, #2ed573, #1e9e50); color: #000; text-shadow: 0 1px 2px rgba(255,255,255,0.4); }
    #btn-sell { background: linear-gradient(to bottom, #ff4757, #c0392b); color: #fff; }

    /* 結算畫面 */
    #end-screen {
        position: absolute; inset: 0; background: #000; z-index: 50;
        display: none; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; padding: 20px;
    }
    #end-screen h1 { font-size: 40px; margin-bottom: 10px; }
    #end-screen p { font-size: 18px; color: #ccc; margin-bottom: 30px; line-height: 1.6; }
    #end-screen button {
        padding: 15px 40px; background: #00d2d3; color: #000; border: none;
        border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer;
    }

    /* 手機排版優化 */
    @media (max-width: 600px) {
        .back-btn { font-size: 12px; padding: 6px 12px; }
        .hud-box .val { font-size: 16px; }
        .trade-btn { padding: 15px; font-size: 20px; }
        #news-popup { font-size: 14px; padding: 10px 15px; }
    }
</style>
</head>
<body>

    <a href="../" class="back-btn">⬅ 返回大廳</a>

    <div id="hud">
        <div class="hud-box">
            <span>💰 現金</span>
            <span class="val" id="cash-val">$10,000</span>
        </div>
        <div class="hud-box">
            <span>📈 持股</span>
            <span class="val" id="stock-val">0 股</span>
        </div>
        <div class="hud-box">
            <span>⏳ 剩餘時間</span>
            <span class="val" id="time-val">60s</span>
        </div>
    </div>

    <div id="game-container">
        <canvas id="chartCanvas"></canvas>
        <div id="news-popup">📰 新聞</div>

        <div id="controls">
            <button class="trade-btn" id="btn-buy" onclick="trade('buy')">買入</button>
            <button class="trade-btn" id="btn-sell" onclick="trade('sell')">賣出</button>
        </div>
    </div>

    <!-- 結算畫面 -->
    <div id="end-screen">
        <h1 id="end-title">交易結束</h1>
        <p id="end-stats"></p>
        <button onclick="startGame()">再炒一局</button>
    </div>

<script>
    const canvas = document.getElementById('chartCanvas');
    const ctx = canvas.getContext('2d');
    const cashVal = document.getElementById('cash-val');
    const stockVal = document.getElementById('stock-val');
    const timeVal = document.getElementById('time-val');
    const newsPopup = document.getElementById('news-popup');
    const endScreen = document.getElementById('end-screen');
    const endTitle = document.getElementById('end-title');
    const endStats = document.getElementById('end-stats');

    let W, H;
    function resize() {
        W = canvas.parentElement.clientWidth;
        H = canvas.parentElement.clientHeight;
        canvas.width = W;
        canvas.height = H;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- 音效系統 ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        let now = audioCtx.currentTime;
        if (type === 'buy') {
            osc.type = 'square'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
            gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(); osc.stop(now + 0.1);
        } else if (type === 'sell') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(400, now + 0.1);
            gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(); osc.stop(now + 0.1);
        } else if (type === 'crash') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(20, now + 0.5);
            gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.start(); osc.stop(now + 0.5);
        } else if (type === 'boom') {
            osc.type = 'square'; osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(600, now + 0.2);
            gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(); osc.stop(now + 0.2);
        }
    }

    // --- 遊戲狀態 ---
    let cash = 10000;
    let stocks = 0;
    let price = 100;
    let timeLeft = 60;
    let gameActive = false;
    let priceHistory = [];
    let newsTimer = 0;
    let particles = [];
    let matrixDrops = [];
    let shakeTime = 0;
    let isCrashed = false;

    // 初始化數字雨
    for(let i=0; i<50; i++) {
        matrixDrops.push({
            x: Math.random() * W,
            y: Math.random() * H,
            speed: Math.random() * 3 + 1,
            char: Math.random() > 0.5 ? '1' : '0'
        });
    }

    // 生成平滑折線圖數據
    function initChart() {
        priceHistory = [];
        for(let i=0; i<W; i+=5) {
            priceHistory.push(100);
        }
    }

    function startGame() {
        cash = 10000;
        stocks = 0;
        price = 100;
        timeLeft = 60;
        gameActive = true;
        isCrashed = false;
        particles = [];
        shakeTime = 0;
        endScreen.style.display = 'none';
        initChart();
        updateHUD();
        newsTimer = 0;
        
        if (window.gameLoopInterval) clearInterval(window.gameLoopInterval);
        window.gameLoopInterval = setInterval(gameTick, 100); // 每 0.1 秒跳一次價格
        
        if (window.timerInterval) clearInterval(window.timerInterval);
        window.timerInterval = setInterval(() => {
            if (!gameActive) return;
            timeLeft--;
            timeVal.innerText = `${timeLeft}s`;
            if (timeLeft <= 10) timeVal.style.color = '#ff4757';
            else timeVal.style.color = '#00d2d3';
            
            if (timeLeft <= 0) endGame();
        }, 1000);
    }

    function gameTick() {
        if (!gameActive) return;

        // 隨機價格波動 (-3% 到 +3%)
        let changePercent = (Math.random() - 0.48) * 0.06; 
        
        // 隨機新聞事件 (每 5-10 秒觸發)
        newsTimer++;
        if (newsTimer > 50 + Math.random() * 50) {
            triggerNews();
            newsTimer = 0;
        }

        price = price * (1 + changePercent);
        if (price < 1) price = 1; // 防止跌穿 0
        
        priceHistory.push(price);
        if (priceHistory.length > W / 5) priceHistory.shift();

        updateHUD();
    }

    function triggerNews() {
        let events = [
            { text: "🚀 外星人宣佈收購！股價暴升！", impact: 0.5 },
            { text: "🔥 總部大樓發生火災！股價暴跌！", impact: -0.4 },
            { text: "💻 遭黑客大規模攻擊！市場恐慌！", impact: -0.3 },
            { text: "🤖 成功研發超級 AI！投資者瘋狂買入！", impact: 0.8 },
            { text: "📉 財報造假被揭發！股價崩盤！", impact: -0.6 }
        ];
        let ev = events[Math.floor(Math.random() * events.length)];
        
        price = price * (1 + ev.impact);
        priceHistory.push(price);

        newsPopup.innerText = ev.text;
        newsPopup.classList.add('show');
        setTimeout(() => newsPopup.classList.remove('show'), 2000);

        if (ev.impact > 0) {
            playSound('boom');
            spawnParticles('#2ed573', 20);
        } else {
            playSound('crash');
            shakeTime = 15;
            spawnParticles('#ff4757', 30);
        }
    }

    function trade(action) {
        if (!gameActive) return;
        
        if (action === 'buy') {
            let maxBuy = Math.floor(cash / price);
            if (maxBuy > 0) {
                cash -= maxBuy * price;
                stocks += maxBuy;
                playSound('buy');
                spawnParticles('#2ed573', 5);
            }
        } else if (action === 'sell') {
            if (stocks > 0) {
                cash += stocks * price;
                stocks = 0;
                playSound('sell');
                spawnParticles('#ff4757', 5);
            }
        }
        updateHUD();
    }

    function updateHUD() {
        cashVal.innerText = `$${Math.floor(cash).toLocaleString()}`;
        stockVal.innerText = `${stocks.toLocaleString()} 股`;
        
        // 計算總資產
        let total = cash + stocks * price;
        if (total <= 0 && !isCrashed) {
            endGame(true); // 破產
        }
    }

    function spawnParticles(color, count) {
        for (let i = 0; i < count; i++) {
            particles.push({
                x: W/2, y: H/2,
                vx: (Math.random() - 0.5) * 15,
                vy: (Math.random() - 0.5) * 15,
                life: 1, color: color,
                size: Math.random() * 4 + 2
            });
        }
    }

    function endGame(bankrupt = false) {
        gameActive = false;
        clearInterval(window.gameLoopInterval);
        clearInterval(window.timerInterval);
        
        let finalTotal = cash + stocks * price;
        
        if (bankrupt || finalTotal < 1000) {
            endTitle.innerText = "💀 破產收場";
            endTitle.style.color = "#ff4757";
            endStats.innerText = `你輸剩 $${Math.floor(finalTotal).toLocaleString()}，宣佈破產！`;
            playSound('crash');
        } else if (finalTotal > 50000) {
            endTitle.innerText = "🏆 賽博股神";
            endTitle.style.color = "#ffd32a";
            endStats.innerText = `總資產：$${Math.floor(finalTotal).toLocaleString()}！你完全掌控了市場！`;
            playSound('boom');
        } else {
            endTitle.innerText = "📊 交易結束";
            endTitle.style.color = "#00d2d3";
            endStats.innerText = `最終總資產：$${Math.floor(finalTotal).toLocaleString()}。再接再厲！`;
        }
        
        endScreen.style.display = 'flex';
    }

    // --- 渲染系統 ---
    function draw() {
        // 清空背景
        ctx.fillStyle = '#050510';
        ctx.fillRect(0, 0, W, H);

        // 畫面震動
        ctx.save();
        if (shakeTime > 0) {
            shakeTime--;
            ctx.translate((Math.random() - 0.5) * 20, (Math.random() - 0.5) * 20);
        }

        // 畫 Matrix 數字雨
        ctx.font = '14px monospace';
        for (let drop of matrixDrops) {
            ctx.fillStyle = 'rgba(0, 210, 211, 0.15)';
            ctx.fillText(drop.char, drop.x, drop.y);
            drop.y += drop.speed;
            if (drop.y > H) {
                drop.y = 0;
                drop.x = Math.random() * W;
            }
        }

        // 畫背景網格
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
        ctx.lineWidth = 1;
        for(let i=0; i<H; i+=40) {
            ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(W, i); ctx.stroke();
        }
        for(let i=0; i<W; i+=40) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, H); ctx.stroke();
        }

        // 畫折線圖
        if (priceHistory.length > 0) {
            ctx.beginPath();
            ctx.strokeStyle = '#00d2d3';
            ctx.lineWidth = 3;
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#00d2d3';
            ctx.lineJoin = 'round';

            // 計算 Y 軸縮放 (將價格映射到畫面中間區域)
            let maxP = Math.max(...priceHistory) * 1.1;
            let minP = Math.min(...priceHistory) * 0.9;
            let range = maxP - minP;
            if (range === 0) range = 1;

            for (let i = 0; i < priceHistory.length; i++) {
                let x = i * 5;
                let y = H * 0.6 - ((priceHistory[i] - minP) / range) * (H * 0.4);
                
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();

            // 畫發光漸變
            ctx.lineTo(W, H);
            ctx.lineTo(0, H);
            ctx.closePath();
            let grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, 'rgba(0, 210, 211, 0.2)');
            grad.addColorStop(1, 'rgba(0, 210, 211, 0)');
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.shadowBlur = 0;

            // 畫當前價格點
            let lastY = H * 0.6 - ((priceHistory[priceHistory.length-1] - minP) / range) * (H * 0.4);
            let lastX = (priceHistory.length - 1) * 5;
            
            ctx.beginPath();
            ctx.arc(lastX, lastY, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#fff';
            ctx.fill();
            ctx.shadowBlur = 0;

            // 顯示當前價格
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 24px "Orbitron", sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(`$${price.toFixed(2)}`, W - 20, H * 0.2);
        }

        // 更新並畫粒子
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy;
            p.life -= 0.02;
            if (p.life <= 0) { particles.splice(i, 1); continue; }
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;

        ctx.restore();
        requestAnimationFrame(draw);
    }

    // 啟動
    startGame();
    requestAnimationFrame(draw);
</script>
</body>
</html>
