<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>賽博股神 - 專業交易終端</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    
    body {
        background-color: #0b0e11; color: #eaecef; font-family: 'Roboto Mono', 'PingFang HK', monospace;
        height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
        font-size: 12px;
    }

    /* --- 頂部導航 --- */
    .top-header {
        display: flex; justify-content: space-between; align-items: center;
        padding: 8px 12px; background: #181a20; border-bottom: 1px solid #2b3139;
        z-index: 100; flex-shrink: 0;
    }
    .back-btn {
        padding: 4px 10px; background: transparent; color: #848e9c; border: 1px solid #474d57; border-radius: 4px;
        text-decoration: none; font-size: 12px; font-weight: 500; transition: 0.2s;
    }
    .back-btn:active { background: #2b3139; }
    .game-title { font-size: 14px; font-weight: 700; color: #fcd535; }

    /* --- 頂部行情列 --- */
    .ticker-bar {
        display: flex; align-items: center; padding: 8px 12px; background: #181a20; border-bottom: 1px solid #2b3139;
        gap: 15px; flex-shrink: 0;
    }
    .pair-name { font-size: 16px; font-weight: 700; }
    .price-large { font-size: 18px; font-weight: 700; }
    .price-change { font-size: 12px; }
    .up { color: #0ecb81; }
    .down { color: #f6465d; }

    /* --- 主圖表區 --- */
    .chart-container {
        flex: 1; position: relative; background: #181a20; display: flex; flex-direction: column; min-height: 0;
    }
    canvas { width: 100%; height: 100%; display: block; }

    /* --- 訂單簿 --- */
    #order-book {
        position: absolute; top: 10px; right: 10px; width: 90px; z-index: 5;
        display: flex; flex-direction: column; gap: 2px; pointer-events: none;
        font-size: 10px;
    }
    .ob-row { display: flex; justify-content: space-between; padding: 1px 4px; position: relative; }
    .ob-bg { position: absolute; right: 0; top: 0; bottom: 0; z-index: -1; opacity: 0.15; }
    .ob-ask { color: #f6465d; }
    .ob-ask .ob-bg { background: #f6465d; }
    .ob-bid { color: #0ecb81; }
    .ob-bid .ob-bg { background: #0ecb81; }

    /* --- 底部交易面板 --- */
    .trade-panel {
        background: #181a20; border-top: 1px solid #2b3139; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px;
        flex-shrink: 0; z-index: 10;
    }
    
    .leverage-slider { display: flex; align-items: center; gap: 10px; font-size: 12px; color: #848e9c; }
    .leverage-slider input { flex: 1; accent-color: #fcd535; }
    
    .trade-actions { display: flex; gap: 10px; }
    .btn {
        flex: 1; padding: 12px; border: none; border-radius: 4px; font-family: inherit; font-size: 14px;
        font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center;
    }
    .btn small { font-size: 10px; font-weight: 400; opacity: 0.8; margin-top: 2px; }
    .btn-long { background: #0ecb81; color: #fff; }
    .btn-short { background: #f6465d; color: #fff; }
    .btn-close { background: #fcd535; color: #181a20; }

    /* --- 倉位面板 --- */
    #position-info {
        display: none; background: #2b3139; padding: 10px; border-radius: 4px;
        grid-template-columns: 1fr 1fr; gap: 8px; font-size: 11px;
    }
    .pos-item { display: flex; flex-direction: column; }
    .pos-label { color: #848e9c; font-size: 10px; }
    .pos-value { font-weight: 700; }

    /* --- 彈窗與特效 --- */
    #crash-overlay { position: absolute; inset: 0; background: rgba(246, 70, 93, 0.4); z-index: 40; display: none; pointer-events: none; }
    .screen-flash { position: absolute; inset: 0; z-index: 30; pointer-events: none; opacity: 0; transition: opacity 0.1s; }
    @keyframes alertFlash { 0%, 100% { opacity: 0; } 50% { opacity: 0.3; } }
    .alert-active { animation: alertFlash 0.5s infinite; }

    #news-popup {
        position: absolute; top: 20%; left: 50%; transform: translateX(-50%);
        background: rgba(24, 26, 32, 0.95); border: 1px solid #f6465d; border-radius: 4px;
        padding: 8px 16px; color: #fff; font-weight: 700; font-size: 12px; z-index: 20;
        opacity: 0; transition: opacity 0.2s; pointer-events: none;
        white-space: nowrap;
    }
    #news-popup.show { opacity: 1; }

    #end-screen, #achieve-popup {
        position: absolute; inset: 0; background: rgba(11, 14, 17, 0.95); z-index: 50;
        display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px;
    }
    #end-screen h1 { font-size: 24px; margin-bottom: 10px; color: #fcd535; }
    #end-screen p { font-size: 14px; color: #848e9c; margin-bottom: 20px; line-height: 1.6; white-space: pre-line; }
    #end-screen button { padding: 10px 20px; background: #fcd535; color: #181a20; border: none; border-radius: 4px; font-weight: 700; cursor: pointer; width: 200px; margin: 5px 0; }
</style>
</head>
<body>

    <div class="top-header">
        <a href="../" class="back-btn">⬅ 返回大廳</a>
        <div class="game-title">賽博股神 PRO</div>
    </div>

    <div class="ticker-bar">
        <div class="pair-name">BTC/USDT</div>
        <div class="price-large" id="current-price">100.00</div>
        <div class="price-change up" id="price-change">+0.00%</div>
        <div style="flex:1"></div>
        <div style="text-align:right;">
            <div class="pos-label">總資產</div>
            <div class="price-large" style="color:#fcd535;" id="cash-val">$10,000</div>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="chartCanvas"></canvas>
        <div id="order-book"></div>
        <div id="crash-overlay"></div>
        <div class="screen-flash" id="screen-flash"></div>
        <div id="news-popup">📰 新聞</div>
    </div>

    <div class="trade-panel">
        <div class="leverage-slider">
            <span>槓桿</span>
            <input type="range" id="lev-slider" min="1" max="100" value="10" step="1">
            <span id="lev-val" style="color:#fff; width:35px;">10x</span>
        </div>

        <div id="position-info">
            <div class="pos-item"><span class="pos-label">開倉價</span><span class="pos-value" id="entry-price">--</span></div>
            <div class="pos-item"><span class="pos-label">強平價</span><span class="pos-value" id="liq-price" style="color:#f6465d;">--</span></div>
            <div class="pos-item"><span class="pos-label">保證金</span><span class="pos-value" id="margin-val">--</span></div>
            <div class="pos-item"><span class="pos-label">未實現盈虧</span><span class="pos-value" id="pnl-val" style="color:#0ecb81;">--</span></div>
        </div>

        <div class="trade-actions">
            <button class="btn btn-long" id="btn-long" onclick="openPosition('long')">買入 / 做多<small>全倉</small></button>
            <button class="btn btn-short" id="btn-short" onclick="openPosition('short')">賣出 / 做空<small>全倉</small></button>
            <button class="btn btn-close" id="btn-close" onclick="closePosition()">平倉<small>市價</small></button>
        </div>
    </div>

    <div id="achieve-popup">
        <div style="background:#181a20; border:1px solid #fcd535; padding:20px; border-radius:8px;">
            <h2 id="achieve-title" style="color:#fcd535; margin-bottom:10px;">🏆 成就解鎖</h2>
            <p id="achieve-desc" style="color:#848e9c;"></p>
        </div>
    </div>

    <div id="end-screen">
        <h1 id="end-title">交易結束</h1>
        <p id="end-stats"></p>
        <button onclick="startGame('classic')">再炒一局 (經典)</button>
        <button onclick="startGame('endless')" style="background:#f6465d; color:#fff;">無盡模式 (挑戰極限)</button>
        <button onclick="startGame('survival')" style="background:#0ecb81; color:#fff;">生存模式 (本金 $1,000)</button>
    </div>

<script>
    const canvas = document.getElementById('chartCanvas');
    const ctx = canvas.getContext('2d');
    const currentPriceEl = document.getElementById('current-price');
    const priceChangeEl = document.getElementById('price-change');
    const cashVal = document.getElementById('cash-val');
    const orderBook = document.getElementById('order-book');
    const newsPopup = document.getElementById('news-popup');
    const levSlider = document.getElementById('lev-slider');
    const levVal = document.getElementById('lev-val');
    const posInfo = document.getElementById('position-info');
    const entryPriceEl = document.getElementById('entry-price');
    const liqPriceEl = document.getElementById('liq-price');
    const marginValEl = document.getElementById('margin-val');
    const pnlValEl = document.getElementById('pnl-val');
    const btnLong = document.getElementById('btn-long');
    const btnShort = document.getElementById('btn-short');
    const btnClose = document.getElementById('btn-close');
    const endScreen = document.getElementById('end-screen');
    const screenFlash = document.getElementById('screen-flash');
    const crashOverlay = document.getElementById('crash-overlay');

    let W, H;
    function resize() {
        W = canvas.parentElement.clientWidth; H = canvas.parentElement.clientHeight;
        canvas.width = W; canvas.height = H;
    }
    window.addEventListener('resize', resize); resize();

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        let now = audioCtx.currentTime;
        if (type === 'open') { osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(800, now + 0.1); gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(); osc.stop(now + 0.1); }
        else if (type === 'win') { osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(1200, now + 0.2); gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2); osc.start(); osc.stop(now + 0.2); }
        else if (type === 'lose') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.2); gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2); osc.start(); osc.stop(now + 0.2); }
        else if (type === 'crash') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(20, now + 0.5); gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5); osc.start(); osc.stop(now + 0.5); }
    }
    function vibrate(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

    let cash = 10000, price = 100, gameActive = false;
    let position = null, entryPrice = 0, margin = 0, leverage = 10;
    let winStreak = 0, hasShield = false;
    let candles = [], tickCount = 0, currentCandle = { o: 100, h: 100, l: 100, c: 100, v: 0 };
    let particles = [], shakeTime = 0;
    let lastPrice = 100;

    function startGame(mode = 'classic') {
        cash = mode === 'survival' ? 1000 : 10000;
        price = 100;
        gameActive = true;
        position = null;
        leverage = 10;
        levSlider.value = 10;
        levVal.innerText = '10x';
        winStreak = 0; hasShield = false;
        particles = []; shakeTime = 0;
        endScreen.style.display = 'none';
        crashOverlay.style.display = 'none';
        
        candles = [];
        for(let i=0; i<40; i++) candles.push({ o: 100, h: 100, l: 100, c: 100, v: Math.random()*100 });
        currentCandle = { o: 100, h: 100, l: 100, c: 100, v: 0 };
        tickCount = 0;
        
        updateUI();
        resetButtons();
        
        if (window.gameLoopInterval) clearInterval(window.gameLoopInterval);
        window.gameLoopInterval = setInterval(gameTick, 100);
    }

    levSlider.addEventListener('input', (e) => {
        if (position) { levSlider.value = leverage; return; }
        leverage = parseInt(e.target.value);
        levVal.innerText = leverage + 'x';
    });

    function gameTick() {
        if (!gameActive) return;
        
        // 模擬真實價格跳動（帶趨勢和波動）
        let changePercent = (Math.random() - 0.5) * 0.005; // 基礎波動
        // 隨機觸發大行情
        if (Math.random() < 0.02) changePercent += (Math.random() - 0.5) * 0.03; 
        
        lastPrice = price;
        price = price * (1 + changePercent);
        if (price < 0.01) price = 0.01;
        
        // 更新 K 線
        currentCandle.c = price;
        currentCandle.h = Math.max(currentCandle.h, price);
        currentCandle.l = Math.min(currentCandle.l, price);
        currentCandle.v += Math.random() * 50;
        tickCount++;
        
        // 每 20 個 tick (2秒) 生成一根新蠟燭
        if (tickCount >= 20) {
            candles.push({ ...currentCandle });
            if (candles.length > 40) candles.shift();
            currentCandle = { o: price, h: price, l: price, c: price, v: 0 };
            tickCount = 0;
        }

        updateUI();
        checkTPSL();
        checkLiquidation();
        updateOrderBook();
    }

    function updateUI() {
        currentPriceEl.innerText = price.toFixed(2);
        currentPriceEl.className = 'price-large ' + (price >= lastPrice ? 'up' : 'down');
        
        let change = ((price - 100) / 100) * 100;
        priceChangeEl.innerText = (change >= 0 ? '+' : '') + change.toFixed(2) + '%';
        priceChangeEl.className = 'price-change ' + (change >= 0 ? 'up' : 'down');

        cashVal.innerText = '$' + Math.floor(cash).toLocaleString();

        if (position) {
            let pnl = position === 'long' ? (price - entryPrice) / entryPrice * margin * leverage : (entryPrice - price) / entryPrice * margin * leverage;
            pnlValEl.innerText = (pnl >= 0 ? '+' : '') + '$' + Math.floor(pnl).toLocaleString();
            pnlValEl.style.color = pnl >= 0 ? '#0ecb81' : '#f6465d';
            
            let liqPrice = position === 'long' ? entryPrice * (1 - 1/leverage) : entryPrice * (1 + 1/leverage);
            liqPriceEl.innerText = '$' + liqPrice.toFixed(2);
        }
    }

    function updateOrderBook() {
        let html = '';
        let basePrice = price;
        // 賣盤 (Asks)
        for (let i = 5; i >= 1; i--) {
            let p = basePrice * (1 + i * 0.001);
            let w = Math.random() * 100;
            html += `<div class="ob-row ob-ask"><div class="ob-bg" style="width:${w}%"></div><span>${p.toFixed(2)}</span><span>${(Math.random()*2).toFixed(3)}</span></div>`;
        }
        // 買盤 (Bids)
        for (let i = 1; i <= 5; i++) {
            let p = basePrice * (1 - i * 0.001);
            let w = Math.random() * 100;
            html += `<div class="ob-row ob-bid"><div class="ob-bg" style="width:${w}%"></div><span>${p.toFixed(2)}</span><span>${(Math.random()*2).toFixed(3)}</span></div>`;
        }
        orderBook.innerHTML = html;
    }

    function openPosition(type) {
        if (!gameActive || position) return;
        
        margin = cash;
        cash = 0;
        entryPrice = price;
        position = type;
        
        playSound('open'); vibrate(30);
        
        posInfo.style.display = 'grid';
        entryPriceEl.innerText = '$' + entryPrice.toFixed(2);
        marginValEl.innerText = '$' + Math.floor(margin).toLocaleString();
        
        btnLong.style.display = 'none';
        btnShort.style.display = 'none';
        btnClose.style.display = 'flex';
        
        updateUI();
    }

    function closePosition() {
        if (!gameActive || !position) return;
        
        let pnl = position === 'long' ? (price - entryPrice) / entryPrice * margin * leverage : (entryPrice - price) / entryPrice * margin * leverage;
        let finalCash = margin + pnl;
        if (finalCash < 0) finalCash = 0;
        
        if (finalCash <= 0 && hasShield) {
            finalCash = margin * 0.5;
            hasShield = false;
            alert('🛡️ 觸發免死金牌！保留了一半保證金！');
        }

        cash += finalCash;
        position = null;
        
        if (pnl > 0) {
            winStreak++;
            playSound('win'); vibrate(50);
            spawnParticles('#0ecb81', 30);
            if (winStreak >= 3 && !hasShield) {
                hasShield = true;
                alert('🔥 3 連勝！獲得免死金牌 x1！');
            }
        } else {
            winStreak = 0;
            playSound('lose'); vibrate([50, 50, 50]);
            spawnParticles('#f6465d', 30);
            shakeTime = 10;
        }
        
        posInfo.style.display = 'none';
        resetButtons();
        updateUI();
    }

    function resetButtons() {
        btnLong.style.display = 'flex';
        btnShort.style.display = 'flex';
        btnClose.style.display = 'none';
        posInfo.style.display = 'none';
    }

    function checkLiquidation() {
        if (!position) return;
        let pnl = position === 'long' ? (price - entryPrice) / entryPrice * margin * leverage : (entryPrice - price) / entryPrice * margin * leverage;
        
        if (margin + pnl <= 0) {
            if (hasShield) {
                hasShield = false;
                cash += margin * 0.5;
                position = null;
                playSound('crash'); shakeTime = 30;
                alert('🛡️ 爆倉！但觸發免死金牌，保留 50% 保證金！');
                resetButtons();
            } else {
                cash = 0;
                position = null;
                playSound('crash'); shakeTime = 30;
                crashOverlay.style.display = 'block';
                vibrate([200, 100, 200, 100, 500]);
                setTimeout(() => { crashOverlay.style.display = 'none'; }, 800);
                gameActive = false;
                clearInterval(window.gameLoopInterval);
                endScreen.style.display = 'flex';
                document.getElementById('end-stats').innerText = `最終資產：$${Math.floor(cash).toLocaleString()}\n\n💥 你被爆倉了！`;
            }
        }
    }

    function spawnParticles(color, count) {
        for (let i = 0; i < count; i++) {
            particles.push({ x: W/2, y: H/2, vx: (Math.random() - 0.5) * 20, vy: (Math.random() - 0.5) * 20, life: 1, color: color, size: Math.random() * 5 + 2 });
        }
    }

    function draw() {
        ctx.fillStyle = '#181a20';
        ctx.fillRect(0, 0, W, H);

        ctx.save();
        if (shakeTime > 0) { shakeTime--; ctx.translate((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10); }

        // 網格
        ctx.strokeStyle = '#2b3139'; ctx.lineWidth = 1;
        for (let i = 0; i < H; i += 40) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(W, i); ctx.stroke(); }
        for (let i = 0; i < W; i += 40) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, H); ctx.stroke(); }

        if (candles.length > 0) {
            let maxP = Math.max(...candles.map(c => c.h), currentCandle.h);
            let minP = Math.min(...candles.map(c => c.l), currentCandle.l);
            // 留出頂部和底部空間
            let padding = (maxP - minP) * 0.1;
            maxP += padding; minP -= padding;
            let range = maxP - minP; if (range === 0) range = 1;
            
            let chartH = H * 0.7; // K 線佔 70% 高度
            let volH = H * 0.2;   // 成交量佔 20%
            let gap = H * 0.1;
            
            let candleWidth = Math.min(10, (W - 60) / candles.length - 2);
            let startX = W - 60 - (candles.length + 1) * (candleWidth + 2);

            let drawCandle = (x, candle) => {
                let openY = chartH - ((candle.o - minP) / range) * chartH;
                let closeY = chartH - ((candle.c - minP) / range) * chartH;
                let highY = chartH - ((candle.h - minP) / range) * chartH;
                let lowY = chartH - ((candle.l - minP) / range) * chartH;
                
                let isUp = candle.c >= candle.o;
                let color = isUp ? '#0ecb81' : '#f6465d';
                ctx.strokeStyle = color; ctx.fillStyle = color;
                
                // 影線
                ctx.beginPath(); ctx.moveTo(x + candleWidth/2, highY); ctx.lineTo(x + candleWidth/2, lowY); ctx.stroke();
                // 實體
                if (isUp) {
                    ctx.fillRect(x, closeY, candleWidth, Math.max(1, openY - closeY));
                } else {
                    ctx.fillRect(x, openY, candleWidth, Math.max(1, closeY - openY));
                }
                
                // 成交量
                let volY = chartH + gap - (candle.v / 200) * volH;
                ctx.fillStyle = isUp ? 'rgba(14, 203, 129, 0.5)' : 'rgba(246, 70, 93, 0.5)';
                ctx.fillRect(x, volY, candleWidth, chartH + gap - volY);
            };

            candles.forEach((c, i) => {
                let x = startX + i * (candleWidth + 2);
                drawCandle(x, c);
            });
            
            let lastX = startX + candles.length * (candleWidth + 2);
            drawCandle(lastX, currentCandle);

            // MA 均線
            ctx.beginPath();
            ctx.strokeStyle = '#fcd535'; ctx.lineWidth = 1;
            for(let i = 5; i < candles.length; i++) {
                let sum = 0;
                for(let j = 0; j < 5; j++) sum += candles[i-j].c;
                let ma = sum / 5;
                let y = chartH - ((ma - minP) / range) * chartH;
                let x = startX + i * (candleWidth + 2) + candleWidth/2;
                if(i === 5) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();

            // 進場線
            if (position) {
                let entryY = chartH - ((entryPrice - minP) / range) * chartH;
                ctx.beginPath(); ctx.setLineDash([2, 2]);
                ctx.strokeStyle = '#848e9c'; ctx.lineWidth = 1;
                ctx.moveTo(0, entryY); ctx.lineTo(W, entryY); ctx.stroke(); ctx.setLineDash([]);
            }

            // 即時價格線
            let currentY = chartH - ((price - minP) / range) * chartH;
            ctx.beginPath(); ctx.setLineDash([2, 2]);
            ctx.strokeStyle = price >= lastPrice ? '#0ecb81' : '#f6465d'; ctx.lineWidth = 1;
            ctx.moveTo(0, currentY); ctx.lineTo(W, currentY); ctx.stroke(); ctx.setLineDash([]);
            
            // 右側價格標籤
            ctx.fillStyle = price >= lastPrice ? '#0ecb81' : '#f6465d';
            ctx.fillRect(W - 60, currentY - 8, 60, 16);
            ctx.fillStyle = '#fff'; ctx.font = '10px Roboto Mono';
            ctx.fillText(price.toFixed(2), W - 55, currentY + 3);
        }

        // 粒子
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy; p.life -= 0.02;
            if (p.life <= 0) { particles.splice(i, 1); continue; }
            ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;

        ctx.restore();
        requestAnimationFrame(draw);
    }

    startGame('classic');
    requestAnimationFrame(draw);
</script>
</body>
</html>
