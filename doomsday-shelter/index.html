<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>☢️ 末日避難所</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+HK:wght@400;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
    body { background: #000; color: #fff; font-family: 'Noto Sans HK', sans-serif; height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; cursor: crosshair; }
    
    #canvas-container { position: absolute; inset: 0; z-index: 1; }
    canvas { display: block; width: 100%; height: 100%; }
    
    .overlay { position: absolute; inset: 0; z-index: 2; pointer-events: none; background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.7) 100%); }
    .scanlines { position: absolute; inset: 0; z-index: 3; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.1), rgba(0,0,0,0.1) 1px, transparent 1px, transparent 2px); }

    .ui-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
    .ui-layer > * { pointer-events: auto; }

    .back-btn { position: absolute; top: 15px; left: 15px; padding: 8px 16px; background: rgba(0,0,0,0.8); color: #ffaa00; border: 1px solid #ffaa00; border-radius: 4px; text-decoration: none; font-family: 'Orbitron', sans-serif; font-weight: bold; font-size: 13px; z-index: 100; }
    
    .hud-top { display: flex; justify-content: space-between; padding: 15px; background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 100%); font-family: 'Orbitron', sans-serif; flex-wrap: wrap; gap: 10px; }
    .res-group { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .res-box { display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: bold; background: rgba(20,20,20,0.85); padding: 6px 12px; border-radius: 4px; border: 1px solid #333; box-shadow: 0 0 10px rgba(0,0,0,0.8); }
    .res-box.energy { color: #f1c40f; border-color: #f1c40f; } .res-box.crystal { color: #e056fd; border-color: #e056fd; }
    
    .door-hp-box { position: absolute; top: 70px; left: 50%; transform: translateX(-50%); font-size: 14px; font-weight: bold; color: #ff3b3b; text-align: center; width: 80%; max-width: 400px; text-shadow: 0 0 10px #ff3b3b; font-family: 'Orbitron', sans-serif; }
    .hp-bar-bg { width: 100%; height: 10px; background: #111; border-radius: 5px; margin-top: 5px; overflow: hidden; border: 1px solid #ff3b3b; box-shadow: 0 0 15px rgba(255,59,59,0.5); }
    .hp-bar-fill { height: 100%; background: linear-gradient(90deg, #ff3b3b, #ff8c00); width: 100%; transition: width 0.3s; }

    .crosshair { position: absolute; width: 34px; height: 34px; transform: translate(-50%, -50%); pointer-events: none; z-index: 50; opacity: 0.9; display: none; }
    .crosshair::before, .crosshair::after { content: ''; position: absolute; background: #00ffff; box-shadow: 0 0 8px #00ffff; }
    .crosshair::before { top: 16px; left: 0; width: 34px; height: 2px; }
    .crosshair::after { left: 16px; top: 0; width: 2px; height: 34px; }
    .crosshair-dot { position: absolute; top: 15px; left: 15px; width: 4px; height: 4px; background: #fff; border-radius: 50%; }

    .console { margin: 10px; background: linear-gradient(180deg, rgba(15,15,15,0.95) 0%, rgba(5,5,5,0.98) 100%); border: 1px solid #444; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px; max-width: 600px; margin-left: auto; margin-right: auto; width: calc(100% - 20px); pointer-events: auto; box-shadow: 0 -5px 25px rgba(0,0,0,0.9); }
    
    .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .btn { padding: 12px 4px; background: #1a1a1a; color: #ccc; border: 1px solid #444; border-radius: 5px; font-weight: bold; font-size: 12px; cursor: pointer; text-align: center; transition: 0.1s; font-family: 'Noto Sans HK', sans-serif; }
    .btn:active { transform: scale(0.95); }
    .btn.weapon { border-color: #f1c40f; color: #f1c40f; background: rgba(241,196,15,0.1); }
    .btn.power { border-color: #d500f9; color: #d500f9; background: rgba(213,0,249,0.1); }
    .btn.ultimate { background: linear-gradient(45deg, #ff3b3b, #f1c40f); color: #000; font-size: 14px; border: none; box-shadow: 0 0 15px rgba(255,59,59,0.5); border-radius: 8px; font-weight: 900; }
    .btn.ultimate:disabled { background: #222; color: #555; box-shadow: none; pointer-events: none; }

    .broadcast-box { position: absolute; top: 110px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 500px; background: rgba(255, 170, 0, 0.15); border: 1px solid #ffaa00; color: #ffaa00; padding: 10px; font-size: 13px; text-align: center; border-radius: 4px; font-weight: bold; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 20; box-shadow: 0 0 20px rgba(255,170,0,0.2); }
    .broadcast-box.show { opacity: 1; }
</style>
</head>
<body>

    <div class="overlay"></div>
    <div class="scanlines"></div>

    <a href="../" class="back-btn">⬅ 返回大廳</a>
    
    <div class="crosshair" id="crosshair">
        <div class="crosshair-dot"></div>
    </div>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <div class="hud-top">
            <div class="res-group">
                <div class="res-box energy">⚡ <span id="ui-energy">1000</span></div>
                <div class="res-box crystal">💎 <span id="ui-crystal">0</span></div>
            </div>
            <div class="res-box" style="color:#fff;">🎯 擊殺：<span id="ui-kills">0</span></div>
        </div>

        <div class="door-hp-box">
            🚪 避難所大門：<span id="ui-door-hp">1000</span> / 1000
            <div class="hp-bar-bg"><div class="hp-bar-fill" id="ui-door-bar"></div></div>
        </div>

        <div class="broadcast-box" id="broadcast-box">系統廣播：士兵，請點擊螢幕上的喪屍開火！</div>

        <div class="console">
            <div class="actions">
                <button class="btn weapon" onclick="upgradeWeapon()">🔫 升級步槍 (<span id="ui-weapon-cost">200</span>電)</button>
                <button class="btn power" id="btn-power" onclick="usePower()" disabled>🔥 釋放異能 (充能中)</button>
                <button class="btn ultimate" id="btn-ultimate" onclick="useUltimate()" disabled>☄️ 死光 (0%)</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        window.onerror = function(msg) { console.warn("防呆跳過：", msg); return true; };

        let energy = 1000, crystals = 0, kills = 0;
        let doorHp = 1000, maxDoorHp = 1000;
        let weaponLevel = 1, weaponCost = 200;
        let hasPower = false, powerType = null;
        let powerCharge = 0, ultimateCharge = 0;
        let wave = 1;
        let shakeTime = 0;

        // 3D 變數
        let scene, camera, renderer, raycaster, mouse;
        let zombies = [], particles = [];
        let doorMesh, gunMuzzle, playerModel;
        let cameraShakeOffset = new THREE.Vector3();

        const POWER_NAMES = {
            'fire': { name: '🔥 火焰風暴', color: 0xff3b3b },
            'ice': { name: '❄️ 絕對零度', color: 0x00d2d3 },
            'thunder': { name: '⚡ 雷霆萬鈞', color: 0xf1c40f },
            'psychic': { name: '🧠 念力爆破', color: 0xd500f9 }
        };

        const crosshairEl = document.getElementById('crosshair');
        function broadcast(text) { let box = document.getElementById('broadcast-box'); box.innerText = `📡 ${text}`; box.classList.add('show'); clearTimeout(window.bcTimer); window.bcTimer = setTimeout(() => box.classList.remove('show'), 3000); }

        // --- 建立精緻玩家角色 (機甲士兵) ---
        function createPlayer() {
            let group = new THREE.Group();
            let armorMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50, roughness: 0.3, metalness: 0.8 });
            let cyanMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 0.5 });
            let darkMat = new THREE.MeshStandardMaterial({ color: 0x111111 });

            let body = new THREE.Mesh(new THREE.BoxGeometry(1, 1.4, 0.6), armorMat); body.position.y = 0.7; group.add(body);
            let core = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.1, 8), cyanMat); core.rotation.x = Math.PI/2; core.position.set(0, 0.8, 0.31); group.add(core);
            let head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.6), armorMat); head.position.y = 1.65; group.add(head);
            let visor = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.15, 0.65), cyanMat); visor.position.set(0, 1.65, 0.02); group.add(visor);
            let legL = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.9, 0.4), darkMat); legL.position.set(-0.3, -0.3, 0); group.add(legL);
            let legR = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.9, 0.4), darkMat); legR.position.set(0.3, -0.3, 0); group.add(legR);
            let armR = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.8), armorMat); armR.position.set(0.6, 1, 0.4); group.add(armR);
            
            let gun = new THREE.Group();
            let gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.25, 1.2), darkMat);
            let barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.8), armorMat); barrel.rotation.x = Math.PI / 2; barrel.position.set(0, 0, -0.9);
            let scope = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.15, 0.4), cyanMat); scope.position.set(0, 0.2, 0);
            gun.add(gunBody); gun.add(barrel); gun.add(scope);
            gun.position.set(0.6, 1, 0.8); group.add(gun);

            gunMuzzle = new THREE.Object3D(); gunMuzzle.position.set(0, 0, -1.4); gun.add(gunMuzzle);
            return group;
        }

        // --- 【全新升級】建立電影級恐怖喪屍模型 ---
        function createZombieModel(isBoss) {
            let group = new THREE.Group();
            
            // 材質設定 (腐肉、破爛衣服、骨頭)
            let fleshColor = isBoss ? 0x330044 : (wave > 5 ? 0x551111 : 0x224422); // 紫/紅/綠
            let fleshMat = new THREE.MeshStandardMaterial({ color: fleshColor, roughness: 0.9, metalness: 0.1 });
            let shirtMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 }); // 破爛灰衣
            let boneMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.5 }); // 白骨
            let bloodMat = new THREE.MeshStandardMaterial({ color: 0x8b0000, roughness: 0.6 }); // 暗紅血跡
            let eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 }); // 紅光眼

            // 1. 殘破的軀幹
            let body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.5, 1.2, 8), shirtMat);
            body.position.y = 1.1; body.rotation.x = 0.3; body.rotation.z = 0.1; // 歪斜
            group.add(body);
            
            // 露出的肋骨 (幾條白色橫線)
            for(let i=0; i<3; i++) {
                let rib = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.05, 4, 8, Math.PI), boneMat);
                rib.rotation.x = Math.PI / 2; rib.rotation.z = Math.PI / 2;
                rib.position.set(0, 0.8 + i*0.25, 0.25); 
                body.add(rib);
            }

            // 2. 恐怖的頭部
            let head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 8, 8), fleshMat);
            head.position.set(0.1, 1.9, 0.2); head.rotation.z = 0.6; head.rotation.x = 0.2; // 嚴重歪頭
            group.add(head);

            // 凸出的下顎
            let jaw = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.15, 0.4), boneMat);
            jaw.position.set(0, -0.2, 0.2); jaw.rotation.x = 0.2;
            head.add(jaw);

            // 血紅發光眼
            let eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.06, 4, 4), eyeMat); eyeL.position.set(-0.1, 0.1, 0.3);
            let eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.06, 4, 4), eyeMat); eyeR.position.set(0.15, 0.1, 0.3);
            head.add(eyeL); head.add(eyeR);

            // 頭頂插住的玻璃/碎片
            let glass = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.4, 4), bloodMat);
            glass.position.set(0.1, 0.35, -0.1); glass.rotation.z = -0.3;
            head.add(glass);

            // 3. 四肢
            // 左臂 (向前伸)
            let armL = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 1, 6), fleshMat);
            armL.position.set(-0.5, 1.3, 0.5); armL.rotation.x = -Math.PI / 2 + 0.2;
            group.add(armL);
            
            // 左爪
            let clawL = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.3, 4), boneMat);
            clawL.position.set(0, 0.6, 0); armL.add(clawL);

            // 右臂 (斷掉垂低)
            let armR = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 0.6, 6), fleshMat);
            armR.position.set(0.6, 1.2, 0.1); armR.rotation.x = 0.5; armR.rotation.z = -0.2;
            group.add(armR);

            // 雙腿 (一長一短)
            let legL = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.1, 0.9, 6), fleshMat);
            legL.position.set(-0.2, 0.2, 0); group.add(legL);
            let legR = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.1, 0.7, 6), fleshMat);
            legR.position.set(0.25, 0.1, 0); legR.rotation.x = -0.2; group.add(legR);

            // 4. 喪屍王專屬武裝
            if (isBoss) {
                // 巨型尖刺
                let spikeMat = new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0x552200 });
                for(let i=0; i<6; i++) {
                    let spike = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.8, 4), spikeMat);
                    let angle = (i / 6) * Math.PI * 2;
                    spike.position.set(Math.cos(angle)*0.6, 1.2 + Math.sin(angle)*0.6, 0);
                    spike.rotation.z = -angle;
                    body.add(spike);
                }
                // 王冠
                let crownMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
                let crown = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.2, 5), crownMat);
                crown.position.set(0, 0.4, 0); head.add(crown);
            }

            group.userData.armL = armL;
            group.userData.legL = legL;
            group.userData.legR = legR;

            return group;
        }

        // --- 3D 初始化 ---
        function init3D() {
            try {
                const container = document.getElementById('canvas-container');
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x050505);
                scene.fog = new THREE.FogExp2(0x050505, 0.035);
                
                camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 3.5, 12); 
                camera.lookAt(0, 1, -5);

                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                renderer.toneMapping = THREE.ACESFilmicToneMapping;
                renderer.toneMappingExposure = 1.2;
                container.appendChild(renderer.domElement);

                raycaster = new THREE.Raycaster();
                mouse = new THREE.Vector2();
                renderer.domElement.addEventListener('pointerdown', onShoot);
                renderer.domElement.addEventListener('pointermove', onAim);

                scene.add(new THREE.AmbientLight(0x223344, 0.8));
                const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
                dirLight.position.set(0, 10, 10); scene.add(dirLight);
                const doorLight = new THREE.PointLight(0xff0000, 3, 25); doorLight.position.set(0, 2, -19); scene.add(doorLight);
                const cyanLightL = new THREE.PointLight(0x00ffff, 1, 15); cyanLightL.position.set(-10, 3, 0); scene.add(cyanLightL);
                const cyanLightR = new THREE.PointLight(0x00ffff, 1, 15); cyanLightR.position.set(10, 3, 0); scene.add(cyanLightR);

                // 走廊場景
                const floorGeo = new THREE.PlaneGeometry(24, 50);
                const floorMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2, metalness: 0.8 });
                const floor = new THREE.Mesh(floorGeo, floorMat);
                floor.rotation.x = -Math.PI / 2; floor.position.set(0, -1, -15); scene.add(floor);

                const grid = new THREE.GridHelper(50, 20, 0x00ffff, 0x003333);
                grid.position.set(0, -0.9, -15); scene.add(grid);

                const wallMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.8 });
                const pipeMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 1, roughness: 0.4 });
                
                const leftWall = new THREE.Mesh(new THREE.BoxGeometry(1, 10, 50), wallMat); leftWall.position.set(-12, 4, -15); scene.add(leftWall);
                const rightWall = new THREE.Mesh(new THREE.BoxGeometry(1, 10, 50), wallMat); rightWall.position.set(12, 4, -15); scene.add(rightWall);

                for(let z = 5; z > -25; z -= 8) {
                    let pipeL = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 8), pipeMat);
                    pipeL.rotation.x = Math.PI/2; pipeL.position.set(-11, 6, z); scene.add(pipeL);
                    let pipeR = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 8), pipeMat);
                    pipeR.rotation.x = Math.PI/2; pipeR.position.set(11, 6, z); scene.add(pipeR);
                }

                doorMesh = new THREE.Mesh(new THREE.BoxGeometry(20, 10, 1), new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.9, roughness: 0.2 }));
                doorMesh.position.set(0, 4, -20); scene.add(doorMesh);
                for(let i=0; i<4; i++) {
                    let stripe = new THREE.Mesh(new THREE.BoxGeometry(20, 0.5, 1.1), new THREE.MeshBasicMaterial({ color: 0xffaa00 }));
                    stripe.position.set(0, i*2, -20); scene.add(stripe);
                }

                playerModel = createPlayer();
                playerModel.position.set(0, -1, 5);
                scene.add(playerModel);

                window.addEventListener('resize', onWindowResize, false);
                animate();
            } catch(e) { console.error("3D 失敗", e); }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- 瞄準 ---
        function onAim(event) {
            crosshairEl.style.display = 'block';
            crosshairEl.style.left = event.clientX + 'px';
            crosshairEl.style.top = event.clientY + 'px';

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            
            let plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 20);
            let targetPoint = new THREE.Vector3();
            raycaster.ray.intersectPlane(plane, targetPoint);

            if (targetPoint && playerModel) {
                playerModel.lookAt(targetPoint.x, playerModel.position.y, targetPoint.z);
            }
        }

        // --- 開火 ---
        function onShoot(event) {
            playerModel.position.z = 5.2; 
            setTimeout(() => playerModel.position.z = 5, 50);

            let startPos = new THREE.Vector3();
            gunMuzzle.getWorldPosition(startPos);

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            let allZombies = zombies.map(z => z.mesh);
            let intersects = raycaster.intersectObjects(allZombies, true);
            
            let endPos = new THREE.Vector3();
            if (intersects.length > 0) {
                endPos = intersects[0].point;
                // 向上尋找 group root (因為有好多子物件)
                let hitGroup = intersects[0].object;
                while (hitGroup.parent && !hitGroup.userData.legL) {
                    hitGroup = hitGroup.parent;
                }
                let targetZ = zombies.find(z => z.mesh === hitGroup);
                if (targetZ) {
                    targetZ.hp -= (weaponLevel * 50);
                    createHitEffect(endPos, 0xff0000); 
                    if (targetZ.hp <= 0) killZombie(targetZ);
                }
            } else {
                raycaster.ray.at(50, endPos);
            }

            let flash = new THREE.PointLight(0x00ffff, 2, 5);
            flash.position.copy(startPos); scene.add(flash);
            setTimeout(() => scene.remove(flash), 50);

            let beamGeo = new THREE.BufferGeometry().setFromPoints([startPos, endPos]);
            let beamMat = new THREE.LineBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 1 });
            let beam = new THREE.Line(beamGeo, beamMat);
            scene.add(beam);
            setTimeout(() => scene.remove(beam), 50);
        }

        // --- 主循環 ---
        function animate() {
            requestAnimationFrame(animate);
            try {
                if (shakeTime > 0) {
                    shakeTime -= 0.016;
                    cameraShakeOffset.set((Math.random()-0.5)*0.5, (Math.random()-0.5)*0.5, 0);
                    camera.position.copy(new THREE.Vector3(0, 3.5, 12).add(cameraShakeOffset));
                } else {
                    camera.position.lerp(new THREE.Vector3(0, 3.5, 12), 0.1);
                }
                camera.lookAt(0, 1, -5);

                for (let i = zombies.length - 1; i >= 0; i--) {
                    let z = zombies[i];
                    z.mesh.position.z += z.speed; 
                    
                    // 恐怖蹣跚動畫
                    let t = Date.now() * 0.008;
                    z.mesh.userData.legL.rotation.x = Math.sin(t) * 0.5;
                    z.mesh.userData.legR.rotation.x = Math.sin(t + Math.PI) * 0.3; // 一拐一拐
                    z.mesh.userData.armL.rotation.x = -Math.PI / 2 + Math.sin(t*0.5) * 0.2;
                    z.mesh.rotation.z = Math.sin(t*0.5) * 0.08; // 全身搖擺

                    if (z.mesh.position.z >= -20) {
                        z.mesh.position.z = -20;
                        doorHp -= z.dmg * 0.016;
                        if (doorHp < 0) doorHp = 0;
                        if (Math.random() < 0.1) shakeTime = 0.1;
                    }
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.mesh.position.add(p.velocity);
                    p.velocity.y -= 0.1; 
                    p.mesh.rotation.x += 0.1; p.mesh.rotation.y += 0.1;
                    p.life -= 0.02;
                    p.mesh.material.opacity = p.life;
                    if (p.life <= 0) { scene.remove(p.mesh); particles.splice(i, 1); }
                }

                if (powerCharge < 100) powerCharge += 0.2;
                if (ultimateCharge < 100) ultimateCharge += 0.1;
                updateUI();

                renderer.render(scene, camera);
            } catch(e) {}
        }

        // --- 生成喪屍 ---
        function spawnZombie(isBoss = false) {
            let size = isBoss ? 2.2 : (wave > 5 ? 1.2 : 1);
            let hp = isBoss ? 3000 : (wave > 5 ? 300 : 100);
            
            let group = createZombieModel(isBoss);
            // 生成喺遠處，隨機位置
            group.position.set((Math.random() - 0.5) * 18, -1, -35 - Math.random()*10);
            group.scale.set(size, size, size);
            scene.add(group);
            
            zombies.push({ mesh: group, hp: hp, speed: isBoss ? 0.03 : 0.06, dmg: isBoss ? 50 : 10 });
            
            if (isBoss) {
                broadcast("🚨 警告：巨型喪屍王從走廊深處逼近！");
                shakeTime = 0.5;
            }
        }

        function killZombie(z) {
            createHitEffect(z.mesh.position, 0xffaa00);
            scene.remove(z.mesh);
            zombies = zombies.filter(item => item !== z);
            
            kills++;
            crystals += z.mesh.scale.x > 1.5 ? 20 : 2;
            energy += z.mesh.scale.x > 1.5 ? 500 : 50;
            ultimateCharge = Math.min(100, ultimateCharge + 8);
            shakeTime = z.mesh.scale.x > 1.5 ? 0.5 : 0.1;
        }

        function createHitEffect(pos, color) {
            for(let i=0; i<12; i++) {
                let geo = new THREE.BoxGeometry(0.15, 0.15, 0.15);
                let mat = new THREE.MeshBasicMaterial({ color: color, transparent: true });
                let mesh = new THREE.Mesh(geo, mat);
                mesh.position.copy(pos);
                scene.add(mesh);
                particles.push({
                    mesh: mesh, life: 1,
                    velocity: new THREE.Vector3((Math.random()-0.5)*0.8, Math.random()*0.8, (Math.random()-0.5)*0.8)
                });
            }
        }

        // --- 按鈕 ---
        function upgradeWeapon() {
            if (energy < weaponCost) return;
            energy -= weaponCost; weaponLevel++; weaponCost = Math.floor(weaponCost * 1.5);
            broadcast(`🔫 步槍升級至 Lv.${weaponLevel}！傷害大增！`);
        }

        function usePower() {
            if (!hasPower || powerCharge < 100) return;
            powerCharge = 0;
            broadcast(`💥 釋放異能：${POWER_NAMES[powerType].name}！`);
            shakeTime = 0.8;
            zombies.forEach(z => { z.hp -= 500; createHitEffect(z.mesh.position, POWER_NAMES[powerType].color); if(z.hp<=0) killZombie(z); });
        }

        function useUltimate() {
            if (ultimateCharge < 100) return;
            ultimateCharge = 0;
            broadcast("☄️ 軌道死光從天而降！全場蒸發！");
            shakeTime = 1.5;
            let flash = document.createElement('div');
            flash.style.cssText = 'position:absolute; inset:0; background:#fff; z-index:999; opacity:1; transition:opacity 0.5s; pointer-events:none;';
            document.body.appendChild(flash); setTimeout(() => { flash.style.opacity = '0'; setTimeout(() => flash.remove(), 500); }, 100);
            zombies.forEach(z => { z.hp -= 9999; createHitEffect(z.mesh.position, 0xf1c40f); if(z.hp<=0) killZombie(z); });
        }

        function updateUI() {
            document.getElementById('ui-energy').innerText = Math.floor(energy);
            document.getElementById('ui-crystal').innerText = Math.floor(crystals);
            document.getElementById('ui-kills').innerText = kills;
            document.getElementById('ui-door-hp').innerText = Math.floor(doorHp);
            document.getElementById('ui-door-bar').style.width = `${(doorHp/maxDoorHp)*100}%`;
            document.getElementById('ui-weapon-cost').innerText = weaponCost;

            let pBtn = document.getElementById('btn-power');
            if (!hasPower && crystals >= 10) {
                crystals -= 10; hasPower = true;
                let keys = Object.keys(POWER_NAMES); powerType = keys[Math.floor(Math.random() * keys.length)];
                pBtn.disabled = false; pBtn.style.color = '#' + POWER_NAMES[powerType].color.toString(16).padStart(6, '0');
                broadcast(`💎 解鎖異能：${POWER_NAMES[powerType].name}！`);
            } else if (hasPower) {
                if (powerCharge >= 100) { pBtn.disabled = false; pBtn.innerText = `🔥 異能就緒`; }
                else { pBtn.disabled = true; pBtn.innerText = `🔥 充能 (${Math.floor(powerCharge)}%)`; }
            }

            let uBtn = document.getElementById('btn-ultimate');
            if (ultimateCharge >= 100) { uBtn.disabled = false; uBtn.innerText = '☄️ 死光就緒'; }
            else { uBtn.disabled = true; uBtn.innerText = `☄️ 死光 (${Math.floor(ultimateCharge)}%)`; }
        }

        setInterval(() => { if (doorHp <= 0) { broadcast("💀 大門被攻破！遊戲結束。"); setTimeout(() => location.reload(), 2000); } }, 1000);

        let spawnTimer = 0;
        setInterval(() => {
            spawnTimer++;
            if (spawnTimer % 2 === 0) spawnZombie(false);
            if (spawnTimer % 15 === 0) { spawnZombie(true); wave++; }
        }, 1000);

        window.onload = () => {
            init3D(); 
            setTimeout(() => { spawnZombie(false); broadcast("士兵，喪屍從前方走廊來襲！點擊螢幕開火！"); }, 1000);
        };
    </script>
</body>
</html>
