<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>☢️ 末日避難所：第三人稱防線</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+HK:wght@400;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
    body { background: #000; color: #fff; font-family: 'Noto Sans HK', sans-serif; height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; cursor: crosshair; }
    
    #canvas-container { position: absolute; inset: 0; z-index: 1; }
    canvas { display: block; width: 100%; height: 100%; }

    .ui-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
    .ui-layer > * { pointer-events: auto; }

    .back-btn { position: absolute; top: 15px; left: 15px; padding: 8px 16px; background: rgba(0,0,0,0.8); color: #ffaa00; border: 1px solid #ffaa00; border-radius: 4px; text-decoration: none; font-family: 'Orbitron', sans-serif; font-weight: bold; font-size: 13px; z-index: 100; }
    
    .hud-top { display: flex; justify-content: space-between; padding: 15px; background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 100%); font-family: 'Orbitron', sans-serif; flex-wrap: wrap; gap: 10px; }
    .res-group { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .res-box { display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: bold; background: rgba(20,20,20,0.85); padding: 6px 12px; border-radius: 4px; border: 1px solid #333; }
    .res-box.energy { color: #f1c40f; border-color: #f1c40f; } .res-box.crystal { color: #e056fd; border-color: #e056fd; }
    
    .door-hp-box { position: absolute; top: 70px; left: 50%; transform: translateX(-50%); font-size: 13px; font-weight: bold; color: #ff3b3b; text-align: center; width: 80%; max-width: 400px; }
    .hp-bar-bg { width: 100%; height: 8px; background: #333; border-radius: 4px; margin-top: 5px; overflow: hidden; border: 1px solid #ff3b3b; }
    .hp-bar-fill { height: 100%; background: #ff3b3b; width: 100%; transition: width 0.3s; }

    /* 準星 (改為動態追蹤) */
    .crosshair { position: absolute; width: 30px; height: 30px; transform: translate(-50%, -50%); pointer-events: none; z-index: 50; opacity: 0.8; display: none; }
    .crosshair::before, .crosshair::after { content: ''; position: absolute; background: #00d2d3; box-shadow: 0 0 5px #00d2d3; }
    .crosshair::before { top: 14px; left: 0; width: 30px; height: 2px; }
    .crosshair::after { left: 14px; top: 0; width: 2px; height: 30px; }

    .console { margin: 10px; background: rgba(10,10,10,0.95); border: 1px solid #444; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; max-width: 600px; margin-left: auto; margin-right: auto; width: calc(100% - 20px); pointer-events: auto; }
    
    .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .btn { padding: 10px 4px; background: #1a1a1a; color: #ccc; border: 1px solid #444; border-radius: 5px; font-weight: bold; font-size: 12px; cursor: pointer; text-align: center; transition: 0.1s; }
    .btn:active { transform: scale(0.95); }
    .btn.weapon { border-color: #f1c40f; color: #f1c40f; background: rgba(241,196,15,0.1); }
    .btn.power { border-color: #d500f9; color: #d500f9; background: rgba(213,0,249,0.1); }
    .btn.ultimate { background: linear-gradient(45deg, #ff3b3b, #f1c40f); color: #000; font-size: 14px; border: none; box-shadow: 0 0 15px rgba(255,59,59,0.5); border-radius: 8px; }
    .btn.ultimate:disabled { background: #333; color: #666; box-shadow: none; pointer-events: none; }

    .broadcast-box { position: absolute; top: 110px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 500px; background: rgba(255, 170, 0, 0.15); border: 1px solid #ffaa00; color: #ffaa00; padding: 8px; font-size: 12px; text-align: center; border-radius: 4px; font-weight: bold; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 20; }
    .broadcast-box.show { opacity: 1; }
</style>
</head>
<body>

    <a href="../" class="back-btn">⬅ 返回大廳</a>
    <div class="crosshair" id="crosshair"></div>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <div class="hud-top">
            <div class="res-group">
                <div class="res-box energy">⚡ <span id="ui-energy">1000</span></div>
                <div class="res-box crystal">💎 <span id="ui-crystal">0</span></div>
            </div>
            <div class="res-box" style="color:#fff;">🎯 擊殺：<span id="ui-kills">0</span></div>
        </div>

        <div class="door-hp-box">
            🚪 避難所大門：<span id="ui-door-hp">1000</span> / 1000
            <div class="hp-bar-bg"><div class="hp-bar-fill" id="ui-door-bar"></div></div>
        </div>

        <div class="broadcast-box" id="broadcast-box">系統廣播：士兵，請點擊螢幕上的喪屍開火！</div>

        <div class="console">
            <div class="actions">
                <button class="btn weapon" onclick="upgradeWeapon()">🔫 升級步槍 (<span id="ui-weapon-cost">200</span>電)</button>
                <button class="btn power" id="btn-power" onclick="usePower()" disabled>🔥 釋放異能 (充能中)</button>
                <button class="btn ultimate" id="btn-ultimate" onclick="useUltimate()" disabled>☄️ 死光 (0%)</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        window.onerror = function(msg) { console.warn("防呆跳過：", msg); return true; };

        let energy = 1000, crystals = 0, kills = 0;
        let doorHp = 1000, maxDoorHp = 1000;
        let weaponLevel = 1, weaponCost = 200;
        let hasPower = false, powerType = null;
        let powerCharge = 0, ultimateCharge = 0;
        let wave = 1;

        // 3D 變數
        let scene, camera, renderer, raycaster, mouse;
        let zombies = [], particles = [], bullets = [];
        let doorMesh;
        let playerModel; // 玩家角色模型
        let gunMuzzle; // 槍口位置

        const POWER_NAMES = {
            'fire': { name: '🔥 火焰風暴', color: 0xff3b3b },
            'ice': { name: '❄️ 絕對零度', color: 0x00d2d3 },
            'thunder': { name: '⚡ 雷霆萬鈞', color: 0xf1c40f },
            'psychic': { name: '🧠 念力爆破', color: 0xd500f9 }
        };

        const crosshairEl = document.getElementById('crosshair');

        function broadcast(text) { let box = document.getElementById('broadcast-box'); box.innerText = `📡 ${text}`; box.classList.add('show'); clearTimeout(window.bcTimer); window.bcTimer = setTimeout(() => box.classList.remove('show'), 3000); }

        // --- 建立玩家角色 (第三人稱) ---
        function createPlayer() {
            let group = new THREE.Group();
            let bodyMat = new THREE.MeshStandardMaterial({ color: 0x00d2d3, roughness: 0.5 });
            let darkMat = new THREE.MeshStandardMaterial({ color: 0x111111 });

            // 身體
            let body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.5), bodyMat); body.position.y = 0.5; group.add(body);
            // 頭
            let head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 8, 8), bodyMat); head.position.y = 1.4; group.add(head);
            // 腳
            let legL = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.8, 0.25), darkMat); legL.position.set(-0.25, -0.4, 0); group.add(legL);
            let legR = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.8, 0.25), darkMat); legR.position.set(0.25, -0.4, 0); group.add(legR);
            
            // 右手持槍 (伸向前面)
            let armR = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.6, 0.2), bodyMat);
            armR.position.set(0.5, 0.6, 0.3); armR.rotation.x = -Math.PI / 2;
            group.add(armR);
            
            // 槍枝模型
            let gun = new THREE.Group();
            let gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.2, 0.8), darkMat);
            let barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.6), darkMat);
            barrel.rotation.x = Math.PI / 2; barrel.position.set(0, 0, -0.6);
            gun.add(gunBody); gun.add(barrel);
            gun.position.set(0.5, 0.6, 0.6); // 握喺右手
            group.add(gun);

            // 槍口發光點 (用於計算子彈起點)
            gunMuzzle = new THREE.Object3D();
            gunMuzzle.position.set(0, 0, -1);
            gun.add(gunMuzzle);

            return group;
        }

        // --- 3D 初始化 ---
        function init3D() {
            try {
                const container = document.getElementById('canvas-container');
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x050505);
                scene.fog = new THREE.FogExp2(0x050505, 0.025);
                
                camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
                // 第三人稱鏡頭：企喺玩家後上方
                camera.position.set(0, 4, 12); 
                camera.lookAt(0, 1, -5);

                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                container.appendChild(renderer.domElement);

                raycaster = new THREE.Raycaster();
                mouse = new THREE.Vector2();
                renderer.domElement.addEventListener('pointerdown', onShoot);
                renderer.domElement.addEventListener('pointermove', onAim);

                // 燈光
                scene.add(new THREE.AmbientLight(0xffffff, 0.5));
                const dirLight = new THREE.DirectionalLight(0xffeedd, 1.0);
                dirLight.position.set(0, 10, 10); scene.add(dirLight);
                const doorLight = new THREE.PointLight(0xff0000, 2, 20); doorLight.position.set(0, 2, -15); scene.add(doorLight);

                // 走廊場景
                const floorGeo = new THREE.PlaneGeometry(24, 50);
                const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9 });
                const floor = new THREE.Mesh(floorGeo, floorMat);
                floor.rotation.x = -Math.PI / 2; floor.position.set(0, -1, -15); scene.add(floor);

                const wallMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a });
                const leftWall = new THREE.Mesh(new THREE.BoxGeometry(1, 10, 50), wallMat); leftWall.position.set(-12, 4, -15); scene.add(leftWall);
                const rightWall = new THREE.Mesh(new THREE.BoxGeometry(1, 10, 50), wallMat); rightWall.position.set(12, 4, -15); scene.add(rightWall);

                doorMesh = new THREE.Mesh(new THREE.BoxGeometry(24, 10, 1), new THREE.MeshStandardMaterial({ color: 0x555555, metalness: 0.8 }));
                doorMesh.position.set(0, 4, -20); scene.add(doorMesh);

                // 生成玩家
                playerModel = createPlayer();
                playerModel.position.set(0, -1, 5); // 企喺中間
                scene.add(playerModel);

                window.addEventListener('resize', onWindowResize, false);
                animate();
            } catch(e) { console.error("3D 失敗", e); }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- 玩家瞄準 (準星跟隨手指/滑鼠) ---
        function onAim(event) {
            // 將準星 UI 移動到手指位置
            crosshairEl.style.display = 'block';
            crosshairEl.style.left = event.clientX + 'px';
            crosshairEl.style.top = event.clientY + 'px';

            // 計算 3D 空間中嘅交點
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            
            // 投射到 Z = -20 嘅平面 (大門位置)
            let plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 20);
            let targetPoint = new THREE.Vector3();
            raycaster.ray.intersectPlane(plane, targetPoint);

            // 令玩家轉向瞄準點
            if (targetPoint && playerModel) {
                playerModel.lookAt(targetPoint.x, playerModel.position.y, targetPoint.z);
            }
        }

        // --- 玩家開火 ---
        function onShoot(event) {
            // 槍械後座力動畫
            playerModel.position.z = 5.1; 
            setTimeout(() => playerModel.position.z = 5, 50);

            // 取得槍口世界座標
            let startPos = new THREE.Vector3();
            gunMuzzle.getWorldPosition(startPos);

            // 射線檢測
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            let allZombies = zombies.map(z => z.mesh);
            let intersects = raycaster.intersectObjects(allZombies, true);
            
            let endPos = new THREE.Vector3();
            if (intersects.length > 0) {
                endPos = intersects[0].point;
                let hitGroup = intersects[0].object.parent;
                let targetZ = zombies.find(z => z.mesh === hitGroup);
                if (targetZ) {
                    targetZ.hp -= (weaponLevel * 50);
                    createHitEffect(endPos, 0xff0000); 
                    if (targetZ.hp <= 0) killZombie(targetZ);
                }
            } else {
                // 冇打中，射向遠處
                raycaster.ray.at(50, endPos);
            }

            // 畫出子彈軌跡 (黃色光束)
            let beamGeo = new THREE.BufferGeometry().setFromPoints([startPos, endPos]);
            let beamMat = new THREE.LineBasicMaterial({ color: 0xf1c40f, transparent: true, opacity: 0.8 });
            let beam = new THREE.Line(beamGeo, beamMat);
            scene.add(beam);
            setTimeout(() => scene.remove(beam), 50);
        }

        // --- 主循環 ---
        function animate() {
            requestAnimationFrame(animate);
            try {
                // 喪屍移動
                for (let i = zombies.length - 1; i >= 0; i--) {
                    let z = zombies[i];
                    // 喪屍由 Z = -40 行向 Z = -20 (大門)
                    z.mesh.position.z += z.speed; 
                    
                    let t = Date.now() * 0.01;
                    z.mesh.rotation.z = Math.sin(t) * 0.1;
                    z.mesh.children[0].rotation.x = 0.5 + Math.sin(t) * 0.2;

                    if (z.mesh.position.z >= -20) {
                        z.mesh.position.z = -20;
                        doorHp -= z.dmg * 0.016;
                        if (doorHp < 0) doorHp = 0;
                    }
                }

                // 粒子
                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.mesh.position.add(p.velocity);
                    p.velocity.y -= 0.05; 
                    p.life -= 0.02;
                    p.mesh.material.opacity = p.life;
                    if (p.life <= 0) { scene.remove(p.mesh); particles.splice(i, 1); }
                }

                if (powerCharge < 100) powerCharge += 0.2;
                if (ultimateCharge < 100) ultimateCharge += 0.1;
                updateUI();

                renderer.render(scene, camera);
            } catch(e) {}
        }

        // --- 生成喪屍 ---
        function spawnZombie(isBoss = false) {
            let color = isBoss ? 0x9b59b6 : (wave > 5 ? 0xe74c3c : 0x2ecc71);
            let size = isBoss ? 2 : (wave > 5 ? 1.2 : 1);
            let hp = isBoss ? 3000 : (wave > 5 ? 300 : 100);
            
            let group = new THREE.Group();
            let bodyMat = new THREE.MeshStandardMaterial({ color: color });
            
            let body = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), bodyMat); body.position.y = 1; group.add(body);
            let head = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 8), bodyMat); head.position.y = 2.5; group.add(head);
            let eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            head.add(new THREE.Mesh(new THREE.SphereGeometry(0.1, 4, 4), eyeMat)).position.set(-0.2, 0.1, -0.4);
            head.add(new THREE.Mesh(new THREE.SphereGeometry(0.1, 4, 4), eyeMat)).position.set(0.2, 0.1, -0.4);

            // 生成喺好遠 (Z = -35 到 -45)
            group.position.set((Math.random() - 0.5) * 16, 0, -35 - Math.random()*10);
            group.scale.set(size, size, size);
            scene.add(group);
            
            zombies.push({ mesh: group, hp: hp, speed: isBoss ? 0.05 : 0.08, dmg: isBoss ? 50 : 10 });
            
            if (isBoss) broadcast("🚨 警告：巨型喪屍王從走廊深處逼近！");
        }

        function killZombie(z) {
            createHitEffect(z.mesh.position, 0x2ecc71);
            scene.remove(z.mesh);
            zombies = zombies.filter(item => item !== z);
            
            kills++;
            crystals += 2;
            energy += 50;
            ultimateCharge = Math.min(100, ultimateCharge + 8);
        }

        function createHitEffect(pos, color) {
            for(let i=0; i<8; i++) {
                let geo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
                let mat = new THREE.MeshBasicMaterial({ color: color, transparent: true });
                let mesh = new THREE.Mesh(geo, mat);
                mesh.position.copy(pos);
                scene.add(mesh);
                particles.push({
                    mesh: mesh, life: 1,
                    velocity: new THREE.Vector3((Math.random()-0.5)*0.5, Math.random()*0.5, (Math.random()-0.5)*0.5)
                });
            }
        }

        // --- 按鈕 ---
        function upgradeWeapon() {
            if (energy < weaponCost) return;
            energy -= weaponCost; weaponLevel++; weaponCost = Math.floor(weaponCost * 1.5);
            broadcast(`🔫 步槍升級至 Lv.${weaponLevel}！`);
        }

        function usePower() {
            if (!hasPower || powerCharge < 100) return;
            powerCharge = 0;
            broadcast(`💥 釋放異能：${POWER_NAMES[powerType].name}！`);
            zombies.forEach(z => { z.hp -= 500; createHitEffect(z.mesh.position, POWER_NAMES[powerType].color); if(z.hp<=0) killZombie(z); });
        }

        function useUltimate() {
            if (ultimateCharge < 100) return;
            ultimateCharge = 0;
            broadcast("☄️ 軌道死光從天而降！全場蒸發！");
            let flash = document.createElement('div');
            flash.style.cssText = 'position:absolute; inset:0; background:#fff; z-index:999; opacity:1; transition:opacity 0.5s; pointer-events:none;';
            document.body.appendChild(flash); setTimeout(() => { flash.style.opacity = '0'; setTimeout(() => flash.remove(), 500); }, 100);
            zombies.forEach(z => { z.hp -= 9999; createHitEffect(z.mesh.position, 0xf1c40f); if(z.hp<=0) killZombie(z); });
        }

        function updateUI() {
            document.getElementById('ui-energy').innerText = Math.floor(energy);
            document.getElementById('ui-crystal').innerText = Math.floor(crystals);
            document.getElementById('ui-kills').innerText = kills;
            document.getElementById('ui-door-hp').innerText = Math.floor(doorHp);
            document.getElementById('ui-door-bar').style.width = `${(doorHp/maxDoorHp)*100}%`;
            document.getElementById('ui-weapon-cost').innerText = weaponCost;

            let pBtn = document.getElementById('btn-power');
            if (!hasPower && crystals >= 10) {
                crystals -= 10; hasPower = true;
                let keys = Object.keys(POWER_NAMES); powerType = keys[Math.floor(Math.random() * keys.length)];
                pBtn.disabled = false; pBtn.style.color = '#' + POWER_NAMES[powerType].color.toString(16).padStart(6, '0');
                broadcast(`💎 解鎖異能：${POWER_NAMES[powerType].name}！`);
            } else if (hasPower) {
                if (powerCharge >= 100) { pBtn.disabled = false; pBtn.innerText = `🔥 異能就緒`; }
                else { pBtn.disabled = true; pBtn.innerText = `🔥 充能 (${Math.floor(powerCharge)}%)`; }
            }

            let uBtn = document.getElementById('btn-ultimate');
            if (ultimateCharge >= 100) { uBtn.disabled = false; uBtn.innerText = '☄️ 死光就緒'; }
            else { uBtn.disabled = true; uBtn.innerText = `☄️ 死光 (${Math.floor(ultimateCharge)}%)`; }
        }

        setInterval(() => { if (doorHp <= 0) { broadcast("💀 大門被攻破！遊戲結束。"); setTimeout(() => location.reload(), 2000); } }, 1000);

        let spawnTimer = 0;
        setInterval(() => {
            spawnTimer++;
            if (spawnTimer % 2 === 0) spawnZombie(false);
            if (spawnTimer % 15 === 0) { spawnZombie(true); wave++; }
        }, 1000);

        window.onload = () => {
            init3D(); 
            setTimeout(() => { spawnZombie(false); broadcast("士兵，喪屍從前方走廊來襲！點擊螢幕開火！"); }, 1000);
        };
    </script>
</body>
</html>
