<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>☢️ 末日避難所：地下城生存</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+HK:wght@400;700&display=swap');
    
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
    
    body { 
        background: #000; color: #ccc; font-family: 'Noto Sans HK', sans-serif; 
        height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; 
    }

    /* 3D 畫布 */
    #canvas-container { position: absolute; inset: 0; z-index: 1; }
    canvas { display: block; width: 100%; height: 100%; }

    /* UI 層 */
    .ui-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
    .ui-layer > * { pointer-events: auto; }

    /* 返回大廳 */
    .back-btn { 
        position: absolute; top: 15px; left: 15px; padding: 8px 16px; 
        background: rgba(0,0,0,0.8); color: #ffaa00; border: 1px solid #ffaa00; 
        border-radius: 4px; text-decoration: none; font-family: 'Orbitron', sans-serif; 
        font-weight: bold; font-size: 13px; z-index: 100; box-shadow: 0 0 10px rgba(255,170,0,0.3); 
        transition: 0.2s;
    }
    .back-btn:active { transform: scale(0.95); background: #ffaa00; color: #000; }
    
    /* 頂部資源列 */
    .hud-top { 
        display: flex; justify-content: center; gap: 10px; padding: 15px; 
        background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 100%); 
        font-family: 'Orbitron', sans-serif; flex-wrap: wrap;
    }
    .res-box { 
        display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: bold; 
        background: rgba(20,20,20,0.85); padding: 6px 12px; border-radius: 4px; 
        border: 1px solid #333; box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }
    .res-box.energy { color: #f1c40f; border-color: #f1c40f; }
    .res-box.water { color: #00d2d3; border-color: #00d2d3; }
    .res-box.food { color: #2ecc71; border-color: #2ecc71; }
    .res-box.crystal { color: #e056fd; border-color: #e056fd; }

    /* 廣播文字 */
    .broadcast-box { 
        position: absolute; top: 70px; left: 50%; transform: translateX(-50%); 
        width: 90%; max-width: 500px; background: rgba(255, 170, 0, 0.1); 
        border: 1px solid #ffaa00; color: #ffaa00; padding: 10px; font-size: 12px; 
        text-align: center; border-radius: 4px; font-weight: bold; opacity: 0; 
        transition: opacity 0.3s; pointer-events: none; box-shadow: 0 0 15px rgba(255,170,0,0.2);
    }
    .broadcast-box.show { opacity: 1; }

    /* 居民列表 */
    .pop-list { 
        position: absolute; right: 15px; top: 70px; width: 160px; background: rgba(0,0,0,0.85); 
        border: 1px solid #444; border-radius: 5px; padding: 10px; font-size: 11px; 
        box-shadow: 0 0 10px rgba(0,0,0,0.8); backdrop-filter: blur(5px);
    }
    .pop-list h4 { color: #fff; margin-bottom: 8px; font-size: 12px; border-bottom: 1px solid #333; padding-bottom: 4px; }
    .pop-item { display: flex; justify-content: space-between; margin-bottom: 4px; padding: 2px 0; }
    .pop-item .awakened { color: #e056fd; font-weight: bold; text-shadow: 0 0 5px #e056fd; }

    /* 底部控制台 */
    .console { 
        margin: 15px; background: rgba(15,15,15,0.95); border: 1px solid #444; 
        border-radius: 8px; padding: 15px; display: flex; flex-direction: column; gap: 10px; 
        max-width: 600px; margin-left: auto; margin-right: auto; width: calc(100% - 30px); 
        box-shadow: 0 -5px 20px rgba(0,0,0,0.8);
    }
    
    .weather-status { 
        display: flex; justify-content: space-between; align-items: center; 
        font-size: 13px; padding-bottom: 10px; border-bottom: 1px solid #333; color: #aaa; 
    }
    .weather-status span { font-weight: bold; }

    .actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .btn { 
        padding: 10px 5px; background: #1a1a1a; color: #ccc; border: 1px solid #444; 
        border-radius: 5px; font-weight: bold; font-size: 12px; cursor: pointer; 
        text-align: center; transition: 0.1s; 
    }
    .btn:active { transform: scale(0.95); }
    .btn.active { background: #333; border-color: #ffaa00; color: #ffaa00; box-shadow: 0 0 10px rgba(255,170,0,0.3); }
    .btn.crystal-btn { color: #e056fd; border-color: #e056fd; background: rgba(224,86,253,0.1); }
    .btn.crystal-btn:active { background: #e056fd; color: #000; }

    @media (max-width: 400px) {
        .res-box { font-size: 11px; padding: 4px 8px; }
        .pop-list { width: 130px; font-size: 10px; }
        .btn { font-size: 11px; padding: 8px 4px; }
    }
</style>
</head>
<body>

    <a href="../" class="back-btn">⬅ 返回大廳</a>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <!-- 頂部資源 -->
        <div class="hud-top">
            <div class="res-box energy">⚡ <span id="ui-energy">100</span></div>
            <div class="res-box water">💧 <span id="ui-water">100</span></div>
            <div class="res-box food">🥩 <span id="ui-food">100</span></div>
            <div class="res-box crystal">💎 <span id="ui-crystal">0</span></div>
        </div>

        <div class="broadcast-box" id="broadcast-box">系統廣播：避難所已啟動</div>

        <!-- 居民狀態 -->
        <div class="pop-list" id="pop-list">
            <h4>👥 居民狀態</h4>
            <!-- 動態生成 -->
        </div>

        <!-- 底部控制台 -->
        <div class="console">
            <div class="weather-status">
                <div>🌍 地表天氣：<span id="ui-weather">晴天</span></div>
                <div>☢️ 輻射：<span id="ui-rad">5%</span></div>
            </div>
            
            <div class="actions">
                <button class="btn active" id="btn-speak" onclick="toggleSpeech()">🔊 語音：開</button>
                <button class="btn active" id="btn-auto" onclick="toggleAutoWeather()">🔄 自動天氣：開</button>
                <button class="btn" onclick="allocate('power')">⚡ 分配發電</button>
                <button class="btn" onclick="allocate('water')">💧 分配淨水</button>
            </div>
            
            <div class="actions" style="grid-template-columns: repeat(3, 1fr);">
                <button class="btn" style="color:#aaa;" onclick="setWeather('clear')">☀️ 晴天</button>
                <button class="btn" style="color:#00d2d3;" onclick="setWeather('rain')">🌧️ 落雨</button>
                <button class="btn" style="color:#2ecc71;" onclick="setWeather('acid_rain')">☢️ 酸雨</button>
            </div>

            <div class="actions" style="grid-template-columns: 1fr;">
                <button class="btn crystal-btn" onclick="forceAwaken()">💎 強制覺醒 (消耗 10 晶石)</button>
            </div>
        </div>
    </div>

    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        window.onerror = function(msg) { console.warn("防呆跳過：", msg); return true; };

        // --- 遊戲數據 ---
        let energy = 100, water = 100, food = 100, crystals = 0;
        let weather = 'clear'; // clear, rain, acid_rain
        let weatherTimer = 20;
        let autoWeather = true;
        let speechEnabled = true;
        
        let residents = [
            { id: 1, name: '平民 #042', awakened: false, job: 'idle' },
            { id: 2, name: '平民 #109', awakened: false, job: 'idle' }
        ];

        // --- 語音系統 ---
        let synth = window.speechSynthesis;
        function speak(text) {
            if (!speechEnabled || !synth) return;
            try {
                synth.cancel(); // 停止當前語音
                let utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'zh-HK';
                utter.rate = 1.0;
                utter.pitch = 0.8; // 低沉機械感
                synth.speak(utter);
            } catch(e) {}
        }
        
        function toggleSpeech() {
            speechEnabled = !speechEnabled;
            let btn = document.getElementById('btn-speak');
            btn.innerText = `🔊 語音：${speechEnabled ? '開' : '關'}`;
            btn.classList.toggle('active', speechEnabled);
            if (speechEnabled) speak("語音廣播已開啟。");
        }

        function broadcast(text) {
            let box = document.getElementById('broadcast-box');
            box.innerText = `📡 ${text}`;
            box.classList.add('show');
            speak(text);
            clearTimeout(window.bcTimer);
            window.bcTimer = setTimeout(() => box.classList.remove('show'), 5000);
        }

        // --- Three.js 3D 場景初始化 ---
        let scene, camera, renderer, rainParticles, crystalMesh;
        let rainVelocity = 0.5;
        
        function init3D() {
            try {
                const container = document.getElementById('canvas-container');
                scene = new THREE.Scene();
                scene.fog = new THREE.FogExp2(0x050505, 0.015);
                
                camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 8, 28);
                camera.lookAt(0, 0, 0);

                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                renderer.shadowMap.enabled = true;
                container.appendChild(renderer.domElement);

                // 燈光
                const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
                scene.add(ambientLight);
                
                const pointLight = new THREE.PointLight(0xffaa00, 1.2, 50);
                pointLight.position.set(0, 5, 5);
                scene.add(pointLight);

                // 避難所建築
                const metalMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.6, metalness: 0.9 });
                
                // 三層地板
                for(let i = 0; i < 3; i++) {
                    const floor = new THREE.Mesh(new THREE.BoxGeometry(24, 0.5, 10), metalMat);
                    floor.position.set(0, i * 4 - 4, 0);
                    floor.receiveShadow = true;
                    scene.add(floor);
                }
                
                // 兩側牆壁
                const wallL = new THREE.Mesh(new THREE.BoxGeometry(0.5, 12, 10), metalMat);
                wallL.position.set(-12, 0, 0); scene.add(wallL);
                const wallR = new THREE.Mesh(new THREE.BoxGeometry(0.5, 12, 10), metalMat);
                wallR.position.set(12, 0, 0); scene.add(wallR);
                
                // 後牆
                const wallB = new THREE.Mesh(new THREE.BoxGeometry(24, 12, 0.5), metalMat);
                wallB.position.set(0, 0, -5); scene.add(wallB);

                // 警示紅燈
                const redLight = new THREE.PointLight(0xff0000, 0.8, 20);
                redLight.position.set(10, 8, -4);
                scene.add(redLight);

                // 雨水粒子系統
                const rainGeo = new THREE.BufferGeometry();
                const rainCount = 2000;
                const posArray = new Float32Array(rainCount * 3);
                for(let i=0; i<rainCount*3; i+=3) {
                    posArray[i] = (Math.random() - 0.5) * 60;     // X
                    posArray[i+1] = Math.random() * 25 + 5;       // Y
                    posArray[i+2] = (Math.random() - 0.5) * 40;   // Z
                }
                rainGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
                const rainMat = new THREE.PointsMaterial({ color: 0xaaaaaa, size: 0.15, transparent: true, opacity: 0.6 });
                rainParticles = new THREE.Points(rainGeo, rainMat);
                rainParticles.visible = false;
                scene.add(rainParticles);

                // 3D 晶石模型 (懸浮喺中間)
                const crystalGeo = new THREE.OctahedronGeometry(1.5, 0);
                const crystalMat = new THREE.MeshStandardMaterial({ 
                    color: 0xe056fd, emissive: 0x8a2be2, roughness: 0.1, metalness: 0.8 
                });
                crystalMesh = new THREE.Mesh(crystalGeo, crystalMat);
                crystalMesh.position.set(0, 2, 2); // 放喺避難所中間
                crystalMesh.visible = false;
                scene.add(crystalMesh);

                window.addEventListener('resize', onWindowResize, false);
                animate();
            } catch(e) {
                console.error("3D 初始化失敗", e);
                document.body.style.background = '#111';
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            try {
                // 雨水動畫
                if (rainParticles.visible) {
                    const positions = rainParticles.geometry.attributes.position.array;
                    for(let i=1; i<positions.length; i+=3) {
                        positions[i] -= rainVelocity;
                        if (positions[i] < -10) positions[i] = 25; // 重置到頂部
                    }
                    rainParticles.geometry.attributes.position.needsUpdate = true;
                }
                
                // 晶石旋轉與懸浮
                if (crystalMesh && crystalMesh.visible) {
                    crystalMesh.rotation.y += 0.02;
                    crystalMesh.rotation.x += 0.01;
                    crystalMesh.position.y = 2 + Math.sin(Date.now() * 0.002) * 0.5; // 上下浮動
                }

                // 攝影機微微漂浮
                camera.position.x = Math.sin(Date.now() * 0.0005) * 2;
                camera.lookAt(0, 0, 0);
                renderer.render(scene, camera);
            } catch(e) {}
        }

        // --- UI 更新 ---
        function updateUI() {
            document.getElementById('ui-energy').innerText = Math.floor(energy);
            document.getElementById('ui-water').innerText = Math.floor(water);
            document.getElementById('ui-food').innerText = Math.floor(food);
            document.getElementById('ui-crystal').innerText = Math.floor(crystals);
            
            const popList = document.getElementById('pop-list');
            let html = '<h4>👥 居民狀態</h4>';
            residents.forEach(r => {
                let jobText = r.job === 'power' ? '⚡' : r.job === 'water' ? '💧' : '💤';
                html += `<div class="pop-item">
                    <span>${r.name} ${jobText}</span> 
                    <span class="${r.awakened?'awakened':''}">${r.awakened?'異能者':'正常'}</span>
                </div>`;
            });
            popList.innerHTML = html;
        }

        // --- 天氣控制 ---
        function toggleAutoWeather() {
            autoWeather = !autoWeather;
            let btn = document.getElementById('btn-auto');
            btn.innerText = `🔄 自動天氣：${autoWeather ? '開' : '關'}`;
            btn.classList.toggle('active', autoWeather);
            broadcast(autoWeather ? "系統：已開啟自動天氣切換。" : "系統：已關閉自動天氣，改為手動控制。");
        }

        function setWeather(type) {
            weather = type;
            let weatherText = document.getElementById('ui-weather');
            let radText = document.getElementById('ui-rad');
            
            if (type === 'clear') {
                weatherText.innerText = '晴天';
                weatherText.style.color = '#aaa';
                radText.innerText = '5%';
                radText.style.color = '#aaa';
                rainParticles.visible = false;
                broadcast("廣播：地表天氣轉晴，輻射指數回落。");
            } 
            else if (type === 'rain') {
                weatherText.innerText = '落雨';
                weatherText.style.color = '#00d2d3';
                radText.innerText = '30%';
                radText.style.color = '#f1c40f';
                rainVelocity = 0.4;
                rainParticles.material.color.setHex(0xaaaaaa);
                rainParticles.visible = true;
                broadcast("氣象警告：地表開始落雨，輻射指數輕微上升。");
            } 
            else if (type === 'acid_rain') {
                weatherText.innerText = '☢️ 酸雨';
                weatherText.style.color = '#2ecc71';
                radText.innerText = '85%';
                radText.style.color = '#2ecc71';
                rainVelocity = 1.2;
                rainParticles.material.color.setHex(0x2ecc71);
                rainParticles.visible = true;
                broadcast("☢️ 緊急警告：酸雨來襲！高輻射隨時令居民覺醒！");
            }
            weatherTimer = 20; 
        }

        // --- 居民工作分配 ---
        function allocate(job) {
            let assigned = false;
            for(let r of residents) {
                if(r.job === 'idle') {
                    r.job = job;
                    assigned = true;
                    broadcast(`系統：${r.name} 已被分配至 ${job === 'power' ? '發電站' : '淨水廠'}。`);
                    break;
                }
            }
            if(!assigned) broadcast("警告：沒有閒置居民！請等待自然覺醒或購買。");
            updateUI();
        }

        // --- 強制覺醒 ---
        function forceAwaken() {
            if (crystals < 10) {
                broadcast("❌ 晶石不足，無法強制催化覺醒。");
                return;
            }
            let unawakened = residents.filter(r => !r.awakened);
            if (unawakened.length === 0) {
                broadcast("系統：避難所內所有居民均已覺醒。");
                return;
            }
            
            crystals -= 10;
            let target = unawakened[Math.floor(Math.random() * unawakened.length)];
            target.awakened = true;
            broadcast(`💎 晶石催化成功！居民 ${target.name} 強行覺醒異能！`);
            updateUI();
        }

        // --- 核心邏輯循環 ---
        function tick() {
            // 資源消耗
            energy -= 0.5;
            water -= 0.5;
            food -= 0.5;

            // 晶石收集 (酸雨時)
            if (weather === 'acid_rain' && Math.random() < 0.15) {
                crystals += 1;
                if (Math.random() < 0.3) broadcast("系統：過濾器收集到微量高濃度結晶。");
            }

            // 天氣倒數
            if (autoWeather) {
                weatherTimer--;
                if(weatherTimer <= 0) {
                    weatherTimer = 20;
                    let r = Math.random();
                    if(r < 0.5) setWeather('clear');
                    else if(r < 0.8) setWeather('rain');
                    else setWeather('acid_rain');
                }
            }

            // 酸雨自然覺醒機制
            if (weather === 'acid_rain' && Math.random() < 0.05) {
                let unawakened = residents.filter(r => !r.awakened);
                if(unawakened.length > 0) {
                    let target = unawakened[Math.floor(Math.random() * unawakened.length)];
                    target.awakened = true;
                    broadcast(`🧬 異變發生！居民 ${target.name} 吸收輻射，覺醒了異能！`);
                }
            }

            // 3D 晶石顯示狀態
            if (crystalMesh) {
                crystalMesh.visible = (crystals > 0);
            }

            // 資源警告
            if(energy <= 0 || water <= 0 || food <= 0) {
                if(Math.random() < 0.2) broadcast("⚠️ 資源枯竭警告！請立即分配工作！");
            }

            updateUI();
        }

        // 初始化
        window.onload = () => {
            init3D();
            updateUI();
            setInterval(tick, 1000); // 每秒執行一次邏輯
            
            // 首句廣播延遲，等瀏覽器允許語音
            setTimeout(() => {
                broadcast("系統啟動完成。歡迎來到末日避難所。");
            }, 1000);
        };
    </script>
</body>
</html>
