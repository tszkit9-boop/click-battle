<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>☢️ 末日避難所：自由防線</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+HK:wght@400;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
    body { background: #e2e8f0; color: #1e293b; font-family: 'Noto Sans HK', sans-serif; height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
    
    #canvas-container { position: absolute; inset: 0; z-index: 1; }
    canvas { display: block; width: 100%; height: 100%; }

    .ui-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
    .ui-layer > * { pointer-events: auto; }

    .hud-top { display: flex; justify-content: center; align-items: center; padding: 10px; background: linear-gradient(180deg, rgba(255,255,255,0.95) 0%, transparent 100%); font-family: 'Orbitron', sans-serif; gap: 10px; flex-wrap: wrap; }
    .stat-box { display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 900; background: #ffffff; color: #334155; padding: 6px 12px; border-radius: 6px; border: 2px solid #cbd5e1; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .stat-box.energy { color: #d97706; border-color: #fcd34d; } .stat-box.crystal { color: #9333ea; border-color: #d8b4fe; }
    .stat-box.ammo { color: #dc2626; border-color: #fca5a5; } .stat-box.hp { color: #ef4444; border-color: #fca5a5; }
    .stat-box.door { color: #2563eb; border-color: #93c5fd; }
    
    .back-btn { padding: 6px 12px; background: #ffffff; color: #f97316; border: 2px solid #f97316; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 12px; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

    .crosshair { position: absolute; top: 50%; left: 50%; width: 30px; height: 30px; transform: translate(-50%, -50%); pointer-events: none; z-index: 50; opacity: 0.8; }
    .crosshair::before, .crosshair::after { content: ''; position: absolute; background: #ef4444; box-shadow: 0 0 5px #ef4444; }
    .crosshair::before { top: 14px; left: 0; width: 30px; height: 2px; }
    .crosshair::after { left: 14px; top: 0; width: 2px; height: 30px; }

    .joystick-zone { position: absolute; bottom: 20px; left: 20px; width: 120px; height: 120px; background: rgba(255,255,255,0.5); border: 2px solid #94a3b8; border-radius: 50%; z-index: 20; display: flex; justify-content: center; align-items: center; }
    .joystick-stick { width: 50px; height: 50px; background: #3b82f6; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }

    .action-zone { position: absolute; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 20; align-items: flex-end; }
    .action-btn { width: 70px; height: 70px; border-radius: 50%; border: 3px solid #fff; font-weight: 900; font-size: 14px; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); cursor: pointer; }
    .action-btn:active { transform: scale(0.9); }
    
    .btn-repair { background: #10b981; color: #fff; display: none; width: 80px; height: 80px; }
    .btn-melee { background: #f59e0b; color: #fff; }
    .btn-shoot { background: #ef4444; color: #fff; width: 80px; height: 80px; font-size: 18px; }

    .toggle-switch { position: absolute; top: 70px; right: 15px; background: #fff; border: 2px solid #cbd5e1; border-radius: 20px; padding: 5px 10px; font-size: 12px; font-weight: bold; cursor: pointer; z-index: 20; display: flex; align-items: center; gap: 5px; }
    .toggle-switch.active { border-color: #9333ea; color: #9333ea; background: #faf5ff; }

    .shop-toggle { position: absolute; top: 70px; left: 15px; background: #fff; border: 2px solid #d97706; color: #d97706; padding: 8px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; z-index: 20; }

    .modal { position: absolute; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; display: none; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
    .modal.active { display: flex; }
    .modal-box { background: #fff; border-radius: 12px; padding: 20px; width: 90%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    .modal-box h2 { color: #1e293b; font-family: 'Orbitron', sans-serif; margin-bottom: 15px; text-align: center; }
    
    .shop-item { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
    .shop-info b { display: block; font-size: 14px; color: #1e293b; }
    .shop-info small { font-size: 11px; color: #64748b; }
    .shop-buy { padding: 8px 15px; background: #3b82f6; color: #fff; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    .shop-buy:disabled { background: #94a3b8; cursor: not-allowed; }
    .close-modal { width: 100%; padding: 10px; background: #475569; color: #fff; border: none; border-radius: 8px; font-weight: bold; margin-top: 10px; cursor: pointer; }

    .broadcast-box { position: absolute; top: 110px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 500px; background: rgba(255, 255, 255, 0.95); border: 2px solid #f59e0b; color: #d97706; padding: 10px; font-size: 13px; text-align: center; border-radius: 6px; font-weight: bold; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 20; }
    .broadcast-box.show { opacity: 1; }
</style>
</head>
<body>

    <div id="canvas-container"></div>
    <div class="crosshair"></div>

    <div class="ui-layer">
        <div class="hud-top">
            <a href="../" class="back-btn">⬅ 返回</a>
            <div class="stat-box hp">❤️ <span id="ui-hp">100</span></div>
            <div class="stat-box door">🚪 <span id="ui-door">1000</span></div>
            <div class="stat-box ammo">🔫 <span id="ui-ammo">150</span> / 600</div>
            <div class="stat-box energy">⚡ <span id="ui-energy">1000</span></div>
            <div class="stat-box crystal">💎 <span id="ui-crystal">0</span></div>
        </div>
        <div class="broadcast-box" id="broadcast-box">系統廣播：士兵，請用左下搖桿移動，右下瞄準射擊！</div>
    </div>

    <div class="toggle-switch active" id="auto-pickup-btn" onclick="toggleAutoPickup()">🧲 自動吸納：開</div>
    <div class="shop-toggle" onclick="openShop()">🏪 槍鋪</div>

    <div class="joystick-zone" id="joystick-zone">
        <div class="joystick-stick" id="joystick-stick"></div>
    </div>

    <div class="action-zone">
        <button class="action-btn btn-repair" id="btn-repair">🔧 修理</button>
        <button class="action-btn btn-melee" onclick="doMelee()">🥊 扑擊</button>
        <button class="action-btn btn-shoot" onclick="shoot()">🔥 射擊</button>
    </div>

    <div class="modal" id="shop-modal">
        <div class="modal-box">
            <h2>🏪 末日槍鋪</h2>
            <div class="shop-item">
                <div class="shop-info"><b>📦 補充彈藥 (100發)</b><small>花費 200 ⚡ 電力</small></div>
                <button class="shop-buy" onclick="buyAmmo()">購買</button>
            </div>
            <div class="shop-item">
                <div class="shop-info"><b>💉 醫療包 (回滿血)</b><small>花費 5 💎 晶石</small></div>
                <button class="shop-buy" onclick="buyHeal()">購買</button>
            </div>
            <div class="shop-item">
                <div class="shop-info"><b>🔫 散彈槍 (一發打一群)</b><small>花費 30 💎 晶石</small></div>
                <button class="shop-buy" id="buy-shotgun" onclick="buyWeapon('shotgun')">解鎖</button>
            </div>
            <button class="close-modal" onclick="closeShop()">關閉</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        window.onerror = function(msg) { console.warn("防呆跳過：", msg); return true; };

        let playerHP = 100, doorHP = 1000;
        let ammo = 150, maxAmmo = 600;
        let energy = 1000, crystals = 0;
        let hasShotgun = false, autoPickup = true, wave = 1, isGameOver = false;

        let scene, camera, renderer, raycaster;
        let player, gunMuzzle, doorMesh;
        let zombies = [], pickups = [];
        
        let moveVector = new THREE.Vector3(0, 0, 0);
        let cameraAngle = 0; 
        let cameraPitch = 0.5; 
        let joystickActive = false;
        let joystickStart = {x: 0, y: 0};

        const uiHP = document.getElementById('ui-hp');
        const uiDoor = document.getElementById('ui-door');
        const uiAmmo = document.getElementById('ui-ammo');
        const uiEnergy = document.getElementById('ui-energy');
        const uiCrystal = document.getElementById('ui-crystal');
        const btnRepair = document.getElementById('btn-repair');

        function broadcast(text) { let box = document.getElementById('broadcast-box'); box.innerText = `📡 ${text}`; box.classList.add('show'); clearTimeout(window.bcTimer); window.bcTimer = setTimeout(() => box.classList.remove('show'), 3000); }

        function createPlayer() {
            let group = new THREE.Group();
            let suitMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.5 });
            let armorMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.4, metalness: 0.6 });
            let whiteMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc });
            let visorMat = new THREE.MeshStandardMaterial({ color: 0x0ea5e9, emissive: 0x0ea5e9, emissiveIntensity: 0.6 });

            let torso = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.4, 1.2, 8), suitMat); torso.position.y = 0.7; group.add(torso);
            let vest = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.6), armorMat); vest.position.y = 0.8; group.add(vest);
            let head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), whiteMat); head.position.y = 1.6; group.add(head);
            let visor = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.1, 0.4), visorMat); visor.position.set(0, 1.65, 0.2); group.add(visor);

            let legL = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.12, 0.9, 6), suitMat); legL.position.set(-0.2, 0, 0); group.add(legL);
            let legR = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.12, 0.9, 6), suitMat); legR.position.set(0.2, 0, 0); group.add(legR);
            
            let gun = new THREE.Group();
            let gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.25, 1.2), whiteMat);
            let barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.8), armorMat); barrel.rotation.x = Math.PI / 2; barrel.position.set(0, 0, -0.9);
            gun.add(gunBody); gun.add(barrel);
            gun.position.set(0.4, 0.8, -0.8); // 槍喺前面
            group.add(gun);

            gunMuzzle = new THREE.Object3D(); gunMuzzle.position.set(0, 0, -1.4); gun.add(gunMuzzle);
            return group;
        }

        function createZombieModel(isElite) {
            let group = new THREE.Group();
            let skinColor = isElite ? 0xb91c1c : 0x15803d;
            let skinMat = new THREE.MeshStandardMaterial({ color: skinColor, roughness: 0.8 });
            let shirtMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.9 });
            let eyeMat = new THREE.MeshBasicMaterial({ color: 0xef4444 });

            let body = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 1.2, 8), shirtMat); body.position.y = 1.1; body.rotation.x = 0.3; group.add(body);
            let head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), skinMat); head.position.set(0.1, 1.8, 0.1); head.rotation.z = 0.4; group.add(head);
            let eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.05, 4, 4), eyeMat); eyeL.position.set(-0.1, 0.1, 0.25); head.add(eyeL);
            let eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.05, 4, 4), eyeMat); eyeR.position.set(0.1, 0.1, 0.25); head.add(eyeR);

            let armL = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.08, 0.9, 6), skinMat); armL.position.set(-0.4, 1.1, 0.4); armL.rotation.x = -Math.PI / 2 + 0.2; group.add(armL);
            let armR = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.5, 6), skinMat); armR.position.set(0.4, 0.9, 0); armR.rotation.x = 0.5; group.add(armR);
            let legL = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.08, 0.9, 6), skinMat); legL.position.set(-0.15, 0.1, 0); group.add(legL);
            let legR = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.08, 0.6, 6), skinMat); legR.position.set(0.15, -0.05, 0); group.add(legR);

            group.userData.legL = legL; group.userData.legR = legR;
            return group;
        }

        function init3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf8fafc); // 白底
            
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            raycaster = new THREE.Raycaster();

            scene.add(new THREE.AmbientLight(0xffffff, 1.2)); 
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5); dirLight.position.set(10, 20, 10); scene.add(dirLight);

            const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.3 }));
            floor.rotation.x = -Math.PI / 2; floor.position.y = -1; scene.add(floor);
            const grid = new THREE.GridHelper(60, 30, 0x94a3b8, 0xcbd5e1); grid.position.y = -0.95; scene.add(grid);

            const wallMat = new THREE.MeshStandardMaterial({ color: 0xf1f5f9 });
            const wall1 = new THREE.Mesh(new THREE.BoxGeometry(60, 10, 1), wallMat); wall1.position.set(0, 4, -30); scene.add(wall1);
            const wall2 = new THREE.Mesh(new THREE.BoxGeometry(60, 10, 1), wallMat); wall2.position.set(0, 4, 30); scene.add(wall2);
            const wall3 = new THREE.Mesh(new THREE.BoxGeometry(1, 10, 60), wallMat); wall3.position.set(-30, 4, 0); scene.add(wall3);
            const wall4 = new THREE.Mesh(new THREE.BoxGeometry(1, 10, 60), wallMat); wall4.position.set(30, 4, 0); scene.add(wall4);

            // 障礙物
            for(let i=0; i<4; i++) {
                let obs = new THREE.Mesh(new THREE.BoxGeometry(3, 6, 3), new THREE.MeshStandardMaterial({ color: 0x94a3b8 }));
                obs.position.set((Math.random()-0.5)*30, 2, (Math.random()-0.5)*30);
                scene.add(obs);
            }

            doorMesh = new THREE.Mesh(new THREE.BoxGeometry(10, 8, 1), new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.8 }));
            doorMesh.position.set(0, 3, -28); scene.add(doorMesh);

            player = createPlayer();
            player.position.set(0, 0, 15); // 玩家初始位置
            scene.add(player);

            window.addEventListener('resize', onWindowResize);
            setupControls();
            animate();
            startWave();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function setupControls() {
            const zone = document.getElementById('joystick-zone');
            const stick = document.getElementById('joystick-stick');
            let isDragging = false;
            let lastX = 0, lastY = 0;

            zone.addEventListener('touchstart', (e) => {
                joystickActive = true;
                joystickStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            });
            zone.addEventListener('touchmove', (e) => {
                if(!joystickActive) return;
                let dx = e.touches[0].clientX - joystickStart.x;
                let dy = e.touches[0].clientY - joystickStart.y;
                let dist = Math.min(Math.hypot(dx, dy), 40);
                let angle = Math.atan2(dy, dx);
                stick.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
                moveVector.x = (dx / 40);
                moveVector.z = (dy / 40);
            });
            zone.addEventListener('touchend', () => {
                joystickActive = false;
                moveVector.set(0, 0, 0);
                stick.style.transform = `translate(0px, 0px)`;
            });

            const container = document.getElementById('canvas-container');
            container.addEventListener('touchstart', (e) => {
                if(e.target.closest('.ui-layer') || e.target.closest('.joystick-zone') || e.target.closest('.action-zone') || e.target.closest('.toggle-switch') || e.target.closest('.shop-toggle')) return;
                isDragging = true;
                lastX = e.touches[0].clientX;
                lastY = e.touches[0].clientY;
            });
            container.addEventListener('touchmove', (e) => {
                if(!isDragging) return;
                let dx = e.touches[0].clientX - lastX;
                let dy = e.touches[0].clientY - lastY;
                cameraAngle -= dx * 0.005;
                cameraPitch -= dy * 0.005;
                cameraPitch = Math.max(0.1, Math.min(1.2, cameraPitch)); // 限制上下視角
                lastX = e.touches[0].clientX;
                lastY = e.touches[0].clientY;
            });
            container.addEventListener('touchend', () => { isDragging = false; });

            // 電腦支援
            container.addEventListener('mousemove', (e) => {
                if(e.buttons === 1) { 
                    cameraAngle -= e.movementX * 0.005;
                    cameraPitch -= e.movementY * 0.005;
                    cameraPitch = Math.max(0.1, Math.min(1.2, cameraPitch));
                }
            });
            document.addEventListener('keydown', (e) => {
                if(e.key === 'w') moveVector.z = -1;
                if(e.key === 's') moveVector.z = 1;
                if(e.key === 'a') moveVector.x = -1;
                if(e.key === 'd') moveVector.x = 1;
                if(e.key === ' ') shoot();
            });
            document.addEventListener('keyup', () => { moveVector.set(0,0,0); });
        }

        function shoot() {
            if (isGameOver || ammo <= 0) return;
            ammo--;
            
            let startPos = new THREE.Vector3(); gunMuzzle.getWorldPosition(startPos);
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            let allZ = zombies.map(z => z.mesh);
            let intersects = raycaster.intersectObjects(allZ, true);
            
            let endPos = new THREE.Vector3();
            if (intersects.length > 0) {
                endPos = intersects[0].point;
                let hitGroup = intersects[0].object;
                while (hitGroup.parent && !hitGroup.userData.legL) { hitGroup = hitGroup.parent; }
                let targetZ = zombies.find(z => z.mesh === hitGroup);
                if (targetZ) {
                    let dmg = hasShotgun ? 150 : 50;
                    targetZ.hp -= dmg;
                    createHitEffect(endPos, 0xef4444);
                    if (targetZ.hp <= 0) killZombie(targetZ);
                }
            } else {
                raycaster.ray.at(50, endPos);
            }

            let flash = new THREE.PointLight(0x2563eb, 2, 5); flash.position.copy(startPos); scene.add(flash); setTimeout(() => scene.remove(flash), 50);
            let beamMat = new THREE.LineBasicMaterial({ color: hasShotgun ? 0xf59e0b : 0x2563eb });
            let beam = new THREE.Line(new THREE.BufferGeometry().setFromPoints([startPos, endPos]), beamMat);
            scene.add(beam); setTimeout(() => scene.remove(beam), 50);
            updateUI();
        }

        function doMelee() {
            if (isGameOver) return;
            let closestZ = null; let minDist = 5;
            zombies.forEach(z => {
                let d = player.position.distanceTo(z.mesh.position);
                if(d < minDist) { minDist = d; closestZ = z; }
            });
            if(closestZ) {
                closestZ.hp -= 50;
                closestZ.mesh.position.add(player.position.clone().sub(closestZ.mesh.position).normalize().multiplyScalar(-5));
                createHitEffect(closestZ.mesh.position, 0xffffff);
                if(closestZ.hp <= 0) killZombie(closestZ);
            }
        }

        function toggleAutoPickup() {
            autoPickup = !autoPickup;
            const btn = document.getElementById('auto-pickup-btn');
            btn.innerText = `🧲 自動吸納：${autoPickup ? '開' : '關'}`;
            btn.classList.toggle('active', autoPickup);
        }

        function spawnPickup(pos, type) {
            let color = type === 'ammo' ? 0xf59e0b : 0x9333ea;
            let mesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshBasicMaterial({ color: color }));
            mesh.position.copy(pos); mesh.position.y = 0.5; scene.add(mesh);
            pickups.push({ mesh: mesh, type: type });
        }

        function startWave() {
            if (isGameOver) return;
            let isHorde = (wave % 5 === 0);
            let count = isHorde ? 20 : 3 + wave * 2;
            if (isHorde) broadcast("🚨 警告：大型屍潮來襲！");

            for(let i=0; i<count; i++) {
                setTimeout(() => {
                    if(isGameOver) return;
                    let isElite = Math.random() < 0.2 || isHorde; 
                    let zGroup = createZombieModel(isElite);
                    let spawnX = (Math.random() - 0.5) * 20;
                    zGroup.position.set(spawnX, 0, -25 - Math.random()*3);
                    zGroup.scale.set(1.2, 1.2, 1.2); // 放大少少易睇啲
                    scene.add(zGroup);
                    zombies.push({ mesh: zGroup, hp: isElite ? 200 : 100, speed: isElite ? 0.08 : 0.05 });
                }, i * (isHorde ? 300 : 1000));
            }
            wave++;
        }

        function killZombie(z) {
            createHitEffect(z.mesh.position, 0x15803d);
            scene.remove(z.mesh);
            zombies = zombies.filter(item => item !== z);
            if (Math.random() < 0.5) spawnPickup(z.mesh.position, 'ammo');
            if (Math.random() < 0.8) spawnPickup(z.mesh.position, 'crystal');
            if (zombies.length === 0) setTimeout(startWave, 3000);
        }

        function createHitEffect(pos, color) {
            let p = new THREE.PointLight(color, 3, 5); p.position.copy(pos); scene.add(p);
            setTimeout(() => scene.remove(p), 100);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (isGameOver) return;

            // 玩家移動
            let forward = new THREE.Vector3(-Math.sin(cameraAngle), 0, -Math.cos(cameraAngle));
            let right = new THREE.Vector3(Math.cos(cameraAngle), 0, -Math.sin(cameraAngle));
            let moveDir = forward.multiplyScalar(-moveVector.z).add(right.multiplyScalar(moveVector.x));
            if (moveDir.length() > 1) moveDir.normalize();
            player.position.add(moveDir.multiplyScalar(0.3)); 
            player.rotation.y = cameraAngle + Math.PI; // 面向視線方向

            // 修正鏡頭位置 (唔會跌落地下)
            let camDist = 12;
            let camX = player.position.x + Math.sin(cameraAngle) * camDist * Math.cos(cameraPitch);
            let camZ = player.position.z + Math.cos(cameraAngle) * camDist * Math.cos(cameraPitch);
            let camY = player.position.y + Math.sin(cameraPitch) * camDist;
            if (camY < 2) camY = 2; // 鎖定最低高度
            camera.position.set(camX, camY, camZ);
            camera.lookAt(player.position.x, player.position.y + 1.5, player.position.z);

            // 喪屍邏輯
            zombies.forEach(z => {
                let targetPos = (doorHP > 0 && z.mesh.position.z < -20) ? doorMesh.position : player.position;
                if (doorHP <= 0) targetPos = player.position;

                let dir = targetPos.clone().sub(z.mesh.position);
                dir.y = 0; dir.normalize();
                z.mesh.position.add(dir.multiplyScalar(z.speed));
                z.mesh.rotation.y = Math.atan2(dir.x, dir.z);

                if (z.mesh.position.distanceTo(targetPos) < 2.5) {
                    if (doorHP > 0 && targetPos === doorMesh.position) {
                        doorHP -= 10; 
                        if (Math.random() < 0.1) createHitEffect(doorMesh.position, 0xff0000);
                        if (doorHP <= 0) { doorHP = 0; broadcast("⚠️ 大門被攻破！喪屍衝入嚟啦！"); }
                    } else if (targetPos === player.position) {
                        playerHP -= 5; 
                        if (playerHP <= 0) gameOver();
                        if (Math.random() < 0.1) createHitEffect(player.position, 0xff0000);
                    }
                }
            });

            // 拾取物
            for (let i = pickups.length - 1; i >= 0; i--) {
                let p = pickups[i];
                let dist = player.position.distanceTo(p.mesh.position);
                if (autoPickup || dist < 2) {
                    p.mesh.position.lerp(player.position, 0.1);
                    if (dist < 1.5) {
                        if (p.type === 'ammo') ammo = Math.min(maxAmmo, ammo + 30);
                        else crystals += 2;
                        scene.remove(p.mesh); pickups.splice(i, 1); updateUI();
                    }
                }
            }

            // 修理判定
            if (player.position.distanceTo(doorMesh.position) < 10 && doorHP < 1000) {
                btnRepair.style.display = 'flex';
            } else {
                btnRepair.style.display = 'none';
            }

            updateUI();
            renderer.render(scene, camera);
        }

        function updateUI() {
            uiHP.innerText = Math.floor(playerHP);
            uiDoor.innerText = Math.floor(doorHP);
            uiAmmo.innerText = Math.floor(ammo);
            uiEnergy.innerText = Math.floor(energy);
            uiCrystal.innerText = Math.floor(crystals);
        }

        function gameOver() {
            isGameOver = true;
            broadcast("💀 士兵陣亡！避難所淪陷。");
            setTimeout(() => location.reload(), 3000);
        }

        function openShop() { document.getElementById('shop-modal').classList.add('active'); }
        function closeShop() { document.getElementById('shop-modal').classList.remove('active'); }
        function buyAmmo() { if(energy >= 200) { energy -= 200; ammo = Math.min(600, ammo + 100); updateUI(); } }
        function buyHeal() { if(crystals >= 5) { crystals -= 5; playerHP = 100; updateUI(); } }
        function buyWeapon(type) {
            if(type === 'shotgun' && !hasShotgun && crystals >= 30) {
                crystals -= 30; hasShotgun = true;
                document.getElementById('buy-shotgun').innerText = '已解鎖';
                document.getElementById('buy-shotgun').disabled = true;
                broadcast("🔫 解鎖散彈槍！傷害大增！");
                updateUI();
            }
        }

        // 按住修理
        let isRepairing = false;
        btnRepair.addEventListener('touchstart', () => { isRepairing = true; repairDoor(); });
        btnRepair.addEventListener('touchend', () => { isRepairing = false; });
        function repairDoor() {
            if (doorHP >= 1000 || energy < 20) return;
            doorHP += 10; if (doorHP > 1000) doorHP = 1000;
            energy -= 20;
            updateUI();
        }

        window.onload = () => {
            init3D();
            setInterval(() => { if(!isGameOver) { energy += 5; updateUI(); } }, 1000);
        };
    </script>
</body>
</html>
