<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>☢️ 末日避難所：自動追蹤版</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+HK:wght@400;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
    body { background: #0f172a; color: #fff; font-family: 'Noto Sans HK', sans-serif; height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
    
    #canvas-container { position: absolute; inset: 0; z-index: 1; }
    canvas { display: block; width: 100%; height: 100%; }

    .ui-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
    .ui-layer > * { pointer-events: auto; }

    .hud-top { display: flex; justify-content: center; align-items: center; padding: 10px; background: linear-gradient(180deg, rgba(15,23,42,0.95) 0%, transparent 100%); font-family: 'Orbitron', sans-serif; gap: 10px; flex-wrap: wrap; }
    .stat-box { display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 900; background: #1e293b; color: #cbd5e1; padding: 6px 12px; border-radius: 6px; border: 2px solid #334155; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
    .stat-box.energy { color: #fbbf24; border-color: #f59e0b; } .stat-box.crystal { color: #c084fc; border-color: #9333ea; }
    .stat-box.ammo { color: #f87171; border-color: #ef4444; } .stat-box.hp { color: #f87171; border-color: #ef4444; }
    .stat-box.door { color: #60a5fa; border-color: #3b82f6; }
    
    .back-btn { padding: 6px 12px; background: #1e293b; color: #f97316; border: 2px solid #f97316; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 12px; transition: 0.2s; }

    .crosshair { position: absolute; top: 50%; left: 50%; width: 30px; height: 30px; transform: translate(-50%, -50%); pointer-events: none; z-index: 50; opacity: 0.6; }
    .crosshair::before, .crosshair::after { content: ''; position: absolute; background: #ef4444; box-shadow: 0 0 5px #ef4444; }
    .crosshair::before { top: 14px; left: 0; width: 30px; height: 2px; }
    .crosshair::after { left: 14px; top: 0; width: 2px; height: 30px; }

    .joystick-zone { position: absolute; bottom: 20px; left: 20px; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border: 2px solid #64748b; border-radius: 50%; z-index: 20; display: flex; justify-content: center; align-items: center; }
    .joystick-stick { width: 50px; height: 50px; background: #3b82f6; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }

    .action-zone { position: absolute; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 20; align-items: flex-end; }
    .action-btn { width: 70px; height: 70px; border-radius: 50%; border: 3px solid #fff; font-weight: 900; font-size: 14px; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer; }
    .action-btn:active { transform: scale(0.9); }
    
    .btn-repair { background: #10b981; color: #fff; display: none; width: 80px; height: 80px; }
    .btn-melee { background: #f59e0b; color: #fff; }
    .btn-shoot { background: #ef4444; color: #fff; width: 80px; height: 80px; font-size: 18px; }

    .toggle-switch { position: absolute; top: 70px; right: 15px; background: #1e293b; color: #cbd5e1; border: 2px solid #475569; border-radius: 20px; padding: 5px 10px; font-size: 12px; font-weight: bold; cursor: pointer; z-index: 20; display: flex; align-items: center; gap: 5px; }
    .toggle-switch.active { border-color: #9333ea; color: #c084fc; background: #2e1065; }

    .shop-toggle { position: absolute; top: 70px; left: 15px; background: #1e293b; border: 2px solid #d97706; color: #fbbf24; padding: 8px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; z-index: 20; }

    .modal { position: absolute; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; display: none; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
    .modal.active { display: flex; }
    .modal-box { background: #1e293b; border: 1px solid #475569; border-radius: 12px; padding: 20px; width: 90%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .modal-box h2 { color: #f8fafc; font-family: 'Orbitron', sans-serif; margin-bottom: 15px; text-align: center; }
    
    .shop-item { display: flex; justify-content: space-between; align-items: center; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
    .shop-info b { display: block; font-size: 14px; color: #f8fafc; }
    .shop-info small { font-size: 11px; color: #94a3b8; }
    .shop-buy { padding: 8px 15px; background: #3b82f6; color: #fff; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    .shop-buy:disabled { background: #475569; cursor: not-allowed; }
    .close-modal { width: 100%; padding: 10px; background: #475569; color: #fff; border: none; border-radius: 8px; font-weight: bold; margin-top: 10px; cursor: pointer; }

    .broadcast-box { position: absolute; top: 110px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 500px; background: rgba(15, 23, 42, 0.95); border: 2px solid #f59e0b; color: #fbbf24; padding: 10px; font-size: 13px; text-align: center; border-radius: 6px; font-weight: bold; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 20; }
    .broadcast-box.show { opacity: 1; }
</style>
</head>
<body>

    <div id="canvas-container"></div>
    <div class="crosshair"></div>

    <div class="ui-layer">
        <div class="hud-top">
            <a href="../" class="back-btn">⬅ 返回</a>
            <div class="stat-box hp">❤️ <span id="ui-hp">100</span></div>
            <div class="stat-box door">🚪 <span id="ui-door">1000</span></div>
            <div class="stat-box ammo">🔫 <span id="ui-ammo">150</span> / 600</div>
            <div class="stat-box energy">⚡ <span id="ui-energy">1000</span></div>
            <div class="stat-box crystal">💎 <span id="ui-crystal">0</span></div>
        </div>
        <div class="broadcast-box" id="broadcast-box">系統廣播：已開啟自動追蹤！瘋狂撳「射擊」就得！</div>
    </div>

    <div class="toggle-switch active" id="auto-pickup-btn" onclick="toggleAutoPickup()">🧲 自動吸納：開</div>
    <div class="shop-toggle" onclick="openShop()">🏪 槍鋪</div>

    <div class="joystick-zone" id="joystick-zone">
        <div class="joystick-stick" id="joystick-stick"></div>
    </div>

    <div class="action-zone">
        <button class="action-btn btn-repair" id="btn-repair">🔧 修理</button>
        <button class="action-btn btn-melee" onclick="doMelee()">🥊 扑擊</button>
        <button class="action-btn btn-shoot" onclick="shoot()">🔥 射擊</button>
    </div>

    <div class="modal" id="shop-modal">
        <div class="modal-box">
            <h2>🏪 末日槍鋪</h2>
            <div class="shop-item">
                <div class="shop-info"><b>📦 補充彈藥 (100發)</b><small>花費 200 ⚡ 電力</small></div>
                <button class="shop-buy" onclick="buyAmmo()">購買</button>
            </div>
            <div class="shop-item">
                <div class="shop-info"><b>💉 醫療包 (回滿血)</b><small>花費 5 💎 晶石</small></div>
                <button class="shop-buy" onclick="buyHeal()">購買</button>
            </div>
            <div class="shop-item">
                <div class="shop-info"><b>🔫 散彈槍 (一發打一群)</b><small>花費 30 💎 晶石</small></div>
                <button class="shop-buy" id="buy-shotgun" onclick="buyWeapon('shotgun')">解鎖</button>
            </div>
            <button class="close-modal" onclick="closeShop()">關閉</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        window.onerror = function(msg) { console.warn("防呆跳過：", msg); return true; };

        let playerHP = 100, doorHP = 1000;
        let ammo = 150, maxAmmo = 600;
        let energy = 1000, crystals = 0;
        let hasShotgun = false, autoPickup = true, wave = 1, isGameOver = false;

        let scene, camera, renderer;
        let player, gunMuzzle, doorMesh;
        let zombies = [], pickups = [];
        
        let moveVector = new THREE.Vector3(0, 0, 0);
        let joystickActive = false;
        let joystickStart = {x: 0, y: 0};

        const uiHP = document.getElementById('ui-hp');
        const uiDoor = document.getElementById('ui-door');
        const uiAmmo = document.getElementById('ui-ammo');
        const uiEnergy = document.getElementById('ui-energy');
        const uiCrystal = document.getElementById('ui-crystal');
        const btnRepair = document.getElementById('btn-repair');

        function broadcast(text) { let box = document.getElementById('broadcast-box'); box.innerText = `📡 ${text}`; box.classList.add('show'); clearTimeout(window.bcTimer); window.bcTimer = setTimeout(() => box.classList.remove('show'), 3000); }

        function createPlayer() {
            let group = new THREE.Group();
            let suitMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.5 }); 
            let armorMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.4, metalness: 0.6 });
            let whiteMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc });
            let visorMat = new THREE.MeshStandardMaterial({ color: 0x06b6d4, emissive: 0x06b6d4, emissiveIntensity: 0.8 });

            let torso = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.5, 1.4, 8), suitMat); torso.position.y = 0.8; group.add(torso);
            let vest = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 0.7), armorMat); vest.position.y = 0.9; group.add(vest);
            let head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 8, 8), whiteMat); head.position.y = 1.8; group.add(head);
            let visor = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.12, 0.5), visorMat); visor.position.set(0, 1.85, 0.25); group.add(visor);

            let legL = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.15, 1, 6), suitMat); legL.position.set(-0.25, 0, 0); group.add(legL);
            let legR = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.15, 1, 6), suitMat); legR.position.set(0.25, 0, 0); group.add(legR);
            
            let gunGroup = new THREE.Group();
            let gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.3, 1.4), whiteMat);
            let barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 1), armorMat); barrel.rotation.x = Math.PI / 2; barrel.position.set(0, 0, -1);
            gunGroup.add(gunBody); gunGroup.add(barrel);
            gunGroup.position.set(0.5, 1.2, -0.6); 
            group.add(gunGroup);

            gunMuzzle = new THREE.Object3D(); 
            gunMuzzle.position.set(0, 0, -1.5); 
            gunGroup.add(gunMuzzle);
            
            let armR = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 1, 6), suitMat);
            armR.position.set(0.4, 1.1, 0.1); armR.rotation.x = -Math.PI / 3; group.add(armR);

            return group;
        }

        function createZombieModel(isElite) {
            let group = new THREE.Group();
            let skinColor = isElite ? 0xdc2626 : 0x16a34a; 
            let skinMat = new THREE.MeshStandardMaterial({ color: skinColor, roughness: 0.8 });
            let shirtMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.9 });
            let eyeMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 }); 

            let body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.5, 1.4, 8), shirtMat); body.position.y = 1.2; body.rotation.x = 0.2; group.add(body);
            let head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 8, 8), skinMat); head.position.set(0.1, 2, 0.1); group.add(head);
            
            let eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.07, 4, 4), eyeMat); eyeL.position.set(-0.12, 0.1, 0.3); head.add(eyeL);
            let eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.07, 4, 4), eyeMat); eyeR.position.set(0.12, 0.1, 0.3); head.add(eyeR);

            let armL = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.1, 1.1, 6), skinMat); armL.position.set(-0.5, 1.2, 0.5); armL.rotation.x = -Math.PI / 2 + 0.2; group.add(armL);
            let armR = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.1, 0.8, 6), skinMat); armR.position.set(0.5, 1, 0); armR.rotation.x = 0.5; group.add(armR);
            let legL = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.1, 1, 6), skinMat); legL.position.set(-0.2, 0.2, 0); group.add(legL);
            let legR = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.1, 0.7, 6), skinMat); legR.position.set(0.2, 0, 0); group.add(legR);

            let hpBarBg = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 0.15), new THREE.MeshBasicMaterial({ color: 0x000000, depthTest: false }));
            hpBarBg.position.set(0, 2.8, 0); group.add(hpBarBg);
            let hpBar = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 0.15), new THREE.MeshBasicMaterial({ color: 0xff0000, depthTest: false }));
            hpBar.position.set(0, 2.8, 0.01); group.add(hpBar);

            group.userData.legL = legL; group.userData.legR = legR;
            return group;
        }

        function init3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a); 
            
            // 固定視角：永遠由後上方望住
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 1.2)); 
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.0); dirLight.position.set(10, 20, 10); scene.add(dirLight);

            // 地板
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 60), new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 }));
            floor.rotation.x = -Math.PI / 2; floor.position.y = -1; scene.add(floor);
            const grid = new THREE.GridHelper(60, 30, 0x334155, 0x1e293b); grid.position.y = -0.95; scene.add(grid);

            // 兩側牆身
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x0f172a });
            const wall3 = new THREE.Mesh(new THREE.BoxGeometry(1, 10, 60), wallMat); wall3.position.set(-15, 4, 0); scene.add(wall3);
            const wall4 = new THREE.Mesh(new THREE.BoxGeometry(1, 10, 60), wallMat); wall4.position.set(15, 4, 0); scene.add(wall4);

            // 大門 (放喺正前方)
            doorMesh = new THREE.Mesh(new THREE.BoxGeometry(8, 6, 1), new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.9 }));
            doorMesh.position.set(0, 2, -20); scene.add(doorMesh);
            for(let i=0; i<3; i++) {
                let stripe = new THREE.Mesh(new THREE.BoxGeometry(8, 0.4, 1.1), new THREE.MeshBasicMaterial({ color: 0xf59e0b }));
                stripe.position.set(0, 0.5 + i*1.5, -20); scene.add(stripe);
            }

            // 玩家
            player = createPlayer();
            player.position.set(0, 0, 0); 
            scene.add(player);

            window.addEventListener('resize', onWindowResize);
            setupControls();
            animate();
            
            setTimeout(startWave, 1000);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function setupControls() {
            const zone = document.getElementById('joystick-zone');
            const stick = document.getElementById('joystick-stick');

            zone.addEventListener('touchstart', (e) => {
                joystickActive = true;
                joystickStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            });
            zone.addEventListener('touchmove', (e) => {
                if(!joystickActive) return;
                let dx = e.touches[0].clientX - joystickStart.x;
                let dy = e.touches[0].clientY - joystickStart.y;
                let dist = Math.min(Math.hypot(dx, dy), 40);
                let angle = Math.atan2(dy, dx);
                stick.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
                moveVector.x = (dx / 40);
                moveVector.z = (dy / 40);
            });
            zone.addEventListener('touchend', () => {
                joystickActive = false;
                moveVector.set(0, 0, 0);
                stick.style.transform = `translate(0px, 0px)`;
            });

            document.addEventListener('keydown', (e) => {
                if(e.key === 'w') moveVector.z = -1;
                if(e.key === 's') moveVector.z = 1;
                if(e.key === 'a') moveVector.x = -1;
                if(e.key === 'd') moveVector.x = 1;
                if(e.key === ' ') shoot();
            });
            document.addEventListener('keyup', () => { moveVector.set(0,0,0); });
        }

        // 🎯 自動追蹤射擊系統
        function shoot() {
            if (isGameOver || ammo <= 0) return;
            ammo--;
            
            let startPos = new THREE.Vector3(); 
            gunMuzzle.getWorldPosition(startPos);

            let endPos = new THREE.Vector3();
            let targetZ = null;
            let minDist = 999;

            // 1. 自動搵最近嘅喪屍
            zombies.forEach(z => {
                let d = player.position.distanceTo(z.mesh.position);
                if(d < minDist) { minDist = d; targetZ = z; }
            });

            // 2. 如果有目標，射向佢；冇目標就射向正前方
            if (targetZ) {
                endPos.copy(targetZ.mesh.position);
                endPos.y += 1.5; // 瞄準身體

                let dmg = hasShotgun ? 150 : 50;
                targetZ.hp -= dmg;
                createHitEffect(endPos, 0xef4444);
                if (targetZ.hp <= 0) killZombie(targetZ);

                // 玩家自動轉向目標
                player.lookAt(targetZ.mesh.position.x, player.position.y, targetZ.mesh.position.z);
            } else {
                let forward = new THREE.Vector3(0, 1.5, -20);
                forward.add(player.position);
                endPos.copy(forward);
            }

            // 3. 畫出雷射
            let flash = new THREE.PointLight(0x2563eb, 2, 5); flash.position.copy(startPos); scene.add(flash); setTimeout(() => scene.remove(flash), 50);
            let beamMat = new THREE.LineBasicMaterial({ color: hasShotgun ? 0xf59e0b : 0x00ffff, linewidth: 2 });
            let beam = new THREE.Line(new THREE.BufferGeometry().setFromPoints([startPos, endPos]), beamMat);
            scene.add(beam); setTimeout(() => scene.remove(beam), 50);
            
            updateUI();
        }

        function doMelee() {
            if (isGameOver) return;
            let closestZ = null; let minDist = 5;
            zombies.forEach(z => {
                let d = player.position.distanceTo(z.mesh.position);
                if(d < minDist) { minDist = d; closestZ = z; }
            });
            if(closestZ) {
                closestZ.hp -= 50;
                closestZ.mesh.position.add(player.position.clone().sub(closestZ.mesh.position).normalize().multiplyScalar(-5));
                createHitEffect(closestZ.mesh.position, 0xffffff);
                if(closestZ.hp <= 0) killZombie(closestZ);
            }
        }

        function toggleAutoPickup() {
            autoPickup = !autoPickup;
            const btn = document.getElementById('auto-pickup-btn');
            btn.innerText = `🧲 自動吸納：${autoPickup ? '開' : '關'}`;
            btn.classList.toggle('active', autoPickup);
        }

        function spawnPickup(pos, type) {
            let color = type === 'ammo' ? 0xf59e0b : 0x9333ea;
            let mesh = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshBasicMaterial({ color: color }));
            mesh.position.copy(pos); mesh.position.y = 0.5; scene.add(mesh);
            pickups.push({ mesh: mesh, type: type });
        }

        function startWave() {
            if (isGameOver) return;
            let isHorde = (wave % 5 === 0);
            let count = isHorde ? 15 : 3 + wave * 2;
            if (isHorde) broadcast("🚨 警告：大型屍潮來襲！");
            else broadcast(`🌊 第 ${wave} 波喪屍來襲！`);

            for(let i=0; i<count; i++) {
                setTimeout(() => {
                    if(isGameOver) return;
                    let isElite = Math.random() < 0.2 || isHorde; 
                    let zGroup = createZombieModel(isElite);
                    let spawnX = (Math.random() - 0.5) * 10; 
                    // 全部喺正前方大門位 (Z = -20) 衝出嚟
                    zGroup.position.set(spawnX, 0, -20); 
                    scene.add(zGroup);
                    zombies.push({ mesh: zGroup, hp: isElite ? 200 : 100, speed: isElite ? 0.06 : 0.04 });
                }, i * (isHorde ? 400 : 1000));
            }
            wave++;
        }

        function killZombie(z) {
            createHitEffect(z.mesh.position, 0x15803d);
            scene.remove(z.mesh);
            zombies = zombies.filter(item => item !== z);
            if (Math.random() < 0.5) spawnPickup(z.mesh.position, 'ammo');
            if (Math.random() < 0.8) spawnPickup(z.mesh.position, 'crystal');
            if (zombies.length === 0) setTimeout(startWave, 3000);
        }

        function createHitEffect(pos, color) {
            let p = new THREE.PointLight(color, 3, 5); p.position.copy(pos); scene.add(p);
            setTimeout(() => scene.remove(p), 100);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (isGameOver) return;

            // 玩家移動 (鎖定 X 軸，只可以左右行，或者前後行)
            let moveDir = new THREE.Vector3(moveVector.x, 0, moveVector.z);
            if (moveDir.length() > 1) moveDir.normalize();
            player.position.add(moveDir.multiplyScalar(0.2)); 
            
            // 限制玩家範圍
            player.position.x = Math.max(-10, Math.min(10, player.position.x));
            player.position.z = Math.max(-10, Math.min(5, player.position.z));

            // 玩家永遠面向前面 (如果冇射擊目標)
            if(zombies.length === 0) player.rotation.y = 0;

            // 【死死鎖定鏡頭】永遠喺玩家正後上方
            camera.position.set(player.position.x, player.position.y + 8, player.position.z + 15);
            camera.lookAt(player.position.x, player.position.y + 1.5, player.position.z - 10);

            // 喪屍邏輯
            zombies.forEach(z => {
                let targetPos = player.position;
                let dir = targetPos.clone().sub(z.mesh.position);
                dir.y = 0; dir.normalize();
                z.mesh.position.add(dir.multiplyScalar(z.speed));
                z.mesh.rotation.y = Math.atan2(dir.x, dir.z);

                // 咬人判定
                if (z.mesh.position.distanceTo(targetPos) < 2.5) {
                    playerHP -= 5; 
                    if (playerHP <= 0) gameOver();
                    if (Math.random() < 0.1) createHitEffect(player.position, 0xff0000);
                }
            });

            // 拾取物
            for (let i = pickups.length - 1; i >= 0; i--) {
                let p = pickups[i];
                let dist = player.position.distanceTo(p.mesh.position);
                if (autoPickup || dist < 2) {
                    p.mesh.position.lerp(player.position, 0.1);
                    if (dist < 1.5) {
                        if (p.type === 'ammo') ammo = Math.min(maxAmmo, ammo + 30);
                        else crystals += 2;
                        scene.remove(p.mesh); pickups.splice(i, 1); updateUI();
                    }
                }
            }

            // 修理判定 (行近大門先有得修)
            if (player.position.z < -10 && doorHP < 1000) {
                btnRepair.style.display = 'flex';
            } else {
                btnRepair.style.display = 'none';
            }

            updateUI();
            renderer.render(scene, camera);
        }

        function updateUI() {
            uiHP.innerText = Math.floor(playerHP);
            uiDoor.innerText = Math.floor(doorHP);
            uiAmmo.innerText = Math.floor(ammo);
            uiEnergy.innerText = Math.floor(energy);
            uiCrystal.innerText = Math.floor(crystals);
        }

        function gameOver() {
            isGameOver = true;
            broadcast("💀 士兵陣亡！避難所淪陷。");
            setTimeout(() => location.reload(), 3000);
        }

        function openShop() { document.getElementById('shop-modal').classList.add('active'); }
        function closeShop() { document.getElementById('shop-modal').classList.remove('active'); }
        function buyAmmo() { if(energy >= 200) { energy -= 200; ammo = Math.min(600, ammo + 100); updateUI(); } }
        function buyHeal() { if(crystals >= 5) { crystals -= 5; playerHP = 100; updateUI(); } }
        function buyWeapon(type) {
            if(type === 'shotgun' && !hasShotgun && crystals >= 30) {
                crystals -= 30; hasShotgun = true;
                document.getElementById('buy-shotgun').innerText = '已解鎖';
                document.getElementById('buy-shotgun').disabled = true;
                broadcast("🔫 解鎖散彈槍！傷害大增！");
                updateUI();
            }
        }

        // 按住修理
        let isRepairing = false;
        btnRepair.addEventListener('touchstart', () => { isRepairing = true; repairDoor(); });
        btnRepair.addEventListener('touchend', () => { isRepairing = false; });
        function repairDoor() {
            if (doorHP >= 1000 || energy < 20) return;
            doorHP += 10; if (doorHP > 1000) doorHP = 1000;
            energy -= 20;
            updateUI();
        }

        window.onload = () => {
            init3D();
            setInterval(() => { if(!isGameOver) { energy += 5; updateUI(); } }, 1000);
        };
    </script>

    <!-- 🟢 Firebase 在線統計 (已加入永久裝置 ID) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        try {
            const firebaseConfig = { databaseURL: "https://maze-leaderboard-default-rtdb.asia-southeast1.firebasedatabase.app/" };
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            const db = firebase.database();
            
            // 👇 綁定永久裝置 ID，防止刷新重複計算 👇
            let userId = localStorage.getItem('global_device_id');
            if (!userId) {
                userId = 'user_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('global_device_id', userId);
            }
            
            let pathParts = window.location.pathname.split('/').filter(p => p && p !== 'index.html');
            let gameId = pathParts[pathParts.length - 1] || 'unknown'; 
            const userStatusRef = db.ref('online_status/' + gameId + '/' + userId);
            
            db.ref('.info/connected').on('value', (snap) => {
                if (snap.val() === true) {
                    userStatusRef.onDisconnect().remove();
                    userStatusRef.set(true);
                }
            });
        } catch(e) { console.error("Firebase Error:", e); }
    </script>
