<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🥚 雞蛋仔大挑戰</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+HK:wght@700&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body {
            background-color: #1a0b00; color: #fff; font-family: 'Noto Sans HK', sans-serif;
            height: 100dvh; height: 100vh; display: flex; flex-direction: column;
            overflow: hidden; touch-action: none;
            background-image: radial-gradient(circle at center, #3d1a00 0%, #1a0b00 100%);
        }

        /* 頂部 HUD */
        #hud {
            height: 80px; background: rgba(20, 10, 0, 0.95);
            border-bottom: 3px solid #ff9f43; display: flex; align-items: center;
            justify-content: space-between; padding: 0 15px; z-index: 10;
            box-shadow: 0 0 20px rgba(255, 159, 67, 0.4); position: relative;
        }
        
        .back-btn {
            padding: 8px 12px; background: transparent; color: #ff9f43;
            border: 2px solid #ff9f43; border-radius: 8px; text-decoration: none;
            font-family: 'Orbitron', sans-serif; font-weight: bold; font-size: 13px;
            transition: 0.2s;
        }
        .back-btn:active { transform: scale(0.95); background: #ff9f43; color: #000; }

        .stats { display: flex; gap: 15px; font-family: 'Orbitron', sans-serif; text-align: center; align-items: center; }
        .stat-box { display: flex; flex-direction: column; }
        .stat-label { font-size: 10px; color: #a4b0be; letter-spacing: 1px; }
        .stat-val { font-size: 18px; font-weight: 900; color: #ffd32a; text-shadow: 0 0 10px #ffd32a; }
        .stat-val.combo { color: #ff4757; text-shadow: 0 0 10px #ff4757; }

        .shop-btn {
            background: rgba(255,255,255,0.1); border: 1px solid #00d2d3; color: #00d2d3;
            padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold;
        }

        /* 訂單顯示列 */
        #order-bar {
            height: 40px; background: #222; display: flex; align-items: center;
            justify-content: center; font-size: 14px; font-weight: bold; color: #fff;
            border-bottom: 1px solid #444; z-index: 9;
        }
        .order-highlight { color: #ffd32a; margin: 0 5px; }

        /* 遊戲畫布 */
        #canvas-container {
            flex: 1; position: relative; display: flex; justify-content: center;
            align-items: center; overflow: hidden;
        }
        canvas { display: block; }

        /* 底部控制區 */
        #controls {
            height: 120px; background: rgba(20, 10, 0, 0.95);
            border-top: 3px solid #ff9f43; display: flex; align-items: center;
            justify-content: center; padding: 0 20px; gap: 10px; z-index: 10;
        }

        .action-btn {
            padding: 12px 20px; border-radius: 12px; font-family: 'Orbitron', 'Noto Sans HK', sans-serif;
            font-size: 16px; font-weight: 900; cursor: pointer; border: none;
            box-shadow: 0 5px 0 rgba(0,0,0,0.5); transition: 0.1s;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            flex: 1; max-width: 200px;
        }
        .action-btn:active { transform: translateY(5px); box-shadow: none; }
        .action-btn:disabled { opacity: 0.3; pointer-events: none; }
        
        #btn-mix { background: linear-gradient(180deg, #00d2d3, #01a3a4); color: #fff; }
        #btn-pour { background: linear-gradient(180deg, #ffd32a, #ff9f43); color: #000; display: none; }
        #btn-flip { background: linear-gradient(180deg, #ff4757, #c0392b); color: #fff; display: none; }
        #btn-serve { background: linear-gradient(180deg, #2ed573, #27ae60); color: #fff; display: none; }
        #btn-cool { background: linear-gradient(180deg, #3498db, #2980b9); color: #fff; display: none; animation: pulse 0.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* 配料按鈕區 */
        #topping-controls {
            display: none; width: 100%; height: 100%; justify-content: center; gap: 10px; align-items: center;
        }
        .topping-btn {
            padding: 10px; border-radius: 10px; font-size: 14px; font-weight: bold;
            background: #333; color: #fff; border: 2px solid #555; cursor: pointer;
        }
        .topping-btn.selected { border-color: #2ed573; background: rgba(46, 204, 113, 0.2); }

        /* 彈出視窗 */
        .modal {
            position: absolute; inset: 0; background: rgba(10,5,0,0.95);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 30; backdrop-filter: blur(10px); padding: 20px; text-align: center;
        }
        .modal.active { display: flex; }
        .modal h2 { color: #ff9f43; font-size: 30px; font-family: 'Orbitron', sans-serif; text-shadow: 0 0 20px #ff9f43; margin-bottom: 15px; }
        .modal button {
            padding: 12px 40px; background: linear-gradient(135deg, #ff9f43, #ffd32a);
            color: #000; border: none; border-radius: 10px; font-family: 'Orbitron', sans-serif;
            font-size: 16px; font-weight: 900; cursor: pointer; margin-top: 15px;
        }
        .modal button:active { transform: scale(0.95); }

        /* 商店升級列表 */
        .shop-item {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.05); border: 1px solid #444;
            padding: 12px 15px; border-radius: 10px; margin-bottom: 10px; width: 100%; max-width: 350px;
        }
        .shop-info b { display: block; font-size: 15px; color: #fff; }
        .shop-info small { font-size: 11px; color: #aaa; }
        .buy-btn {
            padding: 8px 15px; background: #2ed573; color: #000; border: none; border-radius: 5px;
            font-weight: bold; cursor: pointer; margin: 0; font-size: 14px;
        }
        .buy-btn:disabled { background: #555; color: #888; cursor: not-allowed; }

        /* 特效字 */
        #status-text {
            position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%);
            font-size: 24px; font-weight: 900; color: #fff; text-shadow: 0 0 20px #ff9f43;
            pointer-events: none; opacity: 0; transition: 0.3s; z-index: 20; text-align: center;
        }
        #status-text.show { opacity: 1; }

        #rating-popup {
            position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%) scale(0);
            font-family: 'Orbitron', sans-serif; font-size: 100px; font-weight: 900;
            pointer-events: none; opacity: 0; z-index: 25; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-shadow: 0 0 30px currentColor;
        }
        #rating-popup.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .rank-SSS { color: #ffd700; animation: rainbow 1s infinite linear; }
        .rank-F { color: #ff4757; }
        @keyframes rainbow { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }
    </style>
</head>
<body>

    <div id="hud">
        <a href="../" class="back-btn">⬅ 大廳</a>
        <div class="stats">
            <div class="stat-box">
                <span class="stat-label">金幣</span>
                <span class="stat-val" id="money-val">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">連擊</span>
                <span class="stat-val combo" id="combo-val">0</span>
            </div>
            <button class="shop-btn" onclick="openShop()">🏪 升級</button>
        </div>
    </div>

    <div id="order-bar">
        📜 客人要求：<span class="order-highlight" id="ord-flavor">原味</span> 味，評級 <span class="order-highlight" id="ord-rank">A</span> 以上，加 <span class="order-highlight" id="ord-topping">煉奶</span>
    </div>

    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
        <div id="status-text">完美！外脆內軟！</div>
        <div id="rating-popup">S</div>
        
        <!-- 開局說明 -->
        <div id="intro-modal" class="modal active">
            <h2>🥚 終極雞蛋仔大排檔</h2>
            <p style="color:#ccc; font-size:14px; line-height:1.6; margin-bottom: 10px;">
                完成客人訂單，賺取金幣升級你嘅架生！<br>
                小心隨機突發事件同埋火候控制！
            </p>
            <button onclick="startGame()">開檔</button>
        </div>

        <!-- 升級商店 -->
        <div id="shop-modal" class="modal">
            <h2>🏪 大排檔升級</h2>
            <div class="shop-item">
                <div class="shop-info"><b>🥣 黃金打蛋器</b><small>較漿速度提升 (Lv.<span id="lvl-mix">0</span>)</small></div>
                <button class="buy-btn" id="buy-mix" onclick="buyUpgrade('mix')">$100</button>
            </div>
            <div class="shop-item">
                <div class="shop-info"><b>🧊 智能恆溫爐</b><small>完美火候區變闊 (Lv.<span id="lvl-oven">0</span>)</small></div>
                <button class="buy-btn" id="buy-oven" onclick="buyUpgrade('oven')">$200</button>
            </div>
            <div class="shop-item">
                <div class="shop-info"><b>🥄 精準量杯</b><small>倒漿誤差容忍度提升 (Lv.<span id="lvl-cup">0</span>)</small></div>
                <button class="buy-btn" id="buy-cup" onclick="buyUpgrade('cup')">$150</button>
            </div>
            <button onclick="closeShop()" style="background:#555; color:#fff;">關閉</button>
        </div>

        <!-- 結束畫面 -->
        <div id="gameover" class="modal">
            <h2>執笠啦！</h2>
            <p>總收入：<span id="final-score" style="color:#ffd32a; font-weight:bold; font-size:24px;">0</span></p>
            <button onclick="location.reload()">重新開檔</button>
        </div>
    </div>

    <div id="controls">
        <button class="action-btn" id="btn-mix">🥣 瘋狂較漿</button>
        <button class="action-btn" id="btn-pour">🥄 長按倒漿</button>
        <button class="action-btn" id="btn-flip">🔄 完美翻轉</button>
        <button class="action-btn" id="btn-cool">💧 緊急降溫</button>
        <button class="action-btn" id="btn-serve">🍽️ 起爐出餐</button>
        
        <div id="topping-controls">
            <button class="topping-btn" data-t="煉奶" onclick="selectTopping('煉奶')">🥛 煉奶</button>
            <button class="topping-btn" data-t="朱古力醬" onclick="selectTopping('朱古力醬')">🍫 朱古力醬</button>
            <button class="topping-btn" data-t="花生醬" onclick="selectTopping('花生醬')">🥜 花生醬</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // UI 綁定
        const moneyVal = document.getElementById('money-val');
        const comboVal = document.getElementById('combo-val');
        const statusText = document.getElementById('status-text');
        const ratingPopup = document.getElementById('rating-popup');
        const gameoverScreen = document.getElementById('gameover');
        const introModal = document.getElementById('intro-modal');
        const shopModal = document.getElementById('shop-modal');
        const orderFlavorEl = document.getElementById('ord-flavor');
        const orderRankEl = document.getElementById('ord-rank');
        const orderToppingEl = document.getElementById('ord-topping');
        const toppingControls = document.getElementById('topping-controls');

        const btnMix = document.getElementById('btn-mix');
        const btnPour = document.getElementById('btn-pour');
        const btnFlip = document.getElementById('btn-flip');
        const btnCool = document.getElementById('btn-cool');
        const btnServe = document.getElementById('btn-serve');

        // 遊戲設定
        const CANVAS_W = 400;
        const CANVAS_H = 450;
        canvas.width = CANVAS_W;
        canvas.height = CANVAS_H;

        // 本地存檔 (金幣與升級)
        let totalMoney = parseInt(localStorage.getItem('eggWaffle_money') || '0');
        let upgrades = JSON.parse(localStorage.getItem('eggWaffle_upgrades') || '{"mix":0,"oven":0,"cup":0}');
        moneyVal.innerText = totalMoney;

        // 口味與配料設定
        const FLAVORS = [
            { name: '原味', color: '#ff9f43', rawColor: '#f5cd79', perfectColor: '#ffd32a' },
            { name: '朱古力', color: '#6d4c41', rawColor: '#a1887f', perfectColor: '#3e2723' },
            { name: '抹茶', color: '#558b2f', rawColor: '#aed581', perfectColor: '#33691e' },
            { name: '鹹蛋黃', color: '#fbc02d', rawColor: '#fff59d', perfectColor: '#f57f17' }
        ];
        const TOPPINGS = ['煉奶', '朱古力醬', '花生醬'];

        // 音效系統
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if (type === 'mix') { osc.type = 'triangle'; osc.frequency.setValueAtTime(300 + Math.random()*100, audioCtx.currentTime); gain.gain.setValueAtTime(0.05, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1); osc.start(); osc.stop(audioCtx.currentTime + 0.1); }
            else if (type === 'pour') { osc.type = 'sine'; osc.frequency.setValueAtTime(200, audioCtx.currentTime); osc.frequency.linearRampToValueAtTime(300, audioCtx.currentTime + 0.5); gain.gain.setValueAtTime(0.05, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5); osc.start(); osc.stop(audioCtx.currentTime + 0.5); }
            else if (type === 'sizzle') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, audioCtx.currentTime); gain.gain.setValueAtTime(0.02, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2); osc.start(); osc.stop(audioCtx.currentTime + 0.2); }
            else if (type === 'ding') { osc.type = 'triangle'; osc.frequency.setValueAtTime(800, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5); osc.start(); osc.stop(audioCtx.currentTime + 0.5); }
            else if (type === 'fail') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.5); gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5); osc.start(); osc.stop(audioCtx.currentTime + 0.5); }
            else if (type === 'coin') { osc.type = 'square'; osc.frequency.setValueAtTime(1000, audioCtx.currentTime); osc.frequency.setValueAtTime(1500, audioCtx.currentTime + 0.1); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3); osc.start(); osc.stop(audioCtx.currentTime + 0.3); }
        }

        // 狀態機
        let state = 'menu'; 
        let score = 0;
        let combo = 0;
        let currentFlavor = FLAVORS[0];
        let currentOrder = null;
        let selectedTopping = null;

        // 關卡數據
        let mixProgress = 0;
        let pourAmount = 0;
        let bakeProgress = 0;
        let bakeSpeed = 1.2;
        let perfectZoneStart = 60;
        let perfectZoneEnd = 80;
        let isFlipped = false;
        
        // 誤差與突發事件
        let errorPour = 0, errorFlip1 = 0, errorFlip2 = 0;
        let eventOverheat = false;
        let eventWind = false;
        let eventShaky = false;

        let particles = [];

        // --- 初始化與流程控制 ---
        function startGame() {
            introModal.classList.remove('active');
            score = 0; combo = 0;
            updateHUD();
            resetRound();
        }

        function generateOrder() {
            let fIdx = Math.floor(Math.random() * FLAVORS.length);
            let tIdx = Math.floor(Math.random() * TOPPINGS.length);
            let ranks = ['B', 'A', 'S'];
            let reqRank = ranks[Math.floor(Math.random() * ranks.length)];
            
            currentFlavor = FLAVORS[fIdx];
            currentOrder = { flavor: currentFlavor.name, rank: reqRank, topping: TOPPINGS[tIdx] };
            
            orderFlavorEl.innerText = currentOrder.flavor;
            orderRankEl.innerText = currentOrder.rank;
            orderToppingEl.innerText = currentOrder.topping;
        }

        function resetRound() {
            generateOrder();
            state = 'mix';
            mixProgress = 0; pourAmount = 0; bakeProgress = 0; isFlipped = false;
            errorPour = 0; errorFlip1 = 0; errorFlip2 = 0;
            eventOverheat = false; eventWind = false; eventShaky = false;
            selectedTopping = null;
            
            // 升級加成
            let zoneBonus = upgrades.oven * 5; // 恆溫爐加闊綠區
            let zoneWidth = Math.max(10, 25 - combo * 2) + zoneBonus;
            let center = 65 + (Math.random() * 10 - 5);
            perfectZoneStart = center - zoneWidth / 2;
            perfectZoneEnd = center + zoneWidth / 2;
            bakeSpeed = (1.2 + combo * 0.15) * (eventWind ? 1.5 : 1);

            // 隨機突發事件 (15% 機率)
            let r = Math.random();
            if (r < 0.05) { eventOverheat = true; showStatus('🔥 爐具過熱！快降溫！', '#ff4757'); }
            else if (r < 0.10) { eventWind = true; showStatus('🌬️ 突然大風！火候加速！', '#00d2d3'); }
            else if (r < 0.15) { eventShaky = true; showStatus('🤏 手殘發作！倒漿小心！', '#f1c40f'); }

            btnMix.style.display = 'flex';
            btnPour.style.display = 'none';
            btnFlip.style.display = 'none';
            btnServe.style.display = 'none';
            btnCool.style.display = 'none';
            toppingControls.style.display = 'none';
            
            btnMix.innerText = `🥣 較漿 (${Math.floor(mixProgress)}%)`;
            ratingPopup.classList.remove('show');
            particles = [];
        }

        function updateHUD() {
            moneyVal.innerText = totalMoney;
            comboVal.innerText = combo;
        }

        function showStatus(text, color = '#fff') {
            statusText.innerText = text;
            statusText.style.color = color;
            statusText.style.textShadow = `0 0 20px ${color}`;
            statusText.classList.add('show');
            setTimeout(() => statusText.classList.remove('show'), 1500);
        }

        // --- 階段 1：較漿 ---
        btnMix.addEventListener('click', () => {
            if (state !== 'mix') return;
            let mixPower = 8 + upgrades.mix * 4;
            mixProgress += mixPower;
            playSound('mix');
            if (mixProgress >= 100) {
                mixProgress = 100;
                state = 'pour';
                btnMix.style.display = 'none';
                btnPour.style.display = 'flex';
                showStatus('漿液拌勻！準備倒漿！', '#00d2d3');
            } else {
                btnMix.innerText = `🥣 較漿 (${Math.floor(mixProgress)}%)`;
            }
        });

        // --- 階段 2：倒漿 ---
        let pourInterval = null;
        btnPour.addEventListener('mousedown', startPour);
        btnPour.addEventListener('touchstart', (e) => { e.preventDefault(); startPour(); }, {passive: false});
        window.addEventListener('mouseup', stopPour);
        window.addEventListener('touchend', stopPour);

        function startPour() {
            if (state !== 'pour') return;
            playSound('pour');
            pourInterval = setInterval(() => {
                let pSpeed = eventShaky ? (1.5 + Math.random()*3) : 1.5;
                pourAmount += pSpeed;
                if (pourAmount > 100) pourAmount = 100;
            }, 20);
        }

        function stopPour() {
            if (state !== 'pour') return;
            clearInterval(pourInterval);
            btnPour.style.display = 'none';
            
            let tolerance = 10 + upgrades.cup * 5; // 量杯增加容忍度
            errorPour = Math.abs(pourAmount - 67.5) / 32.5;
            
            if (pourAmount > 85 + upgrades.cup*2 || pourAmount < 50 - upgrades.cup*2) {
                endRound(false, '倒漿份量錯晒！', 'C');
            } else {
                state = 'bake';
                btnFlip.style.display = 'flex';
                if (eventOverheat) btnCool.style.display = 'flex';
                showStatus('合上夾爐！注意火候！', '#ff9f43');
            }
        }

        // --- 階段 3：烘焙 ---
        btnCool.addEventListener('click', () => {
            if (!eventOverheat) return;
            eventOverheat = false;
            btnCool.style.display = 'none';
            showStatus('溫度回落！', '#3498db');
        });

        btnFlip.addEventListener('click', () => {
            if (state !== 'bake' || isFlipped) return;
            let center = (perfectZoneStart + perfectZoneEnd) / 2;
            errorFlip1 = Math.abs(bakeProgress - center) / 50;
            
            if (bakeProgress >= perfectZoneStart && bakeProgress <= perfectZoneEnd) {
                playSound('ding');
                isFlipped = true;
                bakeProgress = 0;
                showStatus('完美翻面！', '#2ed573');
                
                let zoneBonus = upgrades.oven * 5;
                let zoneWidth = Math.max(10, 25 - combo * 2) + zoneBonus;
                let newCenter = 65 + (Math.random() * 10 - 5);
                perfectZoneStart = newCenter - zoneWidth / 2;
                perfectZoneEnd = newCenter + zoneWidth / 2;
                
                setTimeout(() => {
                    if (state === 'bake') {
                        btnFlip.style.display = 'none';
                        btnServe.style.display = 'flex';
                    }
                }, 1000);
            } else {
                endRound(false, '第一面燶咗/未熟！', 'F');
            }
        });

        // --- 階段 4：加配料 (新系統) ---
        function selectTopping(t) {
            selectedTopping = t;
            document.querySelectorAll('.topping-btn').forEach(b => {
                b.classList.toggle('selected', b.dataset.t === t);
            });
            // 選完配料自動出餐
            setTimeout(evaluateFinal, 500);
        }

        btnServe.addEventListener('click', () => {
            if (state !== 'bake') return;
            state = 'topping';
            btnServe.style.display = 'none';
            toppingControls.style.display = 'flex'; // 彈出配料掣
            showStatus('請加入客人要求嘅配料！', '#ffd32a');
            
            // 5秒後如果冇揀，強制出餐
            setTimeout(() => { if (state === 'topping') evaluateFinal(); }, 5000);
        });

        // --- 結算與評級 ---
        function evaluateFinal() {
            if (state === 'result') return;
            state = 'result';
            
            let center = (perfectZoneStart + perfectZoneEnd) / 2;
            errorFlip2 = Math.abs(bakeProgress - center) / 50;
            
            let rating = 'C';
            if (bakeProgress >= perfectZoneStart && bakeProgress <= perfectZoneEnd) {
                let totalError = errorPour * 0.3 + errorFlip1 * 0.35 + errorFlip2 * 0.35;
                if (totalError < 0.03) rating = 'SSS';
                else if (totalError < 0.08) rating = 'SS';
                else if (totalError < 0.15) rating = 'S';
                else if (totalError < 0.25) rating = 'A';
                else if (totalError < 0.4) rating = 'B';
            }

            // 顯示評級
            ratingPopup.innerText = rating;
            ratingPopup.className = `show rank-${rating === 'C' ? 'F' : rating}`;
            
            // 判斷是否符合客人要求 (口味、評級、配料)
            let rankTier = { 'C': 0, 'B': 1, 'A': 2, 'S': 3, 'SS': 4, 'SSS': 5 };
            let isOrderMatch = (currentFlavor.name === currentOrder.flavor) && 
                               (rankTier[rating] >= rankTier[currentOrder.rank]) && 
                               (selectedTopping === currentOrder.topping);

            if (rating === 'C') {
                combo = 0;
                playSound('fail');
                showStatus('C 級 - 唔合格！', '#ff4757');
                addMoney(0);
                setTimeout(resetRound, 2000);
            } else {
                combo++;
                let baseMoney = { 'B': 20, 'A': 40, 'S': 80, 'SS': 150, 'SSS': 300 }[rating];
                let finalMoney = baseMoney * combo;
                
                if (isOrderMatch) {
                    finalMoney *= 2;
                    showStatus(`完美訂單！雙倍小費 $${finalMoney}`, '#2ed573');
                    playSound('coin');
                } else {
                    showStatus(`${rating} 級！賺取 $${finalMoney}`, '#ffd32a');
                }

                addMoney(finalMoney);
                
                // 如果係 SSS，播放包裝動畫
                if (rating === 'SSS') {
                    showStatus('📦 終極包裝！呀樂大排檔！', '#ffd700');
                }

                setTimeout(resetRound, 2500);
            }
        }

        function addMoney(amt) {
            totalMoney += amt;
            localStorage.setItem('eggWaffle_money', totalMoney);
            updateHUD();
        }

        // --- 商店系統 ---
        function openShop() {
            if (state !== 'menu' && state !== 'result' && state !== 'mix') return;
            shopModal.classList.add('active');
            updateShopUI();
        }
        function closeShop() {
            shopModal.classList.remove('active');
        }
        function updateShopUI() {
            document.getElementById('lvl-mix').innerText = upgrades.mix;
            document.getElementById('lvl-oven').innerText = upgrades.oven;
            document.getElementById('lvl-cup').innerText = upgrades.cup;
            
            document.getElementById('buy-mix').innerText = `$${100 * (upgrades.mix + 1)}`;
            document.getElementById('buy-oven').innerText = `$${200 * (upgrades.oven + 1)}`;
            document.getElementById('buy-cup').innerText = `$${150 * (upgrades.cup + 1)}`;
            
            document.getElementById('buy-mix').disabled = totalMoney < 100 * (upgrades.mix + 1);
            document.getElementById('buy-oven').disabled = totalMoney < 200 * (upgrades.oven + 1);
            document.getElementById('buy-cup').disabled = totalMoney < 150 * (upgrades.cup + 1);
        }
        function buyUpgrade(type) {
            let cost = 0;
            if (type === 'mix') cost = 100 * (upgrades.mix + 1);
            if (type === 'oven') cost = 200 * (upgrades.oven + 1);
            if (type === 'cup') cost = 150 * (upgrades.cup + 1);
            
            if (totalMoney >= cost) {
                totalMoney -= cost;
                upgrades[type]++;
                localStorage.setItem('eggWaffle_money', totalMoney);
                localStorage.setItem('eggWaffle_upgrades', JSON.stringify(upgrades));
                playSound('coin');
                updateHUD();
                updateShopUI();
            }
        }

        // --- 渲染與物理更新 ---
        function update() {
            if (state === 'mix') {
                if (mixProgress > 0 && Math.random() < 0.05) mixProgress -= 0.5;
            }
            if (state === 'bake') {
                let currentSpeed = bakeSpeed;
                if (eventOverheat) currentSpeed *= 1.8;
                bakeProgress += currentSpeed;
                
                if (bakeProgress >= 100) {
                    endRound(false, '完全燶晒！', 'F');
                }
                if (Math.random() < 0.05) playSound('sizzle');
            }
            
            // 更新粒子
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.vy -= 0.1; p.life -= 0.02;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
            
            // 背景
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
            ctx.strokeStyle = '#34495e';
            ctx.lineWidth = 2;
            for (let i = 0; i < CANVAS_W; i += 50) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, CANVAS_H); ctx.stroke(); }
            
            // 爐具
            ctx.fillStyle = '#111';
            ctx.beginPath(); ctx.ellipse(CANVAS_W/2, CANVAS_H - 50, 160, 30, 0, 0, Math.PI * 2); ctx.fill();

            // 畫火 (如果過熱變色)
            if (state === 'bake') {
                let fireIntensity = 1 + (bakeProgress / 100);
                let fireY = CANVAS_H - 80;
                ctx.shadowBlur = 20; ctx.shadowColor = eventOverheat ? '#ff4757' : '#ff9f43';
                for (let i = 0; i < 5; i++) {
                    let fx = CANVAS_W/2 - 80 + i * 40;
                    let fh = 20 + Math.random() * 20 * fireIntensity;
                    ctx.fillStyle = eventOverheat ? '#ff0000' : (bakeProgress > perfectZoneEnd ? '#ff4757' : '#ff9f43');
                    ctx.beginPath(); ctx.moveTo(fx - 10, fireY); ctx.quadraticCurveTo(fx, fireY - fh, fx + 10, fireY); ctx.fill();
                }
                ctx.shadowBlur = 0;
            }

            ctx.save();
            ctx.translate(CANVAS_W/2, CANVAS_H/2 - 20);
            
            // 鐵夾底座
            ctx.fillStyle = '#1e272e';
            ctx.beginPath(); ctx.roundRect(-110, -110, 220, 220, 20); ctx.fill();
            ctx.strokeStyle = '#485460'; ctx.lineWidth = 5; ctx.stroke();

            // 繪製各階段
            if (state === 'mix' || state === 'pour') {
                ctx.fillStyle = '#ecf0f1'; ctx.beginPath(); ctx.arc(0, 0, 90, 0, Math.PI); ctx.fill();
                if (state === 'mix') {
                    ctx.fillStyle = currentFlavor.color; ctx.beginPath(); ctx.arc(0, 10, 80 * (mixProgress/100 + 0.1), 0, Math.PI); ctx.fill();
                } else {
                    let pourH = (pourAmount / 100) * 180;
                    ctx.fillStyle = currentFlavor.color; ctx.beginPath(); ctx.roundRect(-90, 90 - pourH, 180, pourH, 10); ctx.fill();
                }
            }

            if (state === 'bake' || state === 'topping' || state === 'result') {
                // 畫雞蛋仔本體
                for (let r = -3; r <= 3; r++) {
                    for (let c = -3; c <= 3; c++) {
                        ctx.beginPath(); ctx.arc(c * 28, r * 28, 11, 0, Math.PI * 2);
                        if (bakeProgress > perfectZoneEnd) ctx.fillStyle = '#111'; 
                        else if (bakeProgress > perfectZoneStart) ctx.fillStyle = currentFlavor.perfectColor; 
                        else ctx.fillStyle = currentFlavor.rawColor; 
                        ctx.fill();
                    }
                }

                if (isFlipped) {
                    ctx.fillStyle = 'rgba(30, 39, 46, 0.9)'; ctx.beginPath(); ctx.roundRect(-110, -110, 220, 220, 20); ctx.fill();
                    ctx.fillStyle = '#fff'; ctx.font = 'bold 24px "Noto Sans HK"'; ctx.textAlign = 'center'; ctx.fillText('焗緊另一面...', 0, 0);
                }

                // 火候條
                if (state === 'bake') {
                    ctx.translate(0, -140);
                    ctx.fillStyle = '#111'; ctx.fillRect(-90, 0, 180, 18);
                    ctx.fillStyle = 'rgba(46, 204, 113, 0.5)'; 
                    ctx.fillRect(-90 + (perfectZoneStart/100)*180, 0, ((perfectZoneEnd-perfectZoneStart)/100)*180, 18);
                    ctx.fillStyle = eventOverheat ? '#ff0000' : '#ff9f43'; 
                    ctx.fillRect(-90, 0, (bakeProgress/100)*180, 18);
                    ctx.strokeStyle = '#fff'; ctx.strokeRect(-90, 0, 180, 18);
                }

                // 配料特效 (如果已選)
                if (selectedTopping && state !== 'result') {
                    ctx.fillStyle = selectedTopping === '煉奶' ? '#fff' : selectedTopping === '朱古力醬' ? '#5c3a21' : '#d35400';
                    ctx.globalAlpha = 0.6;
                    for (let i = 0; i < 10; i++) {
                        ctx.beginPath(); ctx.arc(Math.random()*160-80, Math.random()*160-80, 4, 0, Math.PI*2); ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                }
            }

            ctx.restore();

            // 粒子
            for (let p of particles) {
                ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        function loop() {
            requestAnimationFrame(loop);
            update();
            draw();
        }

        loop();
    </script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        try {
            const firebaseConfig = { databaseURL: "https://maze-leaderboard-default-rtdb.asia-southeast1.firebasedatabase.app/" };
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            const db = firebase.database();
            const userId = 'user_' + Math.random().toString(36).substr(2, 9);
            let pathParts = window.location.pathname.split('/').filter(p => p && p !== 'index.html');
            let gameId = pathParts[pathParts.length - 1] || 'unknown'; 
            const userStatusRef = db.ref('online_status/' + gameId + '/' + userId);
            db.ref('.info/connected').on('value', (snap) => {
                if (snap.val() === true) {
                    userStatusRef.onDisconnect().remove();
                    userStatusRef.set(true);
                }
            });
        } catch(e) {}
    </script>
