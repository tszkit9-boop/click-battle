<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🥚 雞蛋仔大挑戰</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+HK:wght@700;900&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body {
            background-color: #050302; color: #fff; font-family: 'Noto Sans HK', sans-serif;
            height: 100dvh; height: 100vh; display: flex; flex-direction: column;
            overflow: hidden; touch-action: none;
            background: radial-gradient(circle at top, #1a0f08 0%, #050302 100%);
        }

        /* 頂部 HUD */
        #hud {
            height: 60px; background: rgba(15, 8, 0, 0.85);
            border-bottom: 2px solid rgba(255, 159, 67, 0.6); display: flex; align-items: center;
            justify-content: space-between; padding: 0 15px; z-index: 10;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8); flex-shrink: 0;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        
        .back-btn {
            padding: 6px 12px; background: rgba(255, 159, 67, 0.1); color: #ff9f43;
            border: 1px solid #ff9f43; border-radius: 8px; text-decoration: none;
            font-family: 'Orbitron', sans-serif; font-weight: bold; font-size: 12px;
            transition: 0.2s;
        }
        .back-btn:active { transform: scale(0.95); background: #ff9f43; color: #000; }

        .stats { display: flex; gap: 15px; font-family: 'Orbitron', sans-serif; text-align: center; align-items: center; }
        .stat-box { display: flex; flex-direction: column; }
        .stat-label { font-size: 9px; color: #a4b0be; letter-spacing: 1px; }
        .stat-val { font-size: 18px; font-weight: 900; color: #ffd32a; text-shadow: 0 0 10px #ffd32a; }
        .stat-val.combo { color: #ff4757; text-shadow: 0 0 10px #ff4757; }
        .stat-val.round { color: #00d2d3; text-shadow: 0 0 10px #00d2d3; }

        .shop-btn {
            background: rgba(0, 210, 211, 0.1); border: 1px solid #00d2d3; color: #00d2d3;
            padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold;
            box-shadow: 0 0 10px rgba(0,210,211,0.2);
        }
        .shop-btn:active { background: #00d2d3; color: #000; }

        /* 訂單列 */
        #order-bar {
            height: 40px; background: linear-gradient(90deg, rgba(0,0,0,0.9), rgba(40,20,0,0.9), rgba(0,0,0,0.9)); 
            display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold;
            border-bottom: 1px solid #333; z-index: 9; flex-shrink: 0;
        }
        .order-highlight { color: #ffd32a; margin: 0 3px; }

        /* 畫布區 */
        #canvas-container {
            flex: 1; position: relative; display: flex; justify-content: center;
            align-items: center; overflow: hidden;
        }
        canvas { display: block; width: 100%; height: 100%; }

        /* 底部控制 */
        #controls {
            height: 110px; background: rgba(10, 5, 0, 0.95);
            border-top: 2px solid rgba(255, 159, 67, 0.6); display: flex; align-items: center;
            justify-content: center; padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
            gap: 10px; z-index: 20; flex-shrink: 0; position: relative;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.8);
        }

        .action-btn {
            padding: 12px 10px; border-radius: 12px; font-family: 'Orbitron', 'Noto Sans HK', sans-serif;
            font-size: 16px; font-weight: 900; cursor: pointer; border: none;
            box-shadow: 0 6px 0 rgba(0,0,0,0.6), inset 0 2px 5px rgba(255,255,255,0.4); 
            transition: 0.1s; display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 100%; height: 100%; max-height: 70px; text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }
        .action-btn:active { transform: translateY(6px); box-shadow: 0 0 0 rgba(0,0,0,0.6), inset 0 2px 5px rgba(255,255,255,0.2); }
        .action-btn:disabled { opacity: 0.4; pointer-events: none; filter: grayscale(0.8); }
        
        #btn-mix { background: linear-gradient(180deg, #00d2d3, #01a3a4); color: #fff; display: flex; }
        #btn-pour { background: linear-gradient(180deg, #ffd32a, #ff9f43); color: #000; display: none; text-shadow: none; }
        #btn-flip { background: linear-gradient(180deg, #ff4757, #c0392b); color: #fff; display: none; }
        #btn-serve { background: linear-gradient(180deg, #2ed573, #27ae60); color: #fff; display: none; }
        #btn-cool { background: linear-gradient(180deg, #3498db, #2980b9); color: #fff; display: none; animation: pulse 0.5s infinite; }
        #btn-next { background: linear-gradient(180deg, #9b59b6, #8e44ad); color: #fff; display: none; font-size: 16px; }
        #btn-retry { background: linear-gradient(180deg, #f39c12, #e67e22); color: #fff; display: none; font-size: 16px; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); box-shadow: 0 0 20px #3498db; } 100% { transform: scale(1); } }

        /* 配料掣 */
        #topping-controls {
            display: none; width: 100%; height: 100%; justify-content: center; gap: 8px; align-items: center;
        }
        .topping-btn {
            padding: 10px; border-radius: 12px; font-size: 14px; font-weight: bold;
            background: linear-gradient(180deg, #333, #111); color: #fff; border: 1px solid #555; 
            cursor: pointer; flex: 1; height: 60px; box-shadow: 0 4px 0 #000;
            transition: 0.1s;
        }
        .topping-btn:active { transform: translateY(4px); box-shadow: none; }

        /* 彈出視窗 */
        .modal {
            position: absolute; inset: 0; background: rgba(5, 2, 0, 0.9);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 30; backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); padding: 20px; text-align: center;
        }
        .modal.active { display: flex; }
        .modal h2 { color: #ff9f43; font-size: 28px; font-family: 'Orbitron', sans-serif; text-shadow: 0 0 20px #ff9f43; margin-bottom: 15px; }
        .modal p { font-size: 14px; color: #ccc; line-height: 1.6; margin-bottom: 20px; }
        .modal button {
            padding: 14px 40px; background: linear-gradient(135deg, #ff9f43, #ffd32a);
            color: #000; border: none; border-radius: 12px; font-family: 'Orbitron', sans-serif;
            font-size: 18px; font-weight: 900; cursor: pointer; box-shadow: 0 5px 0 #b38f00;
        }
        .modal button:active { transform: translateY(5px); box-shadow: none; }

        /* 商店 */
        .shop-item {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.05); border: 1px solid #444;
            padding: 12px 15px; border-radius: 12px; margin-bottom: 12px; width: 100%; max-width: 350px;
        }
        .shop-info b { display: block; font-size: 14px; color: #fff; }
        .shop-info small { font-size: 11px; color: #aaa; }
        .buy-btn {
            padding: 8px 15px; background: linear-gradient(180deg, #2ed573, #27ae60); color: #000; 
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin: 0; font-size: 13px;
            box-shadow: 0 3px 0 #145a32;
        }
        .buy-btn:disabled { background: #333; color: #666; box-shadow: none; cursor: not-allowed; }

        /* 特效字 */
        #status-text {
            position: absolute; top: 15%; left: 50%; transform: translate(-50%, -50%);
            font-size: 22px; font-weight: 900; color: #fff; text-shadow: 0 0 20px #ff9f43;
            pointer-events: none; opacity: 0; transition: 0.3s; z-index: 20; text-align: center; width: 90%;
            background: rgba(0,0,0,0.8); padding: 12px; border-radius: 10px; border: 1px solid #ff9f43;
        }
        #status-text.show { opacity: 1; }

        #rating-popup {
            position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%) scale(0);
            font-family: 'Orbitron', sans-serif; font-size: 100px; font-weight: 900;
            pointer-events: none; opacity: 0; z-index: 25; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-shadow: 0 0 40px currentColor, 0 10px 20px rgba(0,0,0,0.8);
            -webkit-text-stroke: 2px rgba(255,255,255,0.5);
        }
        #rating-popup.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .rank-SSS { color: #ffd700; animation: rainbow 1s infinite linear; font-size: 120px; }
        .rank-F { color: #ff4757; }
        @keyframes rainbow { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }
    </style>
</head>
<body>

    <div id="hud">
        <a href="../" class="back-btn">⬅ 大廳</a>
        <div class="stats">
            <div class="stat-box">
                <span class="stat-label">關卡</span>
                <span class="stat-val round" id="round-val">1</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">金幣</span>
                <span class="stat-val" id="money-val">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">連擊</span>
                <span class="stat-val combo" id="combo-val">0</span>
            </div>
            <button class="shop-btn" onclick="openShop()">🏪 升級</button>
        </div>
    </div>

    <div id="order-bar">
        📜 要求：<span class="order-highlight" id="ord-flavor">原味</span> 味，評級 <span class="order-highlight" id="ord-rank">A</span> 以上，加 <span class="order-highlight" id="ord-topping">煉奶</span>
    </div>

    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
        <div id="status-text">完美！外脆內軟！</div>
        <div id="rating-popup">S</div>
        
        <div id="intro-modal" class="modal active">
            <h2>🥚 雞蛋仔大挑戰</h2>
            <p>完成客人訂單，賺取金幣升級你嘅架生！<br>小心客人等到發脾氣！</p>
            <button onclick="startGame()">開檔</button>
        </div>

        <div id="shop-modal" class="modal">
            <h2>🏪 大排檔升級</h2>
            <div class="shop-item">
                <div class="shop-info"><b>🥣 黃金打蛋器</b><small>較漿速度提升 (Lv.<span id="lvl-mix">0</span>)</small></div>
                <button class="buy-btn" id="buy-mix" onclick="buyUpgrade('mix')">$100</button>
            </div>
            <div class="shop-item">
                <div class="shop-info"><b>🧊 智能恆溫爐</b><small>完美火候區變闊 (Lv.<span id="lvl-oven">0</span>)</small></div>
                <button class="buy-btn" id="buy-oven" onclick="buyUpgrade('oven')">$200</button>
            </div>
            <div class="shop-item">
                <div class="shop-info"><b>🥄 精準量杯</b><small>倒漿誤差容忍度提升 (Lv.<span id="lvl-cup">0</span>)</small></div>
                <button class="buy-btn" id="buy-cup" onclick="buyUpgrade('cup')">$150</button>
            </div>
            <button onclick="closeShop()" style="background:#444; color:#fff; box-shadow: 0 4px 0 #111;">關閉</button>
        </div>

        <div id="gameover" class="modal">
            <h2>執笠啦！</h2>
            <p>總收入：<span id="final-score" style="color:#ffd32a; font-weight:bold; font-size:20px;">0</span></p>
            <button onclick="retryCurrentLevel()">🔄 重試本關</button>
            <button onclick="backToLobby()" style="background:#444; color:#fff; box-shadow:0 4px 0 #111; margin-top:10px;">🏠 返回大廳</button>
        </div>
    </div>

    <div id="controls">
        <button class="action-btn" id="btn-mix">🥣 長按較漿</button>
        <button class="action-btn" id="btn-pour">🥄 點擊倒漿</button>
        <button class="action-btn" id="btn-flip">🔄 翻轉</button>
        <button class="action-btn" id="btn-cool">💧 降溫</button>
        <button class="action-btn" id="btn-serve">🍽️ 出餐</button>
        <button class="action-btn" id="btn-next">➡️ 下一關</button>
        <button class="action-btn" id="btn-retry">🔄 重試本關</button>
        
        <div id="topping-controls">
            <button class="topping-btn" data-t="煉奶" onclick="selectTopping('煉奶')">🥛 煉奶</button>
            <button class="topping-btn" data-t="朱古力醬" onclick="selectTopping('朱古力醬')">🍫 朱古力</button>
            <button class="topping-btn" data-t="花生醬" onclick="selectTopping('花生醬')">🥜 花生醬</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const moneyVal = document.getElementById('money-val');
        const comboVal = document.getElementById('combo-val');
        const roundVal = document.getElementById('round-val');
        const statusText = document.getElementById('status-text');
        const ratingPopup = document.getElementById('rating-popup');
        const gameoverScreen = document.getElementById('gameover');
        const introModal = document.getElementById('intro-modal');
        const shopModal = document.getElementById('shop-modal');
        const orderFlavorEl = document.getElementById('ord-flavor');
        const orderRankEl = document.getElementById('ord-rank');
        const orderToppingEl = document.getElementById('ord-topping');
        const toppingControls = document.getElementById('topping-controls');

        const btnMix = document.getElementById('btn-mix');
        const btnPour = document.getElementById('btn-pour');
        const btnFlip = document.getElementById('btn-flip');
        const btnCool = document.getElementById('btn-cool');
        const btnServe = document.getElementById('btn-serve');
        const btnNext = document.getElementById('btn-next');
        const btnRetry = document.getElementById('btn-retry');

        function resizeCanvas() {
            let size = Math.min(window.innerWidth, window.innerHeight - 220);
            size = Math.max(size, 280);
            canvas.width = size;
            canvas.height = size;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let totalMoney = parseInt(localStorage.getItem('eggWaffle_money') || '0');
        let upgrades = JSON.parse(localStorage.getItem('eggWaffle_upgrades') || '{"mix":0,"oven":0,"cup":0}');
        moneyVal.innerText = totalMoney;

        const FLAVORS = [
            { name: '原味', color: '#ffb347', rawColor: '#f5cd79', perfectColor: '#f39c12' },
            { name: '朱古力', color: '#5d4037', rawColor: '#8d6e63', perfectColor: '#3e2723' },
            { name: '抹茶', color: '#558b2f', rawColor: '#aed581', perfectColor: '#2e7d32' },
            { name: '鹹蛋黃', color: '#fbc02d', rawColor: '#fff59d', perfectColor: '#f57f17' }
        ];
        const TOPPINGS = ['煉奶', '朱古力醬', '花生醬'];
        const SHIRT_COLORS = ['#e74c3c', '#3498db', '#9b59b6', '#1abc9c', '#f1c40f', '#e67e22'];

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if (type === 'mix') { osc.type = 'triangle'; osc.frequency.setValueAtTime(300, audioCtx.currentTime); gain.gain.setValueAtTime(0.05, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1); osc.start(); osc.stop(audioCtx.currentTime + 0.1); }
            else if (type === 'pour') { osc.type = 'sine'; osc.frequency.setValueAtTime(200, audioCtx.currentTime); osc.frequency.linearRampToValueAtTime(300, audioCtx.currentTime + 0.5); gain.gain.setValueAtTime(0.05, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5); osc.start(); osc.stop(audioCtx.currentTime + 0.5); }
            else if (type === 'sizzle') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, audioCtx.currentTime); gain.gain.setValueAtTime(0.02, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2); osc.start(); osc.stop(audioCtx.currentTime + 0.2); }
            else if (type === 'ding') { osc.type = 'triangle'; osc.frequency.setValueAtTime(800, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5); osc.start(); osc.stop(audioCtx.currentTime + 0.5); }
            else if (type === 'fail') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.5); gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5); osc.start(); osc.stop(audioCtx.currentTime + 0.5); }
            else if (type === 'coin') { osc.type = 'square'; osc.frequency.setValueAtTime(1000, audioCtx.currentTime); osc.frequency.setValueAtTime(1500, audioCtx.currentTime + 0.1); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3); osc.start(); osc.stop(audioCtx.currentTime + 0.3); }
        }

        let state = 'menu'; 
        let round = 1;
        let score = 0;
        let combo = 0;
        let currentFlavor = FLAVORS[0];
        let currentOrder = null;
        let selectedTopping = null;
        
        let customerPatience = 100;
        let customerMood = 'happy'; 
        let customerShirt = SHIRT_COLORS[0];

        let mixProgress = 0;
        let pourAmount = 0;
        let isPouring = false;
        let bakeProgress = 0;
        let bakeSpeed = 1.0;
        let perfectZoneStart = 60;
        let perfectZoneEnd = 80;
        let isFlipped = false;
        
        let errorPour = 0, errorFlip1 = 0, errorFlip2 = 0;
        let eventOverheat = false;
        let eventWind = false;
        let eventShaky = false;

        let particles = [];
        let smokeParticles = [];
        let toppingTimeout = null;
        let time = 0;

        let mixInterval = null;
        let pourInterval = null;

        function startGame() {
            introModal.classList.remove('active');
            score = 0; combo = 0; round = 1;
            updateHUD();
            resetRound();
        }

        function generateOrder() {
            let fIdx = Math.floor(Math.random() * FLAVORS.length);
            let tIdx = Math.floor(Math.random() * TOPPINGS.length);
            let ranks = ['B', 'A', 'S'];
            let reqRank = ranks[Math.floor(Math.random() * ranks.length)];
            
            currentFlavor = FLAVORS[fIdx];
            currentOrder = { flavor: currentFlavor.name, rank: reqRank, topping: TOPPINGS[tIdx] };
            
            orderFlavorEl.innerText = currentOrder.flavor;
            orderRankEl.innerText = currentOrder.rank;
            orderToppingEl.innerText = currentOrder.topping;
            
            customerShirt = SHIRT_COLORS[Math.floor(Math.random() * SHIRT_COLORS.length)];
        }

        function resetRound(isRetry = false) {
            if(toppingTimeout) clearTimeout(toppingTimeout);
            if(mixInterval) clearInterval(mixInterval);
            if(pourInterval) clearInterval(pourInterval);
            
            if(!isRetry) generateOrder();
            state = 'mix';
            mixProgress = 0; pourAmount = 0; isPouring = false; bakeProgress = 0; isFlipped = false;
            errorPour = 0; errorFlip1 = 0; errorFlip2 = 0;
            eventOverheat = false; eventWind = false; eventShaky = false;
            selectedTopping = null;
            particles = []; smokeParticles = [];
            
            customerPatience = 100;
            customerMood = 'happy';
            
            let zoneBonus = upgrades.oven * 5; 
            let zoneWidth = Math.max(20, 35 - combo * 1.5) + zoneBonus;
            if (round <= 3) zoneWidth += 20;

            let center = 65 + (Math.random() * 10 - 5);
            perfectZoneStart = center - zoneWidth / 2;
            perfectZoneEnd = center + zoneWidth / 2;
            
            /* 👇 火候已調慢：原本 0.8，改為 0.45 👇 */
            bakeSpeed = (0.45 + Math.min(combo, 10) * 0.05) * (eventWind ? 1.25 : 1);

            if (round > 3) {
                let r = Math.random();
                if (r < 0.03) { eventOverheat = true; showStatus('🔥 爐具過熱！快降溫！', '#ff4757'); }
                else if (r < 0.06) { eventWind = true; showStatus('🌬️ 突然大風！火候加速！', '#00d2d3'); }
                else if (r < 0.09) { eventShaky = true; showStatus('🤏 手殘發作！倒漿小心！', '#f1c40f'); }
            }

            btnMix.style.display = 'flex';
            btnPour.style.display = 'none';
            btnFlip.style.display = 'none';
            btnServe.style.display = 'none';
            btnCool.style.display = 'none';
            btnNext.style.display = 'none';
            btnRetry.style.display = 'none';
            toppingControls.style.display = 'none';
            
            btnMix.innerText = `🥣 長按較漿`;
            ratingPopup.classList.remove('show');
            
            if(!isRetry) {
                showStatus(`第 ${round} 關：${currentOrder.flavor}味，要${currentOrder.rank}級，加${currentOrder.topping}`, '#fff');
            } else {
                showStatus(`🔄 重試第 ${round} 關：${currentOrder.flavor}味，要${currentOrder.rank}級，加${currentOrder.topping}`, '#f39c12');
            }
        }

        function updateHUD() {
            moneyVal.innerText = totalMoney;
            comboVal.innerText = combo;
            roundVal.innerText = round;
        }

        function showStatus(text, color = '#fff') {
            statusText.innerText = text;
            statusText.style.color = color;
            statusText.style.textShadow = `0 0 20px ${color}`;
            statusText.classList.add('show');
            setTimeout(() => statusText.classList.remove('show'), 2000); 
        }

        function endRound(isSuccess, reason = '') {
            if (state === 'result') return;
            state = 'result';
            
            let rating = 'C';
            if (isSuccess) {
                let center = (perfectZoneStart + perfectZoneEnd) / 2;
                errorFlip2 = Math.abs(bakeProgress - center) / 50;
                
                if (bakeProgress >= perfectZoneStart && bakeProgress <= perfectZoneEnd) {
                    let totalError = errorPour * 0.3 + errorFlip1 * 0.35 + errorFlip2 * 0.35;
                    if (totalError < 0.05) rating = 'SSS';
                    else if (totalError < 0.12) rating = 'SS';
                    else if (totalError < 0.2) rating = 'S';
                    else if (totalError < 0.35) rating = 'A';
                    else if (totalError < 0.5) rating = 'B';
                }
            }

            ratingPopup.innerText = rating === 'C' ? 'F' : rating;
            ratingPopup.className = `show rank-${rating === 'C' ? 'F' : rating}`;
            
            let rankTier = { 'C': 0, 'B': 1, 'A': 2, 'S': 3, 'SS': 4, 'SSS': 5 };
            let isOrderMatch = (currentFlavor.name === currentOrder.flavor) && 
                               (rankTier[rating] >= rankTier[currentOrder.rank]) && 
                               (selectedTopping === currentOrder.topping);

            if (rating === 'C') {
                combo = 0;
                playSound('fail');
                showStatus(reason || 'C 級 - 唔合格！', '#ff4757');
                addMoney(0);
                btnRetry.style.display = 'flex';
            } else {
                combo++;
                let baseMoney = { 'B': 20, 'A': 40, 'S': 80, 'SS': 150, 'SSS': 300 }[rating];
                let finalMoney = baseMoney * combo;
                
                if (isOrderMatch) {
                    finalMoney *= 2;
                    showStatus(`完美訂單！雙倍小費 $${finalMoney}`, '#2ed573');
                    playSound('coin');
                } else {
                    showStatus(`${rating} 級！賺取 $${finalMoney}`, '#ffd32a');
                }
                addMoney(finalMoney);
                if (rating === 'SSS') showStatus('📦 終極包裝！', '#ffd700');
                
                btnNext.style.display = 'flex';
                btnNext.innerText = '➡️ 進入第 ' + (round + 1) + ' 關';
            }
        }

        btnNext.addEventListener('click', () => { round++; updateHUD(); resetRound(false); });
        btnRetry.addEventListener('click', () => { resetRound(true); });

        /* 👇 新增：重試本關 / 返回大廳（防呆包 try...catch） 👇 */
        function retryCurrentLevel() {
            try {
                gameoverScreen.classList.remove('active');
                resetRound(true);
            } catch (e) {
                console.error('重試本關錯誤', e);
            }
        }

        function backToLobby() {
            try {
                location.href = '../index.html';
            } catch (e) {
                console.error('返回大廳錯誤', e);
            }
        }

        function addMoney(amt) {
            totalMoney += amt;
            localStorage.setItem('eggWaffle_money', totalMoney);
            updateHUD();
        }

        // --- 較漿 ---
        btnMix.addEventListener('mousedown', startMix);
        btnMix.addEventListener('touchstart', (e) => { e.preventDefault(); startMix(); }, {passive: false});
        window.addEventListener('mouseup', stopMix);
        window.addEventListener('touchend', stopMix);

        function startMix() {
            if (state !== 'mix') return;
            if (mixInterval) clearInterval(mixInterval);
            mixInterval = setInterval(() => {
                let mixPower = 2 + upgrades.mix * 1.5;
                mixProgress += mixPower;
                playSound('mix');
                
                for(let i=0; i<3; i++) {
                    particles.push({ x: canvas.width/2 + (Math.random()-0.5)*60, y: canvas.height/2 + (Math.random()-0.5)*30, vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4, life: 1, color: currentFlavor.color, size: 4 });
                }
                
                if (mixProgress >= 100) {
                    mixProgress = 100;
                    clearInterval(mixInterval); mixInterval = null;
                    state = 'pour';
                    btnMix.style.display = 'none';
                    btnPour.style.display = 'flex';
                    showStatus('準備倒漿！點擊開始/停止', '#00d2d3');
                }
            }, 50);
        }
        function stopMix() { if (mixInterval) { clearInterval(mixInterval); mixInterval = null; } }

        // --- 倒漿 ---
        btnPour.addEventListener('click', togglePour);
        btnPour.addEventListener('touchstart', (e) => { e.preventDefault(); togglePour(); }, {passive: false});

        function togglePour() {
            if (state !== 'pour') return;
            
            if (!isPouring) {
                isPouring = true;
                playSound('pour');
                btnPour.innerText = '⏹️ 停止倒漿';
                pourInterval = setInterval(() => {
                    let pSpeed = eventShaky ? (1.5 + Math.random()*2) : 1.5;
                    pourAmount += pSpeed;
                    if (pourAmount > 100) pourAmount = 100;
                }, 20);
            } else {
                isPouring = false;
                clearInterval(pourInterval); pourInterval = null;
                btnPour.style.display = 'none';
                
                errorPour = Math.abs(pourAmount - 67.5) / 32.5;
                
                if (pourAmount > 85 + upgrades.cup*2 || pourAmount < 50 - upgrades.cup*2) {
                    endRound(false, '倒漿份量錯晒！');
                } else {
                    state = 'bake';
                    btnFlip.style.display = 'flex';
                    if (eventOverheat) btnCool.style.display = 'flex';
                    showStatus('合上夾爐！注意火候！', '#ff9f43');
                }
            }
        }

        btnCool.addEventListener('click', () => {
            if (!eventOverheat) return;
            eventOverheat = false;
            btnCool.style.display = 'none';
            showStatus('溫度回落！', '#3498db');
        });

        btnFlip.addEventListener('click', () => {
            if (state !== 'bake' || isFlipped) return;
            let center = (perfectZoneStart + perfectZoneEnd) / 2;
            errorFlip1 = Math.abs(bakeProgress - center) / 50;
            
            if (bakeProgress >= perfectZoneStart && bakeProgress <= perfectZoneEnd) {
                playSound('ding');
                isFlipped = true;
                bakeProgress = 0;
                showStatus('完美翻面！', '#2ed573');
                
                let zoneBonus = upgrades.oven * 5;
                let zoneWidth = Math.max(20, 35 - combo * 1.5) + zoneBonus;
                let newCenter = 65 + (Math.random() * 10 - 5);
                perfectZoneStart = newCenter - zoneWidth / 2;
                perfectZoneEnd = newCenter + zoneWidth / 2;
                
                setTimeout(() => {
                    if (state === 'bake') {
                        btnFlip.style.display = 'none';
                        btnServe.style.display = 'flex';
                    }
                }, 1000);
            } else {
                endRound(false, '第一面燶咗/未熟！');
            }
        });

        function selectTopping(t) {
            if (state !== 'topping') return;
            selectedTopping = t;
            document.querySelectorAll('.topping-btn').forEach(b => {
                b.classList.toggle('selected', b.dataset.t === t);
            });
            if(toppingTimeout) clearTimeout(toppingTimeout);
            endRound(true);
        }

        btnServe.addEventListener('click', () => {
            if (state !== 'bake') return;
            state = 'topping';
            btnServe.style.display = 'none';
            toppingControls.style.display = 'flex';
            showStatus('請加入客人要求嘅配料！', '#ffd32a');
            
            toppingTimeout = setTimeout(() => { 
                if (state === 'topping') endRound(true); 
            }, 5000);
        });

        function openShop() {
            if (state !== 'menu' && state !== 'result' && state !== 'mix') return;
            shopModal.classList.add('active');
            updateShopUI();
        }
        function closeShop() { shopModal.classList.remove('active'); }
        function updateShopUI() {
            document.getElementById('lvl-mix').innerText = upgrades.mix;
            document.getElementById('lvl-oven').innerText = upgrades.oven;
            document.getElementById('lvl-cup').innerText = upgrades.cup;
            document.getElementById('buy-mix').innerText = `$${100 * (upgrades.mix + 1)}`;
            document.getElementById('buy-oven').innerText = `$${200 * (upgrades.oven + 1)}`;
            document.getElementById('buy-cup').innerText = `$${150 * (upgrades.cup + 1)}`;
            document.getElementById('buy-mix').disabled = totalMoney < 100 * (upgrades.mix + 1);
            document.getElementById('buy-oven').disabled = totalMoney < 200 * (upgrades.oven + 1);
            document.getElementById('buy-cup').disabled = totalMoney < 150 * (upgrades.cup + 1);
        }
        function buyUpgrade(type) {
            let cost = type === 'mix' ? 100 * (upgrades.mix + 1) : type === 'oven' ? 200 * (upgrades.oven + 1) : 150 * (upgrades.cup + 1);
            if (totalMoney >= cost) {
                totalMoney -= cost;
                upgrades[type]++;
                localStorage.setItem('eggWaffle_money', totalMoney);
                localStorage.setItem('eggWaffle_upgrades', JSON.stringify(upgrades));
                playSound('coin');
                updateHUD(); updateShopUI();
            }
        }

        function update() {
            time += 0.05;
            
            if (state === 'mix' || state === 'pour' || state === 'bake' || state === 'topping') {
                customerPatience -= 0.12 + (round * 0.02);
                
                if (customerPatience <= 0) {
                    customerPatience = 0;
                    customerMood = 'angry';
                    if (state !== 'result') {
                        endRound(false, '😡 客人等到發脾氣走咗！');
                    }
                } else if (customerPatience < 40) {
                    customerMood = 'angry';
                } else if (customerPatience < 70) {
                    customerMood = 'neutral';
                } else {
                    customerMood = 'happy';
                }
            }

            if (state === 'bake') {
                let currentSpeed = bakeSpeed;
                if (eventOverheat) currentSpeed *= 1.8;
                bakeProgress += currentSpeed;
                
                if(Math.random() < 0.3) {
                    let W = canvas.width, H = canvas.height;
                    particles.push({ x: W/2 + (Math.random()-0.5)*W*0.3, y: H - 30, vx: (Math.random()-0.5)*1, vy: -Math.random()*3 - 1, life: 1, color: eventOverheat ? '#ff0000' : '#ff9f43', size: 6 });
                }

                if (eventOverheat) {
                    let W = canvas.width, H = canvas.height;
                    smokeParticles.push({ x: W/2 + (Math.random()-0.5)*W*0.3, y: H - 50, vx: (Math.random()-0.5)*2, vy: -Math.random()*2 - 1, life: 1, size: Math.random()*10 + 5 });
                }
                
                if (bakeProgress >= 100) endRound(false, '完全燶晒！');
                if (Math.random() < 0.05) playSound('sizzle');
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.life -= 0.03;
                if (p.life <= 0) particles.splice(i, 1);
            }
            for (let i = smokeParticles.length - 1; i >= 0; i--) {
                let p = smokeParticles[i];
                p.x += p.vx; p.y += p.vy; p.size += 0.5; p.life -= 0.02;
                if (p.life <= 0) smokeParticles.splice(i, 1);
            }
        }

        function drawCustomer(W, H) {
            ctx.save();
            ctx.translate(W/2, H - 100);
            
            let shake = customerMood === 'angry' ? (Math.random()-0.5)*4 : 0;
            ctx.translate(shake, 0);

            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.beginPath(); ctx.ellipse(0, 80, 60, 15, 0, 0, Math.PI*2); ctx.fill();

            ctx.fillStyle = customerShirt;
            ctx.beginPath(); 
            ctx.roundRect(-45, 10, 90, 70, 20); 
            ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 2; ctx.stroke();

            ctx.fillStyle = '#ffccaa';
            ctx.beginPath(); ctx.arc(0, -20, 40, 0, Math.PI*2); ctx.fill();
            
            ctx.fillStyle = '#222';
            ctx.beginPath(); ctx.arc(0, -25, 40, Math.PI, Math.PI*2); ctx.fill();

            ctx.fillStyle = '#111';
            if (customerMood === 'happy') {
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#111';
                ctx.beginPath(); ctx.arc(-15, -20, 6, Math.PI, Math.PI*2); ctx.stroke();
                ctx.beginPath(); ctx.arc(15, -20, 6, Math.PI, Math.PI*2); ctx.stroke();
                ctx.beginPath(); ctx.arc(0, -5, 10, 0, Math.PI); ctx.stroke();
            } else if (customerMood === 'neutral') {
                ctx.beginPath(); ctx.arc(-15, -20, 5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(15, -20, 5, 0, Math.PI*2); ctx.fill();
                ctx.fillRect(-8, -5, 16, 3);
            } else {
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#111';
                ctx.beginPath(); ctx.moveTo(-20, -25); ctx.lineTo(-10, -20); ctx.lineTo(-20, -15); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(20, -25); ctx.lineTo(10, -20); ctx.lineTo(20, -15); ctx.stroke();
                ctx.beginPath(); ctx.arc(0, 5, 10, Math.PI, Math.PI*2); ctx.stroke();

                ctx.fillStyle = '#ff4757';
                ctx.shadowColor = '#ff4757'; ctx.shadowBlur = 10;
                ctx.font = 'bold 30px sans-serif';
                ctx.fillText('💢', 35, -45);
                
                ctx.fillStyle = '#4cc9f0';
                ctx.beginPath(); ctx.arc(-35, -20, 5, 0, Math.PI*2); ctx.fill();
            }

            ctx.restore();
            ctx.save();
            ctx.translate(W/2, H - 180);
            ctx.fillStyle = '#111';
            ctx.beginPath(); ctx.roundRect(-40, 0, 80, 10, 5); ctx.fill();
            
            let barColor = customerMood === 'happy' ? '#2ed573' : customerMood === 'neutral' ? '#f39c12' : '#ff4757';
            ctx.fillStyle = barColor;
            ctx.shadowColor = barColor; ctx.shadowBlur = 10;
            ctx.beginPath(); ctx.roundRect(-40, 0, 80 * (customerPatience/100), 10, 5); ctx.fill();
            ctx.restore();
        }

        function draw() {
            let W = canvas.width, H = canvas.height;
            ctx.clearRect(0, 0, W, H);
            
            let bgGrd = ctx.createRadialGradient(W/2, H/2, 50, W/2, H/2, W);
            bgGrd.addColorStop(0, '#1a1005');
            bgGrd.addColorStop(1, '#050201');
            ctx.fillStyle = bgGrd; ctx.fillRect(0, 0, W, H);
            
            ctx.save();
            ctx.translate(W/2, 60);
            ctx.fillStyle = '#ff4757';
            ctx.shadowColor = '#ff4757'; ctx.shadowBlur = 20;
            ctx.font = `bold ${W*0.08}px "Noto Sans HK"`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('呀樂大排檔', 0, 0);
            ctx.restore();

            ctx.strokeStyle = 'rgba(255, 159, 67, 0.05)'; ctx.lineWidth = 1;
            for (let i = 0; i < W; i += 40) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, H); ctx.stroke(); }
            for (let i = 0; i < H; i += 40) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(W, i); ctx.stroke(); }

            drawCustomer(W, H);

            ctx.save();
            ctx.translate(W/2, H/2 - 40);
            
            let boxSize = W * 0.5;
            
            ctx.fillStyle = 'rgba(255, 159, 67, 0.1)';
            ctx.beginPath(); ctx.ellipse(0, boxSize/2 + 30, boxSize*0.6, 30, 0, 0, Math.PI*2); ctx.fill();

            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(-boxSize*0.65, -boxSize/2, boxSize*1.3, 20);
            ctx.fillRect(-boxSize*0.65, boxSize/2 - 20, boxSize*1.3, 20);
            
            ctx.fillStyle = '#555';
            for(let i=-3; i<=3; i++) {
                ctx.beginPath(); ctx.arc(i * (boxSize*0.18), -boxSize/2 + 10, 3, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(i * (boxSize*0.18), boxSize/2 - 10, 3, 0, Math.PI*2); ctx.fill();
            }

            let boxGrd = ctx.createLinearGradient(-boxSize/2, -boxSize/2, boxSize/2, boxSize/2);
            boxGrd.addColorStop(0, '#2a2d32');
            boxGrd.addColorStop(1, '#0f1112');
            ctx.fillStyle = boxGrd; 
            ctx.beginPath(); ctx.roundRect(-boxSize/2, -boxSize/2, boxSize, boxSize, 15); ctx.fill();
            
            ctx.strokeStyle = '#b38f00'; 
            ctx.lineWidth = 4;
            ctx.beginPath(); ctx.roundRect(-boxSize/2, -boxSize/2, boxSize, boxSize, 15); ctx.stroke();
            
            ctx.strokeStyle = '#000'; 
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.roundRect(-boxSize/2+4, -boxSize/2+4, boxSize-8, boxSize-8, 12); ctx.stroke();

            if (state === 'bake') {
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                let fireIntensity = 1 + (bakeProgress / 100);
                let fireY = boxSize/2 + 20;
                
                for (let i = 0; i < 6; i++) {
                    let fx = -boxSize*0.3 + i * (boxSize*0.12);
                    let fh = (20 + Math.random() * 30) * fireIntensity;
                    let fGrd = ctx.createLinearGradient(fx, fireY, fx, fireY - fh);
                    fGrd.addColorStop(0, eventOverheat ? 'rgba(255,0,0,0.9)' : 'rgba(255,159,67,0.9)');
                    fGrd.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = fGrd;
                    ctx.beginPath(); ctx.moveTo(fx - 10, fireY); ctx.quadraticCurveTo(fx, fireY - fh, fx + 10, fireY); ctx.fill();
                }
                ctx.restore();
            }

            if (state === 'mix' || state === 'pour') {
                let bowlGrd = ctx.createLinearGradient(0, -boxSize*0.3, 0, boxSize*0.4);
                bowlGrd.addColorStop(0, '#ecf0f1'); bowlGrd.addColorStop(1, '#7f8c8d');
                ctx.fillStyle = bowlGrd; 
                ctx.beginPath(); ctx.arc(0, 0, boxSize*0.42, 0, Math.PI); ctx.fill();
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();

                if (state === 'mix') {
                    ctx.fillStyle = currentFlavor.color; 
                    ctx.beginPath(); ctx.arc(0, 10, boxSize*0.4 * (mixProgress/100 + 0.1), 0, Math.PI); ctx.fill();
                    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                    ctx.beginPath(); ctx.arc(0, 10, boxSize*0.2, 0, Math.PI * (mixProgress/50)); ctx.stroke();
                } else {
                    let pourH = (pourAmount / 100) * boxSize*0.8;
                    ctx.fillStyle = currentFlavor.color; 
                    ctx.beginPath(); ctx.roundRect(-boxSize*0.4, boxSize*0.4 - pourH, boxSize*0.8, pourH, 10); ctx.fill();
                    if(pourAmount > 5 && pourAmount < 95) {
                        ctx.beginPath(); ctx.arc(0, boxSize*0.4 - pourH + 10, 10, 0, Math.PI*2); ctx.fill();
                    }
                    
                    ctx.strokeStyle = 'rgba(46, 204, 113, 0.9)';
                    ctx.setLineDash([6,6]); ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(-boxSize*0.45, boxSize*0.4 - (50/100)*boxSize*0.8);
                    ctx.lineTo(boxSize*0.45, boxSize*0.4 - (50/100)*boxSize*0.8);
                    ctx.moveTo(-boxSize*0.45, boxSize*0.4 - (85/100)*boxSize*0.8);
                    ctx.lineTo(boxSize*0.45, boxSize*0.4 - (85/100)*boxSize*0.8);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    ctx.fillStyle = '#fff'; ctx.font = `bold ${boxSize*0.1}px "Orbitron"`;
                    ctx.textAlign = 'center'; ctx.fillText(`${Math.floor(pourAmount)}%`, 0, -boxSize*0.2);
                }
            }

            if (state === 'bake' || state === 'topping' || state === 'result') {
                let gridCount = 7, gap = boxSize*0.8 / gridCount;
                for (let r = -3; r <= 3; r++) {
                    for (let c = -3; c <= 3; c++) {
                        let x = c * gap, y = r * gap, rad = gap * 0.42;
                        ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2);
                        let ballGrd = ctx.createRadialGradient(x-rad*0.3, y-rad*0.3, 2, x, y, rad);
                        if (bakeProgress > perfectZoneEnd) { 
                            ballGrd.addColorStop(0, '#333'); ballGrd.addColorStop(1, '#000'); 
                        } else if (bakeProgress > perfectZoneStart) { 
                            ballGrd.addColorStop(0, '#fff'); ballGrd.addColorStop(0.3, currentFlavor.perfectColor); ballGrd.addColorStop(1, '#b37e1c'); 
                        } else { 
                            ballGrd.addColorStop(0, '#fff'); ballGrd.addColorStop(0.3, currentFlavor.rawColor); ballGrd.addColorStop(1, currentFlavor.color); 
                        }
                        ctx.fillStyle = ballGrd; ctx.fill();
                    }
                }

                if (isFlipped) {
                    ctx.fillStyle = '#1e272e'; 
                    ctx.beginPath(); ctx.roundRect(-boxSize/2, -boxSize/2, boxSize, boxSize, 15); ctx.fill();
                    ctx.fillStyle = '#111';
                    for (let r = -3; r <= 3; r++) {
                        for (let c = -3; c <= 3; c++) {
                            ctx.beginPath(); ctx.arc(c * gap, r * gap, gap*0.38, 0, Math.PI*2); ctx.fill();
                        }
                    }
                    ctx.fillStyle = '#fff'; ctx.font = `bold ${boxSize*0.08}px "Noto Sans HK"`; 
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; 
                    ctx.fillText('焗緊另一面...', 0, 0);
                }

                if (state === 'bake') {
                    ctx.translate(0, -boxSize*0.7);
                    ctx.fillStyle = '#000'; ctx.fillRect(-boxSize*0.4, 0, boxSize*0.8, 18);
                    ctx.save();
                    ctx.shadowColor = '#2ed573'; ctx.shadowBlur = 15;
                    ctx.fillStyle = 'rgba(46, 204, 113, 0.6)'; 
                    ctx.fillRect(-boxSize*0.4 + (perfectZoneStart/100)*boxSize*0.8, 0, ((perfectZoneEnd-perfectZoneStart)/100)*boxSize*0.8, 18);
                    ctx.restore();
                    let barGrd = ctx.createLinearGradient(-boxSize*0.4, 0, boxSize*0.4, 0);
                    barGrd.addColorStop(0, '#ffd32a'); barGrd.addColorStop(1, '#ff4757');
                    ctx.fillStyle = eventOverheat ? '#ff0000' : barGrd; 
                    ctx.fillRect(-boxSize*0.4, 0, (bakeProgress/100)*boxSize*0.8, 18);
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(-boxSize*0.4, 0, boxSize*0.8, 18);
                }

                if (selectedTopping && state !== 'result') {
                    ctx.fillStyle = selectedTopping === '煉奶' ? '#fff' : selectedTopping === '朱古力醬' ? '#5c3a21' : '#d35400';
                    ctx.globalAlpha = 0.8;
                    for (let i = 0; i < 15; i++) {
                        ctx.beginPath(); ctx.arc(Math.random()*(boxSize*0.7)-(boxSize*0.35), Math.random()*(boxSize*0.7)-(boxSize*0.35), 4 + Math.random()*3, 0, Math.PI*2); ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                }
            }
            ctx.restore();

            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            for (let p of particles) {
                ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill();
            }
            ctx.restore();
            
            for (let p of smokeParticles) {
                ctx.globalAlpha = p.life * 0.5; ctx.fillStyle = '#333';
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        function loop() {
            requestAnimationFrame(loop);
            update();
            draw();
        }

        loop();
    </script>

    <script>
        try {
            const firebaseConfig = { databaseURL: "https://maze-leaderboard-default-rtdb.asia-southeast1.firebasedatabase.app/" };
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            const db = firebase.database();
            const userId = 'user_' + Math.random().toString(36).substr(2, 9);
            let pathParts = window.location.pathname.split('/').filter(p => p && p !== 'index.html');
            let gameId = pathParts[pathParts.length - 1] || 'unknown'; 
            const userStatusRef = db.ref('online_status/' + gameId + '/' + userId);
            db.ref('.info/connected').on('value', (snap) => {
                if (snap.val() === true) {
                    userStatusRef.onDisconnect().remove();
                    userStatusRef.set(true);
                }
            });
        } catch(e) {}
    </script>
