<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🥚 雞蛋仔大挑戰</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+HK:wght@700&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body {
            background-color: #1a0b00; color: #fff; font-family: 'Noto Sans HK', sans-serif;
            height: 100dvh; height: 100vh; display: flex; flex-direction: column;
            overflow: hidden; touch-action: none;
            background-image: radial-gradient(circle at center, #3d1a00 0%, #1a0b00 100%);
        }

        /* 頂部 HUD */
        #hud {
            height: 70px; background: rgba(20, 10, 0, 0.9);
            border-bottom: 3px solid #ff9f43; display: flex; align-items: center;
            justify-content: space-between; padding: 0 15px; z-index: 10;
            box-shadow: 0 0 20px rgba(255, 159, 67, 0.4);
        }
        
        .back-btn {
            padding: 8px 16px; background: transparent; color: #ff9f43;
            border: 2px solid #ff9f43; border-radius: 8px; text-decoration: none;
            font-family: 'Orbitron', sans-serif; font-weight: bold; font-size: 13px;
            transition: 0.2s; box-shadow: 0 0 10px rgba(255, 159, 67, 0.3);
        }
        .back-btn:active { transform: scale(0.95); background: #ff9f43; color: #000; }

        .stats { display: flex; gap: 20px; font-family: 'Orbitron', sans-serif; text-align: center; }
        .stat-box { display: flex; flex-direction: column; }
        .stat-label { font-size: 11px; color: #a4b0be; letter-spacing: 1px; }
        .stat-val { font-size: 22px; font-weight: 900; color: #ffd32a; text-shadow: 0 0 15px #ffd32a; }
        .stat-val.combo { color: #ff4757; text-shadow: 0 0 15px #ff4757; }

        /* 遊戲畫布 */
        #canvas-container {
            flex: 1; position: relative; display: flex; justify-content: center;
            align-items: center; overflow: hidden;
        }
        canvas { display: block; }

        /* 底部控制區 */
        #controls {
            height: 130px; background: rgba(20, 10, 0, 0.9);
            border-top: 3px solid #ff9f43; display: flex; align-items: center;
            justify-content: center; padding: 0 20px; gap: 20px; z-index: 10;
            box-shadow: 0 0 20px rgba(255, 159, 67, 0.4);
        }

        .action-btn {
            padding: 15px 30px; border-radius: 15px; font-family: 'Orbitron', 'Noto Sans HK', sans-serif;
            font-size: 20px; font-weight: 900; cursor: pointer; border: none;
            box-shadow: 0 6px 0 rgba(0,0,0,0.5); transition: 0.1s;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 100%; max-width: 300px;
        }
        .action-btn:active { transform: translateY(6px); box-shadow: none; }
        .action-btn:disabled { opacity: 0.3; pointer-events: none; }
        
        #btn-mix { background: linear-gradient(180deg, #00d2d3, #01a3a4); color: #fff; }
        #btn-pour { background: linear-gradient(180deg, #ffd32a, #ff9f43); color: #000; display: none; }
        #btn-flip { background: linear-gradient(180deg, #ff4757, #c0392b); color: #fff; display: none; }
        #btn-serve { background: linear-gradient(180deg, #2ed573, #27ae60); color: #fff; display: none; }

        #status-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 28px; font-weight: 900; color: #fff; text-shadow: 0 0 20px #ff9f43;
            pointer-events: none; opacity: 0; transition: 0.3s; z-index: 20; text-align: center;
        }
        #status-text.show { opacity: 1; }

        /* 玩法說明與結束畫面 */
        .modal {
            position: absolute; inset: 0; background: rgba(10,5,0,0.95);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 30; backdrop-filter: blur(10px); padding: 20px; text-align: center;
        }
        .modal.active { display: flex; }
        .modal h2 { color: #ff9f43; font-size: 36px; font-family: 'Orbitron', sans-serif; text-shadow: 0 0 20px #ff9f43; margin-bottom: 20px; }
        .modal p { font-size: 16px; color: #ccc; line-height: 1.8; margin-bottom: 30px; text-align: left; max-width: 400px; background: rgba(255,255,255,0.05); padding: 20px; border-radius: 10px; }
        .modal button {
            padding: 15px 50px; background: linear-gradient(135deg, #ff9f43, #ffd32a);
            color: #000; border: none; border-radius: 10px; font-family: 'Orbitron', sans-serif;
            font-size: 18px; font-weight: 900; cursor: pointer; box-shadow: 0 0 20px rgba(255, 159, 67, 0.5);
        }
        .modal button:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div id="hud">
        <a href="../" class="back-btn">⬅ 返回大廳</a>
        <div class="stats">
            <div class="stat-box">
                <span class="stat-label">分數</span>
                <span class="stat-val" id="score-val">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">連擊</span>
                <span class="stat-val combo" id="combo-val">0</span>
            </div>
        </div>
        <div style="width: 80px;"></div>
    </div>

    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
        <div id="status-text">完美！外脆內軟！</div>
        
        <!-- 玩法說明 -->
        <div id="intro-modal" class="modal active">
            <h2>🥚 雞蛋仔大挑戰</h2>
            <p>
                <b>1. 🥣 較漿：</b> 瘋狂點擊螢幕，將粉漿攪拌均勻！<br><br>
                <b>2. 🥄 倒漿：</b> 長按倒漿掣，控制份量（太少或滿瀉都唔得！）<br><br>
                <b>3. 🔥 翻轉：</b> 留意火候進度條，進入<b>綠色完美區</b>時點擊翻轉！<br><br>
                <b>4. 🍽️ 出餐：</b> 烤完另一面，再次進入完美區就可以起爐！
            </p>
            <button onclick="startGame()">開始整雞蛋仔</button>
        </div>

        <!-- 結束畫面 -->
        <div id="gameover" class="modal">
            <h2>執笠啦！</h2>
            <p>你連續整咗 <span id="final-combo" style="color:#ffd32a; font-weight:bold; font-size:24px;">0</span> 底完美雞蛋仔！<br>總分：<span id="final-score" style="color:#ffd32a; font-weight:bold; font-size:24px;">0</span></p>
            <button onclick="initGame()">再開爐</button>
        </div>
    </div>

    <div id="controls">
        <button class="action-btn" id="btn-mix">🥣 瘋狂較漿</button>
        <button class="action-btn" id="btn-pour">🥄 長按倒漿</button>
        <button class="action-btn" id="btn-flip">🔄 完美翻轉</button>
        <button class="action-btn" id="btn-serve">🍽️ 起爐出餐</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const scoreVal = document.getElementById('score-val');
        const comboVal = document.getElementById('combo-val');
        const finalCombo = document.getElementById('final-combo');
        const finalScore = document.getElementById('final-score');
        const statusText = document.getElementById('status-text');
        const gameoverScreen = document.getElementById('gameover');
        const introModal = document.getElementById('intro-modal');

        const btnMix = document.getElementById('btn-mix');
        const btnPour = document.getElementById('btn-pour');
        const btnFlip = document.getElementById('btn-flip');
        const btnServe = document.getElementById('btn-serve');

        // 遊戲設定
        const CANVAS_W = 400;
        const CANVAS_H = 500;
        canvas.width = CANVAS_W;
        canvas.height = CANVAS_H;

        // 音效系統
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            
            if (type === 'mix') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(300 + Math.random()*100, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'pour') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(300, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'sizzle') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'ding') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'fail') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            }
        }

        // 遊戲狀態機
        // 'menu' -> 'mix' -> 'pour' -> 'bake' -> 'result'
        let state = 'menu'; 
        let score = 0;
        let combo = 0;
        let maxCombo = 0;

        // 較漿狀態
        let mixProgress = 0;
        let mixDecayTimer = 0;

        // 倒漿狀態
        let pourAmount = 0;

        // 烘焙狀態
        let bakeProgress = 0;
        let bakeSpeed = 1.2;
        let perfectZoneStart = 60;
        let perfectZoneEnd = 80;
        let isFlipped = false;

        // 粒子特效
        let particles = [];

        function initGame() {
            score = 0;
            combo = 0;
            maxCombo = 0;
            updateHUD();
            gameoverScreen.classList.remove('active');
            resetRound();
        }

        function startGame() {
            introModal.classList.remove('active');
            initGame();
            state = 'mix';
            btnMix.style.display = 'flex';
            btnPour.style.display = 'none';
            btnFlip.style.display = 'none';
            btnServe.style.display = 'none';
            btnMix.innerText = '🥣 瘋狂較漿 (0%)';
        }

        function resetRound() {
            state = 'mix';
            mixProgress = 0;
            pourAmount = 0;
            bakeProgress = 0;
            isFlipped = false;
            
            let zoneWidth = Math.max(12, 25 - combo * 2);
            let center = 65 + (Math.random() * 10 - 5);
            perfectZoneStart = center - zoneWidth / 2;
            perfectZoneEnd = center + zoneWidth / 2;
            
            bakeSpeed = 1.2 + combo * 0.1;

            btnMix.style.display = 'flex';
            btnPour.style.display = 'none';
            btnFlip.style.display = 'none';
            btnServe.style.display = 'none';
            
            btnMix.disabled = false;
            btnPour.disabled = false;
            btnFlip.disabled = false;
            btnServe.disabled = false;
            
            btnMix.innerText = '🥣 瘋狂較漿 (0%)';
            statusText.classList.remove('show');
            particles = [];
        }

        function updateHUD() {
            scoreVal.innerText = score;
            comboVal.innerText = combo;
        }

        function showStatus(text, color = '#fff') {
            statusText.innerText = text;
            statusText.style.color = color;
            statusText.style.textShadow = `0 0 20px ${color}`;
            statusText.classList.add('show');
            setTimeout(() => statusText.classList.remove('show'), 1000);
        }

        // --- 1. 較漿階段 ---
        btnMix.addEventListener('click', () => {
            if (state !== 'mix') return;
            mixProgress += 8;
            mixDecayTimer = 0;
            playSound('mix');
            createParticles(CANVAS_W/2 + (Math.random()-0.5)*100, CANVAS_H/2 + (Math.random()-0.5)*100, '#00d2d3', 2);
            
            if (mixProgress >= 100) {
                mixProgress = 100;
                state = 'pour';
                btnMix.style.display = 'none';
                btnPour.style.display = 'flex';
                showStatus('漿液拌勻！準備倒漿！', '#00d2d3');
            } else {
                btnMix.innerText = `🥣 瘋狂較漿 (${Math.floor(mixProgress)}%)`;
            }
        });

        // --- 2. 倒漿階段 ---
        let pourInterval = null;
        btnPour.addEventListener('mousedown', startPour);
        btnPour.addEventListener('touchstart', (e) => { e.preventDefault(); startPour(); }, {passive: false});
        window.addEventListener('mouseup', stopPour);
        window.addEventListener('touchend', stopPour);

        function startPour() {
            if (state !== 'pour') return;
            playSound('pour');
            pourInterval = setInterval(() => {
                pourAmount += 1.5;
                if (pourAmount > 100) pourAmount = 100;
                createParticles(CANVAS_W/2, 200, '#ff9f43', 2);
            }, 20);
        }

        function stopPour() {
            if (state !== 'pour') return;
            clearInterval(pourInterval);
            btnPour.style.display = 'none';
            
            if (pourAmount > 85) {
                endRound(false, '滿瀉啦！');
            } else if (pourAmount < 50) {
                endRound(false, '倒得太少啦！');
            } else {
                state = 'bake';
                btnFlip.style.display = 'flex';
                showStatus('合上夾爐！注意火候！', '#ff9f43');
            }
        }

        // --- 3. 烘焙階段 ---
        btnFlip.addEventListener('click', () => {
            if (state !== 'bake' || isFlipped) return;
            
            if (bakeProgress >= perfectZoneStart && bakeProgress <= perfectZoneEnd) {
                playSound('ding');
                isFlipped = true;
                bakeProgress = 0;
                showStatus('完美翻面！', '#2ed573');
                createParticles(CANVAS_W/2, CANVAS_H/2, '#2ed573', 30);
                
                let zoneWidth = Math.max(12, 25 - combo * 2);
                let center = 65 + (Math.random() * 10 - 5);
                perfectZoneStart = center - zoneWidth / 2;
                perfectZoneEnd = center + zoneWidth / 2;
                
                setTimeout(() => {
                    if (state === 'bake') {
                        btnFlip.style.display = 'none';
                        btnServe.style.display = 'flex';
                    }
                }, 1000);
            } else {
                endRound(false, '第一面燶咗/未熟！');
            }
        });

        // --- 4. 出餐階段 ---
        btnServe.addEventListener('click', () => {
            if (state !== 'bake') return;
            
            if (bakeProgress >= perfectZoneStart && bakeProgress <= perfectZoneEnd) {
                endRound(true);
            } else {
                endRound(false, '第二面燶咗！');
            }
        });

        function endRound(isSuccess, reason = '') {
            state = 'result';
            btnPour.style.display = 'none';
            btnFlip.style.display = 'none';
            btnServe.style.display = 'none';
            btnMix.style.display = 'none';

            if (isSuccess) {
                combo++;
                if (combo > maxCombo) maxCombo = combo;
                let pts = 10 * combo;
                score += pts;
                updateHUD();
                playSound('ding');
                showStatus(`外脆內軟！+${pts} 分`, '#ffd32a');
                
                // 香氣特效
                for(let i=0; i<20; i++) {
                    createParticles(CANVAS_W/2 + (Math.random()-0.5)*100, CANVAS_H/2 + (Math.random()-0.5)*100, 'rgba(255,255,255,0.8)', 1);
                }
                
                setTimeout(() => {
                    if (state === 'result') resetRound();
                }, 1500);
            } else {
                combo = 0;
                updateHUD();
                playSound('fail');
                showStatus(reason, '#ff4757');
                
                for(let i=0; i<30; i++) {
                    createParticles(CANVAS_W/2 + (Math.random()-0.5)*80, CANVAS_H/2, 'rgba(50,50,50,0.8)', 1);
                }

                setTimeout(() => {
                    if (score > 0 || maxCombo > 0) {
                        gameOver();
                    } else {
                        resetRound();
                    }
                }, 1500);
            }
        }

        function gameOver() {
            finalCombo.innerText = maxCombo;
            finalScore.innerText = score;
            gameoverScreen.classList.add('active');
        }

        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8 - 2,
                    life: 1,
                    color,
                    size: Math.random() * 8 + 4
                });
            }
        }

        // --- 遊戲循環 ---
        function update() {
            // 較漿衰退機制
            if (state === 'mix') {
                mixDecayTimer += 1;
                if (mixDecayTimer > 10 && mixProgress > 0) {
                    mixProgress -= 1;
                    btnMix.innerText = `🥣 瘋狂較漿 (${Math.floor(mixProgress)}%)`;
                }
            }

            // 更新火候
            if (state === 'bake') {
                bakeProgress += bakeSpeed;
                if (bakeProgress >= 100) {
                    endRound(false, '完全燶晒！');
                }
                if (Math.random() < 0.05) playSound('sizzle');
            }

            // 更新粒子
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy -= 0.1;
                p.life -= 0.02;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

            // 廚房背景
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
            ctx.strokeStyle = '#34495e';
            ctx.lineWidth = 2;
            for (let i = 0; i < CANVAS_W; i += 50) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, CANVAS_H); ctx.stroke();
            }

            // 爐具
            ctx.fillStyle = '#111';
            ctx.beginPath();
            ctx.ellipse(CANVAS_W/2, CANVAS_H - 50, 180, 40, 0, 0, Math.PI * 2);
            ctx.fill();

            // 火焰
            if (state === 'bake') {
                let fireIntensity = 1 + (bakeProgress / 100);
                let fireY = CANVAS_H - 80;
                ctx.shadowBlur = 20; ctx.shadowColor = '#ff9f43';
                for (let i = 0; i < 5; i++) {
                    let fx = CANVAS_W/2 - 100 + i * 50;
                    let fh = 30 + Math.random() * 20 * fireIntensity;
                    ctx.fillStyle = bakeProgress > perfectZoneEnd ? '#ff4757' : '#ff9f43';
                    ctx.beginPath();
                    ctx.moveTo(fx - 15, fireY);
                    ctx.quadraticCurveTo(fx, fireY - fh, fx + 15, fireY);
                    ctx.fill();
                }
                ctx.shadowBlur = 0;
            }

            ctx.save();
            ctx.translate(CANVAS_W/2, CANVAS_H/2);
            
            // 鐵夾底座
            ctx.fillStyle = '#1e272e';
            ctx.beginPath();
            ctx.roundRect(-120, -120, 240, 240, 20);
            ctx.fill();
            ctx.strokeStyle = '#485460';
            ctx.lineWidth = 5;
            ctx.stroke();

            // 較漿階段
            if (state === 'mix') {
                // 畫大碗
                ctx.fillStyle = '#ecf0f1';
                ctx.beginPath();
                ctx.arc(0, 0, 100, 0, Math.PI);
                ctx.fill();
                
                // 畫漿液
                ctx.fillStyle = 'rgba(255, 159, 67, 0.8)';
                ctx.beginPath();
                ctx.arc(0, 10, 90 * (mixProgress/100 + 0.1), 0, Math.PI);
                ctx.fill();

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 20px "Noto Sans HK"';
                ctx.textAlign = 'center';
                ctx.fillText('快啲撳掣攪勻佢！', 0, -150);
            }

            // 倒漿階段
            if (state === 'pour') {
                let pourH = (pourAmount / 100) * 200;
                ctx.fillStyle = 'rgba(255, 159, 67, 0.8)';
                ctx.beginPath();
                ctx.roundRect(-100, 100 - pourH, 200, pourH, 10);
                ctx.fill();
                
                ctx.fillStyle = '#7f8c8d';
                ctx.fillRect(-20, -160, 40, 80);
                if (pourAmount > 0) {
                    ctx.fillStyle = '#ff9f43';
                    ctx.fillRect(-10, -80, 20, 100 - pourH + 20);
                }
            }

            // 烘焙階段
            if (state === 'bake' || state === 'result') {
                for (let r = -3; r <= 3; r++) {
                    for (let c = -3; c <= 3; c++) {
                        ctx.beginPath();
                        ctx.arc(c * 30, r * 30, 12, 0, Math.PI * 2);
                        if (bakeProgress > perfectZoneEnd) {
                            ctx.fillStyle = '#111';
                        } else if (bakeProgress > perfectZoneStart) {
                            ctx.fillStyle = '#ffd32a';
                        } else {
                            ctx.fillStyle = '#f5cd79';
                        }
                        ctx.fill();
                    }
                }

                if (isFlipped) {
                    ctx.fillStyle = 'rgba(30, 39, 46, 0.8)';
                    ctx.beginPath();
                    ctx.roundRect(-120, -120, 240, 240, 20);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 30px "Noto Sans HK"';
                    ctx.textAlign = 'center';
                    ctx.fillText('焗緊另一面...', 0, 0);
                }

                if (state === 'bake') {
                    ctx.translate(0, -160);
                    ctx.fillStyle = '#111';
                    ctx.fillRect(-100, 0, 200, 20);
                    
                    ctx.fillStyle = 'rgba(46, 204, 113, 0.5)';
                    ctx.fillRect(-100 + (perfectZoneStart/100)*200, 0, ((perfectZoneEnd-perfectZoneStart)/100)*200, 20);
                    
                    ctx.fillStyle = bakeProgress > perfectZoneEnd ? '#ff4757' : '#ff9f43';
                    ctx.fillRect(-100, 0, (bakeProgress/100)*200, 20);
                    
                    ctx.strokeStyle = '#fff';
                    ctx.strokeRect(-100, 0, 200, 20);
                    
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 14px "Noto Sans HK"';
                    ctx.textAlign = 'center';
                    ctx.fillText('火候控制', 0, 35);
                }
            }
            ctx.restore();

            // 粒子
            for (let p of particles) {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        function loop() {
            requestAnimationFrame(loop);
            update();
            draw();
        }

        loop();
    </script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        try {
            const firebaseConfig = {
                databaseURL: "https://maze-leaderboard-default-rtdb.asia-southeast1.firebasedatabase.app/"
            };
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            const db = firebase.database();
            
            const userId = 'user_' + Math.random().toString(36).substr(2, 9);
            let pathParts = window.location.pathname.split('/').filter(p => p && p !== 'index.html');
            let gameId = pathParts[pathParts.length - 1] || 'unknown'; 

            const userStatusRef = db.ref('online_status/' + gameId + '/' + userId);
            
            db.ref('.info/connected').on('value', (snap) => {
                if (snap.val() === true) {
                    userStatusRef.onDisconnect().remove();
                    userStatusRef.set(true);
                }
            });
        } catch(e) {
            console.log("在線統計未啟動");
        }
    </script>
