<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>賽博密室</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
    
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    
    body {
        background-color: #050510; color: #fff; font-family: 'Orbitron', 'PingFang HK', sans-serif;
        height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
        touch-action: manipulation; 
    }

    /* --- 返回大廳按鈕 (左上角) --- */
    .back-btn {
        position: fixed; top: 15px; left: 15px; z-index: 9999;
        padding: 8px 16px; background: rgba(10, 10, 20, 0.85);
        color: #00d2d3; border: 2px solid #00d2d3; border-radius: 8px;
        text-decoration: none; font-weight: bold; font-size: 14px;
        box-shadow: 0 0 10px rgba(0, 210, 211, 0.5); transition: all 0.2s;
        backdrop-filter: blur(5px); touch-action: manipulation;
    }
    .back-btn:hover { background: #00d2d3; color: #000; box-shadow: 0 0 20px #00d2d3; }

    /* --- 關卡顯示 (左上角) --- */
    #level-display {
        position: fixed; top: 15px; left: 140px; z-index: 9999;
        color: #ffd32a; font-size: 16px; font-weight: bold;
        text-shadow: 0 0 10px #ffd32a; padding: 8px 0;
    }

    /* --- 倒數計時 (右上角) --- */
    #timer {
        position: fixed; top: 15px; right: 15px; z-index: 9999;
        font-size: 26px; font-weight: 900; color: #00d2d3; 
        letter-spacing: 2px;
        font-variant-numeric: tabular-nums; 
        text-shadow: 0 0 10px rgba(0, 210, 211, 0.5);
        transition: color 0.3s, text-shadow 0.3s;
    }
    #timer.danger { color: #ff4757; text-shadow: 0 0 15px rgba(255, 71, 87, 0.8); animation: pulseRed 0.5s infinite alternate; }
    @keyframes pulseRed { from { opacity: 1; } to { opacity: 0.5; } }

    /* --- 背包按鈕 (右上角) --- */
    #inventory-btn {
        position: fixed; top: 60px; right: 15px; z-index: 9999;
        background: rgba(0, 210, 211, 0.1); border: 1px solid #00d2d3;
        padding: 8px 15px; border-radius: 8px; font-weight: bold; color: #00d2d3;
        display: flex; align-items: center; gap: 5px; transition: all 0.2s;
        cursor: pointer; backdrop-filter: blur(5px);
    }
    #inventory-btn:hover { background: rgba(0, 210, 211, 0.3); }

    /* 遊戲場景 */
    #room {
        flex: 1; position: relative; overflow: hidden;
        background: radial-gradient(circle at 50% 30%, rgba(20, 20, 50, 1), rgba(5, 5, 10, 1));
    }
    
    #room::after {
        content: ''; position: absolute; inset: 0; pointer-events: none;
        box-shadow: inset 0 0 150px rgba(0,0,0,0.9); z-index: 5;
    }

    .laser-grid {
        position: absolute; inset: 0;
        background: 
            repeating-linear-gradient(0deg, transparent, transparent 20px, rgba(0, 210, 211, 0.03) 20px, rgba(0, 210, 211, 0.03) 21px),
            repeating-linear-gradient(90deg, transparent, transparent 20px, rgba(0, 210, 211, 0.03) 20px, rgba(0, 210, 211, 0.03) 21px);
        animation: scan 15s linear infinite; z-index: 0;
    }
    @keyframes scan { 0% { background-position: 0 0; } 100% { background-position: 0 100px; } }

    .interactable {
        position: absolute; cursor: pointer; z-index: 2;
        transition: transform 0.2s, filter 0.2s;
        display: flex; align-items: center; justify-content: center;
        touch-action: manipulation;
        border-radius: 10px;
    }
    .interactable:hover {
        filter: drop-shadow(0 0 15px #00d2d3) brightness(1.2);
        transform: scale(1.05);
    }
    .interactable:active { transform: scale(0.95); }

    /* 1. 大門 */
    #door {
        top: 25%; right: 8%; width: 25%; height: 50%;
        background: linear-gradient(to bottom, #1a1a2e, #0a0a15);
        border: 4px solid #333; border-radius: 10px;
        box-shadow: inset 0 0 20px rgba(0,0,0,1), 0 0 20px rgba(0,0,0,0.8);
        z-index: 1; flex-direction: column;
    }
    #door-lock {
        width: 50px; height: 70px; background: #111; border: 2px solid #ff4757;
        border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center;
        box-shadow: 0 0 15px #ff4757; margin-bottom: 20px;
    }
    #door-lock .dot { width: 6px; height: 6px; background: #ff4757; border-radius: 50%; margin: 2px; }
    #door-text { color: #555; font-weight: bold; letter-spacing: 3px; font-size: 14px; }

    /* 2. 壁畫 */
    #painting {
        top: 25%; left: 8%; width: 25%; height: 25%;
        border: 8px solid #222; background: #111;
        box-shadow: 0 0 20px rgba(0,0,0,0.8), inset 0 0 10px rgba(0,0,0,1);
        z-index: 1; font-size: 40px;
    }

    /* 3. 書枱 */
    #desk {
        bottom: 15%; left: 8%; width: 42%; height: 20%;
        background: linear-gradient(to bottom, #2c3e50, #1a252f);
        border-top: 6px solid #00d2d3; border-radius: 5px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.9);
        z-index: 1; 
    }

    /* 4. 電腦 */
    #computer {
        bottom: calc(15% + 20%); 
        left: calc(8% + 10%); 
        width: 22%; height: 16%;
        background: #0a0a1a; border: 4px solid #c084fc; border-radius: 6px;
        box-shadow: 0 0 25px rgba(192, 132, 252, 0.5);
        font-size: 24px; color: #c084fc;
        z-index: 3; 
        flex-direction: column;
    }
    #computer::after {
        content: ''; position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%);
        width: 30%; height: 18px; background: #222; border: 2px solid #333; border-top: none;
        border-radius: 0 0 5px 5px; z-index: 2;
    }

    /* 5. 垃圾桶 */
    #trash {
        bottom: 15%; right: 15%; width: 12%; height: 15%;
        background: #1a1a1a; border-radius: 5px 5px 10px 10px;
        border: 3px solid #444; border-top: 5px solid #333;
        box-shadow: 0 10px 20px rgba(0,0,0,0.8); z-index: 1; font-size: 24px;
    }

    /* 6. 通風口 */
    #vent {
        top: 15%; right: 12%; width: 15%; height: 15%;
        background: repeating-linear-gradient(0deg, #222, #222 5px, #111 5px, #111 10px);
        border: 4px solid #333; border-radius: 5px;
        box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        z-index: 1; font-size: 20px;
    }

    /* 對話框 */
    #dialogue {
        position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.85); border: 1px solid #00d2d3; padding: 10px 20px;
        border-radius: 20px; color: #fff; font-size: 13px; opacity: 0; transition: opacity 0.3s;
        pointer-events: none; z-index: 10; text-align: center; backdrop-filter: blur(5px);
        white-space: nowrap; max-width: 90%;
    }

    /* 彈窗通用 */
    .modal-overlay {
        position: absolute; inset: 0; background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center;
        z-index: 20; padding: 20px;
    }
    .modal-overlay.active { display: flex; }

    .glass-panel {
        background: linear-gradient(135deg, rgba(30, 30, 50, 0.95), rgba(10, 10, 20, 0.98));
        border: 2px solid rgba(0, 210, 211, 0.5); border-radius: 15px;
        padding: 25px; width: 100%; max-width: 400px; text-align: center;
        box-shadow: 0 0 40px rgba(0, 210, 211, 0.2);
        position: relative; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        max-height: 90vh; overflow-y: auto;
    }
    @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .glass-panel h2 { color: #00d2d3; margin-bottom: 15px; font-size: 20px; text-shadow: 0 0 10px #00d2d3; }
    .glass-panel p { color: #ccc; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
    
    .close-btn {
        position: absolute; top: 10px; right: 15px; color: #ff4757; font-size: 28px;
        cursor: pointer; font-weight: bold; transition: transform 0.2s;
    }
    .close-btn:hover { transform: scale(1.2); }

    /* 背包 */
    .inventory-grid {
        display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 20px;
    }
    .inv-slot {
        aspect-ratio: 1; background: rgba(0,0,0,0.5); border: 1px solid #333; border-radius: 8px;
        display: flex; align-items: center; justify-content: center; font-size: 24px;
    }
    .inv-slot.filled { border-color: #ffd32a; box-shadow: 0 0 10px rgba(255, 211, 42, 0.3); cursor: pointer; }

    /* 密碼鎖 */
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
    .key {
        padding: 15px; background: #111; border: 1px solid #555; border-radius: 8px;
        font-size: 20px; font-weight: bold; cursor: pointer; color: #fff;
    }
    .key:active { background: #00d2d3; color: #000; }
    #password-display, #pin-display {
        font-size: 32px; letter-spacing: 10px; color: #00d2d3; margin-bottom: 20px;
        background: #000; padding: 10px; border-radius: 8px; border: 2px solid #333; min-height: 60px;
        font-variant-numeric: tabular-nums;
    }

    /* 結算/過關畫面 */
    #end-screen {
        position: absolute; inset: 0; background: #000; z-index: 50;
        display: none; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; padding: 20px;
    }
    #end-screen h1 { font-size: 40px; text-shadow: 0 0 30px #00d2d3; margin-bottom: 10px; }
    #end-screen .stats { color: #ffd32a; font-size: 18px; margin-bottom: 30px; line-height: 1.6; }
    #end-screen button {
        padding: 15px 40px; background: #00d2d3; color: #000; border: none;
        border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px;
    }

    /* 手機版特殊排版 */
    @media (max-width: 600px) {
        .back-btn { font-size: 12px; padding: 6px 12px; }
        #level-display { left: 100px; font-size: 14px; }
        #timer { font-size: 20px; }
        #inventory-btn { font-size: 12px; padding: 6px 12px; top: 50px; }
        
        #door { top: 20%; right: 5%; width: 28%; height: 45%; }
        #painting { top: 20%; left: 5%; width: 28%; height: 22%; }
        #desk { bottom: 10%; left: 5%; width: 55%; height: 18%; }
        #computer { bottom: calc(10% + 18%); left: calc(5% + 10%); width: 25%; height: 14%; }
        #trash { bottom: 10%; right: 5%; width: 15%; height: 12%; }
        #vent { top: 15%; right: 8%; width: 15%; height: 12%; }
        
        .glass-panel { padding: 15px; }
        .key { padding: 12px; font-size: 18px; }
    }
</style>
</head>
<body>

    <a href="../" class="back-btn">⬅ 返回大廳</a>
    <div id="level-display">第 1 關</div>
    
    <div id="timer">01:00</div>
    <div id="inventory-btn" onclick="toggleModal('inventory-modal')">🎒 背包</div>

    <div id="room">
        <div class="laser-grid"></div>

        <!-- 大門 -->
        <div class="interactable" id="door" onclick="openModal('door-modal')">
            <div id="door-lock">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
            <div id="door-text">LOCKED</div>
        </div>

        <!-- 壁畫 -->
        <div class="interactable" id="painting" onclick="inspectPainting()">
            🖼️
        </div>

        <!-- 書枱 -->
        <div class="interactable" id="desk" onclick="inspectDesk()"></div>

        <!-- 電腦 -->
        <div class="interactable" id="computer" onclick="inspectComputer()">
            💻
        </div>

        <!-- 垃圾桶 -->
        <div class="interactable" id="trash" onclick="inspectTrash()">
            🗑️
        </div>

        <!-- 通風口 -->
        <div class="interactable" id="vent" onclick="inspectVent()">
            🪟
        </div>
    </div>

    <div id="dialogue">系統提示</div>

    <!-- 背包彈窗 -->
    <div id="inventory-modal" class="modal-overlay">
        <div class="glass-panel">
            <div class="close-btn" onclick="closeModal('inventory-modal')">×</div>
            <h2>🎒 隨身背包</h2>
            <div class="inventory-grid" id="inventory-grid">
                <div class="inv-slot" id="slot-0"></div>
                <div class="inv-slot" id="slot-1"></div>
                <div class="inv-slot" id="slot-2"></div>
                <div class="inv-slot" id="slot-3"></div>
            </div>
            <p style="margin-top: 20px; font-size: 12px;">點擊背包物品以使用</p>
        </div>
    </div>

    <!-- 書枱線索彈窗 -->
    <div id="desk-modal" class="modal-overlay">
        <div class="glass-panel">
            <div class="close-btn" onclick="closeModal('desk-modal')">×</div>
            <h2>🔍 凌亂的書枱</h2>
            <p id="desk-text">書枱上只有一堆無用的電子零件。下面有一個鎖住嘅抽屜。</p>
            <button id="desk-action-btn" onclick="deskAction()" style="display:none; padding:10px 20px; background:#00d2d3; color:#000; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">使用鑰匙</button>
        </div>
    </div>

    <!-- 通用線索彈窗 -->
    <div id="clue-modal" class="modal-overlay">
        <div class="glass-panel">
            <div class="close-btn" onclick="closeModal('clue-modal')">×</div>
            <h2 id="clue-title">🔍 調查</h2>
            <p id="clue-text"></p>
        </div>
    </div>

    <!-- 電腦解謎彈窗 -->
    <div id="computer-modal" class="modal-overlay">
        <div class="glass-panel">
            <div class="close-btn" onclick="closeModal('computer-modal')">×</div>
            <h2 id="computer-title">💻 終端機</h2>
            <p id="computer-text">終端機已鎖定。<br>請輸入 4 位數 PIN 碼解除限制。</p>
            
            <div id="computer-locked-ui">
                <div id="pin-display">----</div>
                <div class="keypad" style="max-width: 250px; margin: 0 auto;">
                    <div class="key" onclick="pressPin('1')">1</div>
                    <div class="key" onclick="pressPin('2')">2</div>
                    <div class="key" onclick="pressPin('3')">3</div>
                    <div class="key" onclick="pressPin('4')">4</div>
                    <div class="key" onclick="pressPin('5')">5</div>
                    <div class="key" onclick="pressPin('6')">6</div>
                    <div class="key" onclick="pressPin('7')">7</div>
                    <div class="key" onclick="pressPin('8')">8</div>
                    <div class="key" onclick="pressPin('9')">9</div>
                    <div class="key" onclick="pressPin('C')" style="color: #ff4757;">C</div>
                    <div class="key" onclick="pressPin('0')">0</div>
                    <div class="key" onclick="pressPin('E')" style="color: #2ed573;">E</div>
                </div>
            </div>
            
            <div id="computer-unlocked-ui" style="display: none; margin-top: 20px;">
                <p style="color: #2ed573; font-size: 16px;">✅ 系統已解鎖！</p>
                <p id="computer-secret" style="font-size: 16px;"></p>
            </div>
        </div>
    </div>

    <!-- 大門密碼鎖彈窗 -->
    <div id="door-modal" class="modal-overlay">
        <div class="glass-panel">
            <div class="close-btn" onclick="closeModal('door-modal')">×</div>
            <h2>🔐 終極防盜門</h2>
            <div id="password-display"></div>
            <div class="keypad">
                <div class="key" onclick="pressKey('1')">1</div>
                <div class="key" onclick="pressKey('2')">2</div>
                <div class="key" onclick="pressKey('3')">3</div>
                <div class="key" onclick="pressKey('4')">4</div>
                <div class="key" onclick="pressKey('5')">5</div>
                <div class="key" onclick="pressKey('6')">6</div>
                <div class="key" onclick="pressKey('7')">7</div>
                <div class="key" onclick="pressKey('8')">8</div>
                <div class="key" onclick="pressKey('9')">9</div>
                <div class="key" onclick="pressKey('C')" style="color: #ff4757;">C</div>
                <div class="key" onclick="pressKey('0')">0</div>
                <div class="key" onclick="pressKey('E')" style="color: #2ed573;">E</div>
            </div>
        </div>
    </div>

    <!-- 結算畫面 -->
    <div id="end-screen">
        <h1>🎉 逃脫成功！</h1>
        <div class="stats">
            完成關卡：第 <span id="final-level">1</span> 關<br>
            剩餘時間：<span id="final-time">--</span>
        </div>
        <button onclick="nextLevel()">進入下一關</button>
    </div>

<script>
    // --- 遊戲核心狀態 ---
    let currentLevel = 1;
    let timeLeft = 60;
    let inventory = [];
    let hasKey = false;
    let hasPhoto = false;
    let isComputerUnlocked = false;
    let password = "";
    let pinCode = "";
    let timerInterval;
    let gameActive = true;

    // 當前關卡的隨機變數
    let currentData = {
        keyLocation: 'trash',
        year: 2000,
        operator: '+',
        randomNum: 77,
        doorCode: 2077,
        pinCode: "2000",
        computerSecret: ""
    };

    // 音效
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        if (type === 'click') { osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05); osc.start(); osc.stop(audioCtx.currentTime + 0.05); } 
        else if (type === 'pickup') { osc.type = 'triangle'; osc.frequency.setValueAtTime(400, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1); gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2); osc.start(); osc.stop(audioCtx.currentTime + 0.2); } 
        else if (type === 'unlock') { osc.type = 'square'; osc.frequency.setValueAtTime(300, audioCtx.currentTime); osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3); osc.start(); osc.stop(audioCtx.currentTime + 0.3); } 
        else if (type === 'error') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3); gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3); osc.start(); osc.stop(audioCtx.currentTime + 0.3); } 
        else if (type === 'win') { osc.type = 'sine'; osc.frequency.setValueAtTime(400, audioCtx.currentTime); osc.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 0.2); osc.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.4); gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6); osc.start(); osc.stop(audioCtx.currentTime + 0.6); }
    }

    // UI 控制
    function openModal(id) {
        playSound('click'); closeAllModals();
        document.getElementById(id).classList.add('active');
        if (id === 'door-modal') { password = ""; updatePasswordDisplay(); }
        if (id === 'computer-modal') { 
            pinCode = ""; updatePinDisplay();
            if(isComputerUnlocked) {
                document.getElementById('computer-locked-ui').style.display = 'none';
                document.getElementById('computer-unlocked-ui').style.display = 'block';
                document.getElementById('computer-title').innerText = '💻 已解鎖終端機';
                document.getElementById('computer-text').innerText = '系統歡迎你，黑客。';
                document.getElementById('computer-secret').innerHTML = currentData.computerSecret;
            } else {
                document.getElementById('computer-locked-ui').style.display = 'block';
                document.getElementById('computer-unlocked-ui').style.display = 'none';
                document.getElementById('computer-title').innerText = '💻 終端機 (鎖定)';
                document.getElementById('computer-text').innerText = '終端機已鎖定。<br>請輸入 4 位數 PIN 碼解除限制。';
            }
        }
    }

    function closeModal(id) { playSound('click'); document.getElementById(id).classList.remove('active'); }
    function closeAllModals() { document.querySelectorAll('.modal-overlay').forEach(el => el.classList.remove('active')); }
    function toggleModal(id) { if (document.getElementById(id).classList.contains('active')) closeModal(id); else openModal(id); }
    function showDialogue(text) { const d = document.getElementById('dialogue'); d.innerText = text; d.style.opacity = 1; clearTimeout(window.dialogueTimeout); window.dialogueTimeout = setTimeout(() => { d.style.opacity = 0; }, 3000); }

    // 計時器
    function startTimer() {
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (!gameActive) return;
            timeLeft--;
            let m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            let s = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${m}:${s}`;
            if (timeLeft <= 10) document.getElementById('timer').classList.add('danger');
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                gameActive = false;
                showDialogue('氧氣耗盡！你永遠留在密室了...');
                setTimeout(() => { location.reload(); }, 3000);
            }
        }, 1000);
    }

    // 更新背包
    function updateInventory() {
        for (let i = 0; i < 4; i++) { let slot = document.getElementById(`slot-${i}`); slot.innerHTML = ''; slot.classList.remove('filled'); slot.onclick = null; }
        inventory.forEach((item, index) => {
            let slot = document.getElementById(`slot-${index}`); slot.innerHTML = item.emoji; slot.classList.add('filled'); slot.title = item.name; slot.onclick = () => useItem(item.id);
        });
    }

    function addItem(id, name, emoji) { inventory.push({ id, name, emoji }); updateInventory(); playSound('pickup'); showDialogue(`獲得物品：${name}`); }

    // --- 物件互動 ---

    // 1. 書枱
    function inspectDesk() {
        openModal('desk-modal');
        let text = document.getElementById('desk-text'); let btn = document.getElementById('desk-action-btn');
        if (hasPhoto) { text.innerHTML = "抽屜已經打開，入面空空如也。"; btn.style.display = 'none'; }
        else {
            text.innerHTML = "書枱上只有一堆無用的電子零件。<br>下面有一個鎖住嘅抽屜。";
            if (hasKey) { btn.style.display = 'inline-block'; btn.innerText = "使用生鏽鑰匙開鎖"; }
            else { btn.style.display = 'none'; }
        }
    }

    function deskAction() {
        if (!hasKey || hasPhoto) return;
        playSound('unlock'); hasPhoto = true;
        inventory = inventory.filter(item => item.id !== 'key'); hasKey = false; updateInventory();
        addItem('photo', '破舊照片', '🖼️');
        document.getElementById('desk-text').innerHTML = "你用鑰匙打開抽屜，發現一張破舊照片！<br><br><span style='color:#00d2d3;'>照片背面寫住：『解鎖年份在壁畫上』</span>";
        document.getElementById('desk-action-btn').style.display = 'none';
    }

    // 2. 壁畫
    function inspectPainting() {
        openModal('clue-modal');
        document.getElementById('clue-title').innerText = "🖼️ 賽博壁畫";
        document.getElementById('clue-text').innerHTML = `壁畫上畫住一個舊時代嘅日曆，上面用紅色馬克筆圈住咗一個年份：<br><br><span style="font-size: 32px; color: #ffd32a; font-weight: bold;">${currentData.year}</span>`;
    }

    // 3. 垃圾桶
    function inspectTrash() {
        if (currentData.keyLocation === 'trash') {
            if (hasKey) { showDialogue('垃圾桶入面只有一堆垃圾。'); }
            else { hasKey = true; addItem('key', '生鏽鑰匙', '🔑'); showDialogue('你在垃圾桶底部摸到一條生鏽的鑰匙！'); }
        } else {
            openModal('clue-modal');
            document.getElementById('clue-title').innerText = "🗑️ 垃圾桶";
            document.getElementById('clue-text').innerHTML = "裡面只有一些燒焦的電路板和垃圾，沒有特別的東西。";
        }
    }

    // 4. 通風口
    function inspectVent() {
        if (currentData.keyLocation === 'vent') {
            if (hasKey) { showDialogue('通風口裡面只有灰塵。'); }
            else { hasKey = true; addItem('key', '生鏽鑰匙', '🔑'); showDialogue('你在通風口邊緣摸到一條生鏽的鑰匙！'); }
        } else {
            openModal('clue-modal');
            document.getElementById('clue-title').innerText = "🪟 通風口";
            document.getElementById('clue-text').innerHTML = "通風口被生鏽的鐵網封死，你無法通過。";
        }
    }

    // 5. 電腦
    function inspectComputer() { openModal('computer-modal'); }

    // 6. 使用物品
    function useItem(id) {
        closeAllModals();
        if (id === 'photo') { showDialogue(`照片背面寫住：『解鎖年份在壁畫上』`); }
        else if (id === 'key') { showDialogue('你要用呢條鑰匙打開書枱嘅抽屜。'); }
    }

    // 7. 電腦 PIN 碼
    function pressPin(key) {
        playSound('click');
        if (key === 'C') { pinCode = ""; } 
        else if (key === 'E') {
            if (pinCode === currentData.pinCode) {
                isComputerUnlocked = true; playSound('win');
                document.getElementById('computer-locked-ui').style.display = 'none';
                document.getElementById('computer-unlocked-ui').style.display = 'block';
                document.getElementById('computer-title').innerText = '💻 已解鎖終端機';
                document.getElementById('computer-text').innerText = '系統歡迎你，黑客。';
                document.getElementById('computer-secret').innerHTML = currentData.computerSecret;
                showDialogue('成功解鎖終端機！');
            } else { playSound('error'); pinCode = ""; showDialogue('❌ PIN 碼錯誤！'); }
        } else { if (pinCode.length < 4) pinCode += key; }
        updatePinDisplay();
    }
    function updatePinDisplay() { document.getElementById('pin-display').innerText = pinCode.padEnd(4, '-'); }

    // 8. 大門密碼
    function pressKey(key) {
        playSound('click');
        if (key === 'C') { password = ""; } 
        else if (key === 'E') {
            if (password === currentData.doorCode.toString()) { unlockDoor(); return; } 
            else { playSound('error'); password = ""; showDialogue('❌ 密碼錯誤！大門發出警告聲。'); }
        } else { if (password.length < 4) password += key; }
        updatePasswordDisplay();
    }
    function updatePasswordDisplay() { document.getElementById('password-display').innerText = password.padEnd(4, '-'); }

    function unlockDoor() {
        playSound('win'); gameActive = false; clearInterval(timerInterval);
        document.getElementById('door-modal').classList.remove('active');
        document.getElementById('final-level').innerText = currentLevel;
        let m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        let s = (timeLeft % 60).toString().padStart(2, '0');
        document.getElementById('final-time').innerText = `${m}:${s}`;
        document.getElementById('end-screen').style.display = 'flex';
    }

    // --- 核心：生成新關卡 ---
    function generateLevel() {
        gameActive = true;
        
        // 隨機年份 (1950 ~ 2050)
        let year = Math.floor(Math.random() * 100) + 1950;
        
        // 完全隨機加減數 (10 到 89)，保證結果係 4 位數
        let isAddition = Math.random() < 0.5;
        let randomNum = Math.floor(Math.random() * 80) + 10; // 10 ~ 89
        let result = isAddition ? year + randomNum : year - randomNum;
        let opStr = isAddition ? '+' : '-';

        // 隨機鎖匙位置
        let keyLoc = Math.random() < 0.5 ? 'trash' : 'vent';

        // 轉做字串確保 4 位數
        let finalCode = result.toString();
        while(finalCode.length < 4) finalCode = "0" + finalCode;

        currentData = {
            keyLocation: keyLoc,
            year: year,
            operator: opStr,
            randomNum: randomNum,
            doorCode: parseInt(finalCode),
            pinCode: year.toString(),
            computerSecret: `機密訊息：<br><span style="color: #ffd32a; font-weight: bold; font-size: 20px;">大門密碼 = ${year} ${opStr} ${randomNum}</span><br><span style="font-size: 14px; color: #aaa;">(請自行心算並於大門輸入)</span>`
        };

        // 重設狀態
        inventory = []; hasKey = false; hasPhoto = false; isComputerUnlocked = false;
        updateInventory();
        
        // 更新壁畫提示
        document.getElementById('clue-text').innerHTML = `壁畫上畫住一個舊時代嘅日曆，上面用紅色馬克筆圈住咗一個年份：<br><br><span style="font-size: 32px; color: #ffd32a; font-weight: bold;">${year}</span>`;

        // 重設計時器 (每關時間會越來越少，最少 30 秒)
        timeLeft = Math.max(30, 70 - (currentLevel * 5));
        document.getElementById('timer').innerText = `01:00`;
        document.getElementById('timer').classList.remove('danger');
        startTimer();

        document.getElementById('level-display').innerText = `第 ${currentLevel} 關`;
        showDialogue(`第 ${currentLevel} 關開始！`);
    }

    function nextLevel() {
        document.getElementById('end-screen').style.display = 'none';
        currentLevel++;
        generateLevel();
    }

    // 初始化
    window.onload = () => {
        generateLevel();
    };

</script>
</body>
</html>
