<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>會記仇嘅遊戲 v0.3 - 像素版</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: 'Press Start 2P', monospace; /* 像素字體 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        h1 {
            color: #66fcf1;
            text-shadow: 0 0 10px #66fcf1, 0 0 20px #66fcf1;
            font-size: 20px;
            margin-bottom: 20px;
        }
        canvas {
            background-color: #111;
            border: 4px solid #45a29e;
            box-shadow: 0 0 20px rgba(69, 162, 158, 0.5);
        }
        #ui {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            line-height: 1.8;
        }
        .highlight { 
            color: #ff4757; 
            text-shadow: 0 0 8px #ff4757;
        }
        #system-msg {
            color: #c5c6c7;
            margin-top: 15px;
            font-size: 14px;
            min-height: 20px;
        }
        .controls {
            color: #45a29e;
            font-size: 10px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>《會記仇嘅遊戲》</h1>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    
    <div id="ui">
        <p class="controls">[←][→] 移動 &nbsp;|&nbsp; [Space] 跳躍</p>
        <p id="system-msg">系統：我觀察緊你...</p>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const systemMsg = document.getElementById('system-msg');

        // 遊戲狀態
        let player = { 
            x: 50, y: 300, 
            width: 24, height: 36, // 角色大小
            vy: 0, speed: 5, jumpPower: -11.5, 
            isGrounded: false,
            squash: 1, 
            facingRight: true,
            walkTimer: 0 // 用嚟做行路動畫
        };
        
        const gravity = 0.6;
        const floorY = 350; // 地板高度
        
        let keys = {};
        let obstacles = []; 
        let jumpHistory = []; 
        let particles = []; 
        let shakeTime = 0;  
        
        // 新增：生命值與分數
        let lives = 3;
        let maxLives = 3;
        let score = 0;

        let goalX = 750;

        window.addEventListener('keydown', (e) => {
            if ((e.code === 'Space' || e.code === 'ArrowUp') && player.isGrounded) {
                player.vy = player.jumpPower;
                player.isGrounded = false;
                player.squash = 0.8; 
                
                createParticles(player.x + player.width/2, player.y + player.height, '#66fcf1', 6);
                jumpHistory.push(player.x);
                checkAndLearn();
            }
            if (e.code === 'ArrowLeft') { keys.left = true; player.facingRight = false; }
            if (e.code === 'ArrowRight') { keys.right = true; player.facingRight = true; }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft') keys.left = false;
            if (e.code === 'ArrowRight') keys.right = false;
        });

        function createParticles(x, y, color, count) {
            for(let i=0; i<count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6 - 2,
                    life: 1,
                    color: color,
                    size: Math.random() * 3 + 1
                });
            }
        }

        function checkAndLearn() {
            let recentJumps = jumpHistory.slice(-5);
            let targetX = player.x;
            let closeCount = 0;

            recentJumps.forEach(x => {
                if (Math.abs(x - targetX) < 40) closeCount++;
            });

            if (closeCount >= 3) {
                let trapX = targetX + 30;
                if (!obstacles.some(o => Math.abs(o.x - trapX) < 25)) {
                    obstacles.push({ x: trapX, y: floorY - 20, width: 30, height: 20 });
                    systemMsg.innerHTML = `系統：我發現你鍾意喺 <span class="highlight">X = ${Math.round(targetX)}</span> 附近跳。`;
                    jumpHistory = []; 
                }
            }
        }

        function update() {
            // 行路動畫計時器
            if (keys.left || keys.right) {
                player.walkTimer += 0.2;
            } else {
                player.walkTimer = 0;
            }

            if (keys.left) player.x -= player.speed;
            if (keys.right) player.x += player.speed;

            player.squash += (1 - player.squash) * 0.2;

            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            player.vy += gravity;
            player.y += player.vy;

            if (player.y + player.height >= floorY) {
                if (!player.isGrounded) {
                    createParticles(player.x + player.width/2, floorY, '#66fcf1', 8); 
                }
                player.y = floorY - player.height;
                player.vy = 0;
                player.isGrounded = true;
            }

            // 粒子更新
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2;
                p.life -= 0.03;
                if (p.life <= 0) particles.splice(i, 1);
            }

            if (shakeTime > 0) shakeTime--;

            // 碰撞檢測
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                if (player.x < obs.x + obs.width && player.x + player.width > obs.x &&
                    player.y < obs.y + obs.height && player.y + player.height > obs.y) {
                    
                    // 扣血
                    lives--;
                    shakeTime = 20;
                    createParticles(player.x + player.width/2, player.y + player.height/2, '#ff4757', 25); 
                    
                    player.x = 50; 
                    player.y = 300;
                    player.vy = 0;
                    
                    if (lives <= 0) {
                        systemMsg.innerHTML = `系統：遊戲結束。你嘅習慣完全出賣咗你。撳 F5 重新開始。`;
                        // 簡單嘅凍結效果
                        player.speed = 0; 
                        return;
                    } else {
                        systemMsg.innerHTML = `系統：哈哈，中招了。剩餘 <span class="highlight">${lives}</span> 條命。`;
                    }
                    // 移除中招嘅陷阱
                    obstacles.splice(i, 1);
                }
            }

            // 增加分數
            if (player.x > 50) score += 0.1;

            // 過關條件
            if (player.x >= goalX) {
                systemMsg.innerHTML = `系統：你贏咗。但下一次，我會更了解你。`;
                player.x = 50; 
                obstacles = []; 
                lives = maxLives;
                score += 100;
            }
        }

        // 畫公仔專用函數
        function drawCharacter(x, y, w, h, facingRight, walkTimer, isGrounded) {
            ctx.save();
            // 移動到角色中心
            ctx.translate(x + w/2, y + h);
            // 翻轉面向
            if (!facingRight) ctx.scale(-1, 1);

            // 計算手腳擺動
            let legOffset = Math.sin(walkTimer) * 5;
            let armOffset = Math.sin(walkTimer) * 4;

            // 畫腳 (深藍色)
            ctx.fillStyle = '#1f2833';
            ctx.fillRect(-8 + legOffset, -8, 6, 8);
            ctx.fillRect(2 - legOffset, -8, 6, 8);

            // 畫身體 (青色)
            ctx.fillStyle = '#66fcf1';
            ctx.fillRect(-10, -26, 20, 18);

            // 畫手 (青色)
            ctx.fillRect(-14, -24 + armOffset, 4, 10);
            ctx.fillRect(10, -24 - armOffset, 4, 10);

            // 畫頭 (淺色皮膚)
            ctx.fillStyle = '#f1f2f6';
            ctx.fillRect(-12, -42, 24, 16);

            // 畫頭髮 (深灰色)
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(-12, -42, 24, 4);
            ctx.fillRect(-12, -42, 4, 10);

            // 畫眼睛 (黑色，帶點狡黠)
            ctx.fillStyle = '#000';
            ctx.fillRect(2, -36, 3, 3); 
            ctx.fillRect(8, -36, 3, 3);

            // 畫嘴
            ctx.fillStyle = '#000';
            if (isGrounded) {
                ctx.fillRect(4, -30, 5, 1); // 平嘴
            } else {
                ctx.fillRect(4, -32, 5, 3); // 跳躍時張嘴
            }

            ctx.restore();
        }

        function draw() {
            ctx.save();
            
            if (shakeTime > 0) {
                ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8);
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. 畫夜空背景漸變
            let bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGrad.addColorStop(0, '#0b0c10');
            bgGrad.addColorStop(1, '#1f2833');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. 畫星星
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            for(let i=0; i<30; i++) {
                // 用固定公式生成星星位置
                let sx = (i * 137) % canvas.width;
                let sy = (i * 73) % (floorY - 50);
                ctx.fillRect(sx, sy, 2, 2);
            }

            // 3. 畫遠處城市剪影
            ctx.fillStyle = '#151a21';
            ctx.fillRect(100, 250, 40, 100);
            ctx.fillRect(150, 200, 60, 150);
            ctx.fillRect(300, 220, 50, 130);
            ctx.fillRect(450, 180, 70, 170);
            ctx.fillRect(600, 240, 50, 110);
            
            // 城市窗戶
            ctx.fillStyle = '#ffd32a';
            ctx.fillRect(110, 260, 5, 5);
            ctx.fillRect(125, 280, 5, 5);
            ctx.fillRect(165, 220, 5, 5);
            ctx.fillRect(185, 250, 5, 5);

            // 4. 畫地板
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(0, floorY, canvas.width, canvas.height - floorY);
            // 地板高光
            ctx.fillStyle = '#45a29e';
            ctx.fillRect(0, floorY, canvas.width, 3);

            // 5. 畫終點線
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#2ed573';
            ctx.fillStyle = '#2ed573';
            ctx.fillRect(goalX, 0, 5, canvas.height);

            // 6. 畫粒子
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });
            ctx.globalAlpha = 1;

            // 7. 畫陷阱 (發光地刺)
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff4757';
            ctx.fillStyle = '#ff4757';
            obstacles.forEach(obs => {
                ctx.beginPath();
                ctx.moveTo(obs.x, obs.y + obs.height);
                ctx.lineTo(obs.x + obs.width / 2, obs.y);
                ctx.lineTo(obs.x + obs.width, obs.y + obs.height);
                ctx.fill();
                // 畫多一個細刺
                ctx.beginPath();
                ctx.moveTo(obs.x + 10, obs.y + obs.height);
                ctx.lineTo(obs.x + 15, obs.y + 8);
                ctx.lineTo(obs.x + 20, obs.y + obs.height);
                ctx.fill();
            });
            ctx.shadowBlur = 0;

            // 8. 畫歷史跳躍點
            ctx.fillStyle = 'rgba(102, 252, 241, 0.2)';
            jumpHistory.forEach(x => {
                ctx.fillRect(x + player.width/2, floorY + 5, 6, 3);
            });

            // 9. 畫玩家 (使用自訂函數)
            ctx.save();
            let drawY = player.y + (player.height - player.height * player.squash);
            let drawH = player.height * player.squash;
            drawCharacter(player.x, drawY, player.width, drawH, player.facingRight, player.walkTimer, player.isGrounded);
            ctx.restore();

            // 10. 畫 UI (生命與分數)
            ctx.fillStyle = '#fff';
            ctx.font = '16px "Press Start 2P", monospace';
            ctx.fillText(`SCORE: ${Math.floor(score)}`, 20, 40);
            
            ctx.fillText('LIVES: ', 20, 70);
            for(let i=0; i<maxLives; i++) {
                if (i < lives) {
                    ctx.fillStyle = '#ff4757'; // 有命顯示紅色
                } else {
                    ctx.fillStyle = '#333'; // 冇命顯示灰色
                }
                ctx.fillRect(120 + (i * 25), 55, 15, 15); // 畫心心 (用方格代替)
            }

            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
