<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>會記仇嘅遊戲 v0.1</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            background-color: #2c3e50;
            border: 2px solid #ff4757;
            border-radius: 8px;
        }
        #ui {
            margin-top: 15px;
            text-align: center;
            color: #a4b0be;
        }
        .highlight { color: #ff4757; font-weight: bold; }
    </style>
</head>
<body>

    <h1>《會記仇嘅遊戲》</h1>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <div id="ui">
        <p>按 <strong>空白鍵 (Space)</strong> 或 <strong>上箭咀 (↑)</strong> 跳躍。行到最右邊就得。</p>
        <p id="system-msg">系統：我觀察緊你...</p>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const systemMsg = document.getElementById('system-msg');

        // 遊戲狀態
        let player = { x: 50, y: 300, width: 30, height: 40, vy: 0, speed: 4, jumpPower: -11, isGrounded: false };
        const gravity = 0.5;
        const floorY = 340; // 地板高度
        
        let keys = {};
        let obstacles = []; // 陷阱
        let jumpHistory = []; // 記錄你跳躍嘅位置

        // 初始化關卡（測試用）
        let goalX = 750;

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                if (player.isGrounded) {
                    player.vy = player.jumpPower;
                    player.isGrounded = false;
                    
                    // 【核心系統】記錄你喺邊度跳！
                    jumpHistory.push(player.x);
                    
                    // 如果喺同一個位跳太多次，系統就學識針對你
                    checkAndLearn();
                }
            }
            if (e.code === 'ArrowLeft') keys.left = true;
            if (e.code === 'ArrowRight') keys.right = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft') keys.left = false;
            if (e.code === 'ArrowRight') keys.right = false;
        });

        function checkAndLearn() {
            // 如果最近 5 次跳躍，有 3 次都喺附近 50px 範圍內
            let recentJumps = jumpHistory.slice(-5);
            let targetX = player.x;
            let closeCount = 0;

            recentJumps.forEach(x => {
                if (Math.abs(x - targetX) < 50) closeCount++;
            });

            if (closeCount >= 3) {
                // 系統學識咗！喺呢個位前面放個陷阱
                let trapX = targetX + 40;
                // 確保唔好重複放喺同一位置
                if (!obstacles.some(o => Math.abs(o.x - trapX) < 20)) {
                    obstacles.push({ x: trapX, y: floorY - 20, width: 20, height: 20 });
                    systemMsg.innerHTML = `系統：我發現你鍾意喺 <span class="highlight">X = ${Math.round(targetX)}</span> 附近跳。我放咗個驚喜俾你。`;
                    jumpHistory = []; // 清空紀錄，重新觀察
                }
            }
        }

        function update() {
            // 左右移動
            if (keys.left) player.x -= player.speed;
            if (keys.right) player.x += player.speed;

            // 限制唔好行出界
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            // 重力
            player.vy += gravity;
            player.y += player.vy;

            // 地板碰撞
            if (player.y + player.height >= floorY) {
                player.y = floorY - player.height;
                player.vy = 0;
                player.isGrounded = true;
            }

            // 檢查陷阱碰撞 (如果掂到就重生)
            obstacles.forEach(obs => {
                if (player.x < obs.x + obs.width && player.x + player.width > obs.x &&
                    player.y < obs.y + obs.height && player.y + player.height > obs.y) {
                    // 中招！
                    player.x = 50; 
                    player.y = 300;
                    player.vy = 0;
                    systemMsg.innerHTML = `系統：哈哈，中招了。你嘅習慣出賣咗你。`;
                }
            });

            // 過關條件
            if (player.x >= goalX) {
                systemMsg.innerHTML = `系統：你贏咗。但下一次，我會更了解你。`;
                player.x = 50; // 重設
                obstacles = []; // 重設陷阱
            }
        }

        function draw() {
            // 清空畫面
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 畫地板
            ctx.fillStyle = '#34495e';
            ctx.fillRect(0, floorY, canvas.width, canvas.height - floorY);

            // 畫終點線
            ctx.fillStyle = '#2ed573';
            ctx.fillRect(goalX, 0, 5, canvas.height);

            // 畫玩家
            ctx.fillStyle = '#ff4757';
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // 畫陷阱 (黑色尖刺)
            ctx.fillStyle = '#000000';
            obstacles.forEach(obs => {
                ctx.beginPath();
                ctx.moveTo(obs.x, obs.y + obs.height);
                ctx.lineTo(obs.x + obs.width / 2, obs.y);
                ctx.lineTo(obs.x + obs.width, obs.y + obs.height);
                ctx.fill();
            });

            // 畫你嘅歷史跳躍點（半透明，俾玩家見到系統記錄緊咩）
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            jumpHistory.forEach(x => {
                ctx.fillRect(x, floorY - 5, 5, 5);
            });
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // 啟動遊戲
        gameLoop();
    </script>
</body>
</html>
