<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>會記仇嘅遊戲 v2.1 - 全平台變態版</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            margin: 0; padding: 0; background-color: #050505; color: #c5c6c7;
            font-family: 'Press Start 2P', monospace; display: flex; flex-direction: column;
            align-items: center; justify-content: center; height: 100dvh; height: 100vh; overflow: hidden;
            touch-action: none; /* 防止手機滑動/縮放 */
        }
        
        /* 遊戲容器，設定最大闊度並置中 */
        #game-container { 
            position: relative; 
            width: 100%; 
            max-width: 900px; 
        }
        
        /* Canvas 自動縮放 */
        canvas {
            background-color: #111; border: 4px solid #ff4757;
            box-shadow: 0 0 30px rgba(255, 71, 87, 0.6);
            width: 100%; height: auto; display: block; box-sizing: border-box;
        }
        
        /* 彈窗通用樣式 */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 0, 0, 0.95); display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: #fff; text-align: center; z-index: 10;
            padding: 10px; box-sizing: border-box;
        }
        #end-overlay { display: none; }
        
        .overlay h2 { text-shadow: 0 0 20px #ff4757; margin-bottom: 10px; font-size: 20px; color: #ff4757; }
        .overlay p { margin: 5px 0; font-size: 10px; line-height: 1.5; color: #c5c6c7; }
        .overlay .highlight { color: #ffd32a; }
        .overlay .danger { color: #ff4757; }
        
        button {
            margin-top: 15px; padding: 12px 20px; background: #ff4757; color: #000;
            border: none; font-family: 'Press Start 2P', monospace; cursor: pointer;
            font-size: 12px; box-shadow: 0 0 15px #ff4757; font-weight: bold;
            touch-action: manipulation;
        }
        button:hover { background: #ff6b81; }
        
        #ui { margin-top: 10px; text-align: center; font-size: 12px; }
        #system-msg { margin-top: 5px; font-size: 12px; min-height: 20px; color: #fff; }

        /* --- 手機虛擬按鍵 --- */
        #mobile-controls {
            position: absolute; bottom: 10px; left: 0; width: 100%;
            display: flex; justify-content: space-between; padding: 0 15px;
            box-sizing: border-box; pointer-events: none; z-index: 5;
        }
        .touch-btn {
            pointer-events: auto; width: 60px; height: 60px;
            background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 24px; color: rgba(255, 255, 255, 0.8);
            user-select: none; -webkit-user-select: none; touch-action: none;
        }
        .touch-btn:active { background: rgba(255, 255, 255, 0.4); }
        #btn-left { float: left; }
        #btn-right { float: left; margin-left: 15px; }
        #btn-jump { float: right; width: 75px; height: 75px; font-size: 18px; }

        /* 針對手機屏幕嘅字體縮放 */
        @media (max-width: 600px) {
            .overlay h2 { font-size: 16px; }
            .overlay p { font-size: 8px; }
            button { padding: 10px 15px; font-size: 10px; }
            #ui { font-size: 10px; }
            #system-msg { font-size: 10px; }
            #btn-left, #btn-right { width: 50px; height: 50px; font-size: 18px; }
            #btn-jump { width: 65px; height: 65px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="900" height="450"></canvas>
        
        <!-- 手機虛擬按鍵 (放喺 Canvas 上面) -->
        <div id="mobile-controls">
            <div>
                <div id="btn-left" class="touch-btn">◀</div>
                <div id="btn-right" class="touch-btn">▶</div>
            </div>
            <div id="btn-jump" class="touch-btn">跳</div>
        </div>

        <!-- 開始說明彈窗 -->
        <div id="start-overlay" class="overlay">
            <h2>系統已啟動</h2>
            <p style="color: #66fcf1; font-size: 10px; margin-bottom: 10px;">《會記仇嘅遊戲 v2.1》</p>
            <p class="hide-mobile"><span class="highlight">[←][→]</span> 移動 | <span class="highlight">[Space]</span> 跳躍</p>
            <p class="show-mobile" style="display:none;">點按下方按鍵移動及跳躍</p>
            <p style="margin-top: 10px;">目標：收集 <span class="highlight">3 把黃色鎖匙</span>，解鎖右側大門逃生。</p>
            <p class="danger" style="margin-top: 10px;">警告：你只有 1 滴血。</p>
            <p class="danger">碰到地刺、雷射、死神紅眼，<br>即刻死亡。</p>
            <button onclick="startGame()">我準備好受死</button>
        </div>

        <!-- 結算彈窗 -->
        <div id="end-overlay" class="overlay">
            <h2>系統：你失敗了。</h2>
            <p id="report-text"></p>
            <p id="high-score-text" style="color: #ffd32a;"></p>
            <button onclick="restartGame()">再俾機會你挑戰我</button>
        </div>
    </div>
    
    <div id="ui">
        <p id="system-msg">系統：等待你的挑戰...</p>
    </div>

    <script>
        // 判斷係咪手機，切換說明文字
        if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
            document.querySelector('.hide-mobile').style.display = 'none';
            document.querySelector('.show-mobile').style.display = 'block';
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const systemMsg = document.getElementById('system-msg');
        const startOverlay = document.getElementById('start-overlay');
        const endOverlay = document.getElementById('end-overlay');
        const reportText = document.getElementById('report-text');
        const highScoreText = document.getElementById('high-score-text');

        // --- 音效 ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if (type === 'jump') {
                osc.type = 'square'; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'hit') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'pickup') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'laser') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        // --- 遊戲狀態 ---
        let player, obstacles, particles, keys, chaser, lasers;
        let keysInput = {};
        let score, highScore, timeAlive, isGameOver, gameStarted;
        let shakeTime = 0;
        let laserTimer = 0;
        let keysCollected = 0;
        const totalKeys = 3;
        let goalX = canvas.width - 50;
        
        const gravity = 0.6;
        const floorY = 400; 

        function initGame() {
            player = { x: 50, y: floorY - 36, width: 24, height: 36, vy: 0, speed: 6, jumpPower: -12, isGrounded: true, facingRight: true, walkTimer: 0 };
            obstacles = []; particles = []; keys = []; lasers = [];
            chaser = { x: -100, y: 200, speed: 2.5, radius: 20 };
            
            score = 0; timeAlive = 0; shakeTime = 0; isGameOver = false;
            keysCollected = 0;
            laserTimer = 0;
            highScore = parseInt(localStorage.getItem('grudgeHighScore') || '0');
            
            for(let i=0; i<totalKeys; i++) {
                keys.push({
                    x: 200 + Math.random() * (canvas.width - 400),
                    y: floorY - 40 - (Math.random() * 150),
                    width: 20, height: 20, collected: false
                });
            }
        }

        function startGame() {
            startOverlay.style.display = 'none';
            gameStarted = true;
            systemMsg.innerHTML = `系統：執齊 3 條鎖匙，然後逃去終點。做唔到，就死。`;
            initGame();
        }

        // --- 鍵盤與觸控共通邏輯 ---
        function handleJump() {
            if (!gameStarted || isGameOver) return;
            if (player.isGrounded) {
                player.vy = player.jumpPower;
                player.isGrounded = false;
                playSound('jump');
                createParticles(player.x + player.width/2, player.y + player.height, '#66fcf1', 5);
                
                if(Math.random() < 0.3) {
                    obstacles.push({ x: player.x + 50, y: floorY - 20, width: 30, height: 20 });
                    systemMsg.innerHTML = `系統：我知你想跳去邊。`;
                }
            }
        }

        // 鍵盤監聽
        window.addEventListener('keydown', (e) => {
            if (!gameStarted || isGameOver) return;
            if (e.code === 'Space' || e.code === 'ArrowUp') handleJump();
            if (e.code === 'ArrowLeft') { keysInput.left = true; player.facingRight = false; }
            if (e.code === 'ArrowRight') { keysInput.right = true; player.facingRight = true; }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft') keysInput.left = false;
            if (e.code === 'ArrowRight') keysInput.right = false;
        });

        // 觸控監聽 (支援 touch 同 mouse)
        const bindBtn = (id, downFn, upFn) => {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); downFn(); }, {passive: false});
            btn.addEventListener('touchend', (e) => { e.preventDefault(); if(upFn) upFn(); }, {passive: false});
            btn.addEventListener('touchcancel', (e) => { e.preventDefault(); if(upFn) upFn(); }, {passive: false});
            btn.addEventListener('mousedown', (e) => { e.preventDefault(); downFn(); });
            btn.addEventListener('mouseup', (e) => { e.preventDefault(); if(upFn) upFn(); });
            btn.addEventListener('mouseleave', (e) => { e.preventDefault(); if(upFn) upFn(); });
        };

        bindBtn('btn-left', 
            () => { if(gameStarted && !isGameOver) { keysInput.left = true; player.facingRight = false; } },
            () => { keysInput.left = false; }
        );
        bindBtn('btn-right', 
            () => { if(gameStarted && !isGameOver) { keysInput.right = true; player.facingRight = true; } },
            () => { keysInput.right = false; }
        );
        bindBtn('btn-jump', 
            () => { handleJump(); },
            null
        );


        function createParticles(x, y, color, count) {
            for(let i=0; i<count; i++) {
                particles.push({ x, y, vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8-2, life: 1, color, size: Math.random()*4+2 });
            }
        }

        function takeDamage(reason) {
            if(isGameOver) return;
            isGameOver = true;
            shakeTime = 30;
            playSound('hit');
            createParticles(player.x + player.width/2, player.y + player.height/2, '#ff4757', 40); 
            
            reportText.innerHTML = `生存時間：${(timeAlive/60).toFixed(1)} 秒<br>死因：<span style="color:#ff4757">${reason}</span>`;
            
            if (Math.floor(score) > highScore) {
                highScore = Math.floor(score);
                localStorage.setItem('grudgeHighScore', highScore);
                highScoreText.innerHTML = `🏆 新紀錄！最高分：${highScore}`;
            } else {
                highScoreText.innerHTML = `最高分：${highScore}`;
            }
            endOverlay.style.display = 'flex';
        }

        function restartGame() {
            endOverlay.style.display = 'none';
            startGame();
        }

        function update() {
            if (!gameStarted || isGameOver) return;
            
            timeAlive++;
            score += 0.5;
            if (shakeTime > 0) shakeTime--;

            if (keysInput.left) player.x -= player.speed;
            if (keysInput.right) player.x += player.speed;
            if (keysInput.left || keysInput.right) player.walkTimer += 0.2;

            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            player.vy += gravity;
            player.y += player.vy;
            if (player.y + player.height >= floorY) {
                if (!player.isGrounded) createParticles(player.x + player.width/2, floorY, '#66fcf1', 5); 
                player.y = floorY - player.height;
                player.vy = 0;
                player.isGrounded = true;
            }

            // 死神
            chaser.x += (player.x - chaser.x) * 0.01 * chaser.speed;
            chaser.y += (player.y - chaser.y) * 0.01 * chaser.speed;
            chaser.speed += 0.001;

            let dist = Math.hypot((player.x+player.width/2) - chaser.x, (player.y+player.height/2) - chaser.y);
            if (dist < chaser.radius + 15) takeDamage("被死神紅眼吞噬。");

            // 雷射
            laserTimer++;
            if (laserTimer > 120) {
                let lx = Math.random() * (canvas.width - 40) + 20;
                lasers.push({ x: lx, state: 'warning', timer: 60 });
                playSound('laser');
                laserTimer = 0;
            }

            for (let i = lasers.length - 1; i >= 0; i--) {
                let l = lasers[i];
                l.timer--;
                if (l.state === 'warning' && l.timer <= 0) {
                    l.state = 'firing'; l.timer = 15; shakeTime = 10;
                } else if (l.state === 'firing' && l.timer <= 0) {
                    lasers.splice(i, 1);
                }
                
                if (l.state === 'firing') {
                    if (player.x + player.width > l.x - 15 && player.x < l.x + 15) takeDamage("被高溫雷射蒸發。");
                }
            }

            // 鎖匙
            keys.forEach(k => {
                if (!k.collected) {
                    if (player.x < k.x + k.width && player.x + player.width > k.x &&
                        player.y < k.y + k.height && player.y + player.height > k.y) {
                        k.collected = true; keysCollected++;
                        playSound('pickup');
                        createParticles(k.x + 10, k.y + 10, '#ffd32a', 15);
                        systemMsg.innerHTML = `系統：執到鎖匙？你以為走得甩咩？ (${keysCollected}/3)`;
                    }
                }
            });

            // 陷阱
            obstacles.forEach((obs) => {
                if (player.x < obs.x + obs.width && player.x + player.width > obs.x &&
                    player.y < obs.y + obs.height && player.y + player.height > obs.y) {
                    takeDamage("踩中咗系統預判你走位嘅地刺。");
                }
            });

            // 過關
            if (player.x >= goalX) {
                if (keysCollected >= totalKeys) {
                    systemMsg.innerHTML = `系統：可惡...你竟然贏咗...`;
                    score += 5000;
                    takeDamage("你成功逃脫了！ (算你狠)"); 
                } else {
                    if (player.x + player.width > canvas.width) {
                        player.x = canvas.width - player.width;
                        if(Math.random() < 0.1) systemMsg.innerHTML = `系統：冇鎖匙就想走？發夢！`;
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life -= 0.03;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function drawCharacter(x, y, w, h, facingRight, walkTimer, isGrounded) {
            ctx.save(); ctx.translate(x + w/2, y + h);
            if (!facingRight) ctx.scale(-1, 1);
            let legOffset = Math.sin(walkTimer) * 6;
            ctx.fillStyle = '#1f2833'; ctx.fillRect(-8 + legOffset, -8, 6, 8); ctx.fillRect(2 - legOffset, -8, 6, 8);
            ctx.fillStyle = '#66fcf1'; ctx.fillRect(-10, -26, 20, 18);
            ctx.fillStyle = '#f1f2f6'; ctx.fillRect(-12, -42, 24, 16);
            ctx.fillStyle = '#000'; ctx.fillRect(2, -36, 3, 3); ctx.fillRect(8, -36, 3, 3);
            if (!isGrounded) { ctx.fillStyle = '#ff4757'; ctx.fillRect(4, -32, 5, 4); } 
            ctx.restore();
        }

        function draw() {
            ctx.save();
            if (shakeTime > 0) ctx.translate((Math.random() - 0.5) * 12, (Math.random() - 0.5) * 12);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGrad.addColorStop(0, '#1a0000'); bgGrad.addColorStop(1, '#0b0c10');
            ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#2c3e50'; ctx.fillRect(0, floorY, canvas.width, canvas.height - floorY);
            ctx.fillStyle = '#ff4757'; ctx.fillRect(0, floorY, canvas.width, 3);
            
            ctx.fillStyle = keysCollected >= totalKeys ? '#2ed573' : '#ff4757';
            ctx.shadowBlur = 20; ctx.shadowColor = ctx.fillStyle;
            ctx.fillRect(goalX, 0, 10, canvas.height); 
            ctx.shadowBlur = 0;
            if (keysCollected < totalKeys) {
                ctx.fillStyle = '#fff'; ctx.font = '10px Arial';
                ctx.fillText('LOCKED', goalX - 15, floorY / 2);
            }

            keys.forEach(k => {
                if (!k.collected) {
                    ctx.fillStyle = '#ffd32a'; ctx.shadowBlur = 15; ctx.shadowColor = '#ffd32a';
                    ctx.fillRect(k.x, k.y, k.width, k.height);
                    ctx.fillStyle = '#fff'; ctx.fillRect(k.x+5, k.y-5, 10, 10);
                    ctx.shadowBlur = 0;
                }
            });

            lasers.forEach(l => {
                if (l.state === 'warning') {
                    ctx.fillStyle = 'rgba(255, 71, 87, 0.4)';
                    ctx.fillRect(l.x - 10, 0, 20, canvas.height);
                } else if (l.state === 'firing') {
                    ctx.fillStyle = '#fff'; ctx.shadowBlur = 30; ctx.shadowColor = '#ff4757';
                    ctx.fillRect(l.x - 15, 0, 30, canvas.height);
                    ctx.shadowBlur = 0;
                }
            });

            ctx.fillStyle = '#ff4757'; ctx.shadowBlur = 20; ctx.shadowColor = '#ff0000';
            ctx.beginPath(); ctx.arc(chaser.x, chaser.y, chaser.radius, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(chaser.x + (player.x - chaser.x)*0.05, chaser.y + (player.y - chaser.y)*0.05, 8, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#ff4757';
            obstacles.forEach(obs => {
                ctx.beginPath(); ctx.moveTo(obs.x, obs.y + obs.height); ctx.lineTo(obs.x + obs.width / 2, obs.y); ctx.lineTo(obs.x + obs.width, obs.y + obs.height); ctx.fill();
            });

            particles.forEach(p => { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size); });
            ctx.globalAlpha = 1;

            if(gameStarted && !isGameOver) {
                let drawY = player.y + (player.height - player.height * player.squash);
                let drawH = player.height * player.squash;
                drawCharacter(player.x, drawY, player.width, drawH, player.facingRight, player.walkTimer, player.isGrounded);
            }

            ctx.fillStyle = '#fff'; ctx.font = '16px "Press Start 2P", monospace';
            ctx.fillText(`SCORE: ${Math.floor(score)}`, 20, 40);
            ctx.fillStyle = '#ffd32a';
            ctx.fillText(`KEYS: ${keysCollected}/3`, 20, 70);

            ctx.restore();
        }

        gameStarted = false;
        initGame(); 
        function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
        gameLoop();
    </script>
</body>
</html>
