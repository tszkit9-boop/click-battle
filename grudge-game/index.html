<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>會記仇嘅遊戲 v1.0 - 完全版</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #c5c6c7;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
        }
        canvas {
            background-color: #111;
            border: 4px solid #45a29e;
            box-shadow: 0 0 20px rgba(69, 162, 158, 0.5);
        }
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ff4757;
            text-align: center;
            z-index: 10;
        }
        #overlay h2 { text-shadow: 0 0 10px #ff4757; margin-bottom: 20px; }
        #overlay p { color: #66fcf1; margin: 10px 0; font-size: 14px; line-height: 1.5; }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #45a29e;
            color: #000;
            border: none;
            font-family: 'Press Start 2P', monospace;
            cursor: pointer;
            font-size: 14px;
            box-shadow: 0 0 10px #45a29e;
        }
        button:hover { background: #66fcf1; }
        #ui { margin-top: 15px; text-align: center; font-size: 12px; }
        .controls { color: #45a29e; font-size: 10px; }
        #system-msg { margin-top: 10px; font-size: 14px; min-height: 20px; color: #fff; }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div id="overlay">
            <h2>系統分析完成</h2>
            <p id="report-text"></p>
            <p id="high-score-text" style="color: #ffd32a;"></p>
            <button onclick="restartGame()">再俾系統觀察一次</button>
        </div>
    </div>
    
    <div id="ui">
        <p class="controls">[←][→] 移動 &nbsp;|&nbsp; [Space] 跳躍</p>
        <p id="system-msg">系統：我觀察緊你...</p>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const systemMsg = document.getElementById('system-msg');
        const overlay = document.getElementById('overlay');
        const reportText = document.getElementById('report-text');
        const highScoreText = document.getElementById('high-score-text');

        // --- 音效系統 (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if (type === 'jump') {
                osc.type = 'square'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'hit') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'learn') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'item') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            }
        }

        // --- 遊戲狀態 ---
        let player, obstacles, jumpHistory, particles, items, meteors;
        let keys = {};
        let lives, maxLives = 3, score, highScore;
        let shakeTime, timeScale, meteorTimer, isGameOver;
        let eyeState = 0; // 眼睛狀態：0普通，1發現你
        
        const gravity = 0.6;
        const floorY = 350; 
        let goalX = 750;

        function initGame() {
            player = { x: 50, y: 300, width: 24, height: 36, vy: 0, speed: 5, jumpPower: -11.5, isGrounded: false, squash: 1, facingRight: true, walkTimer: 0 };
            obstacles = []; jumpHistory = []; particles = []; items = []; meteors = [];
            lives = maxLives; score = 0; shakeTime = 0; timeScale = 1; meteorTimer = 0; isGameOver = false;
            highScore = parseInt(localStorage.getItem('grudgeHighScore') || '0');
            overlay.style.display = 'none';
            systemMsg.innerHTML = `系統：我觀察緊你... (最高分: ${highScore})`;
            document.body.focus();
        }

        window.addEventListener('keydown', (e) => {
            if (isGameOver) return;
            if ((e.code === 'Space' || e.code === 'ArrowUp') && player.isGrounded) {
                player.vy = player.jumpPower;
                player.isGrounded = false;
                player.squash = 0.8; 
                playSound('jump');
                createParticles(player.x + player.width/2, player.y + player.height, '#66fcf1', 6);
                jumpHistory.push(player.x);
                checkAndLearn();
            }
            if (e.code === 'ArrowLeft') { keys.left = true; player.facingRight = false; }
            if (e.code === 'ArrowRight') { keys.right = true; player.facingRight = true; }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft') keys.left = false;
            if (e.code === 'ArrowRight') keys.right = false;
        });

        function createParticles(x, y, color, count) {
            for(let i=0; i<count; i++) {
                particles.push({ x, y, vx: (Math.random()-0.5)*6, vy: (Math.random()-0.5)*6-2, life: 1, color, size: Math.random()*3+1 });
            }
        }

        function checkAndLearn() {
            let recentJumps = jumpHistory.slice(-5);
            let targetX = player.x;
            let closeCount = 0;
            recentJumps.forEach(x => { if (Math.abs(x - targetX) < 40) closeCount++; });

            if (closeCount >= 3) {
                eyeState = 120; // 眼睛變紅 2 秒
                playSound('learn');
                let trapX = targetX + 30;
                
                if (!obstacles.some(o => Math.abs(o.x - trapX) < 25)) {
                    let type = Math.random();
                    if (type < 0.5) {
                        // 真地刺
                        obstacles.push({ x: trapX, y: floorY - 20, width: 30, height: 20, isReal: true });
                        systemMsg.innerHTML = `系統：發現你喺 X=${Math.round(targetX)} 跳。放個驚喜俾你。`;
                    } else if (type < 0.8) {
                        // 假地刺 (誘餌)
                        obstacles.push({ x: trapX, y: floorY - 20, width: 30, height: 20, isReal: false });
                        systemMsg.innerHTML = `系統：呢個位好似有陷阱？定係我整出嚟呃你嘅呢？`;
                    } else {
                        // 空中陷阱 (逼你改變跳躍)
                        obstacles.push({ x: targetX - 10, y: floorY - 100, width: 30, height: 30, isReal: true });
                        systemMsg.innerHTML = `系統：你跳得咁高，不如撞下天花板？`;
                    }
                    jumpHistory = []; 
                }
            }
        }

        function spawnItems() {
            if (Math.random() < 0.005 && items.length < 2) {
                let itemType = Math.random() > 0.5 ? 'brainwash' : 'slowmo';
                items.push({ x: canvas.width, y: floorY - 50, type: itemType, width: 20, height: 20 });
            }
        }

        function update() {
            if (isGameOver) return;

            // 時間減速效果恢復
            if (timeScale < 1) {
                timeScale += 0.005;
                if (timeScale >= 1) systemMsg.innerHTML = `系統：時間回復正常。`;
            }

            // 系統之眼計時
            if (eyeState > 0) eyeState--;
            
            // 隕石隨機事件
            meteorTimer++;
            if (meteorTimer > 300 && Math.random() < 0.05) { // 每 5 秒左右有機會
                let mx = Math.random() * (canvas.width - 100) + 50;
                meteors.push({ x: mx, y: -50, vy: 4 });
                systemMsg.innerHTML = `<span class="highlight">警告！天降隕石！</span>`;
            }

            // 更新玩家
            if (keys.left) player.x -= player.speed * timeScale;
            if (keys.right) player.x += player.speed * timeScale;
            if (keys.left || keys.right) player.walkTimer += 0.2;

            player.squash += (1 - player.squash) * 0.2;
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            player.vy += gravity * timeScale;
            player.y += player.vy * timeScale;

            if (player.y + player.height >= floorY) {
                if (!player.isGrounded) createParticles(player.x + player.width/2, floorY, '#66fcf1', 8); 
                player.y = floorY - player.height;
                player.vy = 0;
                player.isGrounded = true;
            }

            // 更新道具
            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.x -= 2 * timeScale;
                if (item.x < -30) items.splice(i, 1);
                // 碰撞拾取
                if (player.x < item.x + item.width && player.x + player.width > item.x &&
                    player.y < item.y + item.height && player.y + player.height > item.y) {
                    playSound('item');
                    if (item.type === 'brainwash') {
                        obstacles = [];
                        systemMsg.innerHTML = `<span style="color:#2ed573">洗腦藥水！系統暫時忘記咗你嘅習慣！</span>`;
                    } else {
                        timeScale = 0.4;
                        systemMsg.innerHTML = `<span style="color:#00d2d3">時間減速！你可以睇清楚啲陷阱！</span>`;
                    }
                    items.splice(i, 1);
                }
            }

            // 更新隕石
            for (let i = meteors.length - 1; i >= 0; i--) {
                let m = meteors[i];
                m.y += m.vy * timeScale;
                // 落地爆炸
                if (m.y >= floorY) {
                    shakeTime = 20;
                    createParticles(m.x, floorY, '#ff4757', 20);
                    // 檢查玩家有冇被炸中
                    if (Math.abs(player.x + player.width/2 - m.x) < 50) {
                        takeDamage();
                    }
                    meteors.splice(i, 1);
                }
            }

            // 粒子更新
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx * timeScale;
                p.y += p.vy * timeScale;
                p.vy += 0.2 * timeScale;
                p.life -= 0.03;
                if (p.life <= 0) particles.splice(i, 1);
            }

            if (shakeTime > 0) shakeTime--;

            // 碰撞檢測 (陷阱)
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                if (player.x < obs.x + obs.width && player.x + player.width > obs.x &&
                    player.y < obs.y + obs.height && player.y + player.height > obs.y) {
                    if (obs.isReal) {
                        takeDamage();
                        obstacles.splice(i, 1);
                    }
                }
            }

            // 增加分數
            if (player.x > 50) score += 0.1;
            spawnItems();

            // 過關
            if (player.x >= goalX) {
                systemMsg.innerHTML = `系統：你贏咗呢局。但我會繼續進化。`;
                player.x = 50; 
                lives = maxLives;
                score += 100;
                obstacles = obstacles.filter(o => !o.isReal); // 過關清空地刺，留假地刺
            }
        }

        function takeDamage() {
            lives--;
            shakeTime = 20;
            playSound('hit');
            createParticles(player.x + player.width/2, player.y + player.height/2, '#ff4757', 25); 
            player.x = 50; player.y = 300; player.vy = 0;
            
            if (lives <= 0) {
                gameOver();
            } else {
                systemMsg.innerHTML = `系統：哈哈，中招了。剩餘 <span class="highlight">${lives}</span> 條命。`;
            }
        }

        function gameOver() {
            isGameOver = true;
            playSound('hit');
            
            // 結算報告
            let analysis = "";
            if (jumpHistory.length > 0) {
                analysis = "你太容易被預判了。";
            } else if (score > 500) {
                analysis = "你嘅走位好飄忽，我仲需要多啲時間學習。";
            } else {
                analysis = "你嘅習慣已經完全被我掌握。";
            }

            if (Math.floor(score) > highScore) {
                highScore = Math.floor(score);
                localStorage.setItem('grudgeHighScore', highScore);
                highScoreText.innerHTML = `🏆 新紀錄！最高分：${highScore}`;
            } else {
                highScoreText.innerHTML = `最高分：${highScore}`;
            }

            reportText.innerHTML = `你總共跳躍咗 ${jumpHistory.length} 次。<br><br>系統分析：<br><span style="color:#ff4757">${analysis}</span>`;
            overlay.style.display = 'flex';
        }

        function restartGame() {
            initGame();
        }

        // 畫公仔
        function drawCharacter(x, y, w, h, facingRight, walkTimer, isGrounded) {
            ctx.save();
            ctx.translate(x + w/2, y + h);
            if (!facingRight) ctx.scale(-1, 1);
            let legOffset = Math.sin(walkTimer) * 5;
            let armOffset = Math.sin(walkTimer) * 4;

            ctx.fillStyle = '#1f2833'; ctx.fillRect(-8 + legOffset, -8, 6, 8); ctx.fillRect(2 - legOffset, -8, 6, 8);
            ctx.fillStyle = '#66fcf1'; ctx.fillRect(-10, -26, 20, 18); ctx.fillRect(-14, -24 + armOffset, 4, 10); ctx.fillRect(10, -24 - armOffset, 4, 10);
            ctx.fillStyle = '#f1f2f6'; ctx.fillRect(-12, -42, 24, 16);
            ctx.fillStyle = '#2c3e50'; ctx.fillRect(-12, -42, 24, 4); ctx.fillRect(-12, -42, 4, 10);
            ctx.fillStyle = '#000'; ctx.fillRect(2, -36, 3, 3); ctx.fillRect(8, -36, 3, 3);
            if (isGrounded) { ctx.fillRect(4, -30, 5, 1); } else { ctx.fillRect(4, -32, 5, 3); }
            ctx.restore();
        }

        function drawSystemEye() {
            let cx = canvas.width - 50;
            let cy = 50;
            let eyeColor = eyeState > 0 ? '#ff4757' : '#45a29e';
            
            ctx.save();
            ctx.translate(cx, cy);
            // 眼框
            ctx.strokeStyle = eyeColor;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.ellipse(0, 0, 30, 15, 0, 0, Math.PI * 2);
            ctx.stroke();
            // 瞳孔 (跟住玩家)
            let angle = Math.atan2((player.y + player.height/2) - cy, (player.x + player.width/2) - cx);
            let dist = Math.min(10, Math.hypot(player.x - cx, player.y - cy) / 20);
            let px = Math.cos(angle) * dist;
            let py = Math.sin(angle) * dist;
            
            ctx.fillStyle = eyeColor;
            ctx.beginPath();
            ctx.arc(px, py, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function draw() {
            ctx.save();
            if (shakeTime > 0) ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 背景
            let bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGrad.addColorStop(0, '#0b0c10'); bgGrad.addColorStop(1, '#1f2833');
            ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 城市
            ctx.fillStyle = '#151a21';
            ctx.fillRect(100, 250, 40, 100); ctx.fillRect(150, 200, 60, 150); ctx.fillRect(300, 220, 50, 130); ctx.fillRect(450, 180, 70, 170); ctx.fillRect(600, 240, 50, 110);
            
            // 地板
            ctx.fillStyle = '#2c3e50'; ctx.fillRect(0, floorY, canvas.width, canvas.height - floorY);
            ctx.fillStyle = '#45a29e'; ctx.fillRect(0, floorY, canvas.width, 3);
            
            // 終點
            ctx.shadowBlur = 15; ctx.shadowColor = '#2ed573'; ctx.fillStyle = '#2ed573';
            ctx.fillRect(goalX, 0, 5, canvas.height); ctx.shadowBlur = 0;

            // 畫系統之眼
            drawSystemEye();

            // 畫隕石
            ctx.fillStyle = '#ff4757';
            ctx.shadowBlur = 20; ctx.shadowColor = '#ff4757';
            meteors.forEach(m => {
                ctx.beginPath(); ctx.arc(m.x, m.y, 15, 0, Math.PI*2); ctx.fill();
            });
            ctx.shadowBlur = 0;

            // 畫道具
            items.forEach(item => {
                ctx.fillStyle = item.type === 'brainwash' ? '#9b59b6' : '#00d2d3';
                ctx.fillRect(item.x, item.y, item.width, item.height);
                ctx.fillStyle = '#fff'; ctx.font = '10px Arial';
                ctx.fillText(item.type === 'brainwash' ? 'B' : 'T', item.x + 6, item.y + 14);
            });

            // 粒子
            particles.forEach(p => { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size); });
            ctx.globalAlpha = 1;

            // 陷阱 (真假對比)
            ctx.shadowBlur = 15;
            obstacles.forEach(obs => {
                if (obs.isReal) {
                    ctx.shadowColor = '#ff4757'; ctx.fillStyle = '#ff4757'; ctx.globalAlpha = 1;
                } else {
                    ctx.shadowColor = '#ff4757'; ctx.fillStyle = '#ff4757'; ctx.globalAlpha = 0.3; // 假陷阱半透明
                }
                ctx.beginPath(); ctx.moveTo(obs.x, obs.y + obs.height); ctx.lineTo(obs.x + obs.width / 2, obs.y); ctx.lineTo(obs.x + obs.width, obs.y + obs.height); ctx.fill();
            });
            ctx.globalAlpha = 1; ctx.shadowBlur = 0;

            // 玩家
            ctx.save();
            let drawY = player.y + (player.height - player.height * player.squash);
            let drawH = player.height * player.squash;
            drawCharacter(player.x, drawY, player.width, drawH, player.facingRight, player.walkTimer, player.isGrounded);
            ctx.restore();

            // UI
            ctx.fillStyle = '#fff'; ctx.font = '16px "Press Start 2P", monospace';
            ctx.fillText(`SCORE: ${Math.floor(score)}`, 20, 40);
            for(let i=0; i<maxLives; i++) {
                ctx.fillStyle = i < lives ? '#ff4757' : '#333'; 
                ctx.fillRect(20 + (i * 25), 60, 15, 15);
            }
            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        initGame();
        gameLoop();
    </script>
</body>
</html>
