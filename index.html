<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🎮 呀樂遊戲工作室</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+HK:wght@500;700;900&display=swap');
    
    :root {
        --bg-dark: #0a0a14;
        --neon-blue: #00d2d3;
        --neon-pink: #ff0055;
        --neon-gold: #ffd32a;
        --glass-bg: rgba(15, 15, 25, 0.88);
        --text-light: #fff;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
    }
    
    body {
        background: var(--bg-dark);
        color: var(--text-light);
        font-family: 'Noto Sans HK', sans-serif;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        background: radial-gradient(circle at center, #1a1a2e 0%, #050510 100%);
        overflow-y: auto;
        overflow-x: hidden;
        padding-bottom: env(safe-area-inset-bottom);
    }

    header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: var(--glass-bg);
        backdrop-filter: blur(10px);
        border-bottom: 2px solid var(--neon-blue);
        padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        box-shadow: 0 4px 20px rgba(0,210,211,0.2);
    }

    .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .logo {
        font-family: 'Orbitron', 'Noto Sans HK', sans-serif;
        font-size: 18px;
        font-weight: 900;
        color: var(--neon-blue);
        text-shadow: 0 0 10px var(--neon-blue);
    }
    
    .header-right {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .online-status {
        font-size: 12px;
        color: #fff;
        display: flex;
        align-items: center;
        gap: 5px;
        background: rgba(0,0,0,0.5);
        padding: 5px 10px;
        border-radius: 20px;
        border: 1px solid #444;
        font-weight: 700;
    }

    .online-dot {
        width: 8px;
        height: 8px;
        background: #2ed573;
        border-radius: 50%;
        box-shadow: 0 0 10px #2ed573;
        animation: pulse 2s infinite;
    }
    
    .icon-btn {
        background: rgba(255,255,255,0.1);
        border: 1px solid #555;
        color: #fff;
        border-radius: 8px;
        padding: 5px 10px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s;
    }
    .icon-btn:hover { background: var(--neon-blue); color: #000; border-color: var(--neon-blue); }
    .icon-btn.admin-btn:hover { background: var(--neon-pink); color: #fff; border-color: var(--neon-pink); }

    .broadcast-banner {
        display: none;
        background: rgba(255, 0, 85, 0.16);
        border: 1px solid var(--neon-pink);
        color: #ffd6e4;
        border-radius: 10px;
        padding: 8px 12px;
        font-size: 13px;
        font-weight: 900;
        text-align: center;
    }
    .broadcast-banner.active { display: block; }

    .search-row { display: flex; gap: 10px; }
    .search-input {
        flex: 1;
        padding: 10px 14px;
        background: rgba(255,255,255,0.1);
        border: 1px solid #555;
        border-radius: 8px;
        color: #fff;
        font-size: 14px;
        font-family: 'Noto Sans HK', sans-serif;
        outline: none;
        transition: 0.2s;
        user-select: text;
        -webkit-user-select: text;
    }
    .search-input:focus { border-color: var(--neon-blue); box-shadow: 0 0 10px rgba(0,210,211,0.3); }

    .categories {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 4px;
        scrollbar-width: none;
    }
    .categories::-webkit-scrollbar { display: none; }
    .cat-btn {
        padding: 6px 14px;
        background: transparent;
        border: 1px solid #555;
        border-radius: 20px;
        color: #aaa;
        font-size: 13px;
        font-weight: bold;
        white-space: nowrap;
        cursor: pointer;
        transition: 0.2s;
    }
    .cat-btn.active {
        background: var(--neon-blue);
        color: #000;
        border-color: var(--neon-blue);
        box-shadow: 0 0 10px var(--neon-blue);
    }

    main { padding: 16px; flex: 1; }
    .game-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
        gap: 14px;
        max-width: 1200px;
        margin: 0 auto;
    }
    @media (max-width: 600px) {
        .game-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    }

    .game-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 15px;
        overflow: hidden;
        cursor: pointer;
        transition: 0.2s;
        display: flex;
        flex-direction: column;
        position: relative;
    }
    .game-card:active { transform: scale(0.96); }
    .game-card:hover { border-color: var(--neon-blue); box-shadow: 0 0 20px rgba(0,210,211,0.3); }
    .card-header {
        height: 96px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 46px;
        background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(0,0,0,0.55));
        position: relative;
    }
    .card-category {
        position: absolute;
        top: 8px;
        right: 8px;
        font-size: 10px;
        background: rgba(0,0,0,0.65);
        padding: 2px 8px;
        border-radius: 10px;
        color: #ccc;
        border: 1px solid rgba(255,255,255,0.2);
    }
    .card-body { padding: 10px; flex: 1; display: flex; flex-direction: column; }
    .card-title { font-size: 14px; font-weight: 900; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-desc {
        font-size: 11px;
        color: #aaa;
        margin-bottom: 10px;
        flex: 1;
        line-height: 1.4;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    .card-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid #333;
        padding-top: 8px;
    }
    .best-score { font-size: 11px; color: var(--neon-gold); font-family: 'Orbitron', 'Noto Sans HK', sans-serif; font-weight: bold; }
    .play-count { font-size: 10px; color: #888; }

    /* Modal 彈窗通用樣式 */
    .modal {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.85);
        z-index: 9999;
        display: none;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(5px);
        padding: 20px;
    }
    .modal.active { display: flex; }
    .modal-box {
        background: #1e1e2f;
        border: 2px solid var(--neon-blue);
        border-radius: 15px;
        padding: 20px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 0 30px rgba(0,210,211,0.3);
        text-align: center;
    }
    .modal-box h3 { color: var(--neon-blue); margin-bottom: 12px; font-size: 19px; }
    .feedback-textarea {
        width: 100%;
        height: 110px;
        background: #111;
        color: #fff;
        border: 1px solid #555;
        border-radius: 8px;
        padding: 10px;
        font-family: 'Noto Sans HK', sans-serif;
        font-size: 14px;
        outline: none;
        resize: none;
        margin-bottom: 14px;
        user-select: text;
        -webkit-user-select: text;
    }
    .feedback-textarea:focus { border-color: var(--neon-blue); }
    .btn-submit {
        width: 100%;
        padding: 12px;
        background: var(--neon-blue);
        color: #000;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        font-size: 15px;
        cursor: pointer;
    }
    .btn-close {
        width: 100%;
        padding: 10px;
        background: transparent;
        color: #aaa;
        border: 1px solid #555;
        border-radius: 8px;
        font-weight: bold;
        margin-top: 8px;
        cursor: pointer;
    }

    /* 後台控制台面板 */
    #admin-panel {
        display: none;
        padding: 10px 0 30px;
        max-width: 1000px;
        margin: 0 auto;
        width: 100%;
    }
    #admin-panel.active { display: block; }
    
    .admin-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid var(--neon-pink);
        padding-bottom: 12px;
        margin-bottom: 18px;
        gap: 10px;
    }
    .admin-header h2 { color: var(--neon-pink); font-family: 'Orbitron', 'Noto Sans HK', sans-serif; font-size: 20px; }
    .close-admin {
        background: transparent;
        border: 1px solid #555;
        color: #fff;
        padding: 7px 14px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
    }
    .close-admin:hover { background: var(--neon-pink); border-color: var(--neon-pink); }

    .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 12px;
        margin-bottom: 22px;
    }
    .stat-box {
        background: rgba(255,255,255,0.05);
        border: 1px solid #333;
        border-radius: 12px;
        padding: 16px;
        text-align: center;
    }
    .stat-box h3 { font-size: 12px; color: #aaa; margin-bottom: 8px; }
    .stat-box .value { font-family: 'Orbitron', sans-serif; font-size: 26px; font-weight: 900; color: var(--neon-blue); }

    .table-container {
        background: rgba(0,0,0,0.5);
        border: 1px solid #333;
        border-radius: 12px;
        overflow-x: auto;
        margin-bottom: 18px;
    }
    table { width: 100%; border-collapse: collapse; text-align: left; min-width: 560px; }
    th { background: rgba(0,210,211,0.12); color: var(--neon-blue); padding: 11px 14px; font-size: 13px; border-bottom: 2px solid var(--neon-blue); }
    td { padding: 11px 14px; font-size: 13px; border-bottom: 1px solid #222; }
    tr:hover { background: rgba(255,255,255,0.04); }
    
    .tag-online { color: #2ed573; font-weight: bold; }
    .tag-offline { color: #666; }
    .tag-plays { color: var(--neon-gold); font-weight: bold; font-family: 'Orbitron', sans-serif; }
    .player-id-list {
        font-size: 11px;
        color: #00d2d3;
        word-break: break-all;
        background: rgba(0,210,211,0.1);
        padding: 3px 7px;
        border-radius: 4px;
        margin-top: 4px;
        display: inline-block;
    }

    .admin-section {
        background: rgba(255,255,255,0.02);
        border: 1px solid #333;
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 18px;
    }
    .admin-section h3 { font-size: 15px; margin-bottom: 12px; }
    
    .feedback-msg { color: #fff; font-size: 13px; line-height: 1.5; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 4px; }
    .error-msg { color: #ff7675; font-size: 12px; line-height: 1.4; word-break: break-all; }
    .btn-delete { background: #e74c3c; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }

    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
</style>

<!-- Firebase 8.10.1 SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <header>
        <div class="top-bar">
            <div class="logo">🎮 呀樂遊戲工作室</div>
            <div class="header-right">
                <div class="online-status">
                    <div class="online-dot"></div>
                    <span id="total-online">0</span> 人正在玩
                </div>
                <button type="button" class="icon-btn" onclick="openFeedback()">💬 反饋</button>
                <button type="button" class="icon-btn admin-btn" onclick="promptAdmin()">⚙️ 管理</button>
            </div>
        </div>
        <div class="broadcast-banner" id="broadcast-banner"></div>
        <div class="search-row" id="search-area">
            <input type="text" class="search-input" id="search-input" placeholder="🔍 搜尋遊戲名稱...">
        </div>
        <div class="categories" id="categories-area">
            <button type="button" class="cat-btn active" onclick="filterCategory('全部', this)">全部</button>
            <button type="button" class="cat-btn" onclick="filterCategory('動作', this)">動作</button>
            <button type="button" class="cat-btn" onclick="filterCategory('休閒', this)">休閒</button>
            <button type="button" class="cat-btn" onclick="filterCategory('策略', this)">策略</button>
            <button type="button" class="cat-btn" onclick="filterCategory('模擬', this)">模擬</button>
            <button type="button" class="cat-btn" onclick="filterCategory('硬核', this)">硬核</button>
        </div>
    </header>

    <main>
        <div class="game-grid" id="game-grid"></div>
        
        <!-- 後台數據控制台 -->
        <div id="admin-panel">
            <div class="admin-header">
                <h2>🛠️ 全站數據控制台</h2>
                <button type="button" class="close-admin" onclick="closeAdmin()">✖ 返回大廳</button>
            </div>
            
            <div class="stats-grid">
                <div class="stat-box">
                    <h3>全站實時在線</h3>
                    <div class="value" id="admin-online">0</div>
                </div>
                <div class="stat-box">
                    <h3>全站總遊玩次數</h3>
                    <div class="value" id="admin-total-plays">0</div>
                </div>
                <div class="stat-box">
                    <h3>已上架遊戲</h3>
                    <div class="value" id="admin-total-games">0</div>
                </div>
            </div>

            <!-- 全服廣播 -->
            <div class="admin-section" style="border-color: var(--neon-pink);">
                <h3 style="color: var(--neon-pink);">📢 全服廣播系統</h3>
                <div style="display: flex; gap: 10px;">
                    <input type="text" class="search-input" id="broadcast-msg" placeholder="輸入要發送給全服的訊息...">
                    <button type="button" class="btn-submit" style="width: auto; padding: 0 20px;" onclick="sendBroadcast()">發送</button>
                </div>
            </div>

            <!-- 玩家收件箱 -->
            <div class="admin-section" style="border-color: var(--neon-gold);">
                <h3 style="color: var(--neon-gold);">📝 玩家意見收件箱</h3>
                <div class="table-container" style="margin-bottom: 0; max-height: 300px;">
                    <table>
                        <thead>
                            <tr>
                                <th style="color: var(--neon-gold); border-color: var(--neon-gold); background: rgba(255,211,42,0.1);">時間</th>
                                <th style="color: var(--neon-gold); border-color: var(--neon-gold); background: rgba(255,211,42,0.1);">玩家 ID</th>
                                <th style="color: var(--neon-gold); border-color: var(--neon-gold); background: rgba(255,211,42,0.1);">留言內容</th>
                                <th style="color: var(--neon-gold); border-color: var(--neon-gold); background: rgba(255,211,42,0.1);">操作</th>
                            </tr>
                        </thead>
                        <tbody id="feedback-log-body">
                            <tr><td colspan="4" style="text-align: center; color: #666; padding: 20px;">暫無留言</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 實時錯誤日誌 -->
            <div class="admin-section" style="border-color: #e74c3c;">
                <h3 style="color: #e74c3c;">🐞 實時錯誤日誌</h3>
                <div class="table-container" style="margin-bottom: 0; max-height: 250px;">
                    <table>
                        <thead>
                            <tr>
                                <th style="color: #e74c3c; border-color: #e74c3c; background: rgba(231,76,60,0.1);">時間</th>
                                <th style="color: #e74c3c; border-color: #e74c3c; background: rgba(231,76,60,0.1);">遊戲</th>
                                <th style="color: #e74c3c; border-color: #e74c3c; background: rgba(231,76,60,0.1);">玩家 ID</th>
                                <th style="color: #e74c3c; border-color: #e74c3c; background: rgba(231,76,60,0.1);">錯誤訊息</th>
                            </tr>
                        </thead>
                        <tbody id="error-log-body">
                            <tr><td colspan="4" style="text-align: center; color: #666; padding: 20px;">暫無錯誤紀錄</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 各遊戲在線與遊玩數據 -->
            <h3 style="font-size: 16px; margin-bottom: 10px; color: var(--neon-blue); margin-top: 20px;">📊 各遊戲在線與遊玩數據</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>遊戲名稱</th>
                            <th>在線玩家 ID</th>
                            <th>累積遊玩次數</th>
                        </tr>
                    </thead>
                    <tbody id="admin-table-body">
                        <tr><td colspan="3" style="text-align: center; color: #666; padding: 30px;">正在加載 Firebase 數據...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- 意見反饋彈窗 -->
    <div id="feedback-modal" class="modal">
        <div class="modal-box" style="border-color: var(--neon-blue);">
            <h3>💬 意見反饋</h3>
            <p style="font-size: 12px; color: #aaa; margin-bottom: 14px;">遇到 Bug、有咩想加，或者純粹想讚下我哋，都可以喺度留低！</p>
            <textarea id="feedback-input" class="feedback-textarea" placeholder="請輸入您的意見或發現的 Bug..."></textarea>
            <button type="button" class="btn-submit" id="btn-send-feedback" onclick="submitFeedback()">發送反饋</button>
            <button type="button" class="btn-close" onclick="closeFeedback()">取消</button>
        </div>
    </div>

    <script>
        window.onerror = function(msg) { console.warn("防呆跳過：", msg); return true; };

        const games = [
            { id: 'neon-rain', name: '霓虹雨夜：考牌大師', category: '休閒', desc: '考牌遇上暴雨，單手擔遮避開路人！', icon: '☔', bestKey: 'neon_rain_best', unit: 'm' },
            { id: 'cha-chaan-teng', name: '茶記大亨：樓面生存戰', category: '模擬', desc: '做茶記樓面，瘋狂接單出餐！', icon: '🍳', bestKey: 'chaChaanTeng_best', unit: '$' },
            { id: 'cha-chaan-teng-2', name: '茶記點餐：記憶大考驗', category: '休閒', desc: '考驗記憶力，憑記憶點餐！', icon: '🧠', bestKey: 'chaChaanTeng_best', unit: '$' },
            { id: 'egg-waffle', name: '雞蛋仔 & 格仔餅', category: '休閒', desc: '整出完美嘅雞蛋仔同格仔餅！', icon: '🧇', bestKey: 'eggWaffle_best', unit: '$' },
            { id: 'office-slave', name: '社畜人生 3D', category: '模擬', desc: '打工、買樓、結婚、炒股、上市！', icon: '💼', bestKey: 'officeSlaveSave_v53', unit: '' },
            { id: 'doomsday-shelter', name: '末日避難所', category: '策略', desc: '分配資源，生存到最後一刻。', icon: '☢️', bestKey: 'doomsday_best', unit: '' },
            { id: 'klt-defense', name: '九龍城寨保衛戰', category: '策略', desc: '抵禦外敵，保衛城寨！', icon: '🏯', bestKey: 'kltDefense_best', unit: '' },
            { id: 'black-hole', name: '黑洞吞噬', category: '動作', desc: '操控黑洞，吞噬一切！', icon: '🕳️', bestKey: 'blackHole_best', unit: '' },
            { id: 'magic-survivor', name: '魔法狂潮', category: '動作', desc: '無盡怪物，法術狂轟！', icon: '🔮', bestKey: 'magicSurvivor_best', unit: '' },
            { id: 'one-line-life', name: '一筆定生死', category: '硬核', desc: '一筆畫完，避開所有障礙！', icon: '✏️', bestKey: 'oneLine_best', unit: '' },
            { id: 'zen-reliever', name: '無限減壓艙', category: '休閒', desc: '撳爆一切，釋放壓力。', icon: '🫧', bestKey: 'zen_best', unit: '' },
            { id: 'neon-music-box', name: '霓虹音樂盒', category: '休閒', desc: '跟隨節奏，點擊霓虹音符。', icon: '🎵', bestKey: 'musicBox_best', unit: '' },
            { id: 'carpet-cleaning', name: '極致洗地毯', category: '休閒', desc: '洗走所有污垢，極度解壓！', icon: '🧽', bestKey: 'carpet_best', unit: '' },
            { id: 'cyber-trader', name: '賽博股神', category: '策略', desc: '低買高賣，成為賽博首富。', icon: '📈', bestKey: 'trader_best', unit: '$' },
            { id: 'snowball-game', name: '香港大富翁', category: '策略', desc: '擲骰買地，成為地產霸權！', icon: '🎲', bestKey: 'monopoly_best', unit: '$' },
            { id: 'endless-maze', name: '無盡迷宮', category: '硬核', desc: '走出無盡迷宮，考驗方向感。', icon: '🌀', bestKey: 'maze_best', unit: '' },
            { id: 'escape-room', name: '賽博密室', category: '硬核', desc: '解開謎題，逃出賽博密室。', icon: '🔐', bestKey: 'escape_best', unit: '' },
            { id: 'office-slave-old', name: '社畜人生 (舊版)', category: '模擬', desc: '體驗社畜嘅悲慘加班生活。', icon: '💼', bestKey: 'office_best', unit: '' },
            { id: 'gingerbread-house', name: '薑餅人建屋', category: '休閒', desc: '起一間最靚嘅薑餅屋。', icon: '🍪', bestKey: 'gingerbread_best', unit: '' },
            { id: 'time-loan-shark', name: '時間高利貸', category: '策略', desc: '借時間定還時間？自己揀！', icon: '⏳', bestKey: 'loan_best', unit: '' },
            { id: 'cyber-judge', name: '賽博判官', category: '策略', desc: '審判賽博罪犯，決定生死。', icon: '⚖️', bestKey: 'judge_best', unit: '' },
            { id: 'grudge-game', name: '會記仇的遊戲', category: '動作', desc: '你打敵人一鎚，佢會記住你。', icon: '😡', bestKey: 'grudge_best', unit: '' },
            { id: 'deep-miner', name: '深淵礦工', category: '休閒', desc: '向下挖掘，尋找稀有礦石。', icon: '⛏️', bestKey: 'miner_best', unit: 'm' },
            { id: 'mtr-rush-hour', name: '港鐵逼爆月台塔防 3D', category: '策略', desc: '疏導繁忙轉車站人潮，準時送上車！', icon: '🚇', bestKey: 'mtrRushHour_best', unit: '人' },
            { id: 'nail-hammer', name: '木方釘釘挑戰 · 1" 鋼釘', category: '休閒', desc: '控制羊角鎚蓄力揮擊，將 1 吋釘打平！', icon: '🔨', bestKey: 'woodNail_best_normal_4', unit: '鎚' },
            { id: 'hk-neon-racer', name: '香港街頭霓虹夜賽', category: '動作', desc: '駕駛 JDM 跑車夜闖維港公路，擦邊超車狂飆！', icon: '🏎️', bestKey: 'hkNeonRacer_best', unit: '分' }
        ];

        let currentCategory = '全部';
        let searchQuery = '';
        let gameStats = {};
        let onlineStats = {};
        let isAdminMode = false;
        
        const firebaseConfig = { databaseURL: "https://maze-leaderboard-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        let db = null;
        let userId = '';

        try {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            
            userId = localStorage.getItem('global_device_id');
            if (!userId) {
                userId = 'user_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('global_device_id', userId);
            }

            const lobbyPresenceRef = db.ref(`online_status/lobby/${userId}`);
            lobbyPresenceRef.set({ enteredAt: Date.now(), page: 'lobby' }).catch(() => {});
            lobbyPresenceRef.onDisconnect().remove().catch(() => {});
            window.addEventListener('pagehide', () => {
                lobbyPresenceRef.remove().catch(() => {});
            });

            db.ref('global_broadcast').on('value', (snap) => {
                const banner = document.getElementById('broadcast-banner');
                if (!banner) return;
                const val = snap.val();
                const msg = typeof val === 'string' ? val.trim() : (val && val.msg ? String(val.msg).trim() : '');
                if (msg) {
                    banner.innerText = `📢 全服廣播：${msg}`;
                    banner.classList.add('active');
                } else {
                    banner.innerText = '';
                    banner.classList.remove('active');
                }
            });

            db.ref('game_stats').on('value', (snap) => {
                gameStats = snap.val() || {};
                renderGames();
                renderAdminData();
            });

            db.ref('online_status').on('value', (snap) => {
                onlineStats = snap.val() || {};
                const uniqueUsers = new Set();
                for (let room in onlineStats) {
                    const group = onlineStats[room];
                    if (group && typeof group === 'object') {
                        Object.keys(group).forEach(uid => uniqueUsers.add(uid));
                    }
                }
                document.getElementById('total-online').innerText = uniqueUsers.size;
                renderAdminData();
            });

            db.ref('feedback').on('value', (snap) => {
                if (!isAdminMode) return;
                const tbody = document.getElementById('feedback-log-body');
                const data = snap.val();
                tbody.innerHTML = '';
                
                if (!data) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #666; padding: 20px;">暫無留言</td></tr>';
                    return;
                }

                const logs = Object.entries(data).map(([key, val]) => ({ key, ...val })).sort((a,b) => b.time - a.time);
                logs.forEach(log => {
                    const d = new Date(log.time);
                    const timeStr = `${d.getMonth()+1}/${d.getDate()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
                    let tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="color:#aaa; font-size:12px; white-space:nowrap; vertical-align:top;">${timeStr}</td>
                        <td style="color:var(--neon-blue); font-size:11px; vertical-align:top;">${log.user}</td>
                        <td><div class="feedback-msg">${log.msg}</div></td>
                        <td style="vertical-align:top;"><button type="button" class="btn-delete" onclick="deleteFeedback('${log.key}')">刪除</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            });

            db.ref('error_logs').limitToLast(20).on('value', (snap) => {
                if (!isAdminMode) return;
                const tbody = document.getElementById('error-log-body');
                const data = snap.val();
                tbody.innerHTML = '';
                
                if (!data) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #666; padding: 20px;">暫無錯誤紀錄</td></tr>';
                    return;
                }

                const logs = Object.values(data).sort((a,b) => b.time - a.time);
                logs.forEach(log => {
                    const d = new Date(log.time);
                    const timeStr = `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
                    let tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="color:#aaa; font-size:12px; white-space:nowrap;">${timeStr}</td>
                        <td style="color:var(--neon-blue); font-weight:bold;">${log.game}</td>
                        <td style="color:#888; font-size:11px;">${log.user}</td>
                        <td><div class="error-msg">${log.msg}</div></td>
                    `;
                    tbody.appendChild(tr);
                });
            });
        } catch(e) { console.error("Firebase Init Error:", e); }

        function renderGames() {
            if (isAdminMode) return;
            const grid = document.getElementById('game-grid');
            grid.innerHTML = '';

            const filtered = games.filter(g => {
                const matchCat = currentCategory === '全部' || g.category === currentCategory;
                const matchSearch = g.name.toLowerCase().includes(searchQuery.toLowerCase()) || g.desc.toLowerCase().includes(searchQuery.toLowerCase());
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #777; padding: 50px;">搵唔到相關遊戲...</div>';
                return;
            }

            filtered.forEach(g => {
                let best = localStorage.getItem(g.bestKey);
                let bestText = '未有紀錄';
                if (best !== null) {
                    if (g.unit === '$') bestText = '$' + parseInt(best, 10).toLocaleString();
                    else if (g.unit === 'm') bestText = best + 'm';
                    else if (g.unit) bestText = best + g.unit;
                    else bestText = best;
                }
                let plays = gameStats[g.id] || 0;

                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => playGame(g.id);
                card.innerHTML = `
                    <div class="card-header">
                        ${g.icon}
                        <div class="card-category">${g.category}</div>
                    </div>
                    <div class="card-body">
                        <div class="card-title">${g.name}</div>
                        <div class="card-desc">${g.desc}</div>
                        <div class="card-footer">
                            <span class="best-score">🏆 ${bestText}</span>
                            <span class="play-count">▶ ${plays}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function renderAdminData() {
            if (!isAdminMode) return;
            const tbody = document.getElementById('admin-table-body');
            tbody.innerHTML = '';

            let totalPlays = 0;
            const uniqueOnline = new Set();

            const adminList = games.map(g => {
                let plays = gameStats[g.id] || 0;
                let players = onlineStats[g.id] ? Object.keys(onlineStats[g.id]) : [];
                players.forEach(uid => uniqueOnline.add(uid));
                totalPlays += plays;
                return { name: g.name, id: g.id, icon: g.icon, plays, players };
            });

            if (onlineStats.lobby && typeof onlineStats.lobby === 'object') {
                Object.keys(onlineStats.lobby).forEach(uid => uniqueOnline.add(uid));
            }

            adminList.sort((a, b) => {
                if (b.players.length !== a.players.length) return b.players.length - a.players.length;
                return b.plays - a.plays;
            });

            adminList.forEach(item => {
                let tr = document.createElement('tr');
                
                let onlineHtml = '';
                if (item.players.length > 0) {
                    let displayIds = item.players.slice(0, 3).map(id => `<div class="player-id-list">${id}</div>`).join('');
                    if (item.players.length > 3) {
                        displayIds += `<div style="font-size:10px; color:#888; margin-top:4px;">...仲有 ${item.players.length - 3} 人</div>`;
                    }
                    onlineHtml = `<span class="tag-online">🟢 ${item.players.length} 人</span><br>${displayIds}`;
                } else {
                    onlineHtml = `<span class="tag-offline">⚫ 0 人</span>`;
                }

                tr.innerHTML = `
                    <td style="font-weight: bold; vertical-align: top;">${item.icon} ${item.name}</td>
                    <td style="vertical-align: top;">${onlineHtml}</td>
                    <td class="tag-plays" style="vertical-align: top;">${item.plays.toLocaleString()}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('admin-online').innerText = uniqueOnline.size;
            document.getElementById('admin-total-plays').innerText = totalPlays.toLocaleString();
            document.getElementById('admin-total-games').innerText = games.length;
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderGames();
        });

        function filterCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderGames();
        }

        function playGame(gameId) {
            if (isAdminMode) return;
            try {
                const sessionKey = `played_${gameId}`;
                if (!sessionStorage.getItem(sessionKey)) {
                    sessionStorage.setItem(sessionKey, 'true');
                    if (db) {
                        db.ref(`game_stats/${gameId}`).transaction((current) => {
                            return (current || 0) + 1;
                        }).catch(err => console.warn("Stats err:", err));
                    }
                }
            } catch(e) {}
            window.location.href = `./${gameId}/`;
        }

        function openFeedback() {
            document.getElementById('feedback-modal').classList.add('active');
            document.getElementById('feedback-input').value = '';
        }

        function closeFeedback() {
            document.getElementById('feedback-modal').classList.remove('active');
        }

        function submitFeedback() {
            const msg = document.getElementById('feedback-input').value.trim();
            if (!msg) { alert("請輸入反饋內容！"); return; }
            if (!db) { alert("數據庫未連接，請稍後再試。"); return; }

            const btn = document.getElementById('btn-send-feedback');
            btn.innerText = "發送中...";
            btn.disabled = true;

            db.ref('feedback').push({
                user: userId,
                msg: msg,
                time: Date.now()
            }).then(() => {
                alert("✅ 反饋已成功送出！多謝你嘅意見！");
                closeFeedback();
            }).catch(err => {
                alert("發送失敗：" + err.message);
            }).finally(() => {
                btn.innerText = "發送反饋";
                btn.disabled = false;
            });
        }

        function promptAdmin() {
            if (isAdminMode) {
                closeAdmin();
                return;
            }
            let pwd = prompt("🔐 請輸入管理員密碼：");
            if (pwd === "z54060437k") { 
                isAdminMode = true;
                document.getElementById('game-grid').style.display = 'none';
                document.getElementById('search-area').style.display = 'none';
                document.getElementById('categories-area').style.display = 'none';
                document.getElementById('admin-panel').classList.add('active');
                renderAdminData();
            } else if (pwd !== null) {
                alert("密碼錯誤！");
            }
        }

        function closeAdmin() {
            isAdminMode = false;
            document.getElementById('game-grid').style.display = 'grid';
            document.getElementById('search-area').style.display = 'flex';
            document.getElementById('categories-area').style.display = 'flex';
            document.getElementById('admin-panel').classList.remove('active');
            renderGames();
        }

        function sendBroadcast() {
            const msg = document.getElementById('broadcast-msg').value.trim();
            if (!msg) { alert("請輸入廣播內容！"); return; }
            if (!db) return;
            db.ref('global_broadcast').set({ msg: msg, timestamp: Date.now() })
            .then(() => {
                alert("✅ 廣播已成功發送到全站！");
                document.getElementById('broadcast-msg').value = '';
            });
        }

        function deleteFeedback(key) {
            if (confirm("確定要刪除這條反饋嗎？")) {
                db.ref('feedback/' + key).remove();
            }
        }

        renderGames();
    </script>

</body>
</html>
