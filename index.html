<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🎮 迷你遊戲大廳</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+HK:wght@500;700;900&display=swap');

    :root {
        --bg-dark: #090b14;
        --card-bg: rgba(20, 25, 46, 0.92);
        --neon-blue: #00d2d3;
        --neon-gold: #ffd32a;
        --neon-pink: #ff477e;
        --neon-green: #2ed573;
        --border-subtle: rgba(255, 255, 255, 0.12);
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        min-height: 100dvh;
        background:
            radial-gradient(circle at 18% 12%, rgba(0, 210, 211, 0.14), transparent 42%),
            radial-gradient(circle at 82% 20%, rgba(255, 71, 126, 0.12), transparent 45%),
            var(--bg-dark);
        color: #fff;
        font-family: 'Noto Sans HK', sans-serif;
        padding: 16px 14px calc(24px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .lobby-header {
        max-width: 820px;
        width: 100%;
        margin: 0 auto;
        background: var(--card-bg);
        border: 1.5px solid rgba(0, 210, 211, 0.45);
        border-radius: 16px;
        padding: 14px 16px;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    }

    .brand-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 0.5px;
    }

    .brand-tag {
        font-family: 'Orbitron', sans-serif;
        font-size: 11px;
        background: rgba(0, 210, 211, 0.16);
        color: var(--neon-blue);
        border: 1px solid var(--neon-blue);
        padding: 2px 8px;
        border-radius: 999px;
    }

    .status-pills {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        font-weight: 700;
    }

    .pill {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--border-subtle);
        padding: 5px 10px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .dot-online {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--neon-green);
        box-shadow: 0 0 8px var(--neon-green);
    }

    .broadcast-bar {
        max-width: 820px;
        width: 100%;
        margin: 0 auto;
        background: rgba(255, 211, 42, 0.12);
        border: 1px solid rgba(255, 211, 42, 0.5);
        color: #ffeaa7;
        border-radius: 12px;
        padding: 9px 14px;
        font-size: 13px;
        font-weight: 700;
        display: none;
    }

    .broadcast-bar.show {
        display: block;
    }

    .game-grid {
        max-width: 820px;
        width: 100%;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 14px;
    }

    .game-card {
        background: var(--card-bg);
        border: 1.5px solid var(--border-subtle);
        border-radius: 16px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 14px;
        transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .game-card:hover {
        transform: translateY(-3px);
        border-color: var(--neon-blue);
        box-shadow: 0 12px 26px rgba(0, 210, 211, 0.16);
    }

    .card-top {
        display: flex;
        align-items: flex-start;
        gap: 12px;
    }

    .game-icon {
        width: 50px;
        height: 50px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.07);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        flex-shrink: 0;
    }

    .game-title {
        font-size: 17px;
        font-weight: 900;
        margin-bottom: 4px;
    }

    .game-desc {
        font-size: 13px;
        color: #b8c2dc;
        line-height: 1.5;
    }

    .card-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding-top: 10px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .record-text {
        font-size: 12px;
        color: #9aa5c4;
    }

    .record-text strong {
        font-family: 'Orbitron', 'Noto Sans HK', sans-serif;
        color: var(--neon-gold);
    }

    .play-btn {
        text-decoration: none;
        background: linear-gradient(135deg, #00d2d3, #00a8ff);
        color: #061018;
        font-weight: 900;
        font-size: 13px;
        padding: 8px 15px;
        border-radius: 10px;
        white-space: nowrap;
    }

    .play-btn.gold {
        background: linear-gradient(135deg, #ffd32a, #ff9f43);
        color: #1c1206;
    }
</style>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<header class="lobby-header">
    <div class="brand-title">
        <span>🎮 迷你遊戲大廳</span>
        <span class="brand-tag">ARCADE HUB</span>
    </div>
    <div class="status-pills">
        <div class="pill">
            <span class="dot-online"></span>
            <span>在線：<strong id="online-count">1</strong> 人</span>
        </div>
    </div>
</header>

<div class="broadcast-bar" id="broadcast-bar"></div>

<main class="game-grid">
    <article class="game-card">
        <div>
            <div class="card-top">
                <div class="game-icon">🚇</div>
                <div>
                    <h2 class="game-title">港鐵逼爆月台塔防 3D/2.5D</h2>
                    <p class="game-desc">喺繁忙轉車站擺設設施疏導人潮，把握列車開門時間將乘客送上車，唔好畀月台逼爆！</p>
                </div>
            </div>
        </div>
        <div class="card-footer">
            <span class="record-text">最高運走：<strong id="mtr-best">0</strong> 人</span>
            <a class="play-btn" href="./mtr-rush-hour/">▶ 進入遊戲</a>
        </div>
    </article>

    <article class="game-card">
        <div>
            <div class="card-top">
                <div class="game-icon">🔨</div>
                <div>
                    <h2 class="game-title">木方釘釘挑戰 · 1" 鋼釘</h2>
                    <p class="game-desc">控制羊角鎚蓄力揮擊，將木方上每支 1.00 吋鋼釘打入木面，挑戰用最少鎚數完成！</p>
                </div>
            </div>
        </div>
        <div class="card-footer">
            <span class="record-text">最佳紀錄：<strong id="nail-best">--</strong></span>
            <a class="play-btn gold" href="./nail-hammer/">▶ 進入遊戲</a>
        </div>
    </article>
</main>

<script>
const LOBBY_ID = 'lobby';
const firebaseConfig = { databaseURL: "https://maze-leaderboard-default-rtdb.asia-southeast1.firebasedatabase.app/" };

// 讀取本機最佳紀錄
(function loadLocalRecords() {
    try {
        const mtrBest = parseInt(localStorage.getItem('mtrRushHour_best') || '0', 10) || 0;
        document.getElementById('mtr-best').innerText = mtrBest;
    } catch (_) {}

    try {
        const counts = [4, 6, 8];
        const bests = counts
            .map(c => {
                const v = parseInt(localStorage.getItem(`woodNail_best_${c}`) || '', 10);
                return Number.isFinite(v) && v > 0 ? `${c}釘:${v}鎚` : null;
            })
            .filter(Boolean);
        document.getElementById('nail-best').innerText = bests.length ? bests.join(' · ') : '--';
    } catch (_) {}
})();

// Firebase 在線人數與廣播
(function initLobbyFirebase() {
    try {
        if (typeof firebase === 'undefined') return;
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let userId = localStorage.getItem('global_device_id');
        if (!userId) {
            userId = 'user_' + Math.random().toString(36).slice(2, 11);
            localStorage.setItem('global_device_id', userId);
        }

        const myLobbyRef = db.ref(`online_status/${LOBBY_ID}/${userId}`);
        myLobbyRef.set({ enteredAt: Date.now(), page: 'lobby' }).catch(() => {});
        myLobbyRef.onDisconnect().remove().catch(() => {});

        window.addEventListener('pagehide', () => {
            myLobbyRef.remove().catch(() => {});
        });

        db.ref('online_status').on('value', (snap) => {
            const data = snap.val() || {};
            const uniqueUsers = new Set();
            Object.values(data).forEach(group => {
                if (group && typeof group === 'object') {
                    Object.keys(group).forEach(uid => uniqueUsers.add(uid));
                }
            });
            document.getElementById('online-count').innerText = String(Math.max(1, uniqueUsers.size));
        });

        db.ref('global_broadcast').on('value', (snap) => {
            const bar = document.getElementById('broadcast-bar');
            const val = snap.val();
            const msg = typeof val === 'string' ? val.trim() : (val && val.message ? String(val.message).trim() : '');
            if (msg) {
                bar.innerText = `📢 ${msg}`;
                bar.classList.add('show');
            } else {
                bar.innerText = '';
                bar.classList.remove('show');
            }
        });
    } catch (_) {}
})();
</script>
</body>
</html>
