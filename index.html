<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>會記仇的遊戲</title>
    <!-- 你原本嘅 <style> 代碼放喺度 -->
</head>
<body>

    <!-- 👇 就係呢段代碼，幫你加咗個超靚嘅懸浮返回掣 👇 -->
    <a href="../" style="position: fixed; top: 15px; left: 15px; z-index: 99999; padding: 8px 16px; background: rgba(5, 5, 16, 0.8); color: #00d2d3; border: 2px solid #00d2d3; border-radius: 8px; text-decoration: none; font-family: 'Orbitron', sans-serif; font-weight: bold; font-size: 14px; box-shadow: 0 0 10px rgba(0,210,211,0.5); transition: all 0.2s;" onmouseover="this.style.background='#00d2d3'; this.style.color='#000';" onmouseout="this.style.background='rgba(5, 5, 16, 0.8)'; this.style.color='#00d2d3';">
        ⬅ 返回大廳
    </a>
    <!-- 👆 返回掣完結 👆 -->

    <!-- 你原本嘅遊戲 canvas 同 script 放喺呢度 -->
    <div class="bg-grid"></div>
    <canvas id="gameCanvas"></canvas>
    
    <!-- 你原本嘅 <script> 代碼放喺度 -->
</body>
</html>
