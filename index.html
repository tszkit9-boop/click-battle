<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🎮 呀樂遊戲工作室</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+HK:wght@700;900&display=swap');
    
    :root {
        --bg-dark: #0a0a14;
        --neon-blue: #00d2d3;
        --neon-pink: #ff0055;
        --neon-gold: #ffd32a;
        --glass-bg: rgba(15, 15, 25, 0.85);
        --text-light: #fff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
    
    body {
        background: var(--bg-dark); color: var(--text-light); font-family: 'Noto Sans HK', sans-serif;
        min-height: 100dvh; display: flex; flex-direction: column;
        background: radial-gradient(circle at center, #1a1a2e 0%, #050510 100%);
        overflow-y: auto; overflow-x: hidden;
    }

    header {
        position: sticky; top: 0; z-index: 100;
        background: var(--glass-bg); backdrop-filter: blur(10px);
        border-bottom: 2px solid var(--neon-blue);
        padding: 15px 20px; display: flex; flex-direction: column; gap: 15px;
        box-shadow: 0 4px 20px rgba(0,210,211,0.2);
    }

    .top-bar { display: flex; justify-content: space-between; align-items: center; }
    .logo { font-family: 'Orbitron', sans-serif; font-size: 20px; font-weight: 900; color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); }
    
    .header-right { display: flex; align-items: center; gap: 10px; }
    .online-status { font-size: 13px; color: #fff; display: flex; align-items: center; gap: 5px; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 20px; border: 1px solid #444;}
    .online-dot { width: 8px; height: 8px; background: #2ed573; border-radius: 50%; box-shadow: 0 0 10px #2ed573; animation: pulse 2s infinite; }
    
    .admin-btn { background: rgba(255,255,255,0.1); border: 1px solid #555; color: #fff; border-radius: 8px; padding: 5px 10px; font-size: 14px; cursor: pointer; transition: 0.2s; }
    .admin-btn:hover { background: var(--neon-pink); border-color: var(--neon-pink); }

    .search-row { display: flex; gap: 10px; }
    .search-input {
        flex: 1; padding: 10px 15px; background: rgba(255,255,255,0.1); border: 1px solid #555;
        border-radius: 8px; color: #fff; font-size: 14px; font-family: 'Noto Sans HK', sans-serif;
        outline: none; transition: 0.2s; user-select: text; -webkit-user-select: text;
    }
    .search-input:focus { border-color: var(--neon-blue); box-shadow: 0 0 10px rgba(0,210,211,0.3); }

    .categories { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
    .categories::-webkit-scrollbar { display: none; }
    .cat-btn { padding: 6px 15px; background: transparent; border: 1px solid #555; border-radius: 20px; color: #aaa; font-size: 13px; font-weight: bold; white-space: nowrap; cursor: pointer; transition: 0.2s; }
    .cat-btn.active { background: var(--neon-blue); color: #000; border-color: var(--neon-blue); box-shadow: 0 0 10px var(--neon-blue); }

    main { padding: 20px; flex: 1; }
    .game-grid {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px;
        max-width: 1200px; margin: 0 auto;
    }
    @media (max-width: 600px) { .game-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } }

    .game-card {
        background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
        border-radius: 15px; overflow: hidden; cursor: pointer; transition: 0.2s;
        display: flex; flex-direction: column; position: relative;
    }
    .game-card:active { transform: scale(0.95); }
    .game-card:hover { border-color: var(--neon-blue); box-shadow: 0 0 20px rgba(0,210,211,0.3); }
    .card-header { height: 100px; display: flex; align-items: center; justify-content: center; font-size: 50px; background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(0,0,0,0.5)); position: relative; }
    .card-category { position: absolute; top: 8px; right: 8px; font-size: 10px; background: rgba(0,0,0,0.6); padding: 2px 8px; border-radius: 10px; color: #ccc; border: 1px solid rgba(255,255,255,0.2); }
    .card-body { padding: 10px; flex: 1; display: flex; flex-direction: column; }
    .card-title { font-size: 14px; font-weight: 900; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-desc { font-size: 11px; color: #aaa; margin-bottom: 10px; flex: 1; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;}
    .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #333; padding-top: 8px; }
    .best-score { font-size: 11px; color: var(--neon-gold); font-family: 'Orbitron', sans-serif; font-weight: bold; }
    .play-count { font-size: 10px; color: #777; }

    /* 👇 後台控制台面板 👇 */
    #admin-panel {
        display: none; padding: 20px; max-width: 1000px; margin: 0 auto; width: 100%;
    }
    #admin-panel.active { display: block; }
    
    .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--neon-pink); padding-bottom: 15px; margin-bottom: 20px; }
    .admin-header h2 { color: var(--neon-pink); font-family: 'Orbitron'; font-size: 22px; text-shadow: 0 0 10px var(--neon-pink); }
    .close-admin { background: transparent; border: 1px solid #555; color: #fff; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .close-admin:hover { background: var(--neon-pink); border-color: var(--neon-pink); }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
    .stat-box { background: rgba(255,255,255,0.05); border: 1px solid #333; border-radius: 12px; padding: 20px; text-align: center; }
    .stat-box h3 { font-size: 12px; color: #aaa; margin-bottom: 10px; letter-spacing: 1px; }
    .stat-box .value { font-family: 'Orbitron'; font-size: 28px; font-weight: 900; color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); }

    .table-container { background: rgba(0,0,0,0.5); border: 1px solid #333; border-radius: 12px; overflow-x: auto; margin-bottom: 20px;}
    table { width: 100%; border-collapse: collapse; text-align: left; min-width: 600px; }
    th { background: rgba(0,210,211,0.1); color: var(--neon-blue); padding: 12px 15px; font-size: 13px; border-bottom: 2px solid var(--neon-blue); }
    td { padding: 12px 15px; font-size: 14px; border-bottom: 1px solid #222; }
    tr:hover { background: rgba(255,255,255,0.05); }
    
    .tag-online { color: #2ed573; font-weight: bold; text-shadow: 0 0 5px #2ed573; }
    .tag-offline { color: #666; }
    .tag-plays { color: var(--neon-gold); font-weight: bold; font-family: 'Orbitron'; }
    .player-id-list { font-size: 11px; color: #00d2d3; word-break: break-all; background: rgba(0,210,211,0.1); padding: 4px 8px; border-radius: 4px; margin-top: 4px; display: inline-block; }

    /* 廣播與日誌 UI */
    .admin-section { background: rgba(255,255,255,0.02); border: 1px solid #333; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .admin-section h3 { font-size: 16px; margin-bottom: 15px; }
    .broadcast-box { display: flex; gap: 10px; }
    .broadcast-input { flex: 1; padding: 10px 15px; background: #111; border: 1px solid var(--neon-pink); border-radius: 8px; color: #fff; outline: none; font-family: 'Noto Sans HK'; }
    .broadcast-btn { padding: 10px 20px; background: var(--neon-pink); color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .broadcast-btn:active { transform: scale(0.95); }
    
    .error-msg { color: #e74c3c; font-family: monospace; font-size: 12px; background: rgba(231,76,60,0.1); padding: 4px 8px; border-radius: 4px; word-break: break-all; }

    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
</style>
</head>
<body>

    <header>
        <div class="top-bar">
            <div class="logo">🎮 呀樂遊戲工作室</div>
            <div class="header-right">
                <div class="online-status">
                    <div class="online-dot"></div>
                    <span id="total-online">0</span> 人正在玩
                </div>
                <button class="admin-btn" onclick="promptAdmin()">⚙️ 管理</button>
            </div>
        </div>
        <div class="search-row" id="search-area">
            <input type="text" class="search-input" id="search-input" placeholder="🔍 搜尋遊戲名稱...">
        </div>
        <div class="categories" id="categories-area">
            <button class="cat-btn active" onclick="filterCategory('全部', this)">全部</button>
            <button class="cat-btn" onclick="filterCategory('動作', this)">動作</button>
            <button class="cat-btn" onclick="filterCategory('休閒', this)">休閒</button>
            <button class="cat-btn" onclick="filterCategory('策略', this)">策略</button>
            <button class="cat-btn" onclick="filterCategory('模擬', this)">模擬</button>
            <button class="cat-btn" onclick="filterCategory('硬核', this)">硬核</button>
        </div>
    </header>

    <main>
        <div class="game-grid" id="game-grid"></div>
        
        <div id="admin-panel">
            <div class="admin-header">
                <h2>🛠️ 全站數據控制台</h2>
                <button class="close-admin" onclick="closeAdmin()">✖ 返回大廳</button>
            </div>
            
            <div class="stats-grid">
                <div class="stat-box">
                    <h3>全站實時在線</h3>
                    <div class="value" id="admin-online">0</div>
                </div>
                <div class="stat-box">
                    <h3>全站總遊玩次數</h3>
                    <div class="value" id="admin-total-plays">0</div>
                </div>
                <div class="stat-box">
                    <h3>已上架遊戲</h3>
                    <div class="value" id="admin-total-games">0</div>
                </div>
            </div>

            <!-- 📢 全服廣播系統 -->
            <div class="admin-section" style="border-color: var(--neon-pink);">
                <h3 style="color: var(--neon-pink);">📢 全服廣播系統</h3>
                <div class="broadcast-box">
                    <input type="text" class="broadcast-input" id="broadcast-msg" placeholder="輸入要發送給全服的訊息...">
                    <button class="broadcast-btn" onclick="sendBroadcast()">立即發送</button>
                </div>
                <p style="font-size: 11px; color: #aaa; margin-top: 8px;">* 玩家會在遊戲畫面頂部看到彈窗公告。</p>
            </div>

            <!-- 🐞 實時錯誤日誌 -->
            <div class="admin-section" style="border-color: #e74c3c;">
                <h3 style="color: #e74c3c;">🐞 實時錯誤日誌 (最新 20 條)</h3>
                <div class="table-container" style="margin-bottom: 0; max-height: 250px;">
                    <table>
                        <thead>
                            <tr>
                                <th style="color: #e74c3c; border-color: #e74c3c; background: rgba(231,76,60,0.1);">時間</th>
                                <th style="color: #e74c3c; border-color: #e74c3c; background: rgba(231,76,60,0.1);">遊戲</th>
                                <th style="color: #e74c3c; border-color: #e74c3c; background: rgba(231,76,60,0.1);">玩家 ID</th>
                                <th style="color: #e74c3c; border-color: #e74c3c; background: rgba(231,76,60,0.1);">錯誤訊息</th>
                            </tr>
                        </thead>
                        <tbody id="error-log-body">
                            <tr><td colspan="4" style="text-align: center; color: #666; padding: 20px;">暫無錯誤紀錄</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <h3 style="font-size: 16px; margin-bottom: 10px; color: var(--neon-gold); margin-top: 20px;">📊 各遊戲在線與遊玩數據</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>遊戲名稱</th>
                            <th>在線玩家 ID</th>
                            <th>累積遊玩次數</th>
                        </tr>
                    </thead>
                    <tbody id="admin-table-body">
                        <tr><td colspan="3" style="text-align: center; color: #666; padding: 30px;">正在加載 Firebase 數據...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        window.onerror = function(msg) { console.warn("防呆跳過：", msg); return true; };

        const games = [
            { id: 'neon-rain', name: '霓虹雨夜：考牌大師', category: '休閒', desc: '考牌遇上暴雨，單手擔遮避開路人！', icon: '☔', bestKey: 'neon_rain_best', unit: 'm' },
            { id: 'cha-chaan-teng', name: '茶記大亨：樓面生存戰', category: '模擬', desc: '做茶記樓面，瘋狂接單出餐！', icon: '🍳', bestKey: 'chaChaanTeng_best', unit: '$' },
            { id: 'cha-chaan-teng-2', name: '茶記點餐：記憶大考驗', category: '休閒', desc: '考驗記憶力，憑記憶點餐！', icon: '🧠', bestKey: 'chaChaanTeng_best', unit: '$' },
            { id: 'egg-waffle', name: '雞蛋仔 & 格仔餅', category: '休閒', desc: '整出完美嘅雞蛋仔同格仔餅！', icon: '🧇', bestKey: 'eggWaffle_best', unit: '$' },
            { id: 'office-slave', name: '社畜人生 3D', category: '模擬', desc: '打工、買樓、結婚、炒股、上市！', icon: '💼', bestKey: 'officeSlaveSave_v53', unit: '' },
            { id: 'doomsday-shelter', name: '末日避難所', category: '策略', desc: '分配資源，生存到最後一刻。', icon: '☢️', bestKey: 'doomsday_best', unit: '' },
            { id: 'klt-defense', name: '九龍城寨保衛戰', category: '策略', desc: '抵禦外敵，保衛城寨！', icon: '🏯', bestKey: 'kltDefense_best', unit: '' },
            { id: 'black-hole', name: '黑洞吞噬', category: '動作', desc: '操控黑洞，吞噬一切！', icon: '🕳️', bestKey: 'blackHole_best', unit: '' },
            { id: 'magic-survivor', name: '魔法狂潮', category: '動作', desc: '無盡怪物，法術狂轟！', icon: '🔮', bestKey: 'magicSurvivor_best', unit: '' },
            { id: 'one-line-life', name: '一筆定生死', category: '硬核', desc: '一筆畫完，避開所有障礙！', icon: '✏️', bestKey: 'oneLine_best', unit: '' },
            { id: 'zen-reliever', name: '無限減壓艙', category: '休閒', desc: '撳爆一切，釋放壓力。', icon: '🫧', bestKey: 'zen_best', unit: '' },
            { id: 'neon-music-box', name: '霓虹音樂盒', category: '休閒', desc: '跟隨節奏，點擊霓虹音符。', icon: '🎵', bestKey: 'musicBox_best', unit: '' },
            { id: 'carpet-cleaning', name: '極致洗地毯', category: '休閒', desc: '洗走所有污垢，極度解壓！', icon: '🧽', bestKey: 'carpet_best', unit: '' },
            { id: 'cyber-trader', name: '賽博股神', category: '策略', desc: '低買高賣，成為賽博首富。', icon: '📈', bestKey: 'trader_best', unit: '$' },
            { id: 'snowball-game', name: '香港大富翁', category: '策略', desc: '擲骰買地，成為地產霸權！', icon: '🎲', bestKey: 'monopoly_best', unit: '$' },
            { id: 'endless-maze', name: '無盡迷宮', category: '硬核', desc: '走出無盡迷宮，考驗方向感。', icon: '🌀', bestKey: 'maze_best', unit: '' },
            { id: 'escape-room', name: '賽博密室', category: '硬核', desc: '解開謎題，逃出賽博密室。', icon: '🔐', bestKey: 'escape_best', unit: '' },
            { id: 'office-slave-old', name: '社畜人生 (舊版)', category: '模擬', desc: '體驗社畜嘅悲慘加班生活。', icon: '💼', bestKey: 'office_best', unit: '' },
            { id: 'gingerbread-house', name: '薑餅人建屋', category: '休閒', desc: '起一間最靚嘅薑餅屋。', icon: '🍪', bestKey: 'gingerbread_best', unit: '' },
            { id: 'time-loan-shark', name: '時間高利貸', category: '策略', desc: '借時間定還時間？自己揀！', icon: '⏳', bestKey: 'loan_best', unit: '' },
            { id: 'cyber-judge', name: '賽博判官', category: '策略', desc: '審判賽博罪犯，決定生死。', icon: '⚖️', bestKey: 'judge_best', unit: '' },
            { id: 'grudge-game', name: '會記仇的遊戲', category: '動作', desc: '你打敵人一鎚，佢會記住你。', icon: '😡', bestKey: 'grudge_best', unit: '' },
            { id: 'deep-miner', name: '深淵礦工', category: '休閒', desc: '向下挖掘，尋找稀有礦石。', icon: '⛏️', bestKey: 'miner_best', unit: 'm' }
        ];

        let currentCategory = '全部';
        let searchQuery = '';
        let gameStats = {};
        let onlineStats = {};
        let isAdminMode = false;

        function renderGames() {
            if (isAdminMode) return;
            const grid = document.getElementById('game-grid');
            grid.innerHTML = '';

            const filtered = games.filter(g => {
                const matchCat = currentCategory === '全部' || g.category === currentCategory;
                const matchSearch = g.name.toLowerCase().includes(searchQuery.toLowerCase()) || g.desc.toLowerCase().includes(searchQuery.toLowerCase());
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #777; padding: 50px;">搵唔到相關遊戲...</div>';
                return;
            }

            filtered.forEach(g => {
                let best = localStorage.getItem(g.bestKey);
                let bestText = '未有紀錄';
                if (best !== null) {
                    if (g.unit === '$') bestText = '$' + parseInt(best).toLocaleString();
                    else if (g.unit === 'm') bestText = best + 'm';
                    else bestText = best;
                }
                let plays = gameStats[g.id] || 0;

                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => playGame(g.id);
                card.innerHTML = `
                    <div class="card-header">
                        ${g.icon}
                        <div class="card-category">${g.category}</div>
                    </div>
                    <div class="card-body">
                        <div class="card-title">${g.name}</div>
                        <div class="card-desc">${g.desc}</div>
                        <div class="card-footer">
                            <span class="best-score">🏆 ${bestText}</span>
                            <span class="play-count">▶ ${plays}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function renderAdminData() {
            if (!isAdminMode) return;
            const tbody = document.getElementById('admin-table-body');
            tbody.innerHTML = '';

            let totalPlays = 0;
            let totalOnline = 0;

            const adminList = games.map(g => {
                let plays = gameStats[g.id] || 0;
                let players = onlineStats[g.id] ? Object.keys(onlineStats[g.id]) : [];
                totalPlays += plays;
                totalOnline += players.length;
                return { name: g.name, id: g.id, icon: g.icon, plays, players };
            });

            adminList.sort((a, b) => {
                if (b.players.length !== a.players.length) return b.players.length - a.players.length;
                return b.plays - a.plays;
            });

            adminList.forEach(item => {
                let tr = document.createElement('tr');
                
                let onlineHtml = '';
                if (item.players.length > 0) {
                    let displayIds = item.players.slice(0, 3).map(id => `<div class="player-id-list">${id}</div>`).join('');
                    if (item.players.length > 3) {
                        displayIds += `<div style="font-size:10px; color:#888; margin-top:4px;">...仲有 ${item.players.length - 3} 人</div>`;
                    }
                    onlineHtml = `<span class="tag-online">🟢 ${item.players.length} 人</span><br>${displayIds}`;
                } else {
                    onlineHtml = `<span class="tag-offline">⚫ 0 人</span>`;
                }

                tr.innerHTML = `
                    <td style="font-weight: bold; vertical-align: top;">${item.icon} ${item.name}</td>
                    <td style="vertical-align: top;">${onlineHtml}</td>
                    <td class="tag-plays" style="vertical-align: top;">${item.plays.toLocaleString()}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('admin-online').innerText = totalOnline;
            document.getElementById('admin-total-plays').innerText = totalPlays.toLocaleString();
            document.getElementById('admin-total-games').innerText = games.length;
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderGames();
        });

        function filterCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderGames();
        }

        function playGame(gameId) {
            if (isAdminMode) return;
            try {
                const sessionKey = `played_${gameId}`;
                if (!sessionStorage.getItem(sessionKey)) {
                    sessionStorage.setItem(sessionKey, 'true');
                    if (db) {
                        db.ref(`game_stats/${gameId}`).transaction((current) => {
                            return (current || 0) + 1;
                        }).catch(err => console.warn("Stats err:", err));
                    }
                }
            } catch(e) {}
            window.location.href = `./${gameId}/`;
        }

        function promptAdmin() {
            if (isAdminMode) {
                closeAdmin();
                return;
            }
            let pwd = prompt("🔐 請輸入管理員密碼：");
            // 👇 為你保留的專屬密碼 👇
            if (pwd === "z54060437k") { 
                isAdminMode = true;
                document.getElementById('game-grid').style.display = 'none';
                document.getElementById('search-area').style.display = 'none';
                document.getElementById('categories-area').style.display = 'none';
                document.getElementById('admin-panel').classList.add('active');
                renderAdminData();
            } else if (pwd !== null) {
                alert("密碼錯誤！");
            }
        }

        function closeAdmin() {
            isAdminMode = false;
            document.getElementById('game-grid').style.display = 'grid';
            document.getElementById('search-area').style.display = 'flex';
            document.getElementById('categories-area').style.display = 'flex';
            document.getElementById('admin-panel').classList.remove('active');
            renderGames();
        }

        renderGames();
    </script>

    <!-- Firebase 引入 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = { databaseURL: "https://maze-leaderboard-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        let db = null;
        try {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            
            // 1. 遊戲統計
            db.ref('game_stats').on('value', (snap) => {
                gameStats = snap.val() || {};
                renderGames();
                renderAdminData();
            });

            // 2. 在線狀態
            db.ref('online_status').on('value', (snap) => {
                onlineStats = snap.val() || {};
                let total = 0;
                for (let game in onlineStats) {
                    total += Object.keys(onlineStats[game]).length;
                }
                document.getElementById('total-online').innerText = total;
                renderAdminData();
            });

            // 3. 實時錯誤日誌
            db.ref('error_logs').limitToLast(20).on('value', (snap) => {
                if (!isAdminMode) return;
                const tbody = document.getElementById('error-log-body');
                const data = snap.val();
                tbody.innerHTML = '';
                
                if (!data) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #666; padding: 20px;">暫無錯誤紀錄</td></tr>';
                    return;
                }

                const logs = Object.values(data).sort((a,b) => b.time - a.time);
                logs.forEach(log => {
                    const d = new Date(log.time);
                    const timeStr = `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}:${d.getSeconds().toString().padStart(2,'0')}`;
                    let tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="color:#aaa; font-size:12px; white-space:nowrap;">${timeStr}</td>
                        <td style="color:var(--neon-blue); font-weight:bold;">${log.game}</td>
                        <td style="color:#888; font-size:11px;">${log.user}</td>
                        <td><div class="error-msg">${log.msg}</div></td>
                    `;
                    tbody.appendChild(tr);
                });
            });

        } catch(e) { console.error("Firebase Init Error:", e); }

        // 發送廣播
        function sendBroadcast() {
            const msg = document.getElementById('broadcast-msg').value.trim();
            if (!msg) { alert("請輸入廣播內容！"); return; }
            if (!db) return;

            db.ref('global_broadcast').set({
                msg: msg,
                timestamp: Date.now()
            }).then(() => {
                alert("✅ 廣播已成功發送到全站！");
                document.getElementById('broadcast-msg').value = '';
            }).catch(err => {
                alert("發送失敗：" + err.message);
            });
        }
    </script>

</body>
</html>
