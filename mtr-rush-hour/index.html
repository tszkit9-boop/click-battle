<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🚇 港鐵逼爆月台塔防 3D/2.5D</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+HK:wght@700;900&display=swap');

    :root {
        --bg-dark: #070812;
        --neon-blue: #00d2d3;
        --neon-pink: #ff0055;
        --neon-gold: #ffd32a;
        --neon-green: #2ed573;
        --mtr-red: #e60012;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
    }

    body {
        background: var(--bg-dark);
        color: #fff;
        font-family: 'Noto Sans HK', sans-serif;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        padding-bottom: env(safe-area-inset-bottom);
    }

    header {
        background: rgba(12, 14, 26, 0.96);
        border-bottom: 2px solid var(--neon-blue);
        padding: 8px 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        z-index: 10;
    }

    .hud-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 6px;
    }

    .back-btn, .audio-btn {
        background: rgba(255,255,255,0.1);
        border: 1px solid #555;
        color: #fff;
        padding: 5px 9px;
        border-radius: 7px;
        font-size: 12px;
        font-weight: bold;
        cursor: pointer;
    }

    .audio-btn.muted {
        opacity: 0.55;
        border-color: #666;
    }

    .station-badge {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 900;
        color: #fff;
        white-space: nowrap;
    }

    .mtr-logo {
        background: var(--mtr-red);
        color: #fff;
        padding: 2px 6px;
        border-radius: 4px;
        font-family: 'Orbitron', sans-serif;
        font-size: 11px;
        letter-spacing: 0.5px;
    }

    .top-actions {
        display: flex;
        align-items: center;
        gap: 5px;
    }

    .speed-btn {
        background: rgba(0, 210, 211, 0.15);
        border: 1px solid var(--neon-blue);
        color: var(--neon-blue);
        padding: 5px 9px;
        border-radius: 7px;
        font-family: 'Orbitron', sans-serif;
        font-size: 12px;
        font-weight: 900;
        cursor: pointer;
    }

    .speed-btn.fast {
        background: var(--neon-gold);
        border-color: var(--neon-gold);
        color: #000;
    }
