<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>霓虹音樂盒</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');
        body {
            margin: 0; padding: 0; background-color: #020205; color: #fff;
            font-family: 'Orbitron', 'PingFang HK', sans-serif; overflow: hidden;
            display: flex; flex-direction: column; height: 100dvh; height: 100vh;
            touch-action: none; user-select: none; -webkit-user-select: none;
        }
        /* 頂部懸浮控制台 (玻璃質感) */
        #toolbar {
            height: auto; min-height: 60px; background: rgba(15, 15, 25, 0.7); display: flex; align-items: center;
            justify-content: space-between; padding: 8px 20px; z-index: 10;
            border-bottom: 1px solid rgba(0, 210, 211, 0.3); box-shadow: 0 5px 25px rgba(0,0,0,0.8);
            flex-wrap: wrap; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }
        .btn-group { display: flex; gap: 12px; margin: 5px 0; align-items: center; flex-wrap: wrap; }
        button, .back-btn {
            background: rgba(255, 255, 255, 0.05); color: #00d2d3; border: 1px solid #00d2d3;
            padding: 8px 16px; font-family: 'Orbitron', sans-serif; font-weight: bold;
            border-radius: 10px; cursor: pointer; font-size: 13px; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
            box-shadow: 0 0 10px rgba(0,210,211,0.1);
        }
        button:hover, .back-btn:hover { 
            background: #00d2d3; color: #000; 
            box-shadow: 0 0 20px #00d2d3, inset 0 0 10px rgba(255,255,255,0.5); 
            transform: translateY(-2px);
        }
        button.active { background: #00d2d3; color: #000; box-shadow: 0 0 20px #00d2d3; }
        button.danger { color: #ff4757; border-color: #ff4757; box-shadow: 0 0 10px rgba(255,71,87,0.1); }
        button.danger:hover { background: #ff4757; color: #000; box-shadow: 0 0 20px #ff4757; }
        button.magic { color: #feca57; border-color: #feca57; box-shadow: 0 0 10px rgba(254,202,87,0.1); }
        button.magic:hover { background: #feca57; color: #000; box-shadow: 0 0 20px #feca57; }
        
        #canvas-container { flex: 1; position: relative; cursor: crosshair; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }
        
        #instructions {
            position: absolute; bottom: 20px; width: 100%; text-align: center;
            color: rgba(255,255,255,0.5); font-size: 13px; pointer-events: none;
            line-height: 1.8; text-shadow: 0 2px 5px #000; z-index: 5;
            font-family: 'Noto Sans HK', sans-serif; font-weight: bold; letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div id="toolbar">
        <div class="btn-group">
            <a href="../" class="back-btn">⬅ 返回</a>
            <button id="btn-play" onclick="togglePlay()">▶ 播放</button>
            <button id="btn-reset" class="danger" onclick="clearAll()">🗑 清空</button>
        </div>
        <div class="btn-group">
            <button class="magic" onclick="loadFanXing()">✨ 載入《凡星》全曲</button>
            <button class="magic" onclick="importScore()">📝 輸入曲譜</button>
        </div>
    </div>

    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
        <div id="instructions">
            👆 畫面會自動跟隨鐵珠捲動 | 點擊空白處可自行加音<br>
            👆 長按刪除鋼片 | 點擊切換音高
        </div>
    </div>

    <script>
        // --- 1. 全局變數與音頻初始化 ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const playBtn = document.getElementById('btn-play');

        let W, H, DPR;
        function resize() {
            DPR = window.devicePixelRatio || 1;
            W = canvas.parentElement.clientWidth;
            H = canvas.parentElement.clientHeight;
            canvas.width = W * DPR;
            canvas.height = H * DPR;
            ctx.scale(DPR, DPR); 
        }
        window.addEventListener('resize', resize);
        resize();

        let audioCtx = null;
        let delayNode = null, feedbackGain = null, filterNode = null;
        let lastNoteTime = 0; 

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            delayNode = audioCtx.createDelay();
            delayNode.delayTime.value = 0.4; 
            feedbackGain = audioCtx.createGain();
            feedbackGain.gain.value = 0.3; 
            filterNode = audioCtx.createBiquadFilter();
            filterNode.type = 'lowpass';
            filterNode.frequency.value = 1200; 

            delayNode.connect(feedbackGain);
            feedbackGain.connect(filterNode);
            filterNode.connect(delayNode); 
            delayNode.connect(audioCtx.destination);
        }

        const BASE_FREQS = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88];
        const NOTE_NAMES = ['Do', 'Re', 'Mi', 'Fa', 'Sol', 'La', 'Ti'];
        const NOTE_COLORS = ['#ff4757', '#ff9f43', '#feca57', '#2ed573', '#00d2d3', '#5352ed', '#9b59b6'];

        function getFrequency(noteIdx, octave) {
            let baseFreq = BASE_FREQS[noteIdx];
            if (octave === -1) return baseFreq / 2;
            if (octave === 1) return baseFreq * 2;
            return baseFreq;
        }

        let screenShake = 0;
        let flashColor = null;
        let flashAlpha = 0;

        function playNote(noteIdx, octave) {
            if (!audioCtx) initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            let now = audioCtx.currentTime;
            if (now - lastNoteTime < 0.08) return; 
            lastNoteTime = now;
            
            let freq = getFrequency(noteIdx, octave);
            let color = NOTE_COLORS[noteIdx];
            
            screenShake = 6; 
            flashColor = color;
            flashAlpha = 0.15;
            createSparks(ball.x, ball.y, color);

            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            osc1.type = 'sine'; osc1.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc2.type = 'triangle'; osc2.frequency.setValueAtTime(freq * 2, audioCtx.currentTime); 
            
            const gain = audioCtx.createGain();
            const osc2Gain = audioCtx.createGain();
            osc2Gain.gain.value = 0.08; 

            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.25, audioCtx.currentTime + 0.05); 
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.0); 

            osc1.connect(gain); osc2.connect(osc2Gain); osc2Gain.connect(gain);
            gain.connect(audioCtx.destination); 
            gain.connect(delayNode); 

            osc1.start(); osc2.start();
            osc1.stop(audioCtx.currentTime + 1.2); osc2.stop(audioCtx.currentTime + 1.2);
        }

        // --- 2. 遊戲物件 ---
        let plates = [];
        let isPlaying = false;
        
        // 鐵珠狀態
        let ball = { x: 100, y: 50, radius: 8, trail: [], isDead: false, deadTimer: 0 };
        let sparkArr = [];
        
        let emitter = { x: 100, y: 30, w: 50, h: 20 };
        let isDraggingEmitter = false;

        const PLATE_W = 80; 
        const PLATE_H = 22;
        let cameraY = 0;

        // 動畫狀態機
        let currentIdx = 0;
        let jumpT = 0; // 0 到 1
        let startX = 0, startY = 0, endX = 0, endY = 0;
        let jumpSpeed = 0.04; // 飛行速度

        // --- 🎵 核心：簡譜解析器 (蛇形矩陣排版) ---
        function buildTrackFromString(scoreStr) {
            plates = [];
            if (isPlaying) togglePlay();
            cameraY = 0;
            
            let cleanStr = scoreStr.replace(/[^0-9\+\-\,\s]/g, '');
            let tokens = cleanStr.split(/\s+/).filter(t => t.length > 0);
            
            if (tokens.length === 0) return alert("請輸入有效曲譜！");

            const cols = 4; // 每行固定 4 粒音 (適合手機畫面)
            const colWidth = W / cols;
            const rowHeight = 100; // 行距

            tokens.forEach((token, i) => {
                let extraDelay = 0;
                if (token.includes(',')) {
                    extraDelay = 50; 
                    token = token.replace(/,/g, '');
                }
                if (token === '') return;

                let octave = 0;
                let noteChar = token[0];
                if (token.includes('+')) octave = 1;
                if (token.includes('-')) octave = -1;

                let noteIdx = parseInt(noteChar);
                if (isNaN(noteIdx) || noteIdx < 0 || noteIdx > 6) return;

                let row = Math.floor(i / cols);
                let col = i % cols;
                
                // 蛇形走位：雙數行由左至右，單數行由右至左
                if (row % 2 !== 0) {
                    col = cols - 1 - col;
                }

                let xPos = (col * colWidth) + (colWidth - PLATE_W) / 2;
                let yPos = 120 + row * rowHeight + extraDelay;

                plates.push({
                    x: xPos,
                    y: yPos,
                    w: PLATE_W,
                    h: PLATE_H,
                    noteIndex: noteIdx,
                    octave: octave
                });
            });

            emitter.x = plates[0].x + PLATE_W / 2;
            emitter.y = plates[0].y - 60;
            ball.x = emitter.x; ball.y = emitter.y + 20;
            
            setTimeout(togglePlay, 100); 
        }

        function loadFanXing() {
            let score = 
                "3 3 3 4 5, 5 4 3 2, " +
                "3 3 3 4 5, 6 5 4 3, " +
                "1 1 1 2 3, 3 2 1 6-, " +
                "1 1 1 2 3, 5 3 2 1, " +
                "4 4 5 0+ 5, 4 2 2 4 5 4 2, " +
                "1 1 2 4 2, 1 0 0 1 2 1 0, " +
                "4 4 5 0+ 5, 4 2 2 4 5 4 2, " +
                "1 1 2 4 2, 1 0 0 1 2 1 0, " +
                "1 2 3 4, 5 4 3 2, 1";
            buildTrackFromString(score);
        }

        function importScore() {
            let msg = "請輸入簡譜 (數字 0-6 代表 Do-Si)：\n" +
                      "• 用空格隔開每個音\n" +
                      "• 加逗號 , 代表延長/停頓\n" +
                      "• 加 + 代表高音，加 - 代表低音\n";
            let input = prompt(msg, "4 4 5 4 0+ 6, 4 4 5 4 1+ 0+");
            if (input) buildTrackFromString(input);
        }

        // --- 3. 互動控制 ---
        let dragPlate = null;
        let pressTimer = null;
        let isDraggingPlate = false;
        let startMouseX, startMouseY, initialX, initialY;
        let hoverPos = null; 

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            let cx = e.clientX || (e.touches && e.touches[0].clientX);
            let cy = e.clientY || (e.touches && e.touches[0].clientY);
            return { x: cx - rect.left, y: cy - rect.top + cameraY };
        }

        function handleDown(e) {
            if (e.cancelable) e.preventDefault();
            initAudio(); 
            
            const pos = getPos(e);
            
            if (pos.y < emitter.y + 50 && pos.y > emitter.y - 50 && Math.abs(pos.x - emitter.x) < 50) {
                isDraggingEmitter = true;
                return;
            }

            let clickedPlate = null;
            for (let i = plates.length - 1; i >= 0; i--) {
                let p = plates[i];
                if (pos.x > p.x - 15 && pos.x < p.x + p.w + 15 && pos.y > p.y - 15 && pos.y < p.y + p.h + 15) {
                    clickedPlate = p; break;
                }
            }

            if (clickedPlate) {
                pressTimer = setTimeout(() => {
                    plates = plates.filter(p => p !== clickedPlate);
                    pressTimer = null;
                }, 600); 
                
                dragPlate = clickedPlate;
                isDraggingPlate = false;
                startMouseX = pos.x; startMouseY = pos.y;
                initialX = clickedPlate.x; initialY = clickedPlate.y;
            } else {
                let newPlate = {
                    x: Math.max(10, Math.min(W - PLATE_W - 10, pos.x - PLATE_W/2)), 
                    y: pos.y - PLATE_H/2,
                    w: PLATE_W, h: PLATE_H, 
                    noteIndex: 0, 
                    octave: 0
                };
                plates.push(newPlate);
                playNote(0, 0); 
            }
        }

        function handleMove(e) {
            if (e.cancelable) e.preventDefault();
            const pos = getPos(e);
            hoverPos = pos;

            if (isDraggingEmitter) {
                emitter.x = Math.max(20, Math.min(W - 20, pos.x));
                if (!isPlaying) { ball.x = emitter.x; ball.y = emitter.y + 20; }
                return;
            }

            if (!dragPlate) return;
            let dx = pos.x - startMouseX;
            let dy = pos.y - startMouseY;
            if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                isDraggingPlate = true;
                clearTimeout(pressTimer);
            }
            if (isDraggingPlate) {
                dragPlate.x = Math.max(10, Math.min(W - dragPlate.w - 10, initialX + dx));
                dragPlate.y = initialY + dy;
            }
        }

        function handleUp(e) {
            if (isDraggingEmitter) { isDraggingEmitter = false; return; }
            hoverPos = null;
            
            if (pressTimer) {
                clearTimeout(pressTimer);
                pressTimer = null;
                if (!isDraggingPlate && dragPlate) {
                    dragPlate.noteIndex = (dragPlate.noteIndex + 1) % 7;
                    playNote(dragPlate.noteIndex, dragPlate.octave);
                }
            }
            dragPlate = null;
            isDraggingPlate = false;
        }

        canvas.addEventListener('mousedown', handleDown);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleUp);
        canvas.addEventListener('touchstart', handleDown, {passive: false});
        window.addEventListener('touchmove', handleMove, {passive: false});
        window.addEventListener('touchend', handleUp);

        // --- 4. 其他功能 ---
        function clearAll() { 
            if(confirm("確定清空所有音符？")) { 
                plates = []; 
                if(isPlaying) togglePlay(); 
                cameraY = 0;
                ball.isDead = true;
                ball.trail = [];
                emitter.y = 30;
                ball.x = emitter.x; ball.y = emitter.y + 20;
            } 
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            if (isPlaying) {
                playBtn.innerText = "⏸ 暫停"; playBtn.classList.add('active');
                if (!audioCtx) initAudio();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                if (plates.length > 0) {
                    currentIdx = 0;
                    jumpT = 0;
                    ball.x = plates[0].x + plates[0].w/2;
                    ball.y = plates[0].y - ball.radius;
                    
                    cameraY = Math.max(0, ball.y - H/2);
                    
                    if (plates.length > 1) {
                        startX = ball.x;
                        startY = ball.y;
                        endX = plates[1].x + plates[1].w/2;
                        endY = plates[1].y - ball.radius;
                    }
                }
                
                ball.trail = [];
                ball.isDead = false;
            } else {
                playBtn.innerText = "▶ 播放"; playBtn.classList.remove('active');
            }
        }

        // --- 5. 絕對插值飛行動畫 (100% 唔會漏接) ---
        function createSparks(x, y, color) {
            for(let i=0; i<15; i++) sparkArr.push({ 
                x: x, y: y, 
                vx: (Math.random() - 0.5) * 8, 
                vy: (Math.random() - 0.5) * 8 - 2, 
                life: 1, color: color,
                size: Math.random() * 4 + 1
            });
        }

        function update() {
            for(let i = sparkArr.length - 1; i >= 0; i--) {
                let s = sparkArr[i]; 
                s.x += s.vx; s.y += s.vy; s.vy += 0.15; s.life -= 0.04;
                if(s.life <= 0) sparkArr.splice(i, 1);
            }

            if (screenShake > 0) screenShake -= 0.5;
            if (flashAlpha > 0) flashAlpha -= 0.02;

            if (!isPlaying) return;
            
            if (plates.length <= 1) return;

            if (ball.isDead) {
                if (Date.now() - ball.deadTimer > 1500) {
                    togglePlay(); // 重新開始
                } else {
                    return; 
                }
            }

            // 🎯 核心飛行動畫
            jumpT += jumpSpeed;
            
            if (jumpT >= 1) {
                // 到達目標板
                jumpT = 1;
                ball.x = endX;
                ball.y = endY;
                currentIdx++;
                
                playNote(plates[currentIdx].noteIndex, plates[currentIdx].octave);
                
                if (currentIdx < plates.length - 1) {
                    // 設定下一個目標
                    startX = endX;
                    startY = endY;
                    endX = plates[currentIdx + 1].x + plates[currentIdx + 1].w/2;
                    endY = plates[currentIdx + 1].y - ball.radius;
                    
                    // 根據距離動態調整速度 (距離越遠飛得越耐)
                    let dist = Math.hypot(endX - startX, endY - startY);
                    jumpSpeed = 0.04 - (dist / 5000); 
                    jumpSpeed = Math.max(0.015, Math.min(0.06, jumpSpeed)); // 限制速度範圍
                    
                    jumpT = 0;
                } else {
                    // 播完啦
                    ball.targetPlate = null;
                    ball.isDead = true;
                    ball.deadTimer = Date.now() + 1000; // 延遲重生
                }
            } else {
                // 飛行中 (插值計算)
                ball.x = startX + (endX - startX) * jumpT;
                // 用 Sin 整出一個完美嘅拋物線
                let arcHeight = 60; 
                ball.y = startY + (endY - startY) * jumpT - Math.sin(jumpT * Math.PI) * arcHeight;
            }

            let targetCamY = Math.max(0, ball.y - H * 0.6);
            cameraY += (targetCamY - cameraY) * 0.1; 
            
            ball.trail.push({x: ball.x, y: ball.y});
            if(ball.trail.length > 12) ball.trail.shift();
        }

        // --- 6. 渲染繪製 (玻璃霓虹) ---
        function draw() {
            ctx.clearRect(0, 0, W, H);
            
            let sx = 0, sy = 0;
            if (screenShake > 0) {
                sx = (Math.random() - 0.5) * screenShake;
                sy = (Math.random() - 0.5) * screenShake;
            }
            ctx.save();
            ctx.translate(sx, sy);

            // 星空漸變背景
            let bgGrd = ctx.createRadialGradient(W/2, H/2, 50, W/2, H/2, Math.max(W,H));
            bgGrd.addColorStop(0, '#0a1226');
            bgGrd.addColorStop(1, '#020205');
            ctx.fillStyle = bgGrd; 
            ctx.fillRect(0, 0, W, H);

            // 背景網格
            let gridOffset = cameraY % 60;
            ctx.strokeStyle = 'rgba(0, 210, 211, 0.05)'; ctx.lineWidth = 1;
            for (let i = 0; i < W; i += 60) { ctx.beginPath(); ctx.moveTo(i, -60); ctx.lineTo(i, H + 60); ctx.stroke(); }
            for (let i = -60; i < H + 60; i += 60) { 
                let drawY = i - gridOffset;
                ctx.beginPath(); ctx.moveTo(0, drawY); ctx.lineTo(W, drawY); ctx.stroke(); 
            }

            if (flashAlpha > 0 && flashColor) {
                ctx.fillStyle = flashColor;
                ctx.globalAlpha = flashAlpha;
                ctx.fillRect(0, 0, W, H);
                ctx.globalAlpha = 1;
            }
            
            ctx.save();
            ctx.translate(0, -cameraY);

            // 發光賽道 (連接線)
            if (plates.length > 1) {
                ctx.beginPath();
                ctx.moveTo(plates[0].x + plates[0].w/2, plates[0].y + plates[0].h/2);
                for(let i=1; i<plates.length; i++) {
                    ctx.lineTo(plates[i].x + plates[i].w/2, plates[i].y + plates[i].h/2);
                }
                ctx.strokeStyle = 'rgba(0, 210, 211, 0.15)';
                ctx.lineWidth = 8;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
            }

            // 發射器
            if (cameraY < emitter.y + 100) {
                ctx.fillStyle = '#111';
                ctx.fillRect(emitter.x - emitter.w/2, emitter.y, emitter.w, emitter.h);
                ctx.strokeStyle = '#ff4757'; ctx.lineWidth = 2;
                ctx.shadowBlur = 15; ctx.shadowColor = '#ff4757';
                ctx.strokeRect(emitter.x - emitter.w/2, emitter.y, emitter.w, emitter.h);
                ctx.shadowBlur = 0;
            }
            
            // 玻璃質感鋼片
            for (let p of plates) {
                if (p.y < cameraY - 100 || p.y > cameraY + H + 100) continue;

                let color = NOTE_COLORS[p.noteIndex];
                if (p.octave === -1) color = '#818cf8'; 
                if (p.octave === 1) color = '#f472b6'; 

                // 陰影
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.beginPath();
                if(ctx.roundRect) ctx.roundRect(p.x + 3, p.y + 5, p.w, p.h, p.h/2);
                else ctx.rect(p.x + 3, p.y + 5, p.w, p.h);
                ctx.fill();

                // 漸變玻璃
                let grd = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
                grd.addColorStop(0, color + 'cc'); 
                grd.addColorStop(1, color + '44'); 
                
                ctx.shadowBlur = 20; ctx.shadowColor = color; 
                ctx.fillStyle = grd;
                
                ctx.beginPath();
                if(ctx.roundRect) ctx.roundRect(p.x, p.y, p.w, p.h, p.h/2);
                else ctx.rect(p.x, p.y, p.w, p.h);
                ctx.fill();
                
                // 邊框
                ctx.shadowBlur = 0; 
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
                ctx.stroke();

                // 高光
                ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(p.x + p.h/2, p.y + 3);
                ctx.lineTo(p.x + p.w - p.h/2, p.y + 3);
                ctx.stroke();

                // 文字
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 14px "Orbitron", sans-serif'; ctx.textAlign = 'center';
                ctx.shadowBlur = 4; ctx.shadowColor = '#000';
                ctx.fillText(NOTE_NAMES[p.noteIndex], p.x + p.w/2, p.y + 16);
                ctx.shadowBlur = 0;
            }

            // 火花
            for(let s of sparkArr) {
                ctx.globalAlpha = s.life; ctx.fillStyle = s.color;
                ctx.shadowBlur = 10; ctx.shadowColor = s.color;
                ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill();
            }
            ctx.globalAlpha = 1; ctx.shadowBlur = 0;

            // 鐵珠尾跡
            for(let i=0; i<ball.trail.length; i++) {
                let t = ball.trail[i];
                let ratio = i / ball.trail.length;
                ctx.globalAlpha = ratio * 0.6;
                ctx.fillStyle = '#00d2d3';
                ctx.beginPath(); ctx.arc(t.x, t.y, ball.radius * ratio, 0, Math.PI * 2); ctx.fill();
            }
            ctx.globalAlpha = 1;

            // 鐵珠
            if (!ball.isDead) {
                ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#fff'; ctx.shadowBlur = 30; ctx.shadowColor = '#00ffff'; ctx.fill(); 
                
                ctx.beginPath(); ctx.arc(ball.x - 2, ball.y - 2, ball.radius * 0.4, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 0; ctx.fill();
            }

            ctx.restore(); 
            ctx.restore(); 
        }

        // --- 7. 主循環 ---
        function loop() { 
            update(); 
            draw(); 
            requestAnimationFrame(loop); 
        }
        loop();
    </script>
</body>
</html>
