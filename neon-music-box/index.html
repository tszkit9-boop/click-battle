<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>霓虹音樂盒</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');
        body {
            margin: 0; padding: 0; background-color: #050510; color: #fff;
            font-family: 'Orbitron', 'PingFang HK', sans-serif; overflow: hidden;
            display: flex; flex-direction: column; height: 100dvh; height: 100vh;
            touch-action: none; user-select: none; -webkit-user-select: none;
        }
        #toolbar {
            height: auto; min-height: 60px; background: rgba(17, 17, 17, 0.95); display: flex; align-items: center;
            justify-content: space-between; padding: 5px 15px; z-index: 10;
            border-bottom: 2px solid #00d2d3; box-shadow: 0 0 20px rgba(0,210,211,0.4);
            flex-wrap: wrap; backdrop-filter: blur(10px);
        }
        .btn-group { display: flex; gap: 8px; margin: 5px 0; align-items: center; flex-wrap: wrap; }
        button, .back-btn {
            background: transparent; color: #00d2d3; border: 2px solid #00d2d3;
            padding: 6px 12px; font-family: 'Orbitron', sans-serif; font-weight: bold;
            border-radius: 8px; cursor: pointer; font-size: 13px; transition: all 0.2s;
            text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
            box-shadow: 0 0 10px rgba(0,210,211,0.1);
        }
        button:hover, .back-btn:hover { background: #00d2d3; color: #000; box-shadow: 0 0 20px #00d2d3; }
        button.active { background: #00d2d3; color: #000; box-shadow: 0 0 15px #00d2d3; }
        button.danger { color: #ff4757; border-color: #ff4757; box-shadow: 0 0 10px rgba(255,71,87,0.1); }
        button.danger:hover { background: #ff4757; color: #000; box-shadow: 0 0 20px #ff4757; }
        button.magic { color: #feca57; border-color: #feca57; box-shadow: 0 0 10px rgba(254,202,87,0.2); }
        button.magic:hover { background: #feca57; color: #000; box-shadow: 0 0 20px #feca57; }
        
        /* 音階選擇器 */
        #note-selector {
            display: flex; gap: 8px; padding: 10px 15px; background: rgba(0,0,0,0.6);
            border-bottom: 1px solid #222; overflow-x: auto; scrollbar-width: none;
            align-items: center;
        }
        #note-selector::-webkit-scrollbar { display: none; }
        
        .octave-btn {
            flex: 0 0 auto; width: 50px; height: 40px; border-radius: 8px;
            border: 2px solid #555; background: #111; color: #aaa; font-size: 12px;
            cursor: pointer; transition: 0.2s; font-weight: bold;
        }
        .octave-btn.active { border-color: #feca57; color: #feca57; background: rgba(254, 202, 87, 0.1); }

        .note-btn {
            flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%;
            border: 2px solid #333; background: #111; color: #fff; font-size: 14px;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            transition: 0.2s; font-family: 'Orbitron', sans-serif;
        }
        .note-btn.selected {
            border-color: #fff; transform: scale(1.15); box-shadow: 0 0 15px currentColor;
        }

        #canvas-container { flex: 1; position: relative; cursor: crosshair; background: #050510; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }
        
        #instructions {
            position: absolute; bottom: 15px; width: 100%; text-align: center;
            color: rgba(255,255,255,0.6); font-size: 12px; pointer-events: none;
            line-height: 1.6; text-shadow: 0 2px 4px #000; z-index: 10;
        }
    </style>
</head>
<body>
    <div id="toolbar">
        <div class="btn-group">
            <a href="../" class="back-btn">⬅ 返回</a>
            <button id="btn-play" onclick="togglePlay()">▶ 播放</button>
            <button id="btn-reset" class="danger" onclick="clearAll()">🗑 清空</button>
        </div>
        <div class="btn-group">
            <button class="magic" onclick="loadFanXing()">✨ 載入《凡星》</button>
            <button class="magic" onclick="importScore()">📝 輸入曲譜</button>
            <button onclick="shareTrack()">🔗 分享</button>
        </div>
    </div>
    
    <!-- 八度與音符選擇器 -->
    <div id="note-selector">
        <button class="octave-btn" id="oct-low" onclick="setOctave(-1)">低音</button>
        <button class="octave-btn active" id="oct-mid" onclick="setOctave(0)">中音</button>
        <button class="octave-btn" id="oct-high" onclick="setOctave(1)">高音</button>
        <div style="width: 1px; height: 30px; background: #333; margin: 0 5px;"></div>
        <div id="note-buttons" style="display: flex; gap: 8px;"></div>
    </div>

    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
        <div id="instructions">
            👆 揀選上方音符，點擊畫布放鋼片 (自動對齊格線)<br>
            👆 鋼片垂直距離越遠，節奏越慢 | 點擊切換音高 | 長按刪除
        </div>
    </div>

    <script>
        // --- 1. 全局變數與音頻初始化 ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const playBtn = document.getElementById('btn-play');
        const noteButtonsContainer = document.getElementById('note-buttons');

        let W, H, DPR;
        function resize() {
            DPR = window.devicePixelRatio || 1;
            W = canvas.parentElement.clientWidth;
            H = canvas.parentElement.clientHeight;
            canvas.width = W * DPR;
            canvas.height = H * DPR;
            ctx.scale(DPR, DPR); 
        }
        window.addEventListener('resize', resize);
        resize();

        let audioCtx = null;
        let delayNode = null, feedbackGain = null, filterNode = null;

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            delayNode = audioCtx.createDelay();
            delayNode.delayTime.value = 0.3; 
            feedbackGain = audioCtx.createGain();
            feedbackGain.gain.value = 0.3; 
            filterNode = audioCtx.createBiquadFilter();
            filterNode.type = 'lowpass';
            filterNode.frequency.value = 2000; 

            delayNode.connect(feedbackGain);
            feedbackGain.connect(filterNode);
            filterNode.connect(delayNode); 
            delayNode.connect(audioCtx.destination);
        }

        const BASE_FREQS = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88];
        const NOTE_NAMES = ['Do', 'Re', 'Mi', 'Fa', 'Sol', 'La', 'Ti'];
        const NOTE_COLORS = ['#ff4757', '#ff9f43', '#feca57', '#2ed573', '#00d2d3', '#5352ed', '#9b59b6'];

        let currentOctave = 0; 
        let currentNoteIndex = 0; 

        NOTE_NAMES.forEach((name, idx) => {
            let btn = document.createElement('button');
            btn.className = 'note-btn' + (idx === 0 ? ' selected' : '');
            btn.innerText = name;
            btn.style.color = NOTE_COLORS[idx];
            btn.onclick = () => {
                currentNoteIndex = idx;
                document.querySelectorAll('.note-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
            };
            noteButtonsContainer.appendChild(btn);
        });

        function setOctave(oct) {
            currentOctave = oct;
            document.querySelectorAll('.octave-btn').forEach(b => b.classList.remove('active'));
            if(oct === -1) document.getElementById('oct-low').classList.add('active');
            if(oct === 0) document.getElementById('oct-mid').classList.add('active');
            if(oct === 1) document.getElementById('oct-high').classList.add('active');
        }

        function getFrequency(noteIdx, octave) {
            let baseFreq = BASE_FREQS[noteIdx];
            if (octave === -1) return baseFreq / 2;
            if (octave === 1) return baseFreq * 2;
            return baseFreq;
        }

        function playNote(noteIdx, octave) {
            if (!audioCtx) initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            let freq = getFrequency(noteIdx, octave);
            let color = NOTE_COLORS[noteIdx];
            createSparks(ball.x, ball.y, color);

            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            osc1.type = 'sine'; osc1.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc2.type = 'triangle'; osc2.frequency.setValueAtTime(freq * 2, audioCtx.currentTime); 
            
            const gain = audioCtx.createGain();
            const osc2Gain = audioCtx.createGain();
            osc2Gain.gain.value = 0.1; 

            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8); 

            osc1.connect(gain); osc2.connect(osc2Gain); osc2Gain.connect(gain);
            gain.connect(audioCtx.destination); 
            gain.connect(delayNode); 

            osc1.start(); osc2.start();
            osc1.stop(audioCtx.currentTime + 1.0); osc2.stop(audioCtx.currentTime + 1.0);
        }

        // --- 2. 遊戲物件與相機 ---
        let plates = [];
        let isPlaying = false;
        let ball = { x: 100, y: 50, vx: 0, vy: 0, radius: 8, lastHitPlate: null, trail: [], isDead: false, deadTimer: 0 };
        let sparks = [];
        
        let emitter = { x: 100, y: 30, w: 40, h: 20 };
        let isDraggingEmitter = false;

        const GRAVITY = 0.25; 
        const PLATE_W = 80; 
        const PLATE_H = 16;
        const GRID_SIZE = 40; 

        // 【新增】相機 Y 軸偏移量
        let cameraY = 0;
        let targetCameraY = 0;

        // --- 🎵 核心：簡譜解析器 ---
        function buildTrackFromString(scoreStr) {
            plates = [];
            if (isPlaying) togglePlay();
            cameraY = 0; targetCameraY = 0; // 重置相機
            
            let cleanStr = scoreStr.replace(/[^0-9\+\-\,\s]/g, '');
            let tokens = cleanStr.split(/\s+/).filter(t => t.length > 0);
            
            if (tokens.length === 0) return alert("請輸入有效曲譜！");

            let startY = 100;
            let currentY = startY;
            let side = 1;

            tokens.forEach((token, i) => {
                if (token.includes(',')) {
                    currentY += 80; 
                    token = token.replace(/,/g, '');
                }

                if (token === '') return;

                let octave = 0;
                let noteChar = token[0];
                if (token.includes('+')) octave = 1;
                if (token.includes('-')) octave = -1;

                let noteIdx = parseInt(noteChar);
                if (isNaN(noteIdx) || noteIdx < 0 || noteIdx > 6) return; 

                if (i % 3 === 0) side *= -1;
                let xPos = W / 2 + (side * W / 4); 

                plates.push({
                    x: xPos - PLATE_W / 2,
                    y: currentY,
                    w: PLATE_W,
                    h: PLATE_H,
                    noteIndex: noteIdx,
                    octave: octave
                });

                currentY += 45; 
            });

            emitter.x = plates[0].x + PLATE_W / 2;
            ball.x = emitter.x; ball.y = emitter.y + 20;
            
            setTimeout(togglePlay, 100); 
        }

        // --- 預設歌曲 (完整版《凡星》) ---
        function loadFanXing() {
            // 加長版凡星 (包含前奏、主歌、副歌)
            let score = 
                // 前奏
                "4 5 0+ 5 4 2, 3 4 5 4 2 1, " +
                // 主歌
                "0 1 2 3 4 2, 0 1 2 3 2 1, 0 1 2 3 4 5, 4 3 2 1 0, " +
                // 副歌「大概這就叫作 凡星在漆黑中拼命發光」
                "4 4 5 0+ 5, 4 2 2 4 5 4 2, 1 1 2 4 2, 1 0 0 1 2 1 0, " +
                // 副歌重複
                "4 4 5 0+ 5, 4 2 2 4 5 4 2, 1 1 2 4 2, 1 0 0 1 2 1 0";
            buildTrackFromString(score);
        }

        function importScore() {
            let msg = "請輸入簡譜 (數字 0-6 代表 Do-Si)：\n" +
                      "• 用空格隔開每個音\n" +
                      "• 加逗號 , 代表延長/停頓\n" +
                      "• 加 + 代表高音，加 - 代表低音\n\n" +
                      "例子 (生日快樂)：\n" +
                      "4 4 5 4 0+ 6, 4 4 5 4 1+ 0+";
            
            let input = prompt(msg, "4 4 5 4 0+ 6, 4 4 5 4 1+ 0+");
            if (input) buildTrackFromString(input);
        }

        // --- 3. 互動控制 ---
        let dragPlate = null;
        let pressTimer = null;
        let isDraggingPlate = false;
        let startX, startY, initialX, initialY;
        let hoverPos = null; 

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            let cx = e.clientX || (e.touches && e.touches[0].clientX);
            let cy = e.clientY || (e.touches && e.touches[0].clientY);
            return { x: cx - rect.left, y: cy - rect.top };
        }

        function handleDown(e) {
            if (e.cancelable) e.preventDefault();
            initAudio(); 
            
            const pos = getPos(e);
            // 將螢幕座標轉換為世界座標
            let worldY = pos.y + cameraY; 

            if (pos.y < emitter.y + 40 && Math.abs(pos.x - emitter.x) < 40) {
                isDraggingEmitter = true;
                return;
            }

            let clickedPlate = null;
            for (let i = plates.length - 1; i >= 0; i--) {
                let p = plates[i];
                if (pos.x > p.x - 15 && pos.x < p.x + p.w + 15 && worldY > p.y - 15 && worldY < p.y + p.h + 15) {
                    clickedPlate = p; break;
                }
            }

            if (clickedPlate) {
                pressTimer = setTimeout(() => {
                    plates = plates.filter(p => p !== clickedPlate);
                    pressTimer = null;
                }, 600); 
                
                dragPlate = clickedPlate;
                isDraggingPlate = false;
                startX = pos.x; startY = worldY;
                initialX = clickedPlate.x; initialY = clickedPlate.y;
            } else {
                let alignX = Math.round(pos.x / GRID_SIZE) * GRID_SIZE;
                let alignY = Math.round(worldY / GRID_SIZE) * GRID_SIZE;

                let newPlate = {
                    x: Math.max(0, Math.min(W - PLATE_W, alignX - PLATE_W/2)), 
                    y: Math.max(emitter.y + 60, alignY - PLATE_H/2),
                    w: PLATE_W, h: PLATE_H, 
                    noteIndex: currentNoteIndex,
                    octave: currentOctave
                };
                plates.push(newPlate);
                playPreviewNote(currentNoteIndex, currentOctave);
            }
        }

        function handleMove(e) {
            if (e.cancelable) e.preventDefault();
            const pos = getPos(e);
            let worldY = pos.y + cameraY;
            hoverPos = { x: pos.x, y: worldY };

            if (isDraggingEmitter) {
                emitter.x = Math.max(20, Math.min(W - 20, pos.x));
                if (!isPlaying) { ball.x = emitter.x; ball.y = emitter.y + 20; }
                return;
            }

            if (!dragPlate) return;
            let dx = pos.x - startX;
            let dy = worldY - startY;
            if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                isDraggingPlate = true;
                clearTimeout(pressTimer);
            }
            if (isDraggingPlate) {
                dragPlate.x = Math.max(0, Math.min(W - dragPlate.w, initialX + dx));
                dragPlate.y = Math.max(emitter.y + 60, initialY + dy);
            }
        }

        function handleUp(e) {
            if (isDraggingEmitter) { isDraggingEmitter = false; return; }
            hoverPos = null;
            
            if (pressTimer) {
                clearTimeout(pressTimer);
                pressTimer = null;
                if (!isDraggingPlate && dragPlate) {
                    dragPlate.noteIndex = (dragPlate.noteIndex + 1) % 7;
                    playPreviewNote(dragPlate.noteIndex, dragPlate.octave);
                }
            }
            dragPlate = null;
            isDraggingPlate = false;
        }

        canvas.addEventListener('mousedown', handleDown);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleUp);
        canvas.addEventListener('touchstart', handleDown, {passive: false});
        window.addEventListener('touchmove', handleMove, {passive: false});
        window.addEventListener('touchend', handleUp);

        function playPreviewNote(idx, oct) {
            if (!audioCtx) initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let freq = getFrequency(idx, oct);
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }

        // --- 4. 其他功能 ---
        function clearAll() { 
            if(confirm("確定清空所有音符？")) { 
                plates = []; 
                if(isPlaying) togglePlay(); 
                ball.isDead = true;
                ball.trail = [];
                ball.x = emitter.x; ball.y = emitter.y + 20;
                cameraY = 0; targetCameraY = 0;
            } 
        }
        
        function shareTrack() {
            if (plates.length === 0) return alert("請先放置鋼片！");
            let minified = plates.map(p => [Math.round(p.x), Math.round(p.y), p.noteIndex, p.octave]);
            let encoded = btoa(encodeURIComponent(JSON.stringify(minified)));
            let url = window.location.href.split('?')[0] + '?track=' + encoded;
            navigator.clipboard.writeText(url).then(() => alert("已複製分享連結！")).catch(() => prompt("複製連結：", url));
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            if (isPlaying) {
                playBtn.innerText = "⏸ 暫停"; playBtn.classList.add('active');
                if (!audioCtx) initAudio();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                if (plates.length > 0) {
                    let topPlate = plates.reduce((prev, curr) => (prev.y < curr.y) ? prev : curr);
                    emitter.x = topPlate.x + topPlate.w / 2;
                }
                
                ball.x = emitter.x; ball.y = emitter.y + 20; ball.vx = 0; ball.vy = 0;
                ball.lastHitPlate = null;
                ball.trail = [];
                ball.isDead = false;
                cameraY = 0; targetCameraY = 0; // 重播時鏡頭返頂部
            } else {
                playBtn.innerText = "▶ 播放"; playBtn.classList.remove('active');
            }
        }

        // --- 5. 物理與碰撞優化 ---
        function createSparks(x, y, color) {
            for(let i=0; i<15; i++) sparks.push({ 
                x: x, y: y, 
                vx: (Math.random() - 0.5) * 8, 
                vy: (Math.random() - 0.5) * 8 - 2, 
                life: 1, color: color,
                size: Math.random() * 3 + 1
            });
        }

        function update() {
            for(let i = sparks.length - 1; i >= 0; i--) {
                let s = sparks[i]; 
                s.x += s.vx; s.y += s.vy; s.vy += 0.2; s.life -= 0.04;
                if(s.life <= 0) sparks.splice(i, 1);
            }

            if (!isPlaying) return;

            if (ball.isDead) {
                if (Date.now() - ball.deadTimer > 1500) {
                    // 死亡後重生
                    ball.x = emitter.x; ball.y = emitter.y + 20; ball.vx = 0; ball.vy = 0;
                    ball.lastHitPlate = null; 
                    ball.trail = [];
                    ball.isDead = false;
                    cameraY = 0; targetCameraY = 0;
                } else {
                    return; 
                }
            }

            ball.vy += GRAVITY;
            ball.x += ball.vx;
            ball.y += ball.vy;
            
            ball.trail.push({x: ball.x, y: ball.y});
            if(ball.trail.length > 10) ball.trail.shift();
            
            if (ball.x < 10) { ball.x = 10; ball.vx *= -0.8; }
            if (ball.x > W - 10) { ball.x = W - 10; ball.vx *= -0.8; }

            for (let p of plates) {
                if (p === ball.lastHitPlate) continue; 

                if (ball.vy > 0 && 
                    ball.y + ball.radius >= p.y && 
                    ball.y - ball.radius <= p.y + p.h) {
                    
                    if (ball.x + ball.radius > p.x && ball.x - ball.radius < p.x + p.w) {
                        
                        ball.y = p.y - ball.radius;
                        ball.lastHitPlate = p; 
                        
                        let nextPlate = null;
                        let minDy = Infinity;
                        
                        for(let target of plates) {
                            if (target === p) continue;
                            if (target.y > p.y) {
                                let dy = target.y - p.y;
                                if (dy < minDy) {
                                    minDy = dy;
                                    nextPlate = target;
                                }
                            }
                        }

                        if (nextPlate) {
                            let targetX = nextPlate.x + nextPlate.w / 2;
                            let targetY = nextPlate.y;
                            let dx = targetX - ball.x;
                            let dy = targetY - ball.y;
                            
                            let t = Math.max(25, Math.min(70, minDy * 0.7));
                            ball.vy = (dy - 0.5 * GRAVITY * t * t) / t;
                            ball.vx = dx / t;
                            
                        } else {
                            ball.vy = -4;
                            let direction = (ball.x - p.x) < (p.w / 2) ? 1 : -1;
                            ball.vx = direction * 3;
                        }
                        
                        playNote(p.noteIndex, p.octave);
                    }
                }
            }

            // 【核心】相機跟隨計算
            // 確保鏡頭不會高過頂部 (0)，並讓鐵珠保持在畫面偏下方
            targetCameraY = Math.max(0, ball.y - H * 0.6);
            cameraY += (targetCameraY - cameraY) * 0.1; // 平滑跟隨

            if (ball.y > H + 50 + cameraY) {
                ball.isDead = true;
                ball.deadTimer = Date.now();
                ball.vx = 0; ball.vy = 0;
            }
        }

        // --- 6. 渲染繪製 ---
        function draw() {
            ctx.clearRect(0, 0, W, H);
            let bgGrd = ctx.createRadialGradient(W/2, H/2, 50, W/2, H/2, Math.max(W,H));
            bgGrd.addColorStop(0, '#0a0a1a');
            bgGrd.addColorStop(1, '#050510');
            ctx.fillStyle = bgGrd; 
            ctx.fillRect(0, 0, W, H);

            ctx.save();
            // 應用相機偏移
            ctx.translate(0, -cameraY);

            // 繪製網格 (動態延伸)
            ctx.strokeStyle = 'rgba(0, 210, 211, 0.08)'; ctx.lineWidth = 1;
            let startY = Math.floor(cameraY / GRID_SIZE) * GRID_SIZE;
            let endY = cameraY + H + GRID_SIZE;
            for (let i = 0; i < W; i += GRID_SIZE) { 
                ctx.beginPath(); ctx.moveTo(i, startY); ctx.lineTo(i, endY); ctx.stroke(); 
            }
            for (let i = startY; i < endY; i += GRID_SIZE) { 
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(W, i); ctx.stroke(); 
            }

            // 發射器 (只在頂部可見)
            ctx.fillStyle = '#111';
            ctx.fillRect(emitter.x - emitter.w/2, emitter.y, emitter.w, emitter.h);
            ctx.strokeStyle = '#ff4757'; ctx.lineWidth = 2;
            ctx.shadowBlur = 10; ctx.shadowColor = '#ff4757';
            ctx.strokeRect(emitter.x - emitter.w/2, emitter.y, emitter.w, emitter.h);
            ctx.shadowBlur = 0;
            
            // 繪製鋼片 (只畫相機可見範圍，優化效能)
            for (let p of plates) {
                if (p.y + p.h < cameraY - 50 || p.y > cameraY + H + 50) continue; // 剔除畫面外

                let color = NOTE_COLORS[p.noteIndex];
                if (p.octave === -1) color = '#818cf8'; 
                if (p.octave === 1) color = '#f472b6'; 

                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(p.x + 2, p.y + 2, p.w, p.h);

                let grd = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
                grd.addColorStop(0, color);
                grd.addColorStop(1, 'rgba(0,0,0,0.5)');
                
                ctx.shadowBlur = 15; ctx.shadowColor = color; 
                ctx.fillStyle = grd;
                
                ctx.beginPath();
                if(ctx.roundRect) ctx.roundRect(p.x, p.y, p.w, p.h, 5);
                else ctx.rect(p.x, p.y, p.w, p.h);
                ctx.fill();
                
                ctx.shadowBlur = 0; 
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
                ctx.stroke();

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 12px "Orbitron", sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(NOTE_NAMES[p.noteIndex], p.x + p.w/2, p.y + 13);
            }

            // 預覽 (世界座標)
            if(hoverPos && !dragPlate && !isDraggingEmitter && hoverPos.y > emitter.y + 60) {
                let alignX = Math.round(hoverPos.x / GRID_SIZE) * GRID_SIZE;
                let alignY = Math.round(hoverPos.y / GRID_SIZE) * GRID_SIZE;
                
                ctx.globalAlpha = 0.3;
                ctx.fillStyle = NOTE_COLORS[currentNoteIndex];
                ctx.beginPath();
                if(ctx.roundRect) ctx.roundRect(alignX - PLATE_W/2, alignY - PLATE_H/2, PLATE_W, PLATE_H, 5);
                else ctx.rect(alignX - PLATE_W/2, alignY - PLATE_H/2, PLATE_W, PLATE_H);
                ctx.fill();
                ctx.globalAlpha = 1;
            }

            // 火花
            for(let s of sparks) {
                ctx.globalAlpha = s.life; ctx.fillStyle = s.color;
                ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill();
            }
            ctx.globalAlpha = 1;

            // 鐵珠尾跡
            for(let i=0; i<ball.trail.length; i++) {
                let t = ball.trail[i];
                ctx.globalAlpha = (i / ball.trail.length) * 0.5;
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(t.x, t.y, ball.radius * (i/ball.trail.length), 0, Math.PI * 2); ctx.fill();
            }
            ctx.globalAlpha = 1;

            // 鐵珠
            if (!ball.isDead && ball.y < cameraY + H + 50) {
                ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#fff'; ctx.shadowBlur = 20; ctx.shadowColor = '#fff'; ctx.fill(); ctx.shadowBlur = 0;
                
                ctx.beginPath(); ctx.arc(ball.x - 2, ball.y - 2, ball.radius * 0.4, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fill();
            }

            ctx.restore(); // 恢復相機狀態
        }

        // --- 7. 主循環 ---
        function loop() { 
            update(); 
            draw(); 
            requestAnimationFrame(loop); 
        }
        loop();
    </script>
</body>
</html>
