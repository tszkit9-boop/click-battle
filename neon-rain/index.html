<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>☔ 霓虹雨夜：考牌大師</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+HK:wght@700;900&display=swap');
    
    :root {
        --neon-blue: #00d2d3;
        --neon-pink: #ff0055;
        --neon-gold: #ffd32a;
        --bg-dark: #0a0a14;
        --glass-bg: rgba(15, 15, 25, 0.8);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
    
    body {
        background: var(--bg-dark); color: #fff; font-family: 'Noto Sans HK', sans-serif;
        height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
    }

    /* 返回大廳 */
    .back-btn {
        position: fixed; top: 15px; left: 15px; z-index: 99999;
        padding: 8px 16px; background: rgba(10,10,20,0.85); color: var(--neon-blue);
        border: 2px solid var(--neon-blue); border-radius: 8px; text-decoration: none;
        font-weight: bold; font-size: 14px; box-shadow: 0 0 10px rgba(0,210,211,0.5); transition: 0.2s;
        font-family: 'Orbitron', sans-serif;
    }
    .back-btn:active { transform: scale(0.95); background: var(--neon-blue); color: #000; }

    /* HUD */
    #hud {
        height: 60px; background: var(--glass-bg); backdrop-filter: blur(10px);
        border-bottom: 2px solid var(--neon-gold);
        display: flex; align-items: center; justify-content: space-between; 
        padding: 0 15px 0 140px; 
        z-index: 10; flex-shrink: 0; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .stat-group { display: flex; gap: 15px; }
    .stat-box { display: flex; flex-direction: column; text-align: left; }
    .stat-label { font-size: 10px; color: #aaa; letter-spacing: 1px; }
    .stat-val { font-size: 18px; font-weight: 900; color: var(--neon-gold); font-family: 'Orbitron', sans-serif; text-shadow: 0 0 10px var(--neon-gold); }
    .stat-val.hp { color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink); }
    
    .hud-right { display: flex; gap: 8px; align-items: center; }
    .icon-btn {
        width: 34px; height: 34px; background: rgba(255,255,255,0.1); border: 1px solid #555;
        border-radius: 8px; color: #fff; font-size: 16px; cursor: pointer;
        display: flex; align-items: center; justify-content: center; transition: 0.15s;
    }
    .icon-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.3); }

    /* 畫布 */
    #game-container { flex: 1; position: relative; overflow: hidden; background: #2a3b4c; }
    canvas { display: block; width: 100%; height: 100%; }

    /* 天氣狀態 */
    #weather-status {
        position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
        font-size: 13px; font-weight: bold; padding: 4px 12px; border-radius: 20px;
        background: rgba(0,210,211,0.2); color: var(--neon-blue); border: 1px solid var(--neon-blue);
        transition: 0.3s; z-index: 5; pointer-events: none; backdrop-filter: blur(4px);
        white-space: nowrap;
    }
    #weather-status.rain { background: rgba(255,0,85,0.2); color: var(--neon-pink); border-color: var(--neon-pink); box-shadow: 0 0 20px rgba(255,0,85,0.5); }

    /* 考牌官彈幕 */
    #examiner-bubble {
        position: absolute; top: 60px; left: 50%; transform: translate(-50%, 0) scale(0.8);
        background: #fff; color: #000; padding: 8px 16px; border-radius: 15px;
        font-weight: 900; font-size: 14px; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        opacity: 0; transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none; z-index: 50; white-space: nowrap;
    }
    #examiner-bubble.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
    #examiner-bubble::after {
        content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
        border-width: 8px 8px 0; border-style: solid; border-color: #fff transparent transparent transparent;
    }

    /* 🐛 底部三粒控制掣：改為居中緊密排列 */
    #controls {
        height: 90px; background: rgba(10,10,20,0.95); border-top: 2px solid #333;
        display: flex; justify-content: center; align-items: center; gap: 40px; /* 加入 gap 控制間距 */
        z-index: 20; flex-shrink: 0; box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
    }
    
    .control-btn {
        width: 70px; height: 70px; border-radius: 50%; background: rgba(255,255,255,0.1);
        border: 2px solid #555; color: #fff; font-size: 30px; 
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; box-shadow: 0 4px 0 #111; transition: 0.1s;
    }
    .control-btn:active { transform: translateY(4px); box-shadow: none; background: rgba(255,255,255,0.3); }
    
    /* 中間開遮掣 */
    #umbrella-btn {
        width: 80px; height: 80px; font-size: 38px;
        background: rgba(255, 211, 42, 0.2); border: 3px solid var(--neon-gold); color: var(--neon-gold);
        box-shadow: 0 0 20px rgba(255,211,42,0.3);
    }
    #umbrella-btn.active {
        background: var(--neon-gold); color: #000; border-color: var(--neon-gold);
        box-shadow: 0 0 30px var(--neon-gold); transform: scale(0.95);
    }

    /* 連擊提示 */
    #combo-toast {
        position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0);
        font-family: 'Orbitron', sans-serif; font-size: 40px; font-weight: 900;
        color: var(--neon-gold); text-shadow: 0 0 20px var(--neon-gold), 0 0 40px var(--neon-gold);
        z-index: 50; pointer-events: none; transition: 0.2s; opacity: 0;
    }
    #combo-toast.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }

    /* 彈窗 */
    .modal {
        position: absolute; inset: 0; background: rgba(0,0,0,0.85); z-index: 100;
        display: none; flex-direction: column; align-items: center; justify-content: center;
        backdrop-filter: blur(8px);
    }
    .modal.active { display: flex; }
    .modal-box {
        background: linear-gradient(135deg, #1e1e2f, #0a0a10); border: 3px solid var(--neon-pink); border-radius: 20px;
        padding: 25px 20px; text-align: center; max-width: 320px; width: 90%;
        box-shadow: 0 0 60px rgba(255,0,85,0.4);
    }
    .modal-box h2 { color: var(--neon-pink); font-size: 24px; margin-bottom: 15px; font-family: 'Orbitron', sans-serif; text-shadow: 0 0 10px var(--neon-pink); }
    .modal-box p { color: #ccc; font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
    
    .action-btn {
        width: 100%; padding: 12px; border: none; border-radius: 10px;
        background: linear-gradient(180deg, #ff4757, #c0392b); color: #fff; font-weight: 900; font-size: 16px;
        cursor: pointer; font-family: 'Noto Sans HK', sans-serif; box-shadow: 0 4px 0 #7b241c; transition: 0.1s;
    }
    .action-btn:active { transform: translateY(4px); box-shadow: none; }

    /* 📱 手機版面完美適配 */
    @media (max-width: 600px) {
        .back-btn { top: 8px; left: 8px; padding: 5px 10px; font-size: 11px; }
        #hud { height: 50px; padding: 0 8px 0 115px; }
        .stat-group { gap: 10px; }
        .stat-label { font-size: 9px; }
        .stat-val { font-size: 14px; }
        .stat-box:nth-child(3) { display: none; } 
        .hud-right { gap: 5px; }
        .icon-btn { width: 28px; height: 28px; font-size: 14px; }
        
        #weather-status { font-size: 11px; padding: 3px 10px; top: 8px; }
        #examiner-bubble { top: 45px; font-size: 12px; padding: 6px 12px; }
        
        /* 手機版間距縮細 */
        #controls { height: 80px; gap: 20px; }
        .control-btn { width: 60px; height: 60px; font-size: 26px; }
        #umbrella-btn { width: 70px; height: 70px; font-size: 32px; }
    }
    
    @media (max-height: 500px) {
        #hud { height: 40px; padding: 0 8px 0 100px; }
        .stat-val { font-size: 13px; }
        #weather-status { top: 5px; }
        #examiner-bubble { top: 35px; }
        #controls { height: 70px; gap: 15px; }
        .control-btn { width: 55px; height: 55px; font-size: 24px; }
        #umbrella-btn { width: 65px; height: 65px; font-size: 30px; }
    }
</style>
</head>
<body>

    <a href="../" class="back-btn">⬅ 返回大廳</a>

    <div id="hud">
        <div class="stat-group">
            <div class="stat-box"><span class="stat-label">考牌分數</span><span class="stat-val hp" id="ui-score">100</span></div>
            <div class="stat-box"><span class="stat-label">行車距離</span><span class="stat-val" id="ui-distance">0m</span></div>
            <div class="stat-box"><span class="stat-label">最高紀錄</span><span class="stat-val" id="ui-best" style="color:#ff9f43;">0m</span></div>
        </div>
        <div class="hud-right">
            <button class="icon-btn" id="btn-sound">🔊</button>
            <button class="icon-btn" id="btn-pause">⏸️</button>
        </div>
    </div>

    <div id="game-container">
        <div id="weather-status">☀️ 天晴</div>
        <canvas id="gameCanvas"></canvas>
        <div id="examiner-bubble">行快啲啦！</div>
        <div id="combo-toast"></div>
        
        <div id="game-over-modal" class="modal">
            <div class="modal-box">
                <h2 id="go-title">❌ 考牌肥佬！</h2>
                <p id="go-desc">你撞到人，考官即刻踩停你！</p>
                <button class="action-btn" onclick="startGame()">🔄 重新補考</button>
            </div>
        </div>

        <div id="pause-modal" class="modal">
            <div class="modal-box" style="border-color: var(--neon-blue);">
                <h2 style="color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue);">⏸️ 暫停中</h2>
                <p>考牌官去咗洗手間...</p>
                <button class="action-btn" style="background: linear-gradient(180deg, #00d2d3, #008b8b); box-shadow: 0 4px 0 #004d4d;" onclick="togglePause()">繼續考試</button>
            </div>
        </div>
    </div>

    <!-- 底部三粒掣 -->
    <div id="controls">
        <button class="control-btn" id="btn-left">◀</button>
        <button class="control-btn" id="umbrella-btn">🌂</button>
        <button class="control-btn" id="btn-right">▶</button>
    </div>

<script>
    window.onerror = function(msg) { console.warn("防呆跳過：", msg); return true; };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const uiScore = document.getElementById('ui-score');
    const uiDistance = document.getElementById('ui-distance');
    const uiBest = document.getElementById('ui-best');
    const weatherStatus = document.getElementById('weather-status');
    const umbrellaBtn = document.getElementById('umbrella-btn');
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');
    const examinerBubble = document.getElementById('examiner-bubble');
    const comboToast = document.getElementById('combo-toast');
    const btnSound = document.getElementById('btn-sound');
    
    // 音效系統
    let audioCtx = null;
    let soundOn = localStorage.getItem('neon_rain_sound') !== 'off';
    btnSound.innerText = soundOn ? '🔊' : '🔇';

    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    document.body.addEventListener('pointerdown', initAudio, { once: true });

    function playSound(type) {
        if (!soundOn || !audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            
            if (type === 'coin') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'hit') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'umbrella') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            }
        } catch(e) {}
    }

    btnSound.addEventListener('click', () => {
        soundOn = !soundOn;
        localStorage.setItem('neon_rain_sound', soundOn ? 'on' : 'off');
        btnSound.innerText = soundOn ? '🔊' : '🔇';
    });

    // 遊戲狀態
    let state = 'playing';
    let isPaused = false;
    let score = 100;
    let distance = 0;
    let bestDistance = parseInt(localStorage.getItem('neon_rain_best') || '0');
    uiBest.innerText = bestDistance + 'm';

    let isRaining = false;
    let isUmbrellaOpen = false;
    let gameTime = 0;
    let baseWalkSpeed = 2.0; 

    let combo = 0;
    let comboTimer = 0;

    // 玩家
    let player = { x: window.innerWidth / 2, y: 0, radius: 12, tilt: 0 };
    
    // 移動狀態
    let isMovingLeft = false;
    let isMovingRight = false;

    const quotes = {
        normal: ["行快啲啦！", "睇路呀！", "唔好撞到人啊！", "保持直線行啦！"],
        rain: ["落雨啦！還唔擔遮？", "擔遮啦！淋病你啊！", "你冇遮㗎？", "落雨擔遮好正常喎！"],
        umbrella_sunny: ["好天擔遮？你覺得好型？", "收遮啦！阻住地球轉！", "大晴人擔遮，你有事嗎？"],
        hit: ["撞到人啦！扣分！", "你盲㗎？", "睇住阿婆呀！", "行開啦！"],
        combo: ["好嘢！Keep going！", "連擊！勁揪！", "神級走位！"]
    };

    function showQuote(type) {
        let arr = quotes[type];
        let quote = arr[Math.floor(Math.random() * arr.length)];
        examinerBubble.innerText = quote;
        examinerBubble.classList.add('show');
        setTimeout(() => examinerBubble.classList.remove('show'), 1500);
    }

    function resize() {
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        
        if (player.y === 0) player.y = canvas.height - 60;
        
        if (player.x < 20) player.x = 20;
        if (player.x > canvas.width - 20) player.x = canvas.width - 20;
        if (player.y < 20) player.y = 20;
        if (player.y > canvas.height - 20) player.y = canvas.height - 20;
    }
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', () => setTimeout(resize, 100));

    // 左移按鈕
    btnLeft.addEventListener('pointerdown', (e) => { e.preventDefault(); isMovingLeft = true; });
    btnLeft.addEventListener('pointerup', (e) => { e.preventDefault(); isMovingLeft = false; });
    btnLeft.addEventListener('pointercancel', () => { isMovingLeft = false; });
    btnLeft.addEventListener('pointerleave', () => { isMovingLeft = false; });

    // 右移按鈕
    btnRight.addEventListener('pointerdown', (e) => { e.preventDefault(); isMovingRight = true; });
    btnRight.addEventListener('pointerup', (e) => { e.preventDefault(); isMovingRight = false; });
    btnRight.addEventListener('pointercancel', () => { isMovingRight = false; });
    btnRight.addEventListener('pointerleave', () => { isMovingRight = false; });

    // 開遮 / 收遮
    umbrellaBtn.addEventListener('click', (e) => {
        e.preventDefault();
        if (isPaused || state !== 'playing') return;
        
        isUmbrellaOpen = !isUmbrellaOpen;
        
        if (isUmbrellaOpen) {
            umbrellaBtn.classList.add('active');
            umbrellaBtn.innerText = '☔';
            playSound('umbrella');
            if (!isRaining) showQuote('umbrella_sunny');
        } else {
            umbrellaBtn.classList.remove('active');
            umbrellaBtn.innerText = '🌂';
            playSound('umbrella');
        }
    });

    let pedestrians = [];
    let coins = [];
    let particles = [];
    let spawnTimer = 0;

    function startGame() {
        document.getElementById('game-over-modal').classList.remove('active');
        document.getElementById('pause-modal').classList.remove('active');
        state = 'playing'; isPaused = false;
        score = 100; distance = 0;
        isRaining = false; isUmbrellaOpen = false;
        umbrellaBtn.classList.remove('active');
        umbrellaBtn.innerText = '🌂';
        weatherStatus.className = '';
        weatherStatus.innerText = '☀️ 天晴';
        pedestrians = []; coins = []; particles = [];
        gameTime = 0; combo = 0; comboTimer = 0;
        isMovingLeft = false; isMovingRight = false;
        
        resize();
        player.x = canvas.width / 2; player.y = canvas.height - 60;
        player.tilt = 0;
        
        updateUI();
        showQuote('normal');
        
        if (!window.isLooping) {
            window.isLooping = true;
            requestAnimationFrame(update);
        }
    }

    function gameOver(reason) {
        if (state !== 'playing') return;
        state = 'gameover';
        if (Math.floor(distance) > bestDistance) {
            bestDistance = Math.floor(distance);
            localStorage.setItem('neon_rain_best', bestDistance);
            uiBest.innerText = bestDistance + 'm';
        }
        document.getElementById('go-desc').innerText = reason + `\n你行咗 ${Math.floor(distance)} 米。`;
        document.getElementById('game-over-modal').classList.add('active');
        playSound('hit');
    }

    function updateUI() {
        uiScore.innerText = Math.max(0, Math.floor(score));
        uiDistance.innerText = Math.floor(distance) + 'm';
    }

    function togglePause() {
        if (state !== 'playing') return;
        isPaused = !isPaused;
        document.getElementById('pause-modal').classList.toggle('active', isPaused);
        document.getElementById('btn-pause').innerText = isPaused ? '▶️' : '⏸️';
    }
    document.getElementById('btn-pause').addEventListener('click', togglePause);

    function createParticle(x, y, color, isSplash) {
        for (let i = 0; i < 5; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 3, 
                vy: (Math.random() - 0.5) * 3 - (isSplash ? 1.5 : 0),
                life: 1, color: color
            });
        }
    }

    function update() {
        requestAnimationFrame(update);
        if (state !== 'playing' || isPaused) return;
        
        gameTime++;
        distance += 0.05;

        // 天氣系統
        if (!isRaining && gameTime > 400 && Math.random() < 0.008) {
            isRaining = true;
            weatherStatus.className = 'rain';
            weatherStatus.innerText = '🌧️ 暴雨';
            showQuote('rain');
        } else if (isRaining && Math.random() < 0.003 && gameTime > 700) {
            isRaining = false;
            weatherStatus.className = '';
            weatherStatus.innerText = '☀️ 天晴';
        }

        // 扣分邏輯
        if (isRaining && !isUmbrellaOpen) {
            if (gameTime % 60 === 0) score -= 2; 
            if (gameTime % 5 === 0) createParticle(player.x, player.y, '#00d2d3', true);
        } else if (!isRaining && isUmbrellaOpen) {
            if (gameTime % 90 === 0) score -= 1;
        }

        if (score <= 0) gameOver("你淋雨淋到病咗，考官幫你叫白車。");

        // 玩家左右移動
        let currentSpeed = baseWalkSpeed;
        if (isUmbrellaOpen) currentSpeed = 1.5; 
        if (isRaining && !isUmbrellaOpen) currentSpeed = 2.5;

        let dx = 0;
        if (isMovingLeft) dx -= currentSpeed;
        if (isMovingRight) dx += currentSpeed;

        if (dx !== 0) {
            player.x += dx;
            let targetTilt = dx > 0 ? 0.5 : -0.5;
            player.tilt += (targetTilt - player.tilt) * 0.15;
            if (gameTime % 15 === 0) createParticle(player.x, player.y + 10, '#fff', false);
        } else {
            player.tilt += (0 - player.tilt) * 0.15;
        }

        if (player.x < 20) player.x = 20;
        if (player.x > canvas.width - 20) player.x = canvas.width - 20;

        if (combo > 0) {
            comboTimer--;
            if (comboTimer <= 0) { combo = 0; }
        }

        // 生成路人
        spawnTimer++;
        let spawnRate = Math.max(50, 100 - Math.floor(distance / 20)); 
        if (spawnTimer > spawnRate) {
            spawnTimer = 0;
            let r = Math.random();
            if (r < 0.7) spawnPedestrian();
            else if (r < 0.9) spawnCoin();
        }

        // 路人更新
        for (let i = pedestrians.length - 1; i >= 0; i--) {
            let p = pedestrians[i];
            p.y += baseWalkSpeed + (distance / 2000);
            p.x += p.vx;

            if (p.y > canvas.height + 50) { pedestrians.splice(i, 1); continue; }

            if (Math.hypot(player.x - p.x, player.y - p.y) < player.radius + p.radius) {
                score -= 10;
                combo = 0;
                createParticle(p.x, p.y, '#ff4757', true);
                pedestrians.splice(i, 1);
                playSound('hit');
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                showQuote('hit');
                if (score <= 0) gameOver("你連環撞到人，考官即刻踩停你！");
            }
        }

        // 金幣
        for (let i = coins.length - 1; i >= 0; i--) {
            let c = coins[i];
            c.y += baseWalkSpeed;
            if (c.y > canvas.height + 50) { coins.splice(i, 1); continue; }
            if (Math.hypot(player.x - c.x, player.y - c.y) < player.radius + 10) {
                score += 15; 
                combo++;
                comboTimer = 150;
                createParticle(c.x, c.y, '#ffd32a', false);
                coins.splice(i, 1);
                playSound('coin');
                if (combo >= 3) {
                    comboToast.innerText = `COMBO x${combo}!`;
                    comboToast.classList.add('show');
                    setTimeout(() => comboToast.classList.remove('show'), 500);
                    playSound('umbrella');
                    showQuote('combo');
                }
            }
        }

        // 粒子
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy;
            p.life -= 0.04;
            if (p.life <= 0) particles.splice(i, 1);
        }

        updateUI();
        draw();
    }

    function spawnPedestrian() {
        let colors = ['#e74c3c', '#3498db', '#9b59b6', '#1abc9c', '#f1c40f', '#e67e22'];
        pedestrians.push({
            x: Math.random() * (canvas.width - 40) + 20,
            y: -30,
            vx: (Math.random() - 0.5) * 1.0,
            speed: 1,
            radius: 10,
            color: colors[Math.floor(Math.random() * colors.length)]
        });
    }

    function spawnCoin() {
        coins.push({
            x: Math.random() * (canvas.width - 40) + 20,
            y: -30, radius: 8
        });
    }

    function draw() {
        let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, '#2a3b4c'); 
        grad.addColorStop(1, '#111a24'); 
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)'; 
        ctx.lineWidth = 1;
        for (let i = 0; i < canvas.width; i += 40) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
        }
        for (let j = 0; j < canvas.height; j += 40) {
            ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
        }

        // 畫金幣
        coins.forEach(c => {
            ctx.fillStyle = '#ffd32a';
            ctx.shadowBlur = 15; ctx.shadowColor = '#ffd32a';
            ctx.beginPath(); ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(c.x - 3, c.y - 3, 3, 0, Math.PI * 2); ctx.fill();
        });

        // 畫路人
        pedestrians.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.shadowBlur = 10; ctx.shadowColor = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.beginPath(); ctx.arc(p.x, p.y, p.radius - 3, 0, Math.PI * 2); ctx.fill();
        });

        // 畫玩家同把遮
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(player.x, player.y + 12, 10, 4, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.font = "28px Arial";
        ctx.fillText("🚶", player.x, player.y);

        if (isUmbrellaOpen) {
            ctx.save();
            ctx.translate(player.x, player.y - 15);
            ctx.rotate(player.tilt);

            ctx.fillStyle = 'rgba(255, 211, 42, 0.95)';
            ctx.shadowBlur = 20; ctx.shadowColor = '#ffd32a';
            ctx.beginPath();
            ctx.arc(0, 0, 35, Math.PI, 0);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 22); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-24, 10); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(24, 10); ctx.stroke();

            ctx.restore();
        }

        // 粒子
        particles.forEach(p => {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill();
            ctx.globalAlpha = 1;
        });

        // 落雨
        if (isRaining) {
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i < 60; i++) {
                let rx = Math.random() * canvas.width;
                let ry = Math.random() * canvas.height;
                ctx.moveTo(rx, ry);
                ctx.lineTo(rx - 5, ry + 25);
            }
            ctx.stroke();
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
    }

    // 啟動
    resize();
    startGame();
    requestAnimationFrame(update);

</script>

<!-- 🟢 Firebase 在線統計 (標準三件套) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
    try {
        const firebaseConfig = { databaseURL: "https://maze-leaderboard-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        let userId = localStorage.getItem('global_device_id');
        if (!userId) {
            userId = 'user_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('global_device_id', userId);
        }
        
        let pathParts = window.location.pathname.split('/').filter(p => p && p !== 'index.html');
        let gameId = pathParts[pathParts.length - 1] || 'unknown'; 
        const userStatusRef = db.ref('online_status/' + gameId + '/' + userId);
        
        db.ref('.info/connected').on('value', (snap) => {
            if (snap.val() === true) {
                userStatusRef.onDisconnect().remove();
                userStatusRef.set(true);
            }
        });
    } catch(e) { console.error("Firebase Error:", e); }
</script>
