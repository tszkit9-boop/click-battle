<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>社畜人生</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;700;900&display=swap');
    
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    
    body {
        background-color: #050510; color: #fff; font-family: 'Noto Sans HK', sans-serif;
        height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
        background: radial-gradient(circle at center, #1a1a2e, #050510);
    }

    .back-btn {
        position: absolute; top: 10px; left: 10px; z-index: 9999;
        padding: 6px 12px; background: rgba(0, 0, 0, 0.8);
        color: #00d2d3; border: 2px solid #00d2d3; border-radius: 8px;
        text-decoration: none; font-weight: bold; font-size: 12px;
        box-shadow: 0 0 10px rgba(0, 210, 211, 0.5); transition: all 0.2s;
        backdrop-filter: blur(5px);
    }
    .back-btn:hover { background: #00d2d3; color: #000; }

    .top-right-btns {
        position: absolute; top: 10px; right: 10px; z-index: 9999;
        display: flex; gap: 10px;
    }

    .voice-btn, .reset-btn {
        padding: 6px 12px; background: rgba(0, 0, 0, 0.8);
        border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 14px;
        transition: all 0.2s; backdrop-filter: blur(5px); cursor: pointer;
    }
    .voice-btn { color: #f1c40f; border: 2px solid #f1c40f; box-shadow: 0 0 10px rgba(241, 196, 15, 0.5); }
    .reset-btn { color: #e74c3c; border: 2px solid #e74c3c; box-shadow: 0 0 10px rgba(231, 76, 60, 0.5); }

    #game-container {
        flex: 1; position: relative; display: flex; flex-direction: column;
        max-width: 600px; width: 100%; margin: 0 auto; background: #1e1e2f;
        box-shadow: 0 0 30px rgba(0,0,0,0.8); overflow: hidden;
    }

    #hud {
        background: rgba(10, 10, 20, 0.9); padding: 10px; border-bottom: 2px solid #333;
        display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; font-size: 12px;
        z-index: 10; backdrop-filter: blur(5px);
    }
    .stat-item { display: flex; align-items: center; gap: 5px; }
    .stat-label { width: 30px; font-weight: bold; color: #a4b0be; text-align: right; font-size: 10px;}
    .stat-bar { flex: 1; height: 10px; background: #111; border-radius: 5px; overflow: hidden; border: 1px solid #333; position: relative; }
    .stat-fill { height: 100%; transition: width 0.3s; border-radius: 4px; }
    .fill-money { background: linear-gradient(90deg, #f1c40f, #f39c12); box-shadow: 0 0 10px #f1c40f; }
    .fill-energy { background: linear-gradient(90deg, #e74c3c, #c0392b); box-shadow: 0 0 10px #e74c3c; }
    .fill-mood { background: linear-gradient(90deg, #3498db, #2980b9); box-shadow: 0 0 10px #3498db; }
    .fill-stress { background: linear-gradient(90deg, #9b59b6, #8e44ad); box-shadow: 0 0 10px #9b59b6; }
    .fill-health { background: linear-gradient(90deg, #2ecc71, #27ae60); box-shadow: 0 0 10px #2ecc71; }
    .stat-val { position: absolute; right: 2px; top: 0; font-size: 8px; line-height: 10px; color: #fff; text-shadow: 1px 1px 1px #000; font-weight: bold; }

    #scene {
        flex: 1; position: relative; display: flex; flex-direction: column;
        align-items: center; justify-content: center; overflow: hidden;
        transition: background 1s ease;
    }
    .bg-street { background: linear-gradient(to bottom, #2c3e50, #1a252f); }
    .bg-office { background: linear-gradient(to bottom, #34495e, #1e272e); }
    
    /* 老闆專屬背景 */
    .bg-boss { background: linear-gradient(to bottom, #4a2500, #1a0d00); }

    .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); z-index: 110; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; backdrop-filter: blur(5px); }
    .modal-box { background: #1e1e2f; border: 3px solid #f1c40f; border-radius: 15px; padding: 25px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto;}
    .modal-box h2 { color: #f1c40f; margin-bottom: 15px; font-size: 22px; }
    .modal-box p { color: #ccc; font-size: 15px; margin-bottom: 20px; line-height: 1.5; }
    .modal-btn { width: 100%; padding: 15px; margin-bottom: 10px; border: none; border-radius: 8px; font-family: 'Noto Sans HK', sans-serif; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.2s; touch-action: manipulation; }
    .modal-btn.primary { background: #3498db; color: #fff; }
    .modal-btn.danger { background: #e74c3c; color: #fff; }
    .modal-btn.warning { background: #f39c12; color: #fff; }
    .modal-btn.casino { background: #e84393; color: #fff; }

    .bet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .bet-btn { background: #2c3e50; border: 2px solid #555; color: #fff; padding: 15px 10px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; transition: all 0.2s; }
    .bet-btn:active { transform: scale(0.95); background: #f39c12; color: #000; }
    .bet-btn .odds { display: block; font-size: 12px; color: #f1c40f; margin-top: 5px; }

    #end-screen { position: absolute; inset: 0; background: rgba(5,5,10,0.98); z-index: 50; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
    #end-screen h1 { color: #f1c40f; font-size: 40px; text-shadow: 0 0 20px #f1c40f; margin-bottom: 20px; }
    #end-screen p { font-size: 16px; line-height: 2; margin-bottom: 30px; color: #ccc; }
    #end-screen button { padding: 15px 40px; background: #f1c40f; color: #000; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 0 20px #f1c40f; }

    #dialogue-box { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.8) 80%, transparent 100%); padding: 30px 20px 20px 20px; z-index: 10; display: none; flex-direction: column; gap: 10px; }
    #speaker-name { color: #f1c40f; font-weight: bold; font-size: 16px; text-shadow: 0 2px 4px #000; }
    #dialogue-text { font-size: 18px; line-height: 1.6; min-height: 40px; text-shadow: 0 2px 4px #000; letter-spacing: 1px; }
    #choices { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; max-height: 35vh; overflow-y: auto; padding-right: 5px; }
    .choice-btn { background: rgba(30, 30, 47, 0.9); color: #fff; border: 2px solid #555; border-radius: 8px; padding: 12px 15px; font-size: 14px; text-align: left; cursor: pointer; transition: all 0.1s; font-family: 'Noto Sans HK', sans-serif; box-shadow: 0 4px 10px rgba(0,0,0,0.5); touch-action: manipulation; }
    .choice-btn:active { background: #00d2d3; color: #000; border-color: #00d2d3; transform: scale(0.98); }

    #actions { background: #111; padding: 10px; border-top: 2px solid #333; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; z-index: 10; max-height: 40vh; overflow-y: auto; }
    .action-btn { background: linear-gradient(to bottom, #3498db, #2980b9); color: #fff; border: 2px solid #000; border-radius: 8px; padding: 12px 8px; font-size: 13px; font-weight: bold; cursor: pointer; font-family: 'Noto Sans HK', sans-serif; box-shadow: 0 4px 0 #1c5980; transition: all 0.1s; display: flex; flex-direction: column; align-items: center; gap: 3px; touch-action: manipulation; }
    .action-btn:active { transform: translateY(4px); box-shadow: none; }
    .action-btn.work { background: linear-gradient(to bottom, #e67e22, #d35400); box-shadow: 0 4px 0 #a04000; }
    .action-btn.rest { background: linear-gradient(to bottom, #2ecc71, #27ae60); box-shadow: 0 4px 0 #196f3d; }
    .action-btn.buy { background: linear-gradient(to bottom, #9b59b6, #8e44ad); box-shadow: 0 4px 0 #6c3483; }
    .action-btn.casino { background: linear-gradient(to bottom, #e84393, #c2185b); box-shadow: 0 4px 0 #7b1fa2; }
    .action-btn.boss { background: linear-gradient(to bottom, #f1c40f, #f39c12); box-shadow: 0 4px 0 #b38f00; color: #000; text-shadow: none; }
    .action-btn.disabled { background: #333; box-shadow: 0 4px 0 #111; cursor: not-allowed; color: #666; }
    .action-btn small { font-size: 10px; font-weight: normal; opacity: 0.8; }

    #toast { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.1); border: 1px solid #fff; padding: 10px 20px; border-radius: 20px; font-weight: bold; z-index: 40; opacity: 0; transition: opacity 0.3s; pointer-events: none; text-align: center; backdrop-filter: blur(5px); white-space: nowrap; }
</style>
</head>
<body>

    <a href="../" class="back-btn">⬅ 返回大廳</a>
    
    <div class="top-right-btns">
        <div class="voice-btn" id="voice-toggle" onclick="toggleVoice()">🔊 語音</div>
        <div class="reset-btn" onclick="resetGame()">🗑️ 重玩</div>
    </div>

    <div id="game-container">
        <div id="hud">
            <div class="stat-item"><span class="stat-label">💰錢</span><div class="stat-bar"><div class="stat-fill fill-money" id="bar-money" style="width: 0%;"></div><span class="stat-val" id="val-money">$0</span></div></div>
            <div class="stat-item"><span class="stat-label">🔋體</span><div class="stat-bar"><div class="stat-fill fill-energy" id="bar-energy" style="width: 100%;"></div><span class="stat-val" id="val-energy">100</span></div></div>
            <div class="stat-item"><span class="stat-label">😊情</span><div class="stat-bar"><div class="stat-fill fill-mood" id="bar-mood" style="width: 80%;"></div><span class="stat-val" id="val-mood">80</span></div></div>
            <div class="stat-item"><span class="stat-label">🤯壓</span><div class="stat-bar"><div class="stat-fill fill-stress" id="bar-stress" style="width: 10%;"></div><span class="stat-val" id="val-stress">10</span></div></div>
            <div class="stat-item"><span class="stat-label">❤️健</span><div class="stat-bar"><div class="stat-fill fill-health" id="bar-health" style="width: 100%;"></div><span class="stat-val" id="val-health">100</span></div></div>
            <div class="stat-item" style="justify-content: center; color: #a4b0be; font-size: 10px;" id="status-display">💼 打工仔</div>
        </div>

        <div id="scene" class="bg-street">
            <div id="character">
                <div class="hair"></div>
                <div class="head">
                    <div class="eye eye-l"></div>
                    <div class="eye eye-r"></div>
                    <div class="mouth" id="char-mouth"></div>
                    <div class="sweat" id="char-sweat">💦</div>
                </div>
                <div class="arm arm-l"></div>
                <div class="arm arm-r"></div>
                <div class="body" id="char-body"><div class="tie" id="char-tie"></div></div>
                <div class="leg leg-l"></div>
                <div class="leg leg-r"></div>
            </div>

            <div id="dialogue-box">
                <div id="speaker-name">面試官</div>
                <div id="dialogue-text"></div>
                <div id="choices"></div>
            </div>
        </div>

        <div id="actions"></div>
    </div>

    <!-- 投資賭博主選單 -->
    <div id="invest-modal" class="modal-overlay">
        <div class="modal-box" style="border-color: #e84393;">
            <h2 style="color: #e84393;">💸 終極賭徒</h2>
            <p>搏一搏，單車變摩托！</p>
            <button class="modal-btn casino" onclick="openHorseBet()">🐎 賽馬 (每注 $500)</button>
            <button class="modal-btn casino" onclick="openFootballBet()">⚽ 賭波 (每注 $500)</button>
            <button class="modal-btn danger" onclick="playLottery()">🎰 六合彩 ($100 贏 500萬)</button>
            <button class="modal-btn primary" onclick="playStock()">📈 炒股 ($10,000 隨機賺蝕)</button>
            <button class="modal-btn warning" onclick="buyInsurance()">🛡️ 買自願醫保 ($5,000)</button>
            <button class="modal-btn danger" style="background:#555; color:#fff;" onclick="closeModal('invest-modal')">離開</button>
        </div>
    </div>

    <!-- 賽馬彈窗 -->
    <div id="horse-modal" class="modal-overlay">
        <div class="modal-box" style="border-color: #f1c40f;">
            <h2 style="color: #f1c40f;">🐎 香港賽馬日</h2>
            <p>揀一隻心水馬，一注 $500。</p>
            <div id="racing-anim" style="display:none; font-size:30px; margin-bottom:20px; text-align:center;">🐎💨 🐎💨 🐎💨</div>
            <div class="bet-grid" id="horse-buttons">
                <button class="bet-btn" onclick="betHorse(1)">1號 靚仔<span class="odds">賠率 5倍</span></button>
                <button class="bet-btn" onclick="betHorse(2)">2號 大熱<span class="odds">賠率 5倍</span></button>
                <button class="bet-btn" onclick="betHorse(3)">3號 冷門<span class="odds">賠率 5倍</span></button>
                <button class="bet-btn" onclick="betHorse(4)">4號 陪跑<span class="odds">賠率 5倍</span></button>
            </div>
            <button class="modal-btn danger" style="background:#555;" onclick="closeModal('horse-modal')">返回</button>
        </div>
    </div>

    <!-- 賭波彈窗 -->
    <div id="football-modal" class="modal-overlay">
        <div class="modal-box" style="border-color: #00d2d3;">
            <h2 style="color: #00d2d3;">⚽ 英超大戰</h2>
            <p>曼聯 vs 利物浦，一注 $500。</p>
            <div id="football-anim" style="display:none; font-size:20px; margin-bottom:20px; text-align:center;">⚽ 賽事進行中...</div>
            <div class="bet-grid" id="football-buttons">
                <button class="bet-btn" onclick="betFootball('home')">曼聯 勝<span class="odds">賠率 2倍</span></button>
                <button class="bet-btn" onclick="betFootball('draw')">和局<span class="odds">賠率 3倍</span></button>
                <button class="bet-btn" onclick="betFootball('away')">利物浦 勝<span class="odds">賠率 2倍</span></button>
            </div>
            <button class="modal-btn danger" style="background:#555;" onclick="closeModal('football-modal')">返回</button>
        </div>
    </div>

    <!-- 開公司彈窗 -->
    <div id="company-modal" class="modal-overlay">
        <div class="modal-box" style="border-color: #f1c40f;">
            <h2 style="color: #f1c40f;">🚀 創業做老闆</h2>
            <p>打工係冇出息嘅！用 $300,000 積蓄成立自己嘅公司，自己做老闆！<br><br>⚠️ 注意：開公司後每月要出糧俾伙記同交租。</p>
            <button class="modal-btn boss" onclick="startCompany()">確認成立公司</button>
            <button class="modal-btn danger" style="background:#555;" onclick="closeModal('company-modal')">都係繼續打工</button>
        </div>
    </div>

    <div id="toast">提示訊息</div>

    <div id="end-screen">
        <h1 id="end-title">人生落幕</h1>
        <p id="end-stats"></p>
        <button onclick="resetGame()">重新投胎</button>
    </div>

<script>
    // --- 存檔與系統設定 ---
    const SAVE_KEY = 'officeSlaveSave_v11';
    function saveGame() {
        if (player.stage === 'end') { localStorage.removeItem(SAVE_KEY); return; }
        localStorage.setItem(SAVE_KEY, JSON.stringify({ player, currentMonth, interviewStep }));
    }
    function loadGame() {
        const saved = localStorage.getItem(SAVE_KEY);
        if (saved) { try { const d = JSON.parse(saved); player = d.player; currentMonth = d.currentMonth; interviewStep = d.interviewStep; return true; } catch(e) { return false; } }
        return false;
    }
    function resetGame() { if (confirm("確定要清除所有進度，重新投胎嗎？")) { localStorage.removeItem(SAVE_KEY); location.reload(); } }

    // --- 玩家狀態 (加入老闆屬性) ---
    let player = { 
        age: 22, money: 0, energy: 100, mood: 80, stress: 10, health: 100,
        job: '無業', jobType: '', salary: 0, 
        house: '街邊', partner: false, kids: 0, stage: 'interview',
        isInJail: false, isInHospital: false,
        interviewScore: 0, workCount: 0, hasInsurance: false,
        // 開公司專屬狀態
        isBoss: false, companyName: '社畜無限公司', employees: 0, companyProfit: 0,
        promotionLevel: 0 // 0=打工仔, 1=高級, 2=主任, 3=經理
    };
    let currentMonth = 0; let interviewStep = 0; let isMinigameActive = false;
    let isTyping = false; let typingTimeout; let fullText = ""; let typingEl = null;

    const sceneEl = document.getElementById('scene');
    const dialogueBox = document.getElementById('dialogue-box');
    const speakerName = document.getElementById('speaker-name');
    const dialogueText = document.getElementById('dialogue-text');
    const choicesEl = document.getElementById('choices');
    const actionsEl = document.getElementById('actions');
    const charMouth = document.getElementById('char-mouth');
    const charSweat = document.getElementById('char-sweat');
    const charBody = document.getElementById('char-body');
    const charTie = document.getElementById('char-tie');
    const statusDisplay = document.getElementById('status-display');
    const toastEl = document.getElementById('toast');

    // --- 語音 ---
    let isVoiceOn = true; let voices = [];
    function loadVoices() { voices = window.speechSynthesis.getVoices(); }
    if ('speechSynthesis' in window) { speechSynthesis.onvoiceschanged = loadVoices; loadVoices(); }
    function toggleVoice() {
        isVoiceOn = !isVoiceOn; const btn = document.getElementById('voice-toggle');
        if (isVoiceOn) { btn.innerText = "🔊 語音"; btn.style.color = "#f1c40f"; btn.style.borderColor = "#f1c40f"; }
        else { btn.innerText = "🔇 靜音"; btn.style.color = "#7f8c8d"; btn.style.borderColor = "#7f8c8d"; window.speechSynthesis.cancel(); }
    }
    function speakText(text, type = 'normal') {
        if (!isVoiceOn || !('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        let selectedVoice = voices.find(v => v.lang.includes('zh-HK') || v.lang.includes('yue') || v.name.includes('Cantonese'));
        if (!selectedVoice) selectedVoice = voices.find(v => v.lang.includes('zh-TW') || v.lang.includes('zh-CN'));
        if (selectedVoice) utterance.voice = selectedVoice;
        if (type === 'boss') { utterance.pitch = 1.5; utterance.rate = 1.1; } else { utterance.pitch = 1.0; utterance.rate = 0.9; }
        window.speechSynthesis.speak(utterance);
    }

    // --- UI 更新 ---
    function updateHUD() {
        document.getElementById('bar-money').style.width = `${Math.min(100, (player.money / 1000000) * 100)}%`;
        document.getElementById('val-money').innerText = `$${player.money.toLocaleString()}`;
        document.getElementById('bar-energy').style.width = `${Math.max(0, player.energy)}%`;
        document.getElementById('val-energy').innerText = Math.floor(player.energy);
        document.getElementById('bar-mood').style.width = `${Math.max(0, player.mood)}%`;
        document.getElementById('val-mood').innerText = Math.floor(player.mood);
        document.getElementById('bar-stress').style.width = `${Math.min(100, player.stress)}%`;
        document.getElementById('val-stress').innerText = Math.floor(player.stress);
        document.getElementById('bar-health').style.width = `${Math.max(0, player.health)}%`;
        document.getElementById('val-health').innerText = Math.floor(player.health);

        if (player.isBoss) {
            statusDisplay.innerText = `👑 老闆 (${player.companyName})`;
            statusDisplay.style.color = '#f1c40f';
        } else {
            statusDisplay.innerText = `💼 ${player.job}`;
            statusDisplay.style.color = '#a4b0be';
        }

        if (player.health <= 0) gameOver("你因為長期過勞，不幸猝死...");
        else if (!player.isBoss && (player.energy <= 0 || player.stress >= 100)) triggerHospital();
        
        saveGame();
    }

    function showToast(msg) { 
        toastEl.innerText = msg; toastEl.style.opacity = 1; 
        clearTimeout(window.toastTimer); window.toastTimer = setTimeout(() => { toastEl.style.opacity = 0; }, 3000); 
    }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function showFloatText(text, color) {
        let el = document.createElement('div'); el.className = 'float-text'; el.innerText = text; el.style.color = color;
        el.style.left = (40 + Math.random() * 20) + '%'; el.style.top = '40%';
        sceneEl.appendChild(el); setTimeout(() => el.remove(), 1000);
    }

    // --- 開公司系統 ---
    function startCompany() {
        if (player.money < 300000) { showToast("你未夠 $300,000 資本！"); return; }
        player.money -= 300000;
        player.isBoss = true;
        player.job = '老闆';
        player.companyProfit = 5000; // 初始每月利潤
        closeModal('company-modal');
        sceneEl.className = 'bg-boss'; // 老闆專屬背景
        showToast("🚀 恭喜！你成立咗自己嘅公司！");
        playSound('money');
        updateHUD(); updateActionButtons();
    }

    // --- 動作按鈕生成 (區分打工仔與老闆) ---
    function updateActionButtons() {
        actionsEl.innerHTML = '';
        if (player.stage !== 'work' || player.isInJail || player.isInHospital) return;

        if (!player.isBoss) {
            // --- 打工仔按鈕 ---
            addActionBtn('💼 努力工作', '連點賺錢', 'work', player.energy > 10 ? () => startMinigame() : null);
            addActionBtn('🐟 帶薪摸魚', '減壓回體力', 'rest', player.stress > 0 ? () => fishAction() : null);
            
            if (player.money >= 2000) addActionBtn('🏥 去診所', '花 $2000 回滿體力', 'rest', () => goClinicAction());
            else if (player.energy > 20) addActionBtn('🍜 食頹飯', '花 $50 回體力', 'buy', () => eatAction());
            else addActionBtn('😴 瞓街邊', '無錢，瞓街回體力', 'buy', () => sleepStreetAction());

            addActionBtn('🛵 兼職送外賣', '扣體力，賺外快', 'work', player.energy > 20 ? () => sideHustleAction() : null);
            addActionBtn('🍺 去蘭桂坊', '花 $2000 大減壓', 'casino', player.money >= 2000 ? () => nightlifeAction() : null);
            addActionBtn('💸 終極賭徒', '賭馬/賭波/六合彩', 'casino', () => { document.getElementById('invest-modal').style.display = 'flex'; });

            if (player.money >= 300000 && player.workCount >= 30) {
                addActionBtn('🚀 開公司', '辭職創業做老闆！', 'boss', () => { document.getElementById('company-modal').style.display = 'flex'; });
            }

            if (player.money >= 4000) addActionBtn('🏠 交租', '每月必須支出', 'buy', () => payRentAction());
            if (!player.partner && player.money >= 10000 && player.mood > 50) addActionBtn('💖 去聯誼', '花 $10000 脫單', 'buy', () => findPartnerAction());
            if (player.partner && player.kids === 0 && player.money >= 50000) addActionBtn('👶 生仔', '花 $50000 組織家庭', 'buy', () => haveKidAction());
            if (player.money >= 100000 && player.house.includes('劏房')) addActionBtn('🏡 買樓', '花 $100000 上車', 'buy', () => buyHouseAction());

        } else {
            // --- 老闆按鈕 ---
            addActionBtn('👀 巡視業務', '減壓，視察員工', 'rest', () => bossPatrolAction());
            addActionBtn('🤝 見客傾生意', '隨機大賺或大蝕', 'work', player.energy > 10 ? () => bossBusinessAction() : null);
            addActionBtn('💼 請人擴張', '每位 $50,000 資本', 'boss', player.money >= 50000 ? () => hireEmployeeAction() : null);
            
            addActionBtn('💸 終極賭徒', '有錢佬嘅玩意', 'casino', () => { document.getElementById('invest-modal').style.display = 'flex'; });
            if (player.money >= 100000) addActionBtn('🏠 換大屋', '買豪宅享受', 'buy', () => buyHouseAction());
        }

        // 共通：買車
        if (!player.hasCar && player.money >= 50000) {
            addActionBtn('🚗 買車', '去車行睇車', 'buy', () => { showToast("⚠️ 買車系統需要喺上一個版本度玩，呢個版本主要測試開公司。"); });
        }
    }

    function addActionBtn(title, desc, cls, onClick) {
        let btn = document.createElement('button'); btn.className = `action-btn ${cls}`; btn.innerHTML = `${title}<small>${desc}</small>`;
        if (!onClick) btn.classList.add('disabled');
        else btn.onclick = () => { playSound('click'); onClick(); };
        actionsEl.appendChild(btn);
    }

    // --- 老闆專屬行為 ---
    function bossPatrolAction() {
        player.stress = Math.max(0, player.stress - 30);
        player.mood = Math.min(100, player.mood + 15);
        player.energy = Math.max(0, player.energy - 10);
        showToast("👀 你巡視業務，見到員工搏殺，心情舒暢！");
        checkMonthEnd(); updateHUD(); updateActionButtons();
    }

    function bossBusinessAction() {
        player.energy -= 20;
        let rand = Math.random();
        if (rand < 0.4) {
            let profit = Math.floor(Math.random() * 30000) + 10000;
            player.money += profit;
            showToast(`🤝 成功簽大單！賺咗 $${profit}！`);
            playSound('money');
        } else if (rand < 0.8) {
            let profit = Math.floor(Math.random() * 10000) + 2000;
            player.money += profit;
            showToast(`🤝 傾成咗單小生意，賺 $${profit}。`);
            playSound('money');
        } else {
            let loss = Math.floor(Math.random() * 20000) + 5000;
            player.money = Math.max(0, player.money - loss);
            showToast(`📉 被客走數！蝕咗 $${loss}...`);
            playSound('bad');
        }
        checkMonthEnd(); updateHUD(); updateActionButtons();
    }

    function hireEmployeeAction() {
        player.money -= 50000;
        player.employees++;
        player.companyProfit += 3000; // 每月增加利潤
        showToast(`💼 成功請咗個新員工！每月公司利潤增加 $3000！`);
        playSound('money'); updateHUD(); updateActionButtons();
    }

    // --- 賭博系統 ---
    function openHorseBet() {
        closeModal('invest-modal');
        document.getElementById('horse-modal').style.display = 'flex';
        document.getElementById('racing-anim').style.display = 'none';
        document.getElementById('horse-buttons').style.display = 'grid';
    }

    function betHorse(horseNum) {
        if (player.money < 500) { showToast("連 $500 都冇！"); return; }
        player.money -= 500;
        document.getElementById('horse-buttons').style.display = 'none';
        document.getElementById('racing-anim').style.display = 'block';
        
        setTimeout(() => {
            let win = Math.random() < 0.2;
            if (win) {
                player.money += 2500; showToast(`🐎 ${horseNum}號馬跑第一！贏咗 $2500！`); playSound('money');
            } else {
                showToast(`🐎 ${horseNum}號馬跑輸咗...`); playSound('bad');
            }
            document.getElementById('racing-anim').style.display = 'none';
            closeModal('horse-modal'); updateHUD(); updateActionButtons();
        }, 1500);
    }

    function openFootballBet() {
        closeModal('invest-modal');
        document.getElementById('football-modal').style.display = 'flex';
        document.getElementById('football-anim').style.display = 'none';
        document.getElementById('football-buttons').style.display = 'grid';
    }

    function betFootball(choice) {
        if (player.money < 500) { showToast("連 $500 都冇！"); return; }
        player.money -= 500;
        document.getElementById('football-buttons').style.display = 'none';
        document.getElementById('football-anim').style.display = 'block';
        
        setTimeout(() => {
            let res = Math.random();
            let actualResult = res < 0.45 ? 'home' : (res < 0.75 ? 'draw' : 'away');
            
            if (choice === actualResult) {
                let winAmt = choice === 'draw' ? 1500 : 1000;
                player.money += winAmt;
                showToast(`⚽ 買中咗！贏 $${winAmt}！`); playSound('money');
            } else {
                showToast(`⚽ 買錯咗，輸 $500...`); playSound('bad');
            }
            document.getElementById('football-anim').style.display = 'none';
            closeModal('football-modal'); updateHUD(); updateActionButtons();
        }, 1500);
    }

    function playLottery() {
        if (player.money < 100) { showToast("連 $100 都冇！"); return; }
        player.money -= 100;
        if (Math.random() < 0.01) { player.money += 5000000; showToast("🎉 中咗頭獎！500萬！"); playSound('money'); }
        else { showToast("😢 又做善事。"); playSound('bad'); }
        updateHUD(); updateActionButtons();
    }

    function playStock() {
        if (player.money < 10000) { showToast("最少要 $10000 本金！"); return; }
        let change = Math.random();
        if (change < 0.5) {
            let loss = Math.floor(Math.random() * 8000) + 2000;
            player.money -= loss; showToast(`📉 股市大跌！蝕咗 $${loss}`); playSound('bad');
        } else {
            let win = Math.floor(Math.random() * 15000) + 5000;
            player.money += win; showToast(`📈 股市大升！賺咗 $${win}`); playSound('money');
        }
        updateHUD(); updateActionButtons();
    }

    function buyInsurance() {
        if (player.hasInsurance) { showToast("你已經買咗醫保啦！"); return; }
        if (player.money < 5000) { showToast("唔夠錢！"); return; }
        player.money -= 5000; player.hasInsurance = true;
        showToast("🛡️ 成功購買自願醫保！");
        playSound('money'); updateHUD(); updateActionButtons();
    }

    // --- 基本生活系統 ---
    function sideHustleAction() {
        let earn = Math.floor(Math.random() * 500) + 300;
        player.money += earn; player.energy -= 30; player.stress += 15;
        showToast(`🛵 送外賣賺咗 $${earn}，但好攰...`);
        playSound('money'); checkMonthEnd(); updateHUD(); updateActionButtons();
    }

    function nightlifeAction() {
        if (player.money < 2000) return;
        player.money -= 2000; player.mood = 100; player.stress = Math.max(0, player.stress - 60); player.energy = Math.min(100, player.energy + 10);
        showToast("🍺 劈酒減壓！心情返晒嚟！");
        playSound('money'); updateHUD(); updateActionButtons();
    }

    function goClinicAction() {
        if (player.money < 2000) return;
        player.money -= 2000; player.energy = 100; player.stress = Math.max(0, player.stress - 50); player.health = Math.min(100, player.health + 10);
        playSound('money'); showToast("睇完醫生，精神晒！");
        updateHUD(); updateActionButtons();
    }

    function eatAction() {
        if (player.money < 50) return; player.money -= 50; player.energy = Math.min(100, player.energy + 40); player.mood += 5;
        playSound('click'); updateHUD(); updateActionButtons();
    }

    function sleepStreetAction() {
        player.energy = Math.min(100, player.energy + 15); player.mood -= 10; player.stress += 10; player.health = Math.max(0, player.health - 5);
        playSound('bad'); checkMonthEnd(); updateHUD(); updateActionButtons();
    }

    function payRentAction() {
        if (player.money < 4000) { showToast("業主趕你走！"); player.money = 0; player.house = '無家可歸'; player.stress += 50; updateHUD(); updateActionButtons(); return; }
        player.money -= 4000; playSound('bad');
        updateHUD(); updateActionButtons();
    }

    function findPartnerAction() {
        player.money -= 10000; player.partner = true; player.mood = 100; player.stress = Math.max(0, player.stress - 20);
        playSound('money'); showToast("🎉 恭喜！你成功脫單！");
        updateHUD(); updateActionButtons();
    }

    function haveKidAction() {
        player.money -= 50000; player.kids++; player.stress += 30; player.mood += 20;
        playSound('money'); showToast("👶 恭喜生咗個小朋友！");
        updateHUD(); updateActionButtons();
    }

    function buyHouseAction() {
        player.money -= 100000; player.house = '私人屋苑 (業主)'; player.mood += 50; player.stress = Math.max(0, player.stress - 50);
        playSound('money'); showToast("🏡 太感動啦！你終於上車做業主！");
        updateHUD(); updateActionButtons();
    }

    // --- 每月結算 (自動升級 + 老闆發薪) ---
    function checkMonthEnd() {
        currentMonth++;
        if (currentMonth % 3 === 0) { // 每 3 次行動當一個月
            player.age++;
            
            // 1. 老闆結算
            if (player.isBoss) {
                let netProfit = player.companyProfit - (player.employees * 2000) - 5000;
                player.money += netProfit;
                if (netProfit > 0) showToast(`📈 公司月結：淨賺 $${netProfit}`);
                else showToast(`📉 公司月結：蝕錢 $${Math.abs(netProfit)}！`);
                
                if (player.money < 0) { gameOver("公司資金鏈斷裂，你宣佈破產！"); return; }
            } 
            // 2. 打工仔結算 (自動升級機制)
            else {
                if (player.workCount >= 10 && player.promotionLevel === 0) {
                    player.promotionLevel = 1; player.job = "高級" + player.job; player.salary += 3000;
                    showToast(`🎉 恭喜升職！你升做「${player.job}」，月薪加 $3000！但壓力亦都大增！`);
                    player.stress += 10;
                } else if (player.workCount >= 20 && player.promotionLevel === 1) {
                    player.promotionLevel = 2; player.job = "主任"; player.salary += 3000;
                    showToast(`🎉 恭喜升職！你升做「主任」！`);
                    player.stress += 15;
                } else if (player.workCount >= 35 && player.promotionLevel === 2) {
                    player.promotionLevel = 3; player.job = "經理"; player.salary += 5000;
                    showToast(`🎉 恭喜升職！你升做「經理」！老細開始當你係自己人。`);
                    player.stress += 20;
                }

                // 健康扣除
                if (player.stress > 80) player.health -= 15;
                if (player.energy < 20) player.health -= 10;
            }

            // 隨機事件
            let rand = Math.random();
            if (rand < 0.1) { showToast("⚠️ 壓力大增！"); player.stress += 20; player.mood -= 15; }
            else if (rand < 0.2) { showToast("🎉 派花紅！"); player.money += 2000; }
            
            if (player.age >= 65) gameOver("你終於捱到 65 歲退休，回望過去，不勝唏噓...");
        }
        updateHUD(); saveGame();
    }

    function gameOver(reason) {
        player.stage = 'end'; dialogueBox.style.display = 'none'; actionsEl.style.display = 'none';
        document.getElementById('end-screen').style.display = 'flex';
        let endingTitle = "👴 光榮退休";
        if (player.money < 0) endingTitle = "💸 破產邊緣";
        if (player.health <= 0) endingTitle = "💀 過勞死/猝死";
        
        document.getElementById('end-title').innerText = endingTitle;
        let statusText = player.isBoss ? `老闆 (${player.companyName})` : `打工仔 (${player.job})`;
        
        document.getElementById('end-stats').innerHTML = `
            ${reason}<br><br>終年：${player.age} 歲<br>最終資產：$${player.money.toLocaleString()}<br>
            最終身份：${statusText}<br>居住：${player.house.includes('業主') ? '業主' : '租客'}
        `;
        localStorage.removeItem(SAVE_KEY);
    }

    // --- 小遊戲 ---
    function startMinigame() {
        if (isMinigameActive) return; isMinigameActive = true;
        // 簡單模擬連點
        let clicks = 0; let timeLeft = 3.0;
        showToast("💼 瘋狂工作中... (快速點擊畫面)");
        
        let startTime = Date.now();
        let timer = setInterval(() => {
            let elapsed = (Date.now() - startTime) / 1000;
            timeLeft = Math.max(0, 3.0 - elapsed);
            if (timeLeft <= 0) {
                clearInterval(timer); isMinigameActive = false;
                finishWork(clicks);
            }
        }, 100);

        let handlePress = () => { clicks++; playSound('click'); };
        document.body.onmousedown = handlePress;
        document.body.ontouchstart = handlePress;
        
        setTimeout(() => {
            document.body.onmousedown = null;
            document.body.ontouchstart = null;
        }, 3000);
    }

    function finishWork(clicks) {
        let earn = Math.floor((player.salary / 2) * (clicks / 20));
        if (clicks > 40) earn *= 1.2;
        player.money += earn; player.workCount++; player.energy -= 15; player.stress += 10; player.mood -= 5;
        showToast(`努力工作完成，賺咗 $${earn}`);
        checkMonthEnd(); updateHUD(); updateActionButtons();
    }

    function fishAction() {
        player.stress = Math.max(0, player.stress - 30); player.mood = Math.min(100, player.mood + 20); player.energy = Math.min(100, player.energy + 20);
        showToast("🐟 帶薪摸魚成功！");
        checkMonthEnd(); updateHUD(); updateActionButtons();
    }

    // --- 面試系統 (簡化版) ---
    function startInterview() {
        player.stage = 'interview'; sceneEl.className = 'bg-street';
        dialogueBox.style.display = 'flex'; actionsEl.style.display = 'none';
        interviewStep = 0;
        showInterviewStep();
    }
    function showInterviewStep() {
        if (interviewStep >= 1) { // 簡單測試
            dialogueBox.style.display = 'none'; startGameAfterInterview(); return;
        }
        speakerName.innerText = "面試官"; choicesEl.innerHTML = '';
        typeWriter(dialogueText, "你覺得你最大嘅優點係咩？", 40, () => { 
            let btn = document.createElement('button'); btn.className = 'choice-btn'; btn.innerText = "我好捱得！";
            btn.onclick = () => { interviewStep++; showInterviewStep(); };
            choicesEl.appendChild(btn);
        }, 'normal');
    }

    function startGameAfterInterview() {
        actionsEl.style.display = 'grid';
        player.stage = 'work'; player.money += 5000; player.house = '深水埗劏房';
        player.job = 'IT狗'; player.salary = 18000;
        sceneEl.className = 'bg-office'; 
        updateHUD(); updateActionButtons();
    }

    // 初始化
    window.onload = () => { 
        const hasSave = loadGame();
        if (hasSave) {
            if (player.stage === 'work') {
                actionsEl.style.display = 'grid'; 
                if(player.isBoss) sceneEl.className = 'bg-boss'; else sceneEl.className = 'bg-office';
                updateActionButtons();
            }
            updateHUD();
        } else { updateHUD(); startInterview(); }
    };
</script>
</body>
</html>
