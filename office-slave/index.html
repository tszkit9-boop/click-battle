<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>社畜人生：地獄生存版</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;700;900&display=swap');
    
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    
    body {
        background-color: #050510; color: #fff; font-family: 'Noto Sans HK', sans-serif;
        height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
        background: radial-gradient(circle at center, #1a1a2e, #050510);
    }

    .back-btn {
        position: absolute; top: 10px; left: 10px; z-index: 9999;
        padding: 6px 12px; background: rgba(0, 0, 0, 0.8);
        color: #00d2d3; border: 2px solid #00d2d3; border-radius: 8px;
        text-decoration: none; font-weight: bold; font-size: 12px;
        box-shadow: 0 0 10px rgba(0, 210, 211, 0.5); transition: all 0.2s;
        backdrop-filter: blur(5px);
    }
    .back-btn:hover { background: #00d2d3; color: #000; }

    .top-right-btns {
        position: absolute; top: 10px; right: 10px; z-index: 9999;
        display: flex; gap: 10px;
    }

    .voice-btn, .reset-btn {
        padding: 6px 12px; background: rgba(0, 0, 0, 0.8);
        border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 14px;
        transition: all 0.2s; backdrop-filter: blur(5px); cursor: pointer;
    }
    .voice-btn { color: #f1c40f; border: 2px solid #f1c40f; box-shadow: 0 0 10px rgba(241, 196, 15, 0.5); }
    .reset-btn { color: #e74c3c; border: 2px solid #e74c3c; box-shadow: 0 0 10px rgba(231, 76, 60, 0.5); }

    #game-container {
        flex: 1; position: relative; display: flex; flex-direction: column;
        max-width: 600px; width: 100%; margin: 0 auto; background: #1e1e2f;
        box-shadow: 0 0 30px rgba(0,0,0,0.8); overflow: hidden;
    }

    #hud {
        background: rgba(10, 10, 20, 0.9); padding: 10px; border-bottom: 2px solid #333;
        display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 12px;
        z-index: 10; backdrop-filter: blur(5px);
    }
    .stat-item { display: flex; align-items: center; gap: 8px; }
    .stat-label { width: 45px; font-weight: bold; color: #a4b0be; text-align: right; }
    .stat-bar { flex: 1; height: 12px; background: #111; border-radius: 6px; overflow: hidden; border: 1px solid #333; position: relative; }
    .stat-fill { height: 100%; transition: width 0.3s; border-radius: 5px; }
    .fill-money { background: linear-gradient(90deg, #f1c40f, #f39c12); box-shadow: 0 0 10px #f1c40f; }
    .fill-energy { background: linear-gradient(90deg, #e74c3c, #c0392b); box-shadow: 0 0 10px #e74c3c; }
    .fill-mood { background: linear-gradient(90deg, #3498db, #2980b9); box-shadow: 0 0 10px #3498db; }
    .fill-stress { background: linear-gradient(90deg, #9b59b6, #8e44ad); box-shadow: 0 0 10px #9b59b6; }
    .stat-val { position: absolute; right: 5px; top: 0; font-size: 9px; line-height: 12px; color: #fff; text-shadow: 1px 1px 1px #000; font-weight: bold; }

    #scene {
        flex: 1; position: relative; display: flex; flex-direction: column;
        align-items: center; justify-content: center; overflow: hidden;
        transition: background 1s ease;
    }
    .bg-street { background: linear-gradient(to bottom, #2c3e50, #1a252f); }
    
    /* 職業背景 */
    .bg-it { background: radial-gradient(circle at center, #0d2818, #000); }
    .bg-sales { background: radial-gradient(circle at center, #4a2c0f, #1a0f00); }
    .bg-gov { background: linear-gradient(to bottom, #7f8c8d, #2c3e50); }
    .bg-designer { background: radial-gradient(circle at center, #4a0e4e, #1a001a); }
    .bg-cleaner { background: linear-gradient(to bottom, #1e3b26, #0a1a0f); }
    .bg-delivery { background: linear-gradient(to bottom, #d35400, #3e1a00); }
    .bg-tutor { background: linear-gradient(to bottom, #1e4d3a, #0a1f17); }
    .bg-kol { background: radial-gradient(circle at center, #8e44ad, #2c0e3a); }
    .bg-security { background: linear-gradient(to bottom, #1f2833, #050a10); }
    .bg-construction { background: linear-gradient(to bottom, #8a4f00, #2b1500); }
    .bg-safety { background: linear-gradient(to bottom, #b8651b, #4a2500); }

    .dust { position: absolute; background: #fff; border-radius: 50%; opacity: 0.2; animation: floatDust 10s linear infinite; }
    @keyframes floatDust { 0% { transform: translateY(100vh) translateX(0); } 100% { transform: translateY(-10vh) translateX(50px); } }

    /* 角色 */
    #character { position: relative; width: 140px; height: 280px; animation: breathe 2s infinite ease-in-out; z-index: 5; transition: all 0.5s; }
    @keyframes breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.02) translateY(-2px); } }
    .head { position: absolute; top: 0; left: 30px; width: 80px; height: 90px; background: #f5cba7; border-radius: 40px 40px 30px 30px; border: 3px solid #000; z-index: 2; overflow: hidden; }
    .hair { position: absolute; top: -5px; left: -5px; width: 90px; height: 40px; background: #2c3e50; border-radius: 40px 40px 0 0; border-bottom: 2px solid #000; }
    .eye { position: absolute; top: 45px; width: 10px; height: 10px; background: #000; border-radius: 50%; animation: blink 4s infinite; }
    .eye-l { left: 20px; } .eye-r { right: 20px; }
    @keyframes blink { 0%, 90%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
    .mouth { position: absolute; top: 70px; left: 35px; width: 10px; height: 4px; background: #000; border-radius: 2px; transition: all 0.3s; }
    .sweat { position: absolute; top: 30px; right: 10px; font-size: 20px; opacity: 0; transition: opacity 0.3s; animation: drop 1s infinite; }
    @keyframes drop { 0% { transform: translateY(0); } 100% { transform: translateY(10px); } }

    .body { position: absolute; top: 90px; left: 20px; width: 100px; height: 120px; background: var(--shirt-color, #2980b9); border-radius: 20px 20px 10px 10px; border: 3px solid #000; z-index: 1; transition: background 0.5s; }
    .tie { position: absolute; top: 0; left: 45px; width: 10px; height: 70px; background: var(--tie-color, #c0392b); border: 1px solid #000; transition: background 0.5s; }
    .arm { position: absolute; top: 100px; width: 25px; height: 90px; background: var(--shirt-color, #2980b9); border: 3px solid #000; border-radius: 15px; z-index: 0; transition: background 0.5s; }
    .arm-l { left: -10px; animation: moveArm 1s infinite alternate; } 
    .arm-r { right: -10px; animation: moveArm 1s infinite alternate-reverse; }
    @keyframes moveArm { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
    .leg { position: absolute; top: 210px; width: 30px; height: 70px; background: #34495e; border: 3px solid #000; border-radius: 10px; z-index: 0; }
    .leg-l { left: 30px; } .leg-r { right: 30px; }
    .helmet { position: absolute; top: -15px; left: 20px; width: 100px; height: 50px; background: var(--helmet-color, #f1c40f); border-radius: 50px 50px 0 0; border: 3px solid #000; z-index: 3; display: none; }

    /* 對話框 */
    #dialogue-box { 
        position: absolute; bottom: 0; left: 0; right: 0; 
        background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.8) 80%, transparent 100%);
        padding: 30px 20px 20px 20px; z-index: 10; display: none; flex-direction: column; gap: 10px;
    }
    #speaker-name { color: #f1c40f; font-weight: bold; font-size: 16px; text-shadow: 0 2px 4px #000; }
    #dialogue-text { font-size: 18px; line-height: 1.6; min-height: 40px; text-shadow: 0 2px 4px #000; letter-spacing: 1px; }
    #choices { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; max-height: 35vh; overflow-y: auto; padding-right: 5px; }
    .choice-btn { background: rgba(30, 30, 47, 0.9); color: #fff; border: 2px solid #555; border-radius: 8px; padding: 12px 15px; font-size: 14px; text-align: left; cursor: pointer; transition: all 0.1s; font-family: 'Noto Sans HK', sans-serif; box-shadow: 0 4px 10px rgba(0,0,0,0.5); touch-action: manipulation; }
    .choice-btn:active { background: #00d2d3; color: #000; border-color: #00d2d3; transform: scale(0.98); }

    /* 按鈕區 */
    #actions { background: #111; padding: 10px; border-top: 2px solid #333; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; z-index: 10; max-height: 40vh; overflow-y: auto; }
    .action-btn { background: linear-gradient(to bottom, #3498db, #2980b9); color: #fff; border: 2px solid #000; border-radius: 8px; padding: 12px 8px; font-size: 13px; font-weight: bold; cursor: pointer; font-family: 'Noto Sans HK', sans-serif; box-shadow: 0 4px 0 #1c5980; transition: all 0.1s; display: flex; flex-direction: column; align-items: center; gap: 3px; touch-action: manipulation; }
    .action-btn:active { transform: translateY(4px); box-shadow: none; }
    .action-btn.work { background: linear-gradient(to bottom, #e67e22, #d35400); box-shadow: 0 4px 0 #a04000; }
    .action-btn.rest { background: linear-gradient(to bottom, #2ecc71, #27ae60); box-shadow: 0 4px 0 #196f3d; }
    .action-btn.buy { background: linear-gradient(to bottom, #9b59b6, #8e44ad); box-shadow: 0 4px 0 #6c3483; }
    .action-btn.car { background: linear-gradient(to bottom, #f1c40f, #f39c12); box-shadow: 0 4px 0 #b38f00; color: #000; text-shadow: none; }
    .action-btn.disabled { background: #333; box-shadow: 0 4px 0 #111; cursor: not-allowed; color: #666; }
    .action-btn small { font-size: 10px; font-weight: normal; opacity: 0.8; }

    /* 小遊戲區 (動畫升級) */
    #minigame-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; display: none; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(3px); overflow: hidden; }
    
    /* 通用連點按鈕 */
    #mg-target { 
        width: 150px; height: 150px; border-radius: 50%; background: #e67e22; border: 6px solid #fff; 
        color: #fff; font-size: 24px; font-weight: bold; display: flex; align-items: center; justify-content: center; 
        box-shadow: 0 0 40px #e67e22; cursor: pointer; touch-action: manipulation; user-select: none; position: relative; z-index: 201;
        transition: transform 0.1s;
    }
    #mg-target:active { transform: scale(0.9); }

    /* 安全主任專屬動畫區 */
    #safety-game { width: 100%; height: 100%; display: none; position: absolute; inset: 0; }
    .worker {
        position: absolute; width: 60px; height: 80px; cursor: pointer; transition: transform 0.1s;
        display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
        animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popUp { from { transform: scale(0); } to { transform: scale(1); } }
    .worker:active { transform: scale(0.8); }
    .worker-head { width: 30px; height: 30px; background: #f5cba7; border-radius: 50%; border: 2px solid #000; position: relative; z-index: 2; }
    .worker-hat { position: absolute; top: -5px; left: -5px; width: 40px; height: 15px; border-radius: 10px 10px 0 0; border: 2px solid #000; z-index: 3; }
    .worker-body { width: 40px; height: 40px; border-radius: 5px; border: 2px solid #000; margin-top: -5px; z-index: 1; }

    #end-screen { position: absolute; inset: 0; background: rgba(5,5,10,0.98); z-index: 50; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
    #end-screen h1 { color: #f1c40f; font-size: 40px; text-shadow: 0 0 20px #f1c40f; margin-bottom: 20px; }
    #end-screen p { font-size: 16px; line-height: 2; margin-bottom: 30px; color: #ccc; }
    #end-screen button { padding: 15px 40px; background: #f1c40f; color: #000; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 0 20px #f1c40f; }

    .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); z-index: 110; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; backdrop-filter: blur(5px); }
    .modal-box { background: #1e1e2f; border: 3px solid #f1c40f; border-radius: 15px; padding: 25px; width: 100%; max-width: 400px; }
    .modal-box h2 { color: #f1c40f; margin-bottom: 15px; font-size: 22px; }
    .modal-box p { color: #ccc; font-size: 15px; margin-bottom: 20px; line-height: 1.5; }
    .modal-btn { width: 100%; padding: 15px; margin-bottom: 10px; border: none; border-radius: 8px; font-family: 'Noto Sans HK', sans-serif; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.2s; touch-action: manipulation; }
    .modal-btn.primary { background: #3498db; color: #fff; }
    .modal-btn.danger { background: #e74c3c; color: #fff; }
    .modal-btn.warning { background: #f39c12; color: #fff; }

    #toast { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.1); border: 1px solid #fff; padding: 10px 20px; border-radius: 20px; font-weight: bold; z-index: 40; opacity: 0; transition: opacity 0.3s; pointer-events: none; text-align: center; backdrop-filter: blur(5px); white-space: nowrap; }
    .float-text { position: absolute; font-weight: bold; font-size: 20px; pointer-events: none; animation: floatUp 1s forwards; z-index: 20; text-shadow: 2px 2px 0 #000; }
    @keyframes floatUp { 0% { transform: translateY(0) scale(0.8); opacity: 1; } 100% { transform: translateY(-80px) scale(1.2); opacity: 0; } }
</style>
</head>
<body>

    <a href="../" class="back-btn">⬅ 返回大廳</a>
    
    <div class="top-right-btns">
        <div class="voice-btn" id="voice-toggle" onclick="toggleVoice()">🔊 語音</div>
        <div class="reset-btn" onclick="resetGame()">🗑️ 重玩</div>
    </div>

    <div id="game-container">
        <div id="hud">
            <div class="stat-item"><span class="stat-label">💰 錢</span><div class="stat-bar"><div class="stat-fill fill-money" id="bar-money" style="width: 0%;"></div><span class="stat-val" id="val-money">$0</span></div></div>
            <div class="stat-item"><span class="stat-label">🔋 體力</span><div class="stat-bar"><div class="stat-fill fill-energy" id="bar-energy" style="width: 100%;"></div><span class="stat-val" id="val-energy">100</span></div></div>
            <div class="stat-item"><span class="stat-label">😊 心情</span><div class="stat-bar"><div class="stat-fill fill-mood" id="bar-mood" style="width: 80%;"></div><span class="stat-val" id="val-mood">80</span></div></div>
            <div class="stat-item"><span class="stat-label">🤯 壓力</span><div class="stat-bar"><div class="stat-fill fill-stress" id="bar-stress" style="width: 10%;"></div><span class="stat-val" id="val-stress">10</span></div></div>
        </div>

        <div id="scene" class="bg-street">
            <div id="particles"></div>

            <div id="character">
                <div class="helmet" id="char-helmet"></div>
                <div class="hair"></div>
                <div class="head">
                    <div class="eye eye-l"></div>
                    <div class="eye eye-r"></div>
                    <div class="mouth" id="char-mouth"></div>
                    <div class="sweat" id="char-sweat">💦</div>
                </div>
                <div class="arm arm-l"></div>
                <div class="arm arm-r"></div>
                <div class="body" id="char-body"><div class="tie" id="char-tie"></div></div>
                <div class="leg leg-l"></div>
                <div class="leg leg-r"></div>
            </div>

            <div id="dialogue-box">
                <div id="speaker-name">面試官</div>
                <div id="dialogue-text"></div>
                <div id="choices"></div>
            </div>
        </div>

        <div id="actions"></div>
    </div>

    <!-- 小遊戲介面 -->
    <div id="minigame-overlay">
        <h2 id="mg-title" style="color:#fff; margin-bottom:20px; font-size:24px;">工作中...</h2>
        
        <!-- 通用連點區 -->
        <div id="mg-target">撳！</div>
        
        <!-- 安全主任專屬遊戲區 -->
        <div id="safety-game"></div>

        <div style="color:#aaa; margin-top:20px; font-size:18px;">剩餘時間：<span id="mg-time" style="color:#f1c40f; font-size:24px;">5.0</span>s</div>
    </div>

    <div id="toast">提示訊息</div>

    <!-- 面試結果彈窗 -->
    <div id="interview-result-modal" class="modal-overlay">
        <div class="modal-box">
            <h2 id="ir-title">面試結束</h2>
            <p id="ir-text"></p>
            <button class="modal-btn primary" id="ir-btn" onclick="handleInterviewResult()">確認</button>
        </div>
    </div>

    <div id="end-screen">
        <h1 id="end-title">人生落幕</h1>
        <p id="end-stats"></p>
        <button onclick="resetGame()">重新投胎</button>
    </div>

<script>
    const SAVE_KEY = 'officeSlaveSave_v8';
    function saveGame() {
        if (player.stage === 'end') { localStorage.removeItem(SAVE_KEY); return; }
        localStorage.setItem(SAVE_KEY, JSON.stringify({ player, currentMonth, interviewStep }));
    }
    function loadGame() {
        const saved = localStorage.getItem(SAVE_KEY);
        if (saved) { try { const d = JSON.parse(saved); player = d.player; currentMonth = d.currentMonth; interviewStep = d.interviewStep; return true; } catch(e) { return false; } }
        return false;
    }
    function resetGame() { if (confirm("確定要清除所有進度，重新投胎嗎？")) { localStorage.removeItem(SAVE_KEY); location.reload(); } }

    let isVoiceOn = true; let voices = [];
    function loadVoices() { voices = window.speechSynthesis.getVoices(); }
    if ('speechSynthesis' in window) { speechSynthesis.onvoiceschanged = loadVoices; loadVoices(); }
    function toggleVoice() {
        isVoiceOn = !isVoiceOn; const btn = document.getElementById('voice-toggle');
        if (isVoiceOn) { btn.innerText = "🔊 語音"; btn.style.color = "#f1c40f"; btn.style.borderColor = "#f1c40f"; }
        else { btn.innerText = "🔇 靜音"; btn.style.color = "#7f8c8d"; btn.style.borderColor = "#7f8c8d"; window.speechSynthesis.cancel(); }
    }
    function speakText(text, type = 'normal') {
        if (!isVoiceOn || !('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        let selectedVoice = voices.find(v => v.lang.includes('zh-HK') || v.lang.includes('yue') || v.name.includes('Cantonese'));
        if (!selectedVoice) selectedVoice = voices.find(v => v.lang.includes('zh-TW') || v.lang.includes('zh-CN'));
        if (selectedVoice) utterance.voice = selectedVoice;
        if (type === 'boss') { utterance.pitch = 1.5; utterance.rate = 1.1; } else { utterance.pitch = 1.0; utterance.rate = 0.9; }
        window.speechSynthesis.speak(utterance);
    }

    let player = { 
        age: 22, money: 0, energy: 100, mood: 80, stress: 10, 
        job: '無業', jobType: '', salary: 0, 
        house: '街邊', partner: false, kids: 0, stage: 'interview',
        isInJail: false, isInHospital: false,
        interviewScore: 0
    };
    let currentMonth = 0; let interviewStep = 0; let isMinigameActive = false;
    let isTyping = false; let typingTimeout; let fullText = ""; let typingEl = null;

    const sceneEl = document.getElementById('scene');
    const dialogueBox = document.getElementById('dialogue-box');
    const speakerName = document.getElementById('speaker-name');
    const dialogueText = document.getElementById('dialogue-text');
    const choicesEl = document.getElementById('choices');
    const actionsEl = document.getElementById('actions');
    const charMouth = document.getElementById('char-mouth');
    const charSweat = document.getElementById('char-sweat');
    const charBody = document.getElementById('char-body');
    const charTie = document.getElementById('char-tie');
    const charHelmet = document.getElementById('char-helmet');
    const minigameOverlay = document.getElementById('minigame-overlay');
    const mgTitle = document.getElementById('mg-title');
    const mgTime = document.getElementById('mg-time');
    const mgTarget = document.getElementById('mg-target');
    const safetyGame = document.getElementById('safety-game');
    const toastEl = document.getElementById('toast');

    const particlesEl = document.getElementById('particles');
    for(let i=0; i<20; i++) {
        let p = document.createElement('div'); p.className = 'dust';
        p.style.width = Math.random() * 3 + 1 + 'px'; p.style.height = p.style.width;
        p.style.left = Math.random() * 100 + '%'; p.style.animationDuration = (Math.random() * 5 + 5) + 's';
        p.style.animationDelay = (Math.random() * 5) + 's'; particlesEl.appendChild(p);
    }

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        let now = audioCtx.currentTime;
        if (type === 'click') { osc.type = 'sine'; osc.frequency.setValueAtTime(600, now); gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05); osc.start(); osc.stop(now + 0.05); }
        else if (type === 'type') { osc.type = 'square'; osc.frequency.setValueAtTime(800 + Math.random() * 200, now); gain.gain.setValueAtTime(0.02, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03); osc.start(); osc.stop(now + 0.03); }
        else if (type === 'money') { osc.type = 'triangle'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1); gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(); osc.stop(now + 0.1); }
        else if (type === 'bad') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.3); gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3); osc.start(); osc.stop(now + 0.3); }
    }

    function typeWriter(el, text, speed = 40, callback, voiceType = 'normal') {
        clearTimeout(typingTimeout); el.innerText = ""; fullText = text; typingEl = el; isTyping = true; let i = 0;
        speakText(text, voiceType);
        function type() {
            if (i < text.length) { el.innerText += text.charAt(i); i++; if (i % 2 === 0) playSound('type'); typingTimeout = setTimeout(type, speed); }
            else { isTyping = false; if (callback) callback(); }
        }
        type();
    }

    function showToast(msg) { toastEl.innerText = msg; toastEl.style.opacity = 1; clearTimeout(window.toastTimer); window.toastTimer = setTimeout(() => { toastEl.style.opacity = 0; }, 2500); }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function updateHUD() {
        document.getElementById('bar-money').style.width = `${Math.min(100, (player.money / 100000) * 100)}%`;
        document.getElementById('val-money').innerText = `$${player.money.toLocaleString()}`;
        document.getElementById('bar-energy').style.width = `${Math.max(0, player.energy)}%`;
        document.getElementById('val-energy').innerText = Math.floor(player.energy);
        document.getElementById('bar-mood').style.width = `${Math.max(0, player.mood)}%`;
        document.getElementById('val-mood').innerText = Math.floor(player.mood);
        document.getElementById('bar-stress').style.width = `${Math.min(100, player.stress)}%`;
        document.getElementById('val-stress').innerText = Math.floor(player.stress);

        if (player.stress > 70 || player.mood < 30) {
            charMouth.style.width = '15px'; charMouth.style.height = '10px'; charMouth.style.borderRadius = '0 0 10px 10px'; charMouth.style.background = '#000';

    function showFloatText(text, color) {
        let el = document.createElement('div'); el.className = 'float-text'; el.innerText = text; el.style.color = color;
        el.style.left = (40 + Math.random() * 20) + '%'; el.style.top = '40%';

    let currentInterviewQuestions = [];

    function startInterview() {
        player.stage = 'interview'; sceneEl.className = 'bg-street';
        dialogueBox.style.display = 'flex'; actionsEl.style.display = 'none';
        interviewStep = 0; player.interviewScore = 0;
        
        // 隨機抽 3 條問題
        currentInterviewQuestions = [...interviewQuestions].sort(() => 0.5 - Math.random()).slice(0, 3);
        showInterviewStep();
    }

    function showInterviewStep() {
        if (interviewStep >= currentInterviewQuestions.length) {
            dialogueBox.style.display = 'none';
            checkInterviewResult();
            return;
        }
        let data = currentInterviewQuestions[interviewStep];
        speakerName.innerText = "面試官"; choicesEl.innerHTML = '';
        typeWriter(dialogueText, data.q, 40, () => { 
            data.opts.forEach((opt, index) => {
                let btn = document.createElement('button'); btn.className = 'choice-btn'; btn.innerText = opt.t;
                btn.onclick = (e) => { 
                    e.stopPropagation(); playSound('click'); 
                    player.interviewScore += opt.s;
                    speakText(opt.t, 'normal'); 
                    setTimeout(() => { interviewStep++; showInterviewStep(); }, 800);
                };
                choicesEl.appendChild(btn);
            });
        }, 'normal');
    }

    function checkInterviewResult() {
        document.getElementById('interview-result-modal').style.display = 'flex';
        if (player.interviewScore >= 3) {
            document.getElementById('ir-title').innerText = "🎉 面試合格！";
            document.getElementById('ir-title').style.color = "#2ed573";
            document.getElementById('ir-text').innerText = `面試官對你很滿意！\n得分：${player.interviewScore}\n你正式成為「見習社畜」！`;
            document.getElementById('ir-btn').innerText = "開始地獄人生";
            document.getElementById('ir-btn').onclick = () => { 
                closeModal('interview-result-modal'); 
                startGameAfterInterview(); 
            };
        } else {
            document.getElementById('ir-title').innerText = "❌ 面試不合格";
            document.getElementById('ir-title').style.color = "#ff4757";
            document.getElementById('ir-text').innerText = `面試官覺得你唔夠「捱得」！\n得分：${player.interviewScore}\n你被請咗出門口...`;
            document.getElementById('ir-btn').innerText = "重新投胎";
            document.getElementById('ir-btn').onclick = () => { resetGame(); };
        }
    }

    function startGameAfterInterview() {
        actionsEl.style.display = 'grid';
        player.stage = 'work'; player.money += 5000; player.house = '深水埗劏房 ($4000/月)';
        sceneEl.className = 'bg-office'; // 預設背景
        applyJobVisuals(); // 根據職業再轉

    function updateActionButtons() {
        actionsEl.innerHTML = '';
        if (player.stage === 'work' && !player.isInJail && !player.isInHospital) {
            
            let workDesc = (player.jobType === 'safety_officer' || player.jobType === 'safety_inspector') ? '巡地盤捉違規' : '工作賺錢';
            addActionBtn('💼 努力工作', workDesc, 'work', player.energy > 10 ? () => startMinigame() : null);
            
            addActionBtn('🐟 帶薪摸魚', '減壓回體力', 'rest', player.stress > 0 ? () => fishAction() : null);
            
            if (player.money >= 2000) {
                addActionBtn('🏥 去診所', '花 $2000 回滿體力', 'rest', () => goClinicAction());
            } else if (player.energy > 20) {
                addActionBtn('🍜 食頹飯', '花 $50 回體力', 'buy', () => eatAction());
            } else {
                addActionBtn('😴 瞓街邊', '無錢，瞓街回體力', 'buy', () => sleepStreetAction());
            }
            
            if (player.money >= 4000) addActionBtn('🏠 交租', '每月必須支出', 'buy', () => payRentAction());
            if (!player.partner && player.money >= 10000 && player.mood > 50) addActionBtn('💖 去聯誼', '花 $10000 脫單', 'buy', () => findPartnerAction());
            if (player.partner && player.kids === 0 && player.money >= 50000) addActionBtn('👶 生仔', '花 $50000 組織家庭', 'buy', () => haveKidAction());
            if (player.money >= 100000 && player.house.includes('劏房')) addActionBtn('🏡 買樓', '花 $100000 上車', 'buy', () => buyHouseAction());
        }
    }

    function addActionBtn(title, desc, cls, onClick) {
        let btn = document.createElement('button'); btn.className = `action-btn ${cls}`; btn.innerHTML = `${title}<small>${desc}</small>`;
        if (!onClick) btn.classList.add('disabled');
        else btn.onclick = () => { playSound('click'); onClick(); };
        actionsEl.appendChild(btn);
    }

    // --- 小遊戲系統 (新增動畫與安全主任專屬玩法) ---
    function startMinigame() {
        if (isMinigameActive) return; 
        isMinigameActive = true; 
        minigameOverlay.style.display = 'flex';
        
        let clicks = 0; 
        let timeLeft = 5.0; // 放慢節奏，改為 5 秒
        let timer;

        // 重設 UI
        mgTarget.style.display = 'none';
        safetyGame.style.display = 'none';
        safetyGame.innerHTML = '';
        mgTime.innerText = "5.0";

        if (player.jobType === 'safety_officer' || player.jobType === 'safety_inspector') {
            // 安全主任專屬：捉違規工人
            mgTitle.innerText = "🚨 落現場捉違規！見到冇戴帽就撳！";
            safetyGame.style.display = 'block';
            
            let spawnInterval = setInterval(() => {
                if (timeLeft <= 0) return;
                
                let worker = document.createElement('div');
                worker.className = 'worker';
                
                // 隨機決定係咪違規 (50% 機會)
                let isViolation = Math.random() < 0.5;
                let hatColor = isViolation ? 'transparent' : '#f1c40f'; // 冇帽 or 黃帽
                let bodyColor = isViolation ? '#e74c3c' : '#2980b9';
                
                worker.innerHTML = `
                    <div class="worker-head">
                        <div class="worker-hat" style="background:${hatColor}; border-color:${isViolation ? 'transparent' : '#000'}"></div>
                    </div>
                    <div class="worker-body" style="background:${bodyColor}"></div>
                `;
                
                // 隨機位置 (限制在畫面內)
                let maxX = window.innerWidth > 600 ? 500 : window.innerWidth - 80;
                let maxY = window.innerHeight - 200;
                worker.style.left = (Math.random() * maxX) + 'px';
                worker.style.top = (50 + Math.random() * maxY) + 'px';
                
                worker.onmousedown = (e) => {
                    e.preventDefault();
                    if (isViolation) {
                        clicks += 2; // 捉到違規，加雙倍分
                        playSound('money');
                        worker.style.transform = 'scale(1.5)';
                        worker.style.opacity = '0';
                        setTimeout(() => worker.remove(), 200);
                    } else {
                        clicks -= 1; // 捉錯好人，扣分
                        playSound('bad');
                        worker.style.background = 'red';
                        setTimeout(() => worker.remove(), 200);
                    }
                };
                
                safetyGame.appendChild(worker);
            }, 600); // 每 0.6 秒出一個工人

            let startTime = Date.now();
            timer = setInterval(() => {
                let elapsed = (Date.now() - startTime) / 1000;
                timeLeft = Math.max(0, 5.0 - elapsed);
                mgTime.innerText = timeLeft.toFixed(1);
                
                if (timeLeft <= 0) { 
                    clearInterval(timer); clearInterval(spawnInterval);
                    minigameOverlay.style.display = 'none'; 
                    isMinigameActive = false; 
                    finishWork(clicks); 
                }
            }, 100);

        } else {
            // 其他職業：傳統連點
            mgTitle.innerText = "💼 瘋狂工作！";
            mgTarget.style.display = 'flex';
            
            const handlePress = (e) => {
                if(e) e.preventDefault();
                if(!isMinigameActive) return;
                clicks++; 
                playSound('click'); 
                mgTarget.style.transform = 'scale(0.85)'; 
                setTimeout(() => mgTarget.style.transform = 'scale(1)', 50);
            };
            
            mgTarget.onmousedown = handlePress;
            mgTarget.ontouchstart = handlePress;

            let startTime = Date.now();
            timer = setInterval(() => {
                let elapsed = (Date.now() - startTime) / 1000;
                timeLeft = Math.max(0, 5.0 - elapsed);
                mgTime.innerText = timeLeft.toFixed(1);
                
                if (timeLeft <= 0) { 
                    clearInterval(timer); 
                    minigameOverlay.style.display = 'none'; 
                    isMinigameActive = false; 
                    mgTarget.onmousedown = null;
                    mgTarget.ontouchstart = null;
                    finishWork(clicks); 
                }
            }, 100);
        }
    }

    function finishWork(clicks) {
        let multiplier = 1.0;
        if (player.jobType === 'sales') multiplier = 0.5 + Math.random() * 1.5; 
        if (player.jobType === 'cleaner') multiplier = 0.8; 
        if (player.jobType === 'it') multiplier = 1.2; 
        if (player.jobType === 'delivery') multiplier = 1.3; 
        if (player.jobType === 'kol') multiplier = 0.1 + Math.random() * 3.0; 
        if (player.jobType === 'safety_inspector') multiplier = 1.5; 
        if (player.jobType === 'safety_officer') multiplier = 1.1; 

        let earn = Math.floor((player.salary / 2) * (clicks / 20) * multiplier);
        if (earn < 0) earn = 0; // 唔好扣錢
        
        if (clicks > 40) { 
            showToast("🔥 爆Seed！老細讚你！"); 
            earn *= 1.2; 
        }
        else if (clicks < 10) { 
            showToast("😪 你太慢喇，老細𫫇住你！"); 
            earn *= 0.5; 
        }
        
        player.money += earn; 
        if (player.jobType === 'safety_officer' || player.jobType === 'safety_inspector') player.energy -= 10; 
        else player.energy -= 15; 
        
        player.stress += 10; 
        player.mood -= 5;
        
        playSound('money'); showFloatText(`+$${earn}`, '#f1c40f'); showFloatText(`-15 🔋`, '#e74c3c');
        
        checkMonthEnd(); updateHUD(); updateActionButtons();
    }

    // 其他功能 (摸魚、買車、抄牌等保持不變)
    function fishAction() {
        let risk = 0.4;
        if (player.jobType === 'gov' || player.jobType === 'cleaner') risk = 0.1; 
        if (player.jobType === 'security') risk = 0.5; 
        if (player.jobType === 'kol') risk = 0.8; 
        if (player.jobType === 'safety_inspector') risk = 0.2; 

        let caught = Math.random() < risk;
        if (caught) {
            player.money = Math.max(0, player.money - 1000); player.stress += 30; player.mood -= 20;
            showToast("😡 摸魚被老細捉到！扣 $1000！");
            showFloatText(`- $1000`, '#e74c3c');
        } else {
            player.stress = Math.max(0, player.stress - 40); 
            player.mood = Math.min(100, player.mood + 20); 
            player.energy = Math.min(100, player.energy + 20);
            showToast("🐟 帶薪摸魚成功！真爽！"); showFloatText(`-40 🤯`, '#9b59b6');
        }
        checkMonthEnd(); updateHUD(); updateActionButtons();
    }

    function goClinicAction() {
        if (player.money < 2000) return;
        player.money -= 2000;
        player.energy = 100;
        player.stress = Math.max(0, player.stress - 50);
        playSound('money'); showFloatText(`- $2000`, '#f1c40f'); showFloatText(`+100 🔋`, '#e74c3c');
        showToast("睇完醫生，精神晒！");
        updateHUD(); updateActionButtons();
    }

    function eatAction() {
        if (player.money < 50) return; player.money -= 50; player.energy = Math.min(100, player.energy + 40); player.mood += 5;
        playSound('click'); showFloatText(`- $50`, '#f1c40f'); showFloatText(`+40 🔋`, '#e74c3c');
        updateHUD(); updateActionButtons();
    }

    function sleepStreetAction() {
        player.energy = Math.min(100, player.energy + 15); player.mood -= 10; player.stress += 10;
        playSound('bad'); showFloatText(`+15 🔋`, '#e74c3c');
        checkMonthEnd(); updateHUD(); updateActionButtons();
    }

    function payRentAction() {
        if (player.money < 4000) { showToast("業主趕你走！你變咗無家可歸..."); player.money = 0; player.house = '無家可歸'; player.stress += 50; updateHUD(); updateActionButtons(); return; }
        player.money -= 4000; playSound('bad'); showFloatText(`- $4000 租`, '#e74c3c');
        updateHUD(); updateActionButtons();
    }

    function findPartnerAction() {
        player.money -= 10000; player.partner = true; player.mood = 100; player.stress = Math.max(0, player.stress - 20);
        playSound('money'); showToast("🎉 恭喜！你成功脫單！");
        updateHUD(); updateActionButtons();
    }

    function haveKidAction() {
        player.money -= 50000; player.kids++; player.stress += 30; player.mood += 20;
        playSound('money'); showToast("👶 恭喜生咗個小朋友！不過養育開支好大...");
        updateHUD(); updateActionButtons();
    }

    function buyHouseAction() {
        player.money -= 100000; player.house = '私人屋苑 (業主)'; player.mood += 50; player.stress = Math.max(0, player.stress - 50);
        playSound('money'); showToast("🏡 太感動啦！你終於上車做業主！");
        updateHUD(); updateActionButtons();
    }

    function checkMonthEnd() {
        currentMonth++;
        if (currentMonth % 3 === 0) {
            player.age++;
            let rand = Math.random();
            
            if (rand < 0.1) { showToast("⚠️ 老細要求週末返工，壓力大增！"); player.stress += 20; player.mood -= 15; }
            else if (rand < 0.2) { showToast("🎉 公司派花紅！"); player.money += 2000; }
            else if (rand < 0.25) { showToast("💸 同事借錢唔還！"); player.money = Math.max(0, player.money - 500); }
            
            else if (rand < 0.35) {
                switch(player.jobType) {
                    case 'it': showToast("💻 伺服器大當機！你通宵救亡，體力大降！"); player.energy = Math.max(0, player.energy - 30); player.stress += 20; break;
                    case 'sales': showToast("💰 成功開大單！佣金大豐收！"); player.money += 5000; break;
                    case 'designer': showToast("🎨 客戶要求無限改稿，你心情崩潰了..."); player.mood = Math.max(0, player.mood - 30); player.stress += 15; break;
                    case 'gov': showToast("🛡️ 準時收工！你多咗時間休息。"); player.energy = Math.min(100, player.energy + 20); player.mood = Math.min(100, player.mood + 10); break;
                    case 'cleaner': showToast("🧹 執到客人漏低嘅名貴手錶！"); player.money += 2000; break;
                    case 'delivery': showToast("🛵 打風落雨！外賣單多到接唔切，搵多咗筆！"); player.money += 3000; player.energy = Math.max(0, player.energy - 20); break;
                    case 'tutor': showToast("👨‍🏫 怪獸家長送咗份大禮俾你！"); player.money += 1500; player.stress += 10; break;
                    case 'kol': showToast("📹 條片突然爆紅！接到廣告！"); player.money += 8000; player.mood = 100; break;
                    case 'security': showToast("👮 捉到個小偷，老細讚你！"); player.money += 1000; player.mood += 20; break;
                    case 'construction': showToast("👷‍♂️ 不小心扭親條腰，體力大跌！"); player.energy = Math.max(0, player.energy - 40); player.stress += 10; break;
                    case 'safety_officer': showToast("🦺 成功阻止一場嚴重工業意外！獲發獎金！"); player.money += 3000; player.mood += 30; break;
                    case 'safety_inspector': showToast("👮‍♂️ 突擊檢查大豐收！開咗十幾張告票！"); player.money += 4000; player.stress += 10; break;
                }
            }
            if (player.age >= 65) gameOver("你終於捱到 65 歲退休，回望過去，不勝唏噓...");
        }
        saveGame();
    }

    function gameOver(reason) {
        player.stage = 'end'; dialogueBox.style.display = 'none'; actionsEl.style.display = 'none';
        document.getElementById('end-screen').style.display = 'flex';
        let endingTitle = "👴 光榮退休";
        if (player.money < 0) endingTitle = "💸 破產邊緣";
        if (player.mood < 20) endingTitle = "😔 抑鬱終老";
        document.getElementById('end-title').innerText = endingTitle;
        let partnerText = player.partner ? "有老伴陪伴" : "孤獨終老";
        let houseText = player.house.includes('業主') ? "成功上車做業主" : "一生租樓/露宿街頭";
        let kidText = player.kids > 0 ? `有 ${player.kids} 個仔女` : "無兒無女";
        
        document.getElementById('end-stats').innerHTML = `
            ${reason}<br><br>終年：${player.age} 歲<br>最終資產：$${player.money.toLocaleString()}<br>
            居住：${houseText}<br>感情：${partnerText}<br>家庭：${kidText}<br>
            最終職業：${player.job}
        `;
        localStorage.removeItem(SAVE_KEY);
    }

    window.onload = () => { 
        const hasSave = loadGame();
        if (hasSave) {
            showToast("📂 已載入上次進度");
            if (player.stage === 'interview') startInterview();
            else if (player.stage === 'work') {
                actionsEl.style.display = 'grid'; 
                applyJobVisuals(); 
                updateActionButtons();
            }
            updateHUD();
        } else { updateHUD(); startInterview(); }
    };
</script>
</body>
</html>
