<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>社畜人生</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;700;900&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    body { background-color: #050510; color: #fff; font-family: 'Noto Sans HK', sans-serif; height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; background: radial-gradient(circle at center, #1a1a2e, #050510); }
    .back-btn { position: absolute; top: 10px; left: 10px; z-index: 9999; padding: 6px 12px; background: rgba(0, 0, 0, 0.8); color: #00d2d3; border: 2px solid #00d2d3; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 12px; box-shadow: 0 0 10px rgba(0, 210, 211, 0.5); transition: all 0.2s; backdrop-filter: blur(5px); }
    .back-btn:hover { background: #00d2d3; color: #000; }
    .top-right-btns { position: absolute; top: 10px; right: 10px; z-index: 9999; display: flex; gap: 10px; }
    .voice-btn, .reset-btn { padding: 6px 12px; background: rgba(0, 0, 0, 0.8); border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 14px; transition: all 0.2s; backdrop-filter: blur(5px); cursor: pointer; }
    .voice-btn { color: #f1c40f; border: 2px solid #f1c40f; box-shadow: 0 0 10px rgba(241, 196, 15, 0.5); }
    .reset-btn { color: #e74c3c; border: 2px solid #e74c3c; box-shadow: 0 0 10px rgba(231, 76, 60, 0.5); }
    #game-container { flex: 1; position: relative; display: flex; flex-direction: column; max-width: 600px; width: 100%; margin: 0 auto; background: #1e1e2f; box-shadow: 0 0 30px rgba(0,0,0,0.8); overflow: hidden; }
    #hud { background: rgba(10, 10, 20, 0.9); padding: 10px; border-bottom: 2px solid #333; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; font-size: 12px; z-index: 10; backdrop-filter: blur(5px); }
    .stat-item { display: flex; align-items: center; gap: 5px; }
    .stat-label { width: 30px; font-weight: bold; color: #a4b0be; text-align: right; font-size: 10px;}
    .stat-bar { flex: 1; height: 10px; background: #111; border-radius: 5px; overflow: hidden; border: 1px solid #333; position: relative; }
    .stat-fill { height: 100%; transition: width 0.3s; border-radius: 4px; }
    .fill-money { background: linear-gradient(90deg, #f1c40f, #f39c12); box-shadow: 0 0 10px #f1c40f; }
    .fill-energy { background: linear-gradient(90deg, #e74c3c, #c0392b); box-shadow: 0 0 10px #e74c3c; }
    .fill-mood { background: linear-gradient(90deg, #3498db, #2980b9); box-shadow: 0 0 10px #3498db; }
    .fill-stress { background: linear-gradient(90deg, #9b59b6, #8e44ad); box-shadow: 0 0 10px #9b59b6; }
    .fill-health { background: linear-gradient(90deg, #2ecc71, #27ae60); box-shadow: 0 0 10px #2ecc71; }
    .stat-val { position: absolute; right: 2px; top: 0; font-size: 8px; line-height: 10px; color: #fff; text-shadow: 1px 1px 1px #000; font-weight: bold; }
    #scene { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; transition: background 1s ease; min-height: 0; }
    .bg-street { background: linear-gradient(to bottom, #2c3e50, #1a252f); }
    .bg-office { background: linear-gradient(to bottom, #34495e, #1e272e); }
    .bg-boss { background: linear-gradient(to bottom, #4a2500, #1a0d00); }
    .bg-morning { background: linear-gradient(to bottom, #87CEEB, #4682B4); }
    .bg-noon { background: linear-gradient(to bottom, #FFD700, #FF8C00); }
    .bg-night { background: linear-gradient(to bottom, #191970, #000000); }
    .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); z-index: 110; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; backdrop-filter: blur(5px); }
    .modal-box { background: #1e1e2f; border: 3px solid #f1c40f; border-radius: 15px; padding: 20px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto;}
    .modal-box h2 { color: #f1c40f; margin-bottom: 15px; font-size: 20px; }
    .modal-box p { color: #ccc; font-size: 14px; margin-bottom: 15px; line-height: 1.5; }
    .modal-btn { width: 100%; padding: 12px; margin-bottom: 8px; border: none; border-radius: 8px; font-family: 'Noto Sans HK', sans-serif; font-size: 14px; font-weight: bold; cursor: pointer; transition: all 0.2s; touch-action: manipulation; text-align: left; }
    .modal-btn.primary { background: #3498db; color: #fff; }
    .modal-btn.danger { background: #e74c3c; color: #fff; }
    .modal-btn.warning { background: #f39c12; color: #fff; }
    .modal-btn.casino { background: #e84393; color: #fff; }
    .modal-btn.boss { background: #f1c40f; color: #000; }
    .modal-btn small { display: block; font-size: 11px; font-weight: normal; margin-top: 3px; opacity: 0.8; }
    .staff-card { background: #2c3e50; border: 2px solid #555; border-radius: 8px; padding: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .staff-info { text-align: left; }
    .staff-info b { font-size: 14px; color: #f1c40f; }
    .staff-info small { font-size: 11px; color: #bbb; display: block; margin-top: 2px; }
    .bet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
    .bet-btn { background: #2c3e50; border: 2px solid #555; color: #fff; padding: 12px 8px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; transition: all 0.2s; }
    .bet-btn:active { transform: scale(0.95); background: #f39c12; color: #000; }
    .bet-btn .odds { display: block; font-size: 11px; color: #f1c40f; margin-top: 3px; }
    .job-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 15px; }
    .job-btn { background: #2c3e50; border: 2px solid #3498db; color: #fff; padding: 8px 4px; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer; transition: all 0.2s; text-align: center; }
    .job-btn:hover { background: #3498db; }
    .job-btn small { display: block; font-size: 9px; font-weight: normal; margin-top: 2px; color: #f1c40f; }
    #end-screen { position: absolute; inset: 0; background: rgba(5,5,10,0.98); z-index: 50; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
    #end-screen h1 { color: #f1c40f; font-size: 36px; margin-bottom: 20px; }
    #end-screen p { font-size: 15px; line-height: 2; margin-bottom: 30px; color: #ccc; }
    #end-screen button { padding: 15px 40px; background: #f1c40f; color: #000; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
    #dialogue-box { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.8) 80%, transparent 100%); padding: 20px; z-index: 10; display: none; flex-direction: column; gap: 8px; }
    #speaker-name { color: #f1c40f; font-weight: bold; font-size: 15px; }
    #dialogue-text { font-size: 16px; line-height: 1.5; min-height: 35px; }
    #choices { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; max-height: 35vh; overflow-y: auto; }
    .choice-btn { background: rgba(30, 30, 47, 0.9); color: #fff; border: 2px solid #555; border-radius: 8px; padding: 10px 12px; font-size: 13px; text-align: left; cursor: pointer; }
    #actions { background: #111; padding: 8px; border-top: 2px solid #333; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; z-index: 10; max-height: 40vh; overflow-y: auto; flex-shrink: 0; }
    .action-btn { background: linear-gradient(to bottom, #3498db, #2980b9); color: #fff; border: 2px solid #000; border-radius: 8px; padding: 10px 6px; font-size: 12px; font-weight: bold; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .action-btn:active { transform: translateY(4px); box-shadow: none; }
    .action-btn.work { background: linear-gradient(to bottom, #e67e22, #d35400); box-shadow: 0 3px 0 #a04000; }
    .action-btn.rest { background: linear-gradient(to bottom, #2ecc71, #27ae60); box-shadow: 0 3px 0 #196f3d; }
    .action-btn.buy { background: linear-gradient(to bottom, #9b59b6, #8e44ad); box-shadow: 0 3px 0 #6c3483; }
    .action-btn.casino { background: linear-gradient(to bottom, #e84393, #c2185b); box-shadow: 0 3px 0 #7b1fa2; }
    .action-btn.boss { background: linear-gradient(to bottom, #f1c40f, #f39c12); box-shadow: 0 3px 0 #b38f00; color: #000; }
    .action-btn small { font-size: 9px; font-weight: normal; opacity: 0.8; }
    #toast { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); border: 2px solid #f1c40f; padding: 10px 20px; border-radius: 20px; font-weight: bold; z-index: 200; opacity: 0; transition: opacity 0.3s; pointer-events: none; text-align: center; color: #f1c40f; white-space: nowrap; }
    #character { position: relative; width: 140px; height: 280px; animation: breathe 2s infinite ease-in-out; z-index: 5; transform: scale(0.8); }
    @keyframes breathe { 0%, 100% { transform: scale(0.8) scaleY(1); } 50% { transform: scale(0.8) scaleY(1.02); } }
    .head { position: absolute; top: 0; left: 30px; width: 80px; height: 90px; background: #f5cba7; border-radius: 40px 40px 30px 30px; border: 3px solid #000; z-index: 2; }
    .hair { position: absolute; top: -5px; left: -5px; width: 90px; height: 40px; background: #2c3e50; border-radius: 40px 40px 0 0; border-bottom: 2px solid #000; }
    .eye { position: absolute; top: 45px; width: 10px; height: 10px; background: #000; border-radius: 50%; }
    .eye-l { left: 20px; } .eye-r { right: 20px; }
    .mouth { position: absolute; top: 70px; left: 35px; width: 10px; height: 4px; background: #000; border-radius: 2px; }
    .sweat { position: absolute; top: 20px; right: -15px; font-size: 20px; display: none; }
    .body { position: absolute; top: 90px; left: 20px; width: 100px; height: 120px; background: #2980b9; border-radius: 20px 20px 10px 10px; border: 3px solid #000; z-index: 1; }
    .tie { position: absolute; top: 0; left: 45px; width: 10px; height: 70px; background: #c0392b; border: 1px solid #000; }
    .arm { position: absolute; top: 100px; width: 25px; height: 90px; background: #2980b9; border: 3px solid #000; border-radius: 15px; z-index: 0; }
    .arm-l { left: -10px; } .arm-r { right: -10px; }
    .leg { position: absolute; top: 210px; width: 30px; height: 70px; background: #34495e; border: 3px solid #000; border-radius: 10px; z-index: 0; }
    .leg-l { left: 30px; } .leg-r { right: 30px; }
</style>
</head>
<body>

    <a href="../" class="back-btn">⬅ 返回大廳</a>
    <div class="top-right-btns">
        <div class="voice-btn" id="voice-toggle" onclick="toggleVoice()">🔊 語音</div>
        <div class="reset-btn" onclick="resetGame()">🗑️ 重玩</div>
    </div>

    <div id="game-container">
        <div id="hud">
            <div class="stat-item"><span class="stat-label">💰錢</span><div class="stat-bar"><div class="stat-fill fill-money" id="bar-money" style="width: 0%;"></div><span class="stat-val" id="val-money">$0</span></div></div>
            <div class="stat-item"><span class="stat-label">🔋體</span><div class="stat-bar"><div class="stat-fill fill-energy" id="bar-energy" style="width: 100%;"></div><span class="stat-val" id="val-energy">100</span></div></div>
            <div class="stat-item"><span class="stat-label">😊情</span><div class="stat-bar"><div class="stat-fill fill-mood" id="bar-mood" style="width: 80%;"></div><span class="stat-val" id="val-mood">80</span></div></div>
            <div class="stat-item"><span class="stat-label">🤯壓</span><div class="stat-bar"><div class="stat-fill fill-stress" id="bar-stress" style="width: 10%;"></div><span class="stat-val" id="val-stress">10</span></div></div>
            <div class="stat-item"><span class="stat-label">❤️健</span><div class="stat-bar"><div class="stat-fill fill-health" id="bar-health" style="width: 100%;"></div><span class="stat-val" id="val-health">100</span></div></div>
            <div class="stat-item" style="justify-content: center; color: #a4b0be; font-size: 10px;" id="status-display">💼 求職中</div>
        </div>

        <div id="scene" class="bg-morning">
            <div id="character">
                <div class="hair"></div>
                <div class="head">
                    <div class="eye eye-l"></div><div class="eye eye-r"></div><div class="mouth" id="char-mouth"></div>
                    <div class="sweat" id="char-sweat">💦</div>
                </div>
                <div class="arm arm-l"></div><div class="arm arm-r"></div>
                <div class="body" id="char-body"><div class="tie" id="char-tie"></div></div>
                <div class="leg leg-l"></div><div class="leg leg-r"></div>
            </div>
            <div id="dialogue-box">
                <div id="speaker-name">面試官</div>
                <div id="dialogue-text"></div>
                <div id="choices"></div>
            </div>
        </div>
        <div id="actions"></div>
    </div>

    <!-- 警署與坐監 -->
    <div id="jail-modal" class="modal-overlay">
        <div class="modal-box" style="border-color: #e74c3c; border-width: 4px;">
            <h2 style="color: #e74c3c;">🚨 警署扣留</h2>
            <p>你因為參與非法外圍賭博被警察拘捕！<br><br>你想點做？</p>
            <button class="modal-btn primary" onclick="hireLawyer()">👨‍⚖️ 請大律師 ($30,000)<small>有 60% 機率打甩，40% 機率敗訴入獄</small></button>
            <button class="modal-btn danger" onclick="goToJail('你自己認罪，放棄抗辯。')">🙇‍♂️ 自己認罪<small>直接坐監，罰款 $50,000</small></button>
        </div>
    </div>

    <!-- 求職中心 -->
    <div id="job-modal" class="modal-overlay" style="display: flex;">
        <div class="modal-box" style="border-color: #00d2d3;">
            <h2 style="color: #00d2d3;">🏢 求職中心</h2>
            <p>請選擇你想從事的工種：</p>
            <div class="job-grid">
                <button class="job-btn" onclick="selectJob('clerk')">📁 文員<small>$15k / 穩陣</small></button>
                <button class="job-btn" onclick="selectJob('it')">💻 IT狗<small>$25k / 爆肝</small></button>
                <button class="job-btn" onclick="selectJob('sales')">💼 金融Sales<small>$18k / 靠口才</small></button>
                <button class="job-btn" onclick="selectJob('security')">👮 保安<small>$14k / 極hea</small></button>
                <button class="job-btn" onclick="selectJob('cleaner')">🧹 清潔姐姐<small>$13k / 勞動</small></button>
                <button class="job-btn" onclick="selectJob('delivery')">🛵 外賣仔<small>$16k / 搵命搏</small></button>
                <button class="job-btn" onclick="selectJob('driver')">🚕 的士司機<small>$18k / 自由</small></button>
                <button class="job-btn" onclick="selectJob('chef')">🍳 廚房佬<small>$20k / 高壓</small></button>
                <button class="job-btn" onclick="selectJob('waiter')">🍽️ 侍應<small>$15k / 受氣</small></button>
                <button class="job-btn" onclick="selectJob('agent')">🏠 地產經紀<small>$10k+ / 開單</small></button>
                <button class="job-btn" onclick="selectJob('safety')">🦺 安全督導員<small>$22k / 地盤</small></button>
                <button class="job-btn" onclick="selectJob('construction')">🏗️ 地盤佬<small>$20k / 體力</small></button>
                <button class="job-btn" onclick="selectJob('surveyor')">📐 測量師<small>$24k / 專業</small></button>
                <button class="job-btn" onclick="selectJob('engineer')">⚙️ 工程師<small>$26k / 孭飛</small></button>
                <button class="job-btn" style="grid-column: span 2;" onclick="selectJob('kol')">📱 KOL 網紅<small>$5k底薪 / 靠流量</small></button>
            </div>
        </div>
    </div>

    <!-- 地產霸權與貸款 -->
    <div id="property-modal" class="modal-overlay">
        <div class="modal-box" style="border-color: #f39c12;">
            <h2 style="color: #f39c12;">🏠 地產霸權與財務</h2>
            <p id="property-status" style="color:#fff; font-size:13px; text-align:left; background:#111; padding:10px; border-radius:8px;">載入中...</p>
            <button class="modal-btn warning" onclick="drawHousing('public')">🎲 抽公屋 (首期 $50,000 / 月供 $2,000)<small>中籤率 20%，租出可收 $4,000</small></button>
            <button class="modal-btn warning" onclick="drawHousing('subsidized')">🎲 抽居屋 (首期 $150,000 / 月供 $6,000)<small>中籤率 15%，租出可收 $10,000</small></button>
            <button class="modal-btn primary" onclick="buyProperty('private', 500000, 15000, 20000)">🏢 買私樓 (首期 $500,000)<small>月供 $15,000，租出可收 $20,000</small></button>
            <button class="modal-btn primary" onclick="buyProperty('luxury', 1500000, 40000, 55000)">🏰 買豪宅 (首期 $1,500,000)<small>月供 $40,000，租出可收 $55,000</small></button>
            <hr style="border-color:#333; margin:15px 0;">
            <button class="modal-btn danger" onclick="takeLoan()">💸 向財仔借 $100,000<small>每月 10% 利息，還唔到即破產</small></button>
            <button class="modal-btn primary" onclick="repayLoan()">💰 還清貸款<small>清還所有本金及利息</small></button>
            <button class="modal-btn danger" style="background:#555;" onclick="closeModal('property-modal')">離開</button>
        </div>
    </div>

    <!-- 副業兼職 -->
    <div id="parttime-modal" class="modal-overlay">
        <div class="modal-box" style="border-color: #2ecc71;">
            <h2 style="color: #2ecc71;">🛵 放工搵外快</h2>
            <p>趁後生捱下世界！</p>
            <button class="modal-btn primary" onclick="doPartTime(1500, 25, 10, '送外賣')">🛵 送外賣 (+$1500)<small>扣 25 體力 / 加 10 壓力</small></button>
            <button class="modal-btn primary" onclick="doPartTime(2500, 35, 15, '做地盤散工')">🏗️ 地盤散工 (+$2500)<small>扣 35 體力 / 加 15 壓力</small></button>
            <button class="modal-btn primary" onclick="doPartTime(2000, 15, 20, '私補')">📚 幫人補習 (+$2000)<small>扣 15 體力 / 加 20 壓力</small></button>
            <button class="modal-btn danger" style="background:#555;" onclick="closeModal('parttime-modal')">返回</button>
        </div>
    </div>

    <!-- 賭博 -->
    <div id="invest-modal" class="modal-overlay">
        <div class="modal-box" style="border-color: #e84393;">
            <h2 style="color: #e84393;">💸 終極賭徒</h2>
            <button class="modal-btn casino" onclick="openHorseBet()">🐎 賽馬 (每注 $500)</button>
            <button class="modal-btn casino" onclick="openFootballBet()">⚽ 賭波 (每注 $500)</button>
            <button class="modal-btn danger" onclick="playLottery()">🎰 六合彩 ($100 贏 500萬)</button>
            <button class="modal-btn primary" onclick="playStock()">📈 炒股 ($10,000)</button>
            <button class="modal-btn warning" onclick="playCrypto()">🪙 炒幣 ($10,000)<small>90% 歸零，10% 暴漲 10 倍</small></button>
            <button class="modal-btn warning" onclick="buyInsurance()">🛡️ 買醫保 ($5,000)</button>
            <button class="modal-btn danger" style="background:#555;" onclick="closeModal('invest-modal')">離開</button>
        </div>
    </div>

    <div id="horse-modal" class="modal-overlay">
        <div class="modal-box" style="border-color: #f1c40f;">
            <h2 style="color: #f1c40f;">🐎 香港賽馬日</h2>
            <div id="racing-anim" style="display:none; font-size:30px; margin-bottom:20px;">🐎💨 🐎💨 🐎💨</div>
            <div class="bet-grid" id="horse-buttons">
                <button class="bet-btn" onclick="betHorse(1)">1號<span class="odds">5倍</span></button>
                <button class="bet-btn" onclick="betHorse(2)">2號<span class="odds">5倍</span></button>
                <button class="bet-btn" onclick="betHorse(3)">3號<span class="odds">5倍</span></button>
                <button class="bet-btn" onclick="betHorse(4)">4號<span class="odds">5倍</span></button>
            </div>
            <button class="modal-btn danger" style="background:#555;" onclick="closeModal('horse-modal')">返回</button>
        </div>
    </div>

    <div id="football-modal" class="modal-overlay">
        <div class="modal-box" style="border-color: #00d2d3;">
            <h2 style="color: #00d2d3;">⚽ 英超大戰</h2>
            <div id="football-anim" style="display:none; font-size:20px; margin-bottom:20px;">⚽ 賽事進行中...</div>
            <div class="bet-grid" id="football-buttons">
                <button class="bet-btn" onclick="betFootball('home')">主勝<span class="odds">2倍</span></button>
                <button class="bet-btn" onclick="betFootball('draw')">和局<span class="odds">3倍</span></button>
                <button class="bet-btn" onclick="betFootball('away')">客勝<span class="odds">2倍</span></button>
            </div>
            <button class="modal-btn danger" style="background:#555;" onclick="closeModal('football-modal')">返回</button>
        </div>
    </div>

    <div id="hospital-modal" class="modal-overlay">
        <div class="modal-box" style="border-color: #e74c3c;">
            <h2 style="color: #e74c3c;">🏥 強制送院！</h2>
            <p id="hospital-text"></p>
            <button class="modal-btn danger" onclick="closeHospital()">接受現實</button>
        </div>
    </div>

    <!-- 公司與員工 -->
    <div id="staff-modal" class="modal-overlay">
        <div class="modal-box" style="border-color: #00d2d3;">
            <h2 style="color: #00d2d3;">👥 員工管理</h2>
            <div style="background: #111; border-radius: 8px; padding: 10px; margin-bottom: 15px;">
                <p style="font-size: 12px; margin: 0; text-align: left; color:#fff;">
                    員工總數：<span id="total-staff">0</span> / 5 人<br>每月總人工：<span id="total-salary" style="color: #e74c3c;">$0</span><br>每月總利潤：<span id="total-profit" style="color: #2ecc71;">$0</span>
                </p>
            </div>
            <div id="candidate-list" style="margin-bottom: 15px;"></div>
            <div id="current-staff-list" style="margin-bottom: 15px;"></div>
            <button class="modal-btn danger" style="background:#555;" onclick="closeModal('staff-modal')">關閉</button>
        </div>
    </div>

    <div id="company-modal" class="modal-overlay">
        <div class="modal-box" style="border-color: #f1c40f;">
            <h2 style="color: #f1c40f;">🚀 創業做老闆</h2>
            <p>用 $300,000 積蓄成立自己嘅公司！</p>
            <button class="modal-btn boss" onclick="startCompany()">確認成立公司</button>
            <button class="modal-btn danger" style="background:#555;" onclick="closeModal('company-modal')">繼續打工</button>
        </div>
    </div>

    <div id="toast">提示訊息</div>

    <div id="end-screen">
        <h1 id="end-title">人生落幕</h1>
        <p id="end-stats"></p>
        <button onclick="resetGame()">重新投胎</button>
    </div>

<script>
    window.onerror = function(msg, url, line) { alert("遊戲發生錯誤！\n請按 F5 重新整理。\n錯誤：" + msg); return false; };
    const SAVE_KEY = 'officeSlaveSave_v26';
    function saveGame() { try { if (player.stage === 'end' || player.stage === 'job_select') { localStorage.removeItem(SAVE_KEY); return; } localStorage.setItem(SAVE_KEY, JSON.stringify({ player, currentMonth, timeOfDay, currentDay })); } catch(e){} }
    function loadGame() { try { const saved = localStorage.getItem(SAVE_KEY); if (saved) { const d = JSON.parse(saved); player = d.player; currentMonth = d.currentMonth; timeOfDay = d.timeOfDay || 0; currentDay = d.currentDay || 1; return true; } } catch(e){} return false; }
    function resetGame() { if (confirm("確定要清除所有進度，重新投胎嗎？")) { localStorage.removeItem(SAVE_KEY); location.reload(); } }

    const jobDatabase = {
        clerk: { name: '文員', baseSalary: 15000, energyCost: 15, stressCost: 10, levels: ['見習文員', '初級文員', '高級文員', '部門主管', '總經理'] },
        it: { name: 'IT狗', baseSalary: 25000, energyCost: 25, stressCost: 20, levels: ['Junior IT', 'IT狗', 'Senior IT', 'IT經理', 'CTO'] },
        sales: { name: 'Sales', baseSalary: 18000, energyCost: 20, stressCost: 15, levels: ['見習Sales', '初級Sales', '高級Sales', '銷售總監', '副總裁'] },
        security: { name: '保安', baseSalary: 14000, energyCost: 10, stressCost: 5, levels: ['見習保安', '初級保安', '高級保安', '保安隊長', '物業經理'] },
        cleaner: { name: '清潔', baseSalary: 13000, energyCost: 20, stressCost: 8, levels: ['清潔雜工', '清潔姐姐', '清潔組長', '清潔主任', '環境部經理'] },
        delivery: { name: '外賣仔', baseSalary: 16000, energyCost: 30, stressCost: 12, levels: ['步兵', '單車手', '電單車手', '外賣隊長', '物流主管'] },
        driver: { name: '司機', baseSalary: 18000, energyCost: 20, stressCost: 15, levels: ['替更司機', '的士司機', 'Uber司機', '車隊隊長', '車行老闆'] },
        chef: { name: '廚房佬', baseSalary: 20000, energyCost: 25, stressCost: 18, levels: ['打荷', '砧板', '炒鑊', '大廚', '行政總廚'] },
        waiter: { name: '侍應', baseSalary: 15000, energyCost: 20, stressCost: 12, levels: ['樓面', '侍應', '部長', '經理', '店長'] },
        agent: { name: '地產經紀', baseSalary: 10000, energyCost: 15, stressCost: 20, levels: ['見習經紀', '地產代理', '高級代理', '分行經理', '樓神'] },
        safety: { name: '安全督導員', baseSalary: 22000, energyCost: 15, stressCost: 15, levels: ['安全助理', '安全督導員', '註冊安全主任', '安全經理', '集團安全總監'] },
        construction: { name: '地盤佬', baseSalary: 20000, energyCost: 35, stressCost: 15, levels: ['地盤雜工', '扎鐵/釘板', '地盤判頭', '地盤主管', '建築大亨'] },
        surveyor: { name: '測量師', baseSalary: 24000, energyCost: 15, stressCost: 18, levels: ['測量助理', '測量師', '高級測量師', '首席測量師', '發展局局長'] },
        engineer: { name: '工程師', baseSalary: 26000, energyCost: 20, stressCost: 20, levels: ['見習工程師', '助理工程師', '註冊工程師', '總工程師', '工程總監'] },
        kol: { name: 'KOL', baseSalary: 5000, energyCost: 10, stressCost: 25, levels: ['素人', '小網紅', '帶貨主播', '百萬KOL', 'MCN老闆'] }
    };

    let player = { 
        age: 22, money: 0, energy: 100, mood: 80, stress: 10, health: 100, 
        job: '求職中', salary: 0, stage: 'job_select', isInHospital: false, workCount: 0, hasInsurance: false, 
        isBoss: false, companyName: '社畜無限公司', staffList: [], promotionLevel: 0, 
        properties: [], mortgage: 0, loan: 0, jobType: null
    };
    
    let currentMonth = 0, candidates = [];
    let timeOfDay = 0; // 0=早晨, 1=中午, 2=晚上
    let currentDay = 1;
    const MAX_STAFF = 5;
    const sceneEl = document.getElementById('scene'), actionsEl = document.getElementById('actions'), statusDisplay = document.getElementById('status-display'), toastEl = document.getElementById('toast');

    let isVoiceOn = false; let voices = [];
    if ('speechSynthesis' in window) { speechSynthesis.onvoiceschanged = () => { voices = window.speechSynthesis.getVoices(); }; }
    function toggleVoice() { isVoiceOn = !isVoiceOn; document.getElementById('voice-toggle').innerText = isVoiceOn ? "🔊 語音" : "🔇 靜音"; if(!isVoiceOn && window.speechSynthesis) window.speechSynthesis.cancel(); }
    function speakText(text) { try { if (!isVoiceOn || !('speechSynthesis' in window)) return; window.speechSynthesis.cancel(); const ut = new SpeechSynthesisUtterance(text); let v = voices.find(v => v.lang.includes('zh-HK') || v.lang.includes('yue')); if (v) ut.voice = v; window.speechSynthesis.speak(ut); } catch(e) {} }

    function updateHUD() {
        try {
            document.getElementById('bar-money').style.width = `${Math.min(100, (player.money / 1000000) * 100)}%`;
            document.getElementById('val-money').innerText = `$${player.money.toLocaleString()}`;
            document.getElementById('bar-energy').style.width = `${Math.max(0, player.energy)}%`; document.getElementById('val-energy').innerText = Math.floor(player.energy);
            document.getElementById('bar-mood').style.width = `${Math.max(0, player.mood)}%`; document.getElementById('val-mood').innerText = Math.floor(player.mood);
            document.getElementById('bar-stress').style.width = `${Math.min(100, player.stress)}%`; document.getElementById('val-stress').innerText = Math.floor(player.stress);
            document.getElementById('bar-health').style.width = `${Math.max(0, player.health)}%`; document.getElementById('val-health').innerText = Math.floor(player.health);
            document.getElementById('char-sweat').style.display = player.stress >= 60 ? 'block' : 'none';
            
            let timeStr = timeOfDay === 0 ? '☀️ 早晨' : (timeOfDay === 1 ? '🌤️ 中午' : '🌙 晚上');
            let displayStr = `第${currentDay}天 ${timeStr} | `;
            
            if (player.isBoss) { statusDisplay.innerText = displayStr + `👑 老闆`; statusDisplay.style.color = '#f1c40f'; }
            else { statusDisplay.innerText = displayStr + `💼 ${player.job}`; statusDisplay.style.color = '#a4b0be'; }

            // 改變背景顏色
            if (!player.isBoss && player.stage === 'work') {
                if (timeOfDay === 0) sceneEl.className = 'bg-morning';
                else if (timeOfDay === 1) sceneEl.className = 'bg-noon';
                else sceneEl.className = 'bg-night';
            } else if (player.isBoss) {
                sceneEl.className = 'bg-boss';
            }
            
            if (player.health <= 0) gameOver("你因為長期過勞，不幸猝死...");
            else if (!player.isBoss && player.stage === 'work' && (player.energy <= 0 || player.stress >= 100)) triggerHospital();
            saveGame();
        } catch(e) {}
    }

    function advanceTime() {
        timeOfDay++;
        if (timeOfDay > 2) {
            timeOfDay = 0;
            currentDay++;
        }
        updateHUD();
    }

    function showToast(msg) { if(!toastEl) return; toastEl.innerText = msg; toastEl.style.opacity = 1; clearTimeout(window.toastTimer); window.toastTimer = setTimeout(() => { toastEl.style.opacity = 0; }, 3000); speakText(msg); }
    function closeModal(id) { const el = document.getElementById(id); if (el) el.style.display = 'none'; }

    function selectJob(type) { player.jobType = type; closeModal('job-modal'); startInterview(); }

    function startInterview() {
        player.stage = 'interview';
        const db = document.getElementById('dialogue-box'); db.style.display = 'flex';
        const speaker = document.getElementById('speaker-name'), text = document.getElementById('dialogue-text'), choices = document.getElementById('choices');
        let jobInfo = jobDatabase[player.jobType];
        speaker.innerText = `${jobInfo.name}面試官`;
        let questions = {
            clerk: "我哋請文員要對數字好敏感，你覺得自己細心嗎？", it: "我哋IT部成日要OT通宵，你頂唔頂得順？", sales: "做Sales最緊要面皮厚，一個月跑唔跑到數？", security: "做保安要成日行嚟行去，仲要對住個門口發呆，你悶唔悶？",
            cleaner: "清潔好辛苦㗎，要洗廁所，你制唔制？", delivery: "打風落雨都要送外賣，你搏唔搏盡？", driver: "香港地塞車塞到傻，你脾氣好唔好？", chef: "廚房又熱又嘈，師傅鬧人好惡，你頂唔頂得順？",
            waiter: "啲客好麻煩，成日催單，你會唔會黑面？", agent: "開唔到單就食穀種，你有無信心跑數？", safety: "地盤好多危險嘢，你見唔見到人無戴安全帽會點做？", construction: "地盤日曬雨淋，仲要搬搬抬抬，你捱唔捱得？",
            surveyor: "測量師要成日對住啲圖紙同數字，你對眼頂唔頂得順？", engineer: "工程師要孭飛，起錯樓好大件事，你壓力大唔大？", kol: "做KOL要面對網民負評，你心臟夠唔夠強大？"
        };
        text.innerText = questions[player.jobType]; speakText(text.innerText); choices.innerHTML = '';
        const opts = [
            { t: "無問題！我準備好捱騾仔！(心情+5, 壓力+10)", m: 5, s: 10, msg: "好！有熱誠！聽日開始返工。" },
            { t: "吓？咁辛苦？(心情-10, 壓力+5)", m: -10, s: 5, msg: "香港地邊個唔辛苦呀？請你啦。" },
            { t: "我淨係想賺錢！(心情-5, 壓力+15)", m: -5, s: 15, msg: "夠坦白，我鍾意！下星期見。" }
        ];
        opts.forEach(o => {
            let btn = document.createElement('button'); btn.className = 'choice-btn'; btn.innerText = o.t;
            btn.onclick = () => {
                player.mood += o.m; player.stress += o.s; text.innerText = o.msg; speakText(o.msg);
                choices.innerHTML = '<button class="choice-btn" onclick="finishInterview()" style="text-align:center;border-color:#f1c40f;">接受 Offer，開始社畜人生</button>';
                updateHUD();
            };
            choices.appendChild(btn);
        });
    }

    function finishInterview() {
        player.stage = 'work'; player.money = 5000; player.job = jobDatabase[player.jobType].levels[0]; player.salary = jobDatabase[player.jobType].baseSalary;
        document.getElementById('dialogue-box').style.display = 'none'; sceneEl.className = 'bg-morning';
        updateActionButtons(); updateHUD(); showToast(`💼 入職成功！你現在係 ${player.job}！`);
    }

    function askPromotion() {
        let nextLevel = player.promotionLevel + 1, reqWork = (nextLevel) * 15; 
        if (nextLevel >= jobDatabase[player.jobType].levels.length) { showToast("已經升無可升啦！"); return; }
        if (player.workCount >= reqWork) {
            player.promotionLevel = nextLevel; player.job = jobDatabase[player.jobType].levels[nextLevel]; player.salary += jobDatabase[player.jobType].baseSalary * 0.5; 
            showToast(`🎉 升職啦！你現在係 ${player.job}，月薪加到 $${Math.floor(player.salary)}！`);
        } else { showToast(`未夠資格升職！需要工作 ${reqWork} 次，你現在得 ${player.workCount} 次。`); }
        updateHUD(); updateActionButtons();
    }

    // === 地產與貸款系統 ===
    function openPropertyModal() {
        document.getElementById('property-modal').style.display = 'flex';
        let propCount = player.properties.length;
        let rentInc = player.properties.reduce((a,b) => a + b.rent, 0);
        document.getElementById('property-status').innerHTML = `🏠 持有物業：${propCount} 個<br>💸 每月供款：$${player.mortgage.toLocaleString()}<br>💰 每月收租：$${rentInc.toLocaleString()}<br>🏦 財仔欠款：$${player.loan.toLocaleString()}`;
    }
    function drawHousing(type) {
        let cost = type === 'public' ? 50000 : 150000, prob = type === 'public' ? 0.2 : 0.15, mortgage = type === 'public' ? 2000 : 6000, rent = type === 'public' ? 4000 : 10000;
        let name = type === 'public' ? '公屋' : '居屋';
        if (player.money < cost) { showToast(`連首期 $${cost} 都冇！`); return; }
        if (Math.random() < prob) {
            player.money -= cost; player.mortgage += mortgage; player.properties.push({ name, mortgage, rent }); player.mood += 30;
            showToast(`🎉 恭喜抽中${name}！成功上車！`);
        } else { showToast(`😢 抽唔中${name}，下個月再嚟啦...`); }
        closeModal('property-modal'); updateHUD(); updateActionButtons();
    }
    function buyProperty(type, cost, mortgage, rent) {
        let name = type === 'private' ? '私樓' : '豪宅';
        if (player.money < cost) { showToast(`連首期 $${cost} 都冇！`); return; }
        player.money -= cost; player.mortgage += mortgage; player.properties.push({ name, mortgage, rent }); player.mood += 30;
        showToast(`🏢 成功買入${name}！可以做包租公啦！`); closeModal('property-modal'); updateHUD(); updateActionButtons();
    }
    function takeLoan() {
        if (player.loan >= 100000) { showToast("財仔已經唔借俾你啦！"); return; }
        player.money += 100000; player.loan += 100000;
        showToast("💸 借咗 $100,000！小心每月利息..."); closeModal('property-modal'); updateHUD();
    }
    function repayLoan() {
        if (player.loan === 0) { showToast("你冇欠債喎！"); return; }
        if (player.money < player.loan) { showToast("錢唔夠還！"); return; }
        player.money -= player.loan; player.loan = 0;
        showToast("✅ 成功還清所有財仔數！一身鬆晒！"); closeModal('property-modal'); updateHUD();
    }

    // === 副業兼職 ===
    function doPartTime(money, energyCost, stressCost, name) {
        if (player.energy < energyCost) { showToast("體力唔夠做兼職！去瞓覺啦！"); return; }
        player.money += money; player.energy -= energyCost; player.stress += stressCost;
        showToast(`🛵 做完${name}，賺咗 $${money}，就快攰死...`);
        closeModal('parttime-modal'); 
        advanceTime(); checkMonthEnd(); updateHUD(); updateActionButtons();
    }

    // === 監獄與律師系統 ===
    function openJail() { document.getElementById('jail-modal').style.display = 'flex'; }
    function hireLawyer() {
        if (player.money < 30000) { showToast("你連 $30,000 律師費都俾唔起，自己頂啦！"); goToJail("你無錢請律師，被迫認罪。"); return; }
        player.money -= 30000;
        if (Math.random() < 0.6) { showToast("👨‍⚖️ 律師成功幫你打甩官司！無罪釋放！"); closeModal('jail-modal'); }
        else { goToJail("大律師盡咗力，但證據確鑿，你敗訴入獄。"); }
    }
    function goToJail(msg) {
        closeModal('jail-modal');
        let fine = 50000; player.money -= fine; player.mood = Math.max(0, player.mood - 50); player.stress = Math.min(100, player.stress + 50);
        player.age += 1; showToast(`🚓 ${msg} 罰款 $50,000，監禁一年！`);
        if (player.money < 0) { gameOver("你連罰款都交唔起，破產收場！"); return; }
        checkMonthEnd(); updateHUD(); updateActionButtons();
    }

    // === 隨機事件 ===
    function triggerRandomEvent() {
        if (Math.random() > 0.2) return;
        let events = [
            { msg: "💰 返工路上執到錢！賺咗 $1000！", effect: () => { player.money += 1000; } },
            { msg: "🎉 老闆突然派 Bonus！加 $5000！", effect: () => { player.money += 5000; } },
            { msg: "🍱 食飯抽中免費餐！心情大好！", effect: () => { player.mood = Math.min(100, player.mood + 10); } },
            { msg: "😡 被麻煩客投訴！扣 $1000 人工！", effect: () => { player.money = Math.max(0, player.money - 1000); player.stress += 10; } },
            { msg: "🤕 行路仆街！扣 20 體力！", effect: () => { player.energy = Math.max(1, player.energy - 20); } },
            { msg: "⛈️ 打風交通癱瘓！心情大跌！", effect: () => { player.mood = Math.max(0, player.mood - 20); } },
            { msg: "🚓 偷雞非法賭波被警察放蛇拉咗！", effect: () => { openJail(); } }
        ];
        let ev = events[Math.floor(Math.random() * events.length)];
        ev.effect(); showToast(ev.msg);
    }

    // === 賭博與投資 ===
    function playCrypto() {
        if (player.money < 10000) { showToast("最少要 $10000 本金！"); return; }
        player.money -= 10000;
        if (Math.random() < 0.1) { player.money += 100000; showToast("🚀 幣圈暴漲！你賺咗 $100,000！"); }
        else { showToast("📉 迷因幣歸零！你輸咗 $10,000..."); }
        closeModal('invest-modal'); updateHUD();
    }
    function openHorseBet() { closeModal('invest-modal'); document.getElementById('horse-modal').style.display = 'flex'; document.getElementById('racing-anim').style.display = 'none'; document.getElementById('horse-buttons').style.display = 'grid'; }
    function betHorse(num) { if (player.money < 500) { showToast("連 $500 都冇！"); return; } player.money -= 500; document.getElementById('horse-buttons').style.display = 'none'; document.getElementById('racing-anim').style.display = 'block'; setTimeout(() => { if (Math.random() < 0.2) { player.money += 2500; showToast(`🐎 ${num}號馬跑第一！贏咗 $2500！`); } else { showToast(`🐎 ${num}號馬跑輸咗...`); } document.getElementById('racing-anim').style.display = 'none'; closeModal('horse-modal'); updateHUD(); updateActionButtons(); }, 1000); }
    function openFootballBet() { closeModal('invest-modal'); document.getElementById('football-modal').style.display = 'flex'; document.getElementById('football-anim').style.display = 'none'; document.getElementById('football-buttons').style.display = 'grid'; }
    function betFootball(choice) { if (player.money < 500) { showToast("連 $500 都冇！"); return; } player.money -= 500; document.getElementById('football-buttons').style.display = 'none'; document.getElementById('football-anim').style.display = 'block'; setTimeout(() => { let res = Math.random(); let actual = res < 0.45 ? 'home' : (res < 0.75 ? 'draw' : 'away'); if (choice === actual) { let winAmt = choice === 'draw' ? 1500 : 1000; player.money += winAmt; showToast(`⚽ 買中咗！贏 $${winAmt}！`); } else { showToast(`⚽ 買錯咗，輸 $500...`); } document.getElementById('football-anim').style.display = 'none'; closeModal('football-modal'); updateHUD(); updateActionButtons(); }, 1000); }
    function playLottery() { if (player.money < 100) { showToast("連 $100 都冇！"); return; } player.money -= 100; if (Math.random() < 0.01) { player.money += 5000000; showToast("🎉 中咗頭獎！500萬！"); } else { showToast("😢 又做善事。"); } closeModal('invest-modal'); updateHUD(); }
    function playStock() { if (player.money < 10000) { showToast("最少要 $10000 本金！"); return; } if (Math.random() < 0.5) { let l = Math.floor(Math.random() * 8000) + 2000; player.money -= l; showToast(`📉 股市大跌！蝕咗 $${l}`); } else { let w = Math.floor(Math.random() * 15000) + 5000; player.money += w; showToast(`📈 股市大升！賺咗 $${w}`); } closeModal('invest-modal'); updateHUD(); }
    function buyInsurance() { if (player.hasInsurance) { showToast("你已經買咗醫保啦！"); closeModal('invest-modal'); return; } if (player.money < 5000) { showToast("唔夠錢！"); return; } player.money -= 5000; player.hasInsurance = true; showToast("🛡️ 成功購買自願醫保！"); closeModal('invest-modal'); updateHUD(); }

    // === 醫院與月結算 ===
    function triggerHospital() {
        if (player.isInHospital) return; player.isInHospital = true;
        let loss = player.hasInsurance ? 0.2 : 0.5; let medFee = Math.floor(player.money * loss);
        player.money -= medFee; player.energy = 100; player.stress = 20; player.health = Math.max(10, player.health - 20);
        document.getElementById('hospital-text').innerHTML = `你暈低咗送院。<br>${player.hasInsurance ? '🛡️ 醫保報銷！扣 20% 身家。' : '⚠️ 無醫保！扣 50% 身家。'}<br><span style="color:#f1c40f;">損失：$${medFee}</span>`;
        document.getElementById('hospital-modal').style.display = 'flex'; speakText("你暈低咗，被強制送院。");
    }
    function closeHospital() { document.getElementById('hospital-modal').style.display = 'none'; player.isInHospital = false; showToast("出院了，保重身體..."); updateHUD(); updateActionButtons(); }

    function checkMonthEnd() {
        currentMonth++;
        if (currentMonth % 3 === 0) { // 每 3 次行動結算一次生活費
            if (player.isBoss) {
                let totalSalary = 0, totalProfit = 0;
                player.staffList.forEach(s => { totalSalary += s.salary; if (s.type === 'sales') totalProfit += (Math.random() < 0.5 ? Math.floor(Math.random() * 40000) : 0); else totalProfit += s.profit; });
                let net = totalProfit - totalSalary - 5000; player.money += net;
                showToast(net > 0 ? `📈 公司月結：淨賺 $${net}` : `📉 公司月結：蝕錢 $${Math.abs(net)}！`);
                if (player.money < 0) { gameOver("公司資金鏈斷裂，你宣佈破產！"); return; }
            } else { if (player.stress > 80) player.health -= 15; }
            
            if (player.mortgage > 0) {
                player.money -= player.mortgage;
                let rentInc = player.properties.reduce((a,b) => a + b.rent, 0);
                player.money += rentInc;
                showToast(`🏠 扣除供樓 $${player.mortgage}，收租 $${rentInc}`);
            }
            if (player.loan > 0) {
                let interest = Math.floor(player.loan * 0.1);
                player.money -= interest;
                showToast(`💸 財仔扣除利息 $${interest}...`);
                if (player.money < 0) { gameOver("你欠落大耳窿巨債，無力償還，被破產收場！"); return; }
            }
            if (player.money < 0) { gameOver("你供唔起樓，被銀行收樓，宣佈破產！"); return; }

            if (Math.random() < 0.2) { showToast("🎉 派花紅！"); player.money += 2000; }
            
            // 每 30 天長一歲
            if (currentDay % 30 === 0) {
                player.age++;
                if (player.age >= 65) gameOver("你終於捱到 65 歲退休，回望過去，不勝唏噓...");
            }
        }
        updateHUD(); 
    }

    function bossPatrolAction() { player.stress = Math.max(0, player.stress - 30); player.mood = Math.min(100, player.mood + 15); showToast("👀 巡視業務，心情舒暢！"); advanceTime(); checkMonthEnd(); updateHUD(); updateActionButtons(); }
    function bossBusinessAction() { if (Math.random() < 0.5) { let p = Math.floor(Math.random() * 30000) + 10000; player.money += p; showToast(`🤝 簽大單！賺咗 $${p}！`); } else { let l = Math.floor(Math.random() * 20000) + 5000; player.money = Math.max(0, player.money - l); showToast(`📉 被客走數！蝕咗 $${l}...`); } advanceTime(); checkMonthEnd(); updateHUD(); updateActionButtons(); }

    function startCompany() {
        if (player.money < 300000) { showToast("資本不足 $300,000！"); return; }
        player.money -= 300000; player.isBoss = true; player.job = '老闆';
        closeModal('company-modal'); sceneEl.className = 'bg-boss'; showToast("🚀 恭喜！你成立咗自己嘅公司！"); updateHUD(); updateActionButtons();
    }

    function generateCandidates() {
        candidates = []; const types = ['intern', 'it', 'sales', 'cleaner'];
        for (let i = 0; i < 3; i++) {
            let t = types[Math.floor(Math.random() * types.length)], name = '', salary = 0, profit = 0, cost = 0;
            if (t === 'intern') { name = '實習生'; salary = 3000; profit = 5000; cost = 5000; }
            else if (t === 'it') { name = 'IT狗'; salary = 10000; profit = 25000; cost = 15000; }
            else if (t === 'sales') { name = '金融Sales'; salary = 6000; profit = -1; cost = 10000; }
            else if (t === 'cleaner') { name = '清潔姐姐'; salary = 4000; profit = 0; cost = 8000; }
            candidates.push({ id: Date.now() + i, type: t, name, salary, profit, cost });
        }
    }
    function openStaffModal() {
        document.getElementById('staff-modal').style.display = 'flex'; generateCandidates();
        let totalSal = 0, totalProf = 0;
        player.staffList.forEach(s => { totalSal += s.salary; if (s.type !== 'sales') totalProf += s.profit; });
        document.getElementById('total-staff').innerText = player.staffList.length;
        document.getElementById('total-salary').innerText = `$${totalSal.toLocaleString()}`;
        document.getElementById('total-profit').innerText = `$${totalProf.toLocaleString()} (Sales未計)`;
        let candList = document.getElementById('candidate-list'); candList.innerHTML = '';
        candidates.forEach((c, i) => {
            let div = document.createElement('div'); div.className = 'staff-card';
            div.innerHTML = `<div class="staff-info"><b>${c.name}</b><small>月薪: $${c.salary} | 利潤: ${c.profit===-1?'隨機':('$'+c.profit)}</small><small>招聘費: $${c.cost}</small></div><button onclick="hireCandidate(${i})" style="background:#2ecc71; border:none; color:#fff; padding:6px 10px; border-radius:5px; cursor:pointer;">聘請</button>`;
            candList.appendChild(div);
        });
        let staffList = document.getElementById('current-staff-list'); staffList.innerHTML = '';
        if (player.staffList.length === 0) { staffList.innerHTML = '<p style="font-size:12px;color:#888;text-align:left;">暫時未有員工。</p>'; }
        player.staffList.forEach((s, i) => {
            let div = document.createElement('div'); div.className = 'staff-card';
            div.innerHTML = `<div class="staff-info"><b>${s.name}</b><small>月薪: $${s.salary}</small></div><button onclick="fireStaff(${i})" style="background:#e74c3c; border:none; color:#fff; padding:6px 10px; border-radius:5px; cursor:pointer;">解僱</button>`;
            staffList.appendChild(div);
        });
    }
    function hireCandidate(index) {
        if (player.staffList.length >= MAX_STAFF) { showToast("公司座位滿咗啦！"); return; }
        let c = candidates[index]; if (player.money < c.cost) { showToast("唔夠錢俾招聘費！"); return; }
        player.money -= c.cost; player.staffList.push({ type: c.type, name: c.name, salary: c.salary, profit: c.profit });
        showToast(`✅ 成功請咗個 ${c.name}！`); updateHUD(); openStaffModal();
    }
    function fireStaff(index) { let staff = player.staffList[index]; player.staffList.splice(index, 1); showToast(`🔥 你炒咗 ${staff.name} 魷魚！`); updateHUD(); openStaffModal(); }

    function updateActionButtons() {
        actionsEl.innerHTML = '';
        if (player.stage !== 'work') return;
        if (!player.isBoss) {
            addActionBtn('💼 努力工作', `每次 +$${Math.floor(player.salary/3)}`, 'work', () => { 
                let info = jobDatabase[player.jobType];
                let earn = Math.floor(player.salary / 3);
                let stressAdd = info.stressCost;
                let energyCost = info.energyCost;
                
                // 時段加成
                if (timeOfDay === 0) { earn = Math.floor(earn * 1.2); stressAdd = Math.floor(stressAdd * 0.8); }
                else if (timeOfDay === 2) { earn = Math.floor(earn * 0.8); stressAdd = Math.floor(stressAdd * 1.2); energyCost = Math.floor(energyCost * 1.1); }
                
                player.money += earn; player.energy -= energyCost; player.stress += stressAdd; player.workCount++; 
                
                advanceTime(); triggerRandomEvent(); checkMonthEnd(); updateHUD(); updateActionButtons(); 
            });
            addActionBtn('📈 申請升職', `需工作 ${(player.promotionLevel+1)*15} 次`, 'buy', askPromotion);
            addActionBtn('🛏️ 睡觉休息', '跳至明早回滿體力', 'rest', () => { 
                player.energy = 100; 
                player.stress = Math.max(0, player.stress - 15); 
                player.mood = Math.min(100, player.mood + 5); 
                
                // 強制跳轉
                currentDay++;
                timeOfDay = 0;
                
                showToast("😴 瞓咗個好覺，第二朝體力回滿！"); 
                checkMonthEnd(); updateHUD(); updateActionButtons(); 
            });
            addActionBtn('🏥 去診所', '花 $2000 回滿體力', 'rest', () => { if(player.money>=2000){player.money -= 2000; player.energy = 100; player.stress = Math.max(0, player.stress - 30);} advanceTime(); checkMonthEnd(); updateHUD(); updateActionButtons(); });
            addActionBtn('🏠 地產/貸款', '買樓/供樓/借財仔', 'buy', openPropertyModal);
            addActionBtn('🛵 兼職', '放工賺外快', 'buy', () => { document.getElementById('parttime-modal').style.display = 'flex'; });
            addActionBtn('💸 終極賭徒', '賭馬/波/幣圈', 'casino', () => { document.getElementById('invest-modal').style.display = 'flex'; });
            if (player.money >= 300000 && player.workCount >= 30) { addActionBtn('🚀 開公司', '辭職創業做老闆！', 'boss', () => { document.getElementById('company-modal').style.display = 'flex'; }); }
        } else {
            addActionBtn('👀 巡視業務', '減壓，視察員工', 'rest', bossPatrolAction);
            addActionBtn('🤝 見客傾生意', '隨機大賺或大蝕', 'work', bossBusinessAction);
            addActionBtn('🏢 員工管理', '請人/炒人擴張版圖', 'boss', openStaffModal);
            addActionBtn('🏠 地產/貸款', '買樓/供樓/借財仔', 'buy', openPropertyModal);
            addActionBtn('💸 終極賭徒', '有錢佬嘅玩意', 'casino', () => { document.getElementById('invest-modal').style.display = 'flex'; });
        }
    }

    function addActionBtn(title, desc, cls, onClick) {
        let btn = document.createElement('button'); btn.className = `action-btn ${cls}`; btn.innerHTML = `${title}<small>${desc}</small>`;
        if (!onClick) btn.classList.add('disabled'); else btn.onclick = onClick;
        actionsEl.appendChild(btn);
    }

    function gameOver(reason) {
        player.stage = 'end'; document.getElementById('end-screen').style.display = 'flex';
        document.getElementById('end-title').innerText = reason.includes("破產") ? "💸 破產收場" : (reason.includes("猝死") ? "💀 過勞死" : "👴 光榮退休");
        document.getElementById('end-stats').innerHTML = `${reason}<br><br>終年：${player.age} 歲<br>最終資產：$${player.money.toLocaleString()}<br>最終身份：${player.isBoss ? '老闆' : '打工仔'}`;
        localStorage.removeItem(SAVE_KEY); speakText(reason);
    }

    window.onload = () => { 
        try {
            if (loadGame() && player.stage === 'work') { 
                document.getElementById('dialogue-box').style.display = 'none'; 
                if(player.isBoss) sceneEl.className = 'bg-boss'; 
                else {
                    if (timeOfDay === 0) sceneEl.className = 'bg-morning';
                    else if (timeOfDay === 1) sceneEl.className = 'bg-noon';
                    else sceneEl.className = 'bg-night';
                }
                updateActionButtons(); 
            } else { player.stage = 'job_select'; player.money = 0; document.getElementById('job-modal').style.display = 'flex'; }
            updateHUD();
        } catch(e) {}
    };
</script>
</body>
</html>
