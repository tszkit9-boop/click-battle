<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>社畜人生：地獄生存版</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;700;900&display=swap');
    
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    
    body {
        background-color: #050510; color: #fff; font-family: 'Noto Sans HK', sans-serif;
        height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
        background: radial-gradient(circle at center, #1a1a2e, #050510);
    }

    .back-btn {
        position: absolute; top: 10px; left: 10px; z-index: 9999;
        padding: 6px 12px; background: rgba(0, 0, 0, 0.8);
        color: #00d2d3; border: 2px solid #00d2d3; border-radius: 8px;
        text-decoration: none; font-weight: bold; font-size: 12px;
        box-shadow: 0 0 10px rgba(0, 210, 211, 0.5); transition: all 0.2s;
        backdrop-filter: blur(5px);
    }
    .back-btn:hover { background: #00d2d3; color: #000; }

    /* 語音開關 */
    .voice-btn {
        position: absolute; top: 10px; right: 10px; z-index: 9999;
        padding: 6px 12px; background: rgba(0, 0, 0, 0.8);
        color: #f1c40f; border: 2px solid #f1c40f; border-radius: 8px;
        text-decoration: none; font-weight: bold; font-size: 16px;
        box-shadow: 0 0 10px rgba(241, 196, 15, 0.5); transition: all 0.2s;
        backdrop-filter: blur(5px); cursor: pointer;
    }

    #game-container {
        flex: 1; position: relative; display: flex; flex-direction: column;
        max-width: 600px; width: 100%; margin: 0 auto; background: #1e1e2f;
        box-shadow: 0 0 30px rgba(0,0,0,0.8); overflow: hidden;
    }

    #hud {
        background: rgba(10, 10, 20, 0.9); padding: 10px; border-bottom: 2px solid #333;
        display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 12px;
        z-index: 10; backdrop-filter: blur(5px);
    }
    .stat-item { display: flex; align-items: center; gap: 8px; }
    .stat-label { width: 45px; font-weight: bold; color: #a4b0be; text-align: right; }
    .stat-bar { flex: 1; height: 12px; background: #111; border-radius: 6px; overflow: hidden; border: 1px solid #333; position: relative; }
    .stat-fill { height: 100%; transition: width 0.3s; border-radius: 5px; }
    .fill-money { background: linear-gradient(90deg, #f1c40f, #f39c12); box-shadow: 0 0 10px #f1c40f; }
    .fill-energy { background: linear-gradient(90deg, #e74c3c, #c0392b); box-shadow: 0 0 10px #e74c3c; }
    .fill-mood { background: linear-gradient(90deg, #3498db, #2980b9); box-shadow: 0 0 10px #3498db; }
    .fill-stress { background: linear-gradient(90deg, #9b59b6, #8e44ad); box-shadow: 0 0 10px #9b59b6; }
    .stat-val { position: absolute; right: 5px; top: 0; font-size: 9px; line-height: 12px; color: #fff; text-shadow: 1px 1px 1px #000; font-weight: bold; }

    #scene {
        flex: 1; position: relative; display: flex; flex-direction: column;
        align-items: center; justify-content: center; overflow: hidden;
        transition: background 0.5s;
    }
    .bg-street { background: linear-gradient(to bottom, #2c3e50, #1a252f); }
    .bg-office { background: linear-gradient(to bottom, #34495e, #1e272e); }
    
    #boss-overlay {
        position: absolute; inset: 0; background: rgba(150, 0, 0, 0.8); z-index: 100;
        display: none; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; padding: 20px; animation: flashRed 0.3s infinite alternate;
    }
    @keyframes flashRed { from { background: rgba(100, 0, 0, 0.8); } to { background: rgba(200, 0, 0, 0.9); } }
    .boss-face { font-size: 100px; margin-bottom: 20px; animation: shake 0.5s infinite; }
    @keyframes shake { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } }
    .boss-text { background: #fff; color: #000; padding: 20px; border-radius: 10px; font-size: 20px; font-weight: 900; border: 4px solid #000; box-shadow: 0 10px 20px rgba(0,0,0,0.5); min-height: 70px; }
    .boss-btn { margin-top: 30px; padding: 15px 40px; background: #000; color: #fff; border: 2px solid #fff; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }

    .dust { position: absolute; background: #fff; border-radius: 50%; opacity: 0.2; animation: floatDust 10s linear infinite; }
    @keyframes floatDust { 0% { transform: translateY(100vh) translateX(0); } 100% { transform: translateY(-10vh) translateX(50px); } }

    #character { position: relative; width: 140px; height: 280px; animation: breathe 2s infinite ease-in-out; z-index: 5; }
    @keyframes breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.02) translateY(-2px); } }
    .head { position: absolute; top: 0; left: 30px; width: 80px; height: 90px; background: #f5cba7; border-radius: 40px 40px 30px 30px; border: 3px solid #000; z-index: 2; overflow: hidden; }
    .hair { position: absolute; top: -5px; left: -5px; width: 90px; height: 40px; background: #2c3e50; border-radius: 40px 40px 0 0; border-bottom: 2px solid #000; }
    .eye { position: absolute; top: 45px; width: 10px; height: 10px; background: #000; border-radius: 50%; animation: blink 4s infinite; }
    .eye-l { left: 20px; } .eye-r { right: 20px; }
    @keyframes blink { 0%, 90%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
    .mouth { position: absolute; top: 70px; left: 35px; width: 10px; height: 4px; background: #000; border-radius: 2px; transition: all 0.3s; }
    .sweat { position: absolute; top: 30px; right: 10px; font-size: 20px; opacity: 0; transition: opacity 0.3s; animation: drop 1s infinite; }
    @keyframes drop { 0% { transform: translateY(0); } 100% { transform: translateY(10px); } }

    .body { position: absolute; top: 90px; left: 20px; width: 100px; height: 120px; background: #2980b9; border-radius: 20px 20px 10px 10px; border: 3px solid #000; z-index: 1; }
    .tie { position: absolute; top: 0; left: 45px; width: 10px; height: 70px; background: #c0392b; border: 1px solid #000; }
    .arm { position: absolute; top: 100px; width: 25px; height: 90px; background: #2980b9; border: 3px solid #000; border-radius: 15px; z-index: 0; }
    .arm-l { left: -10px; animation: moveArm 1s infinite alternate; } 
    .arm-r { right: -10px; animation: moveArm 1s infinite alternate-reverse; }
    @keyframes moveArm { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
    .leg { position: absolute; top: 210px; width: 30px; height: 70px; background: #34495e; border: 3px solid #000; border-radius: 10px; z-index: 0; }
    .leg-l { left: 30px; } .leg-r { right: 30px; }

    #dialogue-box { 
        position: absolute; bottom: 0; left: 0; right: 0; 
        background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.8) 80%, transparent 100%);
        padding: 30px 20px 20px 20px; z-index: 10; display: none; flex-direction: column; gap: 10px;
    }
    #speaker-name { color: #f1c40f; font-weight: bold; font-size: 16px; text-shadow: 0 2px 4px #000; }
    #dialogue-text { font-size: 18px; line-height: 1.6; min-height: 60px; text-shadow: 0 2px 4px #000; letter-spacing: 1px; }
    #choices { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
    .choice-btn { background: rgba(30, 30, 47, 0.9); color: #fff; border: 2px solid #555; border-radius: 8px; padding: 15px; font-size: 14px; text-align: left; cursor: pointer; transition: all 0.1s; font-family: 'Noto Sans HK', sans-serif; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    .choice-btn:active { background: #00d2d3; color: #000; border-color: #00d2d3; transform: scale(0.98); }

    #actions { background: #111; padding: 15px; border-top: 2px solid #333; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; z-index: 10; }
    .action-btn { background: linear-gradient(to bottom, #3498db, #2980b9); color: #fff; border: 2px solid #000; border-radius: 10px; padding: 15px 10px; font-size: 15px; font-weight: bold; cursor: pointer; font-family: 'Noto Sans HK', sans-serif; box-shadow: 0 5px 0 #1c5980; transition: all 0.1s; display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .action-btn:active { transform: translateY(5px); box-shadow: none; }
    .action-btn.work { background: linear-gradient(to bottom, #e67e22, #d35400); box-shadow: 0 5px 0 #a04000; }
    .action-btn.rest { background: linear-gradient(to bottom, #2ecc71, #27ae60); box-shadow: 0 5px 0 #196f3d; }
    .action-btn.buy { background: linear-gradient(to bottom, #9b59b6, #8e44ad); box-shadow: 0 5px 0 #6c3483; }
    .action-btn.disabled { background: #333; box-shadow: 0 5px 0 #111; cursor: not-allowed; color: #666; }
    .action-btn small { font-size: 11px; font-weight: normal; opacity: 0.8; }

    .float-text { position: absolute; font-weight: bold; font-size: 20px; pointer-events: none; animation: floatUp 1s forwards; z-index: 20; text-shadow: 2px 2px 0 #000; }
    @keyframes floatUp { 0% { transform: translateY(0) scale(0.8); opacity: 1; } 100% { transform: translateY(-80px) scale(1.2); opacity: 0; } }
    
    #minigame-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.8); z-index: 30; display: none; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(3px); }
    #minigame-btn { width: 150px; height: 150px; border-radius: 50%; background: #e67e22; border: 5px solid #fff; color: #fff; font-size: 24px; font-weight: bold; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 30px #e67e22; animation: pulseBtn 0.2s infinite alternate; }
    @keyframes pulseBtn { from { transform: scale(1); } to { transform: scale(1.05); } }
    
    #end-screen { position: absolute; inset: 0; background: rgba(5,5,10,0.98); z-index: 50; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
    #end-screen h1 { color: #f1c40f; font-size: 40px; text-shadow: 0 0 20px #f1c40f; margin-bottom: 20px; }
    #end-screen p { font-size: 16px; line-height: 2; margin-bottom: 30px; color: #ccc; }
    #end-screen button { padding: 15px 40px; background: #f1c40f; color: #000; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 0 20px #f1c40f; }
    
    #toast { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.1); border: 1px solid #fff; padding: 10px 20px; border-radius: 20px; font-weight: bold; z-index: 40; opacity: 0; transition: opacity 0.3s; pointer-events: none; text-align: center; backdrop-filter: blur(5px); white-space: nowrap; }
</style>
</head>
<body>

    <a href="../" class="back-btn">⬅ 返回大廳</a>
    <div class="voice-btn" id="voice-toggle" onclick="toggleVoice()">🔊 語音開啟</div>

    <div id="game-container">
        <div id="hud">
            <div class="stat-item"><span class="stat-label">💰 錢</span><div class="stat-bar"><div class="stat-fill fill-money" id="bar-money" style="width: 0%;"></div><span class="stat-val" id="val-money">$0</span></div></div>
            <div class="stat-item"><span class="stat-label">🔋 體力</span><div class="stat-bar"><div class="stat-fill fill-energy" id="bar-energy" style="width: 100%;"></div><span class="stat-val" id="val-energy">100</span></div></div>
            <div class="stat-item"><span class="stat-label">😊 心情</span><div class="stat-bar"><div class="stat-fill fill-mood" id="bar-mood" style="width: 80%;"></div><span class="stat-val" id="val-mood">80</span></div></div>
            <div class="stat-item"><span class="stat-label">🤯 壓力</span><div class="stat-bar"><div class="stat-fill fill-stress" id="bar-stress" style="width: 10%;"></div><span class="stat-val" id="val-stress">10</span></div></div>
        </div>

        <div id="scene" class="bg-street">
            <div id="particles"></div>

            <div id="character">
                <div class="hair"></div>
                <div class="head">
                    <div class="eye eye-l"></div>
                    <div class="eye eye-r"></div>
                    <div class="mouth" id="char-mouth"></div>
                    <div class="sweat" id="char-sweat">💦</div>
                </div>
                <div class="arm arm-l"></div>
                <div class="arm arm-r"></div>
                <div class="body"><div class="tie"></div></div>
                <div class="leg leg-l"></div>
                <div class="leg leg-r"></div>
            </div>

            <div id="dialogue-box">
                <div id="speaker-name">面試官</div>
                <div id="dialogue-text"></div>
                <div id="choices"></div>
            </div>
        </div>

        <div id="actions"></div>
    </div>

    <div id="boss-overlay">
        <div class="boss-face">👹</div>
        <div class="boss-text" id="boss-dialogue"></div>
        <button class="boss-btn" onclick="closeBossOverlay()">知錯喇老細...</button>
    </div>

    <div id="minigame-overlay">
        <h2 style="color:#fff; margin-bottom:20px; font-size:24px;">瘋狂連點賺錢！</h2>
        <div id="minigame-btn">撳！</div>
        <div style="color:#aaa; margin-top:20px;">剩餘時間：<span id="mg-time" style="color:#f1c40f; font-size:24px;">3.0</span>s</div>
    </div>

    <div id="toast">提示訊息</div>

    <div id="end-screen">
        <h1 id="end-title">人生落幕</h1>
        <p id="end-stats"></p>
        <button onclick="location.reload()">重新投胎</button>
    </div>

<script>
    // --- 語音系統 (TTS) ---
    let isVoiceOn = true;
    let voices = [];
    
    function loadVoices() {
        voices = window.speechSynthesis.getVoices();
    }
    if ('speechSynthesis' in window) {
        speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();
    }

    function toggleVoice() {
        isVoiceOn = !isVoiceOn;
        const btn = document.getElementById('voice-toggle');
        if (isVoiceOn) {
            btn.innerText = "🔊 語音開啟";
            btn.style.color = "#f1c40f";
            btn.style.borderColor = "#f1c40f";
        } else {
            btn.innerText = "🔇 語音關閉";
            btn.style.color = "#7f8c8d";
            btn.style.borderColor = "#7f8c8d";
            window.speechSynthesis.cancel(); // 即刻停止講嘢
        }
    }

    function speakText(text, type = 'normal') {
        if (!isVoiceOn || !('speechSynthesis' in window)) return;
        
        window.speechSynthesis.cancel(); // 停止上一句
        
        const utterance = new SpeechSynthesisUtterance(text);
        
        // 優先揀選粵語/廣東話聲音
        let selectedVoice = voices.find(v => v.lang.includes('zh-HK') || v.lang.includes('yue') || v.name.includes('Cantonese'));
        
        // 如果冇粵語，退而求其次揀台灣或大陸中文
        if (!selectedVoice) {
            selectedVoice = voices.find(v => v.lang.includes('zh-TW') || v.lang.includes('zh-CN'));
        }
        
        if (selectedVoice) utterance.voice = selectedVoice;
        
        // 設定語氣
        if (type === 'boss') {
            utterance.pitch = 1.5; // 老細把聲高音啲、激動啲
            utterance.rate = 1.1;  // 語速快
            utterance.volume = 1;
        } else {
            utterance.pitch = 1.0;
            utterance.rate = 0.9;
            utterance.volume = 1;
        }

        window.speechSynthesis.speak(utterance);
    }

    // --- 遊戲狀態 ---
    let player = { age: 22, money: 0, energy: 100, mood: 80, stress: 10, job: '無業', salary: 0, house: '街邊', partner: false, kids: 0, stage: 'interview' };
    let currentMonth = 0;
    let interviewStep = 0;
    let isMinigameActive = false;
    
    let isTyping = false;
    let typingTimeout;
    let fullText = "";
    let typingEl = null;

    const sceneEl = document.getElementById('scene');
    const dialogueBox = document.getElementById('dialogue-box');
    const speakerName = document.getElementById('speaker-name');
    const dialogueText = document.getElementById('dialogue-text');
    const choicesEl = document.getElementById('choices');
    const actionsEl = document.getElementById('actions');
    const charMouth = document.getElementById('char-mouth');
    const charSweat = document.getElementById('char-sweat');
    const minigameOverlay = document.getElementById('minigame-overlay');
    const toastEl = document.getElementById('toast');
    const bossOverlay = document.getElementById('boss-overlay');

    const particlesEl = document.getElementById('particles');
    for(let i=0; i<20; i++) {
        let p = document.createElement('div'); p.className = 'dust';
        p.style.width = Math.random() * 3 + 1 + 'px'; p.style.height = p.style.width;
        p.style.left = Math.random() * 100 + '%'; p.style.animationDuration = (Math.random() * 5 + 5) + 's';
        p.style.animationDelay = (Math.random() * 5) + 's'; particlesEl.appendChild(p);
    }

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        let now = audioCtx.currentTime;
        if (type === 'click') { osc.type = 'sine'; osc.frequency.setValueAtTime(600, now); gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05); osc.start(); osc.stop(now + 0.05); }
        else if (type === 'type') { osc.type = 'square'; osc.frequency.setValueAtTime(800 + Math.random() * 200, now); gain.gain.setValueAtTime(0.02, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03); osc.start(); osc.stop(now + 0.03); }
        else if (type === 'money') { osc.type = 'triangle'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1); gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(); osc.stop(now + 0.1); }
        else if (type === 'bad') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.3); gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3); osc.start(); osc.stop(now + 0.3); }
    }

    function typeWriter(el, text, speed = 40, callback, voiceType = 'normal') {
        clearTimeout(typingTimeout);
        el.innerText = "";
        fullText = text;
        typingEl = el;
        isTyping = true;
        let i = 0;
        
        // 一打字就同步發聲
        speakText(text, voiceType);
        
        function type() {
            if (i < text.length) {
                el.innerText += text.charAt(i);
                i++;
                if (i % 2 === 0) playSound('type');
                typingTimeout = setTimeout(type, speed);
            } else {
                isTyping = false;
                if (callback) callback();
            }
        }
        type();
    }

    document.getElementById('dialogue-box').onclick = () => {
        if (isTyping && typingEl) {
            clearTimeout(typingTimeout);
            typingEl.innerText = fullText;
            isTyping = false;
            if (player.stage === 'interview') {
                let data = interviewData[interviewStep];
                if (data) showChoices(data.choices);
            }
        }
    };

    function showToast(msg) {
        toastEl.innerText = msg; toastEl.style.opacity = 1;
        clearTimeout(window.toastTimer); window.toastTimer = setTimeout(() => { toastEl.style.opacity = 0; }, 2500);
    }

    function updateHUD() {
        document.getElementById('bar-money').style.width = `${Math.min(100, (player.money / 100000) * 100)}%`;
        document.getElementById('val-money').innerText = `$${player.money.toLocaleString()}`;
        document.getElementById('bar-energy').style.width = `${Math.max(0, player.energy)}%`;
        document.getElementById('val-energy').innerText = Math.floor(player.energy);
        document.getElementById('bar-mood').style.width = `${Math.max(0, player.mood)}%`;
        document.getElementById('val-mood').innerText = Math.floor(player.mood);
        document.getElementById('bar-stress').style.width = `${Math.min(100, player.stress)}%`;
        document.getElementById('val-stress').innerText = Math.floor(player.stress);

        if (player.stress > 70 || player.mood < 30) {
            charMouth.style.width = '15px'; charMouth.style.height = '10px'; charMouth.style.borderRadius = '0 0 10px 10px'; charMouth.style.background = '#000';
        } else {
            charMouth.style.width = '10px'; charMouth.style.height = '4px'; charMouth.style.borderRadius = '2px';
        }
        if (player.stress > 80) charSweat.style.opacity = 1; else charSweat.style.opacity = 0;
        if (player.energy <= 0 || player.stress >= 100) gameOver("你因為過度勞累/壓力爆煲，暈低咗送院...");
    }

    function showFloatText(text, color) {
        let el = document.createElement('div'); el.className = 'float-text';
        el.innerText = text; el.style.color = color;
        el.style.left = (40 + Math.random() * 20) + '%'; el.style.top = '40%';
        sceneEl.appendChild(el); setTimeout(() => el.remove(), 1000);
    }

    const interviewData = [
        { speaker: "面試官", text: "你好，請坐。我看你履歷寫住剛畢業。你覺得你最大嘅優點係咩？", 
          choices: [
            { text: "我好捱得！可以通宵加班！", effect: () => { player.job = "初級社畜"; player.salary = 12000; } },
            { text: "我學習能力強，好快上手。", effect: () => { player.job = "見習生"; player.salary = 14000; } },
            { text: "我要求好低，有份工就得。", effect: () => { player.job = "廉價勞工"; player.salary = 10000; } }
          ]
        },
        { speaker: "面試官", text: "如果公司要求你今個星期六日返嚟無薪加班，你會點做？",
          choices: [
            { text: "義不容辭！公司就係我第二個家！", effect: () => { player.salary += 2000; player.stress += 20; } },
            { text: "如果有迫切需要，我可以配合。", effect: () => { player.salary += 1000; player.stress += 10; } },
            { text: "我會按勞工法例爭取應有權益。", effect: () => { player.salary -= 2000; player.mood += 20; } }
          ]
        }
    ];

    function startInterview() {
        player.stage = 'interview'; sceneEl.className = 'bg-street';
        dialogueBox.style.display = 'flex'; actionsEl.style.display = 'none';
        interviewStep = 0; showInterviewStep();
    }

    function showInterviewStep() {
        if (interviewStep >= interviewData.length) {
            dialogueBox.style.display = 'none'; actionsEl.style.display = 'grid';
            player.stage = 'work'; player.money += 5000; player.house = '深水埗劏房 ($4000/月)';
            sceneEl.className = 'bg-office'; showToast(`恭喜你成為「${player.job}」！月薪 $${player.salary}`);
            speakText(`恭喜你成為${player.job}，月薪${player.salary}元！`, 'normal');
            updateActionButtons(); return;
        }
        let data = interviewData[interviewStep];
        speakerName.innerText = data.speaker; 
        choicesEl.innerHTML = '';
        
        typeWriter(dialogueText, data.text, 40, () => {
            showChoices(data.choices);
        }, 'normal');
    }

    function showChoices(choices) {
        choicesEl.innerHTML = '';
        choices.forEach(choice => {
            let btn = document.createElement('button'); btn.className = 'choice-btn'; btn.innerText = choice.text;
            btn.onclick = (e) => { 
                e.stopPropagation(); 
                playSound('click'); 
                speakText(choice.text, 'normal'); // 你答嘢把聲
                setTimeout(() => { choice.effect(); interviewStep++; showInterviewStep(); }, 800);
            };
            choicesEl.appendChild(btn);
        });
    }

    function updateActionButtons() {
        actionsEl.innerHTML = '';
        if (player.stage === 'work') {
            addActionBtn('💼 努力工作', '連點賺錢', 'work', player.energy > 10 ? () => startMinigame() : null);
            addActionBtn('🐟 帶薪摸魚', '回復心情', 'rest', player.stress > 0 ? () => fishAction() : null);
            if (player.energy > 20) addActionBtn('🍜 食頹飯', '花 $50 回體力', 'buy', () => eatAction());
            else addActionBtn('😴 瞓街邊', '無錢，瞓街回體力', 'buy', () => sleepStreetAction());
            
            if (player.money >= 4000) addActionBtn('🏠 交租', '每月必須支出', 'buy', () => payRentAction());
            if (!player.partner && player.money >= 10000 && player.mood > 50) addActionBtn('💖 去聯誼', '花 $10000 脫單', 'buy', () => findPartnerAction());
            if (player.partner && player.kids === 0 && player.money >= 50000) addActionBtn('👶 生仔', '花 $50000 組織家庭', 'buy', () => haveKidAction());
            if (player.money >= 100000 && player.house.includes('劏房')) addActionBtn('🏡 買樓', '花 $100000 上車', 'buy', () => buyHouseAction());
        }
    }

    function addActionBtn(title, desc, cls, onClick) {
        let btn = document.createElement('button');
        btn.className = `action-btn ${cls}`;
        btn.innerHTML = `${title}<small>${desc}</small>`;
        if (!onClick) btn.classList.add('disabled');
        else btn.onclick = () => { playSound('click'); onClick(); };
        actionsEl.appendChild(btn);
    }

    function triggerBossAnger() {
        const bossLines = [
            "你係咪好得閒呀？", 
            "唔想做就出聲啦！", 
            "今個月份糧扣一半！", 
            "死啦你，份 Report 未交呀！",
            "我出糧俾你係叫你返嚟玩㗎？"
        ];
        let line = bossLines[Math.floor(Math.random() * bossLines.length)];
        
        bossOverlay.style.display = 'flex';
        typeWriter(document.getElementById('boss-dialogue'), line, 50, null, 'boss');
        
        playSound('bad');
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    }

    function closeBossOverlay() {
        bossOverlay.style.display = 'none';
        playSound('click');
    }

    function startMinigame() {
        if (isMinigameActive) return;
        isMinigameActive = true; minigameOverlay.style.display = 'flex';
        let clicks = 0; let timeLeft = 3.0;
        const mgBtn = document.getElementById('minigame-btn'); const mgTime = document.getElementById('mg-time');
        let timer = setInterval(() => {
            timeLeft -= 0.1; mgTime.innerText = Math.max(0, timeLeft).toFixed(1);
            if (timeLeft <= 0) {
                clearInterval(timer); minigameOverlay.style.display = 'none'; isMinigameActive = false; finishWork(clicks);
            }
        }, 100);
        mgBtn.onclick = (e) => {
            e.preventDefault(); clicks++; playSound('click');
            mgBtn.style.transform = 'scale(0.9)'; setTimeout(() => mgBtn.style.transform = 'scale(1)', 50);
        };
    }

    function finishWork(clicks) {
        let earn = Math.floor((player.salary / 2) * (clicks / 20));
        if (clicks > 40) { showToast("🔥 爆Seed！老細讚你！"); earn *= 1.5; }
        else if (clicks < 10) { showToast("😪 你太慢喇，老細𥄫住你！"); earn *= 0.5; }
        player.money += earn; player.energy -= 30; player.stress += 20; player.mood -= 10;
        playSound('money'); showFloatText(`+$${earn}`, '#f1c40f'); showFloatText(`-30 🔋`, '#e74c3c');
        checkMonthEnd(); updateHUD(); updateActionButtons();
    }

    function fishAction() {
        let caught = Math.random() < 0.4;
        if (caught) {
            triggerBossAnger();
            player.money = Math.max(0, player.money - 1000);
            player.stress += 30; player.mood -= 20;
            showFloatText(`- $1000`, '#e74c3c');
        } else {
            player.stress = Math.max(0, player.stress - 30); player.mood = Math.min(100, player.mood + 20); player.energy = Math.min(100, player.energy + 10);
            showToast("🐟 帶薪摸魚成功！真爽！"); showFloatText(`-30 🤯`, '#9b59b6');
        }
        checkMonthEnd(); updateHUD(); updateActionButtons();
    }

    function eatAction() {
        if (player.money < 50) return; player.money -= 50; player.energy = Math.min(100, player.energy + 40); player.mood += 5;
        playSound('click'); showFloatText(`- $50`, '#f1c40f'); showFloatText(`+40 🔋`, '#e74c3c');
        updateHUD(); updateActionButtons();
    }

    function sleepStreetAction() {
        player.energy = Math.min(100, player.energy + 15); player.mood -= 10; player.stress += 10;
        playSound('bad'); showFloatText(`+15 🔋`, '#e74c3c');
        checkMonthEnd(); updateHUD(); updateActionButtons();
    }

    function payRentAction() {
        if (player.money < 4000) {
            showToast("業主趕你走！你變咗無家可歸...");
            player.money = 0; player.house = '無家可歸'; player.stress += 50; return;
        }
        player.money -= 4000; playSound('bad'); showFloatText(`- $4000 租`, '#e74c3c');
        updateHUD(); updateActionButtons();
    }

    function findPartnerAction() {
        player.money -= 10000; player.partner = true; player.mood = 100; player.stress = Math.max(0, player.stress - 20);
        playSound('money'); showToast("🎉 恭喜！你成功脫單！");
        updateHUD(); updateActionButtons();
    }

    function haveKidAction() {
        player.money -= 50000; player.kids++; player.stress += 30; player.mood += 20;
        playSound('money'); showToast("👶 恭喜生咗個小朋友！不過養育開支好大...");
        updateHUD(); updateActionButtons();
    }

    function buyHouseAction() {
        player.money -= 100000; player.house = '私人屋苑 (業主)'; player.mood += 50; player.stress = Math.max(0, player.stress - 50);
        playSound('money'); showToast("🏡 太感動啦！你終於上車做業主！");
        updateHUD(); updateActionButtons();
    }

    function checkMonthEnd() {
        currentMonth++;
        if (currentMonth % 3 === 0) {
            player.age++;
            let rand = Math.random();
            if (rand < 0.2) { showToast("⚠️ 老細要求週末返工，壓力大增！"); player.stress += 20; player.mood -= 15; }
            else if (rand < 0.4) { showToast("🎉 公司派花紅！"); player.money += 2000; }
            else if (rand < 0.5) { showToast("💸 同事借錢唔還！"); player.money = Math.max(0, player.money - 500); }
            if (player.age >= 65) gameOver("你終於捱到 65 歲退休，回望過去，不勝唏噓...");
        }
    }

    function gameOver(reason) {
        player.stage = 'end'; dialogueBox.style.display = 'none'; actionsEl.style.display = 'none';
        document.getElementById('end-screen').style.display = 'flex';
        let endingTitle = "👴 光榮退休";
        if (player.stress >= 100 || player.energy <= 0) endingTitle = "💀 過勞死";
        if (player.money < 0) endingTitle = "💸 破產邊緣";
        if (player.mood < 20) endingTitle = "😔 抑鬱終老";
        document.getElementById('end-title').innerText = endingTitle;
        let partnerText = player.partner ? "有老伴陪伴" : "孤獨終老";
        let houseText = player.house.includes('業主') ? "成功上車做業主" : "一生租樓/露宿街頭";
        let kidText = player.kids > 0 ? `有 ${player.kids} 個仔女` : "無兒無女";
        document.getElementById('end-stats').innerHTML = `
            ${reason}<br><br>終年：${player.age} 歲<br>最終資產：$${player.money.toLocaleString()}<br>
            居住：${houseText}<br>感情：${partnerText}<br>家庭：${kidText}<br>職位：${player.job}
        `;
    }

    window.onload = () => { updateHUD(); startInterview(); };
</script>
</body>
</html>
