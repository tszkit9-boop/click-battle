<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>一筆定生死</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { overscroll-behavior: none; }
    body { background-color: #050510; color: #c5c6c7; font-family: 'Orbitron', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100dvh; overflow: hidden; touch-action: none; }
    
    #game-container { position: relative; width: 100%; max-width: 900px; aspect-ratio: 9/5; }
    canvas { background-color: #0a0a1a; border: 2px solid #1f2833; box-shadow: 0 0 30px rgba(0,210,211,0.2), inset 0 0 50px rgba(0,0,0,0.8); width: 100%; height: 100%; display: block; }

    #hud { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 80%; max-width: 600px; display: flex; flex-direction: column; align-items: center; pointer-events: none; z-index: 5; }
    .bar-container { width: 100%; height: 12px; background: rgba(255,255,255,0.1); border-radius: 6px; overflow: hidden; border: 1px solid rgba(0,210,211,0.3); box-shadow: 0 0 10px rgba(0,210,211,0.2); }
    #energy-bar { height: 100%; width: 100%; background: linear-gradient(90deg, #00d2d3, #66fcf1); box-shadow: 0 0 10px #00d2d3; transition: width 0.1s; }
    #hud-text { margin-top: 5px; font-size: 12px; color: #66fcf1; text-shadow: 0 0 5px #66fcf1; letter-spacing: 2px; font-weight: bold; }

    #msg { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); color: #a4b0be; font-size: 12px; letter-spacing: 1px; z-index: 5; pointer-events: none; text-align: center; }

    .overlay { position: absolute; inset: 0; background: rgba(5,5,16,0.96); display: none; flex-direction: column; align-items: center; justify-content: center; color: #fff; text-align: center; z-index: 10; padding: 20px; overflow-y: auto; }
    .overlay.active { display: flex; }

    .menu-btn { width: 220px; padding: 14px; margin: 6px 0; background: transparent; color: #00d2d3; border: 2px solid #00d2d3; font-family: 'Orbitron', sans-serif; cursor: pointer; font-size: 14px; font-weight: bold; letter-spacing: 2px; box-shadow: 0 0 15px rgba(0,210,211,0.4), inset 0 0 15px rgba(0,210,211,0.2); transition: all 0.2s; }
    .menu-btn:hover, .menu-btn:active { background: #00d2d3; color: #000; box-shadow: 0 0 30px #00d2d3; }
    .menu-btn.danger { color: #ff4757; border-color: #ff4757; box-shadow: 0 0 15px rgba(255,71,87,0.4); }
    .menu-btn.danger:hover { background: #ff4757; color: #fff; box-shadow: 0 0 30px #ff4757; }

    .title-main { font-size: 32px; color: #66fcf1; text-shadow: 0 0 30px #66fcf1, 0 0 60px #00d2d3; letter-spacing: 6px; margin-bottom: 8px; }
    .subtitle { font-size: 12px; color: #a4b0be; letter-spacing: 3px; margin-bottom: 30px; }

    .intro-box { max-width: 500px; background: rgba(0,210,211,0.05); border: 1px solid rgba(0,210,211,0.3); border-radius: 12px; padding: 18px; margin-bottom: 20px; text-align: left; font-size: 12px; line-height: 1.9; }
    .intro-box .step { display: flex; gap: 10px; margin-bottom: 8px; }
    .intro-box .num { color: #66fcf1; font-weight: bold; min-width: 24px; }

    .select-title { font-size: 20px; color: #66fcf1; letter-spacing: 4px; margin-bottom: 20px; }

    .diff-row { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
    .diff-btn { padding: 12px 20px; background: transparent; color: #a4b0be; border: 2px solid #555; font-family: 'Orbitron', sans-serif; cursor: pointer; font-size: 12px; font-weight: bold; border-radius: 8px; transition: all 0.2s; }
    .diff-btn.active { color: #000; background: #66fcf1; border-color: #66fcf1; box-shadow: 0 0 15px #66fcf1; }

    .level-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 400px; margin-bottom: 20px; }
    .level-btn { padding: 15px 5px; background: transparent; color: #a4b0be; border: 2px solid #333; font-family: 'Orbitron', sans-serif; cursor: pointer; font-size: 14px; font-weight: bold; border-radius: 8px; transition: all 0.2s; }
    .level-btn.unlocked { color: #66fcf1; border-color: #66fcf1; }
    .level-btn.unlocked:hover, .level-btn.unlocked:active { background: #66fcf1; color: #000; }
    .level-btn.locked { opacity: 0.35; cursor: not-allowed; }
    .level-btn.current { background: rgba(102,252,241,0.2); }

    .list-box { width: 100%; max-width: 500px; background: rgba(0,210,211,0.05); border: 1px solid rgba(0,210,211,0.3); border-radius: 10px; padding: 15px; max-height: 60vh; overflow-y: auto; }
    .list-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(0,210,211,0.1); font-size: 12px; }
    .list-row:last-child { border-bottom: none; }
    .list-row.locked { opacity: 0.4; }
    .list-row .name { color: #c5c6c7; }
    .list-row .value { color: #66fcf1; font-weight: bold; }
    .list-row .badge { color: #ffd32a; }

    .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid rgba(0,210,211,0.1); font-size: 13px; width: 100%; max-width: 350px; }
    .toggle { width: 50px; height: 26px; background: #333; border-radius: 13px; position: relative; cursor: pointer; transition: background 0.2s; }
    .toggle.on { background: #00d2d3; }
    .toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; background: #fff; border-radius: 50%; transition: left 0.2s; }
    .toggle.on::after { left: 27px; }

    .back-link { position: absolute; top: 10px; left: 10px; padding: 6px 12px; background: rgba(5,5,16,0.8); color: #66fcf1; border: 2px solid #66fcf1; border-radius: 6px; text-decoration: none; font-family: 'Orbitron', sans-serif; font-weight: bold; font-size: 12px; box-shadow: 0 0 10px rgba(102,252,241,0.5); z-index: 100; cursor: pointer; }
    .back-link:hover { background: #66fcf1; color: #000; }

    #toast { position: absolute; top: 30%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); border: 2px solid #66fcf1; padding: 12px 20px; border-radius: 10px; color: #66fcf1; font-size: 13px; z-index: 200; opacity: 0; transition: opacity 0.3s; pointer-events: none; text-align: center; max-width: 80%; }

    #game-canvas-wrap { position: relative; width: 100%; height: 100%; }
</style>
</head>
<body>

<div id="game-container">
    <div id="game-canvas-wrap">
        <canvas id="gameCanvas" width="900" height="500"></canvas>
        
        <div id="hud" style="display:none;">
            <div class="bar-container"><div id="energy-bar"></div></div>
            <div id="hud-text">ENERGY: 100%</div>
        </div>

        <div id="msg" style="display:none;"></div>

        <!-- 主選單 -->
        <div id="menu-overlay" class="overlay active">
            <div class="title-main">一筆定生死</div>
            <div class="subtitle">ONE STROKE · ONE LIFE</div>
            <button class="menu-btn" onclick="showIntro()">📖 遊戲簡介</button>
            <button class="menu-btn" onclick="showLevelSelect()">🎯 開始挑戰</button>
            <button class="menu-btn" onclick="showAchievements()">🏆 成就</button>
            <button class="menu-btn" onclick="showStats()">📊 統計</button>
            <button class="menu-btn" onclick="showLeaderboard()">👑 排行榜</button>
            <button class="menu-btn" onclick="showSettings()">⚙️ 設定</button>
        </div>

        <!-- 簡介 -->
        <div id="intro-overlay" class="overlay">
            <div class="select-title">📖 遊戲簡介</div>
            <div class="intro-box">
                <div class="step"><span class="num">1.</span><span>按住畫面左方嘅<span style="color:#00d2d3;">藍色起點</span>開始畫線。</span></div>
                <div class="step"><span class="num">2.</span><span>放手後，能量球會沿住你畫嘅軌跡移動。</span></div>
                <div class="step"><span class="num">3.</span><span>避開<span style="color:#ff4757;">紅色能量晶體</span>，撞到即失敗。</span></div>
                <div class="step"><span class="num">4.</span><span>成功進入<span style="color:#2ed573;">綠色傳送門</span>即可過關。</span></div>
                <div class="step"><span class="num">5.</span><span>能量有限，用最少能量過關可獲更高評價。</span></div>
                <div class="step"><span class="num">6.</span><span>每關設有<span style="color:#ffd32a;">移動 / 旋轉障礙物</span>，越後越難。</span></div>
            </div>
            <button class="menu-btn" onclick="backToMenu()">⬅ 返回</button>
        </div>

        <!-- 選擇難度 + 關卡 -->
        <div id="level-overlay" class="overlay">
            <div class="select-title">🎯 選擇難度</div>
            <div class="diff-row">
                <button class="diff-btn" data-diff="easy" onclick="setDifficulty('easy')">簡單</button>
                <button class="diff-btn active" data-diff="normal" onclick="setDifficulty('normal')">普通</button>
                <button class="diff-btn" data-diff="hard" onclick="setDifficulty('hard')">困難</button>
            </div>
            <div class="select-title" style="font-size:16px;">🗺️ 選擇關卡</div>
            <div class="level-grid" id="level-grid"></div>
            <div style="font-size:11px; color:#a4b0be; margin-bottom:15px;" id="unlock-hint"></div>
            <button class="menu-btn" onclick="backToMenu()">⬅ 返回</button>
        </div>

        <!-- 成就 -->
        <div id="achievements-overlay" class="overlay">
            <div class="select-title">🏆 成就</div>
            <div class="list-box" id="achievements-list"></div>
            <button class="menu-btn" style="margin-top:20px;" onclick="backToMenu()">⬅ 返回</button>
        </div>

        <!-- 統計 -->
        <div id="stats-overlay" class="overlay">
            <div class="select-title">📊 統計</div>
            <div class="list-box" id="stats-list"></div>
            <button class="menu-btn" style="margin-top:20px;" onclick="backToMenu()">⬅ 返回</button>
        </div>

        <!-- 排行榜 -->
        <div id="leaderboard-overlay" class="overlay">
            <div class="select-title">👑 排行榜</div>
            <div class="list-box" id="leaderboard-list"></div>
            <button class="menu-btn" style="margin-top:20px;" onclick="backToMenu()">⬅ 返回</button>
        </div>

        <!-- 設定 -->
        <div id="settings-overlay" class="overlay">
            <div class="select-title">⚙️ 設定</div>
            <div class="setting-row">
                <span>🔊 音效</span>
                <div class="toggle on" id="toggle-sound" onclick="toggleSetting('sound')"></div>
            </div>
            <div class="setting-row">
                <span>📳 震動</span>
                <div class="toggle on" id="toggle-vibrate" onclick="toggleSetting('vibrate')"></div>
            </div>
            <div class="setting-row">
                <span>💡 提示光暈</span>
                <div class="toggle on" id="toggle-glow" onclick="toggleSetting('glow')"></div>
            </div>
            <div class="setting-row">
                <span>🗑️ 重置進度</span>
                <button class="menu-btn danger" style="width:auto; padding:6px 15px; margin:0; font-size:11px;" onclick="resetProgress()">重置</button>
            </div>
            <button class="menu-btn" style="margin-top:20px;" onclick="backToMenu()">⬅ 返回</button>
        </div>

        <!-- 關卡結束 -->
        <div id="end-overlay" class="overlay">
            <div id="end-title" style="font-size:24px; color:#2ed573; text-shadow:0 0 20px #2ed573; letter-spacing:4px; margin-bottom:15px;">MISSION CLEAR</div>
            <div id="end-msg" style="font-size:13px; color:#a4b0be; margin-bottom:20px;"></div>
            <div id="end-stars" style="font-size:32px; margin-bottom:20px; letter-spacing:8px;"></div>
            <div id="end-stats" style="font-size:12px; color:#c5c6c7; margin-bottom:20px; line-height:1.8;"></div>
            <button class="menu-btn" id="end-next-btn" onclick="nextLevel()">下一關</button>
            <button class="menu-btn" onclick="retryLevel()">🔄 重試</button>
            <button class="menu-btn" onclick="showLevelSelect()">🗺️ 選關</button>
            <button class="menu-btn danger" onclick="backToMenu()">🏠 主選單</button>
        </div>

        <!-- 遊戲中嘅返回按鈕 -->
        <button class="back-link" id="game-back-btn" style="display:none;" onclick="quitLevel()">⬅ 退出</button>

        <div id="toast"></div>
    </div>
</div>

<script>
// ============================================================
// 全局設定
// ============================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const energyBar = document.getElementById('energy-bar');
const hudText = document.getElementById('hud-text');
const msg = document.getElementById('msg');
const toast = document.getElementById('toast');

const SAVE_KEY = 'oneStroke_v2_save';

// 設定物件（預設值）
let settings = {
    sound: true,
    vibrate: true,
    glow: true
};

// 遊戲存檔
let save = {
    unlockedLevel: 1,
    bestPerLevel: {},   // { levelId: { energy, stars } }
    stats: {
        plays: 0,
        wins: 0,
        totalEnergy: 0,
        bestEnergy: Infinity
    },
    achievements: {},
    leaderboard: [],    // [{ name, level, energy, date }]
    difficulty: 'normal'
};

// ============================================================
// 音效系統（Web Audio 合成）
// ============================================================
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch(e) { audioCtx = null; }
    }
}

function playTone(freq, duration, type = 'sine', volume = 0.15) {
    if (!settings.sound) return;
    initAudio();
    if (!audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
}

const SFX = {
    click: () => playTone(800, 0.08, 'square', 0.1),
    start: () => { playTone(400, 0.15, 'sine'); setTimeout(() => playTone(600, 0.15, 'sine'), 100); },
    draw: () => playTone(1200, 0.03, 'sine', 0.05),
    win: () => { playTone(600, 0.15); setTimeout(() => playTone(800, 0.15), 150); setTimeout(() => playTone(1000, 0.3), 300); },
    lose: () => { playTone(300, 0.2, 'sawtooth'); setTimeout(() => playTone(200, 0.2, 'sawtooth'), 200); setTimeout(() => playTone(100, 0.4, 'sawtooth'), 400); },
    achievement: () => { playTone(1000, 0.1); setTimeout(() => playTone(1200, 0.1), 100); setTimeout(() => playTone(1500, 0.2), 200); }
};

function vibrate(pattern) {
    if (settings.vibrate && navigator.vibrate) navigator.vibrate(pattern);
}

// ============================================================
// 關卡資料
// ============================================================
const LEVELS = [
    {
        id: 1,
        name: '初次接觸',
        maxEnergy: 1200,
        start: { x: 80, y: 250 },
        goal: { x: 780, y: 220, w: 60, h: 60 },
        obstacles: [
            { type: 'static', x: 350, y: 100, w: 60, h: 300 }
        ]
    },
    {
        id: 2,
        name: '雙重考驗',
        maxEnergy: 1300,
        start: { x: 80, y: 250 },
        goal: { x: 780, y: 220, w: 60, h: 60 },
        obstacles: [
            { type: 'static', x: 300, y: 100, w: 50, h: 200 },
            { type: 'static', x: 500, y: 200, w: 50, h: 200 }
        ]
    },
    {
        id: 3,
        name: '移動迷宮',
        maxEnergy: 1400,
        start: { x: 80, y: 250 },
        goal: { x: 780, y: 220, w: 60, h: 60 },
        obstacles: [
            { type: 'static', x: 300, y: 0, w: 50, h: 180 },
            { type: 'moving', x: 500, y: 200, w: 60, h: 150, moveY: true, minY: 100, maxY: 350, speed: 2 },
            { type: 'static', x: 650, y: 320, w: 50, h: 180 }
        ]
    },
    {
        id: 4,
        name: '旋轉陷阱',
        maxEnergy: 1500,
        start: { x: 80, y: 250 },
        goal: { x: 780, y: 220, w: 60, h: 60 },
        obstacles: [
            { type: 'static', x: 350, y: 0, w: 50, h: 200 },
            { type: 'rotate', cx: 500, cy: 250, size: 120, speed: 0.02 },
            { type: 'static', x: 650, y: 300, w: 50, h: 200 }
        ]
    },
    {
        id: 5,
        name: '最終審判',
        maxEnergy: 1600,
        start: { x: 80, y: 250 },
        goal: { x: 780, y: 220, w: 60, h: 60 },
        obstacles: [
            { type: 'static', x: 250, y: 0, w: 50, h: 150 },
            { type: 'moving', x: 400, y: 150, w: 60, h: 200, moveY: true, minY: 50, maxY: 350, speed: 3 },
            { type: 'rotate', cx: 600, cy: 250, size: 100, speed: 0.03 },
            { type: 'static', x: 750, y: 0, w: 50, h: 150 }
        ]
    }
];

// 隨機生成第 6 關之後
function generateLevel(levelId) {
    const seed = levelId * 9973;
    const rng = (i) => {
        let x = Math.sin(seed + i) * 10000;
        return x - Math.floor(x);
    };
    const maxEnergy = 1600 + (levelId - 5) * 80;
    const start = { x: 80, y: 250 };
    const goal = { x: 780, y: 220, w: 60, h: 60 };
    const obstacles = [];
    const count = Math.min(6, 3 + Math.floor((levelId - 5) / 2));
    
    for (let i = 0; i < count; i++) {
        const typeRoll = rng(i * 5 + 1);
        const x = 200 + rng(i * 5 + 2) * 500;
        const y = rng(i * 5 + 3) * 300;
        const w = 40 + rng(i * 5 + 4) * 40;
        const h = 100 + rng(i * 5 + 5) * 200;
        
        if (typeRoll < 0.5) {
            obstacles.push({ type: 'static', x, y, w, h });
        } else if (typeRoll < 0.8) {
            obstacles.push({ type: 'moving', x, y, w, h, moveY: true, minY: 20, maxY: 400, speed: 1.5 + rng(i) * 2 });
        } else {
            obstacles.push({ type: 'rotate', cx: x + w/2, cy: y + h/2, size: 80 + rng(i) * 60, speed: 0.02 + rng(i + 10) * 0.02 });
        }
    }
    return {
        id: levelId,
        name: `隨機關卡 ${levelId}`,
        maxEnergy,
        start,
        goal,
        obstacles
    };
}

function getLevel(levelId) {
    if (levelId <= LEVELS.length) return JSON.parse(JSON.stringify(LEVELS[levelId - 1]));
    return generateLevel(levelId);
}

// ============================================================
// 成就系統
// ============================================================
const ACHIEVEMENTS = [
    { id: 'first_win', name: '初次勝利', desc: '完成第 1 關', icon: '🎖️' },
    { id: 'level_3', name: '三關達成', desc: '完成第 3 關', icon: '🥉' },
    { id: 'level_5', name: '五關全破', desc: '完成第 5 關', icon: '🥈' },
    { id: 'level_10', name: '十關達人', desc: '完成第 10 關', icon: '🥇' },
    { id: 'no_damage', name: '完美主義', desc: '用少於 50% 能量完成任何關卡', icon: '✨' },
    { id: 'speed_run', name: '閃電快手', desc: '用少於 20 秒完成任何關卡', icon: '⚡' },
    { id: 'perfect_3', name: '完美三星', desc: '任何關卡獲得 3 星', icon: '⭐' },
    { id: 'all_stars', name: '全星收集', desc: '所有關卡（1-5）都獲得 3 星', icon: '🌟' },
    { id: '100_plays', name: '百戰不殆', desc: '遊玩 100 次', icon: '💯' },
    { id: 'hard_win', name: '困難模式', desc: '在困難模式完成任何關卡', icon: '💀' },
    { id: 'first_death', name: '初次陣亡', desc: '第一次失敗', icon: '☠️' },
    { id: 'comeback', name: '東山再起', desc: '失敗後立即重試並成功', icon: '🔥' }
];

// ============================================================
// 遊戲狀態
// ============================================================
let currentLevel = null;
let path = [];
let isDrawing = false;
let currentEnergyUsed = 0;
let player = { x: 0, y: 0, radius: 8 };
let distanceTraveled = 0;
let gameState = 'idle';
let particles = [];
let stars = [];
let shakeTime = 0;
let goalAngle = 0;
let trail = [];
let obstacleStates = [];
let levelStartTime = 0;
let justFailed = false;
let lastFailedLevel = 0;

// ============================================================
// 存檔
// ============================================================
function loadSave() {
    try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (raw) {
            const data = JSON.parse(raw);
            save = Object.assign(save, data);
            if (!save.stats) save.stats = { plays: 0, wins: 0, totalEnergy: 0, bestEnergy: Infinity };
            if (!save.bestPerLevel) save.bestPerLevel = {};
            if (!save.achievements) save.achievements = {};
            if (!save.leaderboard) save.leaderboard = [];
        }
    } catch(e) {}
    if (!save.difficulty) save.difficulty = 'normal';
    updateDifficultyButtons();
}

function persist() {
    try {
        localStorage.setItem(SAVE_KEY, JSON.stringify(save));
    } catch(e) {}
}

function resetProgress() {
    if (!confirm('確定要重置所有進度嗎？呢個動作不能復原！')) return;
    localStorage.removeItem(SAVE_KEY);
    save = {
        unlockedLevel: 1,
        bestPerLevel: {},
        stats: { plays: 0, wins: 0, totalEnergy: 0, bestEnergy: Infinity },
        achievements: {},
        leaderboard: [],
        difficulty: 'normal'
    };

    showToast('✅ 進度已重置');
    backToMenu();
}

// ============================================================
// 難度調整
// ============================================================
function applyDifficulty(level) {
    const lvl = JSON.parse(JSON.stringify(level));
    const mult = save.difficulty === 'easy' ? 0.8 : save.difficulty === 'hard' ? 1.3 : 1;
    
    lvl.maxEnergy = Math.floor(lvl.maxEnergy * mult);
    
    if (save.difficulty === 'hard') {
        lvl.obstacles.forEach(o => {
            if (o.type === 'moving') o.speed = (o.speed || 2) * 1.5;
            if (o.type === 'rotate') o.speed = (o.speed || 0.02) * 1.5;
        });
    }
    return lvl;
}

// ============================================================
// 開始關卡
// ============================================================
function startLevel(levelId) {
    SFX.start();
    vibrate(30);
    justFailed = false;
    
    const level = getLevel(levelId);
    currentLevel = applyDifficulty(level);
    
    // 初始化障礙物狀態
    obstacleStates = currentLevel.obstacles.map(o => {
        if (o.type === 'moving') {
            return { ...o, currentY: o.y, dir: 1 };
        }
        if (o.type === 'rotate') {
            return { ...o, angle: 0 };
        }
        return { ...o };
    });
    
    document.querySelectorAll('.overlay').forEach(el => el.classList.remove('active'));
    document.getElementById('hud').style.display = 'flex';
    document.getElementById('msg').style.display = 'block';
    document.getElementById('game-back-btn').style.display = 'block';
    
    resetLevel();
    gameState = 'idle';
    levelStartTime = Date.now();
    save.stats.plays++;
    persist();
}

function resetLevel() {
    path = [];
    trail = [];
    particles = [];
    isDrawing = false;
    currentEnergyUsed = 0;
    player.x = currentLevel.start.x;
    player.y = currentLevel.start.y;
    distanceTraveled = 0;
    shakeTime = 0;
    updateHUD(currentLevel.maxEnergy);
    msg.innerHTML = "按住藍色起點開始繪畫...";
    msg.style.color = "#a4b0be";
}

function updateHUD(energy) {
    const pct = Math.max(0, (energy / currentLevel.maxEnergy) * 100);
    energyBar.style.width = pct + '%';
    hudText.innerText = `ENERGY: ${Math.round(pct)}%`;
    if (pct < 30) {
        energyBar.style.background = 'linear-gradient(90deg, #ff4757, #ff6b81)';
        energyBar.style.boxShadow = '0 0 10px #ff4757';
    } else {
        energyBar.style.background = 'linear-gradient(90deg, #00d2d3, #66fcf1)';
        energyBar.style.boxShadow = '0 0 10px #00d2d3';
    }
}

// ============================================================
// 輸入
// ============================================================
function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    let clientX = e.clientX, clientY = e.clientY;
    if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
    }
    return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
    };
}

function handleDown(e) {
    if (gameState !== 'idle') return;
    if (e.cancelable) e.preventDefault();
    const pos = getPos(e);
    const dist = Math.hypot(pos.x - currentLevel.start.x, pos.y - currentLevel.start.y);
    if (dist < 60) {
        isDrawing = true;
        gameState = 'drawing';
        path = [{ x: currentLevel.start.x, y: currentLevel.start.y }];
        currentEnergyUsed = 0;
        msg.innerHTML = "正在繪製能量軌跡...";
        SFX.draw();
    }
}

function handleMove(e) {
    if (!isDrawing) return;
    if (e.cancelable) e.preventDefault();
    const pos = getPos(e);
    const last = path[path.length - 1];
    const dist = Math.hypot(pos.x - last.x, pos.y - last.y);
    if (currentEnergyUsed + dist <= currentLevel.maxEnergy) {
        path.push(pos);
        currentEnergyUsed += dist;
        updateHUD(currentLevel.maxEnergy - currentEnergyUsed);
        if (Math.random() < 0.3) {
            particles.push({
                x: pos.x, y: pos.y, vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2,
                life: 1, color: '#66fcf1', size: Math.random()*2+1
            });
        }
    }
}

function handleUp(e) {
    if (!isDrawing) return;
    if (e.cancelable) e.preventDefault();
    isDrawing = false;
    if (path.length > 1) {
        gameState = 'moving';
        msg.innerHTML = "能量球釋放中...";
        msg.style.color = "#66fcf1";
    } else {
        gameState = 'idle';
        path = [];
        currentEnergyUsed = 0;
        updateHUD(currentLevel.maxEnergy);
        msg.innerHTML = "請按住起點畫線。";
    }
}

canvas.addEventListener('mousedown', handleDown);
canvas.addEventListener('mousemove', handleMove);
canvas.addEventListener('mouseup', handleUp);
canvas.addEventListener('mouseleave', handleUp);
canvas.addEventListener('touchstart', handleDown, {passive: false});
canvas.addEventListener('touchmove', handleMove, {passive: false});
canvas.addEventListener('touchend', handleUp, {passive: false});

// ============================================================
// 幾何工具
// ============================================================
function pointInPolygon(p, polygon) {
    let inside = false;
    for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
        const xi = polygon[i].x, yi = polygon[i].y;
        const xj = polygon[j].x, yj = polygon[j].y;
        const intersect = ((yi > p.y) !== (yj > p.y)) && (p.x < (xj - xi) * (p.y - yi) / (yj - yi) + xi);
        if (intersect) inside = !inside;
    }
    return inside;
}

function getObstaclePolygon(o) {
    if (o.type === 'rotate') {
        const pts = [];
        const cos = Math.cos(o.angle), sin = Math.sin(o.angle);
        const half = o.size / 2;
        const corners = [[-half,-half],[half,-half],[half,half],[-half,half]];
        corners.forEach(([dx,dy]) => {
            pts.push({ x: o.cx + dx*cos - dy*sin, y: o.cy + dx*sin + dy*cos });
        });
        return pts;
    } else if (o.type === 'moving') {
        const cy = o.currentY !== undefined ? o.currentY : o.y;
        return [
            { x: o.x, y: cy },
            { x: o.x + o.w, y: cy },
            { x: o.x + o.w, y: cy + o.h },
            { x: o.x, y: cy + o.h }
        ];
    } else {
        return [
            { x: o.x, y: o.y },
            { x: o.x + o.w, y: o.y },
            { x: o.x + o.w, y: o.y + o.h },
            { x: o.x, y: o.y + o.h }
        ];
    }
}

// ============================================================
// 爆炸 / 粒子
// ============================================================
function createExplosion(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = Math.random() * 8 + 2;
        particles.push({
            x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
            life: 1, color, size: Math.random() * 4 + 2
        });
    }
}

// ============================================================
// 結束關卡
// ============================================================
function endLevel(success, reason) {
    gameState = 'end';
    if (!success) {
        shakeTime = 20;
        justFailed = true;
        lastFailedLevel = currentLevel.id;
        vibrate([100, 50, 100, 50, 200]);
        SFX.lose();
        createExplosion(player.x, player.y, '#ff4757', 40);
        unlockAchievement('first_death');
        showEndScreen(false, reason, 0, 0);
    } else {
        vibrate([50, 30, 50]);
        SFX.win();
        createExplosion(player.x, player.y, '#2ed573', 50);
        createExplosion(player.x, player.y, '#66fcf1', 30);
        
        const energyUsed = Math.floor(currentEnergyUsed);
        const energyPct = energyUsed / currentLevel.maxEnergy;
        const timeUsed = (Date.now() - levelStartTime) / 1000;
        
        // 評星：能量越少、時間越快 = 越多星
        let stars = 1;
        if (energyPct < 0.7 && timeUsed < 30) stars = 2;
        if (energyPct < 0.5 && timeUsed < 20) stars = 3;
        
        // 更新統計
        save.stats.wins++;
        save.stats.totalEnergy += energyUsed;
        if (energyUsed < save.stats.bestEnergy) save.stats.bestEnergy = energyUsed;
        
        // 更新關卡紀錄
        const prev = save.bestPerLevel[currentLevel.id];
        if (!prev || energyUsed < prev.energy) {
            save.bestPerLevel[currentLevel.id] = { energy: energyUsed, stars: Math.max(prev ? prev.stars : 0, stars) };
        } else {
            save.bestPerLevel[currentLevel.id].stars = Math.max(prev.stars, stars);
        }
        
        // 解鎖下一關
        if (currentLevel.id === save.unlockedLevel) {
            save.unlockedLevel = Math.min(currentLevel.id + 1, 999);
        }
        
        // 成就
        if (currentLevel.id === 1) unlockAchievement('first_win');
        if (currentLevel.id >= 3) unlockAchievement('level_3');
        if (currentLevel.id >= 5) unlockAchievement('level_5');
        if (currentLevel.id >= 10) unlockAchievement('level_10');
        if (energyPct < 0.5) unlockAchievement('no_damage');
        if (timeUsed < 20) unlockAchievement('speed_run');
        if (stars === 3) unlockAchievement('perfect_3');
        if (save.difficulty === 'hard') unlockAchievement('hard_win');
        if (save.stats.plays >= 100) unlockAchievement('100_plays');
        if (justFailed && lastFailedLevel === currentLevel.id) unlockAchievement('comeback');
        
        // 檢查全三星
        let allThree = true;
        for (let i = 1; i <= 5; i++) {
            if (!save.bestPerLevel[i] || save.bestPerLevel[i].stars < 3) { allThree = false; break; }
        }
        if (allThree) unlockAchievement('all_stars');
        
        // 排行榜
        save.leaderboard.push({
            level: currentLevel.id,
            energy: energyUsed,
            date: Date.now()
        });
        save.leaderboard.sort((a,b) => a.energy - b.energy);
        save.leaderboard = save.leaderboard.slice(0, 50);
        
        persist();
        showEndScreen(true, reason, energyUsed, stars);
    }
}

function showEndScreen(success, reason, energyUsed, stars) {
    const endTitle = document.getElementById('end-title');
    const endMsg = document.getElementById('end-msg');
    const endStars = document.getElementById('end-stars');
    const endStats = document.getElementById('end-stats');
    const nextBtn = document.getElementById('end-next-btn');
    
    if (success) {
        endTitle.innerText = 'MISSION CLEAR';
        endTitle.style.color = '#2ed573';
        endTitle.style.textShadow = '0 0 20px #2ed573';
        endStars.innerHTML = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
        endStats.innerHTML = `
            能量消耗：<b style="color:#66fcf1;">${energyUsed} px</b><br>
            評分：<b style="color:#ffd32a;">${stars} 星</b><br>
            最佳：<b style="color:#a4b0be;">${save.bestPerLevel[currentLevel.id].energy} px</b>
        `;
        nextBtn.style.display = 'block';
    } else {
        endTitle.innerText = 'SYSTEM FAILURE';
        endTitle.style.color = '#ff4757';
        endTitle.style.textShadow = '0 0 20px #ff4757';
        endStars.innerHTML = '';
        endStats.innerHTML = '';
        nextBtn.style.display = 'none';
    }
    endMsg.innerText = reason;
    
    setTimeout(() => {
        showOverlay('end-overlay');
        document.getElementById('hud').style.display = 'none';
        document.getElementById('msg').style.display = 'none';
        document.getElementById('game-back-btn').style.display = 'none';
    }, 800);
}

function unlockAchievement(id) {
    if (save.achievements[id]) return;
    save.achievements[id] = true;
    const a = ACHIEVEMENTS.find(x => x.id === id);
    if (a) {
        showToast(`🏆 成就解鎖：${a.icon} ${a.name}`);

}

// ============================================================
// 更新邏輯
// ============================================================
function update() {
    stars.forEach(s => {
        s.y += s.speed;
        if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; }
    });
    
    goalAngle += 0.05;
    if (shakeTime > 0) shakeTime--;
    
    // 更新障礙物
    obstacleStates.forEach(o => {
        if (o.type === 'moving') {
            o.currentY += o.speed * o.dir;
            if (o.currentY > (o.maxY || 350)) { o.currentY = o.maxY || 350; o.dir = -1; }
            if (o.currentY < (o.minY || 50)) { o.currentY = o.minY || 50; o.dir = 1; }
        }
        if (o.type === 'rotate') {
            o.angle += o.speed;
        }
    });
    
    // 粒子
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life -= 0.02;
        if (p.life <= 0) particles.splice(i, 1);
    }
    
    // 能量球移動
    if (gameState === 'moving' && path.length > 1) {
        distanceTraveled += 4;
        
        if (Math.random() < 0.5) {
            trail.push({ x: player.x, y: player.y, life: 1 });
        }
        
        let travelled = 0;
        let found = false;
        for (let i = 1; i < path.length; i++) {
            const p1 = path[i-1], p2 = path[i];
            const segLen = Math.hypot(p2.x - p1.x, p2.y - p1.y);
            if (distanceTraveled <= travelled + segLen) {
                const t = (distanceTraveled - travelled) / segLen;
                player.x = p1.x + (p2.x - p1.x) * t;
                player.y = p1.y + (p2.y - p1.y) * t;
                found = true;
                break;
            }
            travelled += segLen;
        }
        
        if (!found) {
            endLevel(false, '能量耗盡。你未能到達傳送門。');
            return;
        }
        
        // 碰撞檢查
        for (const o of obstacleStates) {
            const poly = getObstaclePolygon(o);
            if (pointInPolygon(player, poly)) {
                endLevel(false, '你撞擊能量晶體，結構崩潰。');
                return;
            }
        }
        
        // 到達傳送門
        const distToGoal = Math.hypot(player.x - (currentLevel.goal.x + currentLevel.goal.w/2), player.y - (currentLevel.goal.y + currentLevel.goal.h/2));
        if (distToGoal < 40) {
            endLevel(true, '成功進入傳送門！');
            return;
        }
    }
    
    // 拖尾
    for (let i = trail.length - 1; i >= 0; i--) {
        trail[i].life -= 0.05;
        if (trail[i].life <= 0) trail.splice(i, 1);
    }
}

// ============================================================
// 繪製
// ============================================================
function draw() {
    ctx.save();
    if (shakeTime > 0) ctx.translate((Math.random() - 0.5) * 15, (Math.random() - 0.5) * 15);
    
    // 背景
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // 星塵
    ctx.fillStyle = '#fff';
    stars.forEach(s => {
        ctx.globalAlpha = Math.random() * 0.5 + 0.5;
        ctx.fillRect(s.x, s.y, s.size, s.size);
    });
    ctx.globalAlpha = 1;
    
    // 網格
    ctx.strokeStyle = 'rgba(0,210,211,0.05)';
    ctx.lineWidth = 1;
    for (let i = 0; i < canvas.width; i += 60) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
    }
    for (let i = 0; i < canvas.height; i += 60) {
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
    }
    
    if (!currentLevel) { ctx.restore(); return; }
    
    // 傳送門
    ctx.save();
    ctx.translate(currentLevel.goal.x + currentLevel.goal.w/2, currentLevel.goal.y + currentLevel.goal.h/2);
    ctx.rotate(goalAngle);
    const pulse = 1 + Math.sin(goalAngle * 3) * 0.1;
    ctx.strokeStyle = '#2ed573';
    ctx.lineWidth = 4;
    if (settings.glow) { ctx.shadowBlur = 20; ctx.shadowColor = '#2ed573'; }
    ctx.beginPath(); ctx.arc(0, 0, 35 * pulse, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
        const a = (i * Math.PI * 2) / 6;
        const px = Math.cos(a) * 20, py = Math.sin(a) * 20;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(46,213,115,0.2)'; ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.shadowBlur = 0;
    
    // 障礙物
    obstacleStates.forEach(o => {
        const poly = getObstaclePolygon(o);
        ctx.beginPath();
        poly.forEach((p, i) => {
            if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
        });
        ctx.closePath();
        ctx.fillStyle = 'rgba(255,71,87,0.15)'; ctx.fill();
        ctx.strokeStyle = '#ff4757'; ctx.lineWidth = 2;
        if (settings.glow) { ctx.shadowBlur = 15; ctx.shadowColor = '#ff4757'; }
        ctx.stroke(); ctx.shadowBlur = 0;
        // 內部紋路
        ctx.strokeStyle = 'rgba(255,71,87,0.3)';
        ctx.lineWidth = 1;
        if (o.type === 'rotate') {
            ctx.beginPath();
            ctx.moveTo(o.cx - o.size/2 * Math.cos(o.angle), o.cy - o.size/2 * Math.sin(o.angle));
            ctx.lineTo(o.cx + o.size/2 * Math.cos(o.angle), o.cy + o.size/2 * Math.sin(o.angle));
            ctx.stroke();
        } else if (o.type === 'moving') {
            const cy = o.currentY;
            ctx.beginPath();
            ctx.moveTo(o.x + o.w/2, cy);
            ctx.lineTo(o.x + o.w/2, cy + o.h);
            ctx.stroke();
        } else {
            ctx.beginPath();
            ctx.moveTo(o.x + o.w/2, o.y);
            ctx.lineTo(o.x + o.w/2, o.y + o.h);
            ctx.stroke();
        }
    });
    
    // 起點
    ctx.fillStyle = '#00d2d3';
    if (settings.glow) { ctx.shadowBlur = 20; ctx.shadowColor = '#00d2d3'; }
    ctx.beginPath(); ctx.arc(currentLevel.start.x, currentLevel.start.y, 12, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#66fcf1'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(currentLevel.start.x, currentLevel.start.y, 18 + Math.sin(Date.now()/200)*2, 0, Math.PI*2); ctx.stroke();
    ctx.shadowBlur = 0;
    
    // 玩家軌跡
    if (path.length > 1) {
        ctx.strokeStyle = 'rgba(0,210,211,0.3)';
        ctx.lineWidth = 8;
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(path[0].x, path[0].y);
        for (let i = 1; i < path.length; i++) ctx.lineTo(path[i].x, path[i].y);
        ctx.stroke();
        
        ctx.strokeStyle = '#66fcf1';
        ctx.lineWidth = 3;
        if (settings.glow) { ctx.shadowBlur = 10; ctx.shadowColor = '#66fcf1'; }
        ctx.beginPath();
        ctx.moveTo(path[0].x, path[0].y);
        for (let i = 1; i < path.length; i++) ctx.lineTo(path[i].x, path[i].y);
        ctx.stroke();
        ctx.shadowBlur = 0;
    }
    
    // 粒子
    particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha = 1;
    
    // 拖尾
    trail.forEach(t => {
        ctx.globalAlpha = t.life * 0.5;
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(t.x, t.y, player.radius * t.life, 0, Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha = 1;
    
    // 玩家
    if (gameState !== 'end') {
        ctx.fillStyle = '#fff';
        if (settings.glow) { ctx.shadowBlur = 20; ctx.shadowColor = '#66fcf1'; }
        ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#00d2d3';
        ctx.beginPath(); ctx.arc(player.x, player.y, player.radius * 0.6, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;
    }
    
    ctx.restore();
}

// ============================================================
// 初始化
// ============================================================
for (let i = 0; i < 50; i++) {
    stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2,
        speed: Math.random() * 0.5 + 0.1
    });
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// 載入設定
try {
    const savedSettings = localStorage.getItem('oneStrokeSettings');
    if (savedSettings) settings = Object.assign(settings, JSON.parse(savedSettings));
} catch(e) {}

loadSave();
gameLoop();

window.addEventListener('resize', () => {});
</script>
