<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>一筆定生死 v1.0 - 極致光繪版</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap');
        
        body {
            margin: 0; padding: 0; background-color: #050510; color: #c5c6c7;
            font-family: 'Orbitron', sans-serif; display: flex; flex-direction: column;
            align-items: center; justify-content: center; height: 100dvh; height: 100vh; overflow: hidden;
            touch-action: none;
        }
        #game-container { position: relative; width: 100%; max-width: 900px; }
        canvas {
            background-color: #0a0a1a; border: 2px solid #1f2833;
            box-shadow: 0 0 30px rgba(0, 210, 211, 0.2), inset 0 0 50px rgba(0,0,0,0.8);
            width: 100%; height: auto; display: block; box-sizing: border-box;
        }
        
        /* 頂部 HUD 介面 */
        #hud {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            width: 80%; max-width: 600px; display: flex; flex-direction: column;
            align-items: center; pointer-events: none; z-index: 5;
        }
        .bar-container {
            width: 100%; height: 12px; background: rgba(255,255,255,0.1);
            border-radius: 6px; overflow: hidden; border: 1px solid rgba(0, 210, 211, 0.3);
            box-shadow: 0 0 10px rgba(0, 210, 211, 0.2);
        }
        #energy-bar {
            height: 100%; width: 100%; background: linear-gradient(90deg, #00d2d3, #66fcf1);
            box-shadow: 0 0 10px #00d2d3; transition: width 0.1s;
        }
        #hud-text {
            margin-top: 5px; font-size: 12px; color: #66fcf1; text-shadow: 0 0 5px #66fcf1;
            letter-spacing: 2px; font-weight: bold;
        }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 16, 0.95); display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: #fff; text-align: center; z-index: 10;
            padding: 20px; box-sizing: border-box;
        }
        #start-overlay { display: flex; }
        #end-overlay { display: none; }
        
        .overlay h2 { color: #66fcf1; text-shadow: 0 0 20px #66fcf1; font-size: 24px; letter-spacing: 4px; }
        .overlay p { font-size: 12px; line-height: 2; margin: 5px 0; color: #a4b0be;}
        .overlay .highlight { color: #00d2d3; font-weight: bold; }
        
        button {
            margin-top: 25px; padding: 15px 30px; background: transparent; color: #00d2d3;
            border: 2px solid #00d2d3; font-family: 'Orbitron', sans-serif; cursor: pointer;
            font-size: 14px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(0, 210, 211, 0.4), inset 0 0 15px rgba(0, 210, 211, 0.2);
            transition: all 0.3s;
        }
        button:hover { background: #00d2d3; color: #000; box-shadow: 0 0 30px #00d2d3; }
        #msg {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            color: #a4b0be; font-size: 12px; letter-spacing: 1px; z-index: 5; pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="900" height="500"></canvas>
        
        <!-- 頂部能量條 HUD -->
        <div id="hud">
            <div class="bar-container">
                <div id="energy-bar"></div>
            </div>
            <div id="hud-text">ENERGY: 100%</div>
        </div>

        <div id="msg">按住起點開始繪畫能量軌跡...</div>

        <!-- 開始畫面 -->
        <div id="start-overlay" class="overlay">
            <h2>一筆定生死</h2>
            <p>按住畫布 <span class="highlight">繪製光繪軌跡</span>。</p>
            <p>放手後，能量球會沿軌跡移動。</p>
            <p>避開紅色能量晶體，進入傳送門。</p>
            <p>耗費能量越少，評價越高！</p>
            <button onclick="startGame()">開始繪畫</button>
        </div>

        <!-- 結束畫面 -->
        <div id="end-overlay" class="overlay">
            <h2 id="end-title" style="color:#ff4757; text-shadow: 0 0 20px #ff4757;">SYSTEM FAILURE</h2>
            <p id="end-msg"></p>
            <p id="record-msg" style="color: #ffd32a; font-size: 16px; margin-top: 15px;"></p>
            <button onclick="restartGame()">重新啟動</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const energyBar = document.getElementById('energy-bar');
        const hudText = document.getElementById('hud-text');
        const msg = document.getElementById('msg');
        const startOverlay = document.getElementById('start-overlay');
        const endOverlay = document.getElementById('end-overlay');
        const endTitle = document.getElementById('end-title');
        const endMsg = document.getElementById('end-msg');
        const recordMsg = document.getElementById('record-msg');

        // 遊戲常數
        const MAX_ENERGY = 800;
        const PLAYER_SPEED = 4;
        
        let startPoint = { x: 80, y: 400 };
        let goal = { x: 800, y: 120, width: 60, height: 60 };
        let obstacles = [
            { x: 220, y: 250, width: 50, height: 250, points: [] },
            { x: 400, y: 100, width: 120, height: 50, points: [] },
            { x: 600, y: 280, width: 60, height: 220, points: [] }
        ];

        let path = [];
        let isDrawing = false;
        let currentEnergyUsed = 0;
        
        let player = { x: startPoint.x, y: startPoint.y, radius: 8 };
        let distanceTraveled = 0;
        
        let bestLength = parseInt(localStorage.getItem('oneLineBest') || '9999');
        let gameState = 'idle'; // idle, drawing, moving, end
        
        // 視覺效果
        let particles = [];
        let stars = [];
        let shakeTime = 0;
        let goalAngle = 0;
        let trail = [];

        // 初始化星空背景
        for(let i=0; i<50; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2,
                speed: Math.random() * 0.5 + 0.1
            });
        }

        // 建立障礙物晶體形狀
        obstacles.forEach(obs => {
            obs.points = [
                {x: obs.x + obs.width/2, y: obs.y},
                {x: obs.x + obs.width, y: obs.y + obs.height/2},
                {x: obs.x + obs.width/2, y: obs.y + obs.height},
                {x: obs.x, y: obs.y + obs.height/2}
            ];
        });

        function startGame() {
            startOverlay.style.display = 'none';
            resetLevel();
            gameState = 'idle';
        }

        function restartGame() {
            endOverlay.style.display = 'none';
            startGame();
        }

        function resetLevel() {
            path = [];
            trail = [];
            particles = [];
            isDrawing = false;
            currentEnergyUsed = 0;
            player.x = startPoint.x;
            player.y = startPoint.y;
            distanceTraveled = 0;
            shakeTime = 0;
            updateHUD(MAX_ENERGY);
            msg.innerHTML = "按住藍色起點開始繪畫...";
            msg.style.color = "#a4b0be";
        }

        function updateHUD(energy) {
            let pct = (energy / MAX_ENERGY) * 100;
            energyBar.style.width = pct + '%';
            hudText.innerText = `ENERGY: ${Math.round(pct)}%`;
            if (pct < 30) {
                energyBar.style.background = 'linear-gradient(90deg, #ff4757, #ff6b81)';
                energyBar.style.boxShadow = '0 0 10px #ff4757';
            } else {
                energyBar.style.background = 'linear-gradient(90deg, #00d2d3, #66fcf1)';
                energyBar.style.boxShadow = '0 0 10px #00d2d3';
            }
        }

        // 取得滑鼠/觸控座標
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX = e.clientX;
            let clientY = e.clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function handleDown(e) {
            if (gameState !== 'idle') return;
            if (e.cancelable) e.preventDefault();
            
            const pos = getPos(e);
            let dist = Math.hypot(pos.x - startPoint.x, pos.y - startPoint.y);
            if (dist < 60) {
                isDrawing = true;
                gameState = 'drawing';
                path = [{ x: startPoint.x, y: startPoint.y }];
                currentEnergyUsed = 0;
                msg.innerHTML = "正在繪製能量軌跡...";
            }
        }

        function handleMove(e) {
            if (!isDrawing) return;
            if (e.cancelable) e.preventDefault();
            
            const pos = getPos(e);
            const lastPoint = path[path.length - 1];
            const dist = Math.hypot(pos.x - lastPoint.x, pos.y - lastPoint.y);
            
            if (currentEnergyUsed + dist <= MAX_ENERGY) {
                path.push(pos);
                currentEnergyUsed += dist;
                updateHUD(MAX_ENERGY - currentEnergyUsed);
                
                // 畫線時嘅火花
                if (Math.random() < 0.3) {
                    particles.push({
                        x: pos.x, y: pos.y, vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2,
                        life: 1, color: '#66fcf1', size: Math.random()*2+1
                    });
                }
            }
        }

        function handleUp(e) {
            if (!isDrawing) return;
            if (e.cancelable) e.preventDefault();
            
            isDrawing = false;
            if (path.length > 1) {
                gameState = 'moving';
                msg.innerHTML = "能量球釋放中...";
                msg.style.color = "#66fcf1";
            } else {
                gameState = 'idle';
                path = [];
                currentEnergyUsed = 0;
                updateHUD(MAX_ENERGY);
                msg.innerHTML = "請按住起點畫線。";
            }
        }

        canvas.addEventListener('mousedown', handleDown);
        canvas.addEventListener('mousemove', handleMove);
        canvas.addEventListener('mouseup', handleUp);
        canvas.addEventListener('mouseleave', handleUp);
        
        canvas.addEventListener('touchstart', handleDown, {passive: false});
        canvas.addEventListener('touchmove', handleMove, {passive: false});
        canvas.addEventListener('touchend', handleUp, {passive: false});

        // 點與多邊形碰撞檢測
        function isPointInPolygon(p, polygon) {
            let isInside = false;
            for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
                let xi = polygon[i].x, yi = polygon[i].y;
                let xj = polygon[j].x, yj = polygon[j].y;
                let intersect = ((yi > p.y) != (yj > p.y)) && (p.x < (xj - xi) * (p.y - yi) / (yj - yi) + xi);
                if (intersect) isInside = !isInside;
            }
            return isInside;
        }

        function createExplosion(x, y, color, count) {
            for(let i=0; i<count; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 8 + 2;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                    life: 1, color: color, size: Math.random()*4+2
                });
            }
        }

        function gameOver(reason, success) {
            gameState = 'end';
            shakeTime = success ? 0 : 20;
            
            if (success) {
                endTitle.innerText = "MISSION CLEAR";
                endTitle.style.color = "#2ed573";
                endTitle.style.textShadow = "0 0 20px #2ed573";
                createExplosion(player.x, player.y, '#2ed573', 50);
                createExplosion(player.x, player.y, '#66fcf1', 30);
                
                let used = Math.floor(currentEnergyUsed);
                if (used < bestLength) {
                    bestLength = used;
                    localStorage.setItem('oneLineBest', bestLength);
                    recordMsg.innerHTML = `🏆 新紀錄！最短能量：${bestLength} px`;
                } else {
                    recordMsg.innerHTML = `能量消耗：${used} px<br>最佳紀錄：${bestLength} px`;
                }
            } else {
                endTitle.innerText = "SYSTEM FAILURE";
                endTitle.style.color = "#ff4757";
                endTitle.style.textShadow = "0 0 20px #ff4757";
                createExplosion(player.x, player.y, '#ff4757', 40);
                recordMsg.innerHTML = "";
            }
            
            endMsg.innerText = reason;
            setTimeout(() => { endOverlay.style.display = 'flex'; }, 600); // 延遲顯示令爆炸睇得清楚啲
        }

        function update() {
            // 背景星星
            stars.forEach(s => {
                s.y += s.speed;
                if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; }
            });

            // 終點傳送門旋轉
            goalAngle += 0.05;

            // 畫面震動
            if (shakeTime > 0) shakeTime--;

            // 粒子更新
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.vy += 0.1; // 重力
                p.life -= 0.02;
                if (p.life <= 0) particles.splice(i, 1);
            }

            // 角色移動
            if (gameState === 'moving' && path.length > 1) {
                distanceTraveled += PLAYER_SPEED;
                
                // 拖尾效果
                if (Math.random() < 0.5) {
                    trail.push({ x: player.x, y: player.y, life: 1 });
                }

                let travelled = 0;
                let found = false;
                for (let i = 1; i < path.length; i++) {
                    let p1 = path[i-1];
                    let p2 = path[i];
                    let segLen = Math.hypot(p2.x - p1.x, p2.y - p1.y);
                    
                    if (distanceTraveled <= travelled + segLen) {
                        let t = (distanceTraveled - travelled) / segLen;
                        player.x = p1.x + (p2.x - p1.x) * t;
                        player.y = p1.y + (p2.y - p1.y) * t;
                        found = true;
                        break;
                    }
                    travelled += segLen;
                }

                if (!found) {
                    gameOver("能量耗盡。你未能到達傳送門。", false);
                    return;
                }

                // 檢查有冇掂到晶體
                for (let obs of obstacles) {
                    if (isPointInPolygon(player, obs.points)) {
                        gameOver("你撞擊能量晶體，結構崩潰。", false);
                        return;
                    }
                }

                // 檢查有冇到終點
                let distToGoal = Math.hypot(player.x - (goal.x + goal.width/2), player.y - (goal.y + goal.height/2));
                if (distToGoal < 40) {
                    gameOver("成功進入傳送門！", true);
                    return;
                }
            }
            
            // 拖尾更新
            for (let i = trail.length - 1; i >= 0; i--) {
                trail[i].life -= 0.05;
                if (trail[i].life <= 0) trail.splice(i, 1);
            }
        }

        function draw() {
            ctx.save();
            
            // 畫面震動
            if (shakeTime > 0) {
                ctx.translate((Math.random() - 0.5) * 15, (Math.random() - 0.5) * 15);
            }

            // 清空背景
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 畫星空
            ctx.fillStyle = '#fff';
            stars.forEach(s => {
                ctx.globalAlpha = Math.random() * 0.5 + 0.5;
                ctx.fillRect(s.x, s.y, s.size, s.size);
            });
            ctx.globalAlpha = 1;

            // 畫網格
            ctx.strokeStyle = 'rgba(0, 210, 211, 0.05)';
            ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=60) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for(let i=0; i<canvas.height; i+=60) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }

            // 畫終點 (傳送門)
            ctx.save();
            ctx.translate(goal.x + goal.width/2, goal.y + goal.height/2);
            ctx.rotate(goalAngle);
            
            // 外圈脈衝
            let pulse = 1 + Math.sin(goalAngle * 3) * 0.1;
            ctx.strokeStyle = '#2ed573';
            ctx.lineWidth = 4;
            ctx.shadowBlur = 20; ctx.shadowColor = '#2ed573';
            ctx.beginPath();
            ctx.arc(0, 0, 35 * pulse, 0, Math.PI * 2);
            ctx.stroke();
            
            // 內圈多邊形
            ctx.beginPath();
            for(let i=0; i<6; i++) {
                let angle = (i * Math.PI * 2) / 6;
                let px = Math.cos(angle) * 20;
                let py = Math.sin(angle) * 20;
                if(i===0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fillStyle = 'rgba(46, 213, 115, 0.2)';
            ctx.fill();
            ctx.stroke();
            
            // 中心點
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI*2); ctx.fill();
            
            ctx.restore();
            ctx.shadowBlur = 0;

            // 畫障礙物晶體
            obstacles.forEach(obs => {
                ctx.beginPath();
                obs.points.forEach((p, i) => {
                    if (i === 0) ctx.moveTo(p.x, p.y);
                    else ctx.lineTo(p.x, p.y);
                });
                ctx.closePath();
                
                // 內部半透明填充
                ctx.fillStyle = 'rgba(255, 71, 87, 0.15)';
                ctx.fill();
                
                // 霓虹邊緣
                ctx.strokeStyle = '#ff4757';
                ctx.lineWidth = 2;
                ctx.shadowBlur = 15; ctx.shadowColor = '#ff4757';
                ctx.stroke();
                ctx.shadowBlur = 0;

                // 內部裝飾線
                ctx.strokeStyle = 'rgba(255, 71, 87, 0.3)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(obs.x + obs.width/2, obs.y);
                ctx.lineTo(obs.x + obs.width/2, obs.y + obs.height);
                ctx.stroke();
            });

            // 畫起點 (能量源)
            ctx.fillStyle = '#00d2d3';
            ctx.shadowBlur = 20; ctx.shadowColor = '#00d2d3';
            ctx.beginPath(); ctx.arc(startPoint.x, startPoint.y, 12, 0, Math.PI*2); ctx.fill();
            
            // 起點外圈
            ctx.strokeStyle = '#66fcf1';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(startPoint.x, startPoint.y, 18 + Math.sin(Date.now()/200)*2, 0, Math.PI*2); ctx.stroke();
            ctx.shadowBlur = 0;

            // 畫玩家畫嘅光繪線
            if (path.length > 1) {
                // 外層光暈
                ctx.strokeStyle = 'rgba(0, 210, 211, 0.3)';
                ctx.lineWidth = 8;
                ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.moveTo(path[0].x, path[0].y);
                for (let i=1; i<path.length; i++) ctx.lineTo(path[i].x, path[i].y);
                ctx.stroke();

                // 內層實線
                ctx.strokeStyle = '#66fcf1';
                ctx.lineWidth = 3;
                ctx.shadowBlur = 10; ctx.shadowColor = '#66fcf1';
                ctx.beginPath();
                ctx.moveTo(path[0].x, path[0].y);
                for (let i=1; i<path.length; i++) ctx.lineTo(path[i].x, path[i].y);
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            // 畫粒子
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
            });
            ctx.globalAlpha = 1;

            // 畫玩家拖尾
            trail.forEach(t => {
                ctx.globalAlpha = t.life * 0.5;
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(t.x, t.y, player.radius * t.life, 0, Math.PI*2); ctx.fill();
            });
            ctx.globalAlpha = 1;

            // 畫玩家 (能量球)
            if (gameState === 'moving' || gameState === 'idle' || gameState === 'drawing') {
                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 20; ctx.shadowColor = '#66fcf1';
                ctx.beginPath();
                ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2);
                ctx.fill();
                
                // 光球核心
                ctx.fillStyle = '#00d2d3';
                ctx.beginPath();
                ctx.arc(player.x, player.y, player.radius * 0.6, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // 啟動
        resetLevel();
        gameLoop();
    </script>
</body>
</html>
