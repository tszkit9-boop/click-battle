  .stock-up {color:var(--green);}
  .stock-down {color:var(--red);}

  .stock-btns button {padding:6px 12px;font-size:.75rem;}
  
  .achieve-badge {display:inline-block;padding:4px 8px;background:rgba(232,196,106,.2);border:1px solid var(--gold);border-radius:4px;color:var(--gold);font-size:.75rem;margin:2px;}

function createPlayerObj(id, name, color, emoji, isBot) {
  return {
    id, isBot, name, color, emoji, skillName: SKILLS[emoji].name,
    cash: 50000, pos: 0, props: [], debts: [], jailTurns: 0,
    bankrupt: false, pandasSaved: false, movePenalty: 0, isCheckingBankrupt: false,
    jailCount: 0, sabotageCount: 0, achievements: [] 
  };
}

function startSoloGame() {
  const name = getPlayerName(); if(!name) return;
  myName = name; myId = 'p_' + Date.now(); myRole = 'host';
  roomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
  roomRef = db.ref('rooms/' + roomCode);
  
  const playersData = { [myId]: createPlayerObj(myId, name, COLORS[0], myEmoji, false) };
  for(let i=0; i<3; i++) {
    const botId = 'bot_' + i + '_' + Date.now();
    playersData[botId] = createPlayerObj(botId, BOT_NAMES[i], COLORS[i+1], ALL_EMOJIS[i+1], true);
  }

  const initialData = {
    status: 'playing', host: myId, players: playersData,
    gameState: { currentId: myId, round: 1, totalRounds: 15, phase: 'roll', dice1: null, dice2: null, owners: {}, auction: null, lastEvent: null,
      stocks: { tx: {name:'騰訊', price:300}, hs: {name:'匯豐', price:50}, btc: {name:'比特幣', price:10000} },
      globalEvent: null
    }
  };

  roomRef.set(initialData).then(() => {
    document.getElementById('lobby').classList.add('hidden'); document.getElementById('game').classList.remove('hidden');
    listenToRoom(); 
  });
}

function createRoom() {
  const name = getPlayerName(); if(!name) return;
  myName = name; myId = 'p_' + Date.now(); myRole = 'host';
  roomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
  roomRef = db.ref('rooms/' + roomCode);
  roomRef.set({ status: 'waiting', host: myId, players: { [myId]: createPlayerObj(myId, name, COLORS[0], myEmoji, false) } })
  .then(() => { showWaitingRoom(); listenToRoom(); });
}

function showWaitingRoom() {
  document.getElementById('lobby-actions').classList.add('hidden');
  document.getElementById('lobby-wait').classList.remove('hidden');
  document.getElementById('displayCode').innerText = roomCode;
  if(myRole !== 'host') document.getElementById('btnStart').classList.add('hidden');
}
function startGameHost() {
  if(myRole !== 'host') return;
  const pIds = Object.keys(localData.players);
  if(pIds.length < 2) return alert('最少要 2 個人先玩到！');
  roomRef.update({ status: 'playing', gameState: { currentId: pIds[0], round: 1, totalRounds: 15, phase: 'roll', dice1: null, dice2: null, owners: {}, auction: null, lastEvent: null, stocks: { tx: {name:'騰訊', price:300}, hs: {name:'匯豐', price:50}, btc: {name:'比特幣', price:10000} }, globalEvent: null } });
}

function listenToRoom() {
  roomRef.on('value', snapshot => {
    const data = snapshot.val(); if(!data) return; localData = data;

    if(data.status === 'waiting') {
      const waitDiv = document.getElementById('waitingPlayers');
      if(waitDiv) waitDiv.innerHTML = Object.values(data.players).map(p => `<div style="padding:8px;background:${p.color}33;border:1px solid ${p.color}">${p.emoji} ${p.name}</div>`).join('');
    }

    if(data.status === 'playing') {
      if(document.getElementById('game').classList.contains('hidden')) {
        document.getElementById('lobby').classList.add('hidden'); document.getElementById('game').classList.remove('hidden');
      }
      renderAll();

      if(!data.gameState.auction) {
        Object.keys(data.players).forEach(pid => {
          const p = data.players[pid];
          if(!p.bankrupt && p.cash < 0 && !p.isCheckingBankrupt) checkBankrupt(pid);
        });
      }
      
      if(data.gameState.auction) { renderAuction(); } else { const am = document.getElementById('auctionMask'); if(am) am.remove(); }

      if(data.gameState.phase === 'roll' && !data.gameState.auction) checkBotTurn();

      if(data.gameState.phase === 'action' && !data.gameState.auction) {
        const curP = data.players[data.gameState.currentId];
        if(curP && curP.isBot) {
          setTimeout(() => { if(localData.gameState.phase === 'action' && localData.gameState.currentId === curP.id && !localData.gameState.auction) endTurn(); }, 1500);
        }
      }
    }
    if(data.status === 'finished') { showGameOver(); }
  });
}

function renderBoard() {
  const boardEl = document.getElementById('board'); if(!boardEl || !localData.gameState) return;
  const gs = localData.gameState; const isMyTurn = gs.currentId === myId;
  
  let html = '';
  BOARD.forEach((cell, i) => {
    const p = getGridPos(i);
    const ownerData = gs.owners && gs.owners[i];
    const ownerId = ownerData ? ownerData.owner : null;
    const level = ownerData ? (ownerData.level || 0) : 0;
    
    let pawnsHere = [];
    Object.keys(localData.players).forEach(pid => {
      if (localData.players[pid].bankrupt) return;
      let pPos = localData.players[pid].pos;
      if (animState.active && animState.pid === pid) pPos = animState.current;
      if (pPos === i) pawnsHere.push(pid);
    });

    let cls = 'cell';
    if(cell.t==='start') cls+=' corner start'; else if(cell.t==='jail') cls+=' corner jail';
    else if(cell.t==='free') cls+=' corner free'; else if(cell.t==='gojail') cls+=' corner gojail';
    if(cell.tier) cls+=' tier-'+cell.tier;

    let inner = '';
    if(['prop','station','utility'].includes(cell.t)){
      let displayRent = cell.rent || 0;
      if(cell.t==='prop') displayRent = cell.rent * Math.pow(2, level);
      if(ownerId && cell.t==='prop' && checkMonopoly(ownerId, cell.d)) displayRent *= 2;
      
      inner = `<div class="c-name">${cell.n}</div><div class="c-price">${ownerId?'$'+displayRent.toLocaleString():'價 $'+cell.price.toLocaleString()}</div>`;
      if(ownerId && localData.players[ownerId]) {
        const mono = cell.t==='prop' && checkMonopoly(ownerId, cell.d);
        inner += `<div class="c-owner" style="background:${localData.players[ownerId].color};"></div>`;
        if(level > 0) inner += `<div class="c-level ${mono?'monopoly':''}">${level}🏠</div>`;
      }
    } else {
      inner = `<div class="c-icon">${cell.icon}</div><div class="c-label">${cell.n}</div>`;
    }
    
    if(pawnsHere.length) {
      inner += `<div class="c-pawns">` + pawnsHere.map(pid => `<div class="pawn-avatar" style="border-color:${localData.players[pid].color}">${localData.players[pid].emoji}</div>`).join('') + `</div>`;
    }
    html += `<div class="${cls}" style="grid-row:${p.r};grid-column:${p.c}" onclick="showCellInfo(${i})">${inner}</div>`;
  });

  const curP = localData.players[gs.currentId] || {emoji:'',name:'',color:'#fff',cash:0};
  let displayCash = curP.cash; if (animState.active && animState.pid === gs.currentId) displayCash = animState.newCash;
  
  const isJail = curP.pos === 10;
  let actionArea = '';
  if (gs.auction) {
    actionArea = `<div style="color:var(--gold);font-weight:900;font-size:1.2rem;">🔨 暗標拍賣進行中...</div>`;
  } else {
    actionArea = `
    <div class="action-btns" style="margin-top:10px;">
      ${isJail ? `<button class="btn danger" onclick="payBail()" ${isMyTurn && gs.phase==='roll' ? '' : 'disabled'}>💸 付 $10,000 保釋</button>` : `<button class="btn primary" onclick="doRoll()" ${isMyTurn && gs.phase==='roll' ? '' : 'disabled'}>🎲 擲骰</button>`}
      <button class="btn" onclick="endTurn()" ${isMyTurn && gs.phase==='action' ? '' : 'disabled'}>✅ 結束回合</button>
    </div>
    <div class="action-btns">
      <button class="btn" onclick="openLoanModal()" ${isMyTurn && !curP.bankrupt && !curP.isBot ? '' : 'disabled'}>💸 借款</button>
      <button class="btn" onclick="openTradeModal(true)" ${isMyTurn && !curP.bankrupt && !curP.isBot ? '' : 'disabled'}>🤝 主動交易</button>
    </div>`;
  }

  html += `<div class="center-panel">
    <div style="font-size:.8rem;color:#8a8478">第 <b>${gs.round}</b> / ${gs.totalRounds} 回合</div>
    <div class="turn-player" style="color:${curP.color}"><span style="font-size:2rem">${curP.emoji}</span> ${curP.name}</div>
    <div class="turn-cash ${displayCash<0?'neg':''}">💰 現金：$${displayCash.toLocaleString()}</div>
    ${gs.globalEvent ? `<div style="color:var(--red);font-size:.9rem;font-weight:900;background:rgba(255,0,0,0.2);padding:4px 8px;border-radius:8px;">🌪️ ${gs.globalEvent.n}：${gs.globalEvent.d}</div>` : ''}
    <div style="display:flex;gap:10px;margin:10px 0;">
      <div class="die ${isRolling?'rolling':''}">${gs.dice1 || '?'}</div>
      <div class="die ${isRolling?'rolling':''}">${gs.dice2 || '?'}</div>
    </div>
    ${actionArea}
    ${curP.isBot ? `<div style="font-size:.7rem;color:#666;cursor:pointer;" onclick="forceBotRoll()">(卡住咗？點擊強制電腦行動)</div>` : ''}
  </div>`;
  boardEl.innerHTML = html;
}

function forceBotRoll() {
  if(localData.gameState.phase === 'roll' && localData.players[localData.gameState.currentId].isBot) { lastBotRollAttempt = 0; checkBotTurn(); }
  else if(localData.gameState.phase === 'action' && localData.players[localData.gameState.currentId].isBot) endTurn();
}

function renderPlayers() {
  const panel = document.getElementById('playersPanel'); if(!panel || !localData.players) return;
  let html = '', totalDebt = 0;
  Object.values(localData.players).forEach(p => totalDebt += (p.debts || []).reduce((s,d)=>s+d.principal,0));

  html += `<div class="p-card bank-npc"><div class="p-head"><div style="font-size:1.6rem">🏦</div><div class="p-name">系統銀行</div></div><div class="p-cash">💰 總借出：$${totalDebt.toLocaleString()}</div></div>`;

  Object.keys(localData.players).forEach(pid => {
    const p = localData.players[pid];
    const isActive = pid === localData.gameState.currentId;
    const debt = (p.debts || []).reduce((s,d)=>s+d.principal,0);
    let displayCash = p.cash; if (animState.active && animState.pid === pid) displayCash = animState.newCash;

    html += `<div class="p-card ${isActive?'active':''} ${p.bankrupt?'dead':''}">
      <div class="p-head"><div style="font-size:1.6rem">${p.bankrupt?'💀':p.emoji}</div><div class="p-name">${p.name} ${pid===myId?'(你)':''}</div></div>
      ${p.skillName ? `<div style="font-size:.65rem;color:var(--purple)">${p.skillName}</div>` : ''}
      <div class="p-cash ${displayCash<0?'neg':''}">${p.bankrupt ? '破產' : '$'+displayCash.toLocaleString()}</div>
      ${p.bankrupt ? '' : `<div class="p-stats"><div class="p-stat">🏠 ${(p.props||[]).length}</div>${debt>0?`<div class="p-stat" style="color:var(--red)">💸 $${debt.toLocaleString()}</div>`:''}</div>`}
      ${p.achievements && p.achievements.length > 0 ? `<div style="margin-top:8px;display:flex;flex-wrap:wrap;">${p.achievements.map(a=>`<span class="achieve-badge">🏆 ${a}</span>`).join('')}</div>` : ''}
    </div>`;
  });
  panel.innerHTML = html;
}

// 🎯 大事件邏輯 (每5回合觸發)
function triggerGlobalEvent(round) {
  if(round % 5 !== 0) return null;
  const ev = GLOBAL_EVENTS[Math.floor(Math.random()*GLOBAL_EVENTS.length)];
  return ev;
}

// 📈 股票市場邏輯
function openMarket() {
  const stocks = localData.gameState.stocks || {};
  const myP = localData.players[myId];
  const hold = myP.stocks || { tx: 0, hs: 0, btc: 0 };
  
  let html = `<h3>📈 股票市場</h3><p>每回合會隨機升跌，高風險高回報！</p>`;
  Object.keys(stocks).forEach(k => {
    let s = stocks[k];
    let owned = hold[k] || 0;
    html += `<div class="stock-row">
      <div class="stock-info">
        <div class="stock-name">${s.name}</div>
        <div class="stock-price">現價：$${s.price.toLocaleString()}</div>
        <div style="font-size:.75rem;color:#aaa;">持有：${owned} 股</div>
      </div>
      <div class="stock-btns">
        <button class="btn primary" onclick="tradeStock('${k}', 'buy')">買入</button>
        <button class="btn danger" onclick="tradeStock('${k}', 'sell')" ${owned <= 0 ? 'disabled' : ''}>賣出</button>
      </div>
    </div>`;
  });
  html += `<button class="btn" onclick="closeModal()">離開</button>`;
  showModal(html);
}

function tradeStock(stockId, type) {
  const p = localData.players[myId];
  const s = localData.gameState.stocks[stockId];
  let amt = prompt(`你想${type === 'buy' ? '買入' : '賣出'}幾多股 ${s.name}？\n現價：$${s.price}\n你的現金：$${p.cash}`, "1");
  amt = parseInt(amt);
  if(!amt || amt <= 0) return;
  let total = amt * s.price;
  
  if(type === 'buy') {
    if(p.cash < total) return alert('現金不足！');
    roomRef.update({
      [`players/${myId}/cash`]: p.cash - total,
      [`players/${myId}/stocks/${stockId}`]: (p.stocks?.[stockId] || 0) + amt
    }).then(() => { alert(`成功買入 ${amt} 股 ${s.name}！`); openMarket(); });
  } else {
    if((p.stocks?.[stockId] || 0) < amt) return alert('持股不足！');
    roomRef.update({
      [`players/${myId}/cash`]: p.cash + total,
      [`players/${myId}/stocks/${stockId}`]: (p.stocks?.[stockId] || 0) - amt
    }).then(() => { alert(`成功賣出 ${amt} 股 ${s.name}，套現 $${total}！`); openMarket(); });
  }
}

// 🤝 AI 主動交易 (當電腦差一塊地壟斷)
function checkBotTrade(botId) {
  const bot = localData.players[botId];
  if(!bot || bot.bankrupt) return;
  const gs = localData.gameState;
  
  // 尋找電腦想壟斷嘅區
  const districts = [...new Set(BOARD.filter(c=>c.t==='prop').map(c=>c.d))];
  for(let d of districts) {
    const props = BOARD.map((c, i) => c.t==='prop' && c.d===d ? i : -1).filter(i=>i>=0);
    const botOwns = props.filter(i => gs.owners[i]?.owner === botId);
    const others = props.filter(i => gs.owners[i] && gs.owners[i].owner !== botId);
    
    // 差一塊就壟斷
    if(botOwns.length === props.length - 1 && others.length === 1) {
      const targetProp = others[0];
      const ownerId = gs.owners[targetProp].owner;
      const ownerP = localData.players[ownerId];
      
      // 如果嗰塊地係玩家嘅，且電腦有錢
      if(!ownerP.isBot && bot.cash > BOARD[targetProp].price) {
        const offer = Math.round(BOARD[targetProp].price * 1.5);
        showModal(`<h3>🤝 電腦提出交易</h3><p>🤖 ${bot.name} 想收購你嘅 <b>${BOARD[targetProp].n}</b> 以完成壟斷！</p><p>佢出價：<b style="color:var(--green)">$${offer.toLocaleString()}</b></p>
        <button class="btn primary" onclick="acceptTrade('${botId}', ${targetProp}, ${offer})">接受交易</button>
        <button class="btn danger" onclick="closeModal()">拒絕</button>`);
        return true; // 只觸發一次
      }
    }
  }
  return false;
}

function acceptTrade(botId, propId, offer) {
  const p = localData.players[myId];
  const bot = localData.players[botId];
  roomRef.update({
    [`players/${myId}/cash`]: p.cash + offer,
    [`players/${myId}/props`]: p.props.filter(i => i !== propId),
    [`gameState/owners/${propId}/owner`]: botId,
    [`players/${botId}/props`]: [...(bot.props||[]), propId],
    [`players/${botId}/cash`]: bot.cash - offer
  }).then(() => {
    addLog(`🤝 你以 $${offer.toLocaleString()} 將 ${BOARD[propId].n} 賣咗俾 ${bot.name}！`, 'money');
    closeModal();
  });
}

// 🏆 成就檢查
function checkAchievements(pid) {
  const p = localData.players[pid];
  if(!p || p.bankrupt) return;
  let newAch = [];
  ACHIEVEMENTS.forEach(a => {
    if(!p.achievements?.includes(a.n) && a.check(p)) {
      newAch.push(a.n);
    }
  });
  if(newAch.length > 0) {
    roomRef.update({ [`players/${pid}/achievements`]: [...(p.achievements||[]), ...newAch] });
    if(pid === myId) addLog(`🏆 解鎖成就：${newAch.join(', ')}`, 'system');
  }
}

function checkBotTurn() {
  if(!localData || !localData.gameState || localData.gameState.phase !== 'roll' || localData.gameState.auction || isRolling) return;
  const curId = localData.gameState.currentId;
  const curP = localData.players[curId];
  
  if(curP && curP.isBot) {
    // 檢查 AI 係咪要交易
    if(checkBotTrade(curId)) return; // 如果彈出交易，先暫停 AI 擲骰

    if(Date.now() - lastBotRollAttempt > 1500) {
      lastBotRollAttempt = Date.now();
      doBotRoll(curId);
    }
  }
}

function doBotRoll(botId) {
  const p = localData.players[botId];
  if(!p || p.bankrupt) { endTurn(); return; }
  isRolling = true; renderBoard();
  
  setTimeout(() => {
    isRolling = false;
    const d1 = Math.ceil(Math.random()*6), d2 = Math.ceil(Math.random()*6);
    let steps = d1 + d2;
    if(p.movePenalty > 0) { steps = Math.max(1, steps - p.movePenalty); roomRef.update({[`players/${botId}/movePenalty`]: 0}); }
    
    let isJailBreak = false;
    if (p.pos === 10 && d1 === d2) isJailBreak = true;

    roomRef.update({ [`gameState/dice1`]: d1, [`gameState/dice2`]: d2 }).then(() => {
      animState = { active: true, pid: botId, current: p.pos, steps: isJailBreak ? 0 : steps, newCash: p.cash };
      let count = 0;

      const timer = setInterval(() => {
        animState.current = (animState.current + 1) % 40;
        if (animState.current === 0) { animState.newCash += 20000; if (p.emoji === '🐱') animState.newCash += 10000; }
        count++; renderAll();
        if (count >= animState.steps) {
          clearInterval(timer); animState.active = false;
          let updates = { [`players/${botId}/pos`]: animState.current, [`players/${botId}/cash`]: animState.newCash, [`gameState/phase`]: 'action' };
          if(isJailBreak) updates[`players/${botId}/jailTurns`] = 0;
          
          roomRef.update(updates).then(() => { 
            if(!isJailBreak) handleBotLanding(botId, animState.current); 
            else setTimeout(endTurn, 1000);
          });
        }
      }, 150); 
    });
  }, 600);
}

function handleBotLanding(botId, pos) {
  const cell = BOARD[pos], p = localData.players[botId];
  const ownerData = localData.gameState.owners && localData.gameState.owners[pos];
  const finishTurn = () => setTimeout(endTurn, 1000);

  if(['prop','station','utility'].includes(cell.t)) {
    if (!ownerData && p.cash >= cell.price) {
      roomRef.update({
        [`gameState/owners/${pos}`]: { owner: botId, level: 0 },
        [`players/${botId}/props`]: [...(p.props||[]), pos],
        [`players/${botId}/cash`]: p.cash - cell.price
      }).then(() => { addLog(`🤖 ${p.name} 買入 ${cell.n}`, 'money'); finishTurn(); });
    } else if (ownerData && ownerData.owner !== botId) {
      const ownerId = ownerData.owner;
      const ownerP = localData.players[ownerId];
      const level = ownerData.level || 0;
      
      let rent = cell.rent || 0;
      if(cell.t === 'prop') {
        rent = cell.rent * Math.pow(2, level);
        if(checkMonopoly(ownerId, cell.d)) rent *= 2;
      } else if (cell.t === 'station') {
        const stationCount = ownerP.props.filter(i => BOARD[i].t === 'station').length;
        rent = cell.rent * stationCount;
      } else if (cell.t === 'utility') {
        const diceSum = (localData.gameState.dice1 || 1) + (localData.gameState.dice2 || 1);
        rent = diceSum * 1000; // 公用事業 $1000 x 骰子點數
      }
      
      if (ownerP.emoji === '🐶') rent = Math.round(rent * 1.2);
      if (p.emoji === '🐯') rent = Math.round(rent * 0.8);
      
      roomRef.update({ [`players/${botId}/cash`]: p.cash - rent, [`players/${ownerId}/cash`]: ownerP.cash + rent })
        .then(() => { addLog(`🤖 ${p.name} 向 ${ownerP.name} 交租 $${rent.toLocaleString()}`, 'danger'); checkBankrupt(botId); finishTurn(); });
    } else {
      startAuction(pos);
    }
  } else if (cell.t === 'chance') {
    const card = CHANCE_CARDS[Math.floor(Math.random()*CHANCE_CARDS.length)];
    handleChanceCard(card, botId);
    addLog(`🤖 ${p.name} 抽中：${card.text}`, 'system');
    setTimeout(() => { checkBankrupt(botId); finishTurn(); }, 500);
  } else if (cell.t === 'tax') {
    const tax = Math.max(5000, Math.round(p.cash*0.1));
    roomRef.update({ [`players/${botId}/cash`]: p.cash - tax })
      .then(() => { addLog(`🤖 ${p.name} 交稅 $${tax.toLocaleString()}`, 'danger'); checkBankrupt(botId); finishTurn(); });
  } else if (cell.t === 'gojail') {
    roomRef.update({ [`players/${botId}/pos`]: 10, [`players/${botId}/jailTurns`]: 1, [`players/${botId}/jailCount`]: (p.jailCount||0)+1 }).then(() => finishTurn());
  } else if (cell.t === 'free') {
    roomRef.update({ [`players/${botId}/cash`]: p.cash + 5000 }).then(() => finishTurn());
  } else if (cell.t === 'black') {
    if(p.cash > 30000) { roomRef.update({ [`players/${botId}/cash`]: p.cash - 30000 }).then(() => finishTurn()); } 
    else { finishTurn(); }
  } else if (cell.t === 'market') {
    // 電腦隨機買股票
    const stocks = Object.keys(localData.gameState.stocks);
    const randStock = stocks[Math.floor(Math.random()*stocks.length)];
    const price = localData.gameState.stocks[randStock].price;
    if(p.cash > price * 2) {
      roomRef.update({ [`players/${botId}/cash`]: p.cash - price, [`players/${botId}/stocks/${randStock}`]: (p.stocks?.[randStock]||0)+1 })
        .then(()=> { addLog(`🤖 ${p.name} 喺市場買入 1 股股票`, 'system'); finishTurn(); });
    } else finishTurn();
  } else { finishTurn(); }
}

function doRoll() {
  const gs = localData.gameState; if(gs.currentId !== myId || gs.phase !== 'roll' || gs.auction) return;
  const p = localData.players[myId];
  if(p.bankrupt) return alert('你已經破產！');
  
  isRolling = true; renderBoard();
  
  setTimeout(() => {
    isRolling = false;
    const d1 = Math.ceil(Math.random()*6), d2 = Math.ceil(Math.random()*6);
    let steps = d1 + d2;
    if(p.movePenalty > 0) { steps = Math.max(1, steps - p.movePenalty); roomRef.update({[`players/${myId}/movePenalty`]: 0}); }
    
    let isJailBreak = false;
    if (p.pos === 10 && d1 === d2) isJailBreak = true;

    roomRef.update({ [`gameState/dice1`]: d1, [`gameState/dice2`]: d2 }).then(() => {
      animState = { active: true, pid: myId, current: p.pos, steps: isJailBreak ? 0 : steps, newCash: p.cash };
      let count = 0;

      const timer = setInterval(() => {
        animState.current = (animState.current + 1) % 40;
        if (animState.current === 0) { animState.newCash += 20000; if (p.emoji === '🐱') animState.newCash += 10000; }
        count++; renderAll();
        if (count >= animState.steps) {
          clearInterval(timer); animState.active = false;
          let updates = { [`players/${myId}/pos`]: animState.current, [`players/${myId}/cash`]: animState.newCash, [`gameState/phase`]: 'action' };
          if(isJailBreak) updates[`players/${myId}/jailTurns`] = 0;
          roomRef.update(updates).then(() => { if(!isJailBreak) handleLanding(animState.current); });
        }
      }, 200); 
    });
  }, 600);
}

function handleLanding(pos) {
  const cell = BOARD[pos], p = localData.players[myId];
  const ownerData = localData.gameState.owners && localData.gameState.owners[pos];

  if (['prop','station','utility'].includes(cell.t)) {
    if (!ownerData && p.cash >= cell.price) {
      showModal(`<h3>🏠 購買 ${cell.n}</h3>
        <p>地價：<b style="color:var(--gold)">$${cell.price.toLocaleString()}</b><br>租金：<b style="color:var(--green)">$${cell.rent.toLocaleString()}</b></p>
        <button class="btn primary" onclick="buyProperty(${pos})">買！</button><button class="btn" onclick="startAuction(${pos}); closeModal();">暗標拍賣</button><button class="btn" onclick="closeModal()">放棄</button>`);
    } else if (ownerData && ownerData.owner !== myId) {
      const ownerId = ownerData.owner;
      const ownerP = localData.players[ownerId];
      const level = ownerData.level || 0;
      
      let rent = cell.rent || 0;
      if(cell.t === 'prop') {
        rent = cell.rent * Math.pow(2, level);
        if(checkMonopoly(ownerId, cell.d)) rent *= 2;
      } else if (cell.t === 'station') {
        const stationCount = ownerP.props.filter(i => BOARD[i].t === 'station').length;
        rent = cell.rent * stationCount;
      } else if (cell.t === 'utility') {
        const diceSum = (localData.gameState.dice1 || 1) + (localData.gameState.dice2 || 1);
        rent = diceSum * 1000;
      }
      
      if (ownerP.emoji === '🐶') rent = Math.round(rent * 1.2);
      if (p.emoji === '🐯') rent = Math.round(rent * 0.8);
      
      const msg = `踩中 ${ownerP.name} 嘅 ${cell.n}，要交租 $${rent.toLocaleString()}\n\n你目前現金：$${p.cash.toLocaleString()}`;
      if(confirm(msg)) {
        roomRef.update({ [`players/${myId}/cash`]: p.cash - rent, [`players/${ownerId}/cash`]: ownerP.cash + rent })
          .then(() => { addLog(`💸 ${p.name} 向 ${ownerP.name} 交租 $${rent.toLocaleString()}`, 'danger'); checkBankrupt(myId); checkAchievements(myId); });
      }
    } else if (!ownerData && p.cash < cell.price) {
       showModal(`<h3>🏠 ${cell.n}</h3><p>你現金不足以購買，觸發全場暗標拍賣！</p><button class="btn primary" onclick="startAuction(${pos}); closeModal();">開始拍賣</button>`);
    }
  } else if (cell.t === 'chance') {
    const card = CHANCE_CARDS[Math.floor(Math.random()*CHANCE_CARDS.length)];
    handleChanceCard(card, myId);
    showModal(`<h3>❓ 機會</h3><p>${card.text}</p><button class="btn" onclick="closeModal()">確定</button>`);
    addLog(`❓ ${p.name} 抽中：${card.text}`, 'system');
  } else if (cell.t === 'tax') {
    const tax = Math.max(5000, Math.round(p.cash*0.1));
    roomRef.update({ [`players/${myId}/cash`]: p.cash - tax }).then(() => { addLog(`🏛️ ${p.name} 交稅`, 'danger'); checkBankrupt(myId); });
  } else if (cell.t === 'gojail') {
    roomRef.update({ [`players/${myId}/pos`]: 10, [`players/${myId}/jailTurns`]: 1, [`players/${myId}/jailCount`]: (p.jailCount||0)+1 });
    addLog(`👮 ${p.name} 被送入監獄！`, 'danger');
  } else if (cell.t === 'free') {
    roomRef.update({ [`players/${myId}/cash`]: p.cash + 5000 });
    showModal(`<h3>🏦 銀行</h3><p>你嚟到銀行，獲得 $5,000 存款利息！</p><button class="btn primary" onclick="closeModal()">多謝銀行！</button>`);
  } else if (cell.t === 'black') {
    openBlackMarket();
  } else if (cell.t === 'market') {
    openMarket();
  }
}

function checkBankrupt(pid) {
  if(localData.players[pid] && localData.players[pid].isCheckingBankrupt) return;
  db.ref(`rooms/${roomCode}/players/${pid}`).once('value').then(snap => {
    const p = snap.val(); if (!p || p.bankrupt || p.cash >= 0) return;
    roomRef.child(`players/${pid}/isCheckingBankrupt`).set(true);

    if (p.props && p.props.length > 0) {
      let newProps = [...p.props], currentCash = p.cash, updates = {};
      let saveProp = null;
      if (p.emoji === '🐼' && !p.pandasSaved && newProps.length > 0) {
        newProps.sort((a,b) => BOARD[b].price - BOARD[a].price);
        saveProp = newProps.shift(); updates[`players/${pid}/pandasSaved`] = true;
      }
      while (currentCash < 0 && newProps.length > 0) {
        const sellPos = newProps.shift();
        const sellValue = Math.floor((BOARD[sellPos].price||0) * 0.7);
        currentCash += sellValue;
        updates[`gameState/owners/${sellPos}`] = null;
        if(saveProp && newProps.length === 0) newProps.push(saveProp);
        updates[`players/${pid}/props`] = newProps; updates[`players/${pid}/cash`] = currentCash;
        addLog(`🏚️ ${p.name} 賣地還債。`, 'danger');
      }
      if (currentCash >= 0) { updates[`players/${pid}/isCheckingBankrupt`] = null; roomRef.update(updates); return; }
    }

    let updates = { [`players/${pid}/bankrupt`]: true, [`players/${pid}/cash`]: 0, [`players/${pid}/props`]: [], [`players/${pid}/debts`]: [], [`players/${pid}/isCheckingBankrupt`]: null };
    if (p.props) p.props.forEach(pos => { updates[`gameState/owners/${pos}`] = null; });
    roomRef.update(updates);
    addLog(`💀 ${p.name} 宣佈破產！`, 'danger');
    if (pid === myId) setTimeout(() => { alert('你已經破產！'); endTurn(); }, 500);
    else if (localData.gameState.currentId === pid) setTimeout(() => endTurn(), 1500);
  });
}

function endTurn() {
  const gs = localData.gameState; if(gs.phase !== 'action' && gs.currentId !== myId) return;
  if(gs.auction) return;
  
  const pIds = Object.keys(localData.players);
  let nextIndex = (pIds.indexOf(gs.currentId) + 1) % pIds.length;
  let safeCounter = 0;
  while (localData.players[pIds[nextIndex]].bankrupt) {
    nextIndex = (nextIndex + 1) % pIds.length; safeCounter++;
    if (safeCounter > pIds.length) { roomRef.update({ status: 'finished' }); return; }
  }
  
  const updates = {};
  updates['gameState/currentId'] = pIds[nextIndex];
  updates['gameState/phase'] = 'roll';
  updates['gameState/dice1'] = null; updates['gameState/dice2'] = null;
  updates['gameState/rentBoost'] = 1;
  lastBotRollAttempt = 0;

  let isNewRound = nextIndex <= pIds.indexOf(gs.currentId);
  
  if(isNewRound) {
    let nextRound = gs.round + 1;
    updates['gameState/round'] = nextRound;
    
    // 觸發大事件
    let gEv = triggerGlobalEvent(nextRound);
    if(gEv) {
      updates['gameState/globalEvent'] = gEv;
      addLog(`🌪️【全球大事件】${gEv.n}：${gEv.d}`, 'system');
    } else {
      updates['gameState/globalEvent'] = null;
    }

    // 股票升跌
    const stocks = { ...localData.gameState.stocks };
    Object.keys(stocks).forEach(k => {
      let change = 0.8 + Math.random() * 0.4; // 跌20% ~ 升20%
      stocks[k].price = Math.max(1, Math.round(stocks[k].price * change));
    });
    updates['gameState/stocks'] = stocks;

    // 派錢及處理利息
    pIds.forEach(pid => {
      const pl = localData.players[pid]; if(pl.bankrupt) return;
      let roundBonus = 10000; if (pl.emoji === '👦') roundBonus += 5000;
      let newCash = (pl.cash || 0) + roundBonus;
      let updatesDebts = false;
      
      if(pl.debts && pl.debts.length > 0) {
        updates[`players/${pid}/debts`] = pl.debts.map(d => {
           let rate = d.rate; if(gEv?.type === 'debt') rate *= 2;
           d.principal += Math.round(d.principal * rate); return d;
        });
      }
      
      if(gEv?.type === 'cash') newCash = Math.round(newCash * 0.9);
      if(gEv?.type === 'price') {
         // 未起樓嘅地價上升 (簡化處理：直接加現金)
         newCash += 20000;
      }
      
      updates[`players/${pid}/cash`] = newCash;
    });
  }
  
  if(gs.round > gs.totalRounds) { 
    roomRef.update({ 'status': 'finished' }); 
  } else {
    roomRef.update(updates).then(() => {
      pIds.forEach(pid => { if(localData.players[pid].debts?.length > 0) checkBankrupt(pid); });
      if(isNewRound) { checkAchievements(myId); }
    }); 
  }
}

function getGridPos(i){
  if(i===0) return {r:11,c:11}; if(i>=1&&i<=9) return {r:11,c:11-i}; if(i===10) return {r:11,c:1};
  if(i>=11&&i<=19) return {r:11-(i-10),c:1}; if(i===20) return {r:1,c:1}; if(i>=21&&i<=29) return {r:1,c:1+(i-20)};
  if(i===30) return {r:1,c:11}; if(i>=31&&i<=39) return {r:1+(i-30),c:11};
}
function renderAll() { renderBoard(); renderPlayers(); }
function checkMonopoly(pid, district) {
  if(!district) return false;
  const props = BOARD.map((c, i) => c.t==='prop' && c.d===district ? i : -1).filter(i=>i>=0);
  return props.every(i => localData.gameState.owners[i] && localData.gameState.owners[i].owner === pid);
}
function buyProperty(pos) {
  const cell = BOARD[pos], p = localData.players[myId];
  if(p.cash < cell.price) return closeModal();
  roomRef.update({
    [`gameState/owners/${pos}`]: { owner: myId, level: 0 },
    [`players/${myId}/props`]: [...(p.props||[]), pos],
    [`players/${myId}/cash`]: p.cash - cell.price
  }).then(() => { addLog(`🏠 ${p.name} 買入 ${cell.n}`, 'money'); closeModal(); checkAchievements(myId); });
}
function openBlackMarket() {
  const p = localData.players[myId];
  const bmDiscount = p.emoji === '🐸' ? 0.7 : 0.8;
  showModal(`<h3>🕶️ 黑市地下交易</h3>
    <button class="btn danger" onclick="bmLoan()">💰 借大耳窿 ($50,000 / 30%息)</button>
    <button class="btn primary" onclick="bmBuyLand(${bmDiscount})">🏚️ 黑市買地 (${bmDiscount*10}折)</button>
    <button class="btn" style="color:var(--purple)" onclick="bmSabotage()">💣 買拆遷卡 ($30,000)</button>
    <button class="btn" onclick="closeModal()">離開</button>`);
}
function bmLoan() {
  const p = localData.players[myId];
  roomRef.update({ [`players/${myId}/cash`]: p.cash + 50000, [`players/${myId}/debts`]: [...(p.debts||[]), { lender: 'bank', principal: 50000, rate: 0.3 }] })
  .then(() => { addLog(`🕶️ ${p.name} 借大耳窿！`, 'danger'); closeModal(); });
}
function bmBuyLand(discount) {
  const p = localData.players[myId];
  const unowned = BOARD.map((c, i) => c.t==='prop' && !(localData.gameState.owners && localData.gameState.owners[i]) ? i : -1).filter(i=>i>=0);
  if(unowned.length === 0) return alert('冇無主地喇！');
  const targetPos = unowned[Math.floor(Math.random()*unowned.length)];
  const price = Math.round(BOARD[targetPos].price * discount);
  if (p.cash < price) { alert(`抽中 ${BOARD[targetPos].n}，但需 $${price}，現金不足！`); return; }
  if(confirm(`抽中 ${BOARD[targetPos].n}！\n黑市價：$${price}\n要買嗎？`)) {
    roomRef.update({ [`gameState/owners/${targetPos}`]: { owner: myId, level: 0 }, [`players/${myId}/props`]: [...(p.props||[]), targetPos], [`players/${myId}/cash`]: p.cash - price })
    .then(() => { addLog(`🕶️ ${p.name} 黑市買地。`, 'money'); closeModal(); });
  }
}
function bmSabotage() {
  const p = localData.players[myId];
  if (p.cash < 30000) return alert('現金不足！');
  const targets = Object.keys(localData.players).filter(pid => pid !== myId && localData.players[pid].props?.length > 0);
  if(targets.length === 0) return alert('冇人俾你拆！');
  if(confirm('確定花 $30,000 拆對手樓？')) {
    const victimId = targets[Math.floor(Math.random()*targets.length)];
    const victimP = localData.players[victimId];
    const targetProp = victimP.props[Math.floor(Math.random()*victimP.props.length)];
    const ownerData = localData.gameState.owners[targetProp];
    const updates = { [`players/${myId}/cash`]: p.cash - 30000, [`players/${myId}/sabotageCount`]: (p.sabotageCount||0)+1 };
    if(ownerData.level > 0) updates[`gameState/owners/${targetProp}/level`] = ownerData.level - 1;
    else { updates[`gameState/owners/${targetProp}/owner`] = null; updates[`players/${victimId}/props`] = victimP.props.filter(i => i !== targetProp); }
    roomRef.update(updates).then(() => { addLog(`💣 ${p.name} 拆咗 ${victimP.name} 嘅地！`, 'danger'); closeModal(); checkAchievements(myId); });
  }
}

function payBail() { const gs = localData.gameState; if(gs.currentId !== myId || gs.phase !== 'roll') return; const p = localData.players[myId]; if (p.cash < 10000) return alert('現金不足！'); if(confirm('付 $10,000 保釋金？')) roomRef.update({ [`players/${myId}/cash`]: p.cash - 10000, [`players/${myId}/pos`]: 0, [`players/${myId}/jailTurns`]: 0 }); }
function showCellInfo(pos) { 
  const cell = BOARD[pos]; if(!['prop','station','utility'].includes(cell.t)) return; 
  const ownerId = localData.gameState.owners[pos]?.owner; 
  if (!ownerId) { showModal(`<h3>${cell.n}</h3><p>無主地<br>地價：$${cell.price.toLocaleString()}</p><button class="btn" onclick="closeModal()">關閉</button>`); } 
  else { 
    const ownerP = localData.players[ownerId]; 
    const level = localData.gameState.owners[pos].level || 0;
    let rent = cell.rent || 0;
    if(cell.t==='prop') rent = cell.rent * Math.pow(2, level);
    else if(cell.t==='station') rent = cell.rent * ownerP.props.filter(i=>BOARD[i].t==='station').length;
    else if(cell.t==='utility') rent = 7000; 
    
    if (ownerId === myId && localData.gameState.currentId === myId && cell.t === 'prop') { 
      const cost = cell.price / 2; 
      showModal(`<h3>🏠 ${cell.n}</h3><p>業主：你<br>等級：Level ${level}<br>租金：$${rent.toLocaleString()}</p><button class="btn primary" onclick="upgradeProperty(${pos})" ${level>=3||localData.players[myId].cash<cost?'disabled':''}>升級 ($${cost.toLocaleString()})</button><button class="btn" onclick="closeModal()">關閉</button>`); 
    } else { 
      showModal(`<h3>🏠 ${cell.n}</h3><p>業主：${ownerP.emoji} ${ownerP.name}<br>租金：$${rent.toLocaleString()}</p><button class="btn" onclick="closeModal()">關閉</button>`); 
    } 
  } 
}
function upgradeProperty(pos) { const cell = BOARD[pos], p = localData.players[myId]; const ownerData = localData.gameState.owners[pos]; if(!ownerData || ownerData.owner !== myId) return; if(p.cash < cell.price / 2) return alert('現金不足！'); roomRef.update({ [`gameState/owners/${pos}/level`]: (ownerData.level || 0) + 1, [`players/${myId}/cash`]: p.cash - (cell.price / 2) }).then(() => { closeModal(); }); }

// 玩家主動交易
function openTradeModal() {
  const others = Object.keys(localData.players).filter(id => id !== myId && !localData.players[id].bankrupt);
  if(others.length === 0) return;
  const targetId = others[0]; // 簡化：只同第一個非破產玩家交易
  const targetP = localData.players[targetId];
  const myP = localData.players[myId];
  if(!myP.props || myP.props.length === 0) return alert('你冇地可以換！');
  
  const myOpts = myP.props.map(i => `<option value="${i}">${BOARD[i].n}</option>`).join('');
  const targetOpts = targetP.props.map(i => `<option value="${i}">${BOARD[i].n}</option>`).join('');
  
  showModal(`<h3>🤝 提出交易</h3><p>向 ${targetP.emoji} ${targetP.name} 提出交易：</p>
  <div class="loan-row"><label>我的地</label><select id="tradeMyProp"><option value="">唔出地</option>${myOpts}</select></div>
  <div class="loan-row"><label>我補現金</label><input type="number" id="tradeMyCash" value="0" step="10000"></div>
  <div class="loan-row"><label>換對方地</label><select id="tradeTargetProp"><option value="">唔要地</option>${targetOpts}</select></div>
  <div class="loan-row"><label>對方補現金</label><input type="number" id="tradeTargetCash" value="0" step="10000"></div>
  <button class="btn primary" onclick="submitTrade('${targetId}')">發送交易</button><button class="btn" onclick="closeModal()">取消</button>`); 
}

function submitTrade(targetId) { 
  const myProp = document.getElementById('tradeMyProp').value; 
  let myCash = +document.getElementById('tradeMyCash').value; 
  let targetCash = +document.getElementById('tradeTargetCash').value; 
  const targetProp = document.getElementById('tradeTargetProp').value;
  const myP = localData.players[myId]; 
  const targetP = localData.players[targetId]; 
  if (myCash > myP.cash) return alert('你現金不足！'); 
  if (myP.emoji === '👧') { targetCash += 5000; } 
  const updates = {}; 
  updates[`players/${myId}/cash`] = myP.cash - myCash + targetCash; 
  updates[`players/${targetId}/cash`] = targetP.cash - targetCash + myCash; 
  if(myProp) updates[`gameState/owners/${myProp}/owner`] = targetId; 
  if(targetProp) updates[`gameState/owners/${targetProp}/owner`] = myId; 
  roomRef.update(updates).then(() => { addLog(`🤝 交易完成！`, 'system'); closeModal(); }); 
}

function openLoanModal() { const p = localData.players[myId]; showModal(`<h3>💸 借款</h3><div class="loan-row"><label>借款額</label><input type="number" id="loanAmount" value="20000" step="5000"></div><div class="loan-row"><label>每回合息</label><select id="loanRate"><option value="0.05">5%</option><option value="0.1">10%</option><option value="0.2">20%</option></select></div><button class="btn primary" onclick="confirmLoan()">確認</button><button class="btn" onclick="closeModal()">取消</button>`); }
function confirmLoan() { const amount = +document.getElementById('loanAmount').value; let rate = +document.getElementById('loanRate').value; const p = localData.players[myId]; if(amount < 5000) return alert('最少借 $5,000'); if (p.emoji === '🦊') rate = Math.max(0.01, rate - 0.05); roomRef.update({ [`players/${myId}/cash`]: p.cash + amount, [`players/${myId}/debts`]: [...(p.debts||[]), { lender: 'bank', principal: amount, rate }] }); closeModal(); }

function calcNetWorth(p) { let assets = p.cash; (p.props||[]).forEach(i => { const lvl = localData.gameState.owners[i] ? localData.gameState.owners[i].level : 0; assets += BOARD[i].price + (BOARD[i].price / 2) * lvl; }); const debt = (p.debts||[]).reduce((s,d)=>s+d.principal,0); return assets - debt; }

function showGameOver() { 
  if(document.getElementById('modalMask')) return; 
  let results = Object.keys(localData.players).map(pid => { 
    const p = localData.players[pid]; 
    let net = p.bankrupt ? 0 : calcNetWorth(p); 
    let score = p.bankrupt ? -999 : Math.round(net / 1000); 
    return { p, net, score }; 
  }).sort((a,b) => b.score - a.score); 
  let html = `<h3 style="text-align:center;">🏆 遊戲結束</h3>`; 
  results.forEach((r, i) => { html += `<div class="rank-row ${i===0?'top':''}"><div><div class="rank-name">${i===0?'👑 ':''}${r.p.bankrupt?'💀':r.p.emoji} ${r.p.name}</div><div style="font-size:.75rem;color:var(--text-dim);">${r.p.bankrupt?'已破產':`總資產：$${r.net.toLocaleString()}`}</div>${r.p.achievements?.length ? `<div>${r.p.achievements.map(a=>`<span class="achieve-badge">🏆 ${a}</span>`).join('')}</div>` : ''}</div><div class="rank-score">${r.p.bankrupt?'出局':r.score+' 分'}</div></div>`; }); 
  html += `<button class="btn primary" style="margin-top:20px;" onclick="location.reload()">再玩一次</button>`; 
  showModal(html); 
}

function showModal(html) { closeModal(); const mask = document.createElement('div'); mask.className = 'modal-mask'; mask.id = 'modalMask'; mask.innerHTML = `<div class="modal">${html}</div>`; document.body.appendChild(mask); }
function closeModal() { const m = document.getElementById('modalMask'); if(m) m.remove(); }
function addLog(text, type='') { roomRef.child('logs').push({ text, type }); }
</script>
