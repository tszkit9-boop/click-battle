<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>滾雪球 · 全香港大富翁（神作版）</title>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --gold:#E8C46A; --gold-2:#B8912E; --gold-glow:rgba(232,196,106,.45);
    --bg-1:#0a0a14; --bg-2:#12122a; --bg-3:#1a1a35;
    --panel:rgba(26,26,53,.85); --panel-solid:#1a1a35;
    --border:rgba(232,196,106,.18); --border-2:rgba(232,196,106,.35);
    --text:#F0EAD8; --text-dim:#8a8478;
    --green:#4ade80; --red:#f87171; --blue:#60a5fa; --purple:#c084fc;
  }
  body{font-family:-apple-system,"PingFang HK","Microsoft JhengHei","Noto Sans HK",sans-serif;background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(232,196,106,.14),transparent 60%),radial-gradient(ellipse 60% 40% at 100% 100%,rgba(96,165,250,.08),transparent 50%),linear-gradient(160deg,var(--bg-1),var(--bg-2) 50%,var(--bg-1));color:var(--text);min-height:100vh;overflow-x:hidden;}
  button{font-family:inherit;cursor:pointer;border:none;transition:all .18s}
  button:active{transform:scale(.96)}
  button:disabled{opacity:.38;cursor:not-allowed;transform:none!important;filter:grayscale(.5)}
  .hidden{display:none!important}

  #lobby{max-width:480px;margin:0 auto;padding:60px 24px;min-height:100vh;display:flex;flex-direction:column;justify-content:center;}
  .logo h1{font-size:3rem;font-weight:900;letter-spacing:6px;text-align:center;background:linear-gradient(135deg,#FFF6D6,#E8C46A 40%,#B8912E 70%,#E8C46A);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  .logo .sub{text-align:center;color:var(--text-dim);font-size:.85rem;margin-bottom:32px;letter-spacing:2px;}
  .setup-card{background:var(--panel);border:1px solid var(--border);border-radius:22px;padding:28px;box-shadow:0 20px 40px rgba(0,0,0,.6);}
  .field{margin-bottom:18px;}
  .field label{display:block;font-size:.75rem;font-weight:700;color:var(--gold);margin-bottom:8px;letter-spacing:1px;}
  .field input{width:100%;background:rgba(10,10,20,.7);border:1px solid var(--border);color:var(--text);padding:12px;border-radius:11px;font-size:1rem;outline:none;}
  .field input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,196,106,.15);}
  
  .avatar-selector{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px;}
  .avatar-opt{font-size:1.6rem;padding:8px 12px;background:rgba(10,10,20,.7);border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:all .2s;filter:grayscale(1);opacity:.6;position:relative;min-width:48px;text-align:center;}
  .avatar-opt:hover{filter:grayscale(0);opacity:1;}
  .avatar-opt.active{background:rgba(232,196,106,.15);border-color:var(--gold);filter:grayscale(0);opacity:1;transform:scale(1.1);box-shadow:0 0 15px rgba(232,196,106,.3);}
  .avatar-opt .skill-hint{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:.6rem;color:var(--gold);white-space:nowrap;display:none;}
  .avatar-opt.active .skill-hint{display:block;}

  .btn-main{width:100%;padding:14px;border-radius:12px;background:linear-gradient(135deg,#F5DB99,#E8C46A,#B8912E);color:#1a1408;font-weight:900;font-size:1rem;margin-bottom:12px;box-shadow:0 6px 20px rgba(232,196,106,.3);}
  .btn-bot{width:100%;padding:14px;border-radius:12px;background:linear-gradient(135deg,#60a5fa,#3b82f6);color:#fff;font-weight:900;font-size:1rem;margin-bottom:12px;box-shadow:0 6px 20px rgba(96,165,250,.3);}
  .btn-outline{width:100%;padding:14px;border-radius:12px;background:transparent;border:1px solid var(--gold);color:var(--gold);font-weight:700;font-size:1rem;}
  .room-code{font-size:2.5rem;font-weight:900;color:var(--gold);letter-spacing:6px;margin:10px 0;}
  
  #game{display:grid;grid-template-columns:280px 1fr 320px;gap:16px;padding:16px;height:100vh;max-height:100vh;}
  @media(max-width:1200px){#game{grid-template-columns:1fr;height:auto;max-height:none;padding-bottom:50px}.board-wrap{order:-1}}
  
  .players-panel{display:flex;flex-direction:column;gap:10px;overflow-y:auto;max-height:calc(100vh - 32px);}
  .p-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px;position:relative;transition:all .3s;}
  .p-card.active{border-color:var(--gold);box-shadow:0 0 15px rgba(232,196,106,.2);transform:translateX(4px);}
  .p-card.bank-npc{border-color:rgba(96,165,250,.4);background:linear-gradient(160deg,rgba(30,40,60,.9),rgba(20,20,35,.9));}
  .p-card.bank-npc .p-name{color:var(--blue);}
  .p-card.bank-npc .p-cash{color:var(--blue);font-size:1.1rem;}
  .p-card.dead{opacity:.5;filter:grayscale(1);border-color:#333;}

  .p-head{display:flex;align-items:center;gap:9px;margin-bottom:6px;}
  .p-name{font-weight:800;font-size:1rem;}
  .p-skill{font-size:.65rem;color:var(--purple);background:rgba(192,132,252,.1);padding:2px 6px;border-radius:4px;display:inline-block;margin-top:2px;}
  .p-cash{font-size:1.4rem;font-weight:900;color:var(--green);text-shadow:0 0 10px rgba(74,222,128,.3);}
  .p-cash.neg{color:var(--red);}
  .p-stats{display:flex;gap:6px;margin-top:8px;font-size:.75rem;color:var(--text-dim);flex-wrap:wrap;}
  .p-stat{background:rgba(10,10,20,.6);padding:3px 8px;border-radius:6px;border:1px solid rgba(255,255,255,.05);}
  
  .board-wrap{display:flex;align-items:center;justify-content:center;}
  .board{display:grid;grid-template-columns:repeat(11,1fr);grid-template-rows:repeat(11,1fr);width:min(100%,calc(100vh - 32px));aspect-ratio:1;gap:3px;padding:8px;background:var(--panel-solid);border:1px solid var(--border);border-radius:18px;box-shadow:0 30px 60px rgba(0,0,0,.6);}
  .cell{background:rgba(35,35,56,.95);border-radius:6px;padding:4px;font-size:.6rem;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.04);transition:all .2s;}
  .cell:hover{border-color:var(--gold);transform:translateY(-1px);z-index:2;}
  .cell.tier-S{background:linear-gradient(160deg,rgba(74,60,20,.95),rgba(40,32,12,.95));border-color:rgba(232,196,106,.35);}
  .cell.tier-A{background:linear-gradient(160deg,rgba(60,22,22,.95),rgba(38,16,16,.95));border-color:rgba(192,57,43,.3);}
  .cell.tier-B{background:linear-gradient(160deg,rgba(20,38,54,.95),rgba(14,26,38,.95));border-color:rgba(36,113,163,.3);}
  .cell.corner{background:linear-gradient(160deg,rgba(48,38,80,.95),rgba(28,22,52,.95))!important;}
  .c-name{font-weight:800;font-size:.65rem;line-height:1.15;}
  .c-price{color:var(--gold);font-size:.55rem;font-weight:800;}
  .c-icon{text-align:center;font-size:1.2rem;line-height:1;}
  .c-label{text-align:center;font-size:.5rem;color:var(--text-dim);font-weight:700;}
  
  .c-owner{position:absolute;top:3px;right:3px;width:10px;height:10px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 8px currentColor;}
  .c-level{position:absolute;top:2px;left:2px;font-size:.55rem;color:#fff;background:rgba(0,0,0,.8);padding:1px 4px;border-radius:4px;font-weight:900;z-index:3;}
  .c-level.monopoly{background:var(--gold);color:#000;box-shadow:0 0 8px var(--gold);animation:pulse 2s infinite;}

  .c-pawns{position:absolute;bottom:2px;left:2px;right:2px;display:flex;gap:2px;flex-wrap:wrap;justify-content:center;}
  .pawn-avatar{width:20px;height:20px;font-size:14px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(0,0,0,.5);border:1.5px solid;box-shadow:0 2px 5px rgba(0,0,0,.5);transition:all 0.15s ease-in-out;}
  
  .center-panel{grid-row:2/11;grid-column:2/11;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;background:radial-gradient(circle,rgba(232,196,106,.05),transparent 70%);border-radius:14px;}
  .turn-player{font-size:1.6rem;font-weight:900;text-shadow:0 0 20px currentColor;display:flex;align-items:center;gap:8px;}
  .turn-cash{font-size:1.2rem;font-weight:900;color:var(--green);margin-top:-6px;}
  .turn-cash.neg{color:var(--red);}
  
  .timer-bar{width:200px;height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-top:-6px;}
  .timer-fill{height:100%;background:var(--gold);width:100%;transition:width 1s linear;}
  .timer-fill.warning{background:var(--red);}

  .dice-row{display:flex;gap:14px;}
  .die{width:60px;height:60px;border-radius:14px;background:linear-gradient(145deg,#FFF8E6,#E8DCC0);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:900;color:#1a1a2e;box-shadow:0 8px 0 #B8A880, 0 12px 20px rgba(0,0,0,.5);}
  .die.rolling{animation:shake .5s infinite;}
  @keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-15deg)}75%{transform:rotate(15deg)}}
  
  .action-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  .btn{padding:10px 20px;border-radius:12px;font-weight:800;font-size:.85rem;background:rgba(40,40,68,.9);color:var(--text);border:1px solid rgba(255,255,255,.08);box-shadow:0 4px 10px rgba(0,0,0,.4);}
  .btn:hover{background:rgba(56,56,90,.95);}
  .btn.primary{background:linear-gradient(135deg,#F5DB99,#E8C46A);color:#1a1408;font-weight:900;}
  .btn.danger{background:linear-gradient(135deg,#f87171,#dc2626);color:#fff;}
  
  .log-panel{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--border);border-radius:16px;overflow:hidden;max-height:calc(100vh - 32px);}
  .log-title{padding:10px 14px;font-weight:800;font-size:.8rem;color:var(--gold);border-bottom:1px solid var(--border);background:rgba(10,10,20,.4);letter-spacing:1px;}
  .log-list{flex:1;overflow-y:auto;padding:10px;font-size:.8rem;display:flex;flex-direction:column;gap:6px;}
  .log-item{padding:4px 0;border-bottom:1px dashed rgba(255,255,255,.05);color:#c8c2b4;}
  .log-item.money{color:var(--green);}
  .log-item.danger{color:var(--red);}
  .log-item.system{color:var(--purple);}
  .chat-area{border-top:1px solid var(--border);display:flex;flex-direction:column;height:40%;}
  .chat-input-wrap{display:flex;padding:8px;background:rgba(10,10,20,.5);}
  .chat-input-wrap input{flex:1;background:rgba(0,0,0,.3);border:1px solid var(--border);color:#fff;outline:none;padding:8px 12px;border-radius:8px;font-size:.85rem;}
  .chat-input-wrap button{background:var(--gold);color:#000;padding:8px 16px;border-radius:8px;font-weight:800;margin-left:8px;}
  .msg .sender{font-weight:800;color:var(--gold);font-size:.75rem;margin-bottom:2px;}
  
  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;overflow-y:auto;}
  .modal{background:linear-gradient(160deg,#1c1c38,#14142a);border:1px solid var(--gold);border-radius:20px;padding:28px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.8), 0 0 40px rgba(232,196,106,.2);animation:pop .3s cubic-bezier(.34,1.56,.64,1);margin:auto;}
  @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
  .modal h3{color:var(--gold);margin-bottom:12px;font-size:1.2rem;}
  .modal p{color:#c8c2b4;margin-bottom:20px;line-height:1.5;font-size:.9rem;}
  .modal .btn{width:100%;margin-bottom:10px;}
  .loan-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:.85rem;}
  .loan-row label{min-width:80px;color:var(--text-dim);}
  .loan-row select,.loan-row input{flex:1;background:rgba(10,10,20,.7);border:1px solid var(--border);color:#fff;padding:8px;border-radius:8px;font-size:.9rem;}
  
  .rank-row{display:flex;justify-content:space-between;align-items:center;padding:12px;background:rgba(0,0,0,.3);border-radius:10px;margin-bottom:8px;border:1px solid var(--border);}
  .rank-row.top{background:linear-gradient(90deg,rgba(232,196,106,.2),transparent);border-color:var(--gold);}
  .rank-name{font-size:1.1rem;font-weight:900;display:flex;align-items:center;gap:8px;}
  .rank-score{font-size:1.2rem;font-weight:900;color:var(--gold);}
  .auction-box{background:rgba(0,0,0,.4);border:1px solid var(--gold);border-radius:12px;padding:16px;margin-bottom:16px;text-align:center;}
  .auction-timer{font-size:2rem;font-weight:900;color:var(--red);margin:10px 0;font-variant-numeric:tabular-nums;}
</style>
</head>
<body>

<div id="lobby">
  <div class="logo">
    <h1>滾雪球</h1>
    <div class="sub">全香港大富翁 · 神作版</div>
  </div>
  
  <div class="setup-card" id="lobby-actions">
    <div class="field">
      <label>你的名字</label>
      <input type="text" id="playerName" placeholder="輸入名字" maxlength="8">
    </div>
    
    <div class="field">
      <label>選擇你的代表公仔（各具專屬技能）</label>
      <div class="avatar-selector" id="avatarSelector">
        <div class="avatar-opt active" data-emoji="👧" onclick="selectAvatar(this)">👧<div class="skill-hint">交易專家</div></div>
        <div class="avatar-opt" data-emoji="👦" onclick="selectAvatar(this)">👦<div class="skill-hint">打工達人</div></div>
        <div class="avatar-opt" data-emoji="🐱" onclick="selectAvatar(this)">🐱<div class="skill-hint">招財貓</div></div>
        <div class="avatar-opt" data-emoji="🐶" onclick="selectAvatar(this)">🐶<div class="skill-hint">看門狗</div></div>
        <div class="avatar-opt" data-emoji="🐯" onclick="selectAvatar(this)">🐯<div class="skill-hint">猛虎</div></div>
        <div class="avatar-opt" data-emoji="🦊" onclick="selectAvatar(this)">🦊<div class="skill-hint">狡猾狐狸</div></div>
        <div class="avatar-opt" data-emoji="🐼" onclick="selectAvatar(this)">🐼<div class="skill-hint">國寶保護</div></div>
        <div class="avatar-opt" data-emoji="🐸" onclick="selectAvatar(this)">🐸<div class="skill-hint">黑市大佬</div></div>
      </div>
    </div>

    <button class="btn-bot" onclick="startSoloGame()">🤖 單人模式（挑戰電腦）</button>
    <div style="text-align:center; margin:16px 0; color:#8a8478; font-size:.8rem;">— 或者同朋友玩 —</div>
    <button class="btn-main" onclick="createRoom()">➕ 建立新房間</button>
    <button class="btn-outline" style="margin-bottom:16px;" onclick="quickMatch()">⚡ 快速配對（隨機加入）</button>
    <div class="field">
      <label>輸入 6 位房間碼</label>
      <input type="text" id="joinCode" placeholder="例如：A7K2P9" maxlength="6" style="text-transform:uppercase">
    </div>
    <button class="btn-outline" onclick="joinRoom()">🔗 加入指定房間</button>
  </div>

  <div class="setup-card hidden" id="lobby-wait" style="text-align:center;">
    <p style="color:#8a8478;margin-bottom:10px;">房間已建立，等待玩家加入...</p>
    <div class="room-code" id="displayCode">------</div>
    <p style="color:#8a8478;margin-top:10px;font-size:.85rem;">將呢個房號傳俾朋友！</p>
    <div style="margin-top:20px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;" id="waitingPlayers"></div>
    <button class="btn-main" style="margin-top:24px;" onclick="startGameHost()" id="btnStart">開始遊戲</button>
  </div>
</div>

<div id="game" class="hidden">
  <aside class="players-panel" id="playersPanel"></aside>
  <div class="board-wrap"><div class="board" id="board"></div></div>
  <aside class="log-panel">
    <div class="log-title">📜 遊戲日誌</div>
    <div class="log-list" id="logList"></div>
    <div class="chat-area">
      <div class="log-title" style="border-top:1px solid var(--border);">💬 玩家聊天</div>
      <div class="log-list" id="chatList"></div>
      <div class="chat-input-wrap">
        <input type="text" id="chatInput" placeholder="打字傾偈..." onkeypress="if(event.key==='Enter') sendChat()">
        <button onclick="sendChat()">發送</button>
      </div>
    </div>
  </aside>
</div>

const BOT_NAMES = ['電腦阿明', '電腦阿珍', '電腦阿強'];

let myId = null, roomCode = null, roomRef = null, localData = null, myRole = 'player', isRolling = false, myName = '', myEmoji = '👧';
let animState = { active: false, pid: null, current: 0, steps: 0, newCash: 0 };
let timerInterval = null, auctionInterval = null;

let botTurnTimeout = null;

function selectAvatar(el) {
  document.querySelectorAll('.avatar-opt').forEach(opt => opt.classList.remove('active'));
  el.classList.add('active');

}

function getPlayerName() {
  let name = document.getElementById('playerName').value.trim();
  if(!name) { alert('請先輸入名字！'); return null; }
  return name;
}

function createPlayerObj(id, name, color, emoji, isBot) {
  return {
    id: id, isBot: isBot, name: name, color: color, emoji: emoji, skillName: SKILLS[emoji].name,
    cash: 50000, pos: 0, props: [], debts: [], jailTurns: 0,
    missionIndex: Math.floor(Math.random() * MISSIONS.length),
    bankrupt: false, pandasSaved: false, movePenalty: 0
  };
}

function startSoloGame() {
  const name = getPlayerName(); if(!name) return;
  myName = name; myId = 'p_' + Date.now(); myRole = 'host';
  localStorage.setItem('snowball_id', myId); localStorage.setItem('snowball_name', myName);
  
  roomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
  roomRef = db.ref('rooms/' + roomCode);
  
  const playersData = { [myId]: createPlayerObj(myId, name, COLORS[0], myEmoji, false) };
  
  for(let i=0; i<3; i++) {
    const botId = 'bot_' + i + '_' + Date.now();
    playersData[botId] = createPlayerObj(botId, BOT_NAMES[i], COLORS[i+1], ALL_EMOJIS[i+1], true);
  }

  const initialData = {
    status: 'playing', 
    host: myId, 
    players: playersData,
    gameState: { currentId: myId, round: 1, totalRounds: 8, phase: 'roll', dice1: null, dice2: null, owners: {}, auction: null, lastEvent: null }
  };

  roomRef.set(initialData).then(() => {
    document.getElementById('lobby').classList.add('hidden'); 
    document.getElementById('game').classList.remove('hidden');
    listenToRoom(); 
    initChat(); 
    startTimer();
  }).catch(err => {
    alert("建立房間失敗！原因：" + err.message);
  });
}

function createRoom() {
  const name = getPlayerName(); if(!name) return;
  myName = name; myId = 'p_' + Date.now();
  localStorage.setItem('snowball_id', myId); localStorage.setItem('snowball_name', myName);
  
  roomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
  myRole = 'host'; roomRef = db.ref('rooms/' + roomCode);
  roomRef.set({
    status: 'waiting', host: myId,
    players: { [myId]: createPlayerObj(myId, name, COLORS[0], myEmoji, false) }
  }).then(() => { showWaitingRoom(); listenToRoom(); });
}

function quickMatch() {
  const name = getPlayerName(); if(!name) return;
  myName = name; myId = 'p_' + Date.now();
  localStorage.setItem('snowball_id', myId); localStorage.setItem('snowball_name', myName);
  
  const btn = document.querySelectorAll('.btn-outline')[0]; const originalText = btn.innerText;
  btn.innerText = '搜尋中...';
  db.ref('rooms').once('value').then(snapshot => {
    let foundRoom = null;
    snapshot.forEach(child => {
      const data = child.val();
      if(data.status === 'waiting' && Object.keys(data.players || {}).length < 6 && !foundRoom) foundRoom = child.key;
    });
    if(foundRoom) { roomCode = foundRoom; myRole = 'player'; roomRef = db.ref('rooms/' + roomCode); joinExistingRoom(myName); }
    else { createRoom(myName); }
    btn.innerText = originalText;
  }).catch(err => { btn.innerText = originalText; alert('連線錯誤：' + err.message); });
}

function joinRoom() {
  const name = getPlayerName(); if(!name) return;
  let code = document.getElementById('joinCode').value.trim().toUpperCase(); if(!code) return alert('請輸入房號');
  myName = name; myId = 'p_' + Date.now(); myRole = 'player'; roomCode = code;
  localStorage.setItem('snowball_id', myId); localStorage.setItem('snowball_name', myName);
  roomRef = db.ref('rooms/' + roomCode); joinExistingRoom(myName);
}

function joinExistingRoom(name) {
  roomRef.once('value').then(snapshot => {
    const data = snapshot.val();
    if(!data) { alert('房間唔存在！'); location.reload(); return; }
    if(data.status !== 'waiting') { alert('遊戲已經開始咗！'); location.reload(); return; }
    const currentPlayers = data.players || {};
    if(Object.keys(currentPlayers).length >= 6) { alert('房間已滿！'); location.reload(); return; }

    const usedEmojis = Object.values(currentPlayers).map(p => p.emoji);
    let finalEmoji = usedEmojis.includes(myEmoji) ? (ALL_EMOJIS.find(e => !usedEmojis.includes(e)) || '🐙') : myEmoji;

    const myData = createPlayerObj(myId, name, COLORS[Object.keys(currentPlayers).length], finalEmoji, false);
    roomRef.child('players/' + myId).set(myData).then(() => { showWaitingRoom(); listenToRoom(); });
  });
}

function showWaitingRoom() {
  document.getElementById('lobby-actions').classList.add('hidden');
  document.getElementById('lobby-wait').classList.remove('hidden');
  document.getElementById('displayCode').innerText = roomCode;
  if(myRole !== 'host') document.getElementById('btnStart').classList.add('hidden');
}

function startGameHost() {
  if(myRole !== 'host') return;
  const pIds = Object.keys(localData.players);
  if(pIds.length < 2) return alert('最少要 2 個人先玩到！');
  roomRef.update({ status: 'playing', gameState: { currentId: pIds[0], round: 1, totalRounds: 8, phase: 'roll', dice1: null, dice2: null, owners: {}, auction: null, lastEvent: null } });
}

function listenToRoom() {
  roomRef.on('value', snapshot => {
    const data = snapshot.val(); if(!data) return; localData = data;

    if(data.status === 'waiting') {
      const waitDiv = document.getElementById('waitingPlayers');
      if(waitDiv) waitDiv.innerHTML = Object.values(data.players).map(p => `<div style="padding:8px 16px;border-radius:8px;background:${p.color}33;border:1px solid ${p.color};color:#fff">${p.emoji} ${p.name}</div>`).join('');
    }

    if(data.status === 'playing') {
      if(document.getElementById('game').classList.contains('hidden')) {
        document.getElementById('lobby').classList.add('hidden'); document.getElementById('game').classList.remove('hidden');
        initChat(); startTimer();
      }
      renderAll();
      
      if(data.gameState.auction) {
        renderAuction();
      } else {
        const auctionMask = document.getElementById('auctionMask');
        if(auctionMask) auctionMask.remove();
      }

      if(data.gameState.phase === 'roll' && !data.gameState.auction) {
        if(!timerInterval) startTimer();
        checkBotTurn();
      }

      // 👇 防卡死：如果輪到電腦，而狀態係 action（例如拍賣完結），自動幫佢結束回合
      if(data.gameState.phase === 'action' && !data.gameState.auction) {
        const curP = data.players[data.gameState.currentId];
        if(curP && curP.isBot && !botTurnTimeout) {
          botTurnTimeout = setTimeout(() => {
            botTurnTimeout = null;
            if(localData.gameState.phase === 'action' && localData.gameState.currentId === curP.id) {
              endTurn();
            }
          }, 1500);
        }
      }
    }

    if(data.status === 'finished') { showGameOver(); }
  });
}

function renderBoard() {
  const boardEl = document.getElementById('board'); if(!boardEl || !localData.gameState) return;
  const gs = localData.gameState; const isMyTurn = gs.currentId === myId;
  
  let html = '';
  BOARD.forEach((cell, i) => {
    const p = getGridPos(i);
    const ownerData = gs.owners && gs.owners[i];
    const ownerId = ownerData ? ownerData.owner : null;
    const level = ownerData ? (ownerData.level || 0) : 0;
    
    let pawnsHere = [];
    Object.keys(localData.players).forEach(pid => {
      if (localData.players[pid].bankrupt) return;
      let pPos = localData.players[pid].pos;
      if (animState.active && animState.pid === pid) pPos = animState.current;
      if (pPos === i) pawnsHere.push(pid);
    });

    let cls = 'cell';
    if(cell.t==='start') cls+=' corner start'; else if(cell.t==='jail') cls+=' corner jail';
    else if(cell.t==='free') cls+=' corner free'; else if(cell.t==='gojail') cls+=' corner gojail';
    if(cell.tier) cls+=' tier-'+cell.tier;

    let inner = '';
    if(cell.t==='prop'){
      let displayRent = cell.rent * Math.pow(2, level);
      if(ownerId && checkMonopoly(ownerId, cell.d)) displayRent *= 2;
      
      inner = `<div class="c-name">${cell.n}</div><div class="c-price">$${displayRent.toLocaleString()}</div>`;
      if(ownerId && localData.players[ownerId]) {
        const mono = checkMonopoly(ownerId, cell.d);
        inner += `<div class="c-owner" style="background:${localData.players[ownerId].color};color:${localData.players[ownerId].color}"></div>`;
        if(level > 0) inner += `<div class="c-level ${mono?'monopoly':''}">${level}🏠</div>`;
        else if(mono) inner += `<div class="c-level monopoly">M</div>`;
      }
    } else {
      inner = `<div class="c-icon">${cell.icon}</div><div class="c-label">${cell.n}</div>`;
    }
    
    if(pawnsHere.length) {
      inner += `<div class="c-pawns">` + pawnsHere.map(pid => {
        const pl = localData.players[pid];
        return `<div class="pawn-avatar" style="border-color:${pl.color}; text-shadow:0 0 5px ${pl.color}">${pl.emoji}</div>`;
      }).join('') + `</div>`;
    }
    
    html += `<div class="${cls}" style="grid-row:${p.r};grid-column:${p.c}" onclick="showCellInfo(${i})">${inner}</div>`;
  });

  const curP = localData.players[gs.currentId] || {emoji:'',name:'',color:'#fff',cash:0};
  let displayCash = curP.cash;
  if (animState.active && animState.pid === gs.currentId) displayCash = animState.newCash;
  
  const d1Class = isRolling ? 'die rolling' : 'die';
  const d2Class = isRolling ? 'die rolling' : 'die';
  
  const isJail = curP.pos === 10;
  
  let actionArea = '';
  if (gs.auction) {
    actionArea = `<div style="color:var(--gold);font-weight:900;font-size:1.2rem;animation:pulse 1s infinite;">🔨 暗標拍賣進行中...</div>`;
  } else {
    actionArea = `
    <div class="dice-row"><div class="${d1Class}">${gs.dice1 || '?'}</div><div class="${d2Class}">${gs.dice2 || '?'}</div></div>
    <div class="action-btns">
      ${isJail ? 
        `<button class="btn danger" onclick="payBail()" ${isMyTurn && gs.phase==='roll' ? '' : 'disabled'}>💸 付 $10,000 保釋</button>` :
        `<button class="btn primary" onclick="doRoll()" ${isMyTurn && gs.phase==='roll' ? '' : 'disabled'}>🎲 擲骰</button>`
      }
      <button class="btn" onclick="endTurn()" ${isMyTurn && gs.phase==='action' ? '' : 'disabled'}>✅ 結束回合</button>
    </div>
    <div class="action-btns">
      <button class="btn" onclick="openLoanModal()" ${isMyTurn && !curP.bankrupt && !curP.isBot ? '' : 'disabled'}>💸 借款</button>
      <button class="btn" onclick="openRepayModal()" ${isMyTurn && !curP.bankrupt && !curP.isBot ? '' : 'disabled'}>💳 還款</button>
    </div>`;
  }

  html += `<div class="center-panel">
    <div style="font-size:.8rem;color:#8a8478">第 <b>${gs.round}</b> / ${gs.totalRounds} 回合</div>
    <div class="turn-player" style="color:${curP.color}"><span style="font-size:2rem;text-shadow:0 0 10px ${curP.color}">${curP.emoji}</span> ${curP.name}</div>
    <div class="turn-cash ${displayCash<0?'neg':''}">💰 現金：$${displayCash.toLocaleString()}</div>
    <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
    ${actionArea}
  </div>`;
  boardEl.innerHTML = html;
}

function startAuction(pos) {
  const endTime = Date.now() + 15000;
  roomRef.child('gameState/auction').set({
    pos: pos,
    highestBid: 0,
    bids: {},
    endTime: endTime
  });

  const curP = localData.players[localData.gameState.currentId];
  if(curP && curP.isBot) {
    Object.keys(localData.players).forEach(pid => {
      const p = localData.players[pid];
      if(p.isBot && !p.bankrupt && pid !== curP.id) {
        setTimeout(() => {
          const bid = BOARD[pos].price + Math.floor(Math.random() * 3) * 5000;
          if(bid <= p.cash) {
            roomRef.child(`gameState/auction/bids/${pid}`).set(bid);
            if(bid > localData.gameState.auction.highestBid) {
              roomRef.update({ 'gameState/auction/highestBid': bid, 'gameState/auction/highestBidder': pid });
            }
          }
        }, Math.random() * 5000 + 1000);
      }
    });
  }
}

function submitBid() {
  const amount = +document.getElementById('bidAmount').value;
  const p = localData.players[myId];
  const auc = localData.gameState.auction;
  if(amount < 1000) return alert('最少出價 $1,000');
  if(amount > p.cash) return alert('現金不足！');
  
  roomRef.child(`gameState/auction/bids/${myId}`).set(amount);
  if(amount > auc.highestBid) {
    roomRef.update({ 'gameState/auction/highestBid': amount, 'gameState/auction/highestBidder': myId });
  }
  alert('出價成功！等其他人出價...');
}

setInterval(() => {
  if(localData && localData.gameState && localData.gameState.auction) {
    const auc = localData.gameState.auction;
    const remaining = Math.ceil((auc.endTime - Date.now()) / 1000);
    const timeEl = document.getElementById('aucTime');
    if(timeEl) timeEl.innerText = Math.max(0, remaining) + 's';

    if(Date.now() >= auc.endTime) {
      if(auc.highestBidder && auc.highestBid > 0) {
        const winnerId = auc.highestBidder;
        const winP = localData.players[winnerId];
        const price = auc.highestBid;
        
        let updates = {
          [`gameState/owners/${auc.pos}`]: { owner: winnerId, level: 0 },
          [`players/${winnerId}/props`]: [...(winP.props||[]), auc.pos],
          [`players/${winnerId}/cash`]: winP.cash - price,
          'gameState/auction': null,
          'gameState/phase': 'action'
        };
        roomRef.update(updates).then(() => {
          addLog(`🔨 拍賣結束：${winP.name} 以 $${price.toLocaleString()} 投得 ${BOARD[auc.pos].n}！`, 'system');
          playSound('buy');
        });
      } else {
        roomRef.update({ 'gameState/auction': null, 'gameState/phase': 'action' }).then(() => {
          addLog(`📉 拍賣流拍：${BOARD[auc.pos].n} 無人出價。`, 'system');
        });
      }
    }
  }
}, 1000);

function handleChanceCard(card, playerId) {
  const p = localData.players[playerId];
  const pIds = Object.keys(localData.players);
  let updates = {};
  let eventFired = false;

  if(card.text.includes('政府派錢')) {
    eventFired = true;
    let minCash = Infinity, minId = null;
    pIds.forEach(id => {
      if(!localData.players[id].bankrupt && localData.players[id].cash < minCash) {
        minCash = localData.players[id].cash; minId = id;
      }
    });
    if(minId) {
      updates[`players/${minId}/cash`] = localData.players[minId].cash + 20000;
      addLog(`🇭🇰 政府派錢！全場最窮嘅 ${localData.players[minId].name} 獲得 $20,000！`, 'money');
    }
  } else if(card.text.includes('颱風襲港')) {
    eventFired = true;
    pIds.forEach(id => {
      if(!localData.players[id].bankrupt) updates[`players/${id}/cash`] = localData.players[id].cash - 5000;
    });
    addLog(`🌀 颱風襲港！所有玩家支付 $5,000 維修費。`, 'danger');
  } else if(card.text.includes('的士加價')) {
    eventFired = true;
    updates[`players/${playerId}/movePenalty`] = 1;
    addLog(`🚕 的士加價！${p.name} 下回合移動步數 -1。`, 'danger');
  } else if(card.text.includes('樓市辣招')) {
    eventFired = true;
    pIds.forEach(id => {
      const pl = localData.players[id];
      if(!pl.bankrupt && pl.props && pl.props.length >= 3) {
        let tax = Math.round(pl.cash * 0.15);
        updates[`players/${id}/cash`] = pl.cash - tax;
        addLog(`🔥 樓市辣招！${pl.name} 擁有 3 塊地以上，交稅 $${tax.toLocaleString()}。`, 'danger');
      }
    });
  } else if(card.text.includes('自由行重臨')) {
    eventFired = true;
    updates['gameState/rentBoost'] = 3;
    addLog(`🛍️ 自由行重臨！今回合全場租金 ×3！`, 'money');
  } else if(card.text.includes('大耳窿掃蕩')) {
    eventFired = true;
    pIds.forEach(id => {
      const pl = localData.players[id];
      if(!pl.bankrupt && pl.debts && pl.debts.length > 0) {
        updates[`players/${id}/debts`] = pl.debts.map(d => { d.rate += 0.1; return d; });
      }
    });
    addLog(`🚨 大耳窿掃蕩！所有負債利息加 10%。`, 'danger');
  }
  
  if(eventFired) {
    roomRef.update(updates);
    return;
  }

  let newCash = p.cash;
  if(card.text.includes('獲得')) newCash += parseInt(card.text.match(/\$([\d,]+)/)[1].replace(/,/g,''));
  else if(card.text.includes('支付') || card.text.includes('罰款')) newCash -= parseInt(card.text.match(/\$([\d,]+)/)[1].replace(/,/g,''));
  else if (card.text.includes('10%')) newCash -= Math.round(newCash * 0.1);
  
  roomRef.update({ [`players/${playerId}/cash`]: newCash });
}

function checkBotTurn() {
  if(!localData || !localData.gameState || localData.gameState.phase !== 'roll' || localData.gameState.auction) return;
  const curId = localData.gameState.currentId;
  const curP = localData.players[curId];
  
  if(curP && curP.isBot && !botTurnTimeout) {
    botTurnTimeout = setTimeout(() => {
      botTurnTimeout = null;
      doBotRoll(curId);
    }, 1200);
  }
}

function doBotRoll(botId) {
  const p = localData.players[botId];
  if(!p || p.bankrupt) { endTurn(); return; }

  isRolling = true; renderBoard();
  
  setTimeout(() => {
    isRolling = false;
    const d1 = Math.ceil(Math.random()*6), d2 = Math.ceil(Math.random()*6);
    let steps = d1 + d2;
    if(p.movePenalty > 0) { steps = Math.max(1, steps - p.movePenalty); roomRef.update({[`players/${botId}/movePenalty`]: 0}); }
    
    let isJailBreak = false;
    if (p.pos === 10 && d1 === d2) isJailBreak = true;

    roomRef.update({ [`gameState/dice1`]: d1, [`gameState/dice2`]: d2 }).then(() => {
      animState = { active: true, pid: botId, current: p.pos, steps: isJailBreak ? 0 : steps, newCash: p.cash };
      let count = 0;

      const timer = setInterval(() => {
        animState.current = (animState.current + 1) % 40;
        if (animState.current === 0) {
          animState.newCash += 20000;
          if (p.emoji === '🐱') animState.newCash += 10000;
        }
        count++; renderAll();
        if (count >= animState.steps) {
          clearInterval(timer); animState.active = false;
          let updates = { [`players/${botId}/pos`]: animState.current, [`players/${botId}/cash`]: animState.newCash, [`gameState/phase`]: 'action' };
          if(isJailBreak) updates[`players/${botId}/jailTurns`] = 0;
          
          roomRef.update(updates).then(() => { 
            if(!isJailBreak) handleBotLanding(botId, animState.current); 
            else setTimeout(endTurn, 1000);
          });
        }
      }, 150); 
    });
  }, 600);
}

function handleBotLanding(botId, pos) {
  const cell = BOARD[pos], p = localData.players[botId];
  const ownerData = localData.gameState.owners && localData.gameState.owners[pos];

  const finishTurn = () => setTimeout(endTurn, 1000);

  if (cell.t === 'prop') {
    if (!ownerData && p.cash >= cell.price) {
      roomRef.update({
        [`gameState/owners/${pos}`]: { owner: botId, level: 0 },
        [`players/${botId}/props`]: [...(p.props||[]), pos],
        [`players/${botId}/cash`]: p.cash - cell.price
      }).then(() => { addLog(`🤖 ${p.name} 買入 ${cell.n}`, 'money'); finishTurn(); });
    } else if (ownerData && ownerData.owner !== botId) {
      const ownerId = ownerData.owner;
      const ownerP = localData.players[ownerId];
      const level = ownerData.level || 0;
      let rent = cell.rent * Math.pow(2, level);
      if(checkMonopoly(ownerId, cell.d)) rent *= 2;
      
      if (ownerP.emoji === '🐶') rent = Math.round(rent * 1.2);
      if (p.emoji === '🐯') rent = Math.round(rent * 0.8);
      
      roomRef.update({ [`players/${botId}/cash`]: p.cash - rent, [`players/${ownerId}/cash`]: ownerP.cash + rent })
        .then(() => { addLog(`🤖 ${p.name} 向 ${ownerP.name} 交租 $${rent.toLocaleString()}`, 'danger'); checkBankrupt(botId); finishTurn(); });
    } else {
      startAuction(pos);
      setTimeout(() => { roomRef.update({'gameState/phase': 'action'}); }, 1000);
    }
  } else if (cell.t === 'chance') {
    const card = CHANCE_CARDS[Math.floor(Math.random()*CHANCE_CARDS.length)];
    handleChanceCard(card, botId);
    addLog(`🤖 ${p.name} 抽中：${card.text}`, 'system');
    setTimeout(() => { checkBankrupt(botId); finishTurn(); }, 500);
  } else if (cell.t === 'tax') {
    const tax = Math.max(5000, Math.round(p.cash*0.1));
    roomRef.update({ [`players/${botId}/cash`]: p.cash - tax })
      .then(() => { addLog(`🤖 ${p.name} 交稅 $${tax.toLocaleString()}`, 'danger'); checkBankrupt(botId); finishTurn(); });
  } else if (cell.t === 'gojail') {
    roomRef.update({ [`players/${botId}/pos`]: 10, [`players/${botId}/jailTurns`]: 1 }).then(() => finishTurn());
  } else if (cell.t === 'free') {
    roomRef.update({ [`players/${botId}/cash`]: p.cash + 5000 }).then(() => finishTurn());
  } else if (cell.t === 'black') {
    if(p.cash > 30000) {
       roomRef.update({ [`players/${botId}/cash`]: p.cash - 30000 }).then(() => finishTurn());
    } else { finishTurn(); }
  } else { finishTurn(); }
}

function checkBankrupt(pid) {
  const p = localData.players[pid];
  if (p.bankrupt || p.cash >= 0) return;

  if (p.props && p.props.length > 0) {
    let newProps = [...p.props];
    let currentCash = p.cash;
    let updates = {};
    
    let saveProp = null;
    if (p.emoji === '🐼' && !p.pandasSaved && newProps.length > 0) {
      newProps.sort((a,b) => BOARD[b].price - BOARD[a].price);
      saveProp = newProps.shift();
      updates[`players/${pid}/pandasSaved`] = true;
      addLog(`🐼 ${p.name} 發動【國寶保護】，保留咗最貴嘅 ${BOARD[saveProp].n}！`, 'system');
    }
    
    while (currentCash < 0 && newProps.length > 0) {
      const sellPos = newProps.shift();
      const sellValue = Math.floor(BOARD[sellPos].price * 0.7);
      currentCash += sellValue;
      updates[`gameState/owners/${sellPos}`] = null;
      if(saveProp && newProps.length === 0) newProps.push(saveProp);
      
      updates[`players/${pid}/props`] = newProps;
      updates[`players/${pid}/cash`] = currentCash;
      addLog(`🏚️ ${p.name} 被迫以 $${sellValue.toLocaleString()} 拍賣 ${BOARD[sellPos].n} 還債。`, 'danger');
    }
    
    if (currentCash >= 0) {
      roomRef.update(updates);
      return;
    }
  }

  let updates = {
    [`players/${pid}/bankrupt`]: true,
    [`players/${pid}/cash`]: 0,
    [`players/${pid}/props`]: [],
    [`players/${pid}/debts`]: []
  };
  if (p.props) p.props.forEach(pos => { updates[`gameState/owners/${pos}`] = null; });
  
  roomRef.update(updates);
  addLog(`💀 ${p.name} 宣佈破產！所有資產被銀行沒收。`, 'danger');
  playSound('bad');

  if (pid === myId) {
    setTimeout(() => { alert('你已經破產！將自動結束回合。'); endTurn(); }, 500);
  } else if (localData.gameState.currentId === pid) {
    setTimeout(() => endTurn(), 1500);
  }
}

function endTurn() {
  clearInterval(timerInterval);
  if(botTurnTimeout) { clearTimeout(botTurnTimeout); botTurnTimeout = null; }
  
  const gs = localData.gameState;
  if(gs.phase !== 'action' && gs.currentId !== myId) return;
  if(gs.auction) return;
  
  const pIds = Object.keys(localData.players);
  let nextIndex = (pIds.indexOf(gs.currentId) + 1) % pIds.length;
  
  while (localData.players[pIds[nextIndex]].bankrupt) {
    nextIndex = (nextIndex + 1) % pIds.length;
    if (nextIndex === pIds.indexOf(gs.currentId)) {
      roomRef.update({ status: 'finished' });
      return;
    }
  }
  
  const updates = {};
  updates['gameState/currentId'] = pIds[nextIndex];
  updates['gameState/phase'] = 'roll';
  updates['gameState/dice1'] = null; updates['gameState/dice2'] = null;
  updates['gameState/rentBoost'] = 1;

  if(nextIndex <= pIds.indexOf(gs.currentId)) {
    updates['gameState/round'] = gs.round + 1;
    pIds.forEach(pid => {
      const pl = localData.players[pid];
      if(pl.bankrupt) return;
      
      let roundBonus = 10000;
      if (pl.emoji === '👦') roundBonus += 5000;
      
      let newCash = (pl.cash || 0) + roundBonus;
      if(pl.debts && pl.debts.length > 0) {
        updates[`players/${pid}/debts`] = pl.debts.map(d => { d.principal += Math.round(d.principal * d.rate); return d; });
      }
      updates[`players/${pid}/cash`] = newCash;
    });
    addLog(`📈 第 ${gs.round + 1} 回合開始，全體獲得基本收入。`, 'money');
  }
  
  if(gs.round > gs.totalRounds) { 
    roomRef.update({ 'status': 'finished' }); 
  } else {
    roomRef.update(updates).then(() => {
      pIds.forEach(pid => {
        if(localData.players[pid].debts && localData.players[pid].debts.length > 0) checkBankrupt(pid);
      });
    }); 
  }
}

function getGridPos(i){
  if(i===0) return {r:11,c:11}; if(i>=1&&i<=9) return {r:11,c:11-i}; if(i===10) return {r:11,c:1};
  if(i>=11&&i<=19) return {r:11-(i-10),c:1}; if(i===20) return {r:1,c:1}; if(i>=21&&i<=29) return {r:1,c:1+(i-20)};
  if(i===30) return {r:1,c:11}; if(i>=31&&i<=39) return {r:1+(i-30),c:11};
}
function renderAll() { renderBoard(); renderPlayers(); }
function checkMonopoly(pid, district) {
  const props = BOARD.map((c, i) => c.t==='prop' && c.d===district ? i : -1).filter(i=>i>=0);
  return props.every(i => localData.gameState.owners[i] && localData.gameState.owners[i].owner === pid);
}
function buyProperty(pos) {
  const cell = BOARD[pos], p = localData.players[myId];

  roomRef.update({
    [`gameState/owners/${pos}`]: { owner: myId, level: 0 },
    [`players/${myId}/props`]: [...(p.props||[]), pos],
    [`players/${myId}/cash`]: p.cash - cell.price
  }).then(() => { addLog(`🏠 ${p.name} 買入 ${cell.n}`, 'money'); playSound('buy'); closeModal(); });
}

function bmBuyLand(discount) {
  const p = localData.players[myId];
  const unowned = BOARD.map((c, i) => c.t==='prop' && !(localData.gameState.owners && localData.gameState.owners[i]) ? i : -1).filter(i=>i>=0);
  if(unowned.length === 0) return alert('已經冇晒無主地喇！');
  
  const targetPos = unowned[Math.floor(Math.random()*unowned.length)];
  const price = Math.round(BOARD[targetPos].price * discount);
  
  if (p.cash < price) { alert(`抽中 ${BOARD[targetPos].n}，但你需要 $${price.toLocaleString()}，現金不足！`); return; }
  
  if(confirm(`系統抽中咗 ${BOARD[targetPos].n}！\n\n黑市價 (${discount*10}折)：$${price.toLocaleString()}\n要唔要買？`)) {
    roomRef.update({
      [`gameState/owners/${targetPos}`]: { owner: myId, level: 0 },
      [`players/${myId}/props`]: [...(p.props||[]), targetPos],
      [`players/${myId}/cash`]: p.cash - price
    }).then(() => { addLog(`🕶️ ${p.name} 喺黑市以 ${discount*10}折買入 ${BOARD[targetPos].n}！`, 'money'); playSound('buy'); closeModal(); });
  }
}
function bmSabotage() {
  const p = localData.players[myId];
  if (p.cash < 30000) return alert('現金不足！需要 $30,000');
  
  const targets = [];
  Object.keys(localData.players).forEach(pid => {
    if(pid !== myId && localData.players[pid].props && localData.players[pid].props.length > 0) targets.push(pid);
  });
  
  if(targets.length === 0) return alert('全場得你一個有地，冇人俾你拆喎！');
  
  if(confirm('確定花 $30,000 請黑市買起對手一塊地？')) {
    const victimId = targets[Math.floor(Math.random()*targets.length)];
    const victimP = localData.players[victimId];
    const targetProp = victimP.props[Math.floor(Math.random()*victimP.props.length)];
    const ownerData = localData.gameState.owners[targetProp];
    
    const updates = { [`players/${myId}/cash`]: p.cash - 30000 };
    
    if(ownerData.level > 0) {
      updates[`gameState/owners/${targetProp}/level`] = ownerData.level - 1;
      addLog(`💣 黑市行動：${p.name} 拆咗 ${victimP.name} 嘅 ${BOARD[targetProp].n} 一層樓！`, 'system');
    } else {
      updates[`gameState/owners/${targetProp}/owner`] = null;
      updates[`gameState/owners/${targetProp}/level`] = 0;
      updates[`players/${victimId}/props`] = victimP.props.filter(i => i !== targetProp);
      addLog(`💣 黑市行動：${p.name} 摧毀咗 ${victimP.name} 嘅 ${BOARD[targetProp].n} 業權！`, 'danger');
    }
    roomRef.update(updates).then(() => { playSound('bad'); closeModal(); });
  }
}

function payBail() { const gs = localData.gameState; if(gs.currentId !== myId || gs.phase !== 'roll') return; const p = localData.players[myId]; if (p.cash < 10000) return alert('現金不足！'); if(confirm('確定支付 $10,000 保釋金？')) { roomRef.update({ [`players/${myId}/cash`]: p.cash - 10000, [`players/${myId}/pos`]: 0, [`players/${myId}/jailTurns`]: 0 }); addLog(`💸 ${p.name} 支付保釋金出獄。`, 'danger'); } }
function showCellInfo(pos) { const cell = BOARD[pos]; if(cell.t !== 'prop') return; const ownerData = localData.gameState.owners && localData.gameState.owners[pos]; const ownerId = ownerData ? ownerData.owner : null; const level = ownerData ? ownerData.level : 0; if (!ownerId) { showModal(`<h3>${cell.n}</h3><p>無主地<br>地價：$${cell.price.toLocaleString()}</p><button class="btn" onclick="closeModal()">關閉</button>`); } else { const ownerP = localData.players[ownerId]; const mono = checkMonopoly(ownerId, cell.d); let rent = cell.rent * Math.pow(2, level); if(mono) rent *= 2; if(ownerP.emoji === '🐶') rent = Math.round(rent * 1.2); if (ownerId === myId && localData.gameState.currentId === myId) { const cost = cell.price / 2; showModal(`<h3>🏠 ${cell.n}</h3><p>業主：你<br>等級：Level ${level} ${mono?'(🎉已壟斷 ×2)':''}<br>目前租金：<b style="color:var(--green)">$${rent.toLocaleString()}</b></p><button class="btn primary" onclick="upgradeProperty(${pos})" ${level>=3||localData.players[myId].cash<cost?'disabled':''}>升級房屋 (花費 $${cost.toLocaleString()})</button><button class="btn" onclick="closeModal()">關閉</button>`); } else if (ownerId !== myId) { showModal(`<h3>🏠 ${cell.n}</h3><p>業主：${ownerP.emoji} ${ownerP.name}<br>等級：Level ${level} ${mono?'(🎉已壟斷 ×2)':''}<br>租金：<b style="color:var(--red)">$${rent.toLocaleString()}</b></p><button class="btn primary" onclick="openTradeModal('${ownerId}', ${pos})">🤝 提出交易</button><button class="btn" onclick="closeModal()">關閉</button>`); } else { showModal(`<h3>🏠 ${cell.n}</h3><p>業主：你<br>等級：Level ${level} ${mono?'(🎉已壟斷 ×2)':''}</p><button class="btn" onclick="closeModal()">關閉</button>`); } } }
function upgradeProperty(pos) { const cell = BOARD[pos], p = localData.players[myId]; const ownerData = localData.gameState.owners[pos]; if(!ownerData || ownerData.owner !== myId) return; if(p.cash < cell.price / 2) return alert('現金不足！'); roomRef.update({ [`gameState/owners/${pos}/level`]: (ownerData.level || 0) + 1, [`players/${myId}/cash`]: p.cash - (cell.price / 2) }).then(() => { addLog(`🏗️ ${p.name} 升級咗 ${cell.n}！`, 'money'); playSound('buy'); closeModal(); }); }
function openTradeModal(targetId, targetPos) { const targetP = localData.players[targetId]; const myP = localData.players[myId]; if(!myP.props || myP.props.length === 0) return alert('你冇地可以換！'); const myOpts = myP.props.map(i => `<option value="${i}">${BOARD[i].n}</option>`).join(''); showModal(`<h3>🤝 提出交易</h3><p>向 ${targetP.emoji} ${targetP.name} 提出交易：</p><div class="loan-row"><label>我的地</label><select id="tradeMyProp"><option value="">唔出地</option>${myOpts}</select></div><div class="loan-row"><label>我補現金</label><input type="number" id="tradeMyCash" value="0" step="10000"></div><div class="loan-row"><label>換對方地</label><select id="tradeTargetProp"><option value="${targetPos}">${BOARD[targetPos].n}</option></select></div><div class="loan-row"><label>對方補現金</label><input type="number" id="tradeTargetCash" value="0" step="10000"></div><button class="btn primary" onclick="submitTrade('${targetId}', ${targetPos})">發送交易</button><button class="btn" onclick="closeModal()">取消</button>`); }
function submitTrade(targetId, targetPos) { const myProp = document.getElementById('tradeMyProp').value; let myCash = +document.getElementById('tradeMyCash').value; let targetCash = +document.getElementById('tradeTargetCash').value; const myP = localData.players[myId]; const targetP = localData.players[targetId]; if (myCash > myP.cash) return alert('你現金不足！'); if (myP.emoji === '👧') { targetCash += 5000; addLog(`👧 ${myP.name} 發動【交易專家】，要求額外 $5,000！`, 'system'); } const tradeText = `🤝 交易：${myP.name} 用 ${myProp?BOARD[myProp].n:'無地'} + $${myCash.toLocaleString()} 換 ${BOARD[targetPos].n} + $${targetCash.toLocaleString()}`; addLog(tradeText, 'system'); const updates = {}; updates[`players/${myId}/cash`] = myP.cash - myCash + targetCash; updates[`players/${targetId}/cash`] = targetP.cash - targetCash + myCash; if(myProp) { updates[`gameState/owners/${myProp}/owner`] = targetId; updates[`gameState/owners/${targetPos}/owner`] = myId; } roomRef.update(updates).then(() => { playSound('money'); closeModal(); }); }
function showMyMission() { 
  const p = localData.players[myId];
  const m = MISSIONS[p.missionIndex]; 
  if(!m) return alert('冇任務'); 
  showModal(`<h3>🤫 你的秘密任務</h3><p>${m.text}</p><p>完成獎勵：+${m.score} 分</p><button class="btn" onclick="closeModal()">關閉</button>`); 
}
function openLoanModal() { const p = localData.players[myId]; const others = Object.keys(localData.players).filter(id => id !== myId && !localData.players[id].bankrupt); const lenderOpts = others.map(id => `<option value="${id}">${localData.players[id].emoji} ${localData.players[id].name}</option>`).join(''); showModal(`<h3>💸 借款</h3><p>向系統銀行（5%息）或其他玩家借錢。</p><div class="loan-row"><label>放貸方</label><select id="loanLender"><option value="bank">🏦 系統銀行</option>${lenderOpts}</select></div><div class="loan-row"><label>借款額</label><input type="number" id="loanAmount" value="20000" step="5000"></div><div class="loan-row"><label>每回合息</label><select id="loanRate"><option value="0.05">5%</option><option value="0.1">10%</option><option value="0.2">20%</option><option value="0.3">30%</option></select></div><button class="btn primary" onclick="confirmLoan()">確認</button><button class="btn" onclick="closeModal()">取消</button>`); }
function confirmLoan() { const lenderVal = document.getElementById('loanLender').value; const amount = +document.getElementById('loanAmount').value; const rate = +document.getElementById('loanRate').value; const p = localData.players[myId]; if(amount < 5000) return alert('最少借 $5,000'); let finalRate = rate; if (p.emoji === '🦊') finalRate = Math.max(0.01, rate - 0.05); const updates = {}; const newDebt = { lender: lenderVal, principal: amount, rate: finalRate }; if(lenderVal === 'bank') { updates[`players/${myId}/cash`] = p.cash + amount; updates[`players/${myId}/debts`] = [...(p.debts||[]), newDebt]; } else { const lenderP = localData.players[lenderVal]; if(lenderP.cash < amount) return alert('對方現金不足！'); updates[`players/${myId}/cash`] = p.cash + amount; updates[`players/${lenderVal}/cash`] = lenderP.cash - amount; updates[`players/${myId}/debts`] = [...(p.debts||[]), newDebt]; } roomRef.update(updates); closeModal(); }
function calcNetWorth(p) { let assets = p.cash; (p.props||[]).forEach(i => { const lvl = localData.gameState.owners[i] ? localData.gameState.owners[i].level : 0; assets += BOARD[i].price + (BOARD[i].price / 2) * lvl; }); const debt = (p.debts||[]).reduce((s,d)=>s+d.principal,0); return assets - debt; }
function showGameOver() { 
  clearInterval(timerInterval); 
  if(document.getElementById('modalMask')) return; 
  let results = Object.keys(localData.players).map(pid => { 
    const p = localData.players[pid]; 
    let net = p.bankrupt ? 0 : calcNetWorth(p); 
    let score = p.bankrupt ? -999 : Math.round(net / 1000); 
    let mDone = false; 
    if(!p.bankrupt && p.missionIndex !== undefined) { 
      const m = MISSIONS[p.missionIndex]; 
      if(m && m.check(p, localData.players)) { score += m.score; mDone = true; } 
    } 
    return { p, net, score, mDone }; 
  }).sort((a,b) => b.score - a.score); 
  let html = `<h3 style="text-align:center;font-size:1.5rem;margin-bottom:20px;">🏆 遊戲結束</h3>`; 
  results.forEach((r, i) => { html += `<div class="rank-row ${i===0?'top':''}"><div><div class="rank-name">${i===0?'👑 ':''}${r.p.bankrupt?'💀':r.p.emoji} ${r.p.name} ${r.mDone?'✅':''}</div><div style="font-size:.75rem;color:var(--text-dim);margin-top:4px;">${r.p.bankrupt?'已破產':`總資產：$${r.net.toLocaleString()}`}</div></div><div class="rank-score">${r.p.bankrupt?'出局':r.score+' 分'}</div></div>`; }); 
  html += `<button class="btn primary" style="margin-top:20px;" onclick="location.reload()">再玩一次</button>`; 
  showModal(html); 
}
function showModal(html) { closeModal(); const mask = document.createElement('div'); mask.className = 'modal-mask'; mask.id = 'modalMask'; mask.innerHTML = `<div class="modal">${html}</div>`; document.body.appendChild(mask); }
function closeModal() { const m = document.getElementById('modalMask'); if(m) m.remove(); }
function playSound(type) { try { const ctx = new (window.AudioContext || window.webkitAudioContext)(); const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination); if(type === 'dice') { osc.type = 'square'; osc.frequency.setValueAtTime(400, ctx.currentTime); gain.gain.setValueAtTime(0.1, ctx.currentTime); osc.stop(ctx.currentTime + 0.1); } else if(type === 'buy') { osc.type = 'sine'; osc.frequency.setValueAtTime(600, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.2); gain.gain.setValueAtTime(0.2, ctx.currentTime); osc.stop(ctx.currentTime + 0.3); } else if(type === 'money') { osc.type = 'triangle'; osc.frequency.setValueAtTime(800, ctx.currentTime); gain.gain.setValueAtTime(0.15, ctx.currentTime); osc.stop(ctx.currentTime + 0.15); } else if(type === 'bad') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, ctx.currentTime); gain.gain.setValueAtTime(0.1, ctx.currentTime); osc.stop(ctx.currentTime + 0.4); } osc.start(); } catch(e) {} }
function startTimer() { clearInterval(timerInterval); timeLeft = 60; const fill = document.getElementById('timerFill'); if(fill) fill.style.width = '100%'; timerInterval = setInterval(() => { if(localData && localData.gameState && localData.gameState.auction) return; timeLeft--; if(fill) { fill.style.width = (timeLeft/60)*100 + '%'; if(timeLeft <= 15) fill.classList.add('warning'); else fill.classList.remove('warning'); } if(timeLeft <= 0) { clearInterval(timerInterval); if(localData.gameState.currentId === myId) endTurn(); } }, 1000); }
function initChat() { roomRef.child('chat').limitToLast(50).on('child_added', snapshot => { const msg = snapshot.val(); const list = document.getElementById('chatList'); if(!list) return; const div = document.createElement('div'); div.className = 'msg'; div.innerHTML = `<div class="sender">${msg.sender}</div><div>${msg.text}</div>`; list.appendChild(div); list.scrollTop = list.scrollHeight; }); roomRef.child('logs').limitToLast(30).on('child_added', snapshot => { const log = snapshot.val(); const list = document.getElementById('logList'); if(!list) return; const div = document.createElement('div'); div.className = 'log-item ' + (log.type || ''); div.innerText = log.text; list.appendChild(div); list.scrollTop = list.scrollHeight; }); }
function sendChat() { const input = document.getElementById('chatInput'); const text = input.value.trim(); if(!text) return; roomRef.child('chat').push({ sender: myName, text: text }); input.value = ''; }
function addLog(text, type='') { roomRef.child('logs').push({ text, type }); }
</script>
