<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 虛擬企業控制台 - 逼真防卡死版</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 使用更穩定嘅 CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    
    <style>
        body { background-color: #050505; font-family: 'Inter', 'Noto Sans HK', sans-serif; margin: 0; overflow: hidden; color: #fff; }
        .glass-panel { background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 8px 32px 0 rgba(0,0,0,0.5); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        #three-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; outline: none; }
        .ui-layer { position: relative; z-index: 10; pointer-events: none; }
        .ui-layer > * { pointer-events: auto; }
        
        .label-3d { 
            color: white; font-size: 12px; background: rgba(0,0,0,0.7); padding: 4px 8px; 
            border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(4px);
            white-space: nowrap; pointer-events: none; margin-top: -20px; text-shadow: 1px 1px 2px black;
        }

        /* Loading 畫面 */
        #loading-screen { position: fixed; inset: 0; background: #050505; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.5s; }
        .loader { border: 3px solid rgba(59, 130, 246, 0.1); border-left-color: #3b82f6; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 20px; box-shadow: 0 0 20px rgba(59,130,246,0.5); }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="h-screen w-screen flex flex-col">

    <!-- Loading 畫面 -->
    <div id="loading-screen">
        <div class="loader"></div>
        <div class="text-blue-500 font-mono tracking-widest text-sm animate-pulse">載入 3D 場景中...</div>
    </div>

    <!-- 頂部狀態欄 -->
    <header class="h-14 bg-black/50 backdrop-blur-md border-b border-white/10 flex items-center justify-between px-6 z-20 flex-shrink-0">
        <div class="flex items-center gap-4">
            <div class="font-bold text-lg text-white flex items-center gap-2">
                <span class="w-3 h-3 bg-blue-500 rounded-full animate-ping"></span> AI.com.tw 總部
            </div>
        </div>
        <div class="flex gap-6 text-xs font-medium">
            <span class="flex items-center gap-2 text-blue-400"><span class="w-2 h-2 rounded-full bg-blue-500"></span> 系統在線</span>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-1 relative flex overflow-hidden">
        <canvas id="three-canvas"></canvas>

        <!-- UI 層 -->
        <div class="ui-layer flex w-full h-full p-4 gap-4 justify-between absolute top-0 left-0 pointer-events-none">
            
            <!-- 左側面板 -->
            <aside class="w-[300px] flex flex-col gap-3 overflow-y-auto scrollbar-hide h-full pb-4 pointer-events-auto hidden md:flex">
                <div class="glass-panel rounded-xl p-4">
                    <h3 class="font-bold text-white text-sm mb-3">AI 員工團隊</h3>
                    <div class="space-y-3 text-xs">
                        <div class="flex justify-between items-center text-blue-400 font-medium">總部 (Grok Bot) <span class="text-gray-500">在線</span></div>
                        <div class="flex justify-between items-center text-teal-400 font-medium pt-2 border-t border-white/10">技術部 <span class="text-gray-500">工作中</span></div>
                        <div class="flex justify-between items-center text-yellow-400 font-medium pt-2 border-t border-white/10">行銷部 <span class="text-gray-500">工作中</span></div>
                    </div>
                </div>

                <div class="glass-panel rounded-xl p-4 bg-black/60 flex-1 min-h-[200px]">
                    <h3 class="font-bold text-white text-sm mb-3">終端機日誌</h3>
                    <div id="log-container" class="space-y-2 text-[11px] overflow-y-auto scrollbar-hide h-[200px] font-mono">
                        <div class="text-gray-400"><span class="text-green-400">[Sys]</span> 場景初始化完成。</div>
                    </div>
                </div>
            </aside>

            <!-- 中間留空 -->
            <div class="flex-1 pointer-events-none"></div>

            <!-- 右側面板 -->
            <aside class="w-[300px] flex flex-col gap-3 overflow-y-auto scrollbar-hide h-full pb-4 pointer-events-auto hidden md:flex">
                <div class="glass-panel rounded-xl p-4">
                    <h3 class="font-bold text-white text-sm mb-4">績效排行榜</h3>
                    <div class="space-y-4" id="leaderboard"></div>
                </div>
            </aside>

        </div>
    </main>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // ==========================================
        // 1. 保險掣：無論如何，5秒後強制關閉 Loading
        // ==========================================
        setTimeout(() => {
            const loader = document.getElementById('loading-screen');
            if(loader.style.display !== 'none') {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);
            }
        }, 5000);

        // ==========================================
        // 2. 基礎場景設置
        // ==========================================
        const canvas = document.getElementById('three-canvas');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.02); // 深色霧氣

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(12, 10, 12);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // 限制像素比，防手機過熱
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;

        // 文字標籤渲染器
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        canvas.parentElement.appendChild(labelRenderer.domElement);

        // 控制器 (支援觸摸)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;
        controls.minDistance = 5;
        controls.maxDistance = 30;

        // ==========================================
        // 3. 燈光 (放棄 HDR，用代碼模擬逼真光影)
        // ==========================================
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); // 環境光
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xaaccff, 2.0); // 帶點冷色嘅主光源
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        const fillLight = new THREE.PointLight(0x3b82f6, 1.5, 20); // 藍色氛圍燈
        fillLight.position.set(-5, 5, -5);
        scene.add(fillLight);

        // ==========================================
        // 4. 逼真地板
        // ==========================================
        const floorMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x0f172a, 
            roughness: 0.1, 
            metalness: 0.9 
        });
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // 發光網格
        const gridHelper = new THREE.GridHelper(100, 80, 0x3b82f6, 0x1e293b);
        gridHelper.position.y = 0.01;
        gridHelper.material.opacity = 0.4;
        gridHelper.material.transparent = true;
        scene.add(gridHelper);

        // ==========================================
        // 5. 加載 3D 角色 (帶錯誤處理)
        // ==========================================
        let mixer;
        const loader = new GLTFLoader();
        
        loader.load('https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb', (gltf) => {
            const robot = gltf.scene;
            robot.position.set(0, 0, 0);
            robot.scale.set(1.2, 1.2, 1.2);
            
            robot.traverse((node) => {
                if (node.isMesh) {
                    node.castShadow = true;
                    node.receiveShadow = true;
                }
            });
            scene.add(robot);

            // 動畫
            mixer = new THREE.AnimationMixer(robot);
            const idleAction = mixer.clipAction(gltf.animations.find(clip => clip.name === 'Idle'));
            idleAction.play();

            // 名牌
            const div = document.createElement('div');
            div.className = 'label-3d';
            div.textContent = 'AI CEO';
            div.style.borderLeft = '3px solid #3b82f6';
            const label = new CSS2DObject(div);
            label.position.set(0, 2.5, 0);
            robot.add(label);
            
            // 成功加載模型後，關閉 Loading
            document.getElementById('loading-screen').style.opacity = '0';
            setTimeout(() => document.getElementById('loading-screen').style.display = 'none', 500);

        }, undefined, (error) => {
            console.warn("3D 模型下載失敗，但 UI 繼續運作");
            // 失敗時都照閂 Loading
            document.getElementById('loading-screen').style.opacity = '0';
            setTimeout(() => document.getElementById('loading-screen').style.display = 'none', 500);
        });

        // 放置幾張桌子 (簡化版)
        function createDesk(x, z, rotationY = 0) {
            const deskGroup = new THREE.Group();
            const top = new THREE.Mesh(new THREE.BoxGeometry(3, 0.1, 1.5), new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.4 }));
            top.position.y = 1.2; top.castShadow = true; top.receiveShadow = true; deskGroup.add(top);
            
            const screen = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.7, 0.05), new THREE.MeshStandardMaterial({ color: 0x111111, emissive: 0x3b82f6, emissiveIntensity: 0.8 }));
            screen.position.set(0, 1.7, -0.4); screen.castShadow = true; deskGroup.add(screen);

            deskGroup.position.set(x, 0, z);
            deskGroup.rotation.y = rotationY;
            scene.add(deskGroup);
        }
        createDesk(-4, -4, Math.PI / 4);
        createDesk(4, -4, -Math.PI / 4);

        // ==========================================
        // 6. 渲染循環
        // ==========================================
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ==========================================
        // 7. UI 數據更新
        // ==========================================
        const employees = [
            { name: 'AI 技術長', score: 91, color: 'bg-teal-500', textColor: 'text-teal-400' },
            { name: 'AI 人資主管', score: 74, color: 'bg-blue-500', textColor: 'text-blue-400' },
            { name: 'AI 行銷理', score: 72, color: 'bg-yellow-500', textColor: 'text-yellow-400' }
        ];

        function renderLeaderboard() {
            document.getElementById('leaderboard').innerHTML = employees.sort((a, b) => b.score - a.score).map((emp, index) => `
                <div>
                    <div class="flex justify-between items-center text-xs mb-1">
                        <span class="font-medium text-gray-200">${index + 1}. ${emp.name}</span>
                        <span class="${emp.textColor} font-bold">${emp.score}</span>
                    </div>
                    <div class="w-full bg-gray-700 rounded-full h-1">
                        <div class="${emp.color} h-1 rounded-full transition-all duration-1000" style="width: ${emp.score}%"></div>
                    </div>
                </div>
            `).join('');
        }
        renderLeaderboard();

        const logContainer = document.getElementById('log-container');
        setInterval(() => {
            const randomEmp = employees[Math.floor(Math.random() * employees.length)];
            randomEmp.score = Math.min(100, randomEmp.score + Math.floor(Math.random() * 2));
            renderLeaderboard();
            
            const time = new Date().toLocaleTimeString('en-US', { hour12: false });
            const msgs = ["編譯完成", "API 請求成功", "生成行銷文案", "分析市場數據"];
            const el = document.createElement('div');
            el.className = 'text-gray-400';
            el.innerHTML = `<span class="text-slate-500">[${time}]</span> <span class="text-gray-300">${msgs[Math.floor(Math.random() * msgs.length)]}</span>`;
            logContainer.prepend(el);
        }, 3000);
    </script>
</body>
</html>
