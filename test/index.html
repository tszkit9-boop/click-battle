<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 虛擬企業控制台 - 逼真 3D 旗艦版</title>
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 Three.js 及所需擴展模組 (透過 import map) -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    
    <style>
        body { background-color: #050505; font-family: 'Inter', 'Noto Sans HK', sans-serif; margin: 0; overflow: hidden; color: #fff; }
        .glass-panel { background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 8px 32px 0 rgba(0,0,0,0.5); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        #three-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; outline: none; }
        .ui-layer { position: relative; z-index: 10; pointer-events: none; }
        .ui-layer > * { pointer-events: auto; }
        
        /* 3D 世界中的標籤 (CSS2DRenderer) */
        .label-3d { 
            color: white; 
            font-size: 12px; 
            background: rgba(0,0,0,0.7); 
            padding: 4px 8px; 
            border-radius: 4px; 
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(4px);
            white-space: nowrap;
            pointer-events: none;
            margin-top: -20px;
            text-shadow: 1px 1px 2px black;
        }

        /* Loading 畫面 */
        #loading-screen { position: fixed; inset: 0; background: #050505; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 1s; }
        .loader { border: 3px solid rgba(59, 130, 246, 0.1); border-left-color: #3b82f6; border-radius: 50%; width: 60px; height: 60px; animation: spin 1s linear infinite; margin-bottom: 20px; box-shadow: 0 0 20px rgba(59,130,246,0.5); }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .fade-in { animation: fadeIn 0.5s ease-in forwards; opacity: 0; }
        @keyframes fadeIn { to { opacity: 1; } }
    </style>
</head>
<body class="h-screen w-screen flex flex-col">

    <!-- Loading 畫面 -->
    <div id="loading-screen">
        <div class="loader"></div>
        <div class="text-blue-500 font-mono tracking-widest text-sm animate-pulse">初始化 3D 物理引擎與加載模型...</div>
        <div class="text-gray-500 text-xs mt-2">正在下載 HDR 環境與人物骨骼</div>
    </div>

    <!-- 頂部狀態欄 -->
    <header class="h-14 bg-black/50 backdrop-blur-md border-b border-white/10 flex items-center justify-between px-6 z-20 flex-shrink-0">
        <div class="flex items-center gap-4">
            <div class="font-bold text-lg text-white flex items-center gap-2 tracking-wider">
                <span class="w-3 h-3 bg-blue-500 rounded-full animate-ping"></span> AI.com.tw 總部
            </div>
            <div class="text-xs text-gray-400 bg-gray-900/50 px-3 py-1 rounded-full border border-gray-700">Grok Bot 系統在線</div>
        </div>
        <div class="flex gap-6 text-xs font-medium">
            <span class="flex items-center gap-2 text-blue-400"><span class="w-2 h-2 rounded-full bg-blue-500"></span> 工作中 <span id="working-count" class="text-white bg-blue-600 px-1.5 rounded">4</span></span>
            <span class="flex items-center gap-2 text-green-400"><span class="w-2 h-2 rounded-full bg-green-500"></span> 連線正常</span>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-1 relative flex overflow-hidden">
        <!-- 3D 畫布背景 -->
        <canvas id="three-canvas"></canvas>

        <!-- UI 層 -->
        <div class="ui-layer flex w-full h-full p-4 gap-4 justify-between absolute top-0 left-0 pointer-events-none">
            
            <!-- 左側面板 -->
            <aside class="w-[320px] flex flex-col gap-3 overflow-y-auto scrollbar-hide h-full pb-4 pointer-events-auto">
                <div class="glass-panel rounded-xl p-4">
                    <h3 class="font-bold text-white text-sm mb-3">AI 員工團隊</h3>
                    <div class="space-y-3">
                        <div class="flex justify-between items-center text-sm">
                            <span class="text-blue-400 font-medium">總部 (Grok Bot)</span>
                            <span class="text-gray-500 text-xs">1/1 在線</span>
                        </div>
                        <div class="flex justify-between items-center text-sm pt-2 border-t border-white/10">
                            <span class="text-teal-400 font-medium">技術部</span>
                            <span class="text-gray-500 text-xs">1/1 工作</span>
                        </div>
                        <div class="flex justify-between items-center text-sm pt-2 border-t border-white/10">
                            <span class="text-yellow-400 font-medium">行銷部</span>
                            <span class="text-gray-500 text-xs">1/1 工作</span>
                        </div>
                    </div>
                </div>

                <div class="glass-panel rounded-xl p-4 bg-black/60 flex-1 min-h-[200px]">
                    <h3 class="font-bold text-white text-sm mb-3">終端機日誌</h3>
                    <div id="log-container" class="space-y-2 text-xs overflow-y-auto scrollbar-hide h-[200px] font-mono">
                        <div class="text-gray-400"><span class="text-green-400">[Sys]</span> 3D 物理場景加載完畢。</div>
                    </div>
                </div>
            </aside>

            <!-- 中間留空，展示 3D -->
            <div class="flex-1 pointer-events-none"></div>

            <!-- 右側面板 -->
            <aside class="w-[320px] flex flex-col gap-3 overflow-y-auto scrollbar-hide h-full pb-4 pointer-events-auto">
                <div class="glass-panel rounded-xl p-4">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-white text-sm">績效排行榜</h3>
                    </div>
                    <div class="space-y-4" id="leaderboard"></div>
                </div>
                
                <div class="glass-panel rounded-xl p-4">
                    <h3 class="font-bold text-white text-sm mb-2">全局渲染狀態</h3>
                    <div class="text-xs text-gray-400 space-y-1">
                        <div class="flex justify-between"><span>Render Engine</span><span class="text-white">WebGL 2.0</span></div>
                        <div class="flex justify-between"><span>Physics</span><span class="text-green-400">Enabled</span></div>
                        <div class="flex justify-between"><span>Lighting</span><span class="text-white">PBR + HDR</span></div>
                    </div>
                </div>
            </aside>

        </div>
    </main>

    <!-- 核心 3D 邏輯 -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // 1. 基礎場景設置
        const canvas = document.getElementById('three-canvas');
        const scene = new THREE.Scene();
        // 加入霧氣增加空間感
        scene.fog = new THREE.FogExp2(0x050505, 0.015);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(15, 12, 15);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; // 柔和陰影
        renderer.toneMapping = THREE.ACESFilmicToneMapping; // 電影級色調映射
        renderer.toneMappingExposure = 1.0;

        // 2. CSS2DRenderer (用於顯示 3D 空間中的文字標籤)
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        canvas.parentElement.appendChild(labelRenderer.domElement);

        // 3. 控制器
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;
        controls.minDistance = 5;
        controls.maxDistance = 40;
        controls.target.set(0, 2, 0);

        // 4. 逼真光影與環境 (HDR)
        const rgbeLoader = new RGBELoader();
        rgbeLoader.load('https://unpkg.com/three@0.160.0/examples/textures/equirectangular/venice_sunset_1k.hdr', (texture) => {
            texture.mapping = THREE.EquirectangularReflectionMapping;
            scene.environment = texture; // 設置環境反射
            
            // 加載完成後隱藏 Loading
            const loader = document.getElementById('loading-screen');
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 800);
        });

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 50;
        dirLight.shadow.bias = -0.0005;
        scene.add(dirLight);

        // 5. 逼真地板 (帶反射和網格)
        const floorGeometry = new THREE.PlaneGeometry(100, 100);
        const floorMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x111111, 
            roughness: 0.2, // 降低粗糙度增加反射
            metalness: 0.8, // 金屬質感
            envMapIntensity: 1.0
        });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // 發光網格線
        const gridHelper = new THREE.GridHelper(100, 100, 0x3b82f6, 0x1e293b);
        gridHelper.position.y = 0.01;
        gridHelper.material.opacity = 0.3;
        gridHelper.material.transparent = true;
        scene.add(gridHelper);

        // 6. 加載逼真 3D 人物模型 (使用 Three.js 官方帶動畫的機器人模型)
        let mixer;
        let robot;
        const loader = new GLTFLoader();
        
        // 加載帶骨骼動畫的 3D 角色
        loader.load('https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb', (gltf) => {
            robot = gltf.scene;
            robot.position.set(0, 0, 0);
            robot.scale.set(1.5, 1.5, 1.5); // 放大模型
            
            // 開啟陰影
            robot.traverse((node) => {
                if (node.isMesh) {
                    node.castShadow = true;
                    node.receiveShadow = true;
                }
            });
            scene.add(robot);

            // 播放動畫 (例如 "Walking" 或 "Idle")
            mixer = new THREE.AnimationMixer(robot);
            const idleAction = mixer.clipAction(gltf.animations.find(clip => clip.name === 'Idle'));
            const walkingAction = mixer.clipAction(gltf.animations.find(clip => clip.name === 'Walking'));
            
            idleAction.play();

            // 隨機切換動畫模擬工作
            setInterval(() => {
                if (Math.random() > 0.5) {
                    idleAction.stop();
                    walkingAction.play();
                } else {
                    walkingAction.stop();
                    idleAction.play();
                }
            }, 5000);

            // 在 3D 人物頭頂加上名牌
            const div = document.createElement('div');
            div.className = 'label-3d';
            div.textContent = 'AI 技術長 (Grok)';
            const label = new CSS2DObject(div);
            label.position.set(0, 3.5, 0); // 放在頭上
            robot.add(label);

        }, undefined, (error) => {
            console.error('模型加載失敗', error);
        });

        // 再複製幾個角色到不同部門位置
        const workers = [];
        // 為了避免重複加載，我們使用克隆機制（簡化版直接加載多個）
        loader.load('https://threejs.org/examples/models/gltf/Xbot.glb', (gltf) => {
            const employeeData = [
                { name: 'AI 行銷理', pos: [-5, 0, -5], color: '#eab308' },
                { name: 'AI 人資主管', pos: [5, 0, -5], color: '#3b82f6' },
                { name: 'AI 客服', pos: [0, 0, -8], color: '#f43f5e' }
            ];

            employeeData.forEach((data, index) => {
                const bot = gltf.scene.clone();
                bot.position.set(...data.pos);
                bot.scale.set(1.2, 1.2, 1.2);
                bot.rotation.y = Math.PI / 4; // 面向總部
                
                bot.traverse((node) => {
                    if (node.isMesh) {
                        node.castShadow = true;
                        node.receiveShadow = true;
                    }
                });
                scene.add(bot);

                // 為每個角色添加名牌
                const div = document.createElement('div');
                div.className = 'label-3d';
                div.textContent = data.name;
                div.style.borderLeft = `3px solid ${data.color}`;
                const label = new CSS2DObject(div);
                label.position.set(0, 2.5, 0);
                bot.add(label);
                
                workers.push(bot);
            });
        });

        // 7. 構建辦公桌 (逼真幾何體組合)
        function createDesk(x, z, rotationY = 0) {
            const deskGroup = new THREE.Group();
            
            // 桌面 (木質感)
            const topGeo = new THREE.BoxGeometry(3, 0.1, 1.5);
            const topMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.4 }); // 深木色
            const top = new THREE.Mesh(topGeo, topMat);
            top.position.y = 1.2;
            top.castShadow = true;
            top.receiveShadow = true;
            deskGroup.add(top);

            // 桌腳 (金屬)
            const legGeo = new THREE.CylinderGeometry(0.05, 0.05, 1.2);
            const legMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.8, roughness: 0.2 });
            const positions = [[-1.4, 0.6, -0.6], [1.4, 0.6, -0.6], [-1.4, 0.6, 0.6], [1.4, 0.6, 0.6]];
            positions.forEach(pos => {
                const leg = new THREE.Mesh(legGeo, legMat);
                leg.position.set(...pos);
                leg.castShadow = true;
                deskGroup.add(leg);
            });

            // 電腦螢幕 (發光)
            const screenGeo = new THREE.BoxGeometry(1.2, 0.7, 0.05);
            const screenMat = new THREE.MeshStandardMaterial({ color: 0x111111, emissive: 0x3b82f6, emissiveIntensity: 0.5 });
            const screen = new THREE.Mesh(screenGeo, screenMat);
            screen.position.set(0, 1.7, -0.4);
            screen.castShadow = true;
            deskGroup.add(screen);
            
            // 鍵盤
            const kbGeo = new THREE.BoxGeometry(0.8, 0.03, 0.3);
            const kbMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
            const kb = new THREE.Mesh(kbGeo, kbMat);
            kb.position.set(0, 1.25, 0.2);
            deskGroup.add(kb);

            deskGroup.position.set(x, 0, z);
            deskGroup.rotation.y = rotationY;
            scene.add(deskGroup);
        }

        // 放置幾張桌子
        createDesk(-5, -5, Math.PI / 2);
        createDesk(5, -5, -Math.PI / 2);
        createDesk(0, -8, 0);

        // 8. 渲染循環
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta); // 更新骨骼動畫

            // 讓其他員工有輕微的呼吸/浮動效果 (如果冇骨骼動畫)
            workers.forEach((w, i) => {
                w.position.y = Math.sin(clock.getElapsedTime() * 2 + i) * 0.05;
            });

            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera); // 渲染 2D 標籤
        }

        // 視窗大小調整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();

        // ==========================================
        // UI 數據更新邏輯 (保留之前的邏輯)
        // ==========================================
        const employees = [
            { name: 'AI 技術長', score: 91, color: 'bg-teal-500', textColor: 'text-teal-400' },
            { name: 'AI 人資主管', score: 74, color: 'bg-blue-500', textColor: 'text-blue-400' },
            { name: 'AI 行銷理', score: 72, color: 'bg-yellow-500', textColor: 'text-yellow-400' }
        ];

        function renderLeaderboard() {
            document.getElementById('leaderboard').innerHTML = employees.sort((a, b) => b.score - a.score).map((emp, index) => `
                <div>
                    <div class="flex justify-between items-center text-sm mb-1">
                        <span class="font-medium text-gray-200">${index + 1}. ${emp.name}</span>
                        <span class="${emp.textColor} font-bold">${emp.score}</span>
                    </div>
                    <div class="w-full bg-gray-700 rounded-full h-1">
                        <div class="${emp.color} h-1 rounded-full transition-all duration-1000" style="width: ${emp.score}%"></div>
                    </div>
                </div>
            `).join('');
        }
        renderLeaderboard();

        const logContainer = document.getElementById('log-container');
        function addLog(msg) {
            const time = new Date().toLocaleTimeString('en-US', { hour12: false });
            const el = document.createElement('div');
            el.className = 'text-gray-400';
            el.innerHTML = `<span class="text-slate-500">[${time}]</span> <span class="text-gray-300">${msg}</span>`;
            logContainer.prepend(el);
        }

        setInterval(() => {
            const randomEmp = employees[Math.floor(Math.random() * employees.length)];
            randomEmp.score = Math.min(100, randomEmp.score + Math.floor(Math.random() * 2));
            renderLeaderboard();
            
            const msgs = ["編譯完成", "API 請求成功", "生成行銷文案", "分析市場數據"];
            addLog(`AI 正在執行: ${msgs[Math.floor(Math.random() * msgs.length)]}`);
        }, 3500);
    </script>
</body>
</html>
