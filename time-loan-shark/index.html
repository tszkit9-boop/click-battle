<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>💸 時間高利貸</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }

    body {
        background: #050505; color: #fff; font-family: 'Orbitron', 'PingFang HK', sans-serif;
        height: 100vh; height: 100dvh; overflow: hidden;
        display: flex; align-items: center; justify-content: center;
        background: radial-gradient(circle at center, #1a0000, #050505);
    }

    /* 返回大廳按鈕 */
    .back-btn {
        position: fixed; top: 15px; left: 15px; z-index: 100;
        padding: 8px 16px; background: rgba(0,0,0,0.8); color: #00d2d3;
        border: 2px solid #00d2d3; border-radius: 8px; text-decoration: none;
        font-weight: bold; font-size: 14px; box-shadow: 0 0 10px rgba(0,210,211,0.5);
        transition: 0.2s;
    }
    .back-btn:active { transform: scale(0.95); background: #00d2d3; color: #000; }

    /* 語音開關 */
    .voice-btn {
        position: fixed; top: 15px; right: 15px; z-index: 100;
        padding: 8px 16px; background: rgba(0,0,0,0.8); color: #f1c40f;
        border: 2px solid #f1c40f; border-radius: 8px; font-weight: bold; font-size: 14px;
        cursor: pointer; transition: 0.2s;
    }
    .voice-btn:active { transform: scale(0.95); background: #f1c40f; color: #000; }

    /* 遊戲主體 */
    #game-container {
        position: relative; width: 100%; max-width: 600px; height: 100%;
        display: flex; flex-direction: column; overflow: hidden;
    }

    /* 頂部資訊 */
    .top-info {
        padding: 60px 20px 20px;
        display: flex; justify-content: space-between; align-items: flex-end;
        z-index: 10;
    }
    .record-info { font-size: 12px; color: #a4b0be; text-align: left; }
    .record-info span { color: #f1c40f; font-weight: bold; }
    .repay-btn {
        padding: 8px 12px; background: rgba(231, 76, 60, 0.2); border: 1px solid #e74c3c;
        color: #e74c3c; border-radius: 5px; font-family: inherit; font-weight: bold; cursor: pointer;
        transition: 0.2s; font-size: 12px;
    }
    .repay-btn:active { background: #e74c3c; color: #fff; }

    /* 中央計時器 */
    .timer-area {
        flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
        z-index: 10; pointer-events: none;
    }
    #timer-display {
        font-size: 90px; font-weight: 900; color: #2ecc71; text-shadow: 0 0 30px #2ecc71;
        transition: color 0.2s, text-shadow 0.2s; font-variant-numeric: tabular-nums;
    }
    #interest-display {
        font-size: 20px; font-weight: bold; color: #f1c40f; margin-top: 10px;
        text-shadow: 0 0 10px #f1c40f; letter-spacing: 2px;
    }
    #combo-display {
        font-size: 24px; color: #e67e22; font-weight: 900; margin-top: 5px;
        text-shadow: 0 0 15px #e67e22; opacity: 0; transition: opacity 0.3s;
    }

    /* 警告狀態 */
    .danger-text { color: #e74c3c !important; text-shadow: 0 0 40px #e74c3c !important; animation: pulse 0.5s infinite alternate; }
    @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }

    /* 怪物/目標 */
    .enemy {
        position: absolute; width: 60px; height: 60px;
        display: flex; align-items: center; justify-content: center;
        font-size: 30px; background: rgba(46, 204, 113, 0.2); border: 2px solid #2ecc71;
        border-radius: 50%; box-shadow: 0 0 15px rgba(46, 204, 113, 0.5);
        cursor: pointer; z-index: 20; transition: transform 0.1s;
        backdrop-filter: blur(2px);
    }
    .enemy:active { transform: scale(0.8); background: rgba(46, 204, 113, 0.5); }
    .enemy.danger-loan { border-color: #f1c40f; background: rgba(241, 196, 15, 0.2); box-shadow: 0 0 15px rgba(241, 196, 15, 0.5); }
    
    /* 護盾金幣樣式 */
    .enemy.shield { 
        border-color: #3498db; background: rgba(52, 152, 219, 0.3); 
        box-shadow: 0 0 25px #3498db; animation: spinShield 2s linear infinite;
    }
    @keyframes spinShield { 100% { transform: rotate(360deg); } }

    /* 詐騙金幣樣式 */
    .enemy.scam {
        border-color: #e74c3c; background: rgba(231, 76, 60, 0.3);
        box-shadow: 0 0 25px #e74c3c; animation: blink 0.5s infinite alternate;
    }
    @keyframes blink { from { opacity: 0.7; } to { opacity: 1; } }

    /* 粒子特效層 */
    #fx-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 15; }

    /* 彈窗 */
    .modal {
        position: absolute; inset: 0; background: rgba(0,0,0,0.85); z-index: 200;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        backdrop-filter: blur(10px); padding: 20px;
    }
    .modal.hidden { display: none; }
    .modal-box {
        background: linear-gradient(135deg, #111, #000);
        border: 3px solid #f1c40f; padding: 30px; border-radius: 20px;
        text-align: center; max-width: 400px; width: 100%;
        box-shadow: 0 0 50px rgba(241, 196, 15, 0.3);
        animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .modal-box h1 { color: #f1c40f; font-size: 28px; margin-bottom: 15px; text-shadow: 0 0 20px #f1c40f; }
    .modal-box p { color: #ccc; font-size: 14px; line-height: 1.6; margin-bottom: 20px; text-align: left; }
    .modal-box p span { color: #2ecc71; font-weight: bold; }
    
    .title-badge {
        display: inline-block; padding: 5px 15px; background: #e67e22; color: #000;
        font-weight: 900; border-radius: 20px; margin-bottom: 20px; font-size: 16px;
        box-shadow: 0 0 20px rgba(230, 126, 34, 0.5);
    }

    .modal-btn {
        width: 100%; padding: 15px; background: linear-gradient(to bottom, #f1c40f, #e67e22);
        color: #000; border: none; border-radius: 30px; font-size: 18px; font-weight: 900;
        cursor: pointer; font-family: inherit; box-shadow: 0 5px 0 #b38f00; transition: 0.1s;
        margin-bottom: 10px;
    }
    .modal-btn:active { transform: translateY(5px); box-shadow: none; }
    .modal-btn.secondary { background: #2ecc71; box-shadow: 0 5px 0 #1e8449; }

    /* 螢幕震動 */
    @keyframes shake {
        0% { transform: translate(0, 0); }
        25% { transform: translate(5px, -5px); }
        50% { transform: translate(-5px, 5px); }
        75% { transform: translate(5px, 5px); }
        100% { transform: translate(0, 0); }
    }
    .shaking { animation: shake 0.2s infinite; }

    /* 背景網格 */
    .bg-grid {
        position: absolute; inset: 0; z-index: 1; opacity: 0.1;
        background-image: linear-gradient(#e74c3c 1px, transparent 1px), linear-gradient(90deg, #e74c3c 1px, transparent 1px);
        background-size: 40px 40px; perspective: 500px;
    }

    /* 隱藏分享畫布 */
    #shareCanvas { display: none; }
</style>
</head>
<body>

    <a href="../" class="back-btn">⬅ 返回大廳</a>
    <div class="voice-btn" id="voice-btn" onclick="toggleVoice()">🔊 粵語</div>

    <div id="game-container">
        <div class="bg-grid" id="bg-grid"></div>
        <canvas id="fx-canvas"></canvas>

        <div class="top-info">
            <div class="record-info">
                最高利率：<span id="best-rate">1.0x</span><br>
                最高連擊：<span id="best-combo">0</span>
            </div>
            <button class="repay-btn" onclick="repayDebt()">💳 還款 (扣一半時間)</button>
        </div>

        <div class="timer-area">
            <div id="timer-display">10.0</div>
            <div id="interest-display">利率: 1.0x</div>
            <div id="combo-display">🔥 COMBO x0</div>
        </div>
    </div>

    <!-- 玩法說明彈窗 -->
    <div id="intro-modal" class="modal">
        <div class="modal-box">
            <h1>💸 時間高利貸</h1>
            <p>你只有 <span>10 秒</span> 壽命。<br>
            🪙 綠色金幣：借時間，利率增加。<br>
            🛡️ 藍色護盾：鎖定利率 5 秒。<br>
            💣 紅色炸彈：詐騙！利率翻倍兼扣時間！<br>
            連續點擊可觸發 <span>COMBO</span> 送額外時間！<br><br>
            當利率太高，可撳右上角「還款」重置利率，但代價係扣除一半時間。</p>
            <button class="modal-btn" onclick="startGame()">開始借貸</button>
        </div>
    </div>

    <!-- 死亡結算彈窗 -->
    <div id="end-modal" class="modal hidden">
        <div class="modal-box" style="border-color: #e74c3c;">
            <h1 style="color: #e74c3c;">💸 破產收場</h1>
            <div class="title-badge" id="title-badge">初級債仔</div>
            <p id="end-desc" style="text-align: center; font-size: 16px;"></p>
            <button class="modal-btn" onclick="startGame()">再借一次</button>
            <button class="modal-btn secondary" onclick="generatePoster()">📸 生成結算海報</button>
        </div>
    </div>

    <!-- 隱藏海報畫布 -->
    <canvas id="shareCanvas" width="600" height="800"></canvas>

<script>
    window.onerror = function(msg) { console.warn("防呆跳過：", msg); return true; };

    const gameContainer = document.getElementById('game-container');
    const timerDisplay = document.getElementById('timer-display');
    const interestDisplay = document.getElementById('interest-display');
    const comboDisplay = document.getElementById('combo-display');
    const bestRateDisplay = document.getElementById('best-rate');
    const bestComboDisplay = document.getElementById('best-combo');
    const bgGrid = document.getElementById('bg-grid');
    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');
    const voiceBtn = document.getElementById('voice-btn');

    let timeLeft = 10.0;
    let interestRate = 1.0;
    let isPlaying = false;
    let lastTime = 0;
    let reqAnimId = null;
    let spawnTimer = null;
    let tickTimer = null;
    let maxRateReached = 1.0;

    let shieldTimer = 0;
    let comboCount = 0;
    let comboTimer = 0;
    let maxComboReached = 0;

    // 語音系統
    let voiceMode = 0; // 0 = 粵語, 1 = 靜音
    function toggleVoice() {
        voiceMode = voiceMode === 0 ? 1 : 0;
        voiceBtn.innerText = voiceMode === 0 ? "🔊 粵語" : "🔇 靜音";
        if (voiceMode === 0) speakText("已開啟廣東話");
    }

    function speakText(text) {
        try {
            if (voiceMode === 1 || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const ut = new SpeechSynthesisUtterance(text);
            let voices = window.speechSynthesis.getVoices();
            let v = voices.find(v => v.lang.includes('zh-HK') || v.lang.includes('yue'));
            if (v) ut.voice = v;
            ut.lang = 'zh-HK';
            ut.rate = 1.2;
            window.speechSynthesis.speak(ut);
        } catch(e) {}
    }

    // 歷史紀錄
    let bestRate = parseFloat(localStorage.getItem('loan_best_rate')) || 1.0;
    let bestCombo = parseInt(localStorage.getItem('loan_best_combo')) || 0;
    updateRecordUI();

    // 音效
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        let now = audioCtx.currentTime;

        if (type === 'hit') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(1600, now + 0.1);
            gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(); osc.stop(now + 0.1);
        } else if (type === 'shield') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(1200, now + 0.2);
            gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2); osc.start(); osc.stop(now + 0.2);
        } else if (type === 'combo') {
            osc.type = 'square'; osc.frequency.setValueAtTime(600, now); osc.frequency.setValueAtTime(900, now+0.1); osc.frequency.setValueAtTime(1200, now+0.2);
            gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3); osc.start(); osc.stop(now + 0.3);
        } else if (type === 'scam') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
            gain.gain.setValueAtTime(0.4, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3); osc.start(); osc.stop(now + 0.3);
        } else if (type === 'tick') {
            osc.type = 'square'; osc.frequency.setValueAtTime(600, now);
            gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05); osc.start(); osc.stop(now + 0.05);
        } else if (type === 'heartbeat') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(60, now);
            gain.gain.setValueAtTime(0.5, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2); osc.start(); osc.stop(now + 0.2);
        } else if (type === 'dead') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(30, now + 1);
            gain.gain.setValueAtTime(0.5, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 1); osc.start(); osc.stop(now + 1);
        }
    }

    // 粒子
    let particles = [];
    function resizeCanvas() {
        canvas.width = gameContainer.clientWidth;
        canvas.height = gameContainer.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 50);

    function spawnParticles(x, y, color, count) {
        for (let i = 0; i < count; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 20,
                vy: (Math.random() - 0.5) * 20,
                life: 1,
                color: color,
                size: Math.random() * 6 + 2
            });
        }
    }

    function drawParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy;
            p.vy += 0.5;
            p.life -= 0.03;
            if (p.life <= 0) { particles.splice(i, 1); continue; }
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
        if (isPlaying) requestAnimationFrame(drawParticles);
    }

    function startGame() {
        document.getElementById('intro-modal').classList.add('hidden');
        document.getElementById('end-modal').classList.add('hidden');
        document.querySelectorAll('.enemy').forEach(e => e.remove());
        
        timeLeft = 10.0;
        interestRate = 1.0;
        maxRateReached = 1.0;
        shieldTimer = 0;
        comboCount = 0;
        comboTimer = 0;
        maxComboReached = 0;
        isPlaying = true;
        lastTime = performance.now();
        particles = [];
        
        updateUI();
        drawParticles();
        speakText("借錢還錢，天經地義！");

        if (reqAnimId) cancelAnimationFrame(reqAnimId);
        reqAnimId = requestAnimationFrame(gameLoop);

        if (spawnTimer) clearInterval(spawnTimer);
        spawnTimer = setInterval(spawnEnemy, 600);

        if (tickTimer) clearInterval(tickTimer);
        tickTimer = setInterval(() => {
            if (isPlaying && (timeLeft < 3 || interestRate > 2.5)) playSound('tick');
        }, 500);
    }

    function spawnEnemy() {
        if (!isPlaying) return;
        
        let rand = Math.random();
        let type = 'normal';
        if (rand < 0.10) type = 'scam'; // 10% 炸彈
        else if (rand < 0.25) type = 'shield'; // 15% 護盾
        else if (interestRate > 2.0) type = 'danger'; // 高息金幣

        let enemy = document.createElement('div');
        enemy.className = 'enemy';
        
        if (type === 'scam') { enemy.classList.add('scam'); enemy.innerText = '💣'; }
        else if (type === 'shield') { enemy.classList.add('shield'); enemy.innerText = '🛡️'; }
        else if (type === 'danger') { enemy.classList.add('danger-loan'); enemy.innerText = '🪙'; }
        else { enemy.innerText = '🪙'; }

        let maxX = gameContainer.clientWidth - 80;
        let maxY = gameContainer.clientHeight - 150;
        let x = 20 + Math.random() * maxX;
        let y = 60 + Math.random() * maxY;

        enemy.style.left = x + 'px';
        enemy.style.top = y + 'px';

        enemy.onmousedown = enemy.ontouchstart = (e) => {
            e.preventDefault();
            if (!isPlaying) return;

            if (type === 'shield') {
                shieldTimer = 5.0;
                playSound('shield');
                spawnParticles(x + 30, y + 30, '#3498db', 20);
                showFloatText('🛡️ 利率鎖定!', x, y, '#3498db');
                speakText("護盾啟動，快啲借錢！");
            } else if (type === 'scam') {
                // 詐騙金幣
                interestRate *= 2;
                if (interestRate > maxRateReached) maxRateReached = interestRate;
                timeLeft -= 3.0; // 額外扣時間
                playSound('scam');
                gameContainer.classList.add('shaking');
                setTimeout(() => gameContainer.classList.remove('shaking'), 300);
                spawnParticles(x + 30, y + 30, '#e74c3c', 30);
                showFloatText('💣 詐騙! 利率翻倍!', x, y, '#e74c3c');
                speakText("你被騙了！利率翻倍！");
            } else {
                // 普通金幣
                let borrowAmt = 3.0;
                timeLeft += borrowAmt;
                
                if (shieldTimer <= 0) {
                    interestRate *= 1.2;
                    if (interestRate > maxRateReached) maxRateReached = interestRate;
                }

                comboCount++;
                comboTimer = 1.5;
                if (comboCount > maxComboReached) maxComboReached = comboCount;

                if (comboCount >= 3) {
                    playSound('combo');
                    timeLeft += 3.0;
                    showFloatText('🔥 COMBO +3s!', x, y - 20, '#e67e22');
                    comboDisplay.innerText = `🔥 COMBO x${comboCount}`;
                    comboDisplay.style.opacity = '1';
                } else {
                    playSound('hit');
                }

                spawnParticles(x + 30, y + 30, '#2ecc71', 15);
                showFloatText(`+${borrowAmt.toFixed(1)}s`, x, y, '#2ecc71');
            }

            enemy.remove();
            updateUI();
        };

        let escapeTime = Math.max(800, 2500 - (interestRate * 300));
        setTimeout(() => { if (enemy.parentNode) enemy.remove(); }, escapeTime);

        gameContainer.appendChild(enemy);
    }

    function showFloatText(text, x, y, color) {
        let floatText = document.createElement('div');
        floatText.innerText = text;
        floatText.style.cssText = `position:absolute; left:${x}px; top:${y}px; color:${color}; font-weight:900; font-size:20px; pointer-events:none; transition:all 0.8s ease-out; z-index:30; text-shadow:0 0 10px ${color};`;
        gameContainer.appendChild(floatText);
        setTimeout(() => { floatText.style.transform = 'translateY(-50px)'; floatText.style.opacity = '0'; }, 10);
        setTimeout(() => floatText.remove(), 800);
    }

    function repayDebt() {
        if (!isPlaying) return;
        if (interestRate <= 1.0) return;
        
        timeLeft = timeLeft / 2;
        interestRate = 1.0;
        
        playSound('shield');
        spawnParticles(gameContainer.clientWidth/2, gameContainer.clientHeight/2, '#f1c40f', 30);
        showFloatText('💳 債務重組！利率重置', gameContainer.clientWidth/2 - 80, gameContainer.clientHeight/2, '#f1c40f');
        speakText("債務重組，利率重置！");
        updateUI();
    }

    function gameLoop(now) {
        if (!isPlaying) return;

        let delta = (now - lastTime) / 1000;
        lastTime = now;

        if (shieldTimer > 0) {
            shieldTimer -= delta;
            if (shieldTimer <= 0) {
                shieldTimer = 0;
                showFloatText('🛡️ 護盾消失', gameContainer.clientWidth/2 - 50, 150, '#a4b0be');
            }
        }

        let currentRate = shieldTimer > 0 ? 1.0 : interestRate;
        timeLeft -= delta * currentRate;

        if (comboTimer > 0) {
            comboTimer -= delta;
            if (comboTimer <= 0) {
                comboCount = 0;
                comboDisplay.style.opacity = '0';
            }
        }

        if (timeLeft <= 0) {
            timeLeft = 0;
            gameOver();
            return;
        }

        updateUI();
        reqAnimId = requestAnimationFrame(gameLoop);
    }

    function updateUI() {
        let currentRate = shieldTimer > 0 ? 1.0 : interestRate;
        let isDangerous = timeLeft < 3.0 || currentRate > 2.5;
        
        timerDisplay.innerText = timeLeft.toFixed(1);
        interestDisplay.innerText = `利率: ${currentRate.toFixed(1)}x ${shieldTimer > 0 ? '(鎖定中)' : ''}`;

        if (isDangerous) {
            timerDisplay.classList.add('danger-text');
            timerDisplay.style.color = '#e74c3c';
            timerDisplay.style.textShadow = '0 0 30px #e74c3c';
            gameContainer.classList.add('shaking');
            bgGrid.style.backgroundImage = 'linear-gradient(#e74c3c 1px, transparent 1px), linear-gradient(90deg, #e74c3c 1px, transparent 1px)';
            
            // 隨機播放心跳聲
            if (currentRate > 3.0 && Math.random() < 0.05) {
                playSound('heartbeat');
                if (Math.random() < 0.1) speakText("快啲還錢呀！");
            }
        } else {
            timerDisplay.classList.remove('danger-text');
            timerDisplay.style.color = '#2ecc71';
            timerDisplay.style.textShadow = '0 0 30px #2ecc71';
            gameContainer.classList.remove('shaking');
            bgGrid.style.backgroundImage = 'linear-gradient(#2ecc71 1px, transparent 1px), linear-gradient(90deg, #2ecc71 1px, transparent 1px)';
        }
    }

    function updateRecordUI() {
        bestRateDisplay.innerText = bestRate.toFixed(1) + 'x';
        bestComboDisplay.innerText = bestCombo;
    }

    function getTitle(rate) {
        if (rate >= 10.0) return "🌌 宇宙大債主";
        if (rate >= 6.0) return "🔥 終極高息奴隸";
        if (rate >= 4.0) return "💸 專業大耳窿";
        if (rate >= 2.5) return "😰 資深卡奴";
        return "🐣 初級債仔";
    }

    function gameOver() {
        isPlaying = false;
        if (reqAnimId) cancelAnimationFrame(reqAnimId);
        if (spawnTimer) clearInterval(spawnTimer);
        if (tickTimer) clearInterval(tickTimer);
        
        playSound('dead');
        gameContainer.classList.remove('shaking');
        document.querySelectorAll('.enemy').forEach(e => e.remove());
        
        if (maxRateReached > bestRate) {
            bestRate = maxRateReached;
            localStorage.setItem('loan_best_rate', bestRate);
        }
        if (maxComboReached > bestCombo) {
            bestCombo = maxComboReached;
            localStorage.setItem('loan_best_combo', bestCombo);
        }
        updateRecordUI();

        let title = getTitle(maxRateReached);
        document.getElementById('title-badge').innerText = title;
        document.getElementById('end-desc').innerHTML = `你最終嘅借貸利率去到 <span style="color:#f1c40f; font-weight:bold;">${maxRateReached.toFixed(1)}x</span><br>最高連擊：<span style="color:#e67e22; font-weight:bold;">${maxComboReached}</span><br><br>時間流逝得太快，你無力償還...`;
        
        speakText("破產收場！你借得太多錢啦！");
        document.getElementById('end-modal').classList.remove('hidden');
    }

    // ==========================================
    // 生成賽博結算海報
    // ==========================================
    function generatePoster() {
        const sc = document.getElementById('shareCanvas');
        const sctx = sc.getContext('2d');
        
        // 背景
        sctx.fillStyle = '#0a0a0a';
        sctx.fillRect(0, 0, sc.width, sc.height);
        
        // 網格
        sctx.strokeStyle = 'rgba(231, 76, 60, 0.2)';
        sctx.lineWidth = 1;
        for(let i=0; i<sc.width; i+=40) { sctx.beginPath(); sctx.moveTo(i, 0); sctx.lineTo(i, sc.height); sctx.stroke(); }
        for(let i=0; i<sc.height; i+=40) { sctx.beginPath(); sctx.moveTo(0, i); sctx.lineTo(sc.width, i); sctx.stroke(); }
        
        // 邊框
        sctx.strokeStyle = '#f1c40f';
        sctx.lineWidth = 4;
        sctx.strokeRect(20, 20, sc.width-40, sc.height-40);
        
        // 標題
        sctx.fillStyle = '#f1c40f';
        sctx.font = 'bold 40px "Orbitron", sans-serif';
        sctx.textAlign = 'center';
        sctx.fillText('💸 時間高利貸', sc.width/2, 100);
        
        // 稱號
        sctx.fillStyle = '#e67e22';
        sctx.font = 'bold 30px "PingFang HK", sans-serif';
        sctx.fillText(getTitle(maxRateReached), sc.width/2, 180);
        
        // 數據
        sctx.fillStyle = '#fff';
        sctx.font = '24px "PingFang HK", sans-serif';
        sctx.fillText(`最終利率：${maxRateReached.toFixed(1)}x`, sc.width/2, 300);
        sctx.fillText(`最高連擊：${maxComboReached} COMBO`, sc.width/2, 350);
        
        // 嘲諷字句
        sctx.fillStyle = '#a4b0be';
        sctx.font = '20px "PingFang HK", sans-serif';
        sctx.fillText('你已經徹底破產，', sc.width/2, 480);
        sctx.fillText('被大耳窿追殺中...', sc.width/2, 520);
        
        // 底部
        sctx.fillStyle = '#2ecc71';
        sctx.font = 'bold 20px "Orbitron", sans-serif';
        sctx.fillText('你能捱到幾耐？', sc.width/2, 650);
        
        // 轉換為圖片
        setTimeout(() => {
            const dataUrl = sc.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = 'TimeLoanShark_Record.png';
            link.href = dataUrl;
            link.click();
            
            // 如果支援分享
            if (navigator.share) {
                sc.toBlob(async (blob) => {
                    const file = new File([blob], 'poster.png', { type: 'image/png' });
                    try {
                        await navigator.share({
                            title: '我的時間高利貸紀錄',
                            text: `我借到 ${maxRateReached.toFixed(1)}x 利率！你嚟試下啦！`,
                            files: [file]
                        });
                    } catch(e) {}
                });
            }
        }, 100);
    }
</script>

<!-- 🟢 Firebase 在線統計 (已加入永久裝置 ID) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
    try {
        const firebaseConfig = { databaseURL: "https://maze-leaderboard-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        // 👇 綁定永久裝置 ID，防止刷新重複計算 👇
        let userId = localStorage.getItem('global_device_id');
        if (!userId) {
            userId = 'user_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('global_device_id', userId);
        }
        
        let pathParts = window.location.pathname.split('/').filter(p => p && p !== 'index.html');
        let gameId = pathParts[pathParts.length - 1] || 'unknown'; 
        const userStatusRef = db.ref('online_status/' + gameId + '/' + userId);
        
        db.ref('.info/connected').on('value', (snap) => {
            if (snap.val() === true) {
                userStatusRef.onDisconnect().remove();
                userStatusRef.set(true);
            }
        });
    } catch(e) { console.error("Firebase Error:", e); }
</script>
