<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🧘‍♂️ 無限減壓艙</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
        
        body {
            background: #05050A;
            color: #fff;
            font-family: 'Nunito', 'PingFang HK', sans-serif;
            height: 100vh; height: 100dvh;
            overflow: hidden;
            display: flex; flex-direction: column; position: relative;
        }

        .top-bar { position: absolute; top: 20px; left: 20px; z-index: 100; }
        .back-btn {
            padding: 10px 20px; background: rgba(255, 255, 255, 0.05);
            color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 30px;
            text-decoration: none; font-weight: bold; font-size: 14px; transition: all 0.3s;
            backdrop-filter: blur(10px); box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .back-btn:active { transform: scale(0.95); background: rgba(255, 255, 255, 0.2); }

        #canvas-container { position: absolute; inset: 0; z-index: 1; }
        canvas { display: block; width: 100%; height: 100%; }

        .controls {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; z-index: 100;
            background: rgba(10, 10, 20, 0.6); padding: 10px 15px; border-radius: 50px;
            backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            flex-wrap: wrap; justify-content: center; max-width: 95vw;
        }
        .control-btn {
            width: 45px; height: 45px; border-radius: 50%; border: none;
            background: rgba(255, 255, 255, 0.05); color: #fff; font-size: 20px;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; align-items: center; justify-content: center;
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.1);
        }
        .control-btn.active {
            background: linear-gradient(135deg, #fff, #a29bfe); color: #000; 
            transform: scale(1.15) translateY(-5px);
            box-shadow: 0 10px 20px rgba(162, 155, 254, 0.6);
        }
        .control-btn:active { transform: scale(0.9); }
        .control-btn.info-btn { background: rgba(162, 155, 254, 0.2); border: 1px solid #a29bfe; }

        #hint-text {
            position: absolute; top: 25px; left: 50%; transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.9); font-size: 15px; z-index: 10;
            pointer-events: none; transition: opacity 0.5s; text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            letter-spacing: 1px; text-align: center;
        }

        .modal-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.8); z-index: 200;
            display: none; align-items: center; justify-content: center; padding: 20px;
            backdrop-filter: blur(8px);
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: linear-gradient(135deg, #1a1a2e, #0f0f1a); border: 2px solid #a29bfe; border-radius: 20px;
            padding: 25px; max-width: 400px; width: 100%; text-align: left;
            box-shadow: 0 0 50px rgba(162, 155, 254, 0.4);
        }
        .modal-box h2 { color: #a29bfe; margin-bottom: 20px; text-align: center; font-size: 24px; }
        .modal-box p { font-size: 14px; line-height: 1.7; margin-bottom: 8px; color: #ddd; }
        .modal-box b { color: #fff; }
        .modal-btn {
            width: 100%; padding: 15px; background: linear-gradient(to right, #a29bfe, #81ecec); color: #000;
            border: none; border-radius: 10px; font-weight: bold; font-size: 18px;
            margin-top: 20px; cursor: pointer; font-family: 'Nunito', sans-serif;
            box-shadow: 0 5px 15px rgba(162, 155, 254, 0.4); transition: 0.2s;
        }
        .modal-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="../" class="back-btn">⬅ 返回大廳</a>
    </div>

    <div id="hint-text">隨意點擊或滑動螢幕放鬆一下</div>

    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div class="controls">
        <button class="control-btn active" id="btn-bubble" onclick="setMode('bubble')" title="氣泡紙">🫧</button>
        <button class="control-btn" id="btn-stardust" onclick="setMode('stardust')" title="星塵引力">🌌</button>
        <button class="control-btn" id="btn-smash" onclick="setMode('smash')" title="破壞發洩">🔨</button>
        <button class="control-btn" id="btn-piano" onclick="setMode('piano')" title="療癒琴鍵">🎹</button>
        <button class="control-btn" id="btn-firework" onclick="setMode('firework')" title="夢幻煙花">🎆</button>
        <button class="control-btn" id="btn-slice" onclick="setMode('slice')" title="療癒切切樂">🍉</button>
        <button class="control-btn" id="btn-cat" onclick="setMode('cat')" title="撸貓模擬器">🐱</button>
        <button class="control-btn info-btn" onclick="document.getElementById('intro-modal').classList.add('active')" title="玩法說明">❓</button>
    </div>

    <div id="intro-modal" class="modal-overlay active">
        <div class="modal-box">
            <h2>🧘‍♂️ 無限減壓艙</h2>
            <p>🫧 <b>氣泡紙</b>：點擊戳破，享受清脆反饋。</p>
            <p>🌌 <b>星塵引力</b>：滑動吸引星塵，編織星座。</p>
            <p>🔨 <b>破壞發洩</b>：用力擊碎畫面，釋放壓力。</p>
            <p>🎹 <b>療癒琴鍵</b>：隨意點擊，彈奏空靈樂章。</p>
            <p>🎆 <b>夢幻煙花</b>：拖曳發射，點亮漆黑夜空。</p>
            <p>🍉 <b>療癒切切樂</b>：生果會飛到高空，滑動切開！</p>
            <p>🐱 <b>撸貓模擬器</b>：摸貓貓、餵魚乾，聽真實貓叫！</p>
            <button class="modal-btn" onclick="document.getElementById('intro-modal').classList.remove('active')">開始放鬆</button>
        </div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hintText = document.getElementById('hint-text');

    let W, H;
    function resize() {
        const rect = canvas.parentElement.getBoundingClientRect();
        W = rect.width; H = rect.height;
        canvas.width = W; canvas.height = H;
    }
    window.addEventListener('resize', () => { resize(); if(mode === 'bubble') initBubbles(); if(mode === 'cat') { cat.x = W/2; cat.y = H/2 + 50; } });
    setTimeout(resize, 50);

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        return { x: clientX - rect.left, y: clientY - rect.top };
    }

    // ==========================================
    // 音效系統 (包含合成貓叫)
    // ==========================================
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const pentatonicScale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00];

    function playSound(type, param) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        let t = audioCtx.currentTime;

        if (type === 'bubble') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(900 + Math.random() * 300, t); osc.frequency.exponentialRampToValueAtTime(1400 + Math.random() * 400, t + 0.04);
            gain.gain.setValueAtTime(0.2, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
            osc.start(); osc.stop(t + 0.04);
        } else if (type === 'stardust') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(400 + Math.random() * 800, t);
            gain.gain.setValueAtTime(0.05, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
            osc.start(); osc.stop(t + 0.3);
        } else if (type === 'smash') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, t); osc.frequency.exponentialRampToValueAtTime(30, t + 0.3);
            gain.gain.setValueAtTime(0.4, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
            osc.start(); osc.stop(t + 0.3);
        } else if (type === 'piano') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(param, t);
            gain.gain.setValueAtTime(0.25, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 2.0);
            osc.start(); osc.stop(t + 2.0);
            const osc2 = audioCtx.createOscillator(); const gain2 = audioCtx.createGain();
            osc2.type = 'triangle'; osc2.frequency.setValueAtTime(param * 2.01, t);
            osc2.connect(gain2); gain2.connect(audioCtx.destination);
            gain2.gain.setValueAtTime(0.1, t); gain2.gain.exponentialRampToValueAtTime(0.001, t + 1.0);
            osc2.start(); osc2.stop(t + 1.0);
        } else if (type === 'firework') {
            osc.type = 'square'; osc.frequency.setValueAtTime(200, t); osc.frequency.exponentialRampToValueAtTime(40, t + 0.6);
            gain.gain.setValueAtTime(0.15, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
            osc.start(); osc.stop(t + 0.6);
        } else if (type === 'slice') {
            const bufferSize = audioCtx.sampleRate * 0.1;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter(); filter.type = 'highpass'; filter.frequency.value = 2000;
            noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
            gain.gain.setValueAtTime(0.2, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
            noise.start(); noise.stop(t + 0.1);
        } else if (type === 'purr') {
            // 呼嚕聲
            osc.type = 'triangle'; osc.frequency.setValueAtTime(30, t); osc.frequency.linearRampToValueAtTime(40, t + 0.5);
            gain.gain.setValueAtTime(0.3, t); gain.gain.linearRampToValueAtTime(0.1, t + 0.5);
            osc.start(); osc.stop(t + 0.5);
        } else if (type === 'meow') {
            // ★ 超逼真合成貓叫聲 (喵~) ★
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();
            
            osc.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.type = 'sawtooth';
            filter.type = 'bandpass';
            filter.Q.value = 5; // 增加共振峰，令聲音更像生物
            
            let now = audioCtx.currentTime;
            
            // 頻率包絡：由低升到高，再跌返低
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(900, now + 0.15);
            osc.frequency.exponentialRampToValueAtTime(500, now + 0.4);
            
            // 濾波器頻率包絡：模擬開合口嘅發聲
            filter.frequency.setValueAtTime(1000, now);
            filter.frequency.exponentialRampToValueAtTime(2500, now + 0.15);
            filter.frequency.exponentialRampToValueAtTime(1000, now + 0.4);
            
            // 音量包絡
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.3, now + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            
            osc.start(now); osc.stop(now + 0.4);
        }
    }

    // ==========================================
    // 核心系統
    // ==========================================
    let mode = 'bubble';
    let particles = [];
    let ripples = [];
    let shockwaves = [];
    let mouse = { x: -1000, y: -1000, px: -1000, py: -1000 };
    let isPointerDown = false;
    let fireworkTrail = [];
    let cracks = [];
    let bubbles = [];
    let flashAlpha = 0;

    let fruits = [];
    let lastFruitTime = 0;
    const fruitTypes = [
        { color: '#ff4757', inner: '#ff6b81' },
        { color: '#2ed573', inner: '#7bed9f' },
        { color: '#ffa502', inner: '#eccc68' }
    ];

    let cat = { 
        x: 0, y: 0, scale: 1, targetScale: 1, 
        isPetting: false, heartTimer: 0, meowTimer: 0, 
        bellyUp: false, mouthOpen: 0, 
        fish: [], 
        bubbleText: "", bubbleTimer: 0
    };

    function initBubbles() {
        bubbles = [];
        const size = 45;
        const cols = Math.ceil(W / size);
        const rows = Math.ceil(H / size);
        for (let i = 0; i < cols; i++) {
            for (let j = 0; j < rows; j++) {
                bubbles.push({ x: i * size + size/2, y: j * size + size/2, r: size * 0.45, popped: false });
            }
        }
    }

    function setMode(newMode) {
        mode = newMode;
        document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active'));
        const btn = document.getElementById('btn-' + newMode);
        if(btn) btn.classList.add('active');
        
        particles = []; cracks = []; ripples = []; shockwaves = []; fireworkTrail = []; fruits = [];
        flashAlpha = 0; cat.isPetting = false;
        
        if (mode === 'bubble') {
            initBubbles();
            hintText.innerText = "點擊戳破氣泡，釋放壓力 🫧";
        } else if (mode === 'stardust') {
            hintText.innerText = "按住拖動，吸引夢幻星塵 🌌";
        } else if (mode === 'smash') {
            hintText.innerText = "用力點擊畫面，擊碎它！🔨";
        } else if (mode === 'piano') {
            hintText.innerText = "隨意點擊或滑動，彈奏療癒樂章 🎹";
        } else if (mode === 'firework') {
            hintText.innerText = "按住拖曳拉出星塵，放手發射煙花！🎆";
        } else if (mode === 'slice') {
            hintText.innerText = "滑動切開生果，聽下清脆嘅切割聲 🍉";
        } else if (mode === 'cat') {
            hintText.innerText = "摸貓貓、餵小魚乾，聽下佢喵喵叫 🐱";
            cat.x = W/2; cat.y = H/2 + 50; 
            cat.fish = [];
            cat.bellyUp = false;
        }
    }

    function handlePointerDown(x, y) {
        isPointerDown = true;
        mouse.x = x; mouse.y = y; mouse.px = x; mouse.py = y;
        
        if (mode === 'bubble') {
            bubbles.forEach(b => {
                if (!b.popped && Math.hypot(b.x - x, b.y - y) < b.r + 20) {
                    b.popped = true;
                    playSound('bubble');
                    for (let i = 0; i < 10; i++) {
                        particles.push({ x: b.x, y: b.y, vx: (Math.random()-0.5)*15, vy: (Math.random()-0.5)*15, life: 1, color: `hsla(${Math.random()*360},80%,80%,0.8)`, size: Math.random()*4+1 });
                    }
                    shockwaves.push({ x: b.x, y: b.y, r: b.r, maxR: b.r * 2, alpha: 1 });
                }
            });
        } else if (mode === 'smash') {
            playSound('smash');
            flashAlpha = 0.5;
            cracks.push({ x: x, y: y, life: 1, lines: Array.from({length: 15}, () => ({ angle: Math.random()*Math.PI*2, length: Math.random()*100+40 })) });
            for(let i=0; i<20; i++){
                particles.push({ x: x, y: y, vx: (Math.random()-0.5)*20, vy: (Math.random()-0.5)*20, life: 1, color: 'rgba(255,255,255,0.8)', size: Math.random()*5+2 });
            }
            canvas.parentElement.style.transform = `translate(${Math.random()*20-10}px, ${Math.random()*20-10}px)`;
            setTimeout(() => { canvas.parentElement.style.transform = 'none'; }, 50);
        } else if (mode === 'piano') {
            triggerPiano(x, y);
        } else if (mode === 'firework') {
            fireworkTrail = [{x: x, y: y}];
        } else if (mode === 'cat') {
            const distToCat = Math.hypot(x - cat.x, y - cat.y);
            if (distToCat < 150) {
                cat.isPetting = true;
                playSound('purr');
                if (Math.random() < 0.3) {
                    playSound('meow');
                    cat.mouthOpen = 10;
                    cat.bubbleText = "喵～";
                    cat.bubbleTimer = 60;
                }
            }
        }
    }

    function handlePointerMove(x, y) {
        mouse.px = mouse.x; mouse.py = mouse.y;
        mouse.x = x; mouse.y = y;
        
        if (mode === 'stardust' && isPointerDown) {
            for (let i = 0; i < 4; i++) {
                particles.push({ x: x+(Math.random()-0.5)*40, y: y+(Math.random()-0.5)*40, vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2, life: 1, color: `hsl(${Math.random()*360}, 90%, 65%)`, size: Math.random()*5+2 });
            }
            if (Math.random() < 0.15) playSound('stardust');
        } else if (mode === 'piano' && isPointerDown) {
            if (Math.random() < 0.2) triggerPiano(x, y);
        } else if (mode === 'firework' && isPointerDown) {
            fireworkTrail.push({x: x, y: y});
            if (fireworkTrail.length > 25) fireworkTrail.shift();
            particles.push({ x: x, y: y, vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2, life: 0.5, color: '#fff', size: Math.random()*2+1 });
        } else if (mode === 'slice' && isPointerDown) {
            checkSlice(mouse.px, mouse.py, x, y);
        } else if (mode === 'cat') {
            const distToCat = Math.hypot(x - cat.x, y - cat.y);
            
            if (distToCat < 100 && y > cat.y + 20) {
                cat.bellyUp = true;
            }

            if (distToCat < 150) {
                if (!cat.isPetting) {
                    cat.isPetting = true;
                    playSound('purr');
                }
                cat.heartTimer++;
                if (cat.heartTimer > 5) {
                    cat.heartTimer = 0;
                    particles.push({
                        x: cat.x + (Math.random()-0.5)*100, y: cat.y - 50 + (Math.random()-0.5)*50,
                        vx: (Math.random()-0.5)*2, vy: -Math.random()*3 - 2,
                        life: 1.5, color: '#ff6b81', size: 15, isHeart: true
                    });
                }
            } else {
                cat.isPetting = false;
                cat.bellyUp = false;
            }

            cat.fish.forEach(f => {
                if (!f.eaten && Math.hypot(x - f.x, y - f.y) < 60) {
                    f.x = x; f.y = y;
                }
            });
        }
    }

    function handlePointerUp() {
        isPointerDown = false;
        if (mode === 'firework' && fireworkTrail.length > 0) {
            const last = fireworkTrail[fireworkTrail.length - 1];
            launchFirework(last.x, last.y);
            fireworkTrail = [];
        }
        if (mode === 'cat') cat.isPetting = false;
    }

    function checkSlice(x1, y1, x2, y2) {
        fruits.forEach(f => {
            if (f.isSliced) return;
            const dist = Math.abs((y2-y1)*f.x - (x2-x1)*f.y + x2*y1 - y2*x1) / Math.hypot(y2-y1, x2-x1);
            if (dist < f.radius && f.x > Math.min(x1,x2)-f.radius && f.x < Math.max(x1,x2)+f.radius) {
                f.isSliced = true;
                playSound('slice');
                for(let i=0; i<15; i++) {
                    particles.push({ x: f.x, y: f.y, vx: (Math.random()-0.5)*15, vy: (Math.random()-0.5)*15, life: 1, color: f.color, size: Math.random()*6+2 });
                }
                f.half1 = { x: f.x, y: f.y, vx: -5, vy: -5, rot: 0 };
                f.half2 = { x: f.x, y: f.y, vx: 5, vy: -5, rot: 0 };
            }
        });
    }

    function triggerPiano(x, y) {
        const note = pentatonicScale[Math.floor(Math.random() * pentatonicScale.length)];
        playSound('piano', note);
        ripples.push({ x: x, y: y, r: 0, maxR: 250, color: `hsl(${Math.random() * 360}, 90%, 70%)` });
        ripples.push({ x: x, y: y, r: 0, maxR: 150, color: `#fff` });
        for(let i=0; i<8; i++){
            particles.push({ x: x+(Math.random()-0.5)*50, y: y, vx: (Math.random()-0.5)*2, vy: -Math.random()*3-1, life: 1.5, color: `hsl(${Math.random()*360}, 80%, 70%)`, size: Math.random()*4+2 });
        }
    }

    function launchFirework(x, y) {
        playSound('firework');
        const numParticles = 100;
        const baseHue = Math.random() * 360;
        for (let i = 0; i < numParticles; i++) {
            const angle = (Math.PI * 2 / numParticles) * i;
            const speed = Math.random() * 12 + 3;
            particles.push({
                x: x, y: y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
                life: 1.5, color: `hsl(${baseHue + (Math.random()*40-20)}, 100%, 65%)`,
                size: Math.random()*4+2, isFirework: true, friction: 0.92
            });
        }
        shockwaves.push({ x: x, y: y, r: 10, maxR: 200, alpha: 1 });
        flashAlpha = 0.3;
    }

    function drawHeart(ctx, x, y, size, color) {
        ctx.save(); ctx.translate(x, y); ctx.scale(size/20, size/20);
        ctx.beginPath(); ctx.moveTo(0, -5);
        ctx.bezierCurveTo(-10, -20, -20, 0, 0, 15);
        ctx.bezierCurveTo(20, 0, 10, -20, 0, -5);
        ctx.fillStyle = color; ctx.fill(); ctx.restore();
    }

    // 事件綁定
    canvas.addEventListener('mousedown', (e) => { const p = getPos(e); handlePointerDown(p.x, p.y); });
    canvas.addEventListener('mousemove', (e) => { const p = getPos(e); handlePointerMove(p.x, p.y); });
    window.addEventListener('mouseup', handlePointerUp);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); const p = getPos(e); handlePointerDown(p.x, p.y); }, { passive: false });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); const p = getPos(e); handlePointerMove(p.x, p.y); }, { passive: false });
    window.addEventListener('touchend', handlePointerUp);

    // ==========================================
    // 繪圖循環
    // ==========================================
    function draw() {
        ctx.clearRect(0, 0, W, H);
        let grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H));
        
        if (mode === 'stardust') { grad.addColorStop(0, '#1a0b2e'); grad.addColorStop(1, '#050510'); }
        else if (mode === 'smash') { grad.addColorStop(0, '#2a0a0a'); grad.addColorStop(1, '#0a0000'); }
        else if (mode === 'piano') { grad.addColorStop(0, '#0b2e2e'); grad.addColorStop(1, '#050a0a'); }
        else if (mode === 'firework') { grad.addColorStop(0, '#0a0a2e'); grad.addColorStop(1, '#000000'); }
        else if (mode === 'slice') { grad.addColorStop(0, '#1e2a1a'); grad.addColorStop(1, '#05100a'); }
        else if (mode === 'cat') { grad.addColorStop(0, '#1a1a2e'); grad.addColorStop(1, '#0a0a1a'); }
        else { grad.addColorStop(0, '#1e1e2f'); grad.addColorStop(1, '#0a0a10'); }
        
        ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);

        if (flashAlpha > 0) {
            ctx.fillStyle = mode === 'smash' ? `rgba(255, 50, 50, ${flashAlpha})` : `rgba(255, 255, 255, ${flashAlpha})`;
            ctx.fillRect(0, 0, W, H);
            flashAlpha -= 0.05; if(flashAlpha < 0) flashAlpha = 0;
        }

        // 1. 氣泡紙
        if (mode === 'bubble') {
            bubbles.forEach(b => {
                if (!b.popped) {
                    let bGrad = ctx.createRadialGradient(b.x - b.r*0.3, b.y - b.r*0.3, b.r*0.1, b.x, b.y, b.r);
                    bGrad.addColorStop(0, 'rgba(255,255,255,0.4)'); bGrad.addColorStop(0.8, 'rgba(255,255,255,0.05)'); bGrad.addColorStop(1, 'rgba(255,255,255,0.2)');
                    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fillStyle = bGrad; ctx.fill();
                    ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)'; ctx.stroke();
                    ctx.beginPath(); ctx.arc(b.x - b.r*0.35, b.y - b.r*0.35, b.r*0.15, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
                }
            });
        }

        // 2. 星塵引力
        if (mode === 'stardust') {
            ctx.globalCompositeOperation = 'lighter';
            ctx.lineWidth = 1.5;
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const p1 = particles[i], p2 = particles[j];
                    const dist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
                    if (dist < 100) {
                        ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `hsla(${(p1.x + p2.x) % 360}, 80%, 60%, ${0.6 * (1 - dist/100)})`; ctx.stroke();
                    }
                }
            }
            ctx.globalCompositeOperation = 'source-over';
        }

        // 3. 破壞發洩
        if (mode === 'smash') {
            cracks.forEach(crack => {
                ctx.strokeStyle = `rgba(255, 50, 50, ${crack.life * 0.6})`; ctx.lineWidth = 6;
                crack.lines.forEach(line => {
                    ctx.beginPath(); ctx.moveTo(crack.x, crack.y);
                    ctx.lineTo(crack.x + Math.cos(line.angle)*line.length, crack.y + Math.sin(line.angle)*line.length); ctx.stroke();
                });
                ctx.strokeStyle = `rgba(255, 255, 255, ${crack.life})`; ctx.lineWidth = 2;
                crack.lines.forEach(line => {
                    ctx.beginPath(); ctx.moveTo(crack.x, crack.y);
                    const endX = crack.x + Math.cos(line.angle)*line.length;
                    const endY = crack.y + Math.sin(line.angle)*line.length;
                    ctx.lineTo(endX, endY); ctx.lineTo(endX + (Math.random()-0.5)*20, endY + (Math.random()-0.5)*20); ctx.stroke();
                });
                crack.life -= 0.015;
            });
            cracks = cracks.filter(c => c.life > 0);
        }

        // 4. 切切樂
        if (mode === 'slice') {
            if (Date.now() - lastFruitTime > 800 && fruits.filter(f => !f.isSliced).length < 5) {
                lastFruitTime = Date.now();
                const type = fruitTypes[Math.floor(Math.random() * fruitTypes.length)];
                fruits.push({
                    x: Math.random() * W * 0.6 + W * 0.2, y: H + 50,
                    vx: (Math.random() - 0.5) * 4, vy: -Math.random() * 8 - 22,
                    radius: Math.random() * 15 + 30, color: type.color, inner: type.inner,
                    isSliced: false, rot: Math.random() * Math.PI
                });
            }
            fruits.forEach(f => {
                if (!f.isSliced) {
                    f.x += f.vx; f.y += f.vy; f.vy += 0.25; f.rot += 0.05;
                    ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot);
                    ctx.beginPath(); ctx.arc(0, 0, f.radius, 0, Math.PI*2);
                    ctx.fillStyle = f.color; ctx.fill();
                    ctx.beginPath(); ctx.arc(-f.radius*0.2, -f.radius*0.2, f.radius*0.6, 0, Math.PI*2);
                    ctx.fillStyle = f.inner; ctx.fill();
                    ctx.restore();
                } else {
                    if (f.half1 && f.half1.y < H + 100) {
                        f.half1.x += f.half1.vx; f.half1.y += f.half1.vy; f.half1.vy += 0.3; f.half1.rot += 0.1;
                        ctx.save(); ctx.translate(f.half1.x, f.half1.y); ctx.rotate(f.half1.rot);
                        ctx.beginPath(); ctx.arc(0, 0, f.radius, Math.PI, 0); ctx.fillStyle = f.inner; ctx.fill(); ctx.restore();
                    }
                    if (f.half2 && f.half2.y < H + 100) {
                        f.half2.x += f.half2.vx; f.half2.y += f.half2.vy; f.half2.vy += 0.3; f.half2.rot -= 0.1;
                        ctx.save(); ctx.translate(f.half2.x, f.half2.y); ctx.rotate(f.half2.rot);
                        ctx.beginPath(); ctx.arc(0, 0, f.radius, 0, Math.PI); ctx.fillStyle = f.inner; ctx.fill(); ctx.restore();
                    }
                }
            });
            fruits = fruits.filter(f => !f.isSliced || (f.half1.y < H + 100 || f.half2.y < H + 100));
        }

        // 5. 撸貓
        if (mode === 'cat') {
            if (Math.random() < 0.01 && cat.fish.length < 3) {
                cat.fish.push({ x: Math.random()*W, y: -50, vx: 0, vy: 2, eaten: false });
            }

            cat.fish.forEach(f => {
                if (f.eaten) return;
                f.y += f.vy;
                if (Math.hypot(f.x - cat.x, f.y - (cat.y - 20)) < 50) {
                    f.eaten = true;
                    playSound('meow');
                    cat.bubbleText = "喵！好味！";
                    cat.bubbleTimer = 60;
                    cat.mouthOpen = 15;
                    for (let i=0; i<20; i++) {
                        particles.push({ x: cat.x, y: cat.y - 20, vx: (Math.random()-0.5)*10, vy: -Math.random()*8, life: 1.5, color: '#ffd700', size: Math.random()*6+2, isHeart: false });
                    }
                }
                if (!f.eaten) {
                    ctx.save(); ctx.translate(f.x, f.y);
                    ctx.fillStyle = '#8e44ad'; 
                    ctx.beginPath(); ctx.ellipse(0, 0, 20, 10, 0, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.moveTo(20, 0); ctx.lineTo(35, -10); ctx.lineTo(35, 10); ctx.closePath(); ctx.fill();
                    ctx.restore();
                }
            });

            cat.scale += (cat.targetScale - cat.scale) * 0.1;
            let breathe = 1 + Math.sin(Date.now() / 400) * 0.03;
            if (cat.isPetting) breathe += 0.05;

            ctx.save();
            ctx.translate(cat.x, cat.y);
            ctx.scale(cat.scale * breathe, cat.scale * breathe);

            if (cat.bellyUp) ctx.scale(1, -1);

            // 貓身
            ctx.beginPath(); ctx.ellipse(0, 30, 100, 70, 0, 0, Math.PI*2);
            ctx.fillStyle = '#f1c40f'; ctx.fill();
            ctx.lineWidth = 4; ctx.strokeStyle = '#d4ac0d'; ctx.stroke();

            // 貓頭
            ctx.beginPath(); ctx.arc(0, -40, 80, 0, Math.PI*2);
            ctx.fillStyle = '#f1c40f'; ctx.fill(); ctx.stroke();

            // 耳仔
            ctx.beginPath(); ctx.moveTo(-60, -100); ctx.lineTo(-80, -150); ctx.lineTo(-30, -110); ctx.fillStyle = '#f1c40f'; ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(60, -100); ctx.lineTo(80, -150); ctx.lineTo(30, -110); ctx.fill(); ctx.stroke();

            // 眼睛
            if (cat.isPetting && !cat.bellyUp) {
                ctx.beginPath(); ctx.arc(-30, -50, 10, 0, Math.PI); ctx.lineWidth = 5; ctx.strokeStyle = '#333'; ctx.stroke();
                ctx.beginPath(); ctx.arc(30, -50, 10, 0, Math.PI); ctx.stroke();
            } else {
                ctx.beginPath(); ctx.arc(-30, -50, 15, 0, Math.PI*2); ctx.fillStyle = '#333'; ctx.fill();
                ctx.beginPath(); ctx.arc(30, -50, 15, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(-35, -55, 5, 0, Math.PI*2); ctx.fillStyle = '#fff'; ctx.fill();
                ctx.beginPath(); ctx.arc(25, -55, 5, 0, Math.PI*2); ctx.fill();
            }

            // 鼻同嘴
            ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(-10, -10); ctx.lineTo(10, -10); ctx.closePath();
            ctx.fillStyle = '#e74c3c'; ctx.fill();
            
            if (cat.mouthOpen > 0) {
                ctx.beginPath(); ctx.arc(0, -5, 15, 0, Math.PI); ctx.fillStyle = '#ff6b81'; ctx.fill();
                cat.mouthOpen--;
            } else {
                ctx.beginPath(); ctx.arc(-10, -5, 10, 0, Math.PI); ctx.lineWidth = 3; ctx.strokeStyle = '#333'; ctx.stroke();
                ctx.beginPath(); ctx.arc(10, -5, 10, 0, Math.PI); ctx.stroke();
            }

            // 鬚
            ctx.beginPath(); ctx.moveTo(-40, -20); ctx.lineTo(-90, -30); ctx.moveTo(-40, -10); ctx.lineTo(-90, -5); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(40, -20); ctx.lineTo(90, -30); ctx.moveTo(40, -10); ctx.lineTo(90, -5); ctx.stroke();

            // 尾巴
            ctx.beginPath(); ctx.moveTo(80, 50); ctx.quadraticCurveTo(150, 50, 130, -20);
            ctx.lineWidth = 15; ctx.strokeStyle = '#f1c40f'; ctx.lineCap = 'round'; ctx.stroke();
            ctx.lineWidth = 4; ctx.strokeStyle = '#d4ac0d'; ctx.stroke();

            ctx.restore();

            // 對話框
            if (cat.bubbleTimer > 0) {
                ctx.save();
                ctx.translate(cat.x, cat.y - 150);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.beginPath(); ctx.roundRect(-45, -20, 90, 40, 10); ctx.fill();
                ctx.beginPath(); ctx.moveTo(-10, 20); ctx.lineTo(0, 35); ctx.lineTo(10, 20); ctx.fill();
                
                ctx.fillStyle = '#333';
                ctx.font = 'bold 16px "Nunito", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(cat.bubbleText, 0, 5);
                ctx.restore();
                cat.bubbleTimer--;
            }
        }

        // 6. 衝擊波 / 水波紋
        ctx.globalCompositeOperation = 'lighter';
        for (let i = shockwaves.length - 1; i >= 0; i--) {
            let s = shockwaves[i];
            ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(255, 255, 255, ${s.alpha})`; ctx.lineWidth = 3; ctx.stroke();
            s.r += 10; s.alpha -= 0.05;
            if (s.alpha <= 0) shockwaves.splice(i, 1);
        }
        for (let i = ripples.length - 1; i >= 0; i--) {
            let r = ripples[i];
            ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
            ctx.strokeStyle = r.color; ctx.lineWidth = 3; ctx.globalAlpha = 1 - (r.r / r.maxR); ctx.stroke();
            r.r += 12; if (r.r >= r.maxR) ripples.splice(i, 1);
        }
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';

        // 7. 煙花拖尾
        if (mode === 'firework' && fireworkTrail.length > 0) {
            ctx.beginPath();
            ctx.moveTo(fireworkTrail[0].x, fireworkTrail[0].y);
            for (let i = 1; i < fireworkTrail.length; i++) ctx.lineTo(fireworkTrail[i].x, fireworkTrail[i].y);
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            ctx.shadowBlur = 20; ctx.shadowColor = '#a29bfe'; ctx.stroke();
            ctx.shadowBlur = 0;
        }

        // 8. 粒子系統
        ctx.globalCompositeOperation = 'lighter';
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            
            if (mode === 'stardust') {
                const dist = Math.hypot(mouse.x - p.x, mouse.y - p.y);
                if (dist > 0 && isPointerDown) {
                    const force = Math.max(0, 150 - dist) / 150;
                    p.vx += (mouse.x - p.x) / dist * force * 1.5; p.vy += (mouse.y - p.y) / dist * force * 1.5;
                }
                p.vx *= 0.95; p.vy *= 0.95;
            } else if (p.isFirework) {
                p.vx *= p.friction; p.vy *= p.friction; p.vy += 0.12; p.life -= 0.02;
            } else if (p.isHeart) {
                p.vy -= 0.05; p.life -= 0.015;
            } else {
                p.vy += 0.08; p.life -= 0.02;
            }

            p.x += p.vx; p.y += p.vy;

            if (p.life <= 0) { particles.splice(i, 1); continue; }

            if (p.isHeart) {
                drawHeart(ctx, p.x, p.y, p.size * p.life, p.color);
            } else {
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size * Math.max(0, p.life), 0, Math.PI * 2);
                ctx.fillStyle = p.color; ctx.fill();
            }
        }
        ctx.globalCompositeOperation = 'source-over';

        if (mode === 'bubble' && bubbles.length > 0 && bubbles.every(b => b.popped)) {
            setTimeout(initBubbles, 1000);
        }

        requestAnimationFrame(draw);
    }

    resize();
    initBubbles();
    draw();
</script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
    try {
        const firebaseConfig = { databaseURL: "https://maze-leaderboard-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        // 👇 綁定永久裝置 ID，防止刷新重複計算 👇
        let userId = localStorage.getItem('global_device_id');
        if (!userId) {
            userId = 'user_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('global_device_id', userId);
        }
        
        let pathParts = window.location.pathname.split('/').filter(p => p && p !== 'index.html');
        let gameId = pathParts[pathParts.length - 1] || 'unknown'; 
        const userStatusRef = db.ref('online_status/' + gameId + '/' + userId);
        
        db.ref('.info/connected').on('value', (snap) => {
            if (snap.val() === true) {
                userStatusRef.onDisconnect().remove();
                userStatusRef.set(true);
            }
        });
    } catch(e) { console.error("Firebase Error:", e); }
</script>
