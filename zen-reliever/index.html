<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🧘‍♂️ 無限減壓艙</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
        
        body {
            background: #0f111a;
            color: #fff;
            font-family: 'Nunito', 'PingFang HK', sans-serif;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 頂部返回 */
        .top-bar {
            position: absolute; top: 15px; left: 15px; z-index: 100;
        }
        .back-btn {
            padding: 8px 16px; background: rgba(255, 255, 255, 0.15);
            color: #fff; border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 20px;
            text-decoration: none; font-weight: bold; font-size: 14px; transition: all 0.3s;
            backdrop-filter: blur(10px);
        }
        .back-btn:active { transform: scale(0.95); background: rgba(255, 255, 255, 0.3); }

        /* 畫布 */
        #canvas-container { position: absolute; inset: 0; z-index: 1; }
        canvas { display: block; width: 100%; height: 100%; }

        /* 底部控制欄 */
        .controls {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; z-index: 100;
            background: rgba(0, 0, 0, 0.6); padding: 10px 15px; border-radius: 40px;
            backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.15);
            flex-wrap: wrap; justify-content: center;
        }
        .control-btn {
            width: 45px; height: 45px; border-radius: 50%; border: none;
            background: rgba(255, 255, 255, 0.1); color: #fff; font-size: 20px;
            cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center;
        }
        .control-btn.active {
            background: #fff; color: #0f111a; transform: scale(1.15);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
        }
        .control-btn:active { transform: scale(0.9); }
        .control-btn.info-btn { background: rgba(162, 155, 254, 0.3); border: 1px solid #a29bfe; }

        /* 提示文字 */
        #hint-text {
            position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.8); font-size: 14px; z-index: 10;
            pointer-events: none; transition: opacity 0.5s; text-shadow: 0 2px 4px #000;
        }

        /* 玩法彈窗 */
        .modal-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.85); z-index: 200;
            display: none; align-items: center; justify-content: center; padding: 20px;
            backdrop-filter: blur(5px);
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: #1a1a2e; border: 2px solid #a29bfe; border-radius: 15px;
            padding: 20px; max-width: 400px; width: 100%; text-align: left;
            box-shadow: 0 0 30px rgba(162, 155, 254, 0.5);
        }
        .modal-box h2 { color: #a29bfe; margin-bottom: 15px; text-align: center; font-size: 22px; }
        .modal-box p { font-size: 14px; line-height: 1.6; margin-bottom: 10px; color: #e0e0e0; }
        .modal-box b { color: #fff; }
        .modal-btn {
            width: 100%; padding: 12px; background: #a29bfe; color: #000;
            border: none; border-radius: 8px; font-weight: bold; font-size: 16px;
            margin-top: 10px; cursor: pointer; font-family: 'Nunito', sans-serif;
        }
        .modal-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="../" class="back-btn">⬅ 返回大廳</a>
    </div>

    <div id="hint-text">隨意點擊或滑動螢幕放鬆一下</div>

    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div class="controls">
        <button class="control-btn active" id="btn-bubble" onclick="setMode('bubble')" title="氣泡紙">🫧</button>
        <button class="control-btn" id="btn-stardust" onclick="setMode('stardust')" title="星塵引力">🌌</button>
        <button class="control-btn" id="btn-smash" onclick="setMode('smash')" title="破壞發洩">🔨</button>
        <button class="control-btn" id="btn-piano" onclick="setMode('piano')" title="療癒琴鍵">🎹</button>
        <button class="control-btn" id="btn-firework" onclick="setMode('firework')" title="夢幻煙花">🎆</button>
        <button class="control-btn info-btn" onclick="document.getElementById('intro-modal').classList.add('active')" title="玩法說明">❓</button>
    </div>

    <div id="intro-modal" class="modal-overlay active">
        <div class="modal-box">
            <h2>🧘‍♂️ 無限減壓艙 - 玩法</h2>
            <p>🫧 <b>氣泡紙</b>：點擊或滑動螢幕，戳破所有氣泡。</p>
            <p>🌌 <b>星塵引力</b>：滑動手指，吸引並融合發光星塵。</p>
            <p>🔨 <b>破壞發洩</b>：用力點擊畫面，擊碎螢幕並震動。</p>
            <p>🎹 <b>療癒琴鍵</b>：隨意點擊/滑動，彈奏和諧的五聲音階。</p>
            <p>🎆 <b>夢幻煙花</b>：按住拖曳拉出星塵，放手發射絢麗煙花。</p>
            <button class="modal-btn" onclick="document.getElementById('intro-modal').classList.remove('active')">開始放鬆</button>
        </div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hintText = document.getElementById('hint-text');

    let W, H;
    function resize() {
        const rect = canvas.parentElement.getBoundingClientRect();
        W = rect.width;
        H = rect.height;
        canvas.width = W;
        canvas.height = H;
    }
    window.addEventListener('resize', () => { resize(); if(mode === 'bubble') initBubbles(); });
    setTimeout(resize, 100); // 延遲少少確保佈局完成

    // 獲取點擊的真實座標 (修復偏移問題)
    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        return {
            x: clientX - rect.left,
            y: clientY - rect.top
        };
    }

    // ==========================================
    // 音效系統
    // ==========================================
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const pentatonicScale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00];

    function playSound(type, param) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        let t = audioCtx.currentTime;

        if (type === 'bubble') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800 + Math.random() * 400, t);
            osc.frequency.exponentialRampToValueAtTime(1200 + Math.random() * 500, t + 0.05);
            gain.gain.setValueAtTime(0.3, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.05);
            osc.start(); osc.stop(t + 0.05);
        } else if (type === 'stardust') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400 + Math.random() * 600, t);
            gain.gain.setValueAtTime(0.1, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
            osc.start(); osc.stop(t + 0.2);
        } else if (type === 'smash') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, t);
            osc.frequency.exponentialRampToValueAtTime(30, t + 0.2);
            gain.gain.setValueAtTime(0.3, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
            osc.start(); osc.stop(t + 0.2);
        } else if (type === 'piano') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(param, t);
            gain.gain.setValueAtTime(0.3, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 1.5);
            osc.start(); osc.stop(t + 1.5);
            
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'triangle';
            osc2.frequency.setValueAtTime(param * 2, t);
            osc2.connect(gain2); gain2.connect(audioCtx.destination);
            gain2.gain.setValueAtTime(0.1, t);
            gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
            osc2.start(); osc2.stop(t + 0.8);
        } else if (type === 'firework') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, t);
            osc.frequency.exponentialRampToValueAtTime(50, t + 0.5);
            gain.gain.setValueAtTime(0.1, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.5);
            osc.start(); osc.stop(t + 0.5);
        }
    }

    // ==========================================
    // 核心變數
    // ==========================================
    let mode = 'bubble';
    let particles = [];
    let ripples = [];
    let mouse = { x: -1000, y: -1000 };
    let isPointerDown = false;
    let fireworkTrail = [];
    let cracks = [];
    let bubbles = [];

    // ==========================================
    // 初始化氣泡
    // ==========================================
    function initBubbles() {
        bubbles = [];
        const size = 40; // 加大少少
        const cols = Math.ceil(W / size);
        const rows = Math.ceil(H / size);
        for (let i = 0; i < cols; i++) {
            for (let j = 0; j < rows; j++) {
                bubbles.push({
                    x: i * size + size/2,
                    y: j * size + size/2,
                    r: size * 0.45,
                    popped: false
                });
            }
        }
    }

    function setMode(newMode) {
        mode = newMode;
        document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active'));
        const btn = document.getElementById('btn-' + newMode);
        if(btn) btn.classList.add('active');
        
        particles = [];
        cracks = [];
        ripples = [];
        fireworkTrail = [];
        
        if (mode === 'bubble') {
            initBubbles();
            hintText.innerText = "點擊戳破氣泡，釋放壓力 🫧";
        } else if (mode === 'stardust') {
            hintText.innerText = "滑動手指，吸引夢幻星塵 🌌";
        } else if (mode === 'smash') {
            hintText.innerText = "用力點擊畫面，擊碎它！🔨";
        } else if (mode === 'piano') {
            hintText.innerText = "隨意點擊或滑動，彈奏療癒樂章 🎹";
        } else if (mode === 'firework') {
            hintText.innerText = "滑動拉出星塵，放手發射煙花！🎆";
        }
    }

    function handlePointerDown(x, y) {
        isPointerDown = true;
        mouse.x = x; mouse.y = y;
        
        if (mode === 'bubble') {
            bubbles.forEach(b => {
                if (!b.popped && Math.hypot(b.x - x, b.y - y) < b.r + 20) {
                    b.popped = true;
                    playSound('bubble');
                    for (let i = 0; i < 10; i++) {
                        particles.push({
                            x: b.x, y: b.y,
                            vx: (Math.random() - 0.5) * 10,
                            vy: (Math.random() - 0.5) * 10,
                            life: 1, color: 'rgba(255,255,255,0.9)', size: Math.random()*4+2
                        });
                    }
                }
            });
        } else if (mode === 'smash') {
            playSound('smash');
            cracks.push({
                x: x, y: y, life: 1,
                lines: Array.from({length: 12}, () => ({
                    angle: Math.random() * Math.PI * 2,
                    length: Math.random() * 80 + 30
                }))
            });
            canvas.parentElement.style.transform = `translate(${Math.random()*15-7.5}px, ${Math.random()*15-7.5}px)`;
            setTimeout(() => { canvas.parentElement.style.transform = 'none'; }, 50);
        } else if (mode === 'piano') {
            triggerPiano(x, y);
        } else if (mode === 'firework') {
            fireworkTrail = [{x: x, y: y}];
        }
    }

    function handlePointerMove(x, y) {
        mouse.x = x; mouse.y = y;
        
        if (mode === 'stardust' && isPointerDown) {
            for (let i = 0; i < 3; i++) {
                particles.push({
                    x: x + (Math.random() - 0.5) * 30,
                    y: y + (Math.random() - 0.5) * 30,
                    vx: (Math.random() - 0.5) * 2,
                    vy: (Math.random() - 0.5) * 2,
                    life: 1, 
                    color: `hsl(${Math.random() * 360}, 90%, 70%)`,
                    size: Math.random() * 8 + 3
                });
            }
            if (Math.random() < 0.1) playSound('stardust');
        } else if (mode === 'piano' && isPointerDown) {
            if (Math.random() < 0.2) triggerPiano(x, y);
        } else if (mode === 'firework' && isPointerDown) {
            fireworkTrail.push({x: x, y: y});
            if (fireworkTrail.length > 30) fireworkTrail.shift();
        }
    }

    function handlePointerUp() {
        isPointerDown = false;
        if (mode === 'firework' && fireworkTrail.length > 0) {
            const last = fireworkTrail[fireworkTrail.length - 1];
            launchFirework(last.x, last.y);
            fireworkTrail = [];
        }
    }

    function triggerPiano(x, y) {
        const note = pentatonicScale[Math.floor(Math.random() * pentatonicScale.length)];
        playSound('piano', note);
        ripples.push({
            x: x, y: y, r: 0, maxR: 200,
            color: `hsl(${Math.random() * 360}, 80%, 70%)`
        });
        // 加點光點
        for(let i=0; i<5; i++){
            particles.push({
                x: x, y: y, vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4 - 2,
                life: 1, color: '#fff', size: Math.random()*3+1
            });
        }
    }

    function launchFirework(x, y) {
        playSound('firework');
        const numParticles = 80;
        const baseHue = Math.random() * 360;
        
        for (let i = 0; i < numParticles; i++) {
            const angle = (Math.PI * 2 / numParticles) * i;
            const speed = Math.random() * 10 + 3;
            particles.push({
                x: x, y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 1.5, // 壽命長啲
                color: `hsl(${baseHue + (Math.random()*60-30)}, 90%, 70%)`,
                size: Math.random() * 5 + 2,
                isFirework: true,
                friction: 0.93
            });
        }
        ripples.push({ x: x, y: y, r: 0, maxR: 150, color: '#fff' });
    }

    // 事件綁定 (統一使用 getPos)
    canvas.addEventListener('mousedown', (e) => { const p = getPos(e); handlePointerDown(p.x, p.y); });
    canvas.addEventListener('mousemove', (e) => { const p = getPos(e); handlePointerMove(p.x, p.y); });
    window.addEventListener('mouseup', handlePointerUp);

    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const p = getPos(e);
        handlePointerDown(p.x, p.y);
    }, { passive: false });
    
    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const p = getPos(e);
        handlePointerMove(p.x, p.y);
    }, { passive: false });
    
    window.addEventListener('touchend', handlePointerUp);

    // ==========================================
    // 繪圖循環 (大幅提升視覺效果)
    // ==========================================
    function draw() {
        ctx.clearRect(0, 0, W, H);

        // 背景漸變 (調亮)
        let grad = ctx.createLinearGradient(0, 0, W, H);
        if (mode === 'stardust') {
            grad.addColorStop(0, '#1a0b2e'); grad.addColorStop(1, '#0a0a1a');
        } else if (mode === 'smash') {
            grad.addColorStop(0, '#2a0a0a'); grad.addColorStop(1, '#110000');
        } else if (mode === 'piano') {
            grad.addColorStop(0, '#0b2e2e'); grad.addColorStop(1, '#0a1a1a');
        } else if (mode === 'firework') {
            grad.addColorStop(0, '#0a0a2e'); grad.addColorStop(1, '#000000');
        } else {
            grad.addColorStop(0, '#1e1e2f'); grad.addColorStop(1, '#0f111a');
        }
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        // 1. 氣泡紙
        if (mode === 'bubble') {
            bubbles.forEach(b => {
                if (!b.popped) {
                    // 泡泡底
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                    ctx.stroke();
                    // 高光
                    ctx.beginPath();
                    ctx.arc(b.x - b.r*0.3, b.y - b.r*0.3, b.r*0.2, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                    ctx.fill();
                } else {
                    // 爆開的痕跡
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.r * 0.8, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                    ctx.fill();
                }
            });
        }

        // 2. 星塵引力 (連線)
        if (mode === 'stardust') {
            ctx.lineWidth = 1;
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const p1 = particles[i];
                    const p2 = particles[j];
                    const dist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
                    if (dist < 80) {
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `rgba(162, 155, 254, ${0.5 * (1 - dist/80)})`;
                        ctx.stroke();
                    }
                }
            }
        }

        // 3. 破壞發洩 (裂痕)
        if (mode === 'smash') {
            cracks.forEach(crack => {
                ctx.strokeStyle = `rgba(255, 100, 100, ${crack.life})`;
                ctx.lineWidth = 3;
                crack.lines.forEach(line => {
                    ctx.beginPath();
                    ctx.moveTo(crack.x, crack.y);
                    const endX = crack.x + Math.cos(line.angle) * line.length;
                    const endY = crack.y + Math.sin(line.angle) * line.length;
                    ctx.lineTo(endX, endY);
                    // 分支
                    ctx.lineTo(endX + (Math.random()-0.5)*30, endY + (Math.random()-0.5)*30);
                    ctx.stroke();
                });
                crack.life -= 0.02;
            });
            cracks = cracks.filter(c => c.life > 0);
        }

        // 4. 琴鍵/煙花 水波紋
        if (mode === 'piano' || mode === 'firework') {
            for (let i = ripples.length - 1; i >= 0; i--) {
                let r = ripples[i];
                ctx.beginPath();
                ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
                ctx.strokeStyle = r.color;
                ctx.lineWidth = 3;
                ctx.globalAlpha = 1 - (r.r / r.maxR);
                ctx.stroke();
                ctx.globalAlpha = 1;
                r.r += 8;
                if (r.r >= r.maxR) ripples.splice(i, 1);
            }
        }

        // 5. 煙花拖尾
        if (mode === 'firework' && fireworkTrail.length > 0) {
            ctx.beginPath();
            ctx.moveTo(fireworkTrail[0].x, fireworkTrail[0].y);
            for (let i = 1; i < fireworkTrail.length; i++) {
                ctx.lineTo(fireworkTrail[i].x, fireworkTrail[i].y);
            }
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#a29bfe';
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        // 6. 粒子更新與繪製
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            
            if (mode === 'stardust') {
                const dist = Math.hypot(mouse.x - p.x, mouse.y - p.y);
                if (dist > 0 && isPointerDown) {
                    const force = Math.max(0, 120 - dist) / 120;
                    p.vx += (mouse.x - p.x) / dist * force * 0.8;
                    p.vy += (mouse.y - p.y) / dist * force * 0.8;
                }
                p.vx *= 0.95; p.vy *= 0.95;
            } else if (p.isFirework) {
                p.vx *= p.friction; p.vy *= p.friction;
                p.vy += 0.1; // 重力
                p.life -= 0.02;
            } else {
                p.vy += 0.15; p.life -= 0.03;
            }

            p.x += p.vx; p.y += p.vy;

            if (p.life <= 0) { particles.splice(i, 1); continue; }

            ctx.beginPath();
            ctx.shadowBlur = 15;
            ctx.shadowColor = p.color;
            ctx.arc(p.x, p.y, p.size * Math.max(0, p.life), 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        if (mode === 'bubble' && bubbles.length > 0 && bubbles.every(b => b.popped)) {
            setTimeout(initBubbles, 1500);
        }

        requestAnimationFrame(draw);
    }

    // 啟動
    resize();
    initBubbles();
    draw();
</script>
</body>
</html>
